<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080908">
  <meta name="description" content="All Eyes On Me, Solstice 2026 lyric and melody-contour slides.">
  <title>All Eyes On Me - Solstice 2026</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: #080908;
      color: #f4f4f0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button { font: inherit; }
    .viewer {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      outline: 0;
      user-select: none;
      touch-action: pan-y;
    }
    .slide {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: #fbfbfd;
      opacity: 1;
      transition: opacity 90ms linear;
      -webkit-user-drag: none;
    }
    .slide.loading { opacity: 0.28; }
    .controls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 150ms ease;
    }
    body.controls-visible .controls,
    .controls:focus-within { opacity: 1; }
    .nav, .fullscreen {
      position: absolute;
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 6px;
      background: rgba(8, 9, 8, 0.72);
      color: #fff;
      line-height: 1;
      cursor: pointer;
      pointer-events: auto;
      backdrop-filter: blur(6px);
    }
    .nav {
      top: 50%;
      transform: translateY(-50%);
      font-size: 42px;
      padding-bottom: 6px;
    }
    .nav.previous { left: max(14px, env(safe-area-inset-left)); }
    .nav.next { right: max(14px, env(safe-area-inset-right)); }
    .fullscreen {
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      font-size: 26px;
    }
    .nav:disabled { display: none; }
    .counter {
      position: absolute;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      min-width: 62px;
      padding: 7px 10px;
      transform: translateX(-50%);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 6px;
      background: rgba(8, 9, 8, 0.72);
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }
    .progress {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }
    .progress-fill {
      width: 0;
      height: 100%;
      background: #2563eb;
      transition: width 120ms ease;
    }
    .error {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      background: #fbfbfd;
      color: #111827;
      font-size: 22px;
      text-align: center;
    }
    .error.visible { display: grid; }
    @media (max-width: 640px) {
      .nav { width: 44px; height: 58px; font-size: 36px; }
      .fullscreen { width: 44px; height: 44px; font-size: 22px; }
      .counter { bottom: max(10px, env(safe-area-inset-bottom)); }
    }
    @media (hover: none) {
      .controls { opacity: 1; }
      .nav { background: rgba(8, 9, 8, 0.52); }
    }
    @media (prefers-reduced-motion: reduce) {
      .slide, .controls, .progress-fill { transition: none; }
    }
    @media print {
      .controls { display: none; }
      .viewer { position: static; width: 100vw; height: 100vh; }
    }
  </style>
</head>
<body class="controls-visible">
  <main id="viewer" class="viewer" tabindex="0" aria-label="All Eyes On Me slideshow">
    <img id="slide" class="slide" src="slides/slide_001.svg" alt="Slide 1">
  </main>
  <div class="controls" aria-label="Slideshow controls">
    <button id="previous" class="nav previous" type="button" aria-label="Previous slide" title="Previous slide">&#x2039;</button>
    <button id="next" class="nav next" type="button" aria-label="Next slide" title="Next slide">&#x203A;</button>
    <button id="fullscreen" class="fullscreen" type="button" aria-label="Toggle fullscreen" title="Toggle fullscreen">&#x26F6;</button>
    <div id="counter" class="counter" aria-live="polite">1 / 17</div>
    <div class="progress" aria-hidden="true"><div id="progress" class="progress-fill"></div></div>
  </div>
  <div id="error" class="error" role="alert">The slideshow could not be loaded.</div>
  <script>
    const viewer = document.querySelector("#viewer");
    const image = document.querySelector("#slide");
    const previousButton = document.querySelector("#previous");
    const nextButton = document.querySelector("#next");
    const fullscreenButton = document.querySelector("#fullscreen");
    const counter = document.querySelector("#counter");
    const progress = document.querySelector("#progress");
    const error = document.querySelector("#error");
    let slides = ["slides/slide_001.svg"];
    let current = 0;
    let controlsTimer = 0;
    let touchStart = null;

    function indexFromLocation() {
      const match = location.hash.match(/^#(?:slide-)?(\d+)$/);
      return match ? Math.max(0, Number(match[1]) - 1) : 0;
    }

    function preload(index) {
      if (index < 0 || index >= slides.length) return;
      const neighbor = new Image();
      neighbor.src = slides[index];
    }

    function render(index, updateLocation = true) {
      current = Math.max(0, Math.min(slides.length - 1, index));
      image.classList.add("loading");
      image.src = slides[current];
      image.alt = `Slide ${current + 1} of ${slides.length}`;
      previousButton.disabled = current === 0;
      nextButton.disabled = current === slides.length - 1;
      counter.textContent = `${current + 1} / ${slides.length}`;
      progress.style.width = `${((current + 1) / slides.length) * 100}%`;
      if (updateLocation) history.replaceState(null, "", `#${current + 1}`);
      preload(current - 1);
      preload(current + 1);
    }

    function showControls() {
      document.body.classList.add("controls-visible");
      window.clearTimeout(controlsTimer);
      controlsTimer = window.setTimeout(() => {
        if (!document.querySelector(".controls:focus-within")) document.body.classList.remove("controls-visible");
      }, 1800);
    }

    async function toggleFullscreen() {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
      showControls();
    }

    image.addEventListener("load", () => image.classList.remove("loading"));
    image.addEventListener("error", () => error.classList.add("visible"));
    previousButton.addEventListener("click", () => render(current - 1));
    nextButton.addEventListener("click", () => render(current + 1));
    fullscreenButton.addEventListener("click", () => toggleFullscreen().catch(() => {}));
    window.addEventListener("hashchange", () => render(indexFromLocation(), false));
    window.addEventListener("pointermove", showControls, { passive: true });
    window.addEventListener("keydown", (event) => {
      if (["ArrowRight", "PageDown", " "].includes(event.key)) {
        event.preventDefault();
        render(current + 1);
      } else if (["ArrowLeft", "PageUp"].includes(event.key)) {
        event.preventDefault();
        render(current - 1);
      } else if (event.key === "Home") {
        event.preventDefault();
        render(0);
      } else if (event.key === "End") {
        event.preventDefault();
        render(slides.length - 1);
      } else if (event.key.toLowerCase() === "f") {
        event.preventDefault();
        toggleFullscreen().catch(() => {});
      }
      showControls();
    });
    viewer.addEventListener("pointerdown", (event) => {
      if (event.pointerType !== "touch") return;
      touchStart = { x: event.clientX, y: event.clientY };
    });
    viewer.addEventListener("pointerup", (event) => {
      if (!touchStart || event.pointerType !== "touch") return;
      const dx = event.clientX - touchStart.x;
      const dy = event.clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)) render(current + (dx < 0 ? 1 : -1));
      else showControls();
    });

    fetch("manifest.json")
      .then((response) => {
        if (!response.ok) throw new Error(`manifest ${response.status}`);
        return response.json();
      })
      .then((manifest) => {
        if (!Array.isArray(manifest.slides) || !manifest.slides.length) throw new Error("empty manifest");
        slides = manifest.slides;
        render(indexFromLocation(), false);
        viewer.focus({ preventScroll: true });
        showControls();
      })
      .catch((loadError) => {
        console.error(loadError);
        error.classList.add("visible");
      });
  </script>
</body>
</html>
