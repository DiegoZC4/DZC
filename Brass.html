<html>
<head><title>Brass</title><meta charset="UTF-8"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎺</text></svg>">
</head>
<body>
  <p>Bottom row of the keyboard is for the fundamentals in the overtone series.</p>
  <p>Arrow keys control 3 customizable valves.</p>
  <p>Space toggles reverb.</p>
  <div id="inputs"></div>
  <label id="wavelabel"> Waveform </label>
  <select id="wave">
    <option>sine</option>
    <option>square</option>
    <option>sawtooth</option>
    <option selected>triangle</option>
  </select><p></p>
  <div id="keyboard"></div><p></p>
  <div id="valves">
    <p>Valve modifier in Halfsteps</p>
  </div>
<style>
input[type="range"] {width: 200px;}
input[type="number"] {width: 50px;}
</style>
<script>

class NumSlider {
  constructor(min, max, start, units, step=1, parent='inputs') {
    this.min = min
    this.max = max

    let slider = document.createElement('input')
    slider.type = 'range'
    slider.min = min
    slider.max = max
    slider.step = step
    slider.value = start
    this.slider = slider
    this.slider.addEventListener('input', () => this.num.value = this.slider.value)
    
    let num = document.createElement('input')
    num.type = 'number'
    num.value = start
    num.min = min
    num.max = max
    num.step = step
    num.style.textAlign = 'right'
    this.num = num
    this.num.addEventListener('input', () => {
      let value = Math.min(Math.max(Number(this.num.value) || min, min), max)
      this.num.value = value
      this.slider.value = value
    })

    let label = document.createElement('label')
    label.append(this.slider)
    label.append(this.num)
    label.append(document.createTextNode(' ' + units))
    label.append(document.createElement('br'))
    this.label = label

    document.getElementById(parent).append(this.label)
  }

  value() {return Number(this.slider.value)}
  on(event, func) {
    this.slider.addEventListener(event,func)
    this.num.addEventListener(event,func)
  }
}

const wave = document.getElementById('wave')

const transpose  = new NumSlider(0,  11,  0, 'Transpose')
const volume  = new NumSlider(0,100, 15, 'Volume')
const decay   = new NumSlider(0, 10,  1, 'Decay (seconds)', step=0.1);
transpose.on('input',updateKeys)
decay.on('input',updateKeys)

const audioContext = new (window.AudioContext || window.webkitAudioContext)()
const masterGain = audioContext.createGain()
masterGain.gain.value = volume.value()/100
masterGain.connect(audioContext.destination)
volume.on('input', () => {
  const now = audioContext.currentTime
  masterGain.gain.cancelScheduledValues(now)
  masterGain.gain.setValueAtTime(masterGain.gain.value, now);
  masterGain.gain.value = volume.value()/100
})

const upSaturation = '50%'
const downSaturation = '100%'
const upLightness = '50%'
const downLightness = '75%'
const pitches = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B']
function freq2Pitch(freq) {
  const C0 = 16.35; // Frequency of C0
  const log2C0 = Math.log2(C0); // Correct value for log2 of C0
  let halfsteps = (Math.log2(freq) - log2C0) * 12;
  let noteIndex = Math.round(halfsteps) % 12;
  if (noteIndex < 0) noteIndex += 12; // Handle negative modulus for frequencies below C0
  let octave = Math.floor((Math.round(halfsteps)) / 12);
  let cents = Math.round((halfsteps - Math.round(halfsteps)) * 100);
  return `${pitches[noteIndex]}${octave}${cents ? (cents < 0 ? "" : "+") + cents: ''}`;
}

class Key{
  constructor(key, freq, hue){
    this.freq = freq
    
    let b = document.createElement('button')
    b.textContent = key
    b.style.width = '8vw'
    b.style.height = '8vh'
    this.button = b
    this.hue = hue
    this.setColor()
    b.addEventListener('mousedown',(e)=>{
      e.preventDefault()
      this.press()
    })
    b.addEventListener('mouseup',(e)=>{
      e.preventDefault()
      this.release()
    })
    
    let osc = audioContext.createOscillator()
    osc.type = wave.value
    osc.start()
    this.osc = osc
    let vol = audioContext.createGain();
    vol.gain.value = 0
    osc.connect(vol)
    vol.connect(masterGain)
    this.vol = vol
    this.setFrequency(freq)
  }
  html(){return this.button}
  setFrequency(freq){
    this.osc.frequency.value = freq
    this.button.title = `${Math.round(freq)}Hz ${freq2Pitch(freq)}`
  }
  setWaveform(wave){this.osc.type = wave}
  setHue(hue){
    this.hue=hue
    this.setColor()
  }
  setColor(down=false){
    this.button.style.background = 
    `hsl(${this.hue},
    ${down?downSaturation:upSaturation},
    ${down? downLightness: upLightness})`
  }
  press(){
    this.setColor(true)
    this.setGain(1)
  }
  release(){
    this.setColor(false)
    this.setGain(0,pedal?decay.value():0.01)
  }
  setGain(g,ramp=0.01){
    const now = audioContext.currentTime
    this.vol.gain.cancelScheduledValues(now)
    this.vol.gain.setValueAtTime(this.vol.gain.value, now);
    this.vol.gain.linearRampToValueAtTime(g, now+ramp)
  }
}

const keyboardDiv = document.getElementById('keyboard')
const buttonDiam = 100
// keyboardDiv.style.height = 9*buttonDiam
const keyboardChars = [..."asdfghjkl;'",'Enter',...'qwertyuiop[]1234567890-=']

// const fundFreq = 58.27
const fundFreq = 116.54
const char2Keys = {}
const harmonicSeries = [...'zxcvbnm,./','Shift']
const keys = harmonicSeries.map((char,i)=>{
  const f = fundFreq*(i+1)
  const h = Math.round(Math.log2(f/fundFreq)*12)%12
  const k = new Key(char,f,h/12*360)
  char2Keys[char] = k
  keyboardDiv.append(k.button)
})

function updateKeys(){
  const halfSteps = Object.entries(pressed).map(([k,v])=>v*valves[k].value()).reduce((sum,a)=>sum+a,0)+transpose.value();
  harmonicSeries.map((k,i)=>{
    char2Keys[k].setFrequency(fundFreq*(i+1)*2**(halfSteps/12))
    // char2Keys[k].setColor()
  }
  )
}

let pedal = false
let mod = 0

const valves = {
  'ArrowLeft':new NumSlider(-4,4,-2,'Left Arrow',1,'valves'),
  'ArrowDown':new NumSlider(-4,4,-1,'Down Arrow',1,'valves'),
  'ArrowRight':new NumSlider(-4,4,-3,'Right Arrow',1,'valves')
}
const pressed = {
  'ArrowLeft':false,
  'ArrowDown':false,
  'ArrowRight':false
}

document.onkeydown = function (e) {
  e = e || window.event
  let key = e.key
  if (key == ' ') pedal = !pedal
  if (key in pressed) {
    pressed[key] = true
    updateKeys()
  }
  if (key in char2Keys) {
    char2Keys[key].press()
  }
}
document.onkeyup = function (e) {
  e = e || window.event
  let key = e.key
  if (key in pressed) {
    pressed[key] = false
    updateKeys()
    return
  }
  if (key in char2Keys) {
    char2Keys[key].release()
  }
}

function resumeAudioContext() {
  if (audioContext.state === 'suspended') {
    audioContext.resume().then(() => {
      console.log('AudioContext resumed');
    }).catch((error) => {
      console.error('Failed to resume the AudioContext:', error);
    });
  }
}

document.addEventListener('click', resumeAudioContext);
document.addEventListener('keydown', resumeAudioContext);
window.addEventListener('blur', ()=>{Object.values(char2Keys).map(k=>k.release())});

</script>
</body>
</html>
