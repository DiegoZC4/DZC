<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Ear Training</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%91%82%3C/text%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #10151f;
        --panel: #192334;
        --text: #ecf4ff;
        --muted: #9ab0cf;
        --line: #2d3f59;
      }
      * { box-sizing: border-box; }
      html {
        color-scheme: dark;
        forced-color-adjust: none;
      }
      body {
        margin: 0;
        font-family: "Avenir Next", "Trebuchet MS", sans-serif;
        background: radial-gradient(circle at 20% 5%, #243553, var(--bg));
        color: var(--text);
        forced-color-adjust: none;
        -webkit-text-size-adjust: 100%;
      }
      main.app {
        max-width: 1400px;
        margin: 0 auto;
        padding: 18px;
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 14px;
      }
      .panel {
        background: linear-gradient(165deg, #182437, var(--panel));
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }
      .sidebar {
        position: sticky;
        top: 18px;
        align-self: start;
        display: grid;
        gap: 18px;
      }
      .settings-panel summary {
        cursor: pointer;
        color: var(--muted);
        font-weight: 700;
      }
      h1, p { margin-top: 0; }
      p { color: var(--muted); }
      .sidebar-controls {
        display: grid;
        gap: 12px;
        margin-top: 10px;
      }
      button, input, select {
        border-radius: 8px;
        border: 1px solid #365276;
        background: #101d2d;
        color: var(--text);
        padding: 8px 10px;
      }
      button { cursor: pointer; }
      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        min-width: 0;
      }
      label input[type="range"] {
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }
      .label-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
      }
      .label-row span {
        color: var(--muted);
        white-space: nowrap;
      }
      .inline-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .inline-toggle input[type="checkbox"] {
        width: auto;
        margin: 0;
      }
      .pill-toggle {
        display: grid;
        gap: 6px;
      }
      .pill-toggle-group {
        position: relative;
        display: inline-grid;
        grid-auto-flow: column;
        gap: 4px;
        padding: 4px;
        border-radius: 999px;
        background: #101d2d;
        border: 1px solid #365276;
      }
      .pill-thumb {
        position: absolute;
        top: 4px;
        bottom: 4px;
        left: 4px;
        width: calc(50% - 6px);
        border-radius: 999px;
        background: #f2f5fa;
        transition: transform 180ms ease, width 180ms ease;
        pointer-events: none;
      }
      .pill-option {
        position: relative;
        z-index: 1;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        padding: 8px 12px;
        font: inherit;
        transition: color 180ms ease;
      }
      .pill-option.is-active {
        color: #11161d;
      }
      #pitchWheel {
        width: 100%;
        max-width: 620px;
        height: auto;
        display: block;
        margin: 0 auto;
        overflow: visible;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
      .desktop-range {
        margin-top: 14px;
        width: 100%;
        grid-column: 1 / -1;
      }
      .desktop-range-label {
        margin: 0 0 8px;
        color: var(--muted);
        font-weight: 700;
      }
      #rangePiano {
        width: 100%;
        height: 140px;
        border-radius: 6px;
        background: #10141d;
        border: 1px solid #2b3f5c;
        user-select: none;
        -webkit-user-select: none;
      }
      .piano-key {
        cursor: pointer;
      }
      .piano-key:hover {
        fill: #ffd84d !important;
      }
      .piano-label {
        fill: #000;
        font-size: 12px;
        font-family: "Avenir Next", "Trebuchet MS", sans-serif;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .main-column {
        display: grid;
        gap: 14px;
      }
      .mobile-inline-row {
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }
      .waveform-pager {
        position: relative;
        height: 66px;
        border-radius: 10px;
        border: 1px solid #365276;
        background: #101d2d;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      .waveform-pager-layer {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6f9;
        transition: background-color 120ms linear, opacity 120ms linear;
      }
      .waveform-pager-layer svg {
        width: 74px;
        height: 20px;
        display: block;
      }
      .waveform-pager-layer path {
        stroke: #0f1620;
        stroke-width: 2.4;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .gain-stack {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 66px;
      }
      .gain-box {
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #365276;
        border-radius: 10px;
        background: #101d2d;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        cursor: ns-resize;
        width: 100%;
        height: 100%;
        font-size: 1rem;
      }
      .conditional-control[hidden] {
        display: none !important;
      }
      .mobile-range-picker {
        display: none;
      }
      .range-wheel-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .range-wheel {
        display: grid;
        gap: 6px;
      }
      .range-wheel-scroller {
        position: relative;
        height: 180px;
        border-radius: 10px;
        border: 1px solid #365276;
        background: linear-gradient(180deg, rgba(16,29,45,0.96), rgba(12,20,31,0.96));
        overflow: hidden;
        cursor: grab;
      }
      .range-wheel-scroller.is-dragging {
        cursor: grabbing;
      }
      .range-wheel-scroller.is-dragging .range-wheel-list {
        scroll-snap-type: none;
        scroll-behavior: auto;
      }
      .range-wheel-list {
        height: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding: 72px 0;
        scroll-behavior: smooth;
        user-select: none;
        -webkit-user-select: none;
        mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.88) 18%, rgba(0,0,0,1) 36%, rgba(0,0,0,1) 64%, rgba(0,0,0,0.88) 82%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.88) 18%, rgba(0,0,0,1) 36%, rgba(0,0,0,1) 64%, rgba(0,0,0,0.88) 82%, transparent 100%);
      }
      .range-wheel-list::-webkit-scrollbar {
        display: none;
      }
      .range-wheel-item {
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        scroll-snap-align: center;
        color: rgba(17,25,39,0.68);
        font-size: 0.98rem;
        letter-spacing: 0.01em;
        transition: color 120ms linear, transform 120ms linear, opacity 120ms linear, background-color 120ms linear, border-color 120ms linear;
        background: #f4f6f9;
        border-bottom: 2px solid rgba(148, 163, 184, 0.42);
      }
      .range-wheel-item.is-black {
        background: #141a22;
        color: rgba(236,244,255,0.64);
        border-bottom: 2px solid rgba(115, 130, 150, 0.38);
      }
      .range-wheel-item.is-selected {
        color: #ffffff;
      }
      .range-wheel-item.is-selected:not(.is-black) {
        color: #10151f;
      }
      .range-wheel-selection {
        position: absolute;
        left: 0;
        right: 0;
        top: 70px;
        height: 40px;
        border: 3px solid #6d4aff;
        border-radius: 0;
        background: rgba(255,255,255,0.05);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
        pointer-events: none;
      }
      @media (max-width: 1000px) {
        main.app { grid-template-columns: 1fr; }
        .sidebar { position: static; }
        .desktop-range {
          display: none;
        }
        .mobile-range-picker {
          display: block;
        }
      }
      @media (max-width: 700px) {
        main.app {
          padding: 12px;
          gap: 10px;
        }
        .sidebar {
          width: 100%;
          gap: 10px;
        }
        .sidebar > header {
          display: none;
        }
        .main-column .panel {
          background: transparent;
          border: 0;
          padding: 0;
        }
        .mobile-inline-row {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          align-items: start;
        }
        .mobile-hide {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="panel sidebar">
        <details id="settingsPanel" class="settings-panel" open>
          <summary>⚙️</summary>
          <section class="sidebar-controls">
            <div class="mobile-inline-row">
              <div id="waveformPager" class="waveform-pager">
              </div>
              <div class="gain-stack">
                <div id="gainBox" class="gain-box">Volume: 20</div>
              </div>
            </div>
            <label class="inline-toggle">
              <span>Play</span>
            </label>
            <div class="pill-toggle">
              <div class="pill-toggle-group" role="tablist" aria-label="Play mode">
                <span class="pill-thumb" aria-hidden="true"></span>
                <button id="playModePressBtn" class="pill-option" type="button">On Press</button>
                <button id="playModeContinuousBtn" class="pill-option" type="button">Continuous</button>
              </div>
            </div>
            <label class="inline-toggle">
              <span>Score</span>
              <button id="downloadCsvBtn" type="button">Download CSV</button>
            </label>
            <div class="pill-toggle">
              <div class="pill-toggle-group" role="tablist" aria-label="Score mode">
                <span class="pill-thumb" aria-hidden="true"></span>
                <button id="scoreModeTodayBtn" class="pill-option" type="button">Today</button>
                <button id="scoreModeAllBtn" class="pill-option" type="button">All Time</button>
              </div>
            </div>
            <section class="mobile-range-picker">
              <div class="range-wheel-grid">
                <label class="range-wheel">
                  <span>Range Start</span>
                  <div class="range-wheel-scroller">
                    <div id="rangeStartWheel" class="range-wheel-list"></div>
                    <div class="range-wheel-selection"></div>
                  </div>
                </label>
                <label class="range-wheel">
                  <span>Range End</span>
                  <div class="range-wheel-scroller">
                    <div id="rangeEndWheel" class="range-wheel-list"></div>
                    <div class="range-wheel-selection"></div>
                  </div>
                </label>
              </div>
            </section>
            <label class="inline-toggle">
              <span>Chord Size</span>
            </label>
            <div class="pill-toggle">
              <div id="chordSizeGroup" class="pill-toggle-group is-fourway" role="tablist" aria-label="Chord size">
                <span class="pill-thumb" aria-hidden="true"></span>
                <button id="chordSize1Btn" class="pill-option" type="button">1</button>
                <button id="chordSize2Btn" class="pill-option" type="button">2</button>
                <button id="chordSize3Btn" class="pill-option" type="button">3</button>
                <button id="chordSize4Btn" class="pill-option" type="button">4</button>
              </div>
            </div>
            <div id="maxIntervalControl" class="conditional-control">
              <div class="gain-stack">
                <div id="maxIntervalBox" class="gain-box">Max Interval: 12</div>
              </div>
            </div>
          </section>
        </details>
      </aside>

      <div class="main-column">
        <svg id="pitchWheel" viewBox="32 32 556 556" aria-label="Pitch wheel"></svg>
      </div>
      <section class="desktop-range">
        <p class="desktop-range-label">Range <span id="rangeText">C3-C6</span></p>
        <svg id="rangePiano" viewBox="0 0 1040 140" preserveAspectRatio="none"></svg>
      </section>
    </main>

    <script>
      const NOTE_NAMES = ["C", "C#/Db", "D", "D#/Eb", "E", "F", "F#/Gb", "G", "G#/Ab", "A", "A#/Bb", "B"];
      const MIDI_NOTE_NAMES = NOTE_NAMES;
      const INTERVAL_NAMES = [
        "unison",
        "minor 2nd",
        "major 2nd",
        "minor 3rd",
        "major 3rd",
        "perfect 4th",
        "tritone",
        "perfect 5th",
        "minor 6th",
        "major 6th",
        "minor 7th",
        "major 7th",
        "octave",
        "minor 9th",
        "major 9th",
        "minor 10th",
        "major 10th",
        "perfect 11th",
        "augmented 11th",
        "perfect 12th",
        "minor 13th",
        "major 13th",
        "minor 14th",
        "major 14th",
        "double octave",
      ];
      const TRIAD_CANONICAL_NAMES = {
        "0,1,2": "",
        "0,1,3": "",
        "0,2,3": "",
        "0,1,4": "",
        "0,2,4": "",
        "0,3,4": "",
        "0,2,6": "",
        "0,1,7": "",
        "0,3,6": "",
        "0,2,7": "",
        "0,4,6": "",
        "0,3,7": "",
        "0,4,7": "",
        "0,4,8": "",
        "0,6,7": "",
        "0,7,8": "",
        "0,7,9": "",
        "0,7,10": "",
        "0,7,11": "",
      };
      const PITCH_HUES = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];
      const PITCH_BASE_LIGHTNESS = 0.72;
      const PITCH_BASE_CHROMA = 0.16;
      const PITCH_MUTED_LIGHTNESS = 0.5;
      const PITCH_MUTED_CHROMA = 0.2;
      const PITCH_HOVER_LIGHTNESS = 0.65;
      const PITCH_HOVER_CHROMA = 0.3;
      const PIANO_MIN_MIDI = 21;
      const PIANO_MAX_MIDI = 108;
      const SETTINGS_KEY = "ear-training-settings";
      const DAILY_LOG_KEY = "ear-training-logs";

      const PC_SHORTCUTS = {0:"Y",1:"U",2:"I",3:"O",4:"P",5:"[",6:"Tab",7:"Q",8:"W",9:"E",10:"R",11:"T"};
      const KEY_TO_PC = {KeyY:0, KeyU:1, KeyI:2, KeyO:3, KeyP:4, BracketLeft:5, Tab:6, KeyQ:7, KeyW:8, KeyE:9, KeyR:10, KeyT:11};

      const wheelSvg = document.getElementById("pitchWheel");
      const rangeText = document.getElementById("rangeText");
      const rangePiano = document.getElementById("rangePiano");
      const rangeStartWheel = document.getElementById("rangeStartWheel");
      const rangeEndWheel = document.getElementById("rangeEndWheel");
      const RANGE_WHEEL_ITEM_HEIGHT = 36;
      const waveformPager = document.getElementById("waveformPager");
      const gainBox = document.getElementById("gainBox");
      const playModePressBtn = document.getElementById("playModePressBtn");
      const playModeContinuousBtn = document.getElementById("playModeContinuousBtn");
      const scoreModeTodayBtn = document.getElementById("scoreModeTodayBtn");
      const scoreModeAllBtn = document.getElementById("scoreModeAllBtn");
      const chordSizeGroup = document.getElementById("chordSizeGroup");
      const chordSize1Btn = document.getElementById("chordSize1Btn");
      const chordSize2Btn = document.getElementById("chordSize2Btn");
      const chordSize3Btn = document.getElementById("chordSize3Btn");
      const chordSize4Btn = document.getElementById("chordSize4Btn");
      const maxIntervalControl = document.getElementById("maxIntervalControl");
      const maxIntervalBox = document.getElementById("maxIntervalBox");
      const downloadCsvBtn = document.getElementById("downloadCsvBtn");
      const WAVEFORMS = ["sine", "triangle", "square", "sawtooth"];

      function waveformGainMultiplier(waveform) {
        return {
          sine: 1.0,
          triangle: 0.82,
          square: 0.42,
          sawtooth: 0.36,
        }[waveform] || 1.0;
      }

      const RANGE_LAYOUT_BREAKPOINT = 1000;

      function isMobileLayout() {
        return window.matchMedia(`(max-width: ${RANGE_LAYOUT_BREAKPOINT}px)`).matches;
      }

      const state = {
        pitchClasses: NOTE_NAMES.map((name, pc) => ({ name, pc, active: true, color: pitchColor(pc, PITCH_BASE_LIGHTNESS, PITCH_BASE_CHROMA) })),
        targetPc: null,
        targetMidi: null,
        targetInterval: null,
        targetMidis: null,
        revealed: false,
        hoveredPc: null,
        hoveredZone: null,
        holdActive: false,
        rangeHoldMidi: null,
        rangeStartMidi: 48,
        rangeEndMidi: 84,
        playContinuously: false,
        todayOnlyScore: true,
        chordSize: 1,
        maxInterval: 12,
        equalLoudness: true,
        waveform: "triangle",
        baseGain: 0.2,
        pianoKeyEls: new Map(),
        perfectPitch: {
          scoreByDateAndChordSize: {},
          feedbackPc: null,
          feedbackKind: null,
          awaitingAdvance: false,
          awaitingRelease: false,
          releaseTriggerType: null,
          releaseTriggerCode: null,
        },
        rangeWheelSnapTimers: { start: null, end: null },
        gainDrag: null,
      };

      const audioEngine = {
        context: null,
        unlocked: false,
        promptOsc: null,
        promptGain: null,
        promptOscs: [],
        promptGains: [],
        promptReadyAt: 0,
        async ensureContext() {
          if (!this.context) this.context = new (window.AudioContext || window.webkitAudioContext)();
          let justUnlocked = false;
          if (this.context.state === "suspended") {
            await this.context.resume();
            justUnlocked = true;
          }
          if (this.context.state === "running") this.unlocked = true;
          return justUnlocked;
        },
        async ensurePromptVoice() {
          const justUnlocked = await this.ensureContext();
          if (this.promptOsc && this.promptGain) return justUnlocked;
          const now = this.context.currentTime;
          const startTime = now + (justUnlocked ? 0.03 : 0.01);
          const osc = this.context.createOscillator();
          const g = this.context.createGain();
          osc.type = state.waveform;
          g.gain.setValueAtTime(0, now);
          g.gain.setValueAtTime(0, startTime);
          osc.connect(g);
          g.connect(this.context.destination);
          osc.start(startTime);
          this.promptOsc = osc;
          this.promptGain = g;
          this.promptReadyAt = startTime;
          return justUnlocked;
        },
        async ensurePromptVoices(count) {
          const justUnlocked = await this.ensureContext();
          while (this.promptOscs.length < count) {
            const now = this.context.currentTime;
            const startTime = now + (justUnlocked ? 0.03 : 0.01);
            const osc = this.context.createOscillator();
            const g = this.context.createGain();
            osc.type = state.waveform;
            g.gain.setValueAtTime(0, now);
            g.gain.setValueAtTime(0, startTime);
            osc.connect(g);
            g.connect(this.context.destination);
            osc.start(startTime);
            this.promptOscs.push(osc);
            this.promptGains.push(g);
            this.promptReadyAt = startTime;
          }
          return justUnlocked;
        },
        midiToFreq(midi) {
          return 440 * 2 ** ((midi - 69) / 12);
        },
        async startPrompt(midi, gain) {
          if (Array.isArray(midi)) {
            const justUnlocked = await this.ensurePromptVoices(midi.length);
            const now = this.context.currentTime;
            const startTime = Math.max(now + 0.004, this.promptReadyAt || 0);
            const attack = justUnlocked ? 0.05 : 0.02;
            const perVoiceGain = gain / Math.max(1, Math.sqrt(midi.length));
            for (let index = 0; index < this.promptOscs.length; index += 1) {
              const osc = this.promptOscs[index];
              const g = this.promptGains[index];
              const note = midi[index];
              g.gain.cancelScheduledValues(now);
              g.gain.setValueAtTime(g.gain.value, now);
              if (note == null) {
                g.gain.linearRampToValueAtTime(0, now + 0.03);
                continue;
              }
              osc.type = state.waveform;
              osc.frequency.cancelScheduledValues(now);
              osc.frequency.setValueAtTime(this.midiToFreq(note), startTime);
              g.gain.setValueAtTime(0, startTime);
              g.gain.linearRampToValueAtTime(compensatedGain(note, perVoiceGain), startTime + attack);
            }
            return;
          }
          const justUnlocked = await this.ensurePromptVoice();
          const now = this.context.currentTime;
          const startTime = Math.max(now + 0.004, this.promptReadyAt || 0);
          const attack = justUnlocked ? 0.05 : 0.02;
          const finalGain = compensatedGain(midi, gain);
          this.promptOsc.type = state.waveform;
          this.promptOsc.frequency.cancelScheduledValues(now);
          this.promptOsc.frequency.setValueAtTime(this.midiToFreq(midi), startTime);
          this.promptGain.gain.cancelScheduledValues(now);
          this.promptGain.gain.setValueAtTime(this.promptGain.gain.value, now);
          this.promptGain.gain.setValueAtTime(0, startTime);
          this.promptGain.gain.linearRampToValueAtTime(finalGain, startTime + attack);
        },
        stopPrompt() {
          if (!this.context) return;
          const now = this.context.currentTime;
          if (this.promptGain) {
            this.promptGain.gain.cancelScheduledValues(now);
            this.promptGain.gain.setValueAtTime(this.promptGain.gain.value, now);
            this.promptGain.gain.linearRampToValueAtTime(0, now + 0.03);
          }
          for (const g of this.promptGains) {
            g.gain.cancelScheduledValues(now);
            g.gain.setValueAtTime(g.gain.value, now);
            g.gain.linearRampToValueAtTime(0, now + 0.03);
          }
        },
        updatePromptGain(midi, gain) {
          if (!this.context || midi === null) return;
          if (Array.isArray(midi)) {
            const now = this.context.currentTime;
            const perVoiceGain = gain / Math.max(1, Math.sqrt(midi.length));
            for (let index = 0; index < midi.length; index += 1) {
              const note = midi[index];
              const g = this.promptGains[index];
              if (!g || note == null) continue;
              g.gain.cancelScheduledValues(now);
              g.gain.setValueAtTime(g.gain.value, now);
              g.gain.linearRampToValueAtTime(compensatedGain(note, perVoiceGain), now + 0.03);
            }
            return;
          }
          if (!this.promptGain) return;
          const now = this.context.currentTime;
          const finalGain = compensatedGain(midi, gain);
          this.promptGain.gain.cancelScheduledValues(now);
          this.promptGain.gain.setValueAtTime(this.promptGain.gain.value, now);
          this.promptGain.gain.linearRampToValueAtTime(finalGain, now + 0.03);
        },
        async startNote(midi, gain) {
          const justUnlocked = await this.ensureContext();
          const now = this.context.currentTime;
          const startDelay = justUnlocked ? 0.02 : 0.003;
          const attack = justUnlocked ? 0.045 : 0.012;
          const startTime = now + startDelay;
          const finalGain = compensatedGain(midi, gain);
          const osc = this.context.createOscillator();
          const g = this.context.createGain();
          osc.type = state.waveform;
          osc.frequency.setValueAtTime(this.midiToFreq(midi), startTime);
          g.gain.cancelScheduledValues(now);
          g.gain.setValueAtTime(0, now);
          g.gain.setValueAtTime(0, startTime);
          g.gain.linearRampToValueAtTime(finalGain, startTime + attack);
          osc.connect(g);
          g.connect(this.context.destination);
          osc.start(startTime);
          return {
            stop: () => {
              const t = this.context.currentTime;
              const releaseStart = Math.max(t, startTime);
              const currentGain = g.gain.value;
              g.gain.cancelScheduledValues(t);
              g.gain.setValueAtTime(currentGain, releaseStart);
              g.gain.linearRampToValueAtTime(0, releaseStart + 0.03);
              osc.stop(releaseStart + 0.04);
            },
          };
        },
        async playForDuration(midi, gain, durationMs) {
          const handle = await this.startNote(midi, gain);
          window.setTimeout(() => handle.stop(), durationMs);
        },
      };

      function yyMmDd(date = new Date()) {
        return `${String(date.getFullYear()).slice(-2)}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function scoreKeyFor(date, chordSize = state.chordSize) {
        return `${date}|${chordSize}`;
      }

      function scoreByDateToCsv(scoreByDateAndChordSize) {
        const rows = [["date", "correct", "total", "chordSize"]];
        for (const key of Object.keys(scoreByDateAndChordSize).sort()) {
          const [date, chordSize] = key.split("|");
          const entry = scoreByDateAndChordSize[key];
          rows.push([date, String(entry[0] || 0), String(entry[1] || 0), String(entry[2] || chordSize || 1)]);
        }
        return rows.map((row) => row.join(",")).join("\n");
      }

      function csvToScoreByDate(csvText) {
        const out = {};
        if (!csvText) return out;
        const lines = csvText.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
        for (let index = 0; index < lines.length; index += 1) {
          const line = lines[index];
          if (index === 0 && line.toLowerCase() === "date,correct,total,chordsize") continue;
          const [date, correct, total, chordSize] = line.split(",");
          if (!date) continue;
          const normalizedChordSize = clamp(Number(chordSize) || 1, 1, 4);
          out[scoreKeyFor(date, normalizedChordSize)] = [Number(correct) || 0, Number(total) || 0, normalizedChordSize];
        }
        return out;
      }

      function loadDailyLog() {
        try {
          const raw = localStorage.getItem(DAILY_LOG_KEY);
          if (raw) return csvToScoreByDate(raw);
          return {};
        } catch (_err) {
          return {};
        }
      }

      function saveDailyLog() {
        localStorage.setItem(DAILY_LOG_KEY, scoreByDateToCsv(state.perfectPitch.scoreByDateAndChordSize));
      }

      function saveSettings() {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
          rangeStartMidi: state.rangeStartMidi,
          rangeEndMidi: state.rangeEndMidi,
          playContinuously: state.playContinuously,
          todayOnlyScore: state.todayOnlyScore,
          chordSize: state.chordSize,
          maxInterval: state.maxInterval,
          equalLoudness: state.equalLoudness,
          waveform: state.waveform,
          baseGain: state.baseGain,
        }));
      }

      function loadSettings() {
        try {
          const raw = localStorage.getItem(SETTINGS_KEY);
          if (!raw) return;
          const persisted = JSON.parse(raw);
          if (Number.isInteger(persisted.rangeStartMidi)) state.rangeStartMidi = clamp(persisted.rangeStartMidi, PIANO_MIN_MIDI, PIANO_MAX_MIDI);
          if (Number.isInteger(persisted.rangeEndMidi)) state.rangeEndMidi = clamp(persisted.rangeEndMidi, PIANO_MIN_MIDI, PIANO_MAX_MIDI);
          if (typeof persisted.playContinuously === "boolean") state.playContinuously = persisted.playContinuously;
          if (typeof persisted.todayOnlyScore === "boolean") state.todayOnlyScore = persisted.todayOnlyScore;
          if ([1, 2, 3, 4].includes(Number(persisted.chordSize))) state.chordSize = Number(persisted.chordSize);
          if (Number.isFinite(Number(persisted.maxInterval))) state.maxInterval = clamp(Math.round(Number(persisted.maxInterval)), 1, 24);
          if (typeof persisted.equalLoudness === "boolean") state.equalLoudness = persisted.equalLoudness;
          if (typeof persisted.waveform === "string" && waveformGainMultiplier(persisted.waveform)) state.waveform = persisted.waveform;
          if (Number.isFinite(Number(persisted.baseGain))) {
            state.baseGain = clamp(Number(persisted.baseGain), 0.02, 0.7);
          } else if (persisted.waveformGains && typeof persisted.waveformGains === "object") {
            const legacyGain = Number(persisted.waveformGains[state.waveform]);
            if (Number.isFinite(legacyGain)) {
              state.baseGain = clamp(legacyGain / waveformGainMultiplier(state.waveform), 0.02, 0.7);
            }
          }
        } catch (_err) {
        }
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function getPromptGain() {
        return Math.min(0.95, state.baseGain * waveformGainMultiplier(state.waveform));
      }

      function compensatedGain(midi, baseGain) {
        if (!state.equalLoudness) return baseGain;
        const freq = audioEngine.midiToFreq(midi);
        const octaveOffset = Math.log2(freq / 440);
        let multiplier = 1;
        if (octaveOffset < 0) {
          const depth = -octaveOffset;
          multiplier *= 1 + Math.min(1.15, depth * 0.28 + depth * depth * 0.06);
        } else if (octaveOffset > 1.5) {
          multiplier *= 1 + Math.min(0.18, (octaveOffset - 1.5) * 0.08);
        }
        return Math.min(0.95, baseGain * multiplier);
      }

      function syncWaveformGainControl() {
        if (gainBox) gainBox.textContent = `Volume: ${Math.round(state.baseGain * 100)}`;
      }

      function syncMaxIntervalControl() {
        if (maxIntervalBox) maxIntervalBox.textContent = `Max Interval: ${state.maxInterval} (${INTERVAL_NAMES[state.maxInterval]})`;
        if (maxIntervalControl) maxIntervalControl.hidden = state.chordSize !== 2;
      }

      function syncPillThumb(groupEl, activeButton) {
        if (!groupEl || !activeButton) return;
        const thumb = groupEl.querySelector(".pill-thumb");
        if (!thumb) return;
        const left = activeButton.offsetLeft - 4;
        thumb.style.width = `${activeButton.offsetWidth}px`;
        thumb.style.transform = `translateX(${left}px)`;
      }

      function syncControls() {
        playModePressBtn.classList.toggle("is-active", !state.playContinuously);
        playModeContinuousBtn.classList.toggle("is-active", state.playContinuously);
        scoreModeTodayBtn.classList.toggle("is-active", state.todayOnlyScore);
        scoreModeAllBtn.classList.toggle("is-active", !state.todayOnlyScore);
        chordSize1Btn.classList.toggle("is-active", state.chordSize === 1);
        chordSize2Btn.classList.toggle("is-active", state.chordSize === 2);
        chordSize3Btn.classList.toggle("is-active", state.chordSize === 3);
        chordSize4Btn.classList.toggle("is-active", state.chordSize === 4);
        syncPillThumb(playModePressBtn.parentElement, state.playContinuously ? playModeContinuousBtn : playModePressBtn);
        syncPillThumb(scoreModeTodayBtn.parentElement, state.todayOnlyScore ? scoreModeTodayBtn : scoreModeAllBtn);
        syncPillThumb(chordSizeGroup, [chordSize1Btn, chordSize2Btn, chordSize3Btn, chordSize4Btn][state.chordSize - 1]);
        syncWaveformGainControl();
        syncMaxIntervalControl();
        waveformPager?._rerenderPager?.();
      }

      function currentScore() {
        const chordSize = state.chordSize;
        if (state.todayOnlyScore) {
          return state.perfectPitch.scoreByDateAndChordSize[scoreKeyFor(yyMmDd(), chordSize)] || [0, 0, chordSize];
        }
        let correct = 0;
        let total = 0;
        for (const entry of Object.values(state.perfectPitch.scoreByDateAndChordSize)) {
          if ((entry[2] || 1) !== chordSize) continue;
          correct += entry[0] || 0;
          total += entry[1] || 0;
        }
        return [correct, total];
      }

      function maxDisplayedInterval() {
        return Math.max(1, Math.min(state.rangeEndMidi - state.rangeStartMidi, state.maxInterval));
      }

      function parseYyMmDd(dateString) {
        const [yy, mm, dd] = dateString.split("-").map(Number);
        return new Date(2000 + yy, (mm || 1) - 1, dd || 1);
      }

      function daysBetweenYyMmDd(earlier, later) {
        const msPerDay = 24 * 60 * 60 * 1000;
        const earlierDate = parseYyMmDd(earlier);
        const laterDate = parseYyMmDd(later);
        return Math.round((laterDate - earlierDate) / msPerDay);
      }

      function currentStreak() {
        const today = yyMmDd();
        const chordSize = state.chordSize;
        const activeDates = Object.entries(state.perfectPitch.scoreByDateAndChordSize)
          .filter(([, entry]) => (entry[2] || 1) === chordSize && (entry[1] || 0) > 0)
          .map(([key]) => key.split("|")[0]);
        const uniqueDates = [...new Set(activeDates)].sort();
        if (!uniqueDates.length || uniqueDates[uniqueDates.length - 1] !== today) return 0;
        let streak = 1;
        for (let index = uniqueDates.length - 1; index > 0; index -= 1) {
          if (daysBetweenYyMmDd(uniqueDates[index - 1], uniqueDates[index]) !== 1) break;
          streak += 1;
        }
        return streak;
      }

      function updateScoreLabel() {
        const [correct, total] = currentScore();
        wheelSvg.setAttribute("aria-label", `Pitch wheel. Score ${correct} / ${total}`);
      }

      function midiToName(midi) {
        return `${MIDI_NOTE_NAMES[midi % 12]}${Math.floor(midi / 12) - 1}`;
      }

      function waveformPreviewSvg(waveform) {
        const paths = {
          sine: "M4 18 C12 18, 12 6, 20 6 S28 18, 36 18 S44 6, 52 6 S60 18, 68 18",
          triangle: "M4 18 L20 6 L36 18 L52 6 L68 18",
          square: "M4 18 L4 6 L20 6 L20 18 L36 18 L36 6 L52 6 L52 18 L68 18",
          sawtooth: "M4 18 L20 6 L20 18 L36 6 L36 18 L52 6 L52 18 L68 6"
        };
        return `<svg viewBox="0 0 72 24" aria-hidden="true" focusable="false"><path d="${paths[waveform]}"></path></svg>`;
      }

      function wrapWaveformIndex(index) {
        return ((index % WAVEFORMS.length) + WAVEFORMS.length) % WAVEFORMS.length;
      }

      function waveformAt(index) {
        return WAVEFORMS[wrapWaveformIndex(index)];
      }

      function currentWaveformIndex() {
        const index = WAVEFORMS.indexOf(state.waveform);
        return index === -1 ? 0 : index;
      }

      function setWaveform(nextWaveform) {
        if (nextWaveform === state.waveform) return;
        state.waveform = nextWaveform;
        if (state.holdActive) startHoldCurrentNote().catch(() => {});
        if (state.rangeHoldMidi !== null) startRangeHoldNote(state.rangeHoldMidi).catch(() => {});
        saveSettings();
      }

      function stepWaveform(delta) {
        const currentIndex = currentWaveformIndex();
        setWaveform(waveformAt(currentIndex + delta));
        waveformPager?._rerenderPager?.();
      }

      function setupWaveformPager() {
        if (!waveformPager) return;
        waveformPager.innerHTML = "";
        const layers = ["top", "center", "bottom"].map(() => {
          const div = document.createElement("div");
          div.className = "waveform-pager-layer";
          waveformPager.appendChild(div);
          return div;
        });

        const [pageTop, pageCenter, pageBottom] = layers;
        let startY = null;
        let dragIndex = 0;
        let snapTimer = null;
        const snapDurationMs = 100;

        function renderLayer(layer, waveform) {
          layer.innerHTML = waveformPreviewSvg(waveform);
        }

        function layout(index, dy = 0) {
          const h = waveformPager.clientHeight;
          renderLayer(pageTop, waveformAt(index - 1));
          renderLayer(pageCenter, waveformAt(index));
          renderLayer(pageBottom, waveformAt(index + 1));
          pageTop.style.transform = `translate3d(0,${dy - h}px,0)`;
          pageCenter.style.transform = `translate3d(0,${dy}px,0)`;
          pageBottom.style.transform = `translate3d(0,${dy + h}px,0)`;
        }

        function setTransition(value) {
          layers.forEach((layer) => { layer.style.transition = value; });
        }

        function rerender() {
          layout(currentWaveformIndex(), 0);
        }

        function animateTo(index, targetDy, commitIndex) {
          window.clearTimeout(snapTimer);
          setTransition(`transform ${snapDurationMs}ms ease-out`);
          layout(index, targetDy);
          snapTimer = window.setTimeout(() => {
            setTransition("none");
            setWaveform(waveformAt(commitIndex));
            rerender();
          }, snapDurationMs);
        }

        function start(y) {
          window.clearTimeout(snapTimer);
          setTransition("none");
          startY = y;
          dragIndex = currentWaveformIndex();
        }

        function move(y) {
          if (startY == null) return;
          const h = waveformPager.clientHeight;
          let dy = y - startY;
          while (dy <= -h) {
            dragIndex += 1;
            startY -= h;
            dy += h;
          }
          while (dy >= h) {
            dragIndex -= 1;
            startY += h;
            dy -= h;
          }
          layout(dragIndex, dy);
        }

        function end(y) {
          if (startY == null) return;
          const dy = y - startY;
          const threshold = waveformPager.clientHeight * 0.25;
          let commitIndex = dragIndex;
          let targetDy = 0;
          if (Math.abs(dy) > threshold) {
            if (dy < 0) {
              commitIndex = dragIndex + 1;
              targetDy = -waveformPager.clientHeight;
            } else {
              commitIndex = dragIndex - 1;
              targetDy = waveformPager.clientHeight;
            }
          }
          animateTo(dragIndex, targetDy, commitIndex);
          startY = null;
        }

        waveformPager.addEventListener("pointerdown", (event) => {
          start(event.clientY);
          waveformPager.setPointerCapture?.(event.pointerId);
          event.preventDefault();
        });
        waveformPager.addEventListener("pointermove", (event) => {
          move(event.clientY);
          event.preventDefault();
        });
        waveformPager.addEventListener("pointerup", (event) => {
          end(event.clientY);
          event.preventDefault();
        });
        waveformPager.addEventListener("pointercancel", (event) => {
          end(event.clientY);
          event.preventDefault();
        });
        waveformPager.addEventListener("wheel", (event) => {
          event.preventDefault();
          if (Math.abs(event.deltaY) < 2) return;
          stepWaveform(event.deltaY > 0 ? 1 : -1);
        }, { passive: false });

        rerender();
        waveformPager._rerenderPager = rerender;
      }

      function setBaseGain(nextGain) {
        state.baseGain = clamp(nextGain, 0.02, 0.7);
        syncWaveformGainControl();
        if (state.holdActive) audioEngine.updatePromptGain(state.chordSize === 2 ? state.targetMidis : state.targetMidi, getPromptGain());
        if (state.rangeHoldMidi !== null) startRangeHoldNote(state.rangeHoldMidi).catch(() => {});
        saveSettings();
      }

      function setMaxInterval(nextValue) {
        state.maxInterval = clamp(Math.round(nextValue), 1, 24);
        syncMaxIntervalControl();
        if (state.chordSize === 2) startNewRound();
        saveSettings();
      }

      function updateRangeText() {
        rangeText.textContent = `${midiToName(state.rangeStartMidi)}-${midiToName(state.rangeEndMidi)}`;
        syncRangeWheel(rangeStartWheel, state.rangeStartMidi);
        syncRangeWheel(rangeEndWheel, state.rangeEndMidi);
      }

      function enforceMinimumRangeSpan(changedEnd) {
        state.rangeStartMidi = clamp(state.rangeStartMidi, PIANO_MIN_MIDI, PIANO_MAX_MIDI - 1);
        state.rangeEndMidi = clamp(state.rangeEndMidi, PIANO_MIN_MIDI + 1, PIANO_MAX_MIDI);

        if (state.rangeEndMidi - state.rangeStartMidi >= 1) return;

        if (changedEnd === "start") {
          if (state.rangeStartMidi >= PIANO_MAX_MIDI) state.rangeStartMidi = PIANO_MAX_MIDI - 1;
          state.rangeEndMidi = clamp(state.rangeStartMidi + 1, PIANO_MIN_MIDI + 1, PIANO_MAX_MIDI);
          if (state.rangeEndMidi - state.rangeStartMidi < 1) {
            state.rangeStartMidi = state.rangeEndMidi - 1;
          }
          return;
        }

        if (state.rangeEndMidi <= PIANO_MIN_MIDI) state.rangeEndMidi = PIANO_MIN_MIDI + 1;
        state.rangeStartMidi = clamp(state.rangeEndMidi - 1, PIANO_MIN_MIDI, PIANO_MAX_MIDI - 1);
      }

      function applyPianoRangeStyles() {
        for (const [midi, el] of state.pianoKeyEls.entries()) {
          const isBlack = [1, 3, 6, 8, 10].includes(midi % 12);
          let fill = isBlack ? "#121926" : "#f6f8fc";
          if (midi === state.rangeStartMidi) fill = "#44d18f";
          else if (midi === state.rangeEndMidi) fill = "#ff7a7a";
          el.setAttribute("fill", fill);
        }
      }

      function setRangeStart(midi) {
        state.rangeStartMidi = clamp(midi, PIANO_MIN_MIDI, PIANO_MAX_MIDI - 1);
        enforceMinimumRangeSpan("start");
        updateRangeText();
        applyPianoRangeStyles();
        startNewRound();
        saveSettings();
      }

      function setRangeEnd(midi) {
        state.rangeEndMidi = clamp(midi, PIANO_MIN_MIDI + 1, PIANO_MAX_MIDI);
        enforceMinimumRangeSpan("end");
        updateRangeText();
        applyPianoRangeStyles();
        startNewRound();
        saveSettings();
      }

      function buildPianoSvg() {
        const NS = "http://www.w3.org/2000/svg";
        rangePiano.innerHTML = "";
        state.pianoKeyEls.clear();
        const width = 1040;
        const whiteW = width / 52;
        const whiteH = 140;
        const blackW = whiteW * 0.62;
        const blackH = 88;
        const whiteMidis = [];
        for (let midi = PIANO_MIN_MIDI; midi <= PIANO_MAX_MIDI; midi += 1) if (![1, 3, 6, 8, 10].includes(midi % 12)) whiteMidis.push(midi);
        const whiteIndexByMidi = new Map();
        whiteMidis.forEach((midi, idx) => {
          whiteIndexByMidi.set(midi, idx);
          const rect = document.createElementNS(NS, "rect");
          rect.setAttribute("x", String(idx * whiteW));
          rect.setAttribute("y", "0");
          rect.setAttribute("width", String(whiteW + 0.2));
          rect.setAttribute("height", String(whiteH));
          rect.setAttribute("stroke", "#2b3f5c");
          rect.setAttribute("stroke-width", "1");
          rect.setAttribute("class", "piano-key");
          rect.dataset.midi = String(midi);
          rangePiano.appendChild(rect);
          state.pianoKeyEls.set(midi, rect);
        });
        for (let midi = PIANO_MIN_MIDI; midi <= PIANO_MAX_MIDI; midi += 1) {
          if (![1, 3, 6, 8, 10].includes(midi % 12)) continue;
          const prevIndex = whiteIndexByMidi.get(midi - 1);
          if (prevIndex === undefined) continue;
          const rect = document.createElementNS(NS, "rect");
          rect.setAttribute("x", String((prevIndex + 1) * whiteW - blackW / 2));
          rect.setAttribute("y", "0");
          rect.setAttribute("width", String(blackW));
          rect.setAttribute("height", String(blackH));
          rect.setAttribute("stroke", "#111927");
          rect.setAttribute("stroke-width", "1");
          rect.setAttribute("class", "piano-key");
          rect.dataset.midi = String(midi);
          rangePiano.appendChild(rect);
          state.pianoKeyEls.set(midi, rect);
        }
        for (let midi = 24; midi <= 108; midi += 12) {
          const whiteIndex = whiteIndexByMidi.get(midi);
          if (whiteIndex === undefined) continue;
          const text = document.createElementNS(NS, "text");
          text.setAttribute("x", String(whiteIndex * whiteW + whiteW / 2));
          text.setAttribute("y", "133");
          text.setAttribute("text-anchor", "middle");
          text.setAttribute("class", "piano-label");
          text.textContent = `C${Math.floor(midi / 12) - 1}`;
          rangePiano.appendChild(text);
        }
        rangePiano.addEventListener("contextmenu", (event) => event.preventDefault());
        rangePiano.addEventListener("mousedown", (event) => {
          const key = event.target.closest(".piano-key");
          if (!key) return;
          event.preventDefault();
          const midi = Number(key.dataset.midi);
          if (event.button === 2) setRangeEnd(midi);
          else if (event.button === 0) setRangeStart(midi);
          else return;
          startRangeHoldNote(midi).catch(() => {});
        });
        updateRangeText();
        applyPianoRangeStyles();
      }

      function buildRangeWheels() {
        if (!rangeStartWheel || !rangeEndWheel) return;
        rangeStartWheel.innerHTML = "";
        rangeEndWheel.innerHTML = "";
        for (let midi = PIANO_MIN_MIDI; midi <= PIANO_MAX_MIDI; midi += 1) {
          const startItem = document.createElement("div");
          startItem.className = "range-wheel-item";
          if ([1, 3, 6, 8, 10].includes(midi % 12)) startItem.classList.add("is-black");
          startItem.dataset.midi = String(midi);
          startItem.textContent = midiToName(midi);
          rangeStartWheel.appendChild(startItem);
          const endItem = document.createElement("div");
          endItem.className = "range-wheel-item";
          if ([1, 3, 6, 8, 10].includes(midi % 12)) endItem.classList.add("is-black");
          endItem.dataset.midi = String(midi);
          endItem.textContent = midiToName(midi);
          rangeEndWheel.appendChild(endItem);
        }
        updateRangeText();
      }

      function midiToWheelIndex(midi) {
        return clamp(midi - PIANO_MIN_MIDI, 0, PIANO_MAX_MIDI - PIANO_MIN_MIDI);
      }

      function wheelIndexToMidi(index) {
        return clamp(PIANO_MIN_MIDI + index, PIANO_MIN_MIDI, PIANO_MAX_MIDI);
      }

      function selectedWheelMidi(wheelEl) {
        const index = Math.round(wheelEl.scrollTop / RANGE_WHEEL_ITEM_HEIGHT);
        return wheelIndexToMidi(index);
      }

      function attachDesktopWheelDrag(wheelEl, which) {
        if (!wheelEl) return;
        const scroller = wheelEl.parentElement;
        if (!scroller) return;
        let dragging = false;
        let startY = 0;
        let startScrollTop = 0;
        let moved = false;

        scroller.addEventListener("pointerdown", (event) => {
          if (event.pointerType === "touch" || event.button !== 0) return;
          dragging = true;
          moved = false;
          startY = event.clientY;
          startScrollTop = wheelEl.scrollTop;
          scroller.classList.add("is-dragging");
          scroller.setPointerCapture(event.pointerId);
          event.preventDefault();
        });

        scroller.addEventListener("pointermove", (event) => {
          if (!dragging) return;
          const delta = event.clientY - startY;
          if (Math.abs(delta) > 3) moved = true;
          wheelEl.scrollTop = startScrollTop - delta;
          updateWheelSelectionClass(wheelEl, selectedWheelMidi(wheelEl));
          event.preventDefault();
        });

        const finishDrag = (event) => {
          if (!dragging) return;
          dragging = false;
          scroller.classList.remove("is-dragging");
          if (event && scroller.hasPointerCapture && scroller.hasPointerCapture(event.pointerId)) {
            scroller.releasePointerCapture(event.pointerId);
          }
          scheduleRangeWheelSnap(which);
        };

        scroller.addEventListener("pointerup", finishDrag);
        scroller.addEventListener("pointercancel", finishDrag);
        scroller.addEventListener("lostpointercapture", () => {
          if (!dragging) return;
          dragging = false;
          scroller.classList.remove("is-dragging");
          scheduleRangeWheelSnap(which);
        });

        wheelEl.addEventListener("click", (event) => {
          if (!moved) return;
          event.preventDefault();
          event.stopPropagation();
          moved = false;
        }, true);
      }

      function updateWheelSelectionClass(wheelEl, midi) {
        if (!wheelEl) return;
        for (const item of wheelEl.children) {
          item.classList.toggle("is-selected", Number(item.dataset.midi) === midi);
        }
      }

      function syncRangeWheel(wheelEl, midi, immediate = true) {
        if (!wheelEl) return;
        const top = midiToWheelIndex(midi) * RANGE_WHEEL_ITEM_HEIGHT;
        if (immediate) wheelEl.scrollTop = top;
        else wheelEl.scrollTo({ top, behavior: "smooth" });
        updateWheelSelectionClass(wheelEl, midi);
      }

      function snapRangeWheel(which) {
        const wheelEl = which === "start" ? rangeStartWheel : rangeEndWheel;
        if (!wheelEl) return;
        const midi = selectedWheelMidi(wheelEl);
        if (which === "start") setRangeStart(midi);
        else setRangeEnd(midi);
        syncRangeWheel(wheelEl, midi, false);
      }

      function scheduleRangeWheelSnap(which) {
        const timerKey = which === "start" ? "start" : "end";
        if (state.rangeWheelSnapTimers[timerKey]) window.clearTimeout(state.rangeWheelSnapTimers[timerKey]);
        state.rangeWheelSnapTimers[timerKey] = window.setTimeout(() => {
          state.rangeWheelSnapTimers[timerKey] = null;
          snapRangeWheel(which);
        }, 90);
      }

      function chooseMidiForPc(pc) {
        const candidates = [];
        for (let midi = state.rangeStartMidi; midi <= state.rangeEndMidi; midi += 1) if (midi % 12 === pc) candidates.push(midi);
        return candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : null;
      }

      function activePitchClasses() {
        return state.pitchClasses.filter((pitch) => pitch.active);
      }

      function pcsAvailableInRange() {
        const out = new Set();
        for (let midi = state.rangeStartMidi; midi <= state.rangeEndMidi; midi += 1) out.add(midi % 12);
        return out;
      }

      function pitchColor(pc, lightness, chroma) {
        return `oklch(${lightness} ${chroma} ${PITCH_HUES[pc]})`;
      }

      function polarPoint(cx, cy, radius, angle) {
        return { x: cx + Math.cos(angle) * radius, y: cy + Math.sin(angle) * radius };
      }

      function sectorPath(cx, cy, rInner, rOuter, start, end) {
        const p1 = polarPoint(cx, cy, rOuter, start);
        const p2 = polarPoint(cx, cy, rOuter, end);
        const p3 = polarPoint(cx, cy, rInner, end);
        const p4 = polarPoint(cx, cy, rInner, start);
        const large = end - start > Math.PI ? 1 : 0;
        return `M ${p1.x} ${p1.y} A ${rOuter} ${rOuter} 0 ${large} 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${rInner} ${rInner} 0 ${large} 0 ${p4.x} ${p4.y} Z`;
      }

      function annularSectorCentroidRadius(rInner, rOuter, theta) {
        const safeTheta = Math.max(theta, 1e-6);
        const numerator = 4 * Math.sin(safeTheta / 2) * (rOuter ** 3 - rInner ** 3);
        const denominator = 3 * safeTheta * (rOuter ** 2 - rInner ** 2);
        return numerator / denominator;
      }

      function clockDegreesToSvgRadians(clockDegrees) {
        return (clockDegrees * Math.PI) / 180 - Math.PI / 2;
      }

      function spiralPoint(cx, cy, radius, clockDegrees) {
        const angle = clockDegreesToSvgRadians(clockDegrees);
        return {
          x: cx + Math.cos(angle) * radius,
          y: cy + Math.sin(angle) * radius,
        };
      }

      function spiralSegmentGeometry(cx, cy, unitRadius, startClockDegrees, endClockDegrees, growthPerRadian, steps = 24) {
        const outerPoints = [];
        const innerPoints = [];
        for (let index = 0; index <= steps; index += 1) {
          const t = index / steps;
          const clockDegrees = startClockDegrees + (endClockDegrees - startClockDegrees) * t;
          const theta = clockDegreesToSvgRadians(clockDegrees);
          const thetaOffset = theta - clockDegreesToSvgRadians(15);
          const innerRadius = unitRadius + growthPerRadian * thetaOffset;
          const outerRadius = innerRadius + unitRadius;
          outerPoints.push(spiralPoint(cx, cy, outerRadius, clockDegrees));
          innerPoints.push(spiralPoint(cx, cy, innerRadius, clockDegrees));
        }
        const first = outerPoints[0];
        const outerPath = outerPoints.map((point) => `L ${point.x} ${point.y}`).join(" ");
        const innerPath = innerPoints.reverse().map((point) => `L ${point.x} ${point.y}`).join(" ");
        return {
          path: `M ${first.x} ${first.y} ${outerPath} ${innerPath} Z`,
          outerPoints,
          innerPoints,
        };
      }

      function drawBiphonicSpiral(NS, cx, cy) {

        const centerRadius = unitRadius;
        const growthPerRadian = unitRadius / (2 * Math.PI);
        const startClockDegrees = 15;
        const segmentDegrees = 30;

        const bounds = {
          minX: cx - centerRadius,
          maxX: cx + centerRadius,

        function includePoint(point) {

        for (let index = 0; index < segmentCount; index += 1) {
          const start = startClockDegrees + index * segmentDegrees;
          const end = start + segmentDegrees;

          const pc = index % 12;
          const hovered = state.hoveredPc === interval && state.hoveredZone === "pitch";
          let stroke = "rgba(255,255,255,0.22)";
          let strokeWidth = "1.2";
          if (state.perfectPitch.awaitingAdvance && state.targetInterval === interval) {
            stroke = "#d4af37";
            strokeWidth = "4";
          } else if (state.perfectPitch.feedbackPc === interval) {

          } else if (state.revealed && state.targetInterval === interval) {

          const segment = document.createElementNS(NS, "path");
          const geometry = spiralSegmentGeometry(cx, cy, unitRadius, start, end, growthPerRadian);
          segment.setAttribute("d", geometry.path);
          segment.setAttribute("fill", pitchColor(pc, hovered ? PITCH_HOVER_LIGHTNESS : PITCH_MUTED_LIGHTNESS, hovered ? PITCH_HOVER_CHROMA : PITCH_MUTED_CHROMA));
          segment.setAttribute("stroke", stroke);
          segment.setAttribute("stroke-width", strokeWidth);
          segment.dataset.pc = String(interval);

          wheelSvg.appendChild(segment);
          geometry.outerPoints.forEach(includePoint);
          geometry.innerPoints.forEach(includePoint);

          const labelAngle = start + segmentDegrees / 2;
          const labelThetaOffset = clockDegreesToSvgRadians(labelAngle) - clockDegreesToSvgRadians(15);
          const labelInnerRadius = unitRadius + growthPerRadian * labelThetaOffset;
          const labelOuterRadius = labelInnerRadius + unitRadius;
          const labelPoint = spiralPoint(cx, cy, (labelInnerRadius + labelOuterRadius) / 2, labelAngle);
          includePoint({ x: labelPoint.x - 24, y: labelPoint.y - 10 });
          includePoint({ x: labelPoint.x + 24, y: labelPoint.y + 10 });
          const label = document.createElementNS(NS, "text");
          label.setAttribute("x", String(labelPoint.x));

          label.setAttribute("text-anchor", "middle");
          label.setAttribute("dominant-baseline", "middle");
          label.setAttribute("fill", "#ffffff");

          label.setAttribute("font-weight", "700");
          label.setAttribute("font-family", "Avenir Next, Trebuchet MS, sans-serif");
          label.setAttribute("pointer-events", "none");
          label.textContent = INTERVAL_NAMES[interval];
          wheelSvg.appendChild(label);
        }

        const centerCircle = document.createElementNS(NS, "circle");
        centerCircle.setAttribute("cx", String(cx));
        centerCircle.setAttribute("cy", String(cy));
        centerCircle.setAttribute("r", String(centerRadius));
        centerCircle.setAttribute("fill", "rgba(8, 14, 22, 0.95)");
        centerCircle.setAttribute("stroke", "rgba(255,255,255,0.24)");
        centerCircle.setAttribute("stroke-width", "2");
        centerCircle.dataset.centerControl = "true";
        wheelSvg.appendChild(centerCircle);
        bg.setAttribute("x", String(bounds.minX - 18));
        bg.setAttribute("y", String(bounds.minY - 18));
        bg.setAttribute("width", String(bounds.maxX - bounds.minX + 36));
        bg.setAttribute("height", String(bounds.maxY - bounds.minY + 36));
        bg.setAttribute("rx", "18");
        return { bounds, centerRadius };
      }

          pitchPath.setAttribute("stroke", stroke);
          pitchPath.setAttribute("stroke-width", strokeWidth);

          pitchPath.dataset.zone = "pitch";

          const angle = (start + end) / 2;

        const centerCircle = document.createElementNS(NS, "circle");
        centerCircle.setAttribute("cx", String(cx));

        centerCircle.setAttribute("stroke", "rgba(255,255,255,0.24)");

        const streak = currentStreak();

          streakText.setAttribute("x", String(cx));
          streakText.setAttribute("y", String(cy - 62));
          streakText.setAttribute("text-anchor", "middle");
          streakText.setAttribute("dominant-baseline", "middle");
          streakText.setAttribute("fill", "#ffb14a");
          streakText.setAttribute("font-size", String(String(streak).length >= 3 ? 17 : 19));

          streakText.textContent = `🔥${streak}🔥`;

        scoreText.dataset.centerControl = "true";

        wheelSvg.appendChild(scoreText);

      function wheelPointToPc(event) {
        const target = event.target.closest("[data-pc]");
        if (!target) return null;
        return { pc: Number(target.dataset.pc), zone: target.dataset.zone };
      }

      function togglePitchClassActive(pc) {
        const pitch = state.pitchClasses[pc];
        pitch.active = !pitch.active;
        if (!activePitchClasses().length) pitch.active = true;
        startNewRound();
        saveSettings();
      }

      function chooseRandomInterval() {
        const maxInterval = maxDisplayedInterval();
        const options = [];
        for (let interval = 1; interval <= maxInterval; interval += 1) options.push(interval);
        const distinct = state.targetInterval == null ? options : options.filter((interval) => interval !== state.targetInterval);
        const pool = distinct.length ? distinct : options;
        return pool[Math.floor(Math.random() * pool.length)];
      }

      function chooseDyadForInterval(interval) {
        const roots = [];
        for (let midi = state.rangeStartMidi; midi + interval <= state.rangeEndMidi; midi += 1) roots.push(midi);
        if (!roots.length) return null;
        const root = roots[Math.floor(Math.random() * roots.length)];
        return [root, root + interval];
      }

      function startNewRound() {
        stopHoldCurrentNote();
        if (state.chordSize === 2) {
          const interval = chooseRandomInterval();
          const midis = chooseDyadForInterval(interval);
          if (!midis) return;
          state.targetPc = null;
          state.targetMidi = null;
          state.targetInterval = interval;
          state.targetMidis = midis;
          state.revealed = false;
          state.perfectPitch.feedbackPc = null;
          state.perfectPitch.feedbackKind = null;
          state.perfectPitch.awaitingAdvance = false;
          state.perfectPitch.awaitingRelease = false;
          state.perfectPitch.releaseTriggerType = null;
          state.perfectPitch.releaseTriggerCode = null;
          if (state.playContinuously) startHoldCurrentNote().catch(() => {});
          drawWheel();
          saveSettings();
          return;
        }
        const active = activePitchClasses().filter((pitch) => pcsAvailableInRange().has(pitch.pc));
        if (!active.length) return;
        const previousPc = state.targetPc;
        const distinct = previousPc === null ? active : active.filter((pitch) => pitch.pc !== previousPc);
        const chosenPc = (distinct.length ? distinct : active)[Math.floor(Math.random() * (distinct.length ? distinct : active).length)].pc;
        const midi = chooseMidiForPc(chosenPc);
        if (midi === null) return;
        state.targetPc = chosenPc;
        state.targetMidi = midi;
        state.revealed = false;
        state.perfectPitch.feedbackPc = null;
        state.perfectPitch.feedbackKind = null;
        state.perfectPitch.awaitingAdvance = false;
        state.perfectPitch.awaitingRelease = false;
        state.perfectPitch.releaseTriggerType = null;
        state.perfectPitch.releaseTriggerCode = null;
        if (state.playContinuously) startHoldCurrentNote().catch(() => {});
        drawWheel();
        saveSettings();
      }

      function beginAdvanceOnRelease(triggerType, triggerCode) {
        state.perfectPitch.awaitingRelease = true;
        state.perfectPitch.releaseTriggerType = triggerType;
        state.perfectPitch.releaseTriggerCode = triggerCode;
      }

      function maybeAdvanceOnRelease(triggerType, triggerCode) {
        if (!state.perfectPitch.awaitingRelease) return;
        if (state.perfectPitch.releaseTriggerType !== triggerType) return;
        if (state.perfectPitch.releaseTriggerCode !== triggerCode) return;
        startNewRound();
      }

      function updateDailyScore(correct) {
        const key = scoreKeyFor(yyMmDd(), state.chordSize);
        const entry = state.perfectPitch.scoreByDateAndChordSize[key] || [0, 0, state.chordSize];
        entry[1] += 1;
        if (correct) entry[0] += 1;
        entry[2] = state.chordSize;
        state.perfectPitch.scoreByDateAndChordSize[key] = entry;
        saveDailyLog();
      }

      function handleGuess(pc, triggerType, triggerCode) {
        if (state.chordSize === 2) {
          if (state.targetInterval === null || state.perfectPitch.awaitingRelease) return;
          if (state.perfectPitch.awaitingAdvance) {
            if (pc === state.targetInterval) {
              state.perfectPitch.feedbackPc = pc;
              state.perfectPitch.feedbackKind = "correct";
              beginAdvanceOnRelease(triggerType, triggerCode);
              drawWheel();
            } else {
              state.perfectPitch.feedbackPc = pc;
              state.perfectPitch.feedbackKind = "wrong";
              drawWheel();
            }
            return;
          }
          if (pc === state.targetInterval) {
            updateDailyScore(true);
            state.perfectPitch.feedbackPc = pc;
            state.perfectPitch.feedbackKind = "correct";
            beginAdvanceOnRelease(triggerType, triggerCode);
            drawWheel();
            saveSettings();
            return;
          }
          state.perfectPitch.feedbackPc = pc;
          state.perfectPitch.feedbackKind = "wrong";
          updateDailyScore(false);
          state.revealed = true;
          state.perfectPitch.awaitingAdvance = true;
          drawWheel();
          saveSettings();
          return;
        }
        if (state.targetPc === null || !state.pitchClasses[pc].active || state.perfectPitch.awaitingRelease) return;
        if (state.perfectPitch.awaitingAdvance) {
          if (pc === state.targetPc) {
            state.perfectPitch.feedbackPc = pc;
            state.perfectPitch.feedbackKind = "correct";
            beginAdvanceOnRelease(triggerType, triggerCode);
            drawWheel();
          } else {
            state.perfectPitch.feedbackPc = pc;
            state.perfectPitch.feedbackKind = "wrong";
            drawWheel();
          }
          return;
        }
        if (pc === state.targetPc) {
          updateDailyScore(true);
          state.perfectPitch.feedbackPc = pc;
          state.perfectPitch.feedbackKind = "correct";
          beginAdvanceOnRelease(triggerType, triggerCode);
          drawWheel();
          saveSettings();
          return;
        }
        state.perfectPitch.feedbackPc = pc;
        state.perfectPitch.feedbackKind = "wrong";
        updateDailyScore(false);
        state.revealed = true;
        state.perfectPitch.awaitingAdvance = true;
        drawWheel();
        saveSettings();
      }

      async function startHoldCurrentNote() {
        if (state.chordSize === 2) {
          if (!state.targetMidis) return;
          state.holdActive = true;
          await audioEngine.startPrompt(state.targetMidis, getPromptGain());
          return;
        }
        if (state.targetMidi === null) return;
        state.holdActive = true;
        await audioEngine.startPrompt(state.targetMidi, getPromptGain());
      }

      function stopHoldCurrentNote() {
        state.holdActive = false;
        audioEngine.stopPrompt();
      }

      async function startRangeHoldNote(midi) {
        state.rangeHoldMidi = midi;
        if (state.playContinuously && state.holdActive) stopHoldCurrentNote();
        state.rangeHoldHandle = await audioEngine.startNote(midi, getPromptGain());
      }

      function stopRangeHoldNote() {
        if (state.rangeHoldHandle) state.rangeHoldHandle.stop();
        state.rangeHoldHandle = null;
        state.rangeHoldMidi = null;
      }

      function syncContinuousPlaybackAfterGesture(skipStart = false) {
        if (!audioEngine.unlocked || skipStart || !state.playContinuously || state.targetMidi === null || state.holdActive) return;
        startHoldCurrentNote().catch(() => {});
      }

      function primeAudioOnGesture(skipContinuousStart = false) {
        audioEngine.ensureContext().then(() => syncContinuousPlaybackAfterGesture(skipContinuousStart)).catch(() => {});
      }

      function setPlayContinuously(nextValue) {
        state.playContinuously = nextValue;
        stopHoldCurrentNote();
        if (state.playContinuously) startHoldCurrentNote().catch(() => {});
        syncControls();
        saveSettings();
      }

      function setTodayOnlyScore(nextValue) {
        state.todayOnlyScore = nextValue;
        syncControls();
        drawWheel();
        saveSettings();
      }

      function setChordSize(nextValue) {
        if (![1, 2, 3, 4].includes(nextValue)) return;
        state.chordSize = nextValue;
        syncControls();
        drawWheel();
        saveSettings();
      }

      function downloadDailyCsv() {
        const csv = scoreByDateToCsv(state.perfectPitch.scoreByDateAndChordSize);
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `ear-training-logs-${yyMmDd()}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      }

      if (gainBox) {
        gainBox.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          state.gainDrag = {
            pointerId: event.pointerId,
            startY: event.clientY,
            startGain: state.baseGain,
          };
          gainBox.setPointerCapture(event.pointerId);
        });
        gainBox.addEventListener("pointermove", (event) => {
          if (!state.gainDrag || event.pointerId !== state.gainDrag.pointerId) return;
          event.preventDefault();
          const deltaY = state.gainDrag.startY - event.clientY;
          const gainSpan = 0.68;
          const nextGain = state.gainDrag.startGain + (deltaY / 240) * gainSpan;
          setBaseGain(nextGain);
        });
        const finishGainDrag = (event) => {
          if (!state.gainDrag || event.pointerId !== state.gainDrag.pointerId) return;
          if (gainBox.hasPointerCapture && gainBox.hasPointerCapture(event.pointerId)) {
            gainBox.releasePointerCapture(event.pointerId);
          }
          state.gainDrag = null;
        };
        gainBox.addEventListener("pointerup", finishGainDrag);
        gainBox.addEventListener("pointercancel", finishGainDrag);
        gainBox.addEventListener("wheel", (event) => {
          event.preventDefault();
          const step = event.deltaY > 0 ? -0.01 : 0.01;
          setBaseGain(state.baseGain + step);
        }, { passive: false });
      }

      if (maxIntervalBox) {
        maxIntervalBox.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          state.maxIntervalDrag = {
            pointerId: event.pointerId,
            startY: event.clientY,
            startValue: state.maxInterval,
          };
          maxIntervalBox.setPointerCapture(event.pointerId);
        });
        maxIntervalBox.addEventListener("pointermove", (event) => {
          if (!state.maxIntervalDrag || event.pointerId !== state.maxIntervalDrag.pointerId) return;
          event.preventDefault();
          const deltaY = state.maxIntervalDrag.startY - event.clientY;
          const nextValue = state.maxIntervalDrag.startValue + deltaY / 12;
          setMaxInterval(nextValue);
        });
        const finishMaxIntervalDrag = (event) => {
          if (!state.maxIntervalDrag || event.pointerId !== state.maxIntervalDrag.pointerId) return;
          if (maxIntervalBox.hasPointerCapture && maxIntervalBox.hasPointerCapture(event.pointerId)) {
            maxIntervalBox.releasePointerCapture(event.pointerId);
          }
          state.maxIntervalDrag = null;
        };
        maxIntervalBox.addEventListener("pointerup", finishMaxIntervalDrag);
        maxIntervalBox.addEventListener("pointercancel", finishMaxIntervalDrag);
        maxIntervalBox.addEventListener("wheel", (event) => {
          event.preventDefault();
          const step = event.deltaY > 0 ? -1 : 1;
          setMaxInterval(state.maxInterval + step);
        }, { passive: false });
      }

      playModePressBtn.parentElement.addEventListener("click", () => {
        setPlayContinuously(!state.playContinuously);
      });

      scoreModeTodayBtn.parentElement.addEventListener("click", () => {
        setTodayOnlyScore(!state.todayOnlyScore);
      });

      chordSizeGroup.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        const nextValue = Number(button.textContent);
        if (!Number.isFinite(nextValue)) return;
        setChordSize(nextValue);
      });

      if (rangeStartWheel) {
        attachDesktopWheelDrag(rangeStartWheel, "start");
        rangeStartWheel.addEventListener("scroll", () => {
          updateWheelSelectionClass(rangeStartWheel, selectedWheelMidi(rangeStartWheel));
          if (rangeStartWheel.parentElement?.classList.contains("is-dragging")) return;
          scheduleRangeWheelSnap("start");
        });
        rangeStartWheel.addEventListener("pointerup", () => scheduleRangeWheelSnap("start"));
        rangeStartWheel.addEventListener("touchend", () => scheduleRangeWheelSnap("start"), { passive: true });
        rangeStartWheel.addEventListener("click", (event) => {
          const item = event.target.closest(".range-wheel-item");
          if (!item) return;
          const midi = Number(item.dataset.midi);
          setRangeStart(midi);
          audioEngine.playForDuration(midi, getPromptGain(), 500).catch(() => {});
          syncRangeWheel(rangeStartWheel, state.rangeStartMidi, false);
        });
      }
      if (rangeEndWheel) {
        attachDesktopWheelDrag(rangeEndWheel, "end");
        rangeEndWheel.addEventListener("scroll", () => {
          updateWheelSelectionClass(rangeEndWheel, selectedWheelMidi(rangeEndWheel));
          if (rangeEndWheel.parentElement?.classList.contains("is-dragging")) return;
          scheduleRangeWheelSnap("end");
        });
        rangeEndWheel.addEventListener("pointerup", () => scheduleRangeWheelSnap("end"));
        rangeEndWheel.addEventListener("touchend", () => scheduleRangeWheelSnap("end"), { passive: true });
        rangeEndWheel.addEventListener("click", (event) => {
          const item = event.target.closest(".range-wheel-item");
          if (!item) return;
          const midi = Number(item.dataset.midi);
          setRangeEnd(midi);
          audioEngine.playForDuration(midi, getPromptGain(), 500).catch(() => {});
          syncRangeWheel(rangeEndWheel, state.rangeEndMidi, false);
        });
      }
      downloadCsvBtn.addEventListener("click", downloadDailyCsv);

      wheelSvg.addEventListener("mousemove", (event) => {
        const hit = wheelPointToPc(event);
        const hoveredPc = hit ? hit.pc : null;
        const hoveredZone = hit ? hit.zone : null;
        if (hoveredPc !== state.hoveredPc || hoveredZone !== state.hoveredZone) {
          state.hoveredPc = hoveredPc;
          state.hoveredZone = hoveredZone;
          drawWheel();
        }
      });

      wheelSvg.addEventListener("mouseleave", () => {
        state.hoveredPc = null;
        state.hoveredZone = null;
        drawWheel();
      });

      wheelSvg.addEventListener("click", (event) => {
        const hit = wheelPointToPc(event);
        if (hit && hit.zone === "toggle") togglePitchClassActive(hit.pc);
      });

      wheelSvg.addEventListener("pointerdown", (event) => {
        const centerControl = event.target.closest("[data-center-control]");
        if (centerControl) {
          event.preventDefault();
          event.stopPropagation();
          if (state.playContinuously) stopHoldCurrentNote();
          else startHoldCurrentNote().catch(() => {});
          return;
        }
        const hit = wheelPointToPc(event);
        if (!hit || hit.zone !== "pitch") return;
        event.preventDefault();
        handleGuess(hit.pc, "pointer", String(hit.pc));
      });

      wheelSvg.addEventListener("pointerup", (event) => {
        const centerControl = event.target.closest("[data-center-control]");
        if (centerControl) {
          event.preventDefault();
          event.stopPropagation();
          if (state.playContinuously) startHoldCurrentNote().catch(() => {});
          else stopHoldCurrentNote();
        }
      });

      wheelSvg.addEventListener("pointercancel", () => {
        if (state.playContinuously) startHoldCurrentNote().catch(() => {});
        else stopHoldCurrentNote();
      });

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space") event.preventDefault();
        if (event.repeat || event.metaKey || event.ctrlKey || event.altKey) return;
        primeAudioOnGesture(event.code === "Space");
        if (event.code === "Space") {
          if (state.playContinuously) stopHoldCurrentNote();
          else startHoldCurrentNote().catch(() => {});
          return;
        }
        const pc = KEY_TO_PC[event.code];
        if (pc === undefined) return;
        event.preventDefault();
        handleGuess(pc, "key", event.code);
      });

      window.addEventListener("pointerdown", () => {
        primeAudioOnGesture();
      });

      window.addEventListener("pointerup", () => {
        maybeAdvanceOnRelease("pointer", String(state.chordSize === 2 ? state.targetInterval : state.targetPc));
      });

      window.addEventListener("mouseup", stopRangeHoldNote);

      window.addEventListener("keyup", (event) => {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        if (event.code === "Space") {
          event.preventDefault();
          if (state.playContinuously) startHoldCurrentNote().catch(() => {});
          else stopHoldCurrentNote();
          return;
        }
        maybeAdvanceOnRelease("key", event.code);
      });

      window.addEventListener("blur", () => {
        stopHoldCurrentNote();
        stopRangeHoldNote();
      });
      let lastMobileLayout = isMobileLayout();
      window.addEventListener("resize", () => {
        const mobileLayout = isMobileLayout();
        if (mobileLayout !== lastMobileLayout) {
          updateRangeText();
          lastMobileLayout = mobileLayout;
        }
        drawWheel();
      });

      loadSettings();
      enforceMinimumRangeSpan("start");
      state.perfectPitch.scoreByDateAndChordSize = loadDailyLog();
      setupWaveformPager();
      syncControls();
      buildPianoSvg();
      buildRangeWheels();
      drawWheel();
      startNewRound();
      if (state.playContinuously) startHoldCurrentNote().catch(() => {});
      window.addEventListener("resize", syncControls);
    </script>
  </body>
</html>
