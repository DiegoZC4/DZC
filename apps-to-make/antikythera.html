<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antikythera Dial Bench</title><link rel="stylesheet" href="draft.css"><style>
.stage{display:grid;place-items:center;background:radial-gradient(circle,#2f4947,#152625)}.mechanism{width:min(82dvh,92vw,850px);aspect-ratio:1;filter:drop-shadow(0 22px 30px #0008)}svg{width:100%;height:100%;display:block}.bronze{fill:#ad713d;stroke:#422f22;stroke-width:3}.bronze2{fill:#d39a59;stroke:#422f22;stroke-width:3}.dial{fill:#e2c38d;stroke:#422f22;stroke-width:4}.tick{stroke:#6c482d;stroke-width:2}.hand{stroke:#8f2720;stroke-width:5;stroke-linecap:round}.label{font:16px "Avenir Next Condensed",sans-serif;fill:#2e271f;text-anchor:middle}.small{font-size:11px}.value{font:600 1.15rem monospace}.ratio{display:flex;justify-content:space-between;padding:.55rem;border-bottom:1px solid #bcb39f77}.crank-row{display:grid;grid-template-columns:1fr auto;gap:.6rem;align-items:center}input[type=range]{padding:0}.play{width:100%}.caveat{font-size:.82rem;color:var(--muted)}
</style></head><body><main class="app"><header class="topbar"><h1>Antikythera Dial Bench</h1><span class="kicker">calendar gear-ratio sketch</span></header><div class="workspace"><aside class="sidebar stack"><div class="eyebrow">Crank date</div><div class="crank-row"><input id="days" type="range" min="0" max="6939" value="0" step="1"><span class="value" id="dayValue">0 d</span></div><button class="primary play" id="play">Turn crank</button><div class="ratio"><span>Solar year</span><strong>365.242 d</strong></div><div class="ratio"><span>Synodic month</span><strong>29.531 d</strong></div><div class="ratio"><span>Metonic cycle</span><strong>235 : 19 y</strong></div><div class="ratio"><span>Saros cycle</span><strong>223 months</strong></div><label>Speed<input id="speed" type="range" min="1" max="40" value="8"></label><p class="caveat">This is an explanatory ratio model, not a reconstruction of the surviving tooth counts or missing gearing.</p></aside><section class="stage"><div class="mechanism"><svg viewBox="0 0 700 700" aria-label="Animated calendar mechanism"><defs><filter id="rough"><feTurbulence baseFrequency=".45" numOctaves="2" seed="7" result="n"/><feBlend in="SourceGraphic" in2="n" mode="multiply"/></filter></defs><circle cx="350" cy="350" r="330" fill="#725239" stroke="#d0a36b" stroke-width="9"/><g id="gearYear"><path class="bronze" d="M350 78l14 20 24-13 7 24 27-5v25l27 4-7 24 24 13-14 21 20 18-19 17 15 22-23 12 9 25-27 5 2 26-27-2-5 26-25-9-12 23-22-15-17 19-18-20-21 14-13-24-24 7-4-27h-26l5-27-24-7 13-24-20-14 14-21-19-18 19-17-14-22 23-12-8-25 26-5-2-26 27 2 5-26 25 9 12-23 22 15 17-19 18 20 21-14 13 24 24-7 4 27h26l-5 27 24 7-13 24 20 14-14 21 19 18-19 17 14 22-23 12 8 25-26 5 2 26-27-2-5 26-25-9-12 23-22-15-17 19-18-20-21 14-13-24-24 7-4-27h-26l5-27-24-7 13-24-20-14 14-21-19-18 19-17-14-22 23-12-8-25 26-5-2-26 27 2 5-26 25 9 12-23 22 15 17-19 18 20z" transform="translate(350 350) scale(.64) translate(-350 -350)"/><circle class="dial" cx="350" cy="350" r="115"/><text class="label" x="350" y="300">SOLAR</text><text class="label small" x="350" y="322">365.242 DAYS</text><line class="hand" id="sunHand" x1="350" y1="350" x2="350" y2="258"/><circle cx="350" cy="350" r="8" fill="#422f22"/></g><g id="moonGear"><circle class="bronze2" cx="525" cy="225" r="74"/><circle class="dial" cx="525" cy="225" r="50"/><line class="hand" id="moonHand" x1="525" y1="225" x2="525" y2="185"/><text class="label small" x="525" y="285">MOON</text></g><g id="metonic"><circle class="dial" cx="188" cy="490" r="92"/><circle cx="188" cy="490" r="70" fill="none" stroke="#6c482d" stroke-width="2" stroke-dasharray="3 8"/><line class="hand" id="metonicHand" x1="188" y1="490" x2="188" y2="420"/><text class="label small" x="188" y="610">METONIC · 19 Y</text></g><g id="saros"><circle class="dial" cx="515" cy="500" r="88"/><path d="M515 500c0-38 55-38 55 0s-55 38-55 0-55-38-55 0 55 38 55 0" fill="none" stroke="#6c482d" stroke-width="3"/><line class="hand" id="sarosHand" x1="515" y1="500" x2="515" y2="430"/><text class="label small" x="515" y="612">SAROS · 223 M</text></g></svg></div></section></div></main><script>
const $=id=>document.getElementById(id);let playing=false,last=0,days=0;const period={sun:365.2422,moon:29.53059,metonic:6939.688,saros:6585.321};
function rotate(id,turns,cx,cy){$(id).setAttribute('transform',`rotate(${turns*360} ${cx} ${cy})`)}function render(){days=Number($('days').value);$('dayValue').textContent=Math.round(days)+' d';rotate('sunHand',days/period.sun,350,350);rotate('moonHand',days/period.moon,525,225);rotate('metonicHand',days/period.metonic,188,490);rotate('sarosHand',days/period.saros,515,500);$('gearYear').style.transformOrigin='350px 350px';$('moonGear').style.transformOrigin='525px 225px';$('moonGear').style.transform=`rotate(${-days/period.moon*18}deg)`}
function tick(t){if(!playing)return;const dt=Math.min(50,t-last);last=t;$('days').value=(Number($('days').value)+dt*.01*Number($('speed').value))%6939;render();requestAnimationFrame(tick)}$('days').oninput=render;$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause crank':'Turn crank';if(playing){last=performance.now();requestAnimationFrame(tick)}};render();
</script></body></html>
