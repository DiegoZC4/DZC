<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alg Cycles</title>
  <style>
pllControls { margin-bottom: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
:root {
controls { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  --bg: #0f1115;
      --panel: rgba(15,23,42,.95);
      --border: #334155;
      --text: #e2e8f0;
      --muted: #93a0b4;
    }
    html, body { width: 100%; height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: ui-monospace, Menlo, monospace; overflow: hidden; }
    #graph { width: 100%; height: 100%; }
    #panel { position: absolute; top: 10px; right: 10px; z-index: 10; max-width: 440px; max-height: 82vh; overflow: auto; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
    #title { font-weight: 700; }
    #hint { margin-top: 4px; color: var(--muted); font-size: 12px; }
    #controls { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .toggleHint { margin-left: 4px; align-self: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
    button { background: #111827; color: var(--text); border: 1px solid #475569; border-radius: 6px; padding: 4px 8px; cursor: pointer; font: inherit; }
    #spreadRow { margin-top: 8px; font-size: 12px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
    #spreadRange { width: 100%; }
    #filterGrid { margin-top: 8px; display: grid; grid-template-columns: repeat(4, minmax(80px, 1fr)); gap: 6px; font-size: 12px; }
    .it { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .it input { margin: 0; }

    #tabBar { position: absolute; top: 10px; left: 10px; z-index: 20; display: flex; gap: 8px; }
    .tabBtn { background: #111827; color: var(--text); border: 1px solid #475569; border-radius: 7px; padding: 6px 10px; cursor: pointer; }
    .tabBtn.active { border-color: #22c55e; box-shadow: inset 0 0 0 1px rgba(34,197,94,.45); }
    #pllPane { position: absolute; inset: 0; z-index: 12; overflow: hidden; }
    #pllPane.hidden { display: none; }
    #pllCyclesText { margin: 0; white-space: pre; font-size: 12px; line-height: 1.35; }
    #pllGraph2d { width: 100%; height: 100%; background: #0f1115; }
    #pllPanel { position: absolute; top: 10px; right: 10px; z-index: 14; max-width: 440px; max-height: 82vh; overflow: auto; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
    #pllControls { margin-bottom: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    #pllFilterGrid { margin: 8px 0 10px 0; display: grid; grid-template-columns: repeat(6, minmax(54px, 1fr)); gap: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="tabBar">
    <button id="tabOllBtn" class="tabBtn active" type="button">OLL</button>
    <button id="tabPllBtn" class="tabBtn" type="button">PLL</button>
  </div>
  <div id="graph"></div>
  <aside id="panel">
    <div id="title">OLL Cycles 3D</div>
    <div id="hint">Toggle edge visibility by case (edge weight).</div>
    <div id="controls">
      <button id="allBtn" type="button">All</button>
      <button id="noneBtn" type="button">None</button>
      <span class="toggleHint">Enter key to toggle</span>
    </div>
    <div id="spreadRow">
      <span>Spread</span>
      <input id="spreadRange" type="range" min="0.6" max="8" step="0.05" value="4" />
      <span id="spreadValue">4.00x</span>
    </div>
    <div id="filterGrid"></div>
  </aside>

  <section id="pllPane" class="hidden">
    <div id="pllGraph2d"></div>
    <aside id="pllPanel">
      <div id="title">PLL Cycles 3D</div>
      <div id="hint">Toggle edge visibility by case (edge weight).</div>
      <div id="pllControls">
        <button id="pllAllBtn" type="button">All</button>
        <button id="pllNoneBtn" type="button">None</button>
        <span class="toggleHint">Enter key to toggle</span>
      </div>
      <div id="pllFilterGrid"></div>
    </aside>
    <pre id="pllCyclesText" style="display:none"></pre>
  </section>

  <script>
    const OLL_APP = JSON.parse(document.getElementById('ollAppearanceJson').textContent || '{\"appearance\":{}}');
    const OLL_CYCLES = JSON.parse(document.getElementById('ollCyclesJson').textContent || '{\"cycles\":{}}');
    const PLL_JSON = JSON.parse(document.getElementById('pllJson').textContent || '{\"cases\":{}}');
    const PLL_CYCLES = JSON.parse(document.getElementById('pllCyclesJson').textContent || '{\"cycles\":{}}');
    const appearance = OLL_APP.appearance || {};
    // Hardcoded solved OLL appearance (OLL 0)
    appearance["0"] = "000011100111001110000";
    const cycles = OLL_CYCLES.cycles || {};

    const nodeSet = new Set(['0']);
    for (const [w, arr] of Object.entries(cycles)) {
      nodeSet.add(String(w));
      for (const v of (arr || [])) if (v != null) nodeSet.add(String(v));
    }

    const numericKey = (s) => {
      const m = String(s).match(/(\d+)/);
      return m ? Number(m[1]) : Number.POSITIVE_INFINITY;
    };

    const nodes = [...nodeSet].sort((a,b) => {
      const na = numericKey(a), nb = numericKey(b);
      if (Number.isFinite(na) && Number.isFinite(nb) && na !== nb) return na - nb;
      return String(a).localeCompare(String(b));
    }).map((id, i) => {
      const x = ((i * 37) % 19 - 9) * 18;
      const y = ((i * 53) % 17 - 8) * 18;
      const z = ((i * 61) % 23 - 11) * 18;
      if (id === '0') return { id, x: 0, y: 0, z: 0, fx: 0, fy: 0, fz: 0 };
      return { id, x, y, z };
    });

    const links = [];
    for (const [weight, seqRaw] of Object.entries(cycles)) {
      const seq = (Array.isArray(seqRaw) ? seqRaw.slice() : []).filter(v => v != null).map(String);
      seq.push('0');
      if (!seq.length) continue;
      for (let i = 0; i < seq.length; i += 1) {
        const src = seq[i];
        const dst = seq[(i + 1) % seq.length];
        links.push({
          source: src,
          target: dst,
          weight: String(weight),
          label: String(weight),
          color: edgeColorByStep(i, seq.length)
        });
      }
    }
    // 3D curve spread for OLL edges to avoid overlap/strobing (including self-links).
    const ollByPair = new Map();
    for (const e of links) {
      const key = `${e.source}=>${e.target}`;
      if (!ollByPair.has(key)) ollByPair.set(key, []);
      ollByPair.get(key).push(e);
    }
    for (const [key, arr] of ollByPair.entries()) {
      const [a, b] = key.split('=>');
      const isSelf = a === b;
      const n = arr.length;
      for (let i = 0; i < n; i += 1) {
        const t = n <= 1 ? 0 : (i / (n - 1)) * 2 - 1;
        if (isSelf) {
          arr[i].curvature = 1.2 + Math.abs(t) * 0.8;
          arr[i].curveRotation = t * Math.PI;
        } else {
          arr[i].curvature = 0.45 + Math.abs(t) * 0.55;
          arr[i].curveRotation = t * (Math.PI * 0.9);
        }
      }
    }

    const data = { nodes, links };
    const allWeights = [...new Set(data.links.map(l => String(l.weight)))].sort((a,b) => {
      const na = numericKey(a), nb = numericKey(b);
      if (Number.isFinite(na) && Number.isFinite(nb) && na !== nb) return na - nb;
      return a.localeCompare(b);
    });
    const OLL_SELECTED_KEY = 'algCycles.ollSelected.v1';
    const PLL_SELECTED_KEY = 'algCycles.pllSelected.v1';

    function loadSelectionSet(key, allowedValues) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return new Set(allowedValues);
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return new Set(allowedValues);
        const allowed = new Set(allowedValues);
        const out = parsed.filter(v => allowed.has(v));
        return new Set(out);
      } catch {
        return new Set(allowedValues);
      }
    }

    function saveSelectionSet(key, setObj) {
      localStorage.setItem(key, JSON.stringify([...setObj]));

    const selected = loadSelectionSet(OLL_SELECTED_KEY, allWeights);

    const pllCyclesText = document.getElementById('pllCyclesText');
    const pllFilterGrid = document.getElementById('pllFilterGrid');
    const pllCaseKeys = Object.keys(PLL_CYCLES?.cycles || {}).sort((a, b) => String(a).localeCompare(String(b)));
    const pllSelected = loadSelectionSet(PLL_SELECTED_KEY, pllCaseKeys);
    const pllCaseByLower = new Map(pllCaseKeys.map(k => [k.toLowerCase(), k]));

    function setActiveTab(tabName) {
      const t = tabName === 'PLL' ? 'PLL' : 'OLL';
      activeTab = t;

      tabPllBtn.classList.toggle('active', t === 'PLL');

      document.getElementById('panel').style.display = showPll ? 'none' : 'block';
      pllPane.classList.toggle('hidden', !showPll);
      if (showPll) {

        renderPllGraph2d();
      }

    }

    const initialTab = localStorage.getItem(UI_TAB_KEY) === 'PLL' ? 'PLL' : 'OLL';
    pllCyclesText.textContent = JSON.stringify(PLL_CYCLES, null, 2);
    tabOllBtn.addEventListener('click', () => setActiveTab('OLL'));
    tabPllBtn.addEventListener('click', () => setActiveTab('PLL'));

    const weightByIndex = new Map();
const PLL_ALG_BY_CASE = Object.fromEntries(
      Object.entries(PLL_JSON?.cases || {}).map(([k, arr]) => [k, Array.isArray(arr) && arr[0] ? String(arr[0]) : String(k)])
    );

    function buildPllDisplayCycles(cyclesObj) {
      const out = {};
      for (const [k, arr] of Object.entries(cyclesObj || {})) {
        const seqRaw = Array.isArray(arr) ? arr.map(v => String(v)) : [];
        const idx0 = seqRaw.indexOf('0');
        const base = idx0 >= 0 ? seqRaw.slice(0, idx0) : seqRaw.slice();
        out[k] = [...base, 'Solved'];
      }
      return out;
    }

    const PLL_SOLVED_RING = 'bbbrrrgggooo';
    let pllGraph3d = null;
    let pllGraphData = { nodes: [], links: [] };
    let pllFocusRaf = 0;
    let pllFocusLastTs = 0;
    let pllFocusUntilTs = 0;

    function pllCharToHex(ch) {
      switch (String(ch || '').toLowerCase()) {
        case 'r': return '#ef4444';
        case 'g': return '#22c55e';
        case 'b': return '#3b82f6';
        case 'o': return '#f97316';
        case 'y': return '#ffd60a';
        default: return '#0b1220';
      }
    }

    function drawPllNodeCanvas(nodeId) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 320;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(8,12,18,0.92)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(148,163,184,0.7)';
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 32px Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(nodeId), canvas.width / 2, 28);

      const ringRaw = String(nodeId === 'Solved' ? PLL_SOLVED_RING : (PLL_JSON?.appearance?.[nodeId] || PLL_SOLVED_RING));
      const ring = /^[rgbo]{12}$/i.test(ringRaw) ? ringRaw.toLowerCase() : PLL_SOLVED_RING;

      const top = 52;
      const left = 14;
      const sideRatio = 0.3;
      const units = [sideRatio, 1, 1, 1, sideRatio];
      const unitPx = 54;
      const gap = 3;
      const starts = [0];
      for (let i = 1; i < units.length; i += 1) starts[i] = starts[i - 1] + units[i - 1] * unitPx;

      const fillCell = (r, c, color) => {
        const x = left + starts[c];
        const y = top + starts[r];
        const w = units[c] * unitPx - gap;
        const h = units[r] * unitPx - gap;
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
      };

      // Base dark for all visible cells in the 5x5 cross shape.
      for (let r = 0; r < 5; r += 1) {
        for (let c = 0; c < 5; c += 1) {
          if ((r === 0 || r === 4) && (c === 0 || c === 4)) continue; // skip corners
          fillCell(r, c, '#0b1220');
        }
      }

      // Center 3x3 is always yellow (U face).
      for (let r = 1; r <= 3; r += 1) {
        for (let c = 1; c <= 3; c += 1) {
          fillCell(r, c, pllCharToHex('y'));
        }
      }

      // 12-char perimeter around the top face.
      for (let i = 0; i < 3; i += 1) fillCell(0, 1 + i, pllCharToHex(ring[i]));      // top
      for (let i = 0; i < 3; i += 1) fillCell(1 + i, 4, pllCharToHex(ring[3 + i]));  // right
      for (let i = 0; i < 3; i += 1) fillCell(4, 3 - i, pllCharToHex(ring[6 + i]));  // bottom
      for (let i = 0; i < 3; i += 1) fillCell(3 - i, 0, pllCharToHex(ring[9 + i]));  // left

      return canvas;
    }

    function makePllNodeSprite(node) {
      const tex = new THREE.CanvasTexture(drawPllNodeCanvas(node.id));
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.needsUpdate = true;
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: true, depthWrite: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(36, 45, 1);
      return sprite;
    }

    function getPllActivePose() {
      const g = pllGraph3d?.graphData?.();
      const liveNodes = Array.isArray(g?.nodes) ? g.nodes : [];
      const filtered = Array.isArray(g?.links) ? g.links : [];
      const ids = new Set();
      for (const l of filtered) {
        if (l?.source != null) ids.add(typeof l.source === "object" ? l.source.id : l.source);
        if (l?.target != null) ids.add(typeof l.target === "object" ? l.target.id : l.target);
      }
      if (!ids.size) return null;
      const pts = liveNodes.filter(n => ids.has(n.id) && Number.isFinite(n.x) && Number.isFinite(n.y) && Number.isFinite(n.z));
      if (!pts.length) return null;
      let cx = 0, cy = 0, cz = 0;
      for (const p of pts) { cx += p.x; cy += p.y; cz += p.z; }
      cx /= pts.length; cy /= pts.length; cz /= pts.length;
      let maxR = 0;
      for (const p of pts) {
        const dx = p.x - cx, dy = p.y - cy, dz = p.z - cz;
        const r = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (r > maxR) maxR = r;
      }
      const dist = Math.max(220, maxR * 3.0 + 80);
      return { cx, cy, cz, dist };
    }

    function schedulePllSmoothFocus() {
      const followMs = 1100;
      pllFocusUntilTs = performance.now() + followMs;
      if (pllFocusRaf) return;
      const step = (ts) => {
        if (!pllFocusLastTs) pllFocusLastTs = ts;
        const dt = Math.min(80, ts - pllFocusLastTs);
        pllFocusLastTs = ts;
        const pose = getPllActivePose();
        if (pose && pllGraph3d) {
          const cam = pllGraph3d.camera();
          const controls = typeof pllGraph3d.controls === "function" ? pllGraph3d.controls() : null;
          const desiredCam = { x: pose.cx, y: pose.cy, z: pose.cz + pose.dist };
          const desiredLook = { x: pose.cx, y: pose.cy, z: pose.cz };
          const aPos = 1 - Math.exp(-dt / 240);
          const aLook = 1 - Math.exp(-dt / 190);
          cam.position.x += (desiredCam.x - cam.position.x) * aPos;
          cam.position.y += (desiredCam.y - cam.position.y) * aPos;
          cam.position.z += (desiredCam.z - cam.position.z) * aPos;
          if (controls && controls.target) {
            controls.target.x += (desiredLook.x - controls.target.x) * aLook;
            controls.target.y += (desiredLook.y - controls.target.y) * aLook;
            controls.target.z += (desiredLook.z - controls.target.z) * aLook;
            controls.update();
          } else {
            cam.lookAt(desiredLook.x, desiredLook.y, desiredLook.z);
          }
        }
        if (ts < pllFocusUntilTs) {
          pllFocusRaf = requestAnimationFrame(step);
        } else {
          pllFocusRaf = 0;
          pllFocusLastTs = 0;
        }
      };
      pllFocusRaf = requestAnimationFrame(step);
    }

    function renderPllChecks() {

          saveSelectionSet(PLL_SELECTED_KEY, pllSelected);
          renderPllGraph2d();
          schedulePllSmoothFocus();
        });
        const txt = document.createElement('span');
        txt.textContent = k;
        lab.appendChild(chk);
        lab.appendChild(txt);
        pllFilterGrid.appendChild(lab);
      }
    }

    function togglePllCaseByName(name) {

      if (!key) return false;
      if (pllSelected.has(key)) pllSelected.delete(key); else pllSelected.add(key);
      saveSelectionSet(PLL_SELECTED_KEY, pllSelected);
      renderPllChecks();

    }

    function renderPllGraph2d() {
      const el = document.getElementById('pllGraph2d');
      const fallback = document.getElementById('pllCyclesText');
      if (!el) return;
      const allCyclesObj = buildPllDisplayCycles(PLL_CYCLES?.cycles || {});
      const cyclesObj = Object.fromEntries(
        Object.entries(allCyclesObj).filter(([perm]) => pllSelected.has(perm))
      );

      const nodeSet = new Set(['Solved']);
      for (const [perm, arr] of Object.entries(cyclesObj)) {
        nodeSet.add(String(perm));
        for (const v of arr) nodeSet.add(String(v));
      }
      const nodes = [...nodeSet].sort((a, b) => String(a).localeCompare(String(b))).map(id => ({
        id,
        label: id,
        color: id === 'Solved' ? '#22c55e' : '#60a5fa',
        font: { color: '#e2e8f0', face: 'Menlo, monospace' },
        shape: 'dot',
        size: id === 'Solved' ? 20 : 16,
        ...(id === 'Solved' ? { x: 0, y: 0, z: 0, fx: 0, fy: 0, fz: 0 } : {})
      }));

      const edges = [];
      let eid = 1;
      for (const [perm, seqRaw] of Object.entries(cyclesObj)) {
        const seq = Array.isArray(seqRaw) ? seqRaw.slice() : [];
        if (!seq.length) continue;
        const alg = PLL_ALG_BY_CASE[perm] || perm;
        for (let i = 0; i < seq.length; i += 1) {
          const src = seq[i];
          const dst = seq[(i + 1) % seq.length];
          const hue = (360 * (i + 2) / seq.length) % 360;
          edges.push({
            id: eid++,
            from: src,
            to: dst,
            arrows: 'to',
            label: String(perm),
            title: `${perm}: ${alg}`,
            color: { color: `hsl(${hue} 88% 58%)`, opacity: 0.75 },
            font: { color: '#cbd5e1', face: 'Menlo, monospace', size: 11, strokeWidth: 0 },
            smooth: { type: 'curvedCW', roundness: 0.18 }
          });
        }
      }

      // 3D curve spread to avoid edge overlap/strobing (especially self-links).
      const byPair = new Map();
      for (const e of edges) {
        const key = `${e.from}=>${e.to}`;
        if (!byPair.has(key)) byPair.set(key, []);
        byPair.get(key).push(e);
      }
      for (const [key, arr] of byPair.entries()) {
        const isSelf = key.split('=>')[0] === key.split('=>')[1];
        const n = arr.length;
        for (let i = 0; i < n; i += 1) {
          const t = n <= 1 ? 0 : (i / (n - 1)) * 2 - 1; // [-1, 1]
          if (isSelf) {
            // Large loops for self-edges so they are clearly visible.
            arr[i].curvature = 1.2 + Math.abs(t) * 0.8;
            arr[i].curveRotation = t * Math.PI;
          } else {
            // Strong arc spread for parallel same-direction edges.
            arr[i].curvature = 0.45 + Math.abs(t) * 0.55;
            arr[i].curveRotation = t * (Math.PI * 0.9);
          }
        }
      }

      if (typeof ForceGraph3D === 'undefined') {
        if (fallback) {
          fallback.style.display = 'block';
          fallback.textContent = JSON.stringify(PLL_CYCLES, null, 2);
        }
        return;
      }

      if (fallback) fallback.style.display = 'none';
      pllGraphData = { nodes, links: edges.map(e => ({ ...e, source: e.from, target: e.to })) };
      if (!pllGraph3d) {
        pllGraph3d = ForceGraph3D()(el)
          .backgroundColor('#0f1115')
          .nodeId('id')
          .nodeLabel(() => '')
          .linkDirectionalArrowLength(9)
          .linkDirectionalArrowRelPos(0.5)
          .linkWidth(() => 1)
          .linkLabel(l => String(l.label || ''))
          .linkColor(l => (l.color && l.color.color) ? l.color.color : '#7dd3fc')
          .linkCurvature(l => Number.isFinite(l.curvature) ? l.curvature : 0.55)
          .linkCurveRotation(l => Number.isFinite(l.curveRotation) ? l.curveRotation : 0)
          .linkOpacity(0.75)
          .linkDirectionalParticles(0)
          .numDimensions(3);

        if (typeof THREE !== 'undefined') {
          try {
            pllGraph3d.nodeThreeObject(node => makePllNodeSprite(node)).nodeThreeObjectExtend(false);
          } catch (err) {
            console.error('PLL sprite node setup failed; using spheres.', err);
            pllGraph3d.nodeColor(n => (n.id === 'Solved' ? '#22c55e' : '#60a5fa')).nodeVal(n => (n.id === 'Solved' ? 9 : 4));
          }
        } else {
          pllGraph3d.nodeColor(n => (n.id === 'Solved' ? '#22c55e' : '#60a5fa')).nodeVal(n => (n.id === 'Solved' ? 9 : 4));
        }
      } else {
        pllGraph3d.graphData({ nodes: [], links: [] });
      }
      pllGraph3d.graphData(pllGraphData);
      pllGraph3d.d3Force('charge').strength(-1300);
      pllGraph3d.d3Force('link').distance(140);
      pllGraph3d.d3VelocityDecay(0.32);
      schedulePllSmoothFocus();
    }

    for (const w of allWeights) {
      const n = numericKey(w);
      if (Number.isFinite(n)) weightByIndex.set(n, w);
    }

    const POS_21 = (
      [[0,1],[0,2],[0,3]]
      .concat([[1,0],[1,1],[1,2],[1,3],[1,4]])
      .concat([[2,0],[2,1],[2,2],[2,3],[2,4]])
      .concat([[3,0],[3,1],[3,2],[3,3],[3,4]])
      .concat([[4,1],[4,2],[4,3]])
    );
    const POS_21_IDX = new Map(POS_21.map((p, i) => [p.join(','), i]));

    function caseNumber(id) {
      if (id === '0') return '0';
      const m = String(id).match(/(\d+)/);
      return m ? String(Number(m[1])) : String(id);
    }

    function weightLabel(weight) {
      return String(weight).replace(/^OLL\s*/i, '');
    }

    function edgeColorByStep(i, n) {
      // if (n <= 1) return 'hsl(0 92% 58%)';
      const hue = (360 * (i + 2) / n) % 360;
      return `hsl(${hue} 88% 58%)`;
    }

    function drawNodeCanvas(nodeId) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 320;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(8,12,18,0.92)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(148,163,184,0.7)';
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 36px Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(caseNumber(nodeId), canvas.width / 2, 28);

      const bits = String(appearance[nodeId] || '');
      const top = 52;
      const left = 14;
      const sideRatio = 0.3;
      const units = [sideRatio, 1, 1, 1, sideRatio];
      const unitPx = 54;
      const gap = 3;
      const on = '#facc15';
      const off = '#0b1220';
      const starts = [0];
      for (let i = 1; i < units.length; i += 1) starts[i] = starts[i - 1] + units[i - 1] * unitPx;

      for (let r = 0; r < 5; r += 1) {
        for (let c = 0; c < 5; c += 1) {
          const idx = POS_21_IDX.get(`${r},${c}`);
          if (idx === undefined) continue;
          const x = left + starts[c];

          const w = units[c] * unitPx - gap;

    function getFilteredLinks() {

    function getActiveComponentPose() {

      const filtered = getFilteredLinks();

        if (l?.target != null) ids.add(typeof l.target === "object" ? l.target.id : l.target);
      }
      if (!ids.size) return null;
      const pts = liveNodes.filter(n => ids.has(n.id) && Number.isFinite(n.x) && Number.isFinite(n.y) && Number.isFinite(n.z));
      if (!pts.length) return null;

      let cx = 0, cy = 0, cz = 0;
      for (const p of pts) {
        cx += p.x;
        cy += p.y;
        cz += p.z;
      }
      cx /= pts.length;
      cy /= pts.length;
      cz /= pts.length;

      let maxR = 0;
      for (const p of pts) {

        const dy = p.y - cy;
        const dz = p.z - cz;
        const r = Math.sqrt(dx * dx + dy * dy + dz * dz);

    let focusRaf = 0;
    let focusLastTs = 0;
    let focusUntilTs = 0;
    function scheduleSmoothFocus() {
      const followMs = 1100;
      focusUntilTs = performance.now() + followMs;
      if (focusRaf) return;
      const step = (ts) => {
        if (!focusLastTs) focusLastTs = ts;
        const dt = Math.min(80, ts - focusLastTs);
        focusLastTs = ts;

        const pose = getActiveComponentPose();
        if (pose) {
          const cam = Graph.camera();
          const controls = typeof Graph.controls === "function" ? Graph.controls() : null;
          const desiredCam = { x: pose.cx, y: pose.cy, z: pose.cz + pose.dist };
          const desiredLook = { x: pose.cx, y: pose.cy, z: pose.cz };
          const aPos = 1 - Math.exp(-dt / 240);
          const aLook = 1 - Math.exp(-dt / 190);
          cam.position.x += (desiredCam.x - cam.position.x) * aPos;
          cam.position.y += (desiredCam.y - cam.position.y) * aPos;
          cam.position.z += (desiredCam.z - cam.position.z) * aPos;
          if (controls && controls.target) {
            controls.target.x += (desiredLook.x - controls.target.x) * aLook;
            controls.target.y += (desiredLook.y - controls.target.y) * aLook;
            controls.target.z += (desiredLook.z - controls.target.z) * aLook;
            controls.update();
          } else {
            cam.lookAt(desiredLook.x, desiredLook.y, desiredLook.z);
          }
        }

        const keepRunning = ts < focusUntilTs;
        if (keepRunning) {
          focusRaf = requestAnimationFrame(step);
        } else {
          focusRaf = 0;
          focusLastTs = 0;
        }
      };
      focusRaf = requestAnimationFrame(step);
    }

    function toggleWeightByIndex(index) {
      if (!Number.isFinite(index)) return false;
      const key = weightByIndex.get(index);
      if (!key) return false;
      if (selected.has(key)) selected.delete(key); else selected.add(key);
      saveSelectionSet(OLL_SELECTED_KEY, selected);
      renderChecks();
      rebuild();
      scheduleSmoothFocus();
      return true;
    }

    const rebuild = () => {
      const filtered = getFilteredLinks();
      Graph.graphData({ nodes: data.nodes, links: filtered });
      const spread = Number(spreadRange.value || 1);
      Graph.d3Force('charge').strength(-240 * spread * spread);
      Graph.d3Force('link').distance(96 * spread);
      Graph.d3VelocityDecay(0.22);
      Graph.numDimensions(3);
      spreadValue.textContent = `${spread.toFixed(2)}x`;
    };

    const grid = document.getElementById('filterGrid');
    const renderChecks = () => {
      grid.innerHTML = '';
      for (const w of allWeights) {
        const lab = document.createElement('label');
        lab.className = 'it';
        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = selected.has(w);
        chk.addEventListener('change', () => {
          if (chk.checked) selected.add(w); else selected.delete(w);
          saveSelectionSet(OLL_SELECTED_KEY, selected);
          rebuild();
          scheduleSmoothFocus();
        });
        const txt = document.createElement('span');
        txt.textContent = weightLabel(w);
        lab.appendChild(chk);
        lab.appendChild(txt);
        grid.appendChild(lab);
      }
    };

    document.getElementById('allBtn').addEventListener('click', () => {
      selected.clear();
      allWeights.forEach(w => selected.add(w));
      saveSelectionSet(OLL_SELECTED_KEY, selected);
      renderChecks();
      rebuild();
      scheduleSmoothFocus();
    });

    document.getElementById('noneBtn').addEventListener('click', () => {
      selected.clear();
      saveSelectionSet(OLL_SELECTED_KEY, selected);
      renderChecks();
      rebuild();
    });
    document.getElementById('pllAllBtn').addEventListener('click', () => {
      pllSelected.clear();
      pllCaseKeys.forEach(k => pllSelected.add(k));
      saveSelectionSet(PLL_SELECTED_KEY, pllSelected);
      renderPllChecks();
      renderPllGraph2d();
    });
    document.getElementById('pllNoneBtn').addEventListener('click', () => {
      pllSelected.clear();
      saveSelectionSet(PLL_SELECTED_KEY, pllSelected);
      renderPllChecks();
      renderPllGraph2d();
    });
    spreadRange.addEventListener('input', rebuild);
    let digitBuffer = '';
    let digitTimer = null;
    let pllNameBuffer = '';
    let pllNameTimer = null;
    const flushDigitBuffer = () => {
      if (!digitBuffer) return;
      const idx = Number(digitBuffer);
      toggleWeightByIndex(idx);
      digitBuffer = '';
      if (digitTimer) {
        clearTimeout(digitTimer);
        digitTimer = null;
      }
    };
    const flushPllNameBuffer = () => {
      if (!pllNameBuffer) return;
      togglePllCaseByName(pllNameBuffer);
      pllNameBuffer = '';
      if (pllNameTimer) {
        clearTimeout(pllNameTimer);
        pllNameTimer = null;
      }
    };
    document.addEventListener('keydown', (e) => {
      const tag = (e.target?.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target?.isContentEditable) return;
      if (activeTab === 'PLL') {
        if (e.code === 'Enter') {
          e.preventDefault();
          const noneOn = pllSelected.size === 0;
          pllSelected.clear();
          if (noneOn) pllCaseKeys.forEach(k => pllSelected.add(k));
          saveSelectionSet(PLL_SELECTED_KEY, pllSelected);
          renderPllChecks();
          renderPllGraph2d();
          return;
        }
        if (/^Key[A-Z]$/.test(e.code)) {
          e.preventDefault();
          const ch = e.code.slice(3).toLowerCase();
          const next = (pllNameBuffer + ch).toLowerCase();
          const candidates = pllCaseKeys.filter(k => k.toLowerCase().startsWith(next));
          const exact = pllCaseByLower.get(next);
          if (exact && candidates.length === 1) {
            // Unambiguous complete match: toggle immediately.
            if (pllNameTimer) clearTimeout(pllNameTimer);
            pllNameBuffer = '';
            togglePllCaseByName(next);
            return;
          }
          if (candidates.length > 0) {
            // Ambiguous prefix: wait briefly for next key.
            pllNameBuffer = next;
            if (pllNameTimer) clearTimeout(pllNameTimer);
            pllNameTimer = setTimeout(flushPllNameBuffer, 500);
            return;
          }
          // Prefix dead-end: restart from single char if valid.
          const single = ch.toLowerCase();
          const singleCandidates = pllCaseKeys.filter(k => k.toLowerCase().startsWith(single));
          const singleExact = pllCaseByLower.get(single);
          if (singleExact && singleCandidates.length === 1) {
            if (pllNameTimer) clearTimeout(pllNameTimer);
            pllNameBuffer = '';
            togglePllCaseByName(single);
          } else if (singleCandidates.length > 0) {
            pllNameBuffer = single;
            if (pllNameTimer) clearTimeout(pllNameTimer);
            pllNameTimer = setTimeout(flushPllNameBuffer, 500);
          } else {
            if (pllNameTimer) clearTimeout(pllNameTimer);
            pllNameBuffer = '';
          }
          return;
        }
        return;
      }
      if (e.code === 'Enter') {
        e.preventDefault();
        const noneOn = selected.size === 0;
        selected.clear();
        if (noneOn) allWeights.forEach(w => selected.add(w));
        saveSelectionSet(OLL_SELECTED_KEY, selected);
        renderChecks();
        rebuild();
        if (noneOn) scheduleSmoothFocus();
        return;
      }
      if (/^Digit\d$/.test(e.code) || /^Numpad\d$/.test(e.code)) {
        e.preventDefault();
        const d = e.code.slice(-1);
        if (!digitBuffer) {
          digitBuffer = d;
          digitTimer = setTimeout(flushDigitBuffer, 500);
        } else {
          digitBuffer += d;
          flushDigitBuffer();
        }
        return;
      }
      if (e.code === 'KeyF') {
        e.preventDefault();
        scheduleSmoothFocus();
      }
    });

    saveSelectionSet(OLL_SELECTED_KEY, selected);
    saveSelectionSet(PLL_SELECTED_KEY, pllSelected);
    renderChecks();
    rebuild();
    setActiveTab(initialTab);
  </script>
</body>
</html>
