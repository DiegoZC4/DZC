<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edge Tone Bench</title><link rel="stylesheet" href="draft.css"><style>
.stage{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:1rem}.flow{min-height:320px;border-radius:18px;background:#13282d;box-shadow:var(--shadow);overflow:hidden}canvas{width:100%;height:100%;display:block}.frequency{text-align:center;font:500 clamp(3rem,10vw,8rem)/1 "Draft Serif",serif}.frequency small{font:700 .7rem "Avenir Next Condensed",sans-serif;color:var(--muted);letter-spacing:.15em}.stage-note{text-align:center;color:var(--muted)}.stage-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem}.stage-buttons button{border-radius:10px}.stage-buttons button.active{background:var(--ink);color:var(--paper)}
</style></head><body><main class="app"><header class="topbar"><h1>Edge Tone Bench</h1><span class="kicker">jet / edge acoustic sketch</span></header><div class="workspace"><aside class="sidebar stack"><label>Jet speed <span class="mono" id="speedOut"></span><input id="speed" type="range" min="1" max="45" step=".1" value="12"></label><label>Edge distance <span class="mono" id="distanceOut"></span><input id="distance" type="range" min="2" max="60" step=".1" value="18"></label><label>Slit width <span class="mono" id="slitOut"></span><input id="slit" type="range" min=".3" max="6" step=".1" value="1.5"></label><div><div class="eyebrow">Oscillation stage</div><div class="stage-buttons" id="modes"><button class="active" data-mode="0">I</button><button data-mode="1">II</button><button data-mode="2">III</button><button data-mode="3">IV</button></div></div><label>Breath noise<input id="noise" type="range" min="0" max="100" value="22"></label><button class="primary" id="play">Sound tone</button><p class="muted">Frequency uses a staged Strouhal approximation, <span class="mono">f = St · U / d</span>. It is a testable control surface, not yet a fluid simulation.</p></aside><section class="stage"><div class="flow"><canvas id="flow"></canvas></div><div class="panel"><div class="frequency"><span id="frequency">—</span><small> HZ</small></div><div class="stage-note" id="note"></div></div></section></div></main><script>
const $=id=>document.getElementById(id),canvas=$('flow'),ctx=canvas.getContext('2d'),ST=[.2,.4,.8,1.6];let mode=0,audio=null,osc=null,noiseSource=null,noiseGain=null,master=null,filter=null,playing=false,startTime=0;
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}window.onresize=resize;resize();
function params(){const speed=+$('speed').value,d=+$('distance').value/1000,slit=+$('slit').value/1000,f=ST[mode]*speed/d;return{speed,d,slit,f}}
function pitchName(f){const midi=69+12*Math.log2(f/440),n=Math.round(midi),names=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];return`${names[(n%12+12)%12]}${Math.floor(n/12)-1} ${Math.round((midi-n)*100)>=0?'+':''}${Math.round((midi-n)*100)}¢`}
function update(){const p=params();$('speedOut').textContent=p.speed.toFixed(1)+' m/s';$('distanceOut').textContent=(p.d*1000).toFixed(1)+' mm';$('slitOut').textContent=(p.slit*1000).toFixed(1)+' mm';$('frequency').textContent=Math.round(p.f);$('note').textContent=`Stage ${mode+1} · ${pitchName(p.f)} · Reynolds proxy ${(p.speed*p.slit/1.5e-5).toFixed(0)}`;if(osc){osc.frequency.setTargetAtTime(p.f,audio.currentTime,.025);filter.frequency.setTargetAtTime(p.f,audio.currentTime,.025)}draw()}
function draw(t=performance.now()){const w=canvas.clientWidth,h=canvas.clientHeight,p=params(),slitY=h/2,edgeX=w*.72,gap=Math.max(70,Math.min(w*.55,p.d/.06*w*.55)),mouthX=edgeX-gap,amp=Math.min(h*.28,18+p.speed*2.2),phase=(t*.001*p.f*Math.PI*2)% (Math.PI*2);ctx.fillStyle='#13282d';ctx.fillRect(0,0,w,h);ctx.fillStyle='#c5a36d';ctx.fillRect(0,slitY-38,mouthX,32);ctx.fillRect(0,slitY+6,mouthX,32);ctx.fillStyle='#d9c29a';ctx.beginPath();ctx.moveTo(edgeX,slitY);ctx.lineTo(w,slitY-h*.22);ctx.lineTo(w,slitY+h*.22);ctx.closePath();ctx.fill();const grad=ctx.createLinearGradient(mouthX,0,edgeX,0);grad.addColorStop(0,'#72d9e8dd');grad.addColorStop(1,'#72d9e811');ctx.strokeStyle=grad;ctx.lineWidth=Math.max(3,p.slit*1000*2.5);ctx.beginPath();for(let x=mouthX;x<=edgeX;x+=3){const q=(x-mouthX)/gap,y=slitY+Math.sin(q*Math.PI*2+phase)*amp*q*q;ctx.lineTo(x,y)}ctx.stroke();ctx.strokeStyle='#ef9a53';ctx.lineWidth=2;ctx.setLineDash([5,7]);ctx.beginPath();ctx.moveTo(edgeX,0);ctx.lineTo(edgeX,h);ctx.stroke();ctx.setLineDash([]);if(playing)requestAnimationFrame(draw)}
async function play(){if(!audio){audio=new AudioContext();master=audio.createGain();master.gain.value=.18;master.connect(audio.destination);osc=audio.createOscillator();osc.type='sine';const tone=audio.createGain();tone.gain.value=.72;osc.connect(tone).connect(master);const buffer=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;noiseSource=audio.createBufferSource();noiseSource.buffer=buffer;noiseSource.loop=true;filter=audio.createBiquadFilter();filter.type='bandpass';filter.Q.value=2.5;noiseGain=audio.createGain();noiseGain.gain.value=+$('noise').value/500;noiseSource.connect(filter).connect(noiseGain).connect(master);osc.start();noiseSource.start();startTime=performance.now()}if(audio.state==='suspended')await audio.resume();playing=!playing;master.gain.setTargetAtTime(playing?.18:.0001,audio.currentTime,.03);$('play').textContent=playing?'Mute tone':'Sound tone';if(playing)requestAnimationFrame(draw)}
['speed','distance','slit'].forEach(id=>$(id).oninput=update);$('noise').oninput=()=>{if(noiseGain)noiseGain.gain.setTargetAtTime(+$('noise').value/500,audio.currentTime,.03)};$('modes').onclick=e=>{if(e.target.dataset.mode==null)return;mode=+e.target.dataset.mode;[...$('modes').children].forEach(b=>b.classList.toggle('active',b===e.target));update()};$('play').onclick=play;update();
</script></body></html>
