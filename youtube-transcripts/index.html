<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Transcript Search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff0000'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='28' font-weight='900' fill='white'%3ECC%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f7f7f4;
  --ink: #181818;
  --muted: #6f706c;
  --line: #d9d8d0;
  --panel: #ffffff;
  --accent: #cc241d;
  --accent-soft: #fff0ef;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { width: 100%; }
main { width: 100%; padding: 10px clamp(10px, 1.6vw, 28px) 44px; }
.searchbar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.85fr) minmax(0, 1.15fr) 82px; gap: 8px; align-items: stretch; position: sticky; top: 0; z-index: 2; padding: 10px 0 8px; background: var(--bg); }
.searchbar > * { min-width: 0; }
input, button { min-height: 46px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
input { padding: 0 12px; border-radius: 7px; }
button { border-radius: 7px; cursor: pointer; font-weight: 800; }
button.primary { border-color: var(--accent); background: var(--accent); color: white; }
.channel-summary { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.subnav { align-items: center; display: flex; gap: 12px; justify-content: space-between; }
.subnav a { color: var(--accent); font-size: 13px; font-weight: 850; text-decoration: none; }
.page-nav { align-items: center; display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; }
.result-limit { align-items: center; background: var(--panel); display: inline-flex; gap: 6px; min-height: 32px; min-width: 92px; padding: 0 10px; touch-action: none; user-select: none; }
.result-limit strong { color: var(--accent); font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.result-limit[data-dragging="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(204, 36, 29, 0.12); }
.history-picker { position: relative; }
.history-button { align-items: center; background: var(--panel); display: inline-flex; gap: 6px; min-height: 32px; padding: 0 10px; }
.history-button:disabled { color: var(--muted); cursor: default; opacity: 0.58; }
.history-menu { --history-field-columns: minmax(0, 1.15fr) minmax(0, 0.9fr) minmax(0, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12); display: none; max-height: calc(100dvh - 114px); min-width: min(96vw, 720px); overflow: auto; padding: 8px; position: absolute; right: 0; top: calc(100% + 8px); z-index: 6; }
.history-picker[data-open="true"] .history-menu { display: grid; gap: 4px; }
.history-menu-header { align-items: center; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; margin-bottom: 3px; padding: 0 2px 7px; }
.history-menu-title { color: var(--muted); font-size: 12px; font-weight: 850; letter-spacing: 0; text-transform: uppercase; }
.history-column-header { color: var(--muted); display: grid; font-size: 11px; font-weight: 850; gap: 8px; grid-template-columns: var(--history-field-columns) 30px; padding: 2px 8px 0; text-transform: uppercase; }
.history-empty { color: var(--muted); font-size: 13px; padding: 10px; }
.history-item { align-items: start; background: transparent; border: 1px solid transparent; border-radius: 7px; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; padding: 8px; width: 100%; }
.history-item:hover { background: #fbfbf8; border-color: var(--line); }
.history-item-main { background: transparent; border: 0; border-radius: 0; color: inherit; cursor: pointer; display: grid; gap: 4px; font: inherit; justify-items: stretch; min-height: 0; padding: 0; text-align: left; width: 100%; }
.history-item-main:hover { background: transparent; }
.history-item-fields { color: var(--ink); display: grid; font-size: 13px; font-weight: 850; gap: 8px; grid-template-columns: var(--history-field-columns); line-height: 1.35; min-width: 0; }
.history-field { min-width: 0; overflow-wrap: anywhere; }
.history-field[data-empty="true"] { color: var(--muted); }
.history-field-label { display: none; }
.history-item-meta { color: var(--muted); font-size: 12px; font-weight: 700; }
.history-clear-button, .history-delete-button { align-items: center; background: transparent; border: 1px solid transparent; color: var(--muted); display: inline-flex; justify-content: center; min-height: 28px; padding: 0; }
.history-clear-button { border-radius: 999px; gap: 6px; font-size: 12px; font-weight: 850; padding: 0 8px; }
.history-delete-button { border-radius: 7px; min-width: 30px; }
.history-clear-button:hover, .history-delete-button:hover { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
.history-trash-icon { fill: none; height: 15px; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; width: 15px; }
.history-filter-list { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.history-filter { background: var(--category-chip-bg, #f1f5f9); border: 1px solid var(--category-line, #cbd5e1); border-radius: 999px; color: var(--category-ink, #475569); display: inline-flex; font-size: 11px; font-weight: 850; line-height: 1.2; max-width: 100%; padding: 3px 7px; }
.history-filter span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.channel-picker { min-width: 0; position: relative; }
.channel-tokenbox { align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; cursor: text; display: flex; flex-wrap: wrap; gap: 6px; min-height: 46px; min-width: 0; padding: 6px; }
.channel-tokenbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(204, 36, 29, 0.12); }
.filter-chip { align-items: center; background: var(--category-chip-bg, var(--accent-soft)); border: 1px solid var(--category-line, #ffd2cf); border-radius: 999px; color: var(--category-ink, var(--accent)); display: inline-flex; font-size: 13px; font-weight: 850; gap: 6px; max-width: 100%; min-height: 30px; padding: 0 8px 0 10px; }
.filter-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filter-chip button { align-items: center; background: transparent; border: 0; border-radius: 999px; color: currentColor; display: inline-flex; font-size: 16px; font-weight: 950; justify-content: center; line-height: 1; min-height: 22px; min-width: 22px; padding: 0; }
.filter-chip[data-type="category"] { background: var(--category-accent, var(--accent)); border-color: var(--category-accent, var(--accent)); color: white; }
.channel-filter-input { border: 0; flex: 1 1 220px; min-height: 32px; min-width: 0; outline: 0; padding: 0 4px; }
.channel-tokenbox:has(.filter-chip) .channel-filter-input { flex-basis: 0; min-width: 0; padding: 0; width: 0; }
.channel-options { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12); display: none; left: 0; margin-top: 6px; max-height: calc(100dvh - 74px); overflow: auto; position: absolute; right: 0; z-index: 5; }
.channel-picker[data-open="true"] .channel-options { display: block; }
.channel-option { align-items: center; background: transparent; border: 0; border-radius: 0; display: grid; gap: 2px; justify-items: start; min-height: 48px; padding: 8px 10px; text-align: left; width: 100%; }
.channel-option:hover, .channel-option[data-active="true"] { background: var(--category-chip-bg, var(--accent-soft)); color: var(--category-ink, var(--accent)); }
.channel-option strong { font-size: 14px; line-height: 1.2; }
.channel-option span { color: var(--muted); font-size: 12px; font-weight: 700; }
.channel-option-empty { color: var(--muted); padding: 12px; }
.meta { min-height: 24px; color: var(--muted); font-size: 14px; margin: 2px 0 14px; }
.results { display: grid; gap: 9px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); }
.result { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
.result-top { align-items: center; display: grid; gap: 8px; grid-template-columns: 24px minmax(0, 1fr) auto; margin-bottom: 7px; }
.result-heading { min-width: 0; }
.channel-avatar { background: var(--category-soft, #e2e8f0); border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 50%; color: var(--category-ink, var(--muted)); display: inline-grid; flex: 0 0 24px; font-size: 10px; font-weight: 950; height: 24px; line-height: 1; object-fit: cover; overflow: hidden; place-items: center; text-transform: uppercase; width: 24px; }
.title { font-size: 14px; font-weight: 800; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.channel { color: var(--muted); font-size: 12px; font-weight: 700; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.video-count { color: var(--muted); flex: 0 0 auto; font-size: 13px; font-weight: 800; }
.hits { display: grid; gap: 6px; }
.hit { border-top: 1px solid var(--line); display: grid; gap: 6px; grid-template-columns: auto minmax(0, 1fr); padding-top: 7px; }
.time { align-self: start; color: var(--accent); background: var(--accent-soft); border: 1px solid #ffd2cf; border-radius: 999px; font-size: 13px; font-weight: 800; padding: 3px 8px; text-decoration: none; }
.snippet { color: #30302e; font-size: 13.5px; line-height: 1.36; }
.snippet strong { background: var(--accent-soft); border-radius: 4px; color: var(--accent); font-weight: 950; padding: 0 2px; }
.match-count { color: var(--muted); font-size: 12px; font-weight: 700; margin-left: 6px; }
.video-result { align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: inherit; display: grid; gap: 7px; grid-template-columns: 24px minmax(96px, 0.36fr) minmax(0, 1fr); padding: 7px 10px; text-decoration: none; }
.video-result:hover { border-color: #c9c8bf; background: #fbfbf8; }
.video-result-channel { color: var(--muted); font-size: 12px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.video-result-title { font-size: 14px; font-weight: 750; line-height: 1.24; overflow-wrap: anywhere; }
.empty { padding: 18px 0; color: var(--muted); }
@media (max-width: 680px) {
  .searchbar { grid-template-columns: 1fr; }
  .subnav { align-items: flex-start; flex-direction: column; }
  .page-nav { justify-content: flex-start; }
  .history-menu { left: 0; min-width: min(92vw, 440px); right: auto; }
  .history-column-header { display: none; }
  .history-item-fields { grid-template-columns: 1fr; gap: 3px; }
  .history-field { display: grid; gap: 8px; grid-template-columns: 68px minmax(0, 1fr); }
  .history-field-label { color: var(--muted); display: block; font-size: 11px; font-weight: 850; text-transform: uppercase; }
  .results { grid-template-columns: 1fr; }
  .channel-filter-input { flex-basis: 140px; }
  .video-result { grid-template-columns: 24px minmax(0, 1fr); }
  .video-result-channel, .video-result-title { white-space: normal; }
  .video-result-title { grid-column: 2; }
}
</style>
</head>
<body>
<main>
  <form class="searchbar" id="searchForm">
    <div class="channel-picker" id="channelPicker">
      <div class="channel-tokenbox" id="channelTokenbox">
        <input class="channel-filter-input" id="channelFilterInput" autocomplete="off" placeholder="Channels">
      </div>
      <div class="channel-options" id="channelOptions"></div>
    </div>
    <input id="titleInput" name="title_filter" autocomplete="off" placeholder="Video title">
    <input id="queryInput" name="q" autocomplete="off" placeholder="Transcript substring">
    <button class="primary" type="submit">Search</button>
  </form>
  <div class="subnav">
    <div class="channel-summary" id="channelSummary">Loading channels...</div>
    <div class="page-nav">
      <button class="result-limit" id="resultLimitButton" type="button" role="spinbutton" aria-label="Results shown" aria-valuemin="10" aria-valuemax="200" aria-valuenow="60">
        <span>Results</span>
        <strong id="resultLimitValue">60</strong>
      </button>
      <div class="history-picker" id="historyPicker">
        <button class="history-button" id="historyButton" type="button" aria-expanded="false" aria-haspopup="menu" disabled>History</button>
        <div class="history-menu" id="recentSearches" role="menu"></div>
      </div>
      <a href="patches.html">Patches</a>
      <a href="stats.html">Stats</a>
    </div>
  </div>
  <div class="meta" id="meta"></div>
  <section class="results" id="results"></section>
</main>
<script>
const form = document.getElementById('searchForm');
const titleInput = document.getElementById('titleInput');
const queryInput = document.getElementById('queryInput');
const channelPicker = document.getElementById('channelPicker');
const channelTokenbox = document.getElementById('channelTokenbox');
const channelFilterInput = document.getElementById('channelFilterInput');
const channelOptions = document.getElementById('channelOptions');
const channelSummary = document.getElementById('channelSummary');
const resultLimitButton = document.getElementById('resultLimitButton');
const resultLimitValue = document.getElementById('resultLimitValue');
const historyPicker = document.getElementById('historyPicker');
const historyButton = document.getElementById('historyButton');
const recentSearches = document.getElementById('recentSearches');
const meta = document.getElementById('meta');
const results = document.getElementById('results');
let channelRows = [];
let channelByName = new Map();
let selectedFilters = [];
let activeOptionIndex = -1;
let activeCachedSearch = null;
let hasRenderedSearch = false;
let resultLimit = 60;
let resultLimitDrag = null;
let lastRenderedSearch = null;
const SEARCH_CACHE_KEY = 'ytTranscriptSearches:v1';
const MAX_CACHED_SEARCHES = 10;
const DEFAULT_RESULT_LIMIT = 60;
const MIN_RESULT_LIMIT = 10;
const MAX_RESULT_LIMIT = 200;
const RESULT_LIMIT_STEP = 10;
const CATEGORY_STYLES = {
  AI: { accent: '#2563eb', bg: '#f4f8ff', soft: '#dbeafe', chip: '#eff6ff', ink: '#1d4ed8', line: '#bfdbfe' },
  Comedy: { accent: '#db2777', bg: '#fff5fa', soft: '#fce7f3', chip: '#fdf2f8', ink: '#be185d', line: '#fbcfe8' },
  Engineering: { accent: '#0891b2', bg: '#f0fbff', soft: '#cffafe', chip: '#ecfeff', ink: '#0e7490', line: '#a5f3fc' },
  Fitness: { accent: '#16a34a', bg: '#f3fbf5', soft: '#dcfce7', chip: '#f0fdf4', ink: '#15803d', line: '#bbf7d0' },
  Food: { accent: '#c2410c', bg: '#fff7ed', soft: '#fed7aa', chip: '#ffedd5', ink: '#9a3412', line: '#fdba74' },
  Health: { accent: '#059669', bg: '#f0fdf8', soft: '#d1fae5', chip: '#ecfdf5', ink: '#047857', line: '#a7f3d0' },
  Math: { accent: '#7c3aed', bg: '#f8f5ff', soft: '#ede9fe', chip: '#f5f3ff', ink: '#6d28d9', line: '#ddd6fe' },
  Music: { accent: '#d97706', bg: '#fff9ed', soft: '#fef3c7', chip: '#fffbeb', ink: '#b45309', line: '#fde68a' },
  Philosophy: { accent: '#4f46e5', bg: '#f5f6ff', soft: '#e0e7ff', chip: '#eef2ff', ink: '#4338ca', line: '#c7d2fe' },
  Science: { accent: '#0d9488', bg: '#f0fdfa', soft: '#ccfbf1', chip: '#f0fdfa', ink: '#0f766e', line: '#99f6e4' },
  Other: { accent: '#64748b', bg: '#f8fafc', soft: '#e2e8f0', chip: '#f1f5f9', ink: '#475569', line: '#cbd5e1' }
};

init();

function init() {
  form.addEventListener('submit', event => {
    event.preventDefault();
    search();
  });
  channelTokenbox.addEventListener('click', () => channelFilterInput.focus());
  channelFilterInput.addEventListener('input', renderChannelOptions);
  channelFilterInput.addEventListener('focus', openChannelOptions);
  channelFilterInput.addEventListener('keydown', handleChannelInputKeydown);
  channelOptions.addEventListener('pointerdown', event => {
    event.preventDefault();
    const button = event.target.closest('.channel-option');
    if (button) addFilter(button.dataset.type, button.dataset.value);
  });
  historyButton.addEventListener('click', () => {
    if (historyButton.disabled) return;
    setHistoryOpen(historyPicker.dataset.open !== 'true');
  });
  resultLimitButton.addEventListener('pointerdown', startResultLimitDrag);
  resultLimitButton.addEventListener('pointermove', updateResultLimitDrag);
  resultLimitButton.addEventListener('pointerup', finishResultLimitDrag);
  resultLimitButton.addEventListener('pointercancel', cancelResultLimitDrag);
  resultLimitButton.addEventListener('keydown', handleResultLimitKeydown);
  document.addEventListener('mousedown', event => {
    if (!channelPicker.contains(event.target)) closeChannelOptions();
    if (!historyPicker.contains(event.target)) setHistoryOpen(false);
  });
  updateResultLimitControl();
  renderRecentSearches();
  restoreLatestSearch();
  loadChannels();
}

async function loadChannels() {
  try {
    const payload = await getJson('api.php?action=channels');
    channelRows = (payload.channels || []).map(row => ({
      ...row,
      category: row.category || inferChannelCategory(row.channel)
    }));
    channelByName = new Map(channelRows.map(row => [row.channel, row]));
    renderSelectedFilters();
    renderChannelOptions();
    const stats = payload.stats || {};
    if (activeCachedSearch) {
      restoreCachedSearch(activeCachedSearch);
    } else if (!hasRenderedSearch) {
      meta.textContent = `${stats.videos || 0} videos, ${stats.channels || 0} channels indexed`;
    }
  } catch (error) {
    channelSummary.textContent = 'Could not load channels';
    channelOptions.innerHTML = '<div class="channel-option-empty">Could not load the static channel list.</div>';
    if (!hasRenderedSearch) meta.textContent = error.message;
  }
}

function groupChannelsByCategory(rows) {
  const groups = new Map();
  const sortedRows = [...rows].sort((a, b) => {
    const categoryCompare = (a.category || 'Other').localeCompare(b.category || 'Other');
    return categoryCompare || a.channel.localeCompare(b.channel);
  });
  for (const row of sortedRows) {
    const category = row.category || 'Other';
    if (!groups.has(category)) groups.set(category, []);
    groups.get(category).push(row);
  }
  return groups;
}

function applyCategoryStyle(element, category) {
  const style = CATEGORY_STYLES[category] || CATEGORY_STYLES.Other;
  element.style.setProperty('--category-accent', style.accent);
  element.style.setProperty('--category-bg', style.bg);
  element.style.setProperty('--category-soft', style.soft);
  element.style.setProperty('--category-chip-bg', style.chip);
  element.style.setProperty('--category-ink', style.ink);
  element.style.setProperty('--category-line', style.line);
}

function channelAvatarElement(channelName) {
  const row = channelByName.get(channelName) || {};
  const category = row.category || inferChannelCategory(channelName);
  const url = row.avatar_url || '';
  const label = `${channelName || 'Channel'} avatar`;
  const element = url ? document.createElement('img') : document.createElement('span');
  element.className = 'channel-avatar';
  element.title = channelName || '';
  element.setAttribute('aria-label', label);
  applyCategoryStyle(element, category);
  if (url) {
    element.src = url;
    element.alt = label;
    element.loading = 'lazy';
    element.decoding = 'async';
    element.referrerPolicy = 'no-referrer';
  } else {
    element.textContent = initialsFor(channelName);
  }
  return element;
}

function initialsFor(value) {
  const words = String(value || '?').replace(/&/g, ' ').match(/[A-Za-z0-9]+/g) || ['?'];
  return words.slice(0, 2).map(word => word[0]).join('');
}

function selectedChannels() {
  if (!selectedFilters.length) return [];
  const selected = new Set();
  for (const filter of selectedFilters) {
    if (filter.type === 'channel') {
      selected.add(filter.value);
    } else if (filter.type === 'category') {
      for (const row of channelRows) {
        if ((row.category || 'Other') === filter.value) selected.add(row.channel);
      }
    }
  }
  return [...selected];
}

function updateChannelSummary() {
  const total = channelRows.length;
  const selected = selectedChannels().length;
  channelSummary.textContent = selectedFilters.length
    ? `${selected} of ${total} channels selected`
    : `All ${total} channels selected`;
}

function renderSelectedFilters() {
  for (const chip of [...channelTokenbox.querySelectorAll('.filter-chip')]) {
    chip.remove();
  }
  for (const filter of selectedFilters) {
    const chip = document.createElement('span');
    chip.className = 'filter-chip';
    chip.dataset.type = filter.type;
    applyCategoryStyle(chip, filter.category || filter.value);
    chip.innerHTML = '<span></span><button type="button" aria-label="Remove filter">&times;</button>';
    chip.querySelector('span').textContent = filter.label;
    chip.querySelector('button').addEventListener('click', () => removeFilter(filter.type, filter.value));
    channelTokenbox.insertBefore(chip, channelFilterInput);
  }
  channelFilterInput.placeholder = selectedFilters.length ? '' : 'Channels';
  updateChannelSummary();
}

function renderChannelOptions() {
  const options = availableFilterOptions(channelFilterInput.value);
  activeOptionIndex = options.length ? 0 : -1;
  channelOptions.replaceChildren();
  if (!options.length) {
    const empty = document.createElement('div');
    empty.className = 'channel-option-empty';
    empty.textContent = 'No matching channels or categories';
    channelOptions.appendChild(empty);
    return;
  }
  const fragment = document.createDocumentFragment();
  options.forEach((option, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'channel-option';
    button.dataset.type = option.type;
    button.dataset.value = option.value;
    button.dataset.active = index === activeOptionIndex ? 'true' : 'false';
    applyCategoryStyle(button, option.category || option.value);
    button.innerHTML = '<strong></strong><span></span>';
    button.querySelector('strong').textContent = option.label;
    button.querySelector('span').textContent = option.detail;
    fragment.appendChild(button);
  });
  channelOptions.appendChild(fragment);
}

function availableFilterOptions(searchText) {
  const query = normalize(searchText);
  const selectedKeys = new Set(selectedFilters.map(filter => filterKey(filter.type, filter.value)));
  return allFilterOptions()
    .filter(option => !selectedKeys.has(filterKey(option.type, option.value)))
    .filter(option => !query || normalize(option.label).includes(query) || normalize(option.detail).includes(query))
    .sort(compareFilterOptions);
}

function allFilterOptions() {
  const categories = [...groupChannelsByCategory(channelRows)].map(([category, rows]) => ({
    type: 'category',
    value: category,
    label: category,
    category,
    detail: `${rows.length} channel${rows.length === 1 ? '' : 's'}`
  }));
  const channels = channelRows.map(row => ({
    type: 'channel',
    value: row.channel,
    label: row.channel,
    category: row.category || 'Other',
    detail: `${row.category || 'Other'} · ${row.video_count} video${row.video_count === 1 ? '' : 's'}`
  }));
  return [...categories, ...channels];
}

function compareFilterOptions(a, b) {
  const typeCompare = a.type === b.type ? 0 : a.type === 'category' ? -1 : 1;
  return typeCompare || a.label.localeCompare(b.label);
}

function addFilter(type, value) {
  const key = filterKey(type, value);
  if (selectedFilters.some(filter => filterKey(filter.type, filter.value) === key)) return;
  const option = allFilterOptions().find(item => filterKey(item.type, item.value) === key);
  if (!option) return;
  selectedFilters.push(option);
  channelFilterInput.value = '';
  renderSelectedFilters();
  renderChannelOptions();
  openChannelOptions();
  channelFilterInput.focus();
}

function removeFilter(type, value) {
  selectedFilters = selectedFilters.filter(filter => filterKey(filter.type, filter.value) !== filterKey(type, value));
  renderSelectedFilters();
  renderChannelOptions();
  channelFilterInput.focus();
}

function handleChannelInputKeydown(event) {
  const options = [...channelOptions.querySelectorAll('.channel-option')];
  if (event.key === 'Backspace' && channelFilterInput.value === '' && selectedFilters.length) {
    selectedFilters.pop();
    renderSelectedFilters();
    renderChannelOptions();
    return;
  }
  if (!options.length) return;
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault();
    activeOptionIndex = event.key === 'ArrowDown'
      ? (activeOptionIndex + 1) % options.length
      : (activeOptionIndex - 1 + options.length) % options.length;
    updateActiveOption(options);
  } else if (event.key === 'Enter' && channelPicker.dataset.open === 'true') {
    event.preventDefault();
    const active = options[Math.max(0, activeOptionIndex)];
    if (active) addFilter(active.dataset.type, active.dataset.value);
  } else if (event.key === 'Escape') {
    closeChannelOptions();
  }
}

function updateActiveOption(options) {
  options.forEach((option, index) => {
    option.dataset.active = index === activeOptionIndex ? 'true' : 'false';
  });
  options[activeOptionIndex]?.scrollIntoView({ block: 'nearest' });
}

function openChannelOptions() {
  channelPicker.dataset.open = 'true';
  renderChannelOptions();
}

function closeChannelOptions() {
  channelPicker.dataset.open = 'false';
}

function filterKey(type, value) {
  return `${type}:${value}`;
}

function normalize(value) {
  return String(value).trim().toLowerCase();
}

function readSearchCache() {
  try {
    const raw = localStorage.getItem(SEARCH_CACHE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(parsed)) return [];
    const entries = parsed
      .map(normalizeCachedSearch)
      .filter(Boolean)
      .slice(0, MAX_CACHED_SEARCHES);
    const compact = JSON.stringify(entries);
    if (raw !== compact) {
      try {
        localStorage.setItem(SEARCH_CACHE_KEY, compact);
      } catch {
        // Keep reading usable entries even if storage cleanup fails.
      }
    }
    return entries;
  } catch {
    return [];
  }
}

function normalizeCachedSearch(entry) {
  if (!entry || typeof entry !== 'object') return null;
  const channels = normalizeCachedFilters(Array.isArray(entry.filters) ? entry.filters : entry.channels);
  const title = entry.title ?? entry.titleFilter ?? '';
  const transcript = entry.transcript ?? entry.query ?? '';
  const payloadResults = Array.isArray(entry.payload?.results) ? entry.payload.results : [];
  const limit = clampResultLimit(entry.limit ?? payloadResults.length ?? DEFAULT_RESULT_LIMIT);
  const videos = Array.isArray(entry.videoIds)
    ? entry.videoIds
    : Array.isArray(entry.videos)
      ? entry.videos
      : payloadResults.map(item => item.youtube_id);
  const normalized = {
    channels: uniqueFilters(channels),
    title: String(title || '').trim(),
    transcript: String(transcript || '').trim(),
    videos: uniqueStrings(videos),
    limit,
    createdAt: Number(entry.createdAt) || Date.now()
  };
  if (entry.payload && Array.isArray(entry.payload.results)) {
    normalized.payload = {
      results: entry.payload.results.slice(0, limit),
      timing: entry.payload.timing || null
    };
  }
  return normalized.title || normalized.transcript ? normalized : null;
}

function normalizeCachedFilters(filters) {
  if (!Array.isArray(filters)) return [];
  return filters.map(filter => {
    if (filter && typeof filter === 'object') {
      const type = filter.type === 'category' ? 'category' : 'channel';
      const value = String(filter.value || filter.label || '').trim();
      if (!value) return null;
      return {
        type,
        value,
        label: String(filter.label || value).trim(),
        category: filter.category || (type === 'category' ? value : inferChannelCategory(value))
      };
    }
    const value = String(filter || '').trim();
    if (!value) return null;
    const type = CATEGORY_STYLES[value] ? 'category' : 'channel';
    return {
      type,
      value,
      label: value,
      category: type === 'category' ? value : inferChannelCategory(value)
    };
  }).filter(Boolean);
}

function uniqueStrings(values) {
  if (!Array.isArray(values)) return [];
  const seen = new Set();
  const out = [];
  for (const value of values) {
    const text = String(value && typeof value === 'object' ? value.value : value || '').trim();
    if (!text || seen.has(text)) continue;
    seen.add(text);
    out.push(text);
  }
  return out;
}

function uniqueFilters(filters) {
  const seen = new Set();
  const out = [];
  for (const filter of normalizeCachedFilters(filters)) {
    const key = `${filter.type}:${filter.value}`;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(filter);
  }
  return out;
}

function clampResultLimit(value) {
  const numeric = Number(value);
  if (!Number.isFinite(numeric)) return DEFAULT_RESULT_LIMIT;
  const stepped = Math.round(numeric / RESULT_LIMIT_STEP) * RESULT_LIMIT_STEP;
  return Math.max(MIN_RESULT_LIMIT, Math.min(MAX_RESULT_LIMIT, stepped));
}

function setResultLimit(value) {
  resultLimit = clampResultLimit(value);
  updateResultLimitControl();
}

function updateResultLimitControl() {
  resultLimitValue.textContent = String(resultLimit);
  resultLimitButton.setAttribute('aria-valuenow', String(resultLimit));
  resultLimitButton.setAttribute('aria-valuetext', `${resultLimit} results`);
}

function startResultLimitDrag(event) {
  if (event.button !== 0) return;
  event.preventDefault();
  resultLimitDrag = {
    pointerId: event.pointerId,
    startX: event.clientX,
    startLimit: resultLimit,
    moved: false
  };
  resultLimitButton.dataset.dragging = 'true';
  resultLimitButton.setPointerCapture(event.pointerId);
}

function updateResultLimitDrag(event) {
  if (!resultLimitDrag || resultLimitDrag.pointerId !== event.pointerId) return;
  const delta = event.clientX - resultLimitDrag.startX;
  if (Math.abs(delta) > 3) resultLimitDrag.moved = true;
  const stepDelta = Math.round(delta / 8) * RESULT_LIMIT_STEP;
  setResultLimit(resultLimitDrag.startLimit + stepDelta);
}

function finishResultLimitDrag(event) {
  if (!resultLimitDrag || resultLimitDrag.pointerId !== event.pointerId) return;
  const previousLimit = resultLimitDrag.startLimit;
  const moved = resultLimitDrag.moved;
  resultLimitButton.releasePointerCapture(event.pointerId);
  resultLimitButton.dataset.dragging = 'false';
  resultLimitDrag = null;
  if (moved) applyResultLimitChange(previousLimit, resultLimit);
}

function cancelResultLimitDrag(event) {
  if (!resultLimitDrag || resultLimitDrag.pointerId !== event.pointerId) return;
  setResultLimit(resultLimitDrag.startLimit);
  resultLimitButton.dataset.dragging = 'false';
  resultLimitDrag = null;
}

function handleResultLimitKeydown(event) {
  const deltas = {
    ArrowLeft: -RESULT_LIMIT_STEP,
    ArrowDown: -RESULT_LIMIT_STEP,
    ArrowRight: RESULT_LIMIT_STEP,
    ArrowUp: RESULT_LIMIT_STEP,
    PageDown: -50,
    PageUp: 50
  };
  let next = resultLimit;
  if (event.key in deltas) {
    next = resultLimit + deltas[event.key];
  } else if (event.key === 'Home') {
    next = MIN_RESULT_LIMIT;
  } else if (event.key === 'End') {
    next = MAX_RESULT_LIMIT;
  } else {
    return;
  }
  event.preventDefault();
  const previousLimit = resultLimit;
  setResultLimit(next);
  applyResultLimitChange(previousLimit, resultLimit);
}

function applyResultLimitChange(previousLimit, nextLimit) {
  if (previousLimit === nextLimit) return;
  const state = currentSearchState();
  if (!state.title && !state.transcript) return;
  if (
    nextLimit < previousLimit &&
    lastRenderedSearch &&
    searchCacheKey(lastRenderedSearch.state) === searchCacheKey(state)
  ) {
    const payload = {
      results: lastRenderedSearch.results.slice(0, nextLimit),
      timing: lastRenderedSearch.timing ? { ...lastRenderedSearch.timing, cached: true } : { cached: true }
    };
    renderResults(payload.results, state.transcript, state.title, payload.timing);
    saveSearchCache(state, payload);
    return;
  }
  search({ limit: nextLimit });
}

function writeSearchCache(entries) {
  const next = entries.map(normalizeCachedSearch).filter(Boolean).slice(0, MAX_CACHED_SEARCHES);
  while (next.length) {
    try {
      localStorage.setItem(SEARCH_CACHE_KEY, JSON.stringify(next));
      return;
    } catch {
      next.pop();
    }
  }
  try {
    localStorage.removeItem(SEARCH_CACHE_KEY);
  } catch {
    // Local storage is optional; search should still work without it.
  }
}

function currentSearchState() {
  return {
    channels: selectedFilters.map(filter => ({
      type: filter.type,
      value: filter.value,
      label: filter.label,
      category: filter.category
    })),
    title: titleInput.value.trim(),
    transcript: queryInput.value.trim()
  };
}

function searchCacheKey(state) {
  return JSON.stringify({
    channels: normalizeCachedFilters(state.channels || []).map(filter => `${filter.type}:${filter.value}`).sort(),
    title: state.title || '',
    transcript: state.transcript || ''
  });
}

function saveSearchCache(state, payload) {
  const results = Array.isArray(payload.results) ? payload.results : [];
  const entry = {
    channels: uniqueFilters(state.channels || []),
    title: state.title || '',
    transcript: state.transcript || '',
    videos: uniqueStrings(results.map(item => item.youtube_id)),
    limit: resultLimit,
    createdAt: Date.now(),
    payload: {
      results,
      timing: payload.timing || null
    }
  };
  const entries = readSearchCache().filter(item => searchCacheKey(item) !== searchCacheKey(entry));
  entries.unshift(entry);
  writeSearchCache(entries);
  renderRecentSearches();
}

function renderRecentSearches() {
  const entries = readSearchCache();
  historyButton.disabled = entries.length === 0;
  historyButton.textContent = entries.length ? `History (${entries.length})` : 'History';
  historyButton.setAttribute('aria-expanded', historyPicker.dataset.open === 'true' ? 'true' : 'false');
  if (!entries.length) {
    setHistoryOpen(false);
    recentSearches.replaceChildren(historyEmptyElement());
    return;
  }
  recentSearches.replaceChildren(historyMenuHeaderElement(entries.length), historyColumnHeaderElement(), ...entries.map(entry => {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.setAttribute('role', 'none');

    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'history-item-main';
    button.setAttribute('role', 'menuitem');
    button.title = historySummaryText(entry);
    button.append(historyFieldsElement(entry), historyMetaElement(entry));
    button.addEventListener('click', () => {
      restoreCachedSearch(entry);
      setHistoryOpen(false);
    });

    const deleteButton = document.createElement('button');
    deleteButton.type = 'button';
    deleteButton.className = 'history-delete-button';
    deleteButton.title = 'Delete this search';
    deleteButton.setAttribute('aria-label', `Delete search: ${historySummaryText(entry)}`);
    deleteButton.append(trashIconElement());
    deleteButton.addEventListener('click', event => {
      event.stopPropagation();
      deleteSearchHistoryEntry(entry);
    });

    item.append(button, deleteButton);
    return item;
  }));
}

function historyMenuHeaderElement(count) {
  const header = document.createElement('div');
  header.className = 'history-menu-header';
  const title = document.createElement('div');
  title.className = 'history-menu-title';
  title.textContent = `${count} recent search${count === 1 ? '' : 'es'}`;
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'history-clear-button';
  button.title = 'Clear search history';
  button.setAttribute('aria-label', 'Clear search history');
  button.append(trashIconElement(), document.createTextNode('Clear'));
  button.addEventListener('click', event => {
    event.stopPropagation();
    clearSearchHistory();
  });
  header.append(title, button);
  return header;
}

function historyColumnHeaderElement() {
  const header = document.createElement('div');
  header.className = 'history-column-header';
  ['Channels', 'Videos', 'Search', ''].forEach(label => {
    const cell = document.createElement('div');
    cell.textContent = label;
    header.appendChild(cell);
  });
  return header;
}

function historyFieldValues(entry) {
  return {
    channels: entry.channels?.length
      ? entry.channels.map(filter => filter.label || filter.value).join(', ')
      : 'All',
    videos: entry.title || 'All',
    search: entry.transcript || 'All'
  };
}

function historySummaryText(entry) {
  const values = historyFieldValues(entry);
  return `Channels: ${values.channels} - Videos: ${values.videos} - Search: ${values.search}`;
}

function historyEmptyElement() {
  const element = document.createElement('div');
  element.className = 'history-empty';
  element.textContent = 'No searches yet.';
  return element;
}

function historyFieldsElement(entry) {
  const values = historyFieldValues(entry);
  const element = document.createElement('div');
  element.className = 'history-item-fields';
  element.append(
    historyFieldElement('Channels', values.channels),
    historyFieldElement('Videos', values.videos),
    historyFieldElement('Search', values.search)
  );
  return element;
}

function historyFieldElement(label, value) {
  const field = document.createElement('div');
  field.className = 'history-field';
  field.dataset.empty = value === 'All' ? 'true' : 'false';
  field.title = value;
  const labelElement = document.createElement('span');
  labelElement.className = 'history-field-label';
  labelElement.textContent = label;
  const valueElement = document.createElement('span');
  valueElement.className = 'history-field-value';
  valueElement.textContent = value;
  field.append(labelElement, valueElement);
  return field;
}

function historyMetaElement(entry) {
  const element = document.createElement('div');
  element.className = 'history-item-meta';
  const videos = entry.videos?.length || 0;
  const resultCount = entry.payload?.results?.length || 0;
  const when = entry.createdAt ? formatHistoryTime(entry.createdAt) : 'cached';
  element.textContent = `${resultCount} result${resultCount === 1 ? '' : 's'} - ${videos} video${videos === 1 ? '' : 's'} - ${when}`;
  return element;
}

function trashIconElement() {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.classList.add('history-trash-icon');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  const paths = [
    'M3 6h18',
    'M8 6V4h8v2',
    'M6 6l1 15h10l1-15',
    'M10 11v6',
    'M14 11v6'
  ];
  for (const d of paths) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    svg.appendChild(path);
  }
  return svg;
}

function historyEntryKey(entry) {
  const normalized = normalizeCachedSearch(entry);
  if (!normalized) return '';
  return `${searchCacheKey(normalized)}:${normalized.createdAt}`;
}

function deleteSearchHistoryEntry(entryToDelete) {
  const targetKey = historyEntryKey(entryToDelete);
  const entries = readSearchCache().filter(entry => historyEntryKey(entry) !== targetKey);
  writeSearchCache(entries);
  renderRecentSearches();
}

function clearSearchHistory() {
  if (!window.confirm('Clear all search history?')) return;
  writeSearchCache([]);
  activeCachedSearch = null;
  renderRecentSearches();
}

function formatHistoryTime(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return 'cached';
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const target = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const dayDiff = Math.round((today - target) / 86400000);
  if (dayDiff === 0) return 'Today';
  if (dayDiff === 1) return 'Yesterday';
  if (dayDiff > 1 && dayDiff < 7) return `${dayDiff} days ago`;
  return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function setHistoryOpen(open) {
  historyPicker.dataset.open = open ? 'true' : 'false';
  historyButton.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function restoreLatestSearch() {
  const latest = readSearchCache()[0];
  if (latest) restoreCachedSearch(latest);
}

function restoreCachedSearch(entry) {
  const normalized = normalizeCachedSearch(entry);
  if (!normalized) return;
  activeCachedSearch = normalized;
  setResultLimit(normalized.limit || DEFAULT_RESULT_LIMIT);
  titleInput.value = normalized.title || '';
  queryInput.value = normalized.transcript || '';
  selectedFilters = cachedFiltersToOptions(normalized.channels || []);
  renderSelectedFilters();
  renderChannelOptions();
  if (normalized.payload && Array.isArray(normalized.payload.results)) {
    const timing = normalized.payload.timing ? { ...normalized.payload.timing, cached: true } : { cached: true };
    renderResults(normalized.payload.results, normalized.transcript, normalized.title, timing);
  } else if (channelRows.length) {
    search({ cachedVideos: normalized.videos || [], cacheResults: false });
  } else {
    meta.textContent = `Restored cached search${normalized.videos?.length ? ` with ${normalized.videos.length} video id${normalized.videos.length === 1 ? '' : 's'}` : ''}`;
  }
}

function cachedFiltersToOptions(filters) {
  const options = allFilterOptions();
  return normalizeCachedFilters(filters).map(filter => {
    const option = options.find(item => item.type === filter.type && item.value === filter.value);
    if (option) return option;
    return {
      ...filter,
      detail: filter.type === 'category' ? 'Category' : 'Channel'
    };
  });
}

async function search(options = {}) {
  activeCachedSearch = null;
  const state = currentSearchState();
  const titleFilter = state.title;
  const query = state.transcript;
  setResultLimit(options.limit ?? resultLimit);
  if (!titleFilter && !query) {
    lastRenderedSearch = null;
    results.innerHTML = '<div class="empty">Type a video title or transcript substring.</div>';
    return;
  }
  const channels = selectedChannels();
  meta.textContent = 'Searching...';
  results.innerHTML = '';
  try {
    const params = new URLSearchParams({
      action: 'search',
      limit: String(resultLimit)
    });
    if (query) params.set('q', query);
    if (titleFilter) params.set('title_filter', titleFilter);
    if (selectedFilters.length) {
      for (const channel of channels) {
        params.append('channels[]', channel);
      }
    }
    for (const videoId of uniqueStrings(options.cachedVideos || [])) {
      params.append('videos[]', videoId);
    }
    const payload = await getJson(`api.php?${params}`);
    renderResults(payload.results || [], query, titleFilter, payload.timing || null);
    if (options.cacheResults !== false) saveSearchCache(state, payload);
  } catch (error) {
    meta.textContent = error.message;
  }
}

function renderResults(items, query, titleFilter = '', timing = null) {
  hasRenderedSearch = true;
  lastRenderedSearch = {
    state: currentSearchState(),
    results: Array.isArray(items) ? items.slice() : [],
    timing
  };
  const groups = groupResultsByVideo(items);
  const videoCount = groups.length;
  const titleOnly = titleFilter && !query;
  const titleScope = titleFilter ? ` in titles matching "${titleFilter}"` : '';
  const timingText = timing && Number.isFinite(Number(timing.total_ms)) ? ` · ${formatMs(timing.total_ms)}` : '';
  const cacheText = timing?.cached ? ' · cached' : '';
  meta.textContent = titleOnly
    ? `${videoCount} video title${videoCount === 1 ? '' : 's'} matching "${titleFilter}"${timingText}${cacheText}`
    : `${items.length} result${items.length === 1 ? '' : 's'} in ${videoCount} video${videoCount === 1 ? '' : 's'}${titleScope} for "${query}"${timingText}${cacheText}`;
  if (!items.length) {
    results.innerHTML = '<div class="empty">No matches.</div>';
    return;
  }
  const fragment = document.createDocumentFragment();
  if (titleOnly) {
    for (const item of items) {
      const link = document.createElement('a');
      link.className = 'video-result';
      link.href = item.url || `https://www.youtube.com/watch?v=${encodeURIComponent(item.youtube_id || '')}`;
      link.target = '_blank';
      link.rel = 'noreferrer';
      link.innerHTML = `
        <span class="avatar-slot"></span>
        <div class="video-result-channel"></div>
        <div class="video-result-title"></div>
      `;
      link.querySelector('.avatar-slot').replaceWith(channelAvatarElement(item.channel || ''));
      link.querySelector('.video-result-channel').textContent = item.channel || '';
      link.querySelector('.video-result-title').textContent = item.title || item.youtube_id || '';
      fragment.appendChild(link);
    }
    results.replaceChildren(fragment);
    return;
  }
  for (const group of groups) {
    const article = document.createElement('article');
    article.className = 'result';
    article.innerHTML = `
      <div class="result-top">
        <span class="avatar-slot"></span>
        <div class="result-heading">
          <div class="title"></div>
          <div class="channel"></div>
        </div>
        <div class="video-count"></div>
      </div>
      <div class="hits"></div>
    `;
    const first = group.items[0];
    article.querySelector('.avatar-slot').replaceWith(channelAvatarElement(first.channel || ''));
    article.querySelector('.title').textContent = first.title || first.youtube_id;
    const channel = article.querySelector('.channel');
    channel.textContent = first.channel || '';
    article.querySelector('.video-count').textContent = `${group.items.length} hit${group.items.length === 1 ? '' : 's'}`;
    const hits = article.querySelector('.hits');
    for (const item of group.items) {
      const hit = document.createElement('div');
      hit.className = 'hit';
      hit.innerHTML = `
        <a class="time" target="_blank" rel="noreferrer"></a>
        <div>
          <div class="snippet"></div>
        </div>
      `;
      const time = hit.querySelector('.time');
      time.href = item.url;
      time.textContent = item.timestamp || '0:00';
      const snippet = hit.querySelector('.snippet');
      renderSnippet(snippet, item);
      if (item.match_count > 1) {
        const count = document.createElement('span');
        count.className = 'match-count';
        count.textContent = `${item.match_count} nearby matches`;
        snippet.appendChild(count);
      }
      hits.appendChild(hit);
    }
    fragment.appendChild(article);
  }
  results.replaceChildren(fragment);
}

function formatMs(ms) {
  const value = Number(ms);
  return value >= 1000 ? `${(value / 1000).toFixed(2)}s` : `${value.toFixed(0)}ms`;
}

function groupResultsByVideo(items) {
  const groups = [];
  const byVideo = new Map();
  for (const item of items) {
    const key = item.youtube_id || `${item.channel}:${item.title}`;
    let group = byVideo.get(key);
    if (!group) {
      group = { key, items: [] };
      byVideo.set(key, group);
      groups.push(group);
    }
    group.items.push(item);
  }
  return groups;
}

function renderSnippet(container, item) {
  const parts = Array.isArray(item.snippet_parts) ? item.snippet_parts : [];
  if (!parts.length) {
    container.textContent = item.snippet || '';
    return;
  }
  const fragment = document.createDocumentFragment();
  for (const part of parts) {
    if (part.match) {
      const strong = document.createElement('strong');
      strong.textContent = part.text || '';
      fragment.appendChild(strong);
    } else {
      fragment.appendChild(document.createTextNode(part.text || ''));
    }
  }
  container.replaceChildren(fragment);
}

async function getJson(url) {
  const response = await fetch(url, { cache: 'no-store' });
  const text = await response.text();
  if (!text.trim()) {
    throw new Error(`Empty API response (${response.status})`);
  }
  let payload;
  try {
    payload = JSON.parse(text);
  } catch (error) {
    throw new Error(`Invalid API response (${response.status})`);
  }
  if (!response.ok || !payload.ok) throw new Error(payload.error || `Request failed (${response.status})`);
  return payload;
}
