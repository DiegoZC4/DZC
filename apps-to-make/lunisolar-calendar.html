<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lunation Calendar</title><link rel="stylesheet" href="draft.css"><style>
.workspace{grid-template-columns:minmax(210px,280px) minmax(0,1fr)}.stage{display:grid;grid-template-rows:auto minmax(0,1fr);gap:.7rem;min-width:0}.month-head{display:flex;align-items:center;justify-content:space-between}.month-head h2{font:500 clamp(1.5rem,4vw,3rem)/1 "Draft Serif",serif;margin:0}.calendar{width:100%;min-width:0;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}.weekday{min-width:0;overflow:hidden;background:#263735;color:#f4efe3;padding:.4rem;text-align:center;text-transform:uppercase;font-size:.7rem;letter-spacing:.12em}.day{min-width:0;background:#faf7ef;position:relative;padding:.35rem;min-height:75px;overflow:hidden}.day.outside{background:#e9e2d3;color:#8b877f}.date{position:absolute;left:.45rem;top:.35rem;font:600 .8rem monospace}.moon{width:min(5.8vmin,48px);height:min(5.8vmin,48px);display:block;margin:.2rem auto}.lunar-day{text-align:center;font-size:.68rem;color:var(--muted)}.today{box-shadow:inset 0 0 0 3px var(--accent)}.selected{background:#fff0c8}.phase-big{width:140px;height:140px;margin:auto}.metric{font-size:2.4rem}.season-track{height:12px;border-radius:999px;background:linear-gradient(90deg,#6da4b0,#9dbd6b,#e1a44f,#9a7da6,#6da4b0);position:relative}.season-track i{position:absolute;top:50%;width:18px;height:18px;border:3px solid white;background:#1e2a2a;border-radius:50%;transform:translate(-50%,-50%)}@media(max-width:720px){.calendar{min-height:620px}.weekday{padding:.32rem .08rem;font-size:.58rem;letter-spacing:.04em}.day{padding:.2rem}.moon{width:34px;height:34px}.lunar-day{font-size:.58rem}}
</style></head><body><main class="app"><header class="topbar"><h1>Lunation Calendar</h1><span class="kicker">Moon age against the solar year</span></header><div class="workspace"><aside class="sidebar stack"><canvas class="phase-big" id="phaseBig" width="140" height="140"></canvas><div><div class="eyebrow">Selected date</div><div id="selectedDate"></div></div><div class="split"><div><div class="eyebrow">Moon age</div><div class="metric" id="age"></div></div><div><div class="eyebrow">Illuminated</div><div class="metric" id="illum"></div></div></div><div><div class="eyebrow">Solar year</div><div class="season-track"><i id="season"></i></div></div><div><div class="eyebrow">Lunation</div><div class="mono" id="lunation"></div></div><p class="muted">This first draft uses a mean synodic month anchored to the 6 January 2000 new moon. It shows the lunisolar geometry, not a culture-specific leap-month calendar.</p><button id="today">Today</button></aside><section class="stage"><div class="month-head"><button id="prev" aria-label="Previous month">←</button><h2 id="month"></h2><button id="next" aria-label="Next month">→</button></div><div class="calendar" id="calendar"></div></section></div></main><script>
const SYNODIC=29.530588853,EPOCH=Date.UTC(2000,0,6,18,14),$=id=>document.getElementById(id);let cursor=new Date(),selected=new Date();cursor=new Date(cursor.getFullYear(),cursor.getMonth(),1);
const mod=(n,m)=>((n%m)+m)%m,daysSinceEpoch=d=>(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),12)-EPOCH)/86400000,phase=d=>mod(daysSinceEpoch(d),SYNODIC)/SYNODIC;
function drawMoon(canvas,p){const c=canvas.getContext('2d'),w=canvas.width,h=canvas.height,img=c.createImageData(w,h),r=Math.min(w,h)*.46,cx=w/2,cy=h/2,theta=2*Math.PI*p,lx=Math.sin(theta),lz=-Math.cos(theta);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const nx=(x-cx)/r,ny=(y-cy)/r,q=nx*nx+ny*ny,i=(y*w+x)*4;if(q>1){img.data[i+3]=0;continue}const nz=Math.sqrt(1-q),lit=nx*lx+nz*lz>0,edge=Math.min(1,(1-q)*10),base=lit?[244,218,146]:[35,50,50];img.data[i]=base[0];img.data[i+1]=base[1];img.data[i+2]=base[2];img.data[i+3]=Math.round(255*edge)}c.clearRect(0,0,w,h);c.putImageData(img,0,0)}
function dayOfYear(d){return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000)}
function select(d){selected=new Date(d);const p=phase(d),age=p*SYNODIC,illum=(1-Math.cos(2*Math.PI*p))/2;$('selectedDate').textContent=d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});$('age').textContent=age.toFixed(1)+'d';$('illum').textContent=Math.round(illum*100)+'%';$('lunation').textContent=`#${Math.floor(daysSinceEpoch(d)/SYNODIC)} · lunar day ${Math.floor(age)+1}`;$('season').style.left=(dayOfYear(d)/(new Date(d.getFullYear(),11,31)-new Date(d.getFullYear(),0,0))*86400000*100)+'%';drawMoon($('phaseBig'),p);renderCalendar()}
function renderCalendar(){const names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],cal=$('calendar'),first=new Date(cursor.getFullYear(),cursor.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());const today=new Date();$('month').textContent=cursor.toLocaleDateString(undefined,{month:'long',year:'numeric'});const nodes=names.map(n=>{const e=document.createElement('div');e.className='weekday';e.textContent=n;return e});for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const cell=document.createElement('button');cell.className='day'+(d.getMonth()!==cursor.getMonth()?' outside':'')+(d.toDateString()===today.toDateString()?' today':'')+(d.toDateString()===selected.toDateString()?' selected':'');const num=document.createElement('span');num.className='date';num.textContent=d.getDate();const moon=document.createElement('canvas');moon.className='moon';moon.width=48;moon.height=48;drawMoon(moon,phase(d));const ld=document.createElement('div');ld.className='lunar-day';ld.textContent='day '+(Math.floor(phase(d)*SYNODIC)+1);cell.append(num,moon,ld);cell.onclick=()=>select(d);nodes.push(cell)}cal.replaceChildren(...nodes)}
$('prev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);renderCalendar()};$('next').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);renderCalendar()};$('today').onclick=()=>{cursor=new Date();cursor=new Date(cursor.getFullYear(),cursor.getMonth(),1);select(new Date())};select(selected);
</script></body></html>
