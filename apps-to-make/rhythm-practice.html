<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhythm Lattice</title><link rel="stylesheet" href="draft.css"><style>
.stage{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:1rem}.visual{display:grid;align-content:center;gap:clamp(1.2rem,5vh,3.5rem);background:#172b2e;border-radius:20px;padding:clamp(1rem,4vw,3rem);box-shadow:var(--shadow)}.lane{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:1rem;color:#f4efe3}.lane-name{text-align:right;text-transform:uppercase;letter-spacing:.12em;font-size:.75rem}.track{position:relative;height:70px}.rail{position:absolute;left:0;right:0;top:50%;height:2px;background:#f4efe344}.beat{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);background:#f4efe3;box-shadow:0 0 0 0 #f4efe300;transition:transform 80ms,box-shadow 80ms}.beat.accent{background:#ef9a53}.beat.live{transform:translate(-50%,-50%) scale(1.7);box-shadow:0 0 0 12px #ef9a5322}.cursor{position:absolute;top:0;bottom:0;width:2px;background:#6cd1ca;transform:translateX(-1px)}.transport{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center}.tempo{font:500 clamp(2rem,7vw,5.2rem)/1 "Draft Serif",serif;text-align:center}.tempo small{display:block;font:700 .65rem "Avenir Next Condensed",sans-serif;letter-spacing:.14em;color:var(--muted)}.tap{aspect-ratio:1;min-width:70px}.control-pair{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.formula{font:500 2.2rem "Draft Serif",serif;text-align:center}.mute.active{background:var(--accent-2);color:white}@media(max-width:720px){.lane{grid-template-columns:1fr}.lane-name{text-align:left}.track{height:55px}}
</style></head><body><main class="app"><header class="topbar"><h1>Rhythm Lattice</h1><span class="kicker">polyrhythm · tuplet · tempo</span></header><div class="workspace"><aside class="sidebar stack"><div class="pillset" id="mode"><button class="active" data-mode="poly">Polyrhythm</button><button data-mode="tuplet">Tuplet</button></div><div class="formula" id="formula">3 : 2</div><div class="control-pair"><label>Upper pulses<input id="a" type="number" min="1" max="16" value="3"></label><label id="bLabel">Lower pulses<input id="b" type="number" min="1" max="16" value="2"></label></div><label>Cycle length (quarter notes)<input id="cycle" type="number" min="1" max="16" value="2"></label><label>Tempo<input id="bpm" type="range" min="25" max="260" value="90"></label><div class="control-pair"><button class="mute" id="muteA">Mute upper</button><button class="mute" id="muteB">Mute lower</button></div><label>Click volume<input id="volume" type="range" min="0" max="100" value="45"></label><p class="muted" id="explain">Three evenly spaced upper attacks against two lower attacks over the same two-quarter-note cycle.</p></aside><section class="stage"><div class="visual"><div class="lane"><span class="lane-name" id="nameA">3 pulse</span><div class="track" id="trackA"></div></div><div class="lane"><span class="lane-name" id="nameB">2 pulse</span><div class="track" id="trackB"></div></div></div><div class="transport panel"><button class="primary" id="play">Play</button><div class="tempo"><span id="tempoValue">90</span><small>BEATS PER MINUTE</small></div><button class="tap" id="tap">Tap</button></div></section></div></main><script>
const $=id=>document.getElementById(id);let mode='poly',audio=null,gain=null,playing=false,nextCycle=0,timer=null,animation=null,taps=[],muted={a:false,b:false};
function settings(){return{a:+$('a').value,b:+$('b').value,cycle:+$('cycle').value,bpm:+$('bpm').value}}
function renderTracks(){const s=settings(),lower=mode==='poly'?s.b:s.cycle;$('formula').textContent=mode==='poly'?`${s.a} : ${s.b}`:`${s.a} in ${s.cycle}`;$('nameA').textContent=`${s.a} ${mode==='poly'?'pulse':'tuplet'}`;$('nameB').textContent=`${lower} reference`;$('explain').textContent=mode==='poly'?`${s.a} evenly spaced upper attacks against ${s.b} lower attacks over the same ${s.cycle}-quarter-note cycle.`:`${s.a} notes distributed evenly through ${s.cycle} quarter-note beats.`;drawLane($('trackA'),s.a,'a');drawLane($('trackB'),lower,'b');$('tempoValue').textContent=s.bpm}
function drawLane(track,count,lane){track.innerHTML='<i class="cursor"></i>';for(let i=0;i<count;i++){const dot=document.createElement('i');dot.className='beat'+(i===0?' accent':'');dot.style.left=(i/count*100)+'%';dot.dataset.i=i;dot.dataset.lane=lane;track.append(dot)}}
async function ensureAudio(){if(!audio){audio=new AudioContext();gain=audio.createGain();gain.connect(audio.destination)}if(audio.state==='suspended')await audio.resume();gain.gain.value=(+$('volume').value/100)**2}
function clickAt(time,freq,loud=1){const osc=audio.createOscillator(),g=audio.createGain();osc.frequency.value=freq;osc.type='sine';g.gain.setValueAtTime(.0001,time);g.gain.exponentialRampToValueAtTime(.24*loud,time+.002);g.gain.exponentialRampToValueAtTime(.0001,time+.055);osc.connect(g).connect(gain);osc.start(time);osc.stop(time+.065)}
function scheduleCycle(start){const s=settings(),duration=60/s.bpm*s.cycle,lower=mode==='poly'?s.b:s.cycle;if(!muted.a)for(let i=0;i<s.a;i++)clickAt(start+i*duration/s.a,i===0?980:760,i===0?1:.7);if(!muted.b)for(let i=0;i<lower;i++)clickAt(start+i*duration/lower,i===0?520:410,i===0?1:.65);return duration}
function scheduler(){while(nextCycle<audio.currentTime+.15)nextCycle+=scheduleCycle(nextCycle);timer=setTimeout(scheduler,35)}
function animate(){if(!playing)return;const s=settings(),dur=60/s.bpm*s.cycle,phase=((audio.currentTime-nextCycle)%dur+dur)%dur/dur;document.querySelectorAll('.cursor').forEach(c=>c.style.left=phase*100+'%');document.querySelectorAll('.beat').forEach(dot=>{const count=dot.parentElement.querySelectorAll('.beat').length,index=+dot.dataset.i,d=Math.abs(((phase-index/count+.5)%1+1)%1-.5);dot.classList.toggle('live',d<.025)});animation=requestAnimationFrame(animate)}
async function toggle(){if(playing){playing=false;clearTimeout(timer);cancelAnimationFrame(animation);$('play').textContent='Play';return}await ensureAudio();playing=true;nextCycle=audio.currentTime+.08;$('play').textContent='Pause';scheduler();animate()}
$('play').onclick=toggle;$('mode').onclick=e=>{if(!e.target.dataset.mode)return;mode=e.target.dataset.mode;[...$('mode').children].forEach(b=>b.classList.toggle('active',b===e.target));renderTracks()};['a','b','cycle','bpm'].forEach(id=>$(id).oninput=renderTracks);$('volume').oninput=()=>gain&&(gain.gain.value=(+$('volume').value/100)**2);['A','B'].forEach(x=>$('mute'+x).onclick=()=>{const key=x.toLowerCase();muted[key]=!muted[key];$('mute'+x).classList.toggle('active',muted[key])});$('tap').onclick=()=>{const t=performance.now();taps=taps.filter(x=>t-x<3000);taps.push(t);if(taps.length>1){const gaps=taps.slice(1).map((x,i)=>x-taps[i]),bpm=Math.round(60000/(gaps.reduce((a,b)=>a+b)/gaps.length));$('bpm').value=Math.max(25,Math.min(260,bpm));renderTracks()}};window.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|BUTTON/.test(e.target.tagName)){e.preventDefault();toggle()}});renderTracks();
</script></body></html>
