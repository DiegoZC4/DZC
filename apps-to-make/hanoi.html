<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanoi</title><link rel="stylesheet" href="draft.css"><style>
.stage{display:grid;place-items:center}.board{width:min(100%,1050px);height:min(72dvh,650px);min-height:360px}.base{fill:#314743}.post{fill:#55706a}.disk{stroke:#182522;stroke-width:2;rx:9;transition:x .18s,y .18s}.peg-hit{fill:transparent;cursor:pointer}.peg-hit:hover{fill:#fff2}.selected{filter:drop-shadow(0 0 10px #ef9a53)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}.metrics strong{display:block;font:2.2rem "Draft Serif",serif}.message{min-height:2.8rem;padding:.65rem;border-left:4px solid var(--line);background:#fff8}.message.bad{border-color:var(--accent-2)}.message.good{border-color:var(--good)}
</style></head><body><main class="app"><header class="topbar"><h1>Hanoi</h1><span class="kicker">recursive structure you can touch</span></header><div class="workspace"><aside class="sidebar stack"><label>Disks <span class="mono" id="nOut"></span><input id="n" type="range" min="1" max="10" value="5"></label><label>Auto-solve speed<input id="speed" type="range" min="40" max="1000" value="260"></label><div class="row"><button id="reset">Reset</button><button id="undo">Undo</button></div><button class="primary" id="solve">Auto-solve optimally</button><div class="metrics"><div><span class="eyebrow">Moves</span><strong id="moves">0</strong></div><div><span class="eyebrow">Minimum</span><strong id="minimum">31</strong></div><div><span class="eyebrow">Extra</span><strong id="extra">0</strong></div></div><div class="message" id="message">Tap a source peg, then a destination peg.</div><p class="muted">The optimal solution moves the top <em>n−1</em> disks aside, moves the largest disk once, then repeats the same structure in reverse.</p></aside><section class="stage"><svg class="board" id="board" viewBox="0 0 960 560" aria-label="Interactive Tower of Hanoi"><rect class="base" x="50" y="500" width="860" height="28" rx="12"/><g id="posts"></g><g id="disks"></g><g id="hits"></g></svg></section></div></main><script>
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id),xs=[210,480,750],colors=['#d4563c','#e08b3f','#e1b94c','#80a85a','#4f9b84','#4d84a5','#726ca2','#9b6690','#ab6d57','#70817c'];let pegs,selected=null,history=[],moves=0,solving=false,timer=null;
function el(n,a={}){const e=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}for(let i=0;i<3;i++){$('posts').append(el('rect',{class:'post',x:xs[i]-10,y:115,width:20,height:390,rx:10}));const hit=el('rect',{class:'peg-hit',x:xs[i]-125,y:80,width:250,height:440});hit.onclick=()=>tap(i);$('hits').append(hit)}
function reset(){clearTimeout(timer);solving=false;$('solve').textContent='Auto-solve optimally';const n=+$('n').value;pegs=[Array.from({length:n},(_,i)=>n-i),[],[]];selected=null;history=[];moves=0;render();message('Tap a source peg, then a destination peg.','')}
function render(){const n=+$('n').value,nodes=[];pegs.forEach((peg,p)=>peg.forEach((disk,level)=>{const max=220,min=58,w=min+(max-min)*(disk/n),r=el('rect',{class:'disk'+(selected===p&&level===peg.length-1?' selected':''),x:xs[p]-w/2,y:480-level*34,width:w,height:29,fill:colors[(disk-1)%colors.length]});nodes.push(r)}));$('disks').replaceChildren(...nodes);$('nOut').textContent=n;$('minimum').textContent=(2**n-1).toLocaleString();$('moves').textContent=moves;$('extra').textContent=Math.max(0,moves-(2**n-1));if(pegs[2].length===n)message(moves===2**n-1?'Solved optimally.':'Solved. Try reducing the extra moves.','good')}
function message(text,kind){$('message').textContent=text;$('message').className='message '+kind}
function move(from,to,record=true){const disk=pegs[from].at(-1),onto=pegs[to].at(-1);if(disk==null)return false;if(onto!=null&&onto<disk){message('A larger disk cannot sit on a smaller disk.','bad');return false}pegs[to].push(pegs[from].pop());if(record){history.push([from,to]);moves++}render();return true}
function tap(p){if(solving)return;if(selected==null){if(!pegs[p].length)return message('That peg is empty.','bad');selected=p;render();message(`Disk ${pegs[p].at(-1)} selected.`,'')}else{const from=selected;selected=null;if(from===p){render();return message('Selection cleared.','')}move(from,p)}}
function plan(n,from,to,via,out){if(!n)return;plan(n-1,from,via,to,out);out.push([from,to]);plan(n-1,via,to,from,out)}function auto(){reset();solving=true;$('solve').textContent='Stop';const out=[];plan(+$('n').value,0,2,1,out);let i=0;const step=()=>{if(!solving)return;if(i>=out.length){solving=false;$('solve').textContent='Auto-solve optimally';return}move(...out[i++]);timer=setTimeout(step,+$('speed').value)};step()}
$('n').oninput=reset;$('reset').onclick=reset;$('undo').onclick=()=>{if(solving||!history.length)return;const [a,b]=history.pop();pegs[a].push(pegs[b].pop());moves--;selected=null;render()};$('solve').onclick=()=>{if(solving){solving=false;clearTimeout(timer);$('solve').textContent='Auto-solve optimally'}else auto()};reset();
</script></body></html>
