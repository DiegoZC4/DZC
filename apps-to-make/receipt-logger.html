<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Item Ledger</title><link rel="stylesheet" href="draft.css"><style>
.stage{display:grid;grid-template-rows:auto minmax(0,1fr);gap:1rem}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem}.summary div{border-top:3px solid var(--accent);padding:.6rem}.summary strong{display:block;font:1.7rem "Draft Serif",serif}.receipts{overflow:auto;display:grid;gap:.6rem;align-content:start}.receipt{display:grid;grid-template-columns:1fr auto auto;gap:1rem;align-items:center;padding:.8rem 1rem;background:#fff9;border:1px solid var(--line);border-radius:13px}.receipt.selected{box-shadow:inset 4px 0 var(--accent)}.items{display:grid;gap:.35rem;max-height:300px;overflow:auto}.item{display:grid;grid-template-columns:minmax(100px,2fr) 65px 90px 100px 32px;gap:.35rem}.item button{padding:.25rem}.check{padding:.7rem;border-radius:10px;background:#fff8}.check.bad{border-left:4px solid var(--accent-2)}.check.good{border-left:4px solid var(--good)}dialog{width:min(780px,calc(100vw - 1rem));border:0;border-radius:18px;background:var(--paper);box-shadow:var(--shadow)}dialog::backdrop{background:#182522aa}@media(max-width:720px){.summary{grid-template-columns:1fr 1fr}.item{grid-template-columns:1fr 55px 75px 30px}.item .category{grid-column:1/-1}.receipt{grid-template-columns:1fr auto}}
</style></head><body><main class="app"><header class="topbar"><h1>Item Ledger</h1><span class="kicker">receipt history by line item</span></header><div class="workspace"><aside class="sidebar stack"><button class="primary" id="new">New receipt</button><label>Month<input id="month" type="month"></label><label>Search items<input id="query" placeholder="coffee, hardware, pharmacy"></label><button id="export">Export CSV</button><button class="danger" id="delete">Delete selected</button><p class="muted">Line items, tax, and totals stay in local storage. A camera/OCR importer can be added after the data model is proven.</p></aside><section class="stage"><div class="summary panel"><div><span class="eyebrow">Receipts</span><strong id="receiptCount">0</strong></div><div><span class="eyebrow">Subtotal</span><strong id="subtotalSum">$0</strong></div><div><span class="eyebrow">Tax</span><strong id="taxSum">$0</strong></div><div><span class="eyebrow">Total</span><strong id="totalSum">$0</strong></div></div><div class="receipts" id="receipts"></div></section></div></main>
<dialog id="dialog"><form id="form" class="stack"><div><div class="eyebrow">Receipt</div><h2>Log purchase</h2></div><div class="split"><label>Store<input id="store" required></label><label>Date<input id="date" type="date" required></label></div><div class="eyebrow">Items</div><div class="items" id="items"></div><button type="button" id="addItem">Add line item</button><div class="split"><label>Tax<input id="tax" type="number" min="0" step=".01" value="0"></label><label>Printed total<input id="printed" type="number" min="0" step=".01"></label></div><div class="check" id="check"></div><label>Notes<textarea id="notes" rows="2"></textarea></label><div class="row"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save receipt</button></div></form></dialog><script>
const KEY='appsToMake.receipts.v1',$=id=>document.getElementById(id),money=n=>new Intl.NumberFormat(undefined,{style:'currency',currency:'USD'}).format(n||0);let data=[],selected=null;try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch{}const today=new Date();$('month').value=today.toISOString().slice(0,7);
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}function totals(r){const subtotal=r.items.reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0),tax=+r.tax||0;return{subtotal,tax,total:subtotal+tax}}
function filtered(){const m=$('month').value,q=$('query').value.toLowerCase();return data.filter(r=>(!m||r.date.startsWith(m))&&(!q||JSON.stringify(r).toLowerCase().includes(q)))}
function render(){const rows=filtered(),sum=rows.reduce((a,r)=>{const t=totals(r);a.subtotal+=t.subtotal;a.tax+=t.tax;a.total+=t.total;return a},{subtotal:0,tax:0,total:0});$('receiptCount').textContent=rows.length;$('subtotalSum').textContent=money(sum.subtotal);$('taxSum').textContent=money(sum.tax);$('totalSum').textContent=money(sum.total);$('receipts').innerHTML=rows.sort((a,b)=>b.date.localeCompare(a.date)).map(r=>{const t=totals(r);return`<button class="receipt${selected===r.id?' selected':''}" data-id="${r.id}"><span><strong>${esc(r.store)}</strong><br><small>${r.date} · ${r.items.length} item${r.items.length===1?'':'s'}</small></span><span>${esc(r.items.slice(0,2).map(i=>i.name).join(', '))}</span><strong>${money(t.total)}</strong></button>`}).join('')||'<div class="empty">No receipts in this view</div>'}
function addItem(item={name:'',qty:1,price:'',category:''}){const row=document.createElement('div');row.className='item';row.innerHTML=`<input class="iname" placeholder="Item" value="${esc(item.name)}"><input class="iqty" type="number" min=".01" step=".01" value="${item.qty}"><input class="iprice" type="number" min="0" step=".01" placeholder="$ each" value="${item.price}"><input class="category" placeholder="Category" value="${esc(item.category)}"><button type="button" aria-label="Remove">×</button>`;row.querySelector('button').onclick=()=>{row.remove();updateCheck()};row.querySelectorAll('input').forEach(i=>i.oninput=updateCheck);$('items').append(row);updateCheck()}
function draftItems(){return[...$('items').children].map(r=>({name:r.querySelector('.iname').value.trim(),qty:+r.querySelector('.iqty').value||0,price:+r.querySelector('.iprice').value||0,category:r.querySelector('.category').value.trim()})).filter(i=>i.name)}function updateCheck(){const subtotal=draftItems().reduce((s,i)=>s+i.qty*i.price,0),calculated=subtotal+(+$('tax').value||0),printed=+$('printed').value||0,diff=printed?printed-calculated:0;$('check').className='check '+(Math.abs(diff)<.005?'good':'bad');$('check').textContent=`Calculated ${money(calculated)}${printed?` · printed difference ${money(diff)}`:''}`}
$('new').onclick=()=>{$('form').reset();$('date').value=new Date().toISOString().slice(0,10);$('items').innerHTML='';addItem();$('dialog').showModal()};$('addItem').onclick=()=>addItem();$('cancel').onclick=()=>$('dialog').close();$('tax').oninput=$('printed').oninput=updateCheck;$('form').onsubmit=e=>{e.preventDefault();const items=draftItems();if(!items.length)return alert('Add at least one named item.');data.push({id:crypto.randomUUID(),store:$('store').value.trim(),date:$('date').value,items,tax:+$('tax').value||0,printed:+$('printed').value||null,notes:$('notes').value.trim()});save();$('dialog').close();render()};['month','query'].forEach(id=>$(id).oninput=render);$('receipts').onclick=e=>{const id=e.target.closest('[data-id]')?.dataset.id;if(id){selected=id;render()}};$('delete').onclick=()=>{if(selected&&confirm('Delete selected receipt?')){data=data.filter(r=>r.id!==selected);selected=null;save();render()}};$('export').onclick=()=>{const cols=['receipt_id','date','store','item','quantity','unit_price','category','tax','receipt_total','notes'],quote=v=>'"'+String(v??'').replaceAll('"','""')+'"',rows=data.flatMap(r=>r.items.map(i=>[r.id,r.date,r.store,i.name,i.qty,i.price,i.category,r.tax,totals(r).total,r.notes])),csv=[cols,...rows].map(row=>row.map(quote).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='itemized-receipts.csv';a.click();URL.revokeObjectURL(a.href)};render();
</script></body></html>
