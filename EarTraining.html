<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Ear Training</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%91%82%3C/text%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #10151f;
        --panel: #192334;
        --text: #ecf4ff;
        --muted: #9ab0cf;
        --line: #2d3f59;
        --app-pad: 12px;
        --desktop-range-height: 172px;
      }
      * { box-sizing: border-box; }
      html {
        color-scheme: dark;
        forced-color-adjust: none;
        min-height: 100vh;
      }
      body {
        margin: 0;
        font-family: "Avenir Next", "Trebuchet MS", sans-serif;
        background: radial-gradient(circle at 20% 5%, #243553, var(--bg));
        color: var(--text);
        forced-color-adjust: none;
        -webkit-text-size-adjust: 100%;
        min-height: 100vh;
      }
      main.app {
        max-width: 1400px;
        margin: 0 auto;
        padding: var(--app-pad);
        display: grid;
        grid-template-columns: minmax(400px, auto) minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 0;
        height: 100vh;
        overflow: hidden;
      }
      .sidebar {
        position: sticky;
        top: 0;
        align-self: start;
        display: grid;
        gap: 0;
        grid-column: 1;
        grid-row: 1;
        min-height: 0;
        max-height: 100%;
        overflow: auto;
      }
      .settings-panel {
        background: linear-gradient(165deg, #182437, var(--panel));
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        margin-right: var(--app-pad);
        margin-bottom: var(--app-pad);
        min-width: 400px;
      }
      .settings-panel summary {
        cursor: pointer;
        color: var(--muted);
        font-weight: 700;
      }
      h1, p { margin-top: 0; }
      p { color: var(--muted); }
      .sidebar-controls {
        display: grid;
        gap: var(--app-pad);
        margin-top: var(--app-pad);
      }
      button, input, select {
        border-radius: 8px;
        border: 1px solid #365276;
        background: #101d2d;
        color: var(--text);
        padding: 8px 10px;
      }
      button { cursor: pointer; }
      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        min-width: 0;
      }
      label input[type="range"] {
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }
      .label-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
      }
      .label-row span {
        color: var(--muted);
        white-space: nowrap;
      }
      .inline-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .inline-toggle input[type="checkbox"] {
        width: auto;
        margin: 0;
      }
      .pill-toggle {
        display: grid;
        gap: 6px;
      }
      .pill-toggle-group {
        position: relative;
        display: inline-grid;
        grid-auto-flow: column;
        gap: 4px;
        padding: 4px;
        border-radius: 999px;
        background: #101d2d;
        border: 1px solid #365276;
      }
      .pill-toggle-group.is-fourmode {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-flow: row;
        width: 100%;
      }
      .pill-thumb {
        position: absolute;
        top: 4px;
        left: 4px;
        width: calc(50% - 6px);
        height: calc(100% - 8px);
        border-radius: 999px;
        background: #f2f5fa;
        pointer-events: none;
      }
      .pill-option {
        position: relative;
        z-index: 1;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        padding: 8px 12px;
        font: inherit;
      }
      .pill-toggle-group.is-animating .pill-thumb {
        transition: transform 180ms ease, width 180ms ease;
      }
      .pill-toggle-group.is-animating .pill-option {
        transition: color 180ms ease;
      }
      .pill-option.is-active {
        color: #11161d;
      }
      #pitchWheel {
        width: auto;
        max-width: 100%;
        height: calc(100vh - var(--desktop-range-height) - (var(--app-pad) * 2));
        display: block;
        margin: 0;
        grid-column: 2;
        grid-row: 1;
        align-self: center;
        justify-self: center;
        min-height: 0;
        overflow: visible;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
      .desktop-range {
        margin-top: 0;
        width: 100%;
        grid-column: 1 / -1;
        grid-row: 2;
      }
      .desktop-range-label {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 8px;
        color: var(--muted);
        font-weight: 700;
      }
      .range-label-mouse {
        width: 22px;
        height: 30px;
        flex: 0 0 auto;
        display: block;
      }
      #rangePiano {
        width: 100%;
        height: 140px;
        border-radius: 6px;
        background: #10141d;
        border: 1px solid #2b3f5c;
        user-select: none;
        -webkit-user-select: none;
      }
      .piano-key {
        cursor: pointer;
      }
      .piano-key:hover {
        fill: #ffd84d !important;
      }
      .piano-label {
        fill: #000;
        font-size: 12px;
        font-family: "Avenir Next", "Trebuchet MS", sans-serif;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .mobile-inline-row {
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }
      .waveform-pager {
        position: relative;
        height: 66px;
        border-radius: 10px;
        border: 1px solid #365276;
        background: #101d2d;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      .waveform-pager-layer {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6f9;
        transition: background-color 120ms linear, opacity 120ms linear;
      }
      .waveform-pager-layer svg {
        width: 74px;
        height: 20px;
        display: block;
      }
      .waveform-pager-layer path {
        stroke: #0f1620;
        stroke-width: 2.4;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .gain-stack {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 66px;
      }
      .gain-box {
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #365276;
        border-radius: 10px;
        background: #101d2d;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        cursor: ns-resize;
        width: 100%;
        height: 100%;
        font-size: 1rem;
      }
      .conditional-control[hidden] {
        display: none !important;
      }
      .mobile-range-picker {
        display: none;
      }
      .range-wheel-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .range-wheel {
        display: grid;
        gap: 6px;
      }
      .range-wheel-scroller {
        position: relative;
        height: 180px;
        border-radius: 10px;
        border: 1px solid #365276;
        background: linear-gradient(180deg, rgba(16,29,45,0.96), rgba(12,20,31,0.96));
        overflow: hidden;
        cursor: grab;
      }
      .range-wheel-scroller.is-dragging {
        cursor: grabbing;
      }
      .range-wheel-scroller.is-dragging .range-wheel-list {
        scroll-snap-type: none;
        scroll-behavior: auto;
      }
      .range-wheel-list {
        height: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding: 72px 0;
        scroll-behavior: auto;
        user-select: none;
        -webkit-user-select: none;
        mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.88) 18%, rgba(0,0,0,1) 36%, rgba(0,0,0,1) 64%, rgba(0,0,0,0.88) 82%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.88) 18%, rgba(0,0,0,1) 36%, rgba(0,0,0,1) 64%, rgba(0,0,0,0.88) 82%, transparent 100%);
      }
      .range-wheel-list.is-ready {
        scroll-behavior: smooth;
      }
      .range-wheel-list::-webkit-scrollbar {
        display: none;
      }
      .range-wheel-item {
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        scroll-snap-align: center;
        color: rgba(17,25,39,0.68);
        font-size: 0.98rem;
        letter-spacing: 0.01em;
        transition: color 120ms linear, transform 120ms linear, opacity 120ms linear, background-color 120ms linear, border-color 120ms linear;
        background: #f4f6f9;
        border-bottom: 2px solid rgba(148, 163, 184, 0.42);
      }
      .range-wheel-item.is-black {
        background: #141a22;
        color: rgba(236,244,255,0.64);
        border-bottom: 2px solid rgba(115, 130, 150, 0.38);
      }
      .range-wheel-item.is-selected {
        color: #ffffff;
      }
      .range-wheel-item.is-selected:not(.is-black) {
        color: #10151f;
      }
      .range-wheel-selection {
        position: absolute;
        left: 0;
        right: 0;
        top: 70px;
        height: 40px;
        border: 3px solid #e6a23c;
        border-radius: 0;
        background: rgba(255,255,255,0.05);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
        pointer-events: none;
      }
      @media (max-width: 1000px) {
        main.app {
          grid-template-columns: 1fr;
          grid-template-rows: auto;
          height: auto;
          overflow: visible;
        }
        .sidebar { position: static; }
        .desktop-range {
          display: none;
        }
        .mobile-range-picker {
          display: block;
        }
        .settings-panel {
          min-width: 0;
        }
        #pitchWheel {
          grid-column: 1;
          grid-row: auto;
          width: auto;
          max-width: 100%;
          max-height: calc(100dvh - var(--mobile-settings-closed-height, 0px) - (var(--app-pad) * 3));
          height: auto;
        }
      }
      @media (max-width: 700px) {
        main.app {
          padding: 12px;
          gap: 10px;
        }
        .sidebar {
          width: 100%;
          gap: 0;
        }
        .sidebar > header {
          display: none;
        }
        .mobile-inline-row {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          align-items: start;
        }
        .mobile-hide {
          display: none !important;
        }
      }
    </style>
  </head>

                <button id="chordSize4Btn" class="pill-option" type="button">4</button>
              </div>
            </div>

                  <span class="pill-thumb" aria-hidden="true"></span>
                  <button id="triadVoicingRootBtn" class="pill-option" type="button">Root</button>
                  <button id="triadVoicingInversionsBtn" class="pill-option" type="button">Inversions</button>
                </div>
              </div>
            </div>
            <label id="chordNamesLabel" class="inline-toggle conditional-control">
              <span>Chord Names</span>
            </label>
            <div id="chordNamesControl" class="pill-toggle conditional-control">
              <div id="chordNamesGroup" class="pill-toggle-group" role="tablist" aria-label="Show chord names">
                <span class="pill-thumb" aria-hidden="true"></span>
                <button id="chordNamesHideBtn" class="pill-option" type="button">Hide</button>
                <button id="chordNamesShowBtn" class="pill-option" type="button">Show</button>
              </div>
            </div>
            <div id="maxIntervalControl" class="conditional-control">
              <div class="gain-stack">

              </div>
            </div>
          </section>
        </details>

        <svg id="rangePiano" viewBox="0 0 1040 140"></svg>

    </main>

      const audioEngine = {
        context: null,
        unlocked: false,
        promptOsc: null,
        promptGain: null,
        promptOscs: [],
        promptGains: [],
        rangeOsc: null,
        rangeGain: null,
        rangeReadyAt: 0,
        promptReadyAt: 0,
        async ensureContext() {
          if (!this.context) this.context = new (window.AudioContext || window.webkitAudioContext)();
          let justUnlocked = false;
          if (this.context.state === "suspended") {
            await this.context.resume();
            justUnlocked = true;
          }
          if (this.context.state === "running") this.unlocked = true;
          return justUnlocked;
        },
        async ensurePromptVoice() {
          const justUnlocked = await this.ensureContext();
          if (this.promptOsc && this.promptGain) return justUnlocked;
          const now = this.context.currentTime;
          const startTime = now + (justUnlocked ? 0.03 : 0.01);
          const osc = this.context.createOscillator();
          const g = this.context.createGain();
          osc.type = state.waveform;
          g.gain.setValueAtTime(0, now);
          g.gain.setValueAtTime(0, startTime);
          osc.connect(g);
          g.connect(this.context.destination);
          osc.start(startTime);
          this.promptOsc = osc;
          this.promptGain = g;
          this.promptReadyAt = startTime;
          return justUnlocked;
        },
        async ensurePromptVoices(count) {
          const justUnlocked = await this.ensureContext();
          while (this.promptOscs.length < count) {
            const now = this.context.currentTime;
            const startTime = now + (justUnlocked ? 0.03 : 0.01);
            const osc = this.context.createOscillator();
            const g = this.context.createGain();
            osc.type = state.waveform;
            g.gain.setValueAtTime(0, now);
            g.gain.setValueAtTime(0, startTime);
            osc.connect(g);
            g.connect(this.context.destination);
            osc.start(startTime);
            this.promptOscs.push(osc);
            this.promptGains.push(g);
            this.promptReadyAt = startTime;
          }
          return justUnlocked;
        },
        async ensureRangeVoice() {
          const justUnlocked = await this.ensureContext();
          if (this.rangeOsc && this.rangeGain) return justUnlocked;
          const now = this.context.currentTime;
          const startTime = now + (justUnlocked ? 0.03 : 0.01);
          const osc = this.context.createOscillator();
          const g = this.context.createGain();
          osc.type = state.waveform;
          g.gain.setValueAtTime(0, now);
          g.gain.setValueAtTime(0, startTime);
          osc.connect(g);
          g.connect(this.context.destination);
          osc.start(startTime);
          this.rangeOsc = osc;
          this.rangeGain = g;
          this.rangeReadyAt = startTime;
          return justUnlocked;
        },
        midiToFreq(midi) {
          return 440 * 2 ** ((midi - 69) / 12);
        },
        async startPrompt(midi, gain) {
          if (Array.isArray(midi)) {
            const justUnlocked = await this.ensurePromptVoices(midi.length);
            const now = this.context.currentTime;
            const startTime = Math.max(now + 0.004, this.promptReadyAt || 0);
            const attack = justUnlocked ? 0.05 : 0.02;
            const perVoiceGain = gain / Math.max(1, Math.sqrt(midi.length));
            for (let index = 0; index < this.promptOscs.length; index += 1) {
              const osc = this.promptOscs[index];
              const g = this.promptGains[index];
              const note = midi[index];
              g.gain.cancelScheduledValues(now);
              g.gain.setValueAtTime(g.gain.value, now);
              if (note == null) {
                g.gain.linearRampToValueAtTime(0, now + 0.03);
                continue;
              }
              osc.type = state.waveform;
              osc.frequency.cancelScheduledValues(now);
              osc.frequency.setValueAtTime(this.midiToFreq(note), startTime);
              g.gain.setValueAtTime(0, startTime);
              g.gain.linearRampToValueAtTime(compensatedGain(note, perVoiceGain), startTime + attack);
            }
            return;
          }
          const justUnlocked = await this.ensurePromptVoice();
          const now = this.context.currentTime;
          const startTime = Math.max(now + 0.004, this.promptReadyAt || 0);
          const attack = justUnlocked ? 0.05 : 0.02;
          const finalGain = compensatedGain(midi, gain);
          this.promptOsc.type = state.waveform;
          this.promptOsc.frequency.cancelScheduledValues(now);
          this.promptOsc.frequency.setValueAtTime(this.midiToFreq(midi), startTime);
          this.promptGain.gain.cancelScheduledValues(now);
          this.promptGain.gain.setValueAtTime(this.promptGain.gain.value, now);
          this.promptGain.gain.setValueAtTime(0, startTime);
          this.promptGain.gain.linearRampToValueAtTime(finalGain, startTime + attack);
        },
        stopPrompt() {
          if (!this.context) return;
          const now = this.context.currentTime;
          if (this.promptGain) {
            this.promptGain.gain.cancelScheduledValues(now);
            this.promptGain.gain.setValueAtTime(this.promptGain.gain.value, now);
            this.promptGain.gain.linearRampToValueAtTime(0, now + 0.03);
          }
          for (const g of this.promptGains) {
            g.gain.cancelScheduledValues(now);
            g.gain.setValueAtTime(g.gain.value, now);
            g.gain.linearRampToValueAtTime(0, now + 0.03);
          }
        },
        async startRangePrompt(midi, gain) {
          const justUnlocked = await this.ensureRangeVoice();
          const now = this.context.currentTime;
          const startTime = Math.max(now + 0.006, this.rangeReadyAt || 0);
          const attack = justUnlocked ? 0.04 : 0.015;
          const finalGain = compensatedGain(midi, gain);
          this.rangeOsc.type = state.waveform;
          this.rangeOsc.frequency.cancelScheduledValues(now);
          this.rangeOsc.frequency.setValueAtTime(this.midiToFreq(midi), startTime);
          this.rangeGain.gain.cancelScheduledValues(now);
          this.rangeGain.gain.setValueAtTime(this.rangeGain.gain.value, now);
          this.rangeGain.gain.setValueAtTime(0, startTime);
          this.rangeGain.gain.linearRampToValueAtTime(finalGain, startTime + attack);
        },
        stopRangePrompt() {
          if (!this.context || !this.rangeGain) return;
          const now = this.context.currentTime;
          this.rangeGain.gain.cancelScheduledValues(now);
          this.rangeGain.gain.setValueAtTime(this.rangeGain.gain.value, now);
          this.rangeGain.gain.linearRampToValueAtTime(0, now + 0.03);
        },
        updatePromptGain(midi, gain) {
          if (!this.context || midi === null) return;
          if (Array.isArray(midi)) {
            const now = this.context.currentTime;
            const perVoiceGain = gain / Math.max(1, Math.sqrt(midi.length));
            for (let index = 0; index < midi.length; index += 1) {
              const note = midi[index];
              const g = this.promptGains[index];
              if (!g || note == null) continue;
              g.gain.cancelScheduledValues(now);
              g.gain.setValueAtTime(g.gain.value, now);
              g.gain.linearRampToValueAtTime(compensatedGain(note, perVoiceGain), now + 0.03);
            }
            return;
          }
          if (!this.promptGain) return;
          const now = this.context.currentTime;
          const finalGain = compensatedGain(midi, gain);
          this.promptGain.gain.cancelScheduledValues(now);
          this.promptGain.gain.setValueAtTime(this.promptGain.gain.value, now);
          this.promptGain.gain.linearRampToValueAtTime(finalGain, now + 0.03);
        },
        async startNote(midi, gain) {
          const justUnlocked = await this.ensureContext();
          const now = this.context.currentTime;
          const startDelay = justUnlocked ? 0.02 : 0.003;
          const attack = justUnlocked ? 0.045 : 0.012;
          const startTime = now + startDelay;
          const finalGain = compensatedGain(midi, gain);
          const osc = this.context.createOscillator();
          const g = this.context.createGain();
          osc.type = state.waveform;
          osc.frequency.setValueAtTime(this.midiToFreq(midi), startTime);
          g.gain.cancelScheduledValues(now);
          g.gain.setValueAtTime(0, now);
          g.gain.setValueAtTime(0, startTime);
          g.gain.linearRampToValueAtTime(finalGain, startTime + attack);
          osc.connect(g);
          g.connect(this.context.destination);
          osc.start(startTime);
          return {
            stop: () => {
              const t = this.context.currentTime;
              const releaseStart = Math.max(t, startTime);
              const currentGain = g.gain.value;
              g.gain.cancelScheduledValues(t);
              g.gain.setValueAtTime(currentGain, releaseStart);
              g.gain.linearRampToValueAtTime(0, releaseStart + 0.03);
              osc.stop(releaseStart + 0.04);
            },
          };
        },
        async playForDuration(midi, gain, durationMs) {
          const handle = await this.startNote(midi, gain);
          window.setTimeout(() => handle.stop(), durationMs);
        },
      };

      function yyMmDd(date = new Date()) {
        return `${String(date.getFullYear()).slice(-2)}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function scoreKeyFor(date, chordSize = state.chordSize) {
        return `${date}|${chordSize}`;
      }

      function scoreByDateToCsv(scoreByDateAndChordSize) {
        const rows = [["date", "correct", "total", "chordSize"]];
        for (const key of Object.keys(scoreByDateAndChordSize).sort()) {
          const [date, chordSize] = key.split("|");
          const entry = scoreByDateAndChordSize[key];
          rows.push([date, String(entry[0] || 0), String(entry[1] || 0), String(entry[2] || chordSize || 1)]);
        }
        return rows.map((row) => row.join(",")).join("\n");
      }

      function csvToScoreByDate(csvText) {
        const out = {};
        if (!csvText) return out;
        const lines = csvText.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
        for (let index = 0; index < lines.length; index += 1) {
          const line = lines[index];
          if (index === 0 && line.toLowerCase() === "date,correct,total,chordsize") continue;
          const [date, correct, total, chordSize] = line.split(",");
          if (!date) continue;
          const normalizedChordSize = clamp(Number(chordSize) || 1, 1, 4);
          out[scoreKeyFor(date, normalizedChordSize)] = [Number(correct) || 0, Number(total) || 0, normalizedChordSize];
        }
        return out;
      }

      function loadDailyLog() {
        try {
          const raw = localStorage.getItem(DAILY_LOG_KEY);
          if (raw) return csvToScoreByDate(raw);
          return {};
        } catch (_err) {
          return {};
        }
      }

      function saveDailyLog() {
        localStorage.setItem(DAILY_LOG_KEY, scoreByDateToCsv(state.perfectPitch.scoreByDateAndChordSize));
      }

      function saveSettings() {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
          rangeStartMidi: state.rangeStartMidi,
          rangeEndMidi: state.rangeEndMidi,
          playMode: state.playMode,
          scoreMode: state.scoreMode,
          recentScore: state.recentScore,
          showKeyboardShortcuts: state.showKeyboardShortcuts,
          showChordNames: state.showChordNames,
          chordSize: state.chordSize,
          triadVoicingMode: state.triadVoicingMode,
          maxInterval: state.maxInterval,
          activePitchClasses: state.pitchClasses.map((pitch) => pitch.active),
          activeIntervals: state.activeIntervals,
          activeTriads: state.activeTriads,
          activeTetrads: state.activeTetrads,
          equalLoudness: state.equalLoudness,
          waveform: state.waveform,
          baseGain: state.baseGain,
        }));
      }

      function loadSettings() {
        try {
          const raw = localStorage.getItem(SETTINGS_KEY);
          if (!raw) return;
          const persisted = JSON.parse(raw);
          if (Number.isInteger(persisted.rangeStartMidi)) state.rangeStartMidi = clamp(persisted.rangeStartMidi, PIANO_MIN_MIDI, PIANO_MAX_MIDI);
          if (Number.isInteger(persisted.rangeEndMidi)) state.rangeEndMidi = clamp(persisted.rangeEndMidi, PIANO_MIN_MIDI, PIANO_MAX_MIDI);
          if (["press", "continuous", "demo", "toggle"].includes(persisted.playMode)) state.playMode = persisted.playMode;
          else if (typeof persisted.playContinuously === "boolean") state.playMode = persisted.playContinuously ? "continuous" : "press";
          if (["recent", "today", "all"].includes(persisted.scoreMode)) state.scoreMode = persisted.scoreMode;
          else if (typeof persisted.todayOnlyScore === "boolean") state.scoreMode = persisted.todayOnlyScore ? "today" : "all";
          if (Array.isArray(persisted.recentScore) && persisted.recentScore.length >= 2) {
            state.recentScore = [Math.max(0, Number(persisted.recentScore[0]) || 0), Math.max(0, Number(persisted.recentScore[1]) || 0)];
          }
          if (typeof persisted.showKeyboardShortcuts === "boolean") state.showKeyboardShortcuts = persisted.showKeyboardShortcuts;
          if (typeof persisted.showChordNames === "boolean") state.showChordNames = persisted.showChordNames;
          if ([1, 2, 3, 4].includes(Number(persisted.chordSize))) state.chordSize = Number(persisted.chordSize);
          if (persisted.triadVoicingMode === "root" || persisted.triadVoicingMode === "inversions") {
            state.triadVoicingMode = persisted.triadVoicingMode;
          }
          if (Number.isFinite(Number(persisted.maxInterval))) state.maxInterval = clamp(Math.round(Number(persisted.maxInterval)), 1, 24);
          if (Array.isArray(persisted.activePitchClasses)) {
            state.pitchClasses.forEach((pitch, index) => {
              if (typeof persisted.activePitchClasses[index] === "boolean") pitch.active = persisted.activePitchClasses[index];
            });
            if (!state.pitchClasses.some((pitch) => pitch.active)) state.pitchClasses[0].active = true;
          }
          if (Array.isArray(persisted.activeIntervals)) {
            for (let interval = 1; interval <= 24; interval += 1) {
              if (typeof persisted.activeIntervals[interval] === "boolean") state.activeIntervals[interval] = persisted.activeIntervals[interval];
            }
            if (!state.activeIntervals.slice(1).some(Boolean)) state.activeIntervals[1] = true;
          }
          if (Array.isArray(persisted.activeTriads)) {
            state.activeTriads = TRIADS.map((_, index) => typeof persisted.activeTriads[index] === "boolean" ? persisted.activeTriads[index] : true);
            if (!state.activeTriads.some(Boolean)) state.activeTriads[0] = true;
          }
          if (Array.isArray(persisted.activeTetrads)) {
            state.activeTetrads = TETRADS.map((_, index) => typeof persisted.activeTetrads[index] === "boolean" ? persisted.activeTetrads[index] : true);
            if (!state.activeTetrads.some(Boolean)) state.activeTetrads[0] = true;
          }
          if (typeof persisted.equalLoudness === "boolean") state.equalLoudness = persisted.equalLoudness;
          if (typeof persisted.waveform === "string" && waveformGainMultiplier(persisted.waveform)) state.waveform = persisted.waveform;
          if (Number.isFinite(Number(persisted.baseGain))) {
            state.baseGain = clamp(Number(persisted.baseGain), 0.02, 0.7);
          } else if (persisted.waveformGains && typeof persisted.waveformGains === "object") {
            const legacyGain = Number(persisted.waveformGains[state.waveform]);
            if (Number.isFinite(legacyGain)) {
              state.baseGain = clamp(legacyGain / waveformGainMultiplier(state.waveform), 0.02, 0.7);
            }
          }
        } catch (_err) {
        }
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function isContinuousMode() {
        return state.playMode === "continuous";
      }

      function isDemoMode() {
        return state.playMode === "demo";
      }

      function isToggleMode() {
        return state.playMode === "toggle";
      }

      function showsScoreButton() {
        return !isDemoMode() && !isToggleMode();
      }

      function getPromptGain() {
        return Math.min(0.95, state.baseGain * waveformGainMultiplier(state.waveform));
      }

      function compensatedGain(midi, baseGain) {
        if (!state.equalLoudness) return baseGain;
        const lookupIndex = clamp(midi - ISO226_MIN_MIDI, 0, ISO226_40PHON_GAIN.length - 1);
        const multiplier = ISO226_40PHON_GAIN[lookupIndex] ** 0.6;
        return Math.min(0.95, baseGain * multiplier);
      }

      function syncWaveformGainControl() {
        if (gainBox) gainBox.textContent = `Volume: ${Math.round(state.baseGain * 100)}`;
      }

      function syncMaxIntervalControl() {
        if (maxIntervalBox) maxIntervalBox.textContent = `Max Interval: ${state.maxInterval} (${INTERVAL_NAMES[state.maxInterval]})`;
        if (maxIntervalControl) maxIntervalControl.hidden = state.chordSize !== 2;
        if (triadVoicingControl) triadVoicingControl.hidden = ![3, 4].includes(state.chordSize);
      }

      function showsChordNamesToggle() {
        return state.chordSize === 3 || state.chordSize === 4;
      }

      function showsKeyboardShortcutToggle() {
        return !isMobileLayout() && (state.chordSize === 1 || state.chordSize === 2);
      }

      function syncChordNamesControl() {
        if (chordNamesLabel) chordNamesLabel.hidden = !showsChordNamesToggle();
        if (chordNamesControl) chordNamesControl.hidden = !showsChordNamesToggle();
        chordNamesHideBtn?.classList.toggle("is-active", !state.showChordNames);
        chordNamesShowBtn?.classList.toggle("is-active", state.showChordNames);
        syncPillThumb(chordNamesGroup, state.showChordNames ? chordNamesShowBtn : chordNamesHideBtn);
      }

      function syncKeyboardShortcutControl() {
        if (keyboardShortcutLabel) keyboardShortcutLabel.hidden = !showsKeyboardShortcutToggle();
        if (keyboardShortcutControl) keyboardShortcutControl.hidden = !showsKeyboardShortcutToggle();
        keyboardShortcutHideBtn?.classList.toggle("is-active", !state.showKeyboardShortcuts);
        keyboardShortcutShowBtn?.classList.toggle("is-active", state.showKeyboardShortcuts);
        syncPillThumb(keyboardShortcutGroup, state.showKeyboardShortcuts ? keyboardShortcutShowBtn : keyboardShortcutHideBtn);
      }

      function syncPillThumb(groupEl, activeButton) {
        if (!groupEl || !activeButton) return;
        const thumb = groupEl.querySelector(".pill-thumb");
        if (!thumb) return;
        const inset = 4;
        const left = activeButton.offsetLeft - 4;
        const top = activeButton.offsetTop - 4;
        const thumbRadius = activeButton.offsetHeight / 2;
        thumb.style.width = `${activeButton.offsetWidth}px`;
        thumb.style.height = `${activeButton.offsetHeight}px`;
        thumb.style.borderRadius = `${thumbRadius}px`;
        thumb.style.transform = `translate(${left}px, ${top}px)`;
        groupEl.style.borderRadius = `${thumbRadius + inset}px`;
      }

      function animatePillGroup(groupEl, updateFn) {
        if (!groupEl) {
          updateFn();
          return;
        }
        groupEl.classList.add("is-animating");
        updateFn();
        window.setTimeout(() => {
          groupEl.classList.remove("is-animating");
        }, 220);
      }

      function setupPillResizeObservers() {
        if (typeof ResizeObserver === "undefined") return;
        const observer = new ResizeObserver(() => {
          window.requestAnimationFrame(syncControls);
        });
        [
          playModePressBtn?.parentElement,
          scoreModeTodayBtn?.parentElement,
          chordSizeGroup,
          chordNamesGroup,
          keyboardShortcutGroup,
          triadVoicingGroup,
        ].filter(Boolean).forEach((groupEl) => observer.observe(groupEl));
      }

      function syncControls() {
        playModePressBtn.classList.toggle("is-active", state.playMode === "press");
        playModeContinuousBtn.classList.toggle("is-active", state.playMode === "continuous");
        playModeDemoBtn.classList.toggle("is-active", state.playMode === "demo");
        playModeToggleBtn.classList.toggle("is-active", state.playMode === "toggle");
        scoreModeRecentBtn.classList.toggle("is-active", state.scoreMode === "recent");
        scoreModeTodayBtn.classList.toggle("is-active", state.scoreMode === "today");
        scoreModeAllBtn.classList.toggle("is-active", state.scoreMode === "all");
        chordSize1Btn.classList.toggle("is-active", state.chordSize === 1);
        chordSize2Btn.classList.toggle("is-active", state.chordSize === 2);
        chordSize3Btn.classList.toggle("is-active", state.chordSize === 3);
        chordSize4Btn.classList.toggle("is-active", state.chordSize === 4);
        triadVoicingRootBtn?.classList.toggle("is-active", state.triadVoicingMode === "root");
        triadVoicingInversionsBtn?.classList.toggle("is-active", state.triadVoicingMode === "inversions");
        syncPillThumb(playModePressBtn.parentElement, ({
          press: playModePressBtn,
          continuous: playModeContinuousBtn,
          demo: playModeDemoBtn,
          toggle: playModeToggleBtn,
        })[state.playMode]);
        syncPillThumb(scoreModeTodayBtn.parentElement, ({
          recent: scoreModeRecentBtn,
          today: scoreModeTodayBtn,
          all: scoreModeAllBtn,
        })[state.scoreMode]);
        syncPillThumb(chordSizeGroup, [chordSize1Btn, chordSize2Btn, chordSize3Btn, chordSize4Btn][state.chordSize - 1]);
        syncPillThumb(chordNamesGroup, state.showChordNames ? chordNamesShowBtn : chordNamesHideBtn);
        syncPillThumb(keyboardShortcutGroup, state.showKeyboardShortcuts ? keyboardShortcutShowBtn : keyboardShortcutHideBtn);
        syncPillThumb(triadVoicingGroup, state.triadVoicingMode === "inversions" ? triadVoicingInversionsBtn : triadVoicingRootBtn);
        syncWaveformGainControl();
        syncMaxIntervalControl();
        syncChordNamesControl();
        syncKeyboardShortcutControl();
        waveformPager?._rerenderPager?.();
      }

      function currentScore() {
        const chordSize = state.chordSize;
        if (state.scoreMode === "recent") {
          return state.recentScore;
        }
        if (state.scoreMode === "today") {
          return state.perfectPitch.scoreByDateAndChordSize[scoreKeyFor(yyMmDd(), chordSize)] || [0, 0, chordSize];
        }
        let correct = 0;
        let total = 0;
        for (const entry of Object.values(state.perfectPitch.scoreByDateAndChordSize)) {
          if ((entry[2] || 1) !== chordSize) continue;
          correct += entry[0] || 0;
          total += entry[1] || 0;
        }
        return [correct, total];
      }

      function maxDisplayedInterval() {
        return Math.max(1, Math.min(state.rangeEndMidi - state.rangeStartMidi, state.maxInterval));
      }

      function parseYyMmDd(dateString) {
        const [yy, mm, dd] = dateString.split("-").map(Number);
        return new Date(2000 + yy, (mm || 1) - 1, dd || 1, 12);
      }

      function addDays(date, days) {
        const next = new Date(date);
        next.setDate(next.getDate() + days);
        return next;
      }

      function currentStreak() {
        const chordSize = state.chordSize;
        const activeDates = new Set(Object.entries(state.perfectPitch.scoreByDateAndChordSize)
          .filter(([, entry]) => (entry[2] || 1) === chordSize && (entry[1] || 0) > 0)
          .map(([key]) => key.split("|")[0]));
        let cursor = new Date();
        let streak = 0;
        while (activeDates.has(yyMmDd(cursor))) {
          streak += 1;
          cursor = addDays(cursor, -1);
        }
        return streak;
      }

      function updateScoreLabel() {
        const [correct, total] = currentScore();
        wheelSvg.setAttribute("aria-label", `Pitch wheel. Score ${correct} / ${total}`);
      }

      function drawScoreBadge(NS, cx, cy, r) {
        const streak = currentStreak();
        if (streak >= 2) {
          const streakText = document.createElementNS(NS, "text");
          streakText.setAttribute("x", String(cx));
          streakText.setAttribute("y", String(cy - r * 0.6));
          streakText.setAttribute("text-anchor", "middle");
          streakText.setAttribute("dominant-baseline", "middle");
          streakText.setAttribute("fill", "#ffb14a");
          streakText.setAttribute("font-size", String(r * 0.28));
          streakText.setAttribute("font-weight", "800");
          streakText.setAttribute("font-family", "Avenir Next, Trebuchet MS, sans-serif");
          streakText.textContent = `🔥${streak}`;
          wheelSvg.appendChild(streakText);
        }

        const [correct, total] = currentScore();
        const scoreString = `${correct} / ${total}`;
        const scoreText = document.createElementNS(NS, "text");
        scoreText.setAttribute("x", String(cx));
        scoreText.setAttribute("y", String(cy));
        scoreText.setAttribute("text-anchor", "middle");
        scoreText.setAttribute("dominant-baseline", "middle");
        scoreText.setAttribute("fill", "#ffffff");
        scoreText.setAttribute("font-size", String(r * 0.42));
        scoreText.setAttribute("font-weight", "700");
        scoreText.setAttribute("font-family", "Avenir Next, Trebuchet MS, sans-serif");
        scoreText.dataset.centerControl = "true";
        scoreText.textContent = scoreString;
        wheelSvg.appendChild(scoreText);
        const maxScoreWidth = r * 1.7;
        const measuredWidth = typeof scoreText.getComputedTextLength === "function" ? scoreText.getComputedTextLength() : 0;
        if (measuredWidth > maxScoreWidth && measuredWidth > 0) {
          const fittedFontSize = (r * 0.42 * maxScoreWidth) / measuredWidth;
          scoreText.setAttribute("font-size", String(fittedFontSize));
        }
      }

      function highlightPriority(kind) {
        return {
          neutral: 0,
          wrong: 1,
          correct: 2,
          revealed: 3,
          awaiting: 4,
        }[kind] ?? 0;
      }

      function midiToName(midi) {
        return `${MIDI_NOTE_NAMES[midi % 12]}${Math.floor(midi / 12) - 1}`;
      }

      function waveformPreviewSvg(waveform) {
        const paths = {
          sine: "M4 18 C12 18, 12 6, 20 6 S28 18, 36 18 S44 6, 52 6 S60 18, 68 18",
          triangle: "M4 18 L20 6 L36 18 L52 6 L68 18",
          square: "M4 18 L4 6 L20 6 L20 18 L36 18 L36 6 L52 6 L52 18 L68 18",
          sawtooth: "M4 18 L20 6 L20 18 L36 6 L36 18 L52 6 L52 18 L68 6"
        };
        return `<svg viewBox="0 0 72 24" aria-hidden="true" focusable="false"><path d="${paths[waveform]}"></path></svg>`;
      }

      function wrapWaveformIndex(index) {
        return ((index % WAVEFORMS.length) + WAVEFORMS.length) % WAVEFORMS.length;
      }

      function waveformAt(index) {
        return WAVEFORMS[wrapWaveformIndex(index)];
      }

      function currentWaveformIndex() {
        const index = WAVEFORMS.indexOf(state.waveform);
        return index === -1 ? 0 : index;
      }

      function setWaveform(nextWaveform) {
        if (nextWaveform === state.waveform) return;
        state.waveform = nextWaveform;
        if (state.holdActive) startHoldCurrentNote().catch(() => {});
        if (state.rangeHoldMidi !== null) startRangeHoldNote(state.rangeHoldMidi).catch(() => {});
        saveSettings();
      }

      function stepWaveform(delta) {
        const currentIndex = currentWaveformIndex();
        setWaveform(waveformAt(currentIndex + delta));
        waveformPager?._rerenderPager?.();
      }

      function setupWaveformPager() {
        if (!waveformPager) return;
        waveformPager.innerHTML = "";
        const layers = ["top", "center", "bottom"].map(() => {
          const div = document.createElement("div");
          div.className = "waveform-pager-layer";
          waveformPager.appendChild(div);
          return div;
        });

        const [pageTop, pageCenter, pageBottom] = layers;
        let startY = null;
        let dragIndex = 0;
        let snapTimer = null;
        const snapDurationMs = 100;

        function renderLayer(layer, waveform) {
          layer.innerHTML = waveformPreviewSvg(waveform);
        }

        function layout(index, dy = 0) {
          const h = waveformPager.clientHeight;
          renderLayer(pageTop, waveformAt(index - 1));
          renderLayer(pageCenter, waveformAt(index));
          renderLayer(pageBottom, waveformAt(index + 1));
          pageTop.style.transform = `translate3d(0,${dy - h}px,0)`;
          pageCenter.style.transform = `translate3d(0,${dy}px,0)`;
          pageBottom.style.transform = `translate3d(0,${dy + h}px,0)`;
        }

        function setTransition(value) {
          layers.forEach((layer) => { layer.style.transition = value; });
        }

        function rerender() {
          layout(currentWaveformIndex(), 0);
        }

        function animateTo(index, targetDy, commitIndex) {
          window.clearTimeout(snapTimer);
          setTransition(`transform ${snapDurationMs}ms ease-out`);
          layout(index, targetDy);
          snapTimer = window.setTimeout(() => {
            setTransition("none");
            setWaveform(waveformAt(commitIndex));
            rerender();
          }, snapDurationMs);
        }

        function start(y) {
          window.clearTimeout(snapTimer);
          setTransition("none");
          startY = y;
          dragIndex = currentWaveformIndex();
        }

        function move(y) {
          if (startY == null) return;
          const h = waveformPager.clientHeight;
          let dy = y - startY;
          while (dy <= -h) {
            dragIndex += 1;
            startY -= h;
            dy += h;
          }
          while (dy >= h) {
            dragIndex -= 1;
            startY += h;
            dy -= h;
          }
          layout(dragIndex, dy);
        }

        function end(y) {
          if (startY == null) return;
          const dy = y - startY;
          const threshold = waveformPager.clientHeight * 0.25;
          let commitIndex = dragIndex;
          let targetDy = 0;
          if (Math.abs(dy) > threshold) {
            if (dy < 0) {
              commitIndex = dragIndex + 1;
              targetDy = -waveformPager.clientHeight;
            } else {
              commitIndex = dragIndex - 1;
              targetDy = waveformPager.clientHeight;
            }
          }
          animateTo(dragIndex, targetDy, commitIndex);
          startY = null;
        }

        waveformPager.addEventListener("pointerdown", (event) => {
          start(event.clientY);
          waveformPager.setPointerCapture?.(event.pointerId);
          event.preventDefault();
        });
        waveformPager.addEventListener("pointermove", (event) => {
          move(event.clientY);
          event.preventDefault();
        });
        waveformPager.addEventListener("pointerup", (event) => {
          end(event.clientY);
          event.preventDefault();
        });
        waveformPager.addEventListener("pointercancel", (event) => {
          end(event.clientY);
          event.preventDefault();
        });
        waveformPager.addEventListener("wheel", (event) => {
          event.preventDefault();
          if (Math.abs(event.deltaY) < 2) return;
          stepWaveform(event.deltaY > 0 ? 1 : -1);
        }, { passive: false });

        rerender();
        waveformPager._rerenderPager = rerender;
      }

      function setBaseGain(nextGain) {
        state.baseGain = clamp(nextGain, 0.02, 0.7);
        syncWaveformGainControl();
        if (state.holdActive) {
          const promptTarget = [2, 3, 4].includes(state.chordSize) ? state.targetMidis : state.targetMidi;
          audioEngine.updatePromptGain(promptTarget, getPromptGain());
        }
        if (state.rangeHoldMidi !== null) startRangeHoldNote(state.rangeHoldMidi).catch(() => {});
        saveSettings();
      }

      function setMaxInterval(nextValue) {
        state.maxInterval = clamp(Math.round(nextValue), 1, 24);
        syncMaxIntervalControl();
        if (state.chordSize === 2) startNewRound();
        saveSettings();
      }

      function updateRangeText() {
        rangeText.textContent = `${midiToName(state.rangeStartMidi)}-${midiToName(state.rangeEndMidi)}`;
        syncRangeWheel(rangeStartWheel, state.rangeStartMidi);
        syncRangeWheel(rangeEndWheel, state.rangeEndMidi);
      }

      function enforceMinimumRangeSpan(changedEnd) {
        state.rangeStartMidi = clamp(state.rangeStartMidi, PIANO_MIN_MIDI, PIANO_MAX_MIDI - 1);
        state.rangeEndMidi = clamp(state.rangeEndMidi, PIANO_MIN_MIDI + 1, PIANO_MAX_MIDI);

        if (state.rangeEndMidi - state.rangeStartMidi >= 1) return;

        if (changedEnd === "start") {
          if (state.rangeStartMidi >= PIANO_MAX_MIDI) state.rangeStartMidi = PIANO_MAX_MIDI - 1;
          state.rangeEndMidi = clamp(state.rangeStartMidi + 1, PIANO_MIN_MIDI + 1, PIANO_MAX_MIDI);
          if (state.rangeEndMidi - state.rangeStartMidi < 1) {
            state.rangeStartMidi = state.rangeEndMidi - 1;
          }
          return;
        }

        if (state.rangeEndMidi <= PIANO_MIN_MIDI) state.rangeEndMidi = PIANO_MIN_MIDI + 1;
        state.rangeStartMidi = clamp(state.rangeEndMidi - 1, PIANO_MIN_MIDI, PIANO_MAX_MIDI - 1);
      }

      function applyPianoRangeStyles() {
        for (const [midi, el] of state.pianoKeyEls.entries()) {
          const isBlack = [1, 3, 6, 8, 10].includes(midi % 12);
          let fill = isBlack ? "#121926" : "#f6f8fc";
          if (midi === state.rangeStartMidi) fill = "#44d18f";
          else if (midi === state.rangeEndMidi) fill = "#ff7a7a";
          el.setAttribute("fill", fill);
        }
      }

      function setRangeStart(midi) {
        state.rangeStartMidi = clamp(midi, PIANO_MIN_MIDI, PIANO_MAX_MIDI - 1);
        enforceMinimumRangeSpan("start");
        updateRangeText();
        applyPianoRangeStyles();
        startNewRound();
        saveSettings();
      }

      function setRangeEnd(midi) {
        state.rangeEndMidi = clamp(midi, PIANO_MIN_MIDI + 1, PIANO_MAX_MIDI);
        enforceMinimumRangeSpan("end");
        updateRangeText();
        applyPianoRangeStyles();
        startNewRound();
        saveSettings();
      }

      function buildPianoSvg() {
        const NS = "http://www.w3.org/2000/svg";
        rangePiano.innerHTML = "";
        state.pianoKeyEls.clear();
        const width = Math.max(rangePiano.clientWidth || rangePiano.parentElement?.clientWidth || 1040, 520);
        const whiteW = width / 52;
        const whiteH = 140;
        const blackW = whiteW * 0.62;
        const blackH = 88;
        rangePiano.setAttribute("viewBox", `0 0 ${width} ${whiteH}`);
        const whiteMidis = [];
        for (let midi = PIANO_MIN_MIDI; midi <= PIANO_MAX_MIDI; midi += 1) if (![1, 3, 6, 8, 10].includes(midi % 12)) whiteMidis.push(midi);
        const whiteIndexByMidi = new Map();
        whiteMidis.forEach((midi, idx) => {
          whiteIndexByMidi.set(midi, idx);
          const rect = document.createElementNS(NS, "rect");
          rect.setAttribute("x", String(idx * whiteW));
          rect.setAttribute("y", "0");
          rect.setAttribute("width", String(whiteW + 0.2));
          rect.setAttribute("height", String(whiteH));
          rect.setAttribute("stroke", "#2b3f5c");
          rect.setAttribute("stroke-width", "1");
          rect.setAttribute("class", "piano-key");
          rect.dataset.midi = String(midi);
          rangePiano.appendChild(rect);
          state.pianoKeyEls.set(midi, rect);
        });
        for (let midi = PIANO_MIN_MIDI; midi <= PIANO_MAX_MIDI; midi += 1) {
          if (![1, 3, 6, 8, 10].includes(midi % 12)) continue;
          const prevIndex = whiteIndexByMidi.get(midi - 1);
          if (prevIndex === undefined) continue;
          const rect = document.createElementNS(NS, "rect");
          rect.setAttribute("x", String((prevIndex + 1) * whiteW - blackW / 2));
          rect.setAttribute("y", "0");
          rect.setAttribute("width", String(blackW));
          rect.setAttribute("height", String(blackH));
          rect.setAttribute("stroke", "#111927");
          rect.setAttribute("stroke-width", "1");
          rect.setAttribute("class", "piano-key");
          rect.dataset.midi = String(midi);
          rangePiano.appendChild(rect);
          state.pianoKeyEls.set(midi, rect);
        }
        for (let midi = 24; midi <= 108; midi += 12) {
          const whiteIndex = whiteIndexByMidi.get(midi);
          if (whiteIndex === undefined) continue;
          const text = document.createElementNS(NS, "text");
          text.setAttribute("x", String(whiteIndex * whiteW + whiteW / 2));
          text.setAttribute("y", "133");
          text.setAttribute("text-anchor", "middle");
          text.setAttribute("class", "piano-label");
          text.textContent = `C${Math.floor(midi / 12) - 1}`;
          rangePiano.appendChild(text);
        }
        rangePiano.addEventListener("contextmenu", (event) => event.preventDefault());
        rangePiano.addEventListener("mousedown", (event) => {
          const key = event.target.closest(".piano-key");
          if (!key) return;
          event.preventDefault();
          const midi = Number(key.dataset.midi);
          state.rangeHoldWasHolding = state.holdActive;
          state.suppressPromptPlayback = true;
          if (isContinuousMode() && state.holdActive) stopHoldCurrentNote();
          if (event.button === 2) setRangeEnd(midi);
          else if (event.button === 0) setRangeStart(midi);
          else return;
          startRangeHoldNote(midi).catch(() => {});
        });
        updateRangeText();
        applyPianoRangeStyles();
      }

      function buildRangeWheels() {
        if (!rangeStartWheel || !rangeEndWheel) return;
        rangeStartWheel.classList.remove("is-ready");
        rangeEndWheel.classList.remove("is-ready");
        rangeStartWheel.innerHTML = "";
        rangeEndWheel.innerHTML = "";
        for (let midi = PIANO_MIN_MIDI; midi <= PIANO_MAX_MIDI; midi += 1) {
          const startItem = document.createElement("div");
          startItem.className = "range-wheel-item";
          if ([1, 3, 6, 8, 10].includes(midi % 12)) startItem.classList.add("is-black");
          startItem.dataset.midi = String(midi);
          startItem.textContent = midiToName(midi);
          rangeStartWheel.appendChild(startItem);
          const endItem = document.createElement("div");
          endItem.className = "range-wheel-item";
          if ([1, 3, 6, 8, 10].includes(midi % 12)) endItem.classList.add("is-black");
          endItem.dataset.midi = String(midi);
          endItem.textContent = midiToName(midi);
          rangeEndWheel.appendChild(endItem);
        }
        updateRangeText();
        window.requestAnimationFrame(() => {
          rangeStartWheel.classList.add("is-ready");
          rangeEndWheel.classList.add("is-ready");
        });
      }

      function midiToWheelIndex(midi) {
        return clamp(midi - PIANO_MIN_MIDI, 0, PIANO_MAX_MIDI - PIANO_MIN_MIDI);
      }

      function wheelIndexToMidi(index) {
        return clamp(PIANO_MIN_MIDI + index, PIANO_MIN_MIDI, PIANO_MAX_MIDI);
      }

      function selectedWheelMidi(wheelEl) {
        const index = Math.round(wheelEl.scrollTop / RANGE_WHEEL_ITEM_HEIGHT);
        return wheelIndexToMidi(index);
      }

      function attachDesktopWheelDrag(wheelEl, which) {
        if (!wheelEl) return;
        const scroller = wheelEl.parentElement;
        if (!scroller) return;
        let dragging = false;
        let startY = 0;
        let startScrollTop = 0;
        let moved = false;

        scroller.addEventListener("pointerdown", (event) => {
          if (event.pointerType === "touch" || event.button !== 0) return;
          dragging = true;
          moved = false;
          startY = event.clientY;
          startScrollTop = wheelEl.scrollTop;
          scroller.classList.add("is-dragging");
          scroller.setPointerCapture(event.pointerId);
          event.preventDefault();
        });

        scroller.addEventListener("pointermove", (event) => {
          if (!dragging) return;
          const delta = event.clientY - startY;
          if (Math.abs(delta) > 3) moved = true;
          wheelEl.scrollTop = startScrollTop - delta;
          updateWheelSelectionClass(wheelEl, selectedWheelMidi(wheelEl));
          event.preventDefault();
        });

        const finishDrag = (event) => {
          if (!dragging) return;
          dragging = false;
          scroller.classList.remove("is-dragging");
          if (event && scroller.hasPointerCapture && scroller.hasPointerCapture(event.pointerId)) {
            scroller.releasePointerCapture(event.pointerId);
          }
          scheduleRangeWheelSnap(which);
        };

        scroller.addEventListener("pointerup", finishDrag);
        scroller.addEventListener("pointercancel", finishDrag);
        scroller.addEventListener("lostpointercapture", () => {
          if (!dragging) return;
          dragging = false;
          scroller.classList.remove("is-dragging");
          scheduleRangeWheelSnap(which);
        });

        wheelEl.addEventListener("click", (event) => {
          if (!moved) return;
          event.preventDefault();
          event.stopPropagation();
          moved = false;
        }, true);
      }

      function updateWheelSelectionClass(wheelEl, midi) {
        if (!wheelEl) return;
        for (const item of wheelEl.children) {
          item.classList.toggle("is-selected", Number(item.dataset.midi) === midi);
        }
      }

      function syncRangeWheel(wheelEl, midi, immediate = true) {
        if (!wheelEl) return;
        const top = midiToWheelIndex(midi) * RANGE_WHEEL_ITEM_HEIGHT;
        if (immediate) wheelEl.scrollTop = top;
        else wheelEl.scrollTo({ top, behavior: "smooth" });
        updateWheelSelectionClass(wheelEl, midi);
      }

      function clearRangeWheelSnapTimers() {
        for (const timerKey of ["start", "end"]) {
          if (!state.rangeWheelSnapTimers[timerKey]) continue;
          window.clearTimeout(state.rangeWheelSnapTimers[timerKey]);
          state.rangeWheelSnapTimers[timerKey] = null;
        }
      }

      function snapRangeWheel(which) {
        if (!isMobileLayout()) return;
        const wheelEl = which === "start" ? rangeStartWheel : rangeEndWheel;
        if (!wheelEl) return;
        const midi = selectedWheelMidi(wheelEl);
        if (which === "start") setRangeStart(midi);
        else setRangeEnd(midi);
        syncRangeWheel(wheelEl, midi, false);
      }

      function scheduleRangeWheelSnap(which) {
        if (!isMobileLayout()) return;
        const timerKey = which === "start" ? "start" : "end";
        if (state.rangeWheelSnapTimers[timerKey]) window.clearTimeout(state.rangeWheelSnapTimers[timerKey]);
        state.rangeWheelSnapTimers[timerKey] = window.setTimeout(() => {
          state.rangeWheelSnapTimers[timerKey] = null;
          snapRangeWheel(which);
        }, 90);
      }

      function syncMobileSettingsHeight() {
        if (!settingsPanel) return;
        const summary = settingsPanel.querySelector("summary");
        const summaryHeight = summary ? summary.getBoundingClientRect().height : 0;
        const styles = window.getComputedStyle(settingsPanel);
        const paddingTop = parseFloat(styles.paddingTop) || 0;
        const paddingBottom = parseFloat(styles.paddingBottom) || 0;
        const borderTop = parseFloat(styles.borderTopWidth) || 0;
        const borderBottom = parseFloat(styles.borderBottomWidth) || 0;
        const closedHeight = summaryHeight + paddingTop + paddingBottom + borderTop + borderBottom;
        document.documentElement.style.setProperty("--mobile-settings-closed-height", `${Math.ceil(closedHeight)}px`);
      }

      function chooseMidiForPc(pc) {
        const candidates = [];
        for (let midi = state.rangeStartMidi; midi <= state.rangeEndMidi; midi += 1) if (midi % 12 === pc) candidates.push(midi);
        return candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : null;
      }

      function activePitchClasses() {
        return state.pitchClasses.filter((pitch) => pitch.active);
      }

      function activeIntervalsInRange() {
        const out = [];
        const maxInterval = maxDisplayedInterval();
        for (let interval = 1; interval <= maxInterval; interval += 1) {
          if (state.activeIntervals[interval]) out.push(interval);
        }
        return out;
      }

      function pcsAvailableInRange() {
        const out = new Set();
        for (let midi = state.rangeStartMidi; midi <= state.rangeEndMidi; midi += 1) out.add(midi % 12);
        return out;
      }

      function colorAtHue(hue, lightness, chroma) {
        return `oklch(${lightness} ${chroma} ${hue})`;
      }

      function polarPoint(cx, cy, radius, angle) {
        return { x: cx + Math.cos(angle) * radius, y: cy + Math.sin(angle) * radius };
      }

      function sectorPath(cx, cy, rInner, rOuter, start, end) {
        const p1 = polarPoint(cx, cy, rOuter, start);
        const p2 = polarPoint(cx, cy, rOuter, end);
        const p3 = polarPoint(cx, cy, rInner, end);
        const p4 = polarPoint(cx, cy, rInner, start);
        const large = end - start > Math.PI ? 1 : 0;
        return `M ${p1.x} ${p1.y} A ${rOuter} ${rOuter} 0 ${large} 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${rInner} ${rInner} 0 ${large} 0 ${p4.x} ${p4.y} Z`;
      }

      function annularSectorCentroidRadius(rInner, rOuter, theta) {
        const safeTheta = Math.max(theta, 1e-6);
        const numerator = 4 * Math.sin(safeTheta / 2) * (rOuter ** 3 - rInner ** 3);
        const denominator = 3 * safeTheta * (rOuter ** 2 - rInner ** 2);
        return numerator / denominator;
      }

      function drawSvgKeycap(NS, x, centerY, label, options = {}) {

        const padding = options.padding ?? (labelFontSize * .0);

        const textEl = document.createElementNS(NS, "text");
        textEl.setAttribute("x", String(x));
        textEl.setAttribute("y", String(centerY));
        textEl.setAttribute("text-anchor", "middle");
        textEl.setAttribute("dominant-baseline", "middle");
        textEl.setAttribute("fill", "#0f1620");
        textEl.setAttribute("font-size", String(fontSize));
        textEl.setAttribute("font-weight", "700");
        textEl.setAttribute("font-family", "Avenir Next, Trebuchet MS, sans-serif");
        textEl.setAttribute("pointer-events", "none");
        textEl.textContent = text;
        wheelSvg.appendChild(textEl);

        const textWidth = textEl.getComputedTextLength();
        const bbox = textEl.getBBox();
        const side = options.side ?? (Math.max(textWidth, bbox.height) + padding * 2);
        const radius = options.radius ?? Math.max(4, side * 0.25);
        const glyphCenterY = bbox.y + bbox.height / 2;
        const rect = document.createElementNS(NS, "rect");
        rect.setAttribute("x", String(x - side / 2));
        rect.setAttribute("y", String(glyphCenterY - side / 2));
        rect.setAttribute("width", String(side));
        rect.setAttribute("height", String(side));
        rect.setAttribute("rx", String(radius));
        rect.setAttribute("fill", "rgba(220,226,234,0.92)");
        rect.setAttribute("stroke", "rgba(10,16,24,0.38)");
        rect.setAttribute("stroke-width", "1");

      function clockDegreesToSvgRadians(clockDegrees) {
        return (clockDegrees * Math.PI) / 180 - Math.PI / 2;
      }

      const BIPHONIC_SPIRAL_START_DEGREES = 18;

      function spiralPoint(cx, cy, radius, clockDegrees) {
        const angle = clockDegreesToSvgRadians(clockDegrees);
        return {
          x: cx + Math.cos(angle) * radius,
          y: cy + Math.sin(angle) * radius,
        };
      }

      function spiralSegmentGeometry(cx, cy, unitRadius, startClockDegrees, endClockDegrees, growthPerRadian, steps = 24) {
        const outerPoints = [];
        const innerPoints = [];
        for (let index = 0; index <= steps; index += 1) {
          const t = index / steps;
          const clockDegrees = startClockDegrees + (endClockDegrees - startClockDegrees) * t;
          const theta = clockDegreesToSvgRadians(clockDegrees);
          const thetaOffset = theta - clockDegreesToSvgRadians(BIPHONIC_SPIRAL_START_DEGREES);
          const innerRadius = unitRadius + growthPerRadian * thetaOffset;
          const outerRadius = innerRadius + unitRadius;
          outerPoints.push(spiralPoint(cx, cy, outerRadius, clockDegrees));
          innerPoints.push(spiralPoint(cx, cy, innerRadius, clockDegrees));
        }
        const first = outerPoints[0];
        const outerPath = outerPoints.map((point) => `L ${point.x} ${point.y}`).join(" ");
        const innerPath = innerPoints.reverse().map((point) => `L ${point.x} ${point.y}`).join(" ");
        return {
          path: `M ${first.x} ${first.y} ${outerPath} ${innerPath} Z`,
          outerPoints,
          innerPoints,
        };
      }

      function drawBiphonicSpiral(NS, cx, cy) {
        const unitRadius = 62;
        const growthPerRadian = unitRadius / (2 * Math.PI);
        const startClockDegrees = BIPHONIC_SPIRAL_START_DEGREES;
        const segmentDegrees = 30;
        const segmentCount = maxDisplayedInterval();
        const showShortcuts = state.showKeyboardShortcuts && !isMobileLayout();
        const overlayGroup = document.createElementNS(NS, "g");
        const overlayEntries = [];
        const bounds = {
          minX: cx - unitRadius,
          maxX: cx + unitRadius,
          minY: cy - unitRadius,
          maxY: cy + unitRadius,
        };

        function includePoint(point) {
          bounds.minX = Math.min(bounds.minX, point.x);
          bounds.maxX = Math.max(bounds.maxX, point.x);
          bounds.minY = Math.min(bounds.minY, point.y);
          bounds.maxY = Math.max(bounds.maxY, point.y);
        }

        for (let index = 0; index < segmentCount; index += 1) {
          const start = startClockDegrees + index * segmentDegrees;
          const end = start + segmentDegrees;
          const interval = index + 1;
          const pc = index % 12;
          const active = !!state.activeIntervals[interval];
          const hovered = state.hoveredPc === interval && state.hoveredZone === "pitch";
          let stroke = "rgba(255,255,255,0.22)";
          let strokeWidth = "1.2";
          let highlightKind = "neutral";
          if (state.perfectPitch.awaitingAdvance && state.targetInterval === interval) {
            stroke = "#d4af37";
            strokeWidth = "4";
            highlightKind = "awaiting";
          } else if (state.perfectPitch.feedbackPc === interval) {
            stroke = state.perfectPitch.feedbackKind === "correct" ? "#40d97b" : "#ff5d73";
            strokeWidth = "4";
            highlightKind = state.perfectPitch.feedbackKind === "correct" ? "correct" : "wrong";
          } else if (state.revealed && state.targetInterval === interval) {
            stroke = "#ffffff";
            strokeWidth = "4";
            highlightKind = "revealed";
          }
          const segment = document.createElementNS(NS, "path");
          const geometry = spiralSegmentGeometry(cx, cy, unitRadius, start, end, growthPerRadian);
          segment.setAttribute("d", geometry.path);
          segment.setAttribute("fill", active ? colorAtHue((pc * 360) / EDO, hovered ? PITCH_HOVER_LIGHTNESS : PITCH_MUTED_LIGHTNESS, hovered ? PITCH_HOVER_CHROMA : PITCH_MUTED_CHROMA) : "rgba(95,105,120,0.28)");
          segment.dataset.pc = String(interval);
          segment.dataset.zone = "pitch";
          wheelSvg.appendChild(segment);

          const overlay = document.createElementNS(NS, "path");
          overlay.setAttribute("d", geometry.path);
          overlay.setAttribute("fill", "none");
          overlay.setAttribute("stroke", stroke);
          overlay.setAttribute("stroke-width", strokeWidth);
          overlay.dataset.pc = String(interval);
          overlay.dataset.zone = "pitch";
          overlayEntries.push({ priority: highlightPriority(highlightKind), overlay });

          geometry.outerPoints.forEach(includePoint);
          geometry.innerPoints.forEach(includePoint);

          const labelAngle = start + segmentDegrees / 2;
          const labelThetaOffset = clockDegreesToSvgRadians(labelAngle) - clockDegreesToSvgRadians(BIPHONIC_SPIRAL_START_DEGREES);
          const labelInnerRadius = unitRadius + growthPerRadian * labelThetaOffset;
          const labelOuterRadius = labelInnerRadius + unitRadius;
          const labelPoint = spiralPoint(cx, cy, (labelInnerRadius + labelOuterRadius) / 2, labelAngle);
          const labelFontSize = 11;
          const groupCenterY = labelPoint.y;
          const shortcutFontSize = Math.max(9, labelFontSize * 0.7);
          const keycapPadding = labelFontSize * 0.1;
          const keycapHeight = shortcutFontSize + keycapPadding * 2;
          const gap = labelFontSize * 0.3;
          const stackedHalfHeight = (labelFontSize + gap + keycapHeight) / 2;
          const labelCenterY = showShortcuts ? groupCenterY - (stackedHalfHeight - labelFontSize / 2) : groupCenterY;
          const keycapCenterY = showShortcuts ? groupCenterY + (stackedHalfHeight - keycapHeight / 2) : groupCenterY;
          const keycapLabel = INTERVAL_SHORTCUTS[interval];
          const halfWidth = Math.max(24, showShortcuts ? 28 : 24);
          includePoint({ x: labelPoint.x - halfWidth, y: showShortcuts ? labelCenterY - labelFontSize / 2 : labelCenterY - labelFontSize / 2 });
          includePoint({ x: labelPoint.x + halfWidth, y: showShortcuts ? keycapCenterY + keycapHeight / 2 : labelCenterY + labelFontSize / 2 });
          const label = document.createElementNS(NS, "text");
          label.setAttribute("x", String(labelPoint.x));
          label.setAttribute("y", String(labelCenterY));
          label.setAttribute("text-anchor", "middle");
          label.setAttribute("dominant-baseline", "middle");
          label.setAttribute("fill", "#ffffff");
          label.setAttribute("font-size", String(labelFontSize));
          label.setAttribute("font-weight", "700");
          label.setAttribute("font-family", "Avenir Next, Trebuchet MS, sans-serif");
          label.setAttribute("pointer-events", "none");
          label.textContent = INTERVAL_SHORT_NAMES[interval];
          wheelSvg.appendChild(label);
          if (showShortcuts) {
            drawSvgKeycap(NS, labelPoint.x, keycapCenterY, keycapLabel, { labelFontSize });
          }
        }

        if (showsScoreButton()) {
          const centerCircle = document.createElementNS(NS, "circle");
          centerCircle.setAttribute("cx", String(cx));
          centerCircle.setAttribute("cy", String(cy));
          centerCircle.setAttribute("r", String(unitRadius));
          centerCircle.setAttribute("fill", "rgba(8, 14, 22, 0.95)");
          centerCircle.setAttribute("stroke", "rgba(255,255,255,0.24)");
          centerCircle.setAttribute("stroke-width", "2");
          centerCircle.dataset.centerControl = "true";
          wheelSvg.appendChild(centerCircle);
        }
        overlayEntries.sort((a, b) => a.priority - b.priority).forEach(({ overlay }) => overlayGroup.appendChild(overlay));
        wheelSvg.appendChild(overlayGroup);
        return { bounds };
      }

      function drawGridScaffold(NS, left, top, columns, rows, cellSize, clipPrefix) {

      function gridCellHighlight(index) {

      function drawGridCells(NS, cells, cellSize, labelFontSize) {

      function drawTriphonicGrid(NS, cx, cy) {

              const xValue = column + 1;

              const triadIndex = TRIADS.indexOf(canonicalKey);
              if (triadIndex === -1) continue;

            label.setAttribute("fill", "#ffffff");
            label.setAttribute("font-size", String(labelFontSize));
            label.setAttribute("font-weight", "700");
            label.setAttribute("font-family", "Avenir Next, Trebuchet MS, sans-serif");
            label.setAttribute("pointer-events", "none");

            wheelSvg.appendChild(label);
          }
        }

        const scoreBox = {
          x: left + cellSize * 2,
          y: top,
          width: cellSize * 2,
          height: cellSize * 2,
        };

        if (showsScoreButton()) {
          const scoreCircle = document.createElementNS(NS, "circle");
          scoreCircle.setAttribute("cx", String(scoreBox.x + scoreBox.width / 2));
          scoreCircle.setAttribute("cy", String(scoreBox.y + scoreBox.height / 2));
          scoreCircle.setAttribute("r", String(Math.min(scoreBox.width, scoreBox.height) / 2));
          scoreCircle.setAttribute("fill", "rgba(8, 14, 22, 0.95)");
          scoreCircle.setAttribute("stroke", "rgba(255,255,255,0.24)");
          scoreCircle.setAttribute("stroke-width", "2");
          scoreCircle.dataset.centerControl = "true";

        }
