<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Lab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='52' text-anchor='middle' font-size='58'%3E%F0%9F%8E%B9%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #10151b;
      --bg2: #18232d;
      --panel: rgba(245, 239, 222, 0.92);
      --panel-dark: rgba(20, 28, 36, 0.9);
      --ink: #17202a;
      --paper: #f7f0de;
      --muted: #667076;
      --muted-dark: #9fb0bc;
      --line: rgba(32, 43, 51, 0.16);
      --accent: #d99f45;
      --accent2: #76bdd0;
      --accent3: #d15f4b;
      --shadow: 0 28px 70px rgba(0, 0, 0, 0.34);
      --radius: 24px;
      --sans: "Avenir Next", "Gill Sans", "Trebuchet MS", sans-serif;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      color: var(--paper);
      font-family: var(--sans);
      background:
        radial-gradient(circle at 12% 6%, rgba(217, 159, 69, 0.24), transparent 24rem),
        radial-gradient(circle at 92% 8%, rgba(118, 189, 208, 0.20), transparent 26rem),
        radial-gradient(circle at 70% 100%, rgba(209, 95, 75, 0.14), transparent 26rem),
        linear-gradient(180deg, var(--bg2), var(--bg));
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      width: calc(100vw - clamp(12px, 1.5vw, 28px));
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: 14px 0;
      padding: clamp(8px, 1.6dvh, 22px) 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      gap: 18px;
      min-height: 0;
    }

    .panel {
      border: 1px solid rgba(247, 240, 222, 0.14);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    h2,
    p {
      margin: 0;
    }

    .workspace {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
      min-height: 0;
    }

    .panel {
      background: var(--panel);
      color: var(--ink);
    }

    .controls {
      padding: 18px;
      display: grid;
      align-content: start;
      gap: 14px;
      min-height: 0;
      max-height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .control-group {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 252, 244, 0.62);
    }

    .group-title {
      color: #735738;
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .control {
      display: grid;
      gap: 6px;
    }

    .is-hidden {
      display: none;
    }

    label {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .control-label {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .value-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 4.8ch;
      gap: 8px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    select,
    input[type="number"] {
      width: 100%;
      min-height: 40px;
      border: 1px solid rgba(33, 43, 51, 0.18);
      border-radius: 12px;
      background: #fffaf0;
      color: var(--ink);
      padding: 0 10px;
    }

    .reset-button {
      min-height: 40px;
      border: 1px solid rgba(33, 43, 51, 0.18);
      border-radius: 12px;
      color: #1b1712;
      background: #fffaf0;
      cursor: pointer;
      font-weight: 900;
    }

    .reset-button:hover {
      background: #ffe4ad;
    }

    output {
      min-width: 5.2ch;
      min-height: 34px;
      display: inline-grid;
      align-items: center;
      justify-items: end;
      padding: 0 10px;
      border: 1px solid rgba(33, 43, 51, 0.16);
      border-radius: 12px;
      background: linear-gradient(180deg, #ffe4ad, #d99f45);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 8px 18px rgba(20, 28, 36, 0.14);
      cursor: nesw-resize;
      user-select: none;
      touch-action: none;
      text-align: right;
      color: #1b1712;
      font-family: "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    #releaseOut {
      width: 10ch;
    }

    output.is-dragging {
      filter: brightness(1.06);
      transform: translateY(1px);
    }

    .control:has(.value-row) {
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 10px;
    }

    .control:has(.value-row) > label {
      min-width: 0;
    }

    .pill-toggle {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      padding: 4px;
      border: 1px solid rgba(33, 43, 51, 0.16);
      border-radius: 999px;
      background: rgba(255, 250, 240, 0.72);
    }

    .pill-toggle button {
      position: relative;
      z-index: 1;
      min-height: 34px;
      border: 0;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-weight: 900;
    }

    .pill-window {
      position: absolute;
      top: 4px;
      left: 4px;
      z-index: 0;
      border-radius: 14px;
      background: #17232d;
      box-shadow: 0 8px 18px rgba(20, 28, 36, 0.22);
      pointer-events: none;
      transform: translate(0, 0);
    }

    .pill-toggle.is-animating .pill-window {
      transition:
        transform 190ms cubic-bezier(0.2, 0.72, 0.22, 1),
        width 190ms cubic-bezier(0.2, 0.72, 0.22, 1),
        height 190ms cubic-bezier(0.2, 0.72, 0.22, 1),
        border-radius 190ms cubic-bezier(0.2, 0.72, 0.22, 1);
    }

    .pill-toggle.is-animating button {
      transition: color 190ms ease;
    }

    .pill-toggle button.is-active {
      color: var(--paper);
      background: transparent;
      box-shadow: none;
    }

    .instrument-toggle {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-radius: 18px;
    }

    .instrument-toggle button {
      min-height: 38px;
      border-radius: 14px;
      font-size: 0.86rem;
      line-height: 1.1;
    }

    .wave-toggle {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-radius: 18px;
    }

    .wave-toggle button {
      border-radius: 14px;
      font-size: 0.84rem;
      line-height: 1.1;
      text-transform: capitalize;
    }

    .pedal-toggle {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 180px;
    }

    .spiro-sign-toggle,
    .spiro-motion-toggle {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-radius: 18px;
    }

    .spiro-sign-toggle button,
    .spiro-motion-toggle button {
      min-height: 36px;
      border-radius: 14px;
      font-size: 0.82rem;
      line-height: 1.08;
    }

    .monitor-toggle-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .monitor-toggle {
      min-height: 38px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid rgba(33, 43, 51, 0.16);
      border-radius: 12px;
      background: rgba(255, 250, 240, 0.72);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 900;
      line-height: 1.1;
    }

    .monitor-toggle input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .monitor-toggle.is-active {
      color: #17232d;
      background: rgba(217, 159, 69, 0.24);
      border-color: rgba(84, 62, 34, 0.22);
    }

    .value-row {
      grid-template-columns: auto;
      justify-content: end;
    }

    .value-row input[type="range"] {
      display: none;
    }

    .hint-card {
      padding: 14px;
      border: 1px dashed rgba(33, 43, 51, 0.22);
      border-radius: 18px;
      color: var(--muted);
      background: rgba(255, 252, 244, 0.52);
      line-height: 1.45;
      font-size: 0.9rem;
    }

    .stage {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .stage.is-layout-hidden {
      grid-template-rows: minmax(0, 1fr);
    }

    .stage.is-layout-hidden .stage-head {
      border-bottom: 0;
    }

    .stage-head {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(217, 159, 69, 0.16), transparent),
        rgba(255, 252, 244, 0.56);
    }

    .note-monitor {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      justify-items: center;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fffaf0;
      color: var(--muted);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.62);
    }

    .grand-staff {
      width: 100%;
      height: 112px;
      height: clamp(72px, 13dvh, 112px);
      display: block;
      overflow: visible;
    }

    .mini-piano {
      width: 100%;
      height: 52px;
      height: clamp(34px, 6dvh, 52px);
      display: block;
      overflow: visible;
    }

    .harmony-visuals {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(220px, 0.92fr) minmax(280px, 1.28fr);
      gap: 8px;
      align-items: stretch;
    }

    .visual-card {
      height: 132px;
      height: clamp(82px, 15dvh, 132px);
      min-height: 0;
      border: 1px solid rgba(33, 43, 51, 0.14);
      border-radius: 14px;
      background:
        radial-gradient(circle at 18% 12%, rgba(118, 189, 208, 0.18), transparent 8rem),
        linear-gradient(180deg, rgba(255, 252, 244, 0.92), rgba(241, 230, 207, 0.72));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.58);
      overflow: hidden;
    }

    #tonnetzCard {
      height: 150px;
      height: clamp(118px, 19dvh, 176px);
    }

    .tonnetz-display,
    .spiro-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .note-facts {
      width: 100%;
      min-height: 2.2rem;
      display: flex;
      justify-content: flex-start;
      gap: 6px;
      overflow-x: auto;
      font-variant-numeric: tabular-nums;
      line-height: 1.08;
      text-align: left;
      scrollbar-width: thin;
    }

    .note-cell {
      min-width: 6.4ch;
      display: grid;
      gap: 2px;
      justify-items: start;
      padding: 4px 8px;
      border: 1px solid rgba(33, 43, 51, 0.12);
      border-radius: 10px;
      background: rgba(255, 250, 240, 0.7);
    }

    .note-cell strong {
      color: var(--ink);
      font-size: 1.05rem;
    }

    .note-cell span {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 800;
    }

    .note-monitor [hidden] {
      display: none;
    }

    .surface {
      min-height: 0;
      overflow: hidden;
      padding: clamp(16px, 3vw, 28px);
      background:
        radial-gradient(circle at 12% 10%, rgba(118, 189, 208, 0.14), transparent 18rem),
        radial-gradient(circle at 90% 10%, rgba(217, 159, 69, 0.16), transparent 22rem),
        linear-gradient(180deg, #fffaf0, #f1e6cf);
    }

    .pad-grid {
      display: grid;
      gap: 0;
      align-content: start;
    }

    .pad-row {
      display: grid;
      grid-template-columns: repeat(var(--cols), minmax(38px, 1fr));
      gap: 0;
    }

    .pad-grid.is-square {
      --square-size: 64px;
      grid-template-rows: repeat(var(--rows), var(--square-size));
      justify-content: center;
      align-content: center;
      margin: auto;
    }

    .pad-grid.is-square .pad-row {
      grid-template-columns: repeat(var(--cols), var(--square-size));
      height: var(--square-size);
    }

    .pad-grid.is-square .note-pad {
      width: var(--square-size);
      height: var(--square-size);
      min-height: 0;
      border-radius: 0;
      padding: clamp(4px, calc(var(--square-size) * 0.12), 10px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.56);
    }

    .surface.is-square-edo,
    .surface.is-hex-edo {
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .stage > .surface[hidden] {
      display: none;
    }

    .pad-grid.is-hex {
      --hex-h: 72px;
      --hex-w: calc(var(--hex-h) * 0.8660254);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: calc(var(--hex-h) * 0.16) 0 calc(var(--hex-h) * 0.24);
    }

    .pad-grid.is-hex .pad-row {
      display: flex;
      gap: 0;
      margin-top: calc(var(--hex-h) * -0.25);
    }

    .pad-grid.is-hex .pad-row:first-child {
      margin-top: 0;
    }

    .pad-grid.is-hex .pad-row:nth-child(even) {
      transform: translateX(calc(var(--hex-w) / 2));
    }

    .pad-grid.is-hex .note-pad {
      width: var(--hex-w);
      min-width: var(--hex-w);
      height: var(--hex-h);
      min-height: 0;
      border-radius: 0;
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.56);
    }

    .note-pad {
      min-height: 68px;
      border: 1px solid rgba(33, 43, 51, 0.18);
      border-radius: 16px;
      color: #12202a;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.54), rgba(255, 255, 255, 0.18)),
        var(--note-color, #ddd);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.72),
        0 10px 24px rgba(34, 28, 16, 0.12);
      cursor: pointer;
      user-select: none;
      touch-action: none;
      display: grid;
      place-items: center;
      padding: 8px;
      transition: transform 80ms ease, filter 80ms ease, box-shadow 80ms ease;
    }

    .note-pad:hover {
      filter: saturate(1.08) brightness(1.03);
      transform: translateY(-1px);
    }

    .note-pad.is-active {
      filter: saturate(1.24) brightness(1.08);
      transform: translateY(2px) scale(0.985);
      box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.18);
    }

    .key-name {
      display: block;
      font-weight: 900;
      font-size: 1.04rem;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .piano {
      position: relative;
      min-height: 380px;
      padding: 28px 14px 16px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(18, 32, 42, 0.12), transparent 28%),
        #202a31;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 24px 60px rgba(35, 28, 18, 0.22);
    }

    .white-keys {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 16px;
      top: 28px;
      display: grid;
      grid-template-columns: repeat(var(--white-count), 1fr);
      gap: 4px;
    }

    .black-keys {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 16px;
      top: 28px;
      z-index: 2;
      pointer-events: none;
    }

    .white-key,
    .black-key {
      border: 0;
      cursor: pointer;
      user-select: none;
      touch-action: none;
      display: grid;
      align-content: end;
      justify-items: center;
      padding: 0 4px 16px;
      transition: transform 80ms ease, filter 80ms ease;
    }

    .white-key {
      min-width: 0;
      border-radius: 0 0 14px 14px;
      background:
        linear-gradient(180deg, #fffdf6 0%, #f8ead0 76%, #dcc69f 100%);
      color: #18232d;
      box-shadow: inset 0 -8px 22px rgba(79, 57, 26, 0.12);
    }

    .black-key {
      position: absolute;
      top: 0;
      height: 58%;
      width: var(--black-width);
      left: var(--black-left);
      z-index: 2;
      pointer-events: auto;
      border-radius: 0 0 11px 11px;
      background:
        linear-gradient(180deg, #111923 0%, #26323b 72%, #0c1117 100%);
      color: #f7f0de;
      box-shadow: inset 0 -8px 18px rgba(0, 0, 0, 0.46), 0 8px 16px rgba(0, 0, 0, 0.22);
    }

    .white-key.is-active,
    .black-key.is-active {
      transform: translateY(4px);
      filter: saturate(1.28);
    }

    .piano .key-name {
      font-size: clamp(0.48rem, 0.78vw, 0.82rem);
      letter-spacing: -0.02em;
      text-transform: none;
    }

    .piano .black-key .key-name {
      font-size: clamp(0.43rem, 0.66vw, 0.72rem);
    }

    .reed-grid,
    .harmonica-grid {
      display: grid;
      grid-template-columns: repeat(var(--cols), minmax(58px, 1fr));
      gap: 12px;
      align-items: stretch;
    }

    .reed-column,
    .hole-column {
      display: grid;
      gap: 8px;
    }

    .reed-label,
    .hole-label {
      text-align: center;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .khaen-board {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(72px, 126px));
      gap: clamp(14px, 5vw, 48px);
      justify-content: center;
      align-items: stretch;
      padding: clamp(4px, 1.4vh, 12px) 0;
      padding: clamp(4px, 1.4dvh, 12px) 0;
    }

    .khaen-side {
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(9, minmax(0, 1fr));
      gap: clamp(4px, 1vh, 8px);
      gap: clamp(4px, 1dvh, 8px);
    }

    .khaen-pad {
      min-height: 0;
      height: 100%;
      border-radius: 12px;
      padding: 4px;
    }

    .khaen-pad .key-name {
      font-size: clamp(0.78rem, 1.8vh, 1rem);
      font-size: clamp(0.78rem, 1.8dvh, 1rem);
    }

    .breath-strip,
    .valve-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .status-pill {
      border: 1px solid rgba(33, 43, 51, 0.16);
      border-radius: 999px;
      padding: 9px 12px;
      color: var(--muted);
      background: rgba(255, 252, 244, 0.66);
      font-size: 0.85rem;
      font-weight: 800;
    }

    .status-pill.is-active {
      color: #14232d;
      background: rgba(118, 189, 208, 0.32);
      border-color: rgba(28, 88, 106, 0.28);
    }

    .brass-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(82px, 1fr));
      gap: 12px;
    }

    .steelpan {
      position: relative;
      width: min(780px, 100%);
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 50%;
      background:
        radial-gradient(circle at 42% 38%, rgba(255, 255, 255, 0.56), transparent 0 16%, rgba(255,255,255,0.18) 17%, transparent 27%),
        radial-gradient(circle, #edf7f7 0%, #b8d5d7 42%, #799ba2 68%, #425760 100%);
      box-shadow:
        inset 0 0 0 16px rgba(34, 52, 60, 0.18),
        inset 0 0 60px rgba(255, 255, 255, 0.34),
        0 28px 70px rgba(32, 27, 18, 0.26);
      overflow: hidden;
    }

    .pan-pad {
      position: absolute;
      width: clamp(48px, 9vw, 76px);
      height: clamp(48px, 9vw, 76px);
      left: calc(var(--x) * 1%);
      top: calc(var(--y) * 1%);
      transform: translate(-50%, -50%);
      border-radius: 42% 58% 50% 48%;
      min-height: 0;
      padding: 5px;
    }

    .is-muted {
      opacity: 0.45;
    }

    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(160px, 36vh) minmax(0, 1fr);
        grid-template-rows: minmax(160px, 36dvh) minmax(0, 1fr);
      }

      .controls {
        max-height: none;
      }

      .note-monitor {
        gap: 8px;
      }

      .harmony-visuals {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .app {
        width: calc(100vw - 12px);
        padding-top: 8px;
      }

      .surface {
        padding: 12px;
      }

      .reed-grid,
      .harmonica-grid {
        gap: 6px;
      }

      .note-pad {
        min-height: 58px;

  <script>
  (() => {
    const C0 = 16.351597831287414;
    const NOTE_NAMES = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
    const NOTE_SPELLINGS = [
      ["C", "C", ""],
      ["C#", "C", "#"],
      ["D", "D", ""],
      ["Eb", "E", "b"],
      ["E", "E", ""],
      ["F", "F", ""],
      ["F#", "F", "#"],
      ["G", "G", ""],
      ["Ab", "A", "b"],
      ["A", "A", ""],
      ["Bb", "B", "b"],
      ["B", "B", ""]
    ];
    const LETTER_STEPS = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
    const SVG_NS = "http://www.w3.org/2000/svg";
    const GRID_ROWS = ["zxcvbnm,./", "asdfghjkl;", "qwertyuiop", "1234567890"];
    const SPIRO_RATIOS = [1, 1.0625, 1.125, 1.1875, 1.25, 4 / 3, 1.375, 1.5, 1.625, 1.6875, 1.75, 1.875];
    const PIANO_KEYS = [
      "Shift",
      ..."azsxdcvgbhnmk,l.;/",
      "Tab",
      ..."1q2we4r5t6yu8i9op-[=]",
      "Backspace",
      "\\"
    ];
    /*
      Khaen construction notes:
      - Maker-video captions mostly identify reed-work process steps, not a reliable pipe-length table.
      - A measured 16-pipe example reports 10.5 mm inner diameter, so this spec keeps 5.25 mm radius.
      - Pipe length should be calculated from tube radius and target pitch; reed placement, bamboo nodes,
        and tuning slots remain real-world corrections outside this browser instrument spec.
      Sources kept for future checking: youtube.com/watch?v=x3x204wOZeA, BioResources khene dimensions,
      Pat Missin, Hartenberger collection, MIMO, and Met object records.
    */
    const KHAEN_SPEC = {
      tubeRadiusMm: 5.25,
      midiBass: 33,
      midiRows: [
        [48, 35, 38, 40, 41, 43, 53, 55, 60],
        [33, 36, 43, 45, 47, 50, 52, 57, 59]
      ],
      keys: [
        ["Alt", "F", "R", "D", "E", "S", "W", "A", "Q"],
        ["Alt", "J", "U", "K", "I", "L", "O", ";", "P"]
      ],
      codes: [
        ["AltLeft", "KeyF", "KeyR", "KeyD", "KeyE", "KeyS", "KeyW", "KeyA", "KeyQ"],
        ["AltRight", "KeyJ", "KeyU", "KeyK", "KeyI", "KeyL", "KeyO", "Semicolon", "KeyP"]
      ]
    };
    const HARMONICA_TUNINGS = {
      "Richter": [
        [4, 7, 12, 16, 19, 22, 26, 28, 31, 34],
        [0, 4, 7, 12, 16, 19, 24, 28, 31, 36]
      ],
      "Country": [
        [2, 7, 11, 14, 18, 21, 23, 26, 29, 33],
        [0, 4, 7, 12, 16, 19, 24, 28, 31, 36]
      ],
      "Paddy Richter": [
        [2, 7, 11, 14, 17, 21, 23, 26, 29, 33],
        [0, 4, 9, 12, 16, 19, 24, 28, 31, 36]
      ],
      "Natural Minor": [
        [3, 7, 12, 15, 19, 22, 26, 27, 31, 34],
        [0, 5, 8, 12, 17, 20, 24, 29, 32, 36]
      ],
      "Powerbender": [
        [2, 7, 11, 14, 16, 19, 23, 26, 31, 36],
        [0, 4, 7, 12, 14, 17, 21, 24, 28, 33]
      ],
      "Six Diminished": [
        [2, 5, 8, 11],
        [0, 4, 7, 9]
      ]
    };
    const INSTRUMENT_BASE_DEFAULTS = {
      edo: 33,       // A2, matching the original EDO grid floor.
      piano: 41,     // F3, matching the leftmost piano key.
      khaen: KHAEN_SPEC.midiBass,
      harmonica: 36, // C3, matching the old Harmonica.html start pitch.
      brass: 26,     // D2, matching the old default brass fundamental.
      steelpan: 36   // C3, matching the old default pan register.
    };

    const els = {
      instrument: document.getElementById("instrument"),
      instrumentToggle: document.getElementById("instrumentToggle"),
      wave: document.getElementById("wave"),
      waveToggle: document.getElementById("waveToggle"),
      pedalToggle: document.getElementById("pedalToggle"),
      volume: document.getElementById("volume"),
      release: document.getElementById("release"),
      edo: document.getElementById("edo"),
      rowStep: document.getElementById("rowStep"),
      baseMidi: document.getElementById("baseMidi"),
      baseCents: document.getElementById("baseCents"),
      resetBase: document.getElementById("resetBase"),
      edoLayoutToggle: document.getElementById("edoLayoutToggle"),
      harmonicaTuning: document.getElementById("harmonicaTuning"),
      valveLeft: document.getElementById("valveLeft"),
      valveDown: document.getElementById("valveDown"),
      valveRight: document.getElementById("valveRight"),
      stage: document.querySelector(".stage"),
      surface: document.getElementById("surface"),
      controlHint: document.getElementById("controlHint"),
      noteFacts: document.getElementById("noteFacts"),
      staffDisplay: document.getElementById("staffDisplay"),
      pianoDisplay: document.getElementById("pianoDisplay"),
      monitorToggles: document.querySelectorAll("[data-monitor-toggle]"),
      spiroSignToggle: document.getElementById("spiroSignToggle"),
      spiroMotionToggle: document.getElementById("spiroMotionToggle"),
      harmonyVisuals: document.getElementById("harmonyVisuals"),
      tonnetzCard: document.getElementById("tonnetzCard"),
      spiroCard: document.getElementById("spiroCard"),
      tonnetzDisplay: document.getElementById("tonnetzDisplay"),
      spiroCanvas: document.getElementById("spiroCanvas")
    };

    Object.keys(HARMONICA_TUNINGS).forEach((name) => {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      els.harmonicaTuning.append(option);
    });

    const state = {
      sustainRelease: false,
      heldCodes: new Set(),
      activePads: new Map(),
      activeNotes: new Map(),
      breath: "",
      heldHoles: new Set(),
      valves: { ArrowLeft: false, ArrowDown: false, ArrowRight: false }
    };

    const codeToPad = new Map();
    const holeCodeToIndex = new Map();
    const TONNETZ = buildTonnetz();
    let currentMode = "generic";
    let edoLayout = "square";
    const monitorVisibility = {
      layout: true,
      names: true,
      frequencies: true,
      staff: true,
      piano: true,
      tonnetz: true,
      spiro: true
    };
    let spiroSignMode = "alt";
    let spiroMotionMode = "arrows";
    let spiroFrame = 0;
    let spiroStartedAt = performance.now();
    let lastVisualNotes = [];

    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.master = null;
        this.active = new Map();
      }

      ensure() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          this.master = this.ctx.createGain();
          this.master.gain.value = Number(els.volume.value) / 100;
          this.master.connect(this.ctx.destination);
        }
        if (this.ctx.state === "suspended") this.ctx.resume();
      }

      setVolume(value) {
        if (!this.master || !this.ctx) return;
        const now = this.ctx.currentTime;
        this.master.gain.cancelScheduledValues(now);
        this.master.gain.setValueAtTime(this.master.gain.value, now);
        this.master.gain.linearRampToValueAtTime(Number(value) / 100, now + 0.035);
      }

      play(id, freq, pad) {
        this.ensure();
        if (this.active.has(id)) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        osc.type = els.wave.value;
        osc.frequency.value = freq;
        filter.type = "lowpass";
        filter.frequency.value = 5200;
        gain.gain.value = 0;
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.master);
        osc.start(now);
        gain.gain.linearRampToValueAtTime(0.92, now + 0.018);
        this.active.set(id, { osc, gain, filter, pad });
        pad.classList.add("is-active");
      }

      stop(id, fast = false) {
        if (!this.ctx || !this.active.has(id)) return;
        const voice = this.active.get(id);
        const now = this.ctx.currentTime;
        const release = fast ? 0.035 : Number(els.release.value) / 1000;
        voice.gain.gain.cancelScheduledValues(now);
        voice.gain.gain.setValueAtTime(voice.gain.gain.value, now);
        voice.gain.gain.linearRampToValueAtTime(0.0001, now + release);
        voice.osc.stop(now + release + 0.04);
        voice.pad.classList.remove("is-active");
        this.active.delete(id);
        clearActiveNote(id);
      }

      stopAll(fast = true) {
        [...this.active.keys()].forEach((id) => this.stop(id, fast));
      }
    }

    const audio = new AudioEngine();

    function midiToFreq(midi) {
      return C0 * Math.pow(2, midi / 12);
    }

    function pitchNameFromMidi(midi) {
      const rounded = Math.round(midi);
      const pitchClass = ((rounded % 12) + 12) % 12;
      const octave = Math.floor(rounded / 12);
      return `${NOTE_NAMES[pitchClass]}${octave}`;
    }

    function pitchNameFromFreq(freq) {
      const midi = 12 * Math.log2(freq / C0);
      const rounded = Math.round(midi);
      const cents = Math.round((midi - rounded) * 100);
      return `${pitchNameFromMidi(rounded)}${cents ? (cents > 0 ? "+" : "") + cents : ""}`;
    }

    function midiFromFreq(freq) {
      return 12 * Math.log2(freq / C0);
    }

    function baseMidiValue() {
      return Number(els.baseMidi.value) + Number(els.baseCents.value) / 100;
    }

    function baseFrequency() {
      return midiToFreq(baseMidiValue());
    }

    function noteInfoFromFreq(freq) {
      const midi = Math.round(midiFromFreq(freq));
      const pitchClass = ((midi % 12) + 12) % 12;
      const octave = Math.floor(midi / 12);
      const [name, letter, accidental] = NOTE_SPELLINGS[pitchClass];
      return {
        freq,
        midi,
        pitch: `${name}${octave}`,
        letter,
        accidental,
        octave,
        diatonic: octave * 7 + LETTER_STEPS[letter]
      };
    }

    function svgEl(tag, attrs = {}) {
      const node = document.createElementNS(SVG_NS, tag);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, String(value)));
      return node;
    }

    function drawStaffLines(svg, top, left, right, gap) {
      for (let line = 0; line < 5; line += 1) {
        const y = top + line * gap;
        svg.append(svgEl("line", {
          x1: left,
          y1: y,
          x2: right,
          y2: y,
          stroke: "#24313a",
          "stroke-width": 1.25
        }));
      }
    }

    function grandStaffGeometry() {
      const top = 14;
      const gap = 7;
      return {
        gap,
        middle: top + gap * 5,
        trebleTop: top,
        trebleBottom: top + gap * 4,
        bassTop: top + gap * 6,
        bassBottom: top + gap * 10
      };
    }

    function staffY(note) {
      const { gap, trebleTop, trebleBottom, bassTop, bassBottom } = grandStaffGeometry();
      const c4 = 4 * 7 + LETTER_STEPS.C;
      const lineIndex = 5 - (note.diatonic - c4) / 2;
      const y = trebleTop + lineIndex * gap;
      const useTrebleLedger = note.diatonic >= c4;
      return {
        y,
        top: useTrebleLedger ? trebleTop : bassTop,
        bottom: useTrebleLedger ? trebleBottom : bassBottom,
        gap
      };
    }

    function drawLedgerLines(svg, x, y, top, bottom, gap) {
      const left = x - 8.5;
      const right = x + 8.5;
      for (let lineY = top - gap; lineY >= y - 1; lineY -= gap) {
        svg.append(svgEl("line", { x1: left, y1: lineY, x2: right, y2: lineY, stroke: "#24313a", "stroke-width": 1.2 }));
      }
      for (let lineY = bottom + gap; lineY <= y + 1; lineY += gap) {
        svg.append(svgEl("line", { x1: left, y1: lineY, x2: right, y2: lineY, stroke: "#24313a", "stroke-width": 1.2 }));
      }
    }

    function appendClef(svg, symbol, x, centerY, size) {
      const clef = svgEl("text", {
        x,
        y: centerY,
        fill: "#1f2d36",
        "font-size": size,
        "font-family": "'Apple Symbols', 'Noto Music', 'Bravura', Georgia, serif",
        "font-weight": 400,
        "text-anchor": "middle",
        "dominant-baseline": "middle"
      });
      clef.textContent = symbol;
      svg.append(clef);
      try {
        const box = clef.getBBox();
        const dy = centerY - (box.y + box.height / 2);
        clef.setAttribute("transform", `translate(0 ${dy})`);
      } catch {
        // Some SVG implementations defer text measurement; baseline alignment is the fallback.
      }
    }

    function appendBassClef(svg, x, targetLineY, gap) {
      const glyphCenterY = targetLineY + gap * 1.4;
      const clef = svgEl("text", {
        x,
        y: glyphCenterY,
        fill: "#1f2d36",
        "font-size": 37,
        "font-family": "'Apple Symbols', 'Noto Music', 'Bravura', Georgia, serif",
        "font-weight": 400,
        "text-anchor": "middle",
        "dominant-baseline": "middle",
        "aria-hidden": "true"
      });
      clef.textContent = "𝄢";
      svg.append(clef);
      try {
        const box = clef.getBBox();
        const dy = glyphCenterY - (box.y + box.height / 2);
        clef.setAttribute("transform", `translate(0 ${dy})`);
      } catch {
        // Some SVG implementations defer text measurement; baseline alignment is the fallback.
      }
    }

    function renderGrandStaff(notes) {
      const svg = els.staffDisplay;
      if (!svg) return;
      svg.innerHTML = "";
      const left = 18;
      const right = 348;
      const noteStart = 96;
      const { gap, trebleTop, bassTop } = grandStaffGeometry();
      drawStaffLines(svg, trebleTop, left, right, gap);
      drawStaffLines(svg, bassTop, left, right, gap);
      appendClef(svg, "𝄞", 32, trebleTop + gap * 3 - 1, 60);
      appendBassClef(svg, 34, bassTop + gap, gap);

      notes.slice(0, 12).forEach((note, index) => {
        const x = noteStart + index * 19;
        const { y, top, bottom, gap: localGap } = staffY(note);
        drawLedgerLines(svg, x, y, top, bottom, localGap);
        if (note.accidental) {
          const accidental = svgEl("text", { x: x - 17, y: y + 4.5, fill: "#1f2d36", "font-size": 15, "font-weight": 800 });
          accidental.textContent = note.accidental === "b" ? "♭" : "♯";
          svg.append(accidental);
        }
        svg.append(svgEl("ellipse", {
          cx: x,
          cy: y,
          rx: 6.8,
          ry: 4.7,
          transform: `rotate(-18 ${x} ${y})`,
          fill: "#101923"
        }));
      });
    }

    function isBlackMidi(midi) {
      return [1, 3, 6, 8, 10].includes(((midi % 12) + 12) % 12);
    }

    function renderMiniPiano(notes) {
      const svg = els.pianoDisplay;
      if (!svg) return;
      svg.innerHTML = "";
      const active = new Set(notes.map((note) => note.midi));
      const min = 9; // A0
      const max = 96; // C8
      const whiteMidis = [];
      const whiteIndex = new Map();
      for (let midi = min; midi <= max; midi += 1) {
        if (!isBlackMidi(midi)) {
          whiteIndex.set(midi, whiteMidis.length);
          whiteMidis.push(midi);
        }
      }
      const width = 420;
      const height = 52;
      const whiteWidth = width / whiteMidis.length;
      whiteMidis.forEach((midi, index) => {
        svg.append(svgEl("rect", {
          x: index * whiteWidth,
          y: 0,
          width: whiteWidth + 0.2,
          height,
          rx: 1.8,
          fill: active.has(midi) ? "#d99f45" : "#fffdf6",
          stroke: "#cdbf9f",
          "stroke-width": 0.8
        }));
      });
      for (let midi = min; midi <= max; midi += 1) {
        if (!isBlackMidi(midi)) continue;
        let previous = midi - 1;
        while (previous >= min && isBlackMidi(previous)) previous -= 1;
        const index = whiteIndex.get(previous);
        if (index === undefined) continue;
        const blackWidth = whiteWidth * 0.62;
        svg.append(svgEl("rect", {
          x: (index + 1) * whiteWidth - blackWidth / 2,
          y: 0,
          width: blackWidth,
          height: height * 0.62,
          rx: 1.6,
          fill: active.has(midi) ? "#d99f45" : "#101923",
          stroke: active.has(midi) ? "#7a4d10" : "#101923",
          "stroke-width": 0.8
        }));
      }
    }

    function pitchClass(value) {
      return ((Math.round(value) % 12) + 12) % 12;
    }

    function pitchCanvasColor(value, alpha = 1) {
      const hue = pitchClass(value) / 12 * 360 + 28;
      return `hsla(${hue}, 72%, 52%, ${alpha})`;
    }

    function buildTonnetz() {
      const rows = 6;
      const baseCols = 7;
      const edgeLength = 42;
      const nodeRadius = edgeLength / 3;
      const colGap = edgeLength;
      const rowGap = Math.sqrt(3) / 2 * edgeLength;
      const padding = nodeRadius + 3;
      const points = [];
      let bass = 0;
      for (let row = 0; row < rows; row += 1) {
        const cols = row % 2 ? baseCols + 1 : baseCols;
        for (let col = 0; col < cols; col += 1) {
          points.push({
            x: padding + col * colGap + (row % 2 ? 0 : colGap / 2),
            y: padding + row * rowGap,
            pc: pitchClass(bass + col * 7)
          });
        }
        bass = row % 2 ? bass + 3 : bass + 8;
      }

      const edges = [];
      for (let i = 0; i < points.length; i += 1) {
        for (let j = i + 1; j < points.length; j += 1) {
          const dist = Math.hypot(points[i].x - points[j].x, points[i].y - points[j].y);
          if (Math.abs(dist - edgeLength) < 0.5) edges.push([i, j]);
        }
      }
      const width = Math.ceil(Math.max(...points.map((point) => point.x)) + padding);
      const height = Math.ceil(Math.max(...points.map((point) => point.y)) + padding);
      return { points, edges, edgeLength, nodeRadius, viewBox: `0 0 ${width} ${height}` };
    }

    function renderTonnetz(notes) {
      const svg = els.tonnetzDisplay;
      if (!svg) return;
      svg.innerHTML = "";
      svg.setAttribute("viewBox", TONNETZ.viewBox);
      const active = new Set(notes.map((note) => pitchClass(note.midi)));
      const counts = notes.reduce((map, note) => {
        const pc = pitchClass(note.midi);
        map.set(pc, (map.get(pc) || 0) + 1);
        return map;
      }, new Map());

      TONNETZ.edges.forEach(([a, b]) => {
        const first = TONNETZ.points[a];
        const second = TONNETZ.points[b];
        const isActive = active.has(first.pc) && active.has(second.pc);
        svg.append(svgEl("line", {
          x1: first.x,
          y1: first.y,
          x2: second.x,
          y2: second.y,
          stroke: isActive ? "#17232d" : "rgba(33, 43, 51, 0.16)",
          "stroke-width": isActive ? 3 : 1.4,
          "stroke-linecap": "round"
        }));
      });

      TONNETZ.points.forEach((point) => {
        const isActive = active.has(point.pc);
        const count = counts.get(point.pc) || 0;
        const radius = TONNETZ.nodeRadius;
        const labelSize = radius * 0.72;
        svg.append(svgEl("circle", {
          cx: point.x,
          cy: point.y,
          r: radius,
          fill: isActive ? pitchColor(point.pc, 12, true) : "#fffaf0",
          stroke: isActive ? "#17232d" : "rgba(33, 43, 51, 0.26)",
          "stroke-width": isActive ? 2.2 + Math.min(1.1, count * 0.28) : 1.1
        }));
        const label = svgEl("text", {
          x: point.x,
          y: point.y + labelSize * 0.34,
          fill: isActive ? "#101923" : "#6d767b",
          "font-size": labelSize,
          "font-weight": 900,
          "text-anchor": "middle"
        });
        label.textContent = NOTE_NAMES[point.pc].replace("#", "♯");
        svg.append(label);
      });
    }

    function spiroData(notes) {
      const midis = [...new Set(notes.map((note) => note.midi))].sort((a, b) => a - b);
      if (!midis.length) return null;
      const root = midis[0];
      const relatives = midis.map((midi) => midi - root);
      const ratios = relatives.map((semi) => SPIRO_RATIOS[pitchClass(semi)] * Math.pow(2, Math.floor(semi / 12)));
      const radius = ratios.reduce((sum, ratio) => sum + 1 / ratio, 0);
      return { root, relatives, ratios, radius };
    }

    function resizeSpiroCanvas() {
      const canvas = els.spiroCanvas;
      if (!canvas) return null;
      const rect = canvas.getBoundingClientRect();
      const cssWidth = Math.max(280, rect.width || canvas.clientWidth || 320);
      const cssHeight = Math.max(120, rect.height || canvas.clientHeight || 132);
      const dpr = window.devicePixelRatio || 1;
      const width = Math.round(cssWidth * dpr);
      const height = Math.round(cssHeight * dpr);
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, width: cssWidth, height: cssHeight };
    }

    function spiroPoint(data, t, cx, cy, scale) {
      let x = cx;
      let y = cy;
      data.ratios.forEach((ratio, index) => {
        const sign = spiroSignMode === "alt" && index % 2 ? -1 : 1;
        x += scale * Math.sin(ratio * t * sign) / ratio;
        y += scale * Math.cos(ratio * t * sign) / ratio;
      });
      return [x, y];
    }

    function drawSpiroCurve(ctx, data, cx, cy, scale, start, end, step, color, lineWidth) {
      if (end <= start) return;
      ctx.beginPath();
      for (let t = start, first = true; t <= end; t += step) {
        const [x, y] = spiroPoint(data, t, cx, cy, scale);
        if (first) {
          ctx.moveTo(x, y);
          first = false;
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
    }

    function drawArrow(ctx, x1, y1, x2, y2, color) {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const length = Math.hypot(x2 - x1, y2 - y1);
      if (length < 3) return;
      const head = Math.min(8, Math.max(4.5, length * 0.22));
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 1.8;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - Math.cos(angle - 0.45) * head, y2 - Math.sin(angle - 0.45) * head);
      ctx.lineTo(x2 - Math.cos(angle + 0.45) * head, y2 - Math.sin(angle + 0.45) * head);
      ctx.closePath();
      ctx.fill();
    }

    function drawSpiroArrows(ctx, data, t, cx, cy, scale) {
      let x = cx;
      let y = cy;
      data.ratios.forEach((ratio, index) => {
        const sign = spiroSignMode === "alt" && index % 2 ? -1 : 1;
        const nextX = x + scale * Math.sin(ratio * t * sign) / ratio;
        const nextY = y + scale * Math.cos(ratio * t * sign) / ratio;
        drawArrow(ctx, x, y, nextX, nextY, pitchCanvasColor(data.root + data.relatives[index]));
        x = nextX;
        y = nextY;
      });
      ctx.fillStyle = "#101923";
      ctx.beginPath();
      ctx.arc(x, y, 3.2, 0, Math.PI * 2);
      ctx.fill();
    }

    function renderSpiro(notes, now = performance.now()) {
      const setup = resizeSpiroCanvas();
      if (!setup) return;
      const { ctx, width, height } = setup;
      ctx.clearRect(0, 0, width, height);
      const data = spiroData(notes);
      if (!data) return;

      const cx = width / 2;
      const cy = height / 2;
      const scale = Math.min(width, height) * 0.42 / Math.max(data.radius, 1);
      const end = 96 * Math.PI;
      const curveColor = pitchCanvasColor(data.root + data.relatives[data.relatives.length - 1]);
      drawSpiroCurve(ctx, data, cx, cy, scale, 0, end, 0.18, pitchCanvasColor(data.root, 0.18), 1.1);

      if (spiroMotionMode === "still") {
        drawSpiroCurve(ctx, data, cx, cy, scale, 0, end, 0.1, curveColor, 2.1);
        return;
      }

      const elapsed = ((now - spiroStartedAt) / 1000 * 2.2) % end;
      const tail = Math.min(end, Math.max(Math.PI * 4, data.radius * Math.PI * 9));
      drawSpiroCurve(ctx, data, cx, cy, scale, Math.max(0, elapsed - tail), elapsed, 0.055, curveColor, 2.6);
      drawSpiroArrows(ctx, data, elapsed, cx, cy, scale);
    }

    function startSpiroAnimation() {
      if (spiroFrame) return;
      spiroStartedAt = performance.now();
      const tick = (now) => {
        spiroFrame = requestAnimationFrame(tick);
        renderSpiro(lastVisualNotes, now);
      };
      spiroFrame = requestAnimationFrame(tick);
    }

    function stopSpiroAnimation() {
      if (!spiroFrame) return;
      cancelAnimationFrame(spiroFrame);
      spiroFrame = 0;
    }

    function renderHarmonyVisuals(notes) {
      lastVisualNotes = notes;
      const showTonnetz = monitorVisibility.tonnetz;
      const showSpiro = monitorVisibility.spiro;
      els.harmonyVisuals.hidden = !showTonnetz && !showSpiro;
      els.tonnetzCard.hidden = !showTonnetz;
      els.spiroCard.hidden = !showSpiro;
      if (showTonnetz) renderTonnetz(notes);
      if (showSpiro) {
        renderSpiro(notes);
        if (spiroMotionMode === "arrows" && notes.length) {
          startSpiroAnimation();
        } else {
          stopSpiroAnimation();
        }
      } else {
        stopSpiroAnimation();
      }
    }

    function renderNoteFacts(notes) {
      els.noteFacts.replaceChildren();
      const showNames = monitorVisibility.names;
      const showFrequencies = monitorVisibility.frequencies;
      els.noteFacts.hidden = !showNames && !showFrequencies;
      if (!showNames && !showFrequencies) return;

      const visibleNotes = notes.length ? notes : [{ pitch: "-", freq: null }];
      visibleNotes.forEach((note) => {
        const cell = document.createElement("div");
        cell.className = "note-cell";
        if (showNames) {
          const pitch = document.createElement("strong");
          pitch.textContent = note.pitch;
          cell.append(pitch);
        }
        if (showFrequencies) {
          const frequency = document.createElement("span");
          frequency.textContent = note.freq == null ? "-" : `${Math.round(note.freq)}Hz`;
          cell.append(frequency);
        }
        els.noteFacts.append(cell);
      });
      els.noteFacts.setAttribute(
        "aria-label",
        notes.length ? notes.map((note) => `${note.pitch} ${Math.round(note.freq)}Hz`).join(", ") : "No active notes"
      );
    }

    function updateNoteMonitor() {
      const notes = [...state.activeNotes.values()].sort((a, b) => a.freq - b.freq);
      renderNoteFacts(notes);
      els.surface.hidden = !monitorVisibility.layout;
      els.stage.classList.toggle("is-layout-hidden", !monitorVisibility.layout);
      els.staffDisplay.hidden = !monitorVisibility.staff;
      els.pianoDisplay.hidden = !monitorVisibility.piano;
      renderGrandStaff(notes);
      renderMiniPiano(notes);
      renderHarmonyVisuals(notes);
    }

    function setActiveNote(id, freq) {
      state.activeNotes.set(id, noteInfoFromFreq(freq));
      updateNoteMonitor();
    }

    function clearActiveNote(id) {
      if (!state.activeNotes.delete(id)) return;
      updateNoteMonitor();
    }

    function keyToCode(key) {
      if (/^[a-z]$/.test(key)) return `Key${key.toUpperCase()}`;
      if (/^[0-9]$/.test(key)) return `Digit${key}`;
      return {
        "Shift": "ShiftLeft",
        "Tab": "Tab",
        "Backspace": "Backspace",
        "CapsLock": "CapsLock",
        "Enter": "Enter",
        ",": "Comma",
        ".": "Period",
        "/": "Slash",
        ";": "Semicolon",
        "'": "Quote",
        "[": "BracketLeft",
        "]": "BracketRight",
        "-": "Minus",
        "=": "Equal",
        "\\": "Backslash"
      }[key] || key;
    }

    function prettyKey(key) {
      if (key === "Backspace") return "⌫";
      return key === " " ? "Space" : key.replace("Arrow", "");
    }

    function pianoKeyLabel(key) {
      return key ? prettyKey(key) : " ";
    }

    function pitchColor(value, total = 12, active = false) {
      const hue = (((value % total) + total) % total) / total * 360 + 28;
      const light = active ? 0.78 : 0.68;
      const chroma = active ? 0.24 : 0.17;
      return `oklch(${light} ${chroma} ${hue})`;
    }

    function clearSurface() {
      audio.stopAll(true);
      state.heldCodes.clear();
      state.activePads.clear();
      state.activeNotes.clear();
      state.breath = "";
      state.heldHoles.clear();
      state.valves = { ArrowLeft: false, ArrowDown: false, ArrowRight: false };
      codeToPad.clear();
      holeCodeToIndex.clear();
      els.surface.innerHTML = "";
      els.surface.className = "surface";
      updateNoteMonitor();
    }

    function makePad({ id, key, code, freq, getFreq, label, note, colorValue, colorTotal = 12, classes = "", onPress, onRelease }) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `note-pad ${classes}`.trim();
      button.style.setProperty("--note-color", pitchColor(colorValue, colorTotal));
      button.dataset.id = id;
      button.dataset.freq = String(freq);
      button.dataset.note = note || pitchNameFromFreq(freq);
      button.innerHTML = `<span class="key-name">${label || prettyKey(key || "")}</span>`;
      button.title = `${Math.round(freq)} Hz - ${button.dataset.note}`;
      const press = (event) => {
        event.preventDefault();
        (onPress || (() => playPad(button, id, getFreq ? getFreq() : freq)))();
      };
      const release = (event) => {
        event.preventDefault();
        (onRelease || (() => stopPad(id)))();
      };
      button.addEventListener("pointerdown", press);
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("pointerleave", (event) => {
        if (event.buttons) release(event);
      });
      if (code) codeToPad.set(code, { button, id, freq, getFreq });
      return button;
    }

    function playPad(button, id, freq) {
      audio.play(id, freq, button);
      setActiveNote(id, freq);
    }

    function stopPad(id, fast = false) {
      audio.stop(id, fast || !state.sustainRelease);
    }

    function addPadToRow(row, pad) {
      row.append(pad);
    }

    function updateOutputs() {
      ["volume", "release", "edo", "rowStep", "baseMidi", "baseCents", "valveLeft", "valveDown", "valveRight"].forEach((id) => {
        const out = document.getElementById(`${id}Out`);
        if (out) {
          const input = document.getElementById(id);
          let text = input.value;
          if (id === "release") text = `${input.value} ms`;
          if (id === "baseMidi") text = pitchNameFromMidi(Number(input.value));
          if (id === "baseCents") text = `${Number(input.value) >= 0 ? "+" : ""}${input.value}c`;
          out.textContent = text;
          out.setAttribute("aria-valuenow", input.value);
          out.setAttribute("aria-valuetext", text);
          if (id === "baseMidi" || id === "baseCents") out.title = `${baseFrequency().toFixed(2)} Hz`;
        }
      });
      const defaultMidi = INSTRUMENT_BASE_DEFAULTS[els.instrument.value] ?? 33;
      const defaultName = pitchNameFromMidi(defaultMidi);
      els.resetBase.title = `Reset ${els.instrument.value} bass note to ${defaultName}`;
      els.resetBase.setAttribute("aria-label", els.resetBase.title);
      audio.setVolume(els.volume.value);
    }

    function resetBaseForInstrument() {
      const defaultMidi = INSTRUMENT_BASE_DEFAULTS[els.instrument.value] ?? 33;

      els.baseCents.value = 0;
      render();

    function setVisibleControls(names) {

    function syncPillWindow(group, activeButton) {
      if (!group || !activeButton) return;

      thumb.style.height = `${activeButton.offsetHeight}px`;
      thumb.style.borderRadius = getComputedStyle(activeButton).borderRadius;
      thumb.style.transform = `translate(${left}px, ${top}px)`;
    }

    function animatePillWindow(group, updateFn) {
      if (!group) {
        updateFn();

      group.classList.add("is-animating");

    function clampRangeValue(input, value) {
      const min = Number(input.min || 0);
      const max = Number(input.max || 100);
      const step = input.step === "any" ? 0 : Number(input.step || 1);
      const raw = Math.min(Math.max(Number(value) || min, min), max);
      if (!step) return raw;
      const decimals = String(step).split(".")[1]?.length || 0;
      const snapped = Math.round((raw - min) / step) * step + min;
      return Number(Math.min(Math.max(snapped, min), max).toFixed(decimals));
    }

    function setRangeValue(input, value) {
      input.value = clampRangeValue(input, value);
      input.dispatchEvent(new Event("input", { bubbles: true }));
    }

    function attachOutputDrag(input, output) {
      if (!input || !output) return;
      output.tabIndex = 0;
      output.setAttribute("role", "spinbutton");
      output.setAttribute("aria-label", `${input.id}. Drag up or right to increase; drag down or left to decrease.`);
      output.setAttribute("aria-valuemin", input.min || "");
      output.setAttribute("aria-valuemax", input.max || "");
      const step = input.step === "any" ? 1 : Number(input.step || 1);
      const range = Number(input.max || 100) - Number(input.min || 0);
      const dragScale = range / 220;
      let drag = null;
      const signedL2Drag = (event) => {
        const right = event.clientX - drag.startX;
        const up = drag.startY - event.clientY;
        const distance = Math.hypot(right, up);
        if (!distance) return 0;
        const dominant = Math.abs(right) >= Math.abs(up) ? right : up;
        return Math.sign(dominant) * distance;
      };
      output.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        event.preventDefault();
        drag = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          startValue: Number(input.value)
        };
        output.classList.add("is-dragging");
        output.setPointerCapture(event.pointerId);
      });
      output.addEventListener("pointermove", (event) => {
        if (!drag || event.pointerId !== drag.pointerId) return;
        event.preventDefault();
        setRangeValue(input, drag.startValue + signedL2Drag(event) * dragScale);
      });
      const finishDrag = (event) => {
        if (!drag || event.pointerId !== drag.pointerId) return;
        if (output.hasPointerCapture?.(event.pointerId)) output.releasePointerCapture(event.pointerId);
        output.classList.remove("is-dragging");
        drag = null;
      };
      output.addEventListener("pointerup", finishDrag);
      output.addEventListener("pointercancel", finishDrag);
      output.addEventListener("wheel", (event) => {
        event.preventDefault();
        setRangeValue(input, Number(input.value) + (event.deltaY > 0 ? -step : step));
      }, { passive: false });
      output.addEventListener("keydown", (event) => {
        if (!["ArrowUp", "ArrowDown"].includes(event.key)) return;
        event.preventDefault();
        setRangeValue(input, Number(input.value) + (event.key === "ArrowUp" ? step : -step));
      });
    }

    function isBlackPianoSemi(semi) {
      // The legacy piano strip starts on F at left Shift, not C.
      return [1, 3, 5, 8, 10].includes(((semi % 12) + 12) % 12);
    }

    function syncSquareEdoGridSize() {
      const grid = els.surface.querySelector(".pad-grid.is-square");
      if (!grid) return;
      const rows = Number(grid.dataset.rows || grid.children.length || 1);
      const cols = Number(grid.dataset.cols || 1);
      const style = getComputedStyle(els.surface);
      const availableWidth = els.surface.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      const availableHeight = els.surface.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
      const squareSize = Math.floor(Math.min(availableWidth / cols, availableHeight / rows));
      grid.style.setProperty("--square-size", `${Math.max(28, squareSize)}px`);
    }

    function syncHexEdoGridSize() {
      const grid = els.surface.querySelector(".pad-grid.is-hex");
      if (!grid) return;
      const rows = Number(grid.dataset.rows || grid.children.length || 1);
      const cols = Number(grid.dataset.cols || 1);
      const style = getComputedStyle(els.surface);
      const availableWidth = els.surface.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      const availableHeight = els.surface.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
      const hexWidthRatio = 0.8660254;
      const staggeredCols = cols + 0.5;
      const overlappedRows = 1 + Math.max(0, rows - 1) * 0.75;
      const verticalPadding = 0.16 + 0.24;
      const widthLimitedHeight = availableWidth / (staggeredCols * hexWidthRatio);
      const heightLimitedHeight = availableHeight / (overlappedRows + verticalPadding);
      const hexHeight = Math.floor(Math.min(widthLimitedHeight, heightLimitedHeight));
      grid.style.setProperty("--hex-h", `${Math.max(42, hexHeight)}px`);
    }

    function syncEdoGridSize() {
      syncSquareEdoGridSize();
      syncHexEdoGridSize();
    }

    function render() {
      updateOutputs();
      updateInstrumentButtons();
      updateWaveButtons();
      updatePedalButtons();
      updateVisualizationButtons();
      clearSurface();
      const instrument = els.instrument.value;
      if (instrument === "edo") renderEdo();
      if (instrument === "piano") renderPiano();
      if (instrument === "khaen") renderKhaen();
      if (instrument === "harmonica") renderHarmonica();
      if (instrument === "brass") renderBrass();
      if (instrument === "steelpan") renderSteelpan();
    }

    function renderEdo() {
      currentMode = "generic";
      setVisibleControls(["edoGroup"]);
      updateEdoLayoutButtons();
      setControlHint("");
      const edo = Number(els.edo.value);
      const rowStep = Number(els.rowStep.value);
      const base = baseFrequency();
      const grid = document.createElement("div");
      grid.className = `pad-grid is-${edoLayout}`;
      grid.dataset.rows = GRID_ROWS.length;
      grid.dataset.cols = Math.max(...GRID_ROWS.map((row) => row.length));
      els.surface.classList.toggle("is-square-edo", edoLayout === "square");
      els.surface.classList.toggle("is-hex-edo", edoLayout === "hex");
      grid.style.setProperty("--rows", GRID_ROWS.length);
      [...GRID_ROWS].reverse().forEach((chars, visualRow) => {
        const sourceRow = GRID_ROWS.length - 1 - visualRow;
        const row = document.createElement("div");
        row.className = "pad-row";
        row.style.setProperty("--cols", chars.length);
        [...chars].forEach((key, col) => {
          const step = col + rowStep * sourceRow;
          const freq = base * Math.pow(2, step / edo);
          addPadToRow(row, makePad({
            id: `edo-${key}`,
            key,
            code: keyToCode(key),
            freq,
            label: key,
            note: pitchNameFromFreq(freq),
            colorValue: step,
            colorTotal: edo
          }));
        });
        grid.append(row);
      });
      els.surface.append(grid);
      requestAnimationFrame(syncEdoGridSize);
    }

    function renderPiano() {
      currentMode = "generic";
      setVisibleControls([]);
      setControlHint("");
      const totalSemis = PIANO_KEYS.length;
      const allSemis = Array.from({ length: totalSemis }, (_, semi) => semi);
      const whiteSemis = allSemis.filter((semi) => !isBlackPianoSemi(semi));
      const blackSemis = allSemis.filter(isBlackPianoSemi);
      const piano = document.createElement("div");
      piano.className = "piano";
      const whiteRail = document.createElement("div");
      whiteRail.className = "white-keys";
      whiteRail.style.setProperty("--white-count", whiteSemis.length);
      const blackRail = document.createElement("div");
      blackRail.className = "black-keys";
      const baseMidi = baseMidiValue();
      const whiteIndexBySemi = new Map();
      whiteSemis.forEach((semi, index) => {
        whiteIndexBySemi.set(semi, index);
        const midi = baseMidi + semi;
        const key = PIANO_KEYS[semi] || "";
        whiteRail.append(makePad({
          id: `piano-${semi}`,
          key,
          code: key ? keyToCode(key) : "",
          freq: midiToFreq(midi),
          label: pianoKeyLabel(key),
          note: pitchNameFromFreq(midiToFreq(midi)),
          colorValue: semi,
          classes: "white-key"
        }));
      });
      piano.append(whiteRail);
      const whiteWidth = 100 / whiteSemis.length;
      blackSemis.forEach((semi) => {
        const previousWhite = [...whiteSemis].filter((value) => value < semi).pop();
        const previousIndex = whiteIndexBySemi.get(previousWhite);
        const midi = baseMidi + semi;
        const key = PIANO_KEYS[semi] || "";
        const pad = makePad({
          id: `piano-${semi}`,
          key,
          code: key ? keyToCode(key) : "",
          freq: midiToFreq(midi),
          label: pianoKeyLabel(key),
          note: pitchNameFromFreq(midiToFreq(midi)),
          colorValue: semi,
          classes: "black-key"
        });
        pad.style.setProperty("--black-width", `${whiteWidth * 0.62}%`);
        pad.style.setProperty("--black-left", `${(previousIndex + 1) * whiteWidth - whiteWidth * 0.31}%`);
        blackRail.append(pad);
      });
      piano.append(blackRail);
      els.surface.append(piano);
    }

    function renderKhaen() {
      currentMode = "generic";
      setVisibleControls([]);
      setControlHint("Use the two vertical key runs rising from the Alt keys.");
      const { midiBass, midiRows, keys, codes, tubeRadiusMm } = KHAEN_SPEC;
      const baseMidi = baseMidiValue();
      const board = document.createElement("div");
      board.className = "khaen-board";
      board.dataset.tubeRadiusMm = String(tubeRadiusMm);
      for (let side = 0; side < keys.length; side += 1) {
        const sideEl = document.createElement("div");
        sideEl.className = "khaen-side";
        sideEl.setAttribute("aria-label", side === 0 ? "Left Khaen pipes" : "Right Khaen pipes");
        for (let index = keys[side].length - 1; index >= 0; index -= 1) {
          const midi = baseMidi + midiRows[side][index] - midiBass;
          sideEl.append(makePad({
            id: `khaen-${side}-${index}`,
            key: keys[side][index],
            code: codes[side][index],
            freq: midiToFreq(midi),
            label: keys[side][index],
            note: pitchNameFromFreq(midiToFreq(midi)),
            colorValue: midi,
            classes: "khaen-pad"
          }));
        }
        board.append(sideEl);
      }
      els.surface.append(board);
    }

    function renderHarmonica() {
      currentMode = "harmonica";
      setVisibleControls(["harmonicaGroup"]);
      setControlHint("Number keys select holes. Arrow keys choose breath direction.");
      const breathStrip = document.createElement("div");
      breathStrip.className = "breath-strip";
      breathStrip.innerHTML = `
        <span class="status-pill" id="drawPill">Up/Right: draw</span>
        <span class="status-pill" id="blowPill">Down/Left: blow</span>
      `;
      els.surface.append(breathStrip);
      const tuning = HARMONICA_TUNINGS[els.harmonicaTuning.value];
      const holeKeys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "q", "w", "e", "r", "t"];
      const baseMidi = baseMidiValue();
      const grid = document.createElement("div");
      grid.className = "harmonica-grid";
      grid.style.setProperty("--cols", tuning[0].length);
      tuning[0].forEach((_, index) => {
        const key = holeKeys[index] || "";
        const code = key ? keyToCode(key) : "";
        if (code) holeCodeToIndex.set(code, index);
        const column = document.createElement("div");
        column.className = "hole-column";
        const drawMidi = baseMidi + tuning[0][index];
        const blowMidi = baseMidi + tuning[1][index];
        column.append(makePad({
          id: `harmonica-draw-${index}`,
          key,
          freq: midiToFreq(drawMidi),
          label: `${key || index + 1} draw`,
          note: pitchNameFromFreq(midiToFreq(drawMidi)),
          colorValue: drawMidi,
          onPress: () => playPad(column.children[0], `harmonica-draw-${index}`, midiToFreq(drawMidi)),
          onRelease: () => stopPad(`harmonica-draw-${index}`)
        }));
        column.append(makePad({
          id: `harmonica-blow-${index}`,
          key,
          freq: midiToFreq(blowMidi),
          label: `${key || index + 1} blow`,
          note: pitchNameFromFreq(midiToFreq(blowMidi)),
          colorValue: blowMidi,
          onPress: () => playPad(column.children[1], `harmonica-blow-${index}`, midiToFreq(blowMidi)),
          onRelease: () => stopPad(`harmonica-blow-${index}`)
        }));
        const label = document.createElement("div");
        label.className = "hole-label";
        label.textContent = `hole ${index + 1}`;
        column.append(label);
        grid.append(column);
      });
      els.surface.append(grid);
      updateBreathPills();
    }

    function renderBrass() {
      currentMode = "brass";
      setVisibleControls(["brassGroup"]);
      setControlHint("Use Z X C V B N M , . / for harmonics. Arrow keys act as valves.");
      const valveStrip = document.createElement("div");
      valveStrip.className = "valve-strip";
      valveStrip.innerHTML = `
        <span class="status-pill" id="leftValve">Left valve</span>
        <span class="status-pill" id="downValve">Down valve</span>
        <span class="status-pill" id="rightValve">Right valve</span>
      `;
      els.surface.append(valveStrip);
      const grid = document.createElement("div");
      grid.className = "brass-grid";
      const keys = [..."zxcvbnm,./"];
      const baseMidi = baseMidiValue();
      const getFundamental = () => midiToFreq(baseMidi + activeValveOffset());
      const displayFundamental = getFundamental();
      keys.forEach((key, index) => {
        const harmonic = index + 1;
        const freq = displayFundamental * harmonic;
        grid.append(makePad({
          id: `brass-${key}`,
          key,
          code: keyToCode(key),
          freq,
          getFreq: () => getFundamental() * harmonic,
          label: `${key} / ${harmonic}`,
          note: pitchNameFromFreq(freq),
          colorValue: Math.round(12 * Math.log2(freq / displayFundamental))
        }));
      });
      els.surface.append(grid);
      updateValvePills();
    }

    function renderSteelpan() {
      currentMode = "generic";
      setVisibleControls([]);
      setControlHint("Use the visible QWERTY labels or tap the steelpan cells.");
      const pan = document.createElement("div");
      pan.className = "steelpan";
      const keys = [..."asdfghjkl;'qwertyuiop[]1234567890-="];
      keys.slice(0, 34).forEach((key, index) => {
        const ring = Math.floor(index / 12);
        const slot = index % 12;
        const radius = 38 - ring * 11;
        const angle = (-90 + slot * 30) * Math.PI / 180;
        const x = 50 + Math.cos(angle) * radius;
        const y = 50 + Math.sin(angle) * radius;
        const pitchClass = ((5 * index) % 12 + 12) % 12;
        const midi = baseMidiValue() + ring * 12 + pitchClass;
        const pad = makePad({
          id: `steelpan-${index}`,
          key,
          code: keyToCode(key),
          freq: midiToFreq(midi),
          label: key,
          note: pitchNameFromFreq(midiToFreq(midi)),
          colorValue: pitchClass,
          classes: "pan-pad"
        });
        pad.style.setProperty("--x", x.toFixed(2));
        pad.style.setProperty("--y", y.toFixed(2));
        pan.append(pad);
      });
      els.surface.append(pan);
    }

    function activeValveOffset() {
      return (state.valves.ArrowLeft ? Number(els.valveLeft.value) : 0) +
        (state.valves.ArrowDown ? Number(els.valveDown.value) : 0) +
        (state.valves.ArrowRight ? Number(els.valveRight.value) : 0);
    }

    function updateValvePills() {
      const ids = {
        ArrowLeft: "leftValve",
        ArrowDown: "downValve",
        ArrowRight: "rightValve"
      };
      Object.entries(ids).forEach(([key, id]) => {
        const node = document.getElementById(id);
        if (node) node.classList.toggle("is-active", state.valves[key]);
      });
    }

    function updateBreathPills() {
      const draw = document.getElementById("drawPill");
      const blow = document.getElementById("blowPill");
      if (draw) draw.classList.toggle("is-active", state.breath === "draw");
      if (blow) blow.classList.toggle("is-active", state.breath === "blow");
    }

    function pressHarmonicaHole(index) {
      if (!state.breath) return;
      const id = `harmonica-${state.breath}-${index}`;
      const pad = els.surface.querySelector(`[data-id="${id}"]`);
      if (!pad) return;
      const freq = Number(pad.dataset.freq);
      playPad(pad, id, freq);
    }

    function releaseHarmonicaHole(index) {
      stopPad(`harmonica-draw-${index}`);
      stopPad(`harmonica-blow-${index}`);
    }

    function genericKeyDown(event) {
      const pad = codeToPad.get(event.code);
      if (!pad || state.heldCodes.has(event.code)) return false;
      state.heldCodes.add(event.code);
      playPad(pad.button, pad.id, pad.getFreq ? pad.getFreq() : pad.freq);
      return true;
    }

    function genericKeyUp(event) {
      const pad = codeToPad.get(event.code);
      if (!pad) return false;
      state.heldCodes.delete(event.code);
      stopPad(pad.id);
      return true;
    }

    function onKeyDown(event) {
      if (event.metaKey || event.ctrlKey || event.altKey && currentMode !== "khaen") return;
      if (event.code === "Space") {
        setPedal(!state.sustainRelease);
        setControlHint(state.sustainRelease ? "Long release is on. Space toggles it off." : "Long release is off. Space toggles it on.");
        event.preventDefault();
        return;
      }
      if (currentMode === "harmonica") {
        if (["ArrowUp", "ArrowRight", "ArrowDown", "ArrowLeft"].includes(event.code)) {
          state.breath = ["ArrowUp", "ArrowRight"].includes(event.code) ? "draw" : "blow";
          updateBreathPills();
          state.heldHoles.forEach(pressHarmonicaHole);
          event.preventDefault();
          return;
        }
        if (holeCodeToIndex.has(event.code) && !state.heldCodes.has(event.code)) {
          const index = holeCodeToIndex.get(event.code);
          state.heldCodes.add(event.code);
          state.heldHoles.add(index);
          pressHarmonicaHole(index);
          event.preventDefault();
          return;
        }
      }
      if (currentMode === "brass" && ["ArrowLeft", "ArrowDown", "ArrowRight"].includes(event.code)) {
        state.valves[event.code] = true;
        updateValvePills();
        event.preventDefault();
        return;
      }
      if (genericKeyDown(event)) event.preventDefault();
    }

    function onKeyUp(event) {
      if (currentMode === "harmonica") {
        if (["ArrowUp", "ArrowRight", "ArrowDown", "ArrowLeft"].includes(event.code)) {
          state.breath = "";
          updateBreathPills();
          state.heldHoles.forEach(releaseHarmonicaHole);
          event.preventDefault();
          return;
        }
        if (holeCodeToIndex.has(event.code)) {
          const index = holeCodeToIndex.get(event.code);
          state.heldCodes.delete(event.code);
          state.heldHoles.delete(index);
          releaseHarmonicaHole(index);
          event.preventDefault();
          return;
        }
      }
      if (currentMode === "brass" && ["ArrowLeft", "ArrowDown", "ArrowRight"].includes(event.code)) {
        state.valves[event.code] = false;
        updateValvePills();
        event.preventDefault();
        return;
      }
      if (genericKeyUp(event)) event.preventDefault();
    }

    [
      els.instrument,
      els.wave,
      els.edo,
      els.rowStep,
      els.baseMidi,
      els.baseCents,
      els.harmonicaTuning,
      els.valveLeft,
      els.valveDown,
      els.valveRight
    ].forEach((input) => input.addEventListener("input", render));

    els.resetBase.addEventListener("click", resetBaseForInstrument);

    els.edoLayoutToggle.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-layout]");
      if (!button || button.dataset.layout === edoLayout) return;
      animatePillWindow(els.edoLayoutToggle, () => {
        edoLayout = button.dataset.layout;
        render();
      });
    });

    els.instrumentToggle.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-instrument]");
      if (!button || button.dataset.instrument === els.instrument.value) return;
      animatePillWindow(els.instrumentToggle, () => {
        els.instrument.value = button.dataset.instrument;
        els.instrument.dispatchEvent(new Event("input", { bubbles: true }));
      });
    });

    els.waveToggle.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-wave]");
      if (!button || button.dataset.wave === els.wave.value) return;
      animatePillWindow(els.waveToggle, () => {
        els.wave.value = button.dataset.wave;
        els.wave.dispatchEvent(new Event("input", { bubbles: true }));
      });
    });

    els.pedalToggle.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-pedal]");
      if (!button || (button.dataset.pedal === "on") === state.sustainRelease) return;
      animatePillWindow(els.pedalToggle, () => {
        setPedal(button.dataset.pedal === "on");
      });
    });

    els.monitorToggles.forEach((input) => {
      input.addEventListener("change", () => {
        monitorVisibility[input.dataset.monitorToggle] = input.checked;
        updateVisualizationButtons();
        updateNoteMonitor();
      });
    });

    els.spiroSignToggle.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-spiro-sign]");
      if (!button || button.dataset.spiroSign === spiroSignMode) return;
      animatePillWindow(els.spiroSignToggle, () => {
        spiroSignMode = button.dataset.spiroSign;
        updateVisualizationButtons();
        renderHarmonyVisuals(lastVisualNotes);
      });
    });

    els.spiroMotionToggle.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-spiro-motion]");
      if (!button || button.dataset.spiroMotion === spiroMotionMode) return;
      animatePillWindow(els.spiroMotionToggle, () => {
        spiroMotionMode = button.dataset.spiroMotion;
        updateVisualizationButtons();
        renderHarmonyVisuals(lastVisualNotes);
      });
    });

    [els.volume, els.release].forEach((input) => {
      input.addEventListener("input", updateOutputs);
    });

    ["volume", "release", "edo", "rowStep", "baseMidi", "baseCents", "valveLeft", "valveDown", "valveRight"].forEach((id) => {
      attachOutputDrag(document.getElementById(id), document.getElementById(`${id}Out`));
    });

    document.addEventListener("keydown", onKeyDown);
    document.addEventListener("keyup", onKeyUp);
    window.addEventListener("blur", () => audio.stopAll(true));
    document.addEventListener("pointerdown", () => audio.ensure(), { once: true });
    document.addEventListener("keydown", () => audio.ensure(), { once: true });
    window.addEventListener("resize", () => {
      syncPillWindow(els.instrumentToggle, els.instrumentToggle.querySelector("button.is-active[data-instrument]"));
      syncPillWindow(els.waveToggle, els.waveToggle.querySelector("button.is-active[data-wave]"));
      syncPillWindow(els.pedalToggle, els.pedalToggle.querySelector("button.is-active[data-pedal]"));
      syncPillWindow(els.edoLayoutToggle, els.edoLayoutToggle.querySelector("button.is-active[data-layout]"));
      syncPillWindow(els.spiroSignToggle, els.spiroSignToggle.querySelector("button.is-active[data-spiro-sign]"));
      syncPillWindow(els.spiroMotionToggle, els.spiroMotionToggle.querySelector("button.is-active[data-spiro-motion]"));
      syncEdoGridSize();
      renderHarmonyVisuals(lastVisualNotes);
    });

    render();
  })();
  </script>
</body>
</html>
