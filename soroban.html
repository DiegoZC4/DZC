<!DOCTYPE html> <html lang="en"> 
  <head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soroban</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">
  </head>
<body>
  <main id="container">
  <details id="inputs" open>
    <summary class="settings-toggle" aria-label="Settings" title="Settings">
      <span class="settings-icon" aria-hidden="true">
        <svg class="settings-slider-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" focusable="false">
          <line x1="7" x2="7" y1="6" y2="13"/>
          <circle cx="7" cy="14.5" r="1.5"/>
          <line x1="7" x2="7" y1="16" y2="18"/>
          <line x1="12" x2="12" y1="6" y2="8"/>
          <circle cx="12" cy="9.5" r="1.5"/>
          <line x1="12" x2="12" y1="11" y2="18"/>
          <line x1="17" x2="17" y1="6" y2="11"/>
          <circle cx="17" cy="12.5" r="1.5"/>
          <line x1="17" x2="17" y1="14" y2="18"/>
        </svg>
      </span>
      <div id="header-session-controls" class="header-session-controls">
        <button id="session-start" class="session-action session-start" type="button" aria-label="Start session" title="Start">
          <svg class="session-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
        <div id="session-active-actions" class="session-active-actions" hidden>
          <button id="session-pause" class="session-action session-pause" type="button" aria-label="Pause session" title="Pause">
            <svg class="session-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M8 5h3v14H8zM13 5h3v14h-3z"/>
            </svg>
          </button>
          <button id="session-stop" class="session-action session-stop" type="button" aria-label="Stop session" title="Stop">
            <svg class="session-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M7 7h10v10H7z"/>
            </svg>
          </button>
        </div>
      </div>
      <button id="clear-board" class="clear-board-button" type="button" aria-label="Clear board" title="Clear board">
        <svg class="clear-board-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 287.41 279.34" aria-hidden="true" focusable="false">

        </svg>
      </button>
    </summary>
    <div id="settings-body">
      <div class="board-settings-row">
        <div class="color-pair" aria-label="Theme colors">
          <label class="color-swatch color-swatch-on">
            <input type="color" id="on" aria-label="On color">
          </label>
          <label class="color-swatch color-swatch-off">
            <input type="color" id="off" aria-label="Off color">
          </label>
          <span class="theme-label" aria-hidden="true">
            <span class="theme-word">Theme</span>
          </span>
        </div>
        <div class="pill-toggle" id="mode-toggle" role="group" aria-label="Practice mode">
          <button type="button" data-mode="addsub" aria-label="Add and subtract">+</button>
          <button type="button" data-mode="multiply" aria-label="Multiply">×</button>
        </div>
      </div>
      <div class="practice-kind-row">
        <button class="feature-toggle-button steps-toggle-button" id="error-toggle" type="button" aria-label="Step progress guidance" title="Steps" aria-pressed="false">
          <svg class="steps-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="steps-toggle-check" d="m4.2 6.9 1.7 1.7 3.1-3.5M4.2 12.7l1.7 1.7 3.1-3.5M4.2 18.5l1.7 1.7 3.1-3.5"/>
            <path class="steps-toggle-line" d="M12 7h7.5M12 12.8h7.5M12 18.6h7.5"/>
          </svg>
        </button>
        <div class="number-control-slot" id="columns-control-slot" aria-label="Column count"></div>
        <div class="number-control-slot" id="digits-control-slot" aria-label="Digit count"></div>
      </div>
      <div class="practice-session-panels">
        <div class="session-panel session-panel-stack" data-practice-session-panel="sprint" hidden>
          <div class="session-control-row sprint-control-row">
            <div class="number-control-slot timer-control-slot" id="sprint-minutes-slot" aria-label="Sprint timer"></div>
            <button class="session-action" id="sprint-start" type="button">Start</button>
            <button class="session-action session-stop" id="sprint-stop" type="button" hidden>Stop</button>
          </div>
          <div class="session-score-row">
            <span id="sprint-score" class="header-session-metric">0/0</span>
          </div>
        </div>
        <div class="session-panel session-panel-stack" data-practice-session-panel="goal" hidden>
          <div class="session-control-row">
            <div class="number-control-slot goal-target-control-slot" id="goal-target-slot" aria-label="Goal progress"></div>
            <button class="session-action" id="goal-start" type="button">Start</button>
            <button class="session-action session-stop" id="goal-stop" type="button" hidden>Stop</button>
          </div>
          <div class="session-score-row">
            <strong id="goal-time" class="header-session-metric">00:00</strong>
          </div>
        </div>
      </div>
      <div class="hidden-practice-state" aria-hidden="true">
        <button id="numbers" onclick="this.textContent=0; rng()">0</button>
        <button id="stopwatch" style="margin-left:-5px"></button>
        <div id="buttons"></div>
      </div>
    </div>
  </details>
  <div id="board-area" data-prompt-layout="top">
    <div id="practice-hud" aria-live="polite">
      <strong id="practice-problem">+ 0</strong>
      <div id="practice-progress" class="practice-progress" role="progressbar" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" hidden></div>
      <div id="multiplication-matrix" class="multiplication-matrix" hidden></div>
    </div>
    <svg id="svg" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  </main>
<style>
  :root {
    --on: red;
    --off: blue;
    --blank: white;
    --ui-surface: #eeeeee;
    --ui-rail: #b8b8b8;
    --ui-active: #565656;
    --ui-text: #1f1f1f;
    --settings-radius: 21px;
    --settings-button-size: 42px;
    --settings-header-outer-gap: 6px;
    --settings-header-control-gap: 4px;
    --session-action-height: 32px;
    --session-action-radius: calc(var(--session-action-height) / 2);
    --session-action-width: calc(var(--session-action-radius) * 4);
    --session-time-width: calc(5ch + 10px);
    --session-goal-width: calc(3ch + 10px);
    --settings-header-controls-width: calc(var(--session-time-width) + var(--session-goal-width) + var(--session-action-width) + var(--settings-header-control-gap) * 2);
    --settings-panel-width: calc(var(--settings-button-size) * 2 + var(--settings-header-controls-width) + var(--settings-header-outer-gap) * 2);
    --settings-icon-size: 31px;
    --settings-icon-stroke-width: 2.2;
  }
  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    overflow: hidden;
    background: #f3eee3;
  }
  svg {
    touch-action: none;
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    fill: var(--off);
    stroke:black;
    stroke-width: .05;
    min-width: 0;
    min-height: 0;
  }
  text{
    text-anchor: middle;
    dominant-baseline: middle;
    stroke:none;
    font-size: .5px;
    fill:white;
  }
  button,input[type="color"]{
    width:100px;
    min-height: 40px;
    vertical-align: middle;
    margin:0px;
    background-color: #ddd;
  }
  #buttons button{
    width: 66.4px;
  }
  .feature-toggle-button {
    width: 100%;
    min-height: 36px;
    margin: 0;
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 12px;
    background: var(--off);
    color: white;
    cursor: pointer;
    font: 800 13px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);
    user-select: none;
  }

  .feature-toggle-button.is-active {
    background: var(--on);
    color: white;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);
  }

  .practice-session-toggle {
    --practice-session-index: 0;
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    width: 100%;
    min-height: 42px;
    margin: 0 0 10px;
    padding: 4px;
    border: 1px solid rgba(0,0,0,0.2);
    border-radius: 999px;
    background: var(--ui-rail);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 1px 3px rgba(0,0,0,0.16);
    box-sizing: border-box;
    overflow: hidden;
  }

  .practice-session-thumb {
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: 4px;
    width: calc((100% - 8px) / 3);
    border-radius: 999px;
    background: var(--ui-active);
    box-shadow: 0 1px 5px rgba(0,0,0,0.28);
    transform: translateX(calc(var(--practice-session-index) * 100%));
    transition: transform 180ms ease, background-color 120ms linear;
  }

  .practice-session-option {
    position: relative;
    z-index: 1;
    width: auto;
    min-height: 34px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--ui-text);
    cursor: pointer;
    font: 800 13px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-shadow: none;
    transition: color 160ms ease, text-shadow 160ms ease;
  }

  .practice-session-option.is-active {
    color: white;
    text-shadow: none;
  }

  .color-pair {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    width: 100%;
    min-height: 44px;
    margin: 0 0 10px;
    border: 1px solid rgba(0,0,0,0.18);
    border-radius: 999px;
    overflow: hidden;
    background: #ddd;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 1px 3px rgba(0,0,0,0.14);
    box-sizing: border-box;
  }

  .color-swatch {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 44px;
    cursor: pointer;
    overflow: hidden;
  }

  .color-swatch-on {
    background: var(--on);
  }

  .color-swatch-off {
    background: var(--off);
    border-left: 1px solid rgba(255,255,255,0.72);
  }

  .color-swatch input[type="color"] {
    position: absolute;
    inset: -8px;
    width: calc(100% + 16px);
    height: calc(100% + 16px);
    min-height: 0;
    margin: 0;
    padding: 0;
    border: 0;
    opacity: 0;
    cursor: pointer;
  }

  .theme-label {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    font: 800 17px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .theme-word {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: white;
    text-shadow: 0 1px 2px rgba(0,0,0,0.45);
  }

  .board-settings-row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    align-items: stretch;
    margin: 0;
  }

  .practice-kind-row {
    display: grid;
    grid-template-columns: 42px repeat(2, minmax(0, 1fr));
    gap: 6px;
    align-items: stretch;
    margin: 0;
  }

  .pill-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    margin: 8px 0 6px;
    padding: 3px;
    border: 1px solid rgba(0,0,0,0.16);
    border-radius: 999px;
    background: var(--ui-rail);
  }

  #mode-toggle {
    position: relative;
    border-color: rgba(255,255,255,0.28);
    background: var(--off);
    overflow: hidden;
    isolation: isolate;
  }

  #mode-toggle::before {
    content: "";
    position: absolute;
    top: 3px;
    bottom: 3px;
    left: 3px;
    z-index: 0;
    width: calc((100% - 8px) / 2);
    border-radius: 999px;
    background: var(--on);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);
    transform: translateX(0);
    transition: transform 180ms ease;
    pointer-events: none;
  }

  #mode-toggle[data-mode="multiply"]::before {
    transform: translateX(calc(100% + 2px));
  }

  .practice-kind-row .pill-toggle,
  .board-settings-row .pill-toggle {
    margin: 0;
  }

  .board-settings-row .color-pair {
    margin: 0;
  }

  .pill-toggle button {
    width: auto;
    min-height: 32px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--ui-text);
    cursor: pointer;
    font: 700 13px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-shadow: none;
  }

  .pill-toggle button.is-active {
    background: var(--ui-active);
    color: white;
    text-shadow: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }

  #mode-toggle button {
    position: relative;
    z-index: 1;
    color: white;
  }

  #mode-toggle button.is-active {
    background: transparent;
    box-shadow: none;
  }

  #buttons button[hidden] {
    display: none;
  }
  input[type="color"]{margin-left: -5px;}
  .drag-number-control {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 42px;
    margin: 6px 0;
    padding: 0 10px;
    border: 1px solid rgba(0,0,0,0.14);
    border-radius: 8px;
    background: var(--ui-surface);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    user-select: none;
  }

  .number-control-slot .drag-number-control {
    flex-direction: row-reverse;
    justify-content: flex-end;
    min-height: 42px;
    margin: 0;
    padding: 0 14px 0 8px;
  }

  .practice-kind-row .feature-toggle-button {
    min-height: 38px;
    border-radius: 8px;
    font-size: 12px;
  }

  .steps-toggle-button {
    display: grid;
    place-items: center;
    padding: 0;
  }

  .steps-toggle-icon {
    width: 23px;
    height: 23px;
    overflow: visible;
    fill: currentColor;
  }

  .steps-toggle-line,
  .steps-toggle-check {
    fill: none;
    stroke: currentColor;
    stroke-width: 2.1;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .practice-kind-row .number-control-slot .drag-number-control {
    gap: 4px;
    min-height: 38px;
    padding: 0 6px;
    font-size: 13px;
  }

  .practice-kind-row .number-control-slot .drag-number-value {
    flex-basis: 36px;
    width: 36px;
    min-height: 30px;
    font-size: 16px;
  }

  .number-control-slot .drag-number-control span {
    flex: 0 0 auto;
    color: #111;
    font-weight: 700;
  }

  .number-control-slot .drag-number-value {
    flex: 0 0 42px;
    width: 42px;
    border-color: rgba(255,255,255,0.28);
    background: var(--ui-active);
    color: white;
    text-shadow: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);
  }

  .practice-session-panels {
    display: none;
    margin: 0;
  }

  .session-panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 42px;
    padding: 0 12px;
    border: 1px solid rgba(0,0,0,0.14);
    border-radius: 8px;
    background: var(--ui-surface);
    box-sizing: border-box;
    color: #111;
    font: 700 14px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none;
  }

  .session-panel[hidden] {
    display: none;
  }

  .session-panel strong {
    font-size: 18px;
  }

  .session-panel-stack {
    display: grid;
    gap: 8px;
    padding: 8px;
  }

  .session-control-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 78px;
    gap: 8px;
    align-items: stretch;
  }

  .sprint-control-row {
    grid-template-columns: minmax(86px, 1fr) 78px 62px;
  }

  .sprint-control-row:has(#sprint-stop[hidden]) {
    grid-template-columns: minmax(86px, 1fr) 78px;
  }

  .session-action {
    width: auto;
    min-height: 42px;
    margin: 0;
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 8px;
    background: var(--ui-active);
    color: white;
    cursor: pointer;
    font: 800 13px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-shadow: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);
  }

  .session-stop {
    background: #777;
  }

  .session-score-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

<script>
function svg(tagName, attrs, textContent) {
  var el = document.createElementNS('http://www.w3.org/2000/svg', tagName);
  for (var key in attrs) el.setAttribute(key, attrs[key]);
  if (textContent) el.textContent = textContent;
  return el;
}

class NumSlider {
  constructor(min, max, start, units, step=1, parent='settings-body', options={}) {
    this.min = min
    this.max = max
    this.step = step
    this.values = Array.isArray(options.values) ? [...new Set(options.values.map(Number).filter(Number.isFinite))].sort((a,b)=>a-b) : null
    this.formatter = null
    this.displayOverride = null
    this.dragEnabled = true
    this.beforePointerDown = null

    let num = document.createElement('button')
    num.type = 'button'
    num.className = 'drag-number-value'
    const displayUnits = options.label || units
    const stored = options.storageKey ? localStorage.getItem(options.storageKey) : localStorage.getItem(units)
    const legacyStored = options.legacyStorageKey ? localStorage.getItem(options.legacyStorageKey) : null
    const initial = stored ?? (options.legacyStorageTransform && legacyStored !== null ? options.legacyStorageTransform(legacyStored) : start)
    num.dataset.value = this.clamp(initial)
    num.textContent = this.formatValue(num.dataset.value)
    num.title = `Drag to change ${units}`
    this.num = num

    let label = document.createElement('label')
    label.className = 'drag-number-control'
    label.append(document.createElement('span'))
    label.firstChild.textContent = displayUnits
    label.append(this.num)
    this.label = label

    this.enableDrag()
    document.getElementById(parent).append(this.label)
    this.on('input',()=>localStorage.setItem(options.storageKey || units,this.value()))
  }

  clamp(raw) {
    const value = Number(raw)
    const fallback = Number.isFinite(value) ? value : this.min
    if (this.values && this.values.length) {
      return this.values.reduce((nearest, option) => Math.abs(option - fallback) < Math.abs(nearest - fallback) ? option : nearest, this.values[0])
    }
    const stepped = Math.round(fallback / this.step) * this.step
    return Math.min(Math.max(stepped, this.min), this.max)
  }
  valueIndex(raw=this.value()) {
    if (!this.values || !this.values.length) return 0
    const value = this.clamp(raw)
    return this.values.indexOf(value)
  }
  valueByDelta(startValue, delta) {
    if (!this.values || !this.values.length) return startValue + delta * this.step
    const startIndex = this.valueIndex(startValue)
    const nextIndex = Math.min(Math.max(startIndex + delta, 0), this.values.length - 1)
    return this.values[nextIndex]
  }
  setValue(raw, emit=false) {
    const value = this.clamp(raw)
    const changed = Number(this.num.dataset.value) !== value
    if (changed) {
      this.num.dataset.value = value
      this.renderValue()
    }
    if (emit && changed) this.num.dispatchEvent(new Event('input', { bubbles: true }))
  }
  formatValue(value) {
    return this.formatter ? this.formatter(Number(value)) : value
  }
  renderValue() {
    this.num.textContent = this.displayOverride ?? this.formatValue(this.value())
  }
  setFormatter(formatter) {
    this.formatter = formatter
    this.renderValue()
  }
  setDisplay(text) {
    this.displayOverride = text
    this.renderValue()
  }
  clearDisplay() {
    this.displayOverride = null
    this.renderValue()
  }
  setDragEnabled(enabled) {
    this.dragEnabled = enabled
    this.num.classList.toggle('is-locked', !enabled)
    this.num.setAttribute('aria-disabled', enabled ? 'false' : 'true')
  }
  value() {return Number(this.num.dataset.value)}
  on(event, func) {
    this.num.addEventListener(event,func)
  }
  enableDrag() {
    let startX = 0
    let startY = 0
    let startValue = 0
    let dragging = false
    let moved = false
    const pixelsPerStep = 32
    this.num.addEventListener('pointerdown', (e) => {
      if (!this.dragEnabled) return
      if (e.button !== 0) return
      if (this.beforePointerDown && this.beforePointerDown(e) === false) return
      dragging = true
      moved = false
      startX = e.clientX
      startY = e.clientY
      startValue = this.value()
      this.num.setPointerCapture(e.pointerId)
      e.preventDefault()
    })
    this.num.addEventListener('pointermove', (e) => {
      if (!dragging) return
      const axisDelta = ((e.clientX - startX) - (e.clientY - startY)) / Math.SQRT2
      const delta = Math.round(axisDelta / pixelsPerStep)
      if (delta !== 0) moved = true
      // Apply on every move, including delta === 0, so dragging away and back
      // to the start restores the original value instead of leaving it one
      // step off. `moved` still tracks real movement so a plain click focuses.
      this.setValue(this.valueByDelta(startValue, delta), true)
    })
    this.num.addEventListener('pointerup', (e) => {
      if (!dragging) return
      dragging = false
      this.num.releasePointerCapture(e.pointerId)
      if (!moved) this.num.focus()
    })
    this.num.addEventListener('pointercancel', () => {
      dragging = false
    })
  }
}

class Column{
  constructor(x, cols){
    this.g = svg('g',{transform:`translate(${x},0)`})
    canvas.append(this.g)

    const place = cols - 1 - x
    this.g.append(svg('rect',{x:0,y:2,height:horizon,width:1,fill:place%3==0?'#b8b8b8':'#565656'}))
    // column place labels
    // this.g.append(svg('text',{x:0,y:2,transform:'translate(.5,.6)'},`${place}`))

    this.topBead = svg('rect',{x:0,y:0, height:1, width:1})
    this.g.append(this.topBead)

    this.heaven = 0
    this.earth = 0

    this.top = svg('rect',{x:0,y:0,width:1,height:2,fill:'transparent'})
    this.g.append(this.top)
    this.setValue = (value, notify = true) => {
      const safeValue = Math.min(Math.max(Number(value) || 0, 0), 9)
      const heaven = safeValue >= 5 ? 1 : 0
      const earth = safeValue - heaven * 5
      this.heaven = heaven * 5
      this.earth = earth
      this.topBead.setAttribute('y', heaven)
      this.topBead.style.fill = `var(--${heaven ? 'on' : 'off'})`
      this.bottom.forEach((bead, bi) => {
        if (bi < earth) bead.style.fill = 'var(--on)'
        else if (bi > earth) bead.style.fill = 'var(--off)'
        else bead.style.fill = 'transparent'
      })
      if (notify) queueAutoSubmitCheck()
    }
    this.toggleHeaven = ()=>{
      const y = (+this.topBead.getAttribute('y')+1)%2
      this.setValue(this.earth + y * 5)
    }
    this.top.addEventListener('mousedown',this.toggleHeaven)

    this.earthControls = []
    this.bottom = [0,1,2,3,4].map(i=>{
      const idx = i
      const bead = svg('rect',{x:0,y:i+2+horizon,width:1,height:1})
      if (i==0) bead.style.fill = 'transparent'
      const callback = ()=> this.setValue(this.heaven + idx)
      bead.addEventListener('mousedown',callback)
      this.earthControls.push(callback)
      this.g.append(bead)
      return bead
    })
  }
  move(i){
    if (i==0) this.toggleHeaven()
    if (i>0 && i<6) this.earthControls[i-1]()
  }
  value(){return this.heaven+this.earth}
}

function createSprintTimerValues() {
  const values = []
  for (let seconds = 15; seconds <= 120; seconds += 15) values.push(seconds)
  for (let seconds = 150; seconds <= 300; seconds += 30) values.push(seconds)
  for (let seconds = 360; seconds <= 1200; seconds += 60) values.push(seconds)
  for (let seconds = 1500; seconds <= 3600; seconds += 300) values.push(seconds)
  return values
}

function formatSessionTime(seconds) {
  const safeSeconds = Math.max(0, Math.floor(seconds))
  const minutes = String(Math.floor(safeSeconds / 60)).padStart(2, '0')
  const secs = String(safeSeconds % 60).padStart(2, '0')
  return `${minutes}:${secs}`
}

function formatSprintTime(seconds) {
  const safeSeconds = Math.max(0, Math.floor(seconds))
  const minutes = String(Math.floor(safeSeconds / 60))
  const secs = String(safeSeconds % 60).padStart(2, '0')
  return `${minutes}:${secs}`
}

function stopSessionTimer(session) {

function sessionIsActive() {

function currentPracticeSessionMode() {
  if (sprintSession.status === 'running' || sprintSession.status === 'paused') return 'sprint'
  if (goalSession.status === 'running' || goalSession.status === 'paused') return 'goal'
  return 'zen'
}

function goalElapsedSeconds() {
  if (goalSession.status === 'running') return goalSession.elapsed + Math.floor((Date.now() - goalSession.startTime) / 1000)
  return goalSession.elapsed
}

function parsePersistedBigInt(value, fallback = 0n) {
  try {
    if (value === null || value === undefined || value === '') return fallback
    return BigInt(value)
  } catch {
    return fallback
  }
}

function clampNumber(value, min, max, fallback = min) {
  const numeric = Number(value)
  if (!Number.isFinite(numeric)) return fallback
  return Math.min(Math.max(Math.round(numeric), min), max)
}

function serializedSessionStatus(status) {
  if (status === 'running') return 'paused'
  return ['idle', 'paused', 'finished'].includes(status) ? status : 'idle'
}

function setBoardState(boardText, notify = false) {
  if (!columns || !columns.length) return
  const digitsOnly = String(boardText || '').replace(/\D/g, '')
  const normalized = digitsOnly.padStart(columns.length, '0').slice(-columns.length)
  columns.forEach((column, index) => column.setValue(Number(normalized[index] || 0), false))
  if (notify) queueAutoSubmitCheck()
}

function persistedBoardState() {
  if (!columns || !columns.length) return ''
  return cols2String()
}

function persistedProblemState() {

    base: practiceProblem.base.toString(),
    operand: practiceProblem.operand.toString(),
    answer: practiceProblem.answer.toString()
  }
}

function persistedSprintState() {
  const status = serializedSessionStatus(sprintSession.status)
  return {
    status,
    remainingMs: status === 'idle' ? 0 : Math.max(0, Math.ceil(sprintRemainingMs())),
    correct: sprintSession.correct,
    total: sprintSession.total
  }
}

function persistedGoalState() {
  const status = serializedSessionStatus(goalSession.status)
  return {
    status,
    elapsed: status === 'idle' ? 0 : Math.max(0, goalElapsedSeconds()),
    correct: goalSession.correct
  }
}

function persistSorobanState() {
  if (restoringPersistedState || !columns || !columns.length) return
  const state = {
    version: 1,
    savedAt: Date.now(),
    columns: colSlider.value(),
    digits: digits.value(),
    practiceMode,
    immediateErrorFeedback,
    sessionTarget,
    total: total.textContent || '0',
    board: persistedBoardState(),
    problem: persistedProblemState(),
    progressIndex: practiceProgressState.index,
    lastPracticePromptText,
    lastAddSubOperandText,
    sprintSession: persistedSprintState(),
    goalSession: persistedGoalState()
  }
  localStorage.setItem(persistedSorobanStateKey, JSON.stringify(state))
}

function queuePersistSorobanState() {
  if (restoringPersistedState) return
  if (persistenceFrame) cancelAnimationFrame(persistenceFrame)
  persistenceFrame = requestAnimationFrame(() => {
    persistenceFrame = null
    persistSorobanState()
  })
}

function clearPersistedSorobanState() {
  if (persistenceFrame) cancelAnimationFrame(persistenceFrame)
  persistenceFrame = null
  localStorage.removeItem(persistedSorobanStateKey)
}

function readPersistedSorobanState() {
  try {
    const raw = localStorage.getItem(persistedSorobanStateKey)
    if (!raw) return null
    const state = JSON.parse(raw)
    return state && state.version === 1 ? state : null
  } catch {
    clearPersistedSorobanState()
    return null
  }
}

function restoreSprintState(state) {
  stopSessionTimer(sprintSession)
  sprintSession.status = serializedSessionStatus(state?.status)
  sprintSession.endTime = 0
  sprintSession.remainingMs = Math.max(0, Number(state?.remainingMs) || 0)
  sprintSession.correct = Math.max(0, Number(state?.correct) || 0)
  sprintSession.total = Math.max(sprintSession.correct, Number(state?.total) || 0)
  renderSprintSession()
}

function restoreGoalState(state) {
  stopSessionTimer(goalSession)
  goalSession.status = serializedSessionStatus(state?.status)
  goalSession.startTime = 0
  goalSession.elapsed = Math.max(0, Number(state?.elapsed) || 0)
  goalSession.correct = Math.max(0, Number(state?.correct) || 0)
  renderGoalSession()
}

function restorePersistedSorobanState() {
  const state = readPersistedSorobanState()
  if (!state || !state.problem) return false
  restoringPersistedState = true
  try {
    colSlider.setValue(clampNumber(state.columns, 4, 16, colSlider.value()))
    digits.setValue(clampNumber(state.digits, 1, 8, digits.value()))
    practiceMode = state.practiceMode === 'multiply' ? 'multiply' : 'addsub'
    setPracticeMode(practiceMode)
    setImmediateErrorFeedback(Boolean(state.immediateErrorFeedback))
    sessionTarget = state.sessionTarget === 'goal' ? 'goal' : 'sprint'
    localStorage.setItem('sorobanSessionTarget', sessionTarget)
    total.textContent = String(state.total || '0').replace(/[^\d]/g, '') || '0'
    reset()

    const operation = state.problem.operation === 'multiply' ? 'multiply' : state.problem.operation === 'subtract' ? 'subtract' : 'add'
    const base = parsePersistedBigInt(state.problem.base)
    const operand = parsePersistedBigInt(state.problem.operand)
    const answer = parsePersistedBigInt(state.problem.answer, operation === 'multiply' ? base * operand : operation === 'add' ? base + operand : base - operand)
    setPracticeProblem(operation, base, operand, answer)
    setBoardState(state.board, false)

    lastPracticePromptText = state.lastPracticePromptText || promptTextFor(operation, base, operand)
    lastAddSubOperandText = state.lastAddSubOperandText || ((operation === 'add' || operation === 'subtract') ? operand.toString() : '')
    practiceProgressState.index = clampNumber(state.progressIndex, 0, practiceProgressState.steps.length, 0)
    renderPracticeProgress()
    syncMultiplicationProgressCells()
    restoreSprintState(state.sprintSession)
    restoreGoalState(state.goalSession)
    renderSessionTargetControls()
    renderPracticeProblem()
    syncLegacyAnswerButtons()
  } catch {
    restoringPersistedState = false
    clearPersistedSorobanState()
    return false
  }
  restoringPersistedState = false
  queuePracticeHudLayout()
  queuePersistSorobanState()
  return true
}

function fitPracticeHudText() {
  if (practiceProblemDisplay.hidden || practiceProblemDisplay.offsetParent === null) return
  const baseSize = parseFloat(getComputedStyle(boardArea).getPropertyValue('--hud-font-size'))
  if (!Number.isFinite(baseSize)) return
  let size = Math.min(maxPracticeHudFontSize, baseSize)
  practiceProblemDisplay.style.fontSize = `${size}px`
  for (let i = 0; i < 8; i++) {
    const availableWidth = practiceProblemDisplay.clientWidth
    const availableHeight = practiceProblemDisplay.clientHeight
    if (!availableWidth || !availableHeight) return
    const style = getComputedStyle(practiceProblemDisplay)
    let measuredWidth = practiceProblemDisplay.scrollWidth
    if (promptTextMeasureContext) {
      promptTextMeasureContext.font = `${style.fontWeight} ${size}px ${style.fontFamily}`
      measuredWidth = promptTextMeasureContext.measureText(practiceProblemDisplay.textContent).width
    }
    const widthScale = availableWidth / Math.max(1, measuredWidth)
    const heightScale = availableHeight / Math.max(1, size)
    const scale = Math.min(widthScale, heightScale, 1)
    if (scale >= 0.995) break
    size *= scale * 0.98
    practiceProblemDisplay.style.fontSize = `${Math.max(minPracticeHudFontSize, size)}px`
    if (size <= minPracticeHudFontSize) break
  }
  updatePracticeProgressRing()
}

function updatePracticeProgressRing() {
  if (practiceProgress.hidden || practiceProgress.offsetParent === null) return
  const available = Math.min(practiceHud.clientWidth, practiceHud.clientHeight)
  if (!available) return
  const style = getComputedStyle(practiceProblemDisplay)
  const fontSize = parseFloat(style.fontSize)
  if (!Number.isFinite(fontSize)) return
  promptTextMeasureContext.font = `${style.fontWeight} ${fontSize}px ${style.fontFamily}`
  const metrics = promptTextMeasureContext.measureText(practiceProblemDisplay.textContent)
  const textHeight = metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent || fontSize
  const desired = Math.max(metrics.width + fontSize * 0.92, textHeight + fontSize * 0.92, fontSize * 1.7)
  const size = Math.min(Math.max(48, desired), Math.max(48, available - 4))
  practiceHud.style.setProperty('--practice-progress-size', `${size}px`)
}

function layoutPracticeHud() {
  const rect = boardArea.getBoundingClientRect()
  if (!rect.width || !rect.height) return
  const boardAspect = colSlider.value() / (7 + horizon)
  const areaAspect = rect.width / rect.height
  const gap = Math.min(Math.max(window.innerWidth * 0.014, 8), 16)
  const widthLimited = areaAspect <= boardAspect
  const matrixVisible = multiplicationStepModeActive()
  const promptFloor = 42

  if (widthLimited) {
    const boardHeight = rect.width / boardAspect
    const naturalTrack = rect.height - boardHeight - gap
    const matrixTrackFloor = matrixVisible ? Math.min(Math.max(rect.height * 0.3, 170), 300) : 0
    const track = Math.max(promptFloor, naturalTrack, matrixTrackFloor)
    boardArea.dataset.promptLayout = 'top'
    boardArea.style.setProperty('--hud-track', `${track}px`)
    boardArea.style.setProperty('--board-gap-px', `${gap}px`)
    boardArea.style.setProperty('--hud-font-size', `${Math.min(maxPracticeHudFontSize, Math.max(minPracticeHudFontSize, track * 0.78))}px`)
  } else {
    const boardWidth = rect.height * boardAspect
    const naturalTrack = rect.width - boardWidth - gap
    const track = Math.max(promptFloor, naturalTrack)
    boardArea.dataset.promptLayout = 'side'
    boardArea.style.setProperty('--hud-track', `${track}px`)
    boardArea.style.setProperty('--board-gap-px', `${gap}px`)
    boardArea.style.setProperty('--hud-font-size', `${Math.min(maxPracticeHudFontSize, Math.max(minPracticeHudFontSize, track * 0.72))}px`)
  }
  requestAnimationFrame(fitPracticeHudText)
}

function queuePracticeHudLayout() {
  if (practiceHudFrame) cancelAnimationFrame(practiceHudFrame)
  practiceHudFrame = requestAnimationFrame(() => {
    practiceHudFrame = null
    layoutPracticeHud()

function boardMatchesValue(value) {
  return new RegExp(`^0*${value.toString()}0*$`).test(cols2String())
}

function practiceAnswerMatchesBoard() {
  return boardMatchesValue(practiceProblem.answer)
}

function stepsModeActive() {
  return immediateErrorFeedback
}

function linearStepModeActive() {
  return stepsModeActive() && practiceMode === 'addsub' && practiceProblem.operation !== 'multiply'
}

function multiplicationStepModeActive() {
  return stepsModeActive() && practiceMode === 'multiply' && practiceProblem.operation === 'multiply'
}

function guidedStepModeActive() {
  return linearStepModeActive() || multiplicationStepModeActive()
}

function buildAddSubProgressSteps(operation, base, operand) {
  if (operation !== 'add' && operation !== 'subtract') return []
  const operandText = operand.toString()
  const places = Array.from(operandText, (digit, index) => {
    const exponent = BigInt(operandText.length - 1 - index)
    return {
      digitIndex: index,
      placeValue: BigInt(Number(digit)) * (10n ** exponent)
    }
  })
  if (operation === 'add') places.reverse()
  let current = base
  return places.map(step => {
    current = operation === 'add' ? current + step.placeValue : current - step.placeValue
    return { value: current, digitIndex: step.digitIndex }
  })
}

function buildMultiplicationProgressSteps(base, operand) {
  const topDigits = base.toString()
  const sideDigits = Array.from(operand.toString()).reverse().join('')
  const cells = []
  for (let row = 0; row < sideDigits.length; row++) {
    for (let col = 0; col < topDigits.length; col++) {
      const topPlace = topDigits.length - 1 - col
      const sidePlace = row
      const exponent = topPlace + sidePlace
      const digitProduct = BigInt(Number(topDigits[col])) * BigInt(Number(sideDigits[row]))
      const partial = digitProduct * (10n ** BigInt(exponent))
      cells.push({ cellKey: `${row}-${col}`, row, col, exponent, partial })
    }
  }
  cells.sort((a, b) => a.exponent - b.exponent || a.row - b.row || a.col - b.col)
  let current = 0n
  return cells.map(cell => {
    current += cell.partial
    return { ...cell, value: current }
  })
}

function buildPracticeProgressSteps(operation, base, operand) {
  if (operation === 'multiply') return buildMultiplicationProgressSteps(base, operand)
  return buildAddSubProgressSteps(operation, base, operand)
}

function renderPracticeProgress() {
  const active = linearStepModeActive() && practiceProgressState.steps.length > 0
  practiceProgress.hidden = true
  practiceHud.classList.toggle('has-progress', false)
  const totalSteps = practiceProgressState.steps.length
  const completedSteps = Math.min(practiceProgressState.index, totalSteps)
  practiceProgress.setAttribute('aria-valuemax', String(totalSteps))
  practiceProgress.setAttribute('aria-valuenow', String(completedSteps))
  practiceProblemDisplay.classList.toggle('is-checkpoint-control', active)
  practiceProblemDisplay.title = active ? 'Restore last checkpoint' : ''
  renderPracticeProblem()
  queuePersistSorobanState()
}

function lastPracticeCheckpointValue() {
  if (!guidedStepModeActive()) return null
  const previousStep = practiceProgressState.steps[practiceProgressState.index - 1]
  if (previousStep) return previousStep.value
  if (practiceProblem.operation === 'multiply') return 0n
  if (practiceProblem.operation === 'add' || practiceProblem.operation === 'subtract') return practiceProblem.base
  return null
}

function restoreLastPracticeCheckpoint() {
  const checkpoint = lastPracticeCheckpointValue()
  if (checkpoint === null) return
  setBoardState(checkpoint.toString(), false)
  queuePersistSorobanState()
}

function preparePracticeProgress() {
  practiceProgressState = {
    steps: buildPracticeProgressSteps(practiceProblem.operation, practiceProblem.base, practiceProblem.operand),
    index: 0
  }
  renderPracticeProgress()
}

function practiceProgressComplete() {
  return !guidedStepModeActive() || practiceProgressState.index >= practiceProgressState.steps.length
}

function advancePracticeProgressForBoard() {
  if (!guidedStepModeActive()) return false
  let advanced = false
  while (practiceProgressState.index < practiceProgressState.steps.length) {
    const nextStep = practiceProgressState.steps[practiceProgressState.index]
    if (!boardMatchesValue(nextStep.value)) break
    practiceProgressState.index += 1
    advanced = true
  }
  if (advanced) {
    renderPracticeProgress()
    syncMultiplicationProgressCells()
  }
  return advanced
}

function queueAutoSubmitCheck() {
  if (restoringPersistedState) return
  if (!autoAdvanceEnabled()) return
  if (!columns || !columns.length) return
  advancePracticeProgressForBoard()
  if (guidedStepModeActive() && !practiceProgressComplete()) {
    queuePersistSorobanState()
    return
  }
  if (practiceAnswerMatchesBoard()) submitPracticeAnswer()
  else queuePersistSorobanState()
}

function sprintConfiguredMs() {
  return sprintMinutes.value() * 1000
}

function sprintRemainingMs() {
  if (sprintSession.status === 'running') return Math.max(0, sprintSession.endTime - Date.now())
  if (sprintSession.status === 'paused') return sprintSession.remainingMs
  if (sprintSession.status === 'finished') return 0
  return sprintConfiguredMs()
}

function renderSessionTargetControls() {
  const active = sessionIsActive()
  const sprintSelected = sessionTarget === 'sprint'
  const goalSelected = sessionTarget === 'goal'
  const sprintLive = sprintSession.status === 'running' || sprintSession.status === 'paused'
  const goalLive = goalSession.status === 'running' || goalSession.status === 'paused'
  settingsPanel.dataset.headerSession = sessionTarget
  headerSessionControls.dataset.sessionTarget = sessionTarget
  sprintMinutesSlot.classList.add('session-target-slot')
  goalTargetSlot.classList.add('session-target-slot')
  sprintMinutesSlot.classList.toggle('is-selected', sprintSelected)
  sprintMinutesSlot.classList.toggle('is-live', sprintSelected && sprintLive)
  sprintMinutesSlot.classList.toggle('is-zeroed', !sprintSelected)
  goalTargetSlot.classList.toggle('is-selected', goalSelected)
  goalTargetSlot.classList.toggle('is-live', goalSelected && goalLive)
  goalTargetSlot.classList.toggle('is-zeroed', !goalSelected)
  sprintMinutes.setDragEnabled(!active)
  goalProblems.setDragEnabled(!active)

  if (sprintSelected) {
    const sprintActive = sprintSession.status === 'running' || sprintSession.status === 'paused' || sprintSession.status === 'finished'
    sprintMinutes.setDisplay(sprintActive ? formatSprintTime(Math.ceil(sprintRemainingMs() / 1000)) : null)
    goalProblems.setDisplay('0')
  } else {
    const goalActive = goalSession.status === 'running' || goalSession.status === 'paused' || goalSession.status === 'finished'
    sprintMinutes.setDisplay(goalActive ? formatSprintTime(goalElapsedSeconds()) : '0:00')
    goalProblems.setDisplay(goalActive ? `${Math.min(goalSession.correct, goalProblems.value())}/${goalProblems.value()}` : null)
  }

  const paused = sprintSession.status === 'paused' || goalSession.status === 'paused'
  sessionStart.hidden = active
  sessionActiveActions.hidden = !active
  sessionPause.setAttribute('aria-label', paused ? 'Resume session' : 'Pause session')
  sessionPause.title = paused ? 'Resume' : 'Pause'
  setActionIcon(sessionPause, paused ? 'M8 5v14l11-7z' : 'M8 5h3v14H8zM13 5h3v14h-3z')
}

function renderSprintSession() {
  let remainingMs = sprintRemainingMs()
  if (sprintSession.status === 'running' && remainingMs <= 0) {
    sprintSession.status = 'finished'
    sprintSession.remainingMs = 0
    stopSessionTimer(sprintSession)
    remainingMs = 0
  }
  const active = sprintSession.status === 'running' || sprintSession.status === 'paused'
  sprintMinutes.setDragEnabled(!active)
  sprintMinutes.setDisplay(formatSprintTime(Math.ceil(remainingMs / 1000)))
  sprintScore.textContent = `${sprintSession.correct}/${sprintSession.total}`
  renderSessionTargetControls()
  queuePersistSorobanState()
}

function resetSprintSession() {
  sprintSession.status = 'idle'
  stopSessionTimer(sprintSession)
  sprintSession.endTime = 0
  sprintSession.remainingMs = 0
  sprintSession.correct = 0
  sprintSession.total = 0
  renderSprintSession()
}

function startSprintSession() {
  const restarting = sprintSession.status === 'idle' || sprintSession.status === 'finished'
  const duration = sprintSession.status === 'paused' ? sprintSession.remainingMs : sprintConfiguredMs()
  sprintSession.status = 'running'
  sprintSession.endTime = Date.now() + duration
  sprintSession.remainingMs = duration
  if (restarting) {
    sprintSession.correct = 0
    sprintSession.total = 0
  }
  stopSessionTimer(sprintSession)
  sprintSession.timer = setInterval(renderSprintSession, 250)
  renderSprintSession()
}

function pauseSprintSession() {
  if (sprintSession.status !== 'running') return
  sprintSession.remainingMs = Math.max(0, sprintSession.endTime - Date.now())
  sprintSession.status = 'paused'
  stopSessionTimer(sprintSession)
  renderSprintSession()
}

function stopSprintSession() {
  resetSprintSession()
}

function renderGoalSession() {
  const target = goalProblems.value()
  const elapsedSeconds = goalElapsedSeconds()
  const active = goalSession.status === 'running' || goalSession.status === 'paused'
  goalProblems.setDragEnabled(!active)
  goalProblems.setDisplay(`${Math.min(goalSession.correct, target)}/${target}`)
  goalTime.textContent = formatSessionTime(elapsedSeconds)
  renderSessionTargetControls()
  queuePersistSorobanState()
}

function resetGoalSession() {
  goalSession.status = 'idle'
  stopSessionTimer(goalSession)
  goalSession.startTime = 0
  goalSession.elapsed = 0
  goalSession.correct = 0
  renderGoalSession()
}

function startGoalSession() {
  const restarting = goalSession.status === 'idle' || goalSession.status === 'finished'
  if (restarting) {
    goalSession.elapsed = 0
    goalSession.correct = 0
  }
  goalSession.status = 'running'
  goalSession.startTime = Date.now()
  stopSessionTimer(goalSession)
  goalSession.timer = setInterval(renderGoalSession, 250)
  renderGoalSession()
}

function pauseGoalSession() {
  if (goalSession.status !== 'running') return
  goalSession.elapsed += Math.floor((Date.now() - goalSession.startTime) / 1000)
  goalSession.status = 'paused'
  stopSessionTimer(goalSession)
  renderGoalSession()
}

function stopGoalSession() {
  resetGoalSession()
}

function completeGoalSession() {
  goalSession.elapsed = goalSession.elapsed + Math.floor((Date.now() - goalSession.startTime) / 1000)
  goalSession.status = 'finished'
  stopSessionTimer(goalSession)
  renderGoalSession()
}

function recordPracticeAttempt(correct) {
  if (sprintSession.status === 'running') {
    renderSprintSession()
    sprintSession.total += 1
    if (correct) sprintSession.correct += 1
    renderSprintSession()
  }
  if (goalSession.status === 'running') {
    if (!correct) return
    goalSession.correct += 1
    if (goalSession.correct >= goalProblems.value()) completeGoalSession()
    else renderGoalSession()
  }
  queuePersistSorobanState()
}

function startSelectedSession() {
  if (sessionTarget === 'goal') startGoalSession()

}

function pauseOrResumeSelectedSession() {
  if (sprintSession.status === 'running') pauseSprintSession()
  else if (sprintSession.status === 'paused') startSprintSession()
  else if (goalSession.status === 'running') pauseGoalSession()
  else if (goalSession.status === 'paused') startGoalSession()
}

function stopSelectedSession() {
  if (sprintSession.status === 'running' || sprintSession.status === 'paused') stopSprintSession()
  if (goalSession.status === 'running' || goalSession.status === 'paused') stopGoalSession()
}

function currentTotal() {
  return BigInt(total.textContent || '0')
}

function boardMax() {
  return 10n ** BigInt(colSlider.value()) - 1n
}

function pow10(exponent) {
  return 10n ** BigInt(exponent)
}

function randomBigInt(min, max) {
  if (max < min) return 0n
  const range = max - min + 1n
  if (range <= BigInt(Number.MAX_SAFE_INTEGER)) {
    return min + BigInt(Math.floor(Math.random() * Number(range)))
  }
  const digitCount = range.toString().length
  let candidate = 0n
  do {
    let text = ''
    for (let i = 0; i < digitCount; i++) text += Math.floor(Math.random() * 10)
    candidate = BigInt(text)
  } while (candidate >= range)
  return min + candidate
}

function endsInZero(value) {
  return value !== 0n && value % 10n === 0n
}

function randomOperandWithDigitCount(digitCount, maxAllowed = boardMax(), options = {}) {
  const min = digitCount <= 1 ? 1n : pow10(digitCount - 1)
  const max = pow10(digitCount) - 1n
  const cappedMax = maxAllowed < max ? maxAllowed : max
  if (cappedMax < min) return 0n
  for (let attempt = 0; attempt < 64; attempt++) {
    const operand = randomBigInt(min, cappedMax)
    if (!options.rejectTerminalZero || !endsInZero(operand)) return operand
  }
  for (let operand = min; operand <= cappedMax; operand++) {
    if (!options.rejectTerminalZero || !endsInZero(operand)) return operand
  }
  return 0n
}

function randomOperandUpToDigitCount(maxDigits, maxAllowed = boardMax(), options = {}) {
  const cappedMax = maxAllowed < pow10(maxDigits) - 1n ? maxAllowed : pow10(maxDigits) - 1n
  if (cappedMax < 1n) return 0n
  const allowedDigits = []
  for (let digitCount = 1; digitCount <= maxDigits; digitCount++) {
    const min = digitCount <= 1 ? 1n : pow10(digitCount - 1)
    if (cappedMax >= min) allowedDigits.push(digitCount)
  }
  const selectedDigits = allowedDigits[Math.floor(Math.random() * allowedDigits.length)]
  return randomOperandWithDigitCount(selectedDigits, cappedMax, options)
}

function randomOperand(maxAllowed = boardMax(), avoidText = '') {
  const n = digits.value()
  const exactMin = pow10(n - 1)
  const exactMax = pow10(n) - 1n
  const cappedMax = maxAllowed < exactMax ? maxAllowed : exactMax
  if (cappedMax < 1n) return 0n
  const min = cappedMax >= exactMin ? exactMin : 1n
  const avoid = avoidText ? BigInt(avoidText) : null
  if (avoid !== null && min === cappedMax && min === avoid) return 0n
  for (let attempt = 0; attempt < 64; attempt++) {
    const operand = randomBigInt(min, cappedMax)
    if (avoid === null || operand !== avoid) return operand
  }
  if (avoid === null || min !== avoid) return min
  return min + 1n <= cappedMax ? min + 1n : 0n
}

function promptTextFor(operation, base, operand) {
  if (operation === 'multiply') return `${base} ${practiceSymbols.multiply} ${operand}`
  return `${practiceSymbols[operation]} ${operand}`
}

function promptIsFresh(operation, base, operand, attempt) {
  return promptTextFor(operation, base, operand) !== lastPracticePromptText || attempt >= repeatPromptRetryLimit
}

function setPracticeProblem(operation, base, operand, answer) {
  const promptText = promptTextFor(operation, base, operand)
  practiceProblem = { operation, base, operand, answer, promptText }
  lastPracticePromptText = promptText
  if (operation === 'add' || operation === 'subtract') lastAddSubOperandText = operand.toString()
  preparePracticeProgress()
  renderPracticeProblem()
  renderMultiplicationMatrix()

}

function renderMultiplicationMatrix() {
  const visible = multiplicationStepModeActive()
  multiplicationMatrix.hidden = !visible
  multiplicationMatrix.classList.toggle('is-checkpoint-control', visible)
  multiplicationMatrix.title = visible ? 'Restore last checkpoint' : ''
  practiceHud.classList.toggle('has-matrix', visible)
  multiplicationMatrix.replaceChildren()
  if (!visible) {
    queuePracticeHudLayout()
    return
  }

  const topDigits = practiceProblem.base.toString()
  const sideDigits = Array.from(practiceProblem.operand.toString()).reverse().join('')
  const cols = topDigits.length
  const rows = sideDigits.length
  const scale = 0.64
  const labelOffset = 0.34
  const pad = 0.9
  const plot = (x, y) => ({
    x: (x - y) * scale,
    y: (x + y) * scale
  })
  const lattice = []
  for (let y = 0; y <= rows; y++) {
    for (let x = 0; x <= cols; x++) lattice.push(plot(x, y))
  }
  const minX = Math.min(...lattice.map(point => point.x)) - pad
  const maxX = Math.max(...lattice.map(point => point.x)) + pad
  const minY = Math.min(...lattice.map(point => point.y)) - pad
  const maxY = Math.max(...lattice.map(point => point.y)) + pad
  const matrixSvg = svg('svg', {
    class: 'multiplication-matrix-svg',
    viewBox: `${minX} ${minY} ${maxX - minX} ${maxY - minY}`,
    preserveAspectRatio: 'xMidYMid meet',
    role: 'img',
    'aria-label': `${practiceProblem.base} by ${practiceProblem.operand} partial product tracker`
  })

  const cellGroup = svg('g', {})
  const stepByCell = new Map(practiceProgressState.steps.map((step, index) => [step.cellKey, index]))
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const corners = [
        plot(col, row),
        plot(col + 1, row),
        plot(col + 1, row + 1),
        plot(col, row + 1)
      ]
      const cellKey = `${row}-${col}`
      const stepIndex = stepByCell.get(cellKey)
      const complete = Number.isInteger(stepIndex) && stepIndex < practiceProgressState.index
      const latestComplete = complete && stepIndex === practiceProgressState.index - 1
      const zeroFactor = topDigits[col] === '0' || sideDigits[row] === '0'
      const cell = svg('polygon', {
        class: `partial-product-cell${complete ? ' is-covered' : ''}${latestComplete ? ' is-latest-covered' : ''}${zeroFactor ? ' is-zero-factor' : ''}`,
        points: corners.map(point => `${point.x},${point.y}`).join(' '),
        'data-cell-key': cellKey,
        'data-step-index': Number.isInteger(stepIndex) ? String(stepIndex) : '',
        'aria-label': `${topDigits[col]} times ${sideDigits[row]}`
      })
      cellGroup.append(cell)
    }
  }
  matrixSvg.append(cellGroup)

  const topLabelGroup = svg('g', {})
  for (let col = 0; col < cols; col++) {
    const a = plot(col, 0)
    const b = plot(col + 1, 0)
    topLabelGroup.append(svg('text', {
      class: 'multiplication-matrix-label',
      x: (a.x + b.x) / 2 + labelOffset,
      y: (a.y + b.y) / 2 - labelOffset
    }, topDigits[col]))
  }
  matrixSvg.append(topLabelGroup)

  const sideLabelGroup = svg('g', {})
  for (let row = 0; row < rows; row++) {
    const a = plot(cols, row)
    const b = plot(cols, row + 1)
    sideLabelGroup.append(svg('text', {
      class: 'multiplication-matrix-label',
      x: (a.x + b.x) / 2 + labelOffset,
      y: (a.y + b.y) / 2 + labelOffset
    }, sideDigits[row]))
  }
  matrixSvg.append(sideLabelGroup)
  multiplicationMatrix.append(matrixSvg)
  syncMultiplicationProgressCells()
  queuePracticeHudLayout()
}

function syncMultiplicationProgressCells() {
  multiplicationMatrix.querySelectorAll('.partial-product-cell').forEach(cell => {
    const rawStepIndex = cell.dataset.stepIndex
    const stepIndex = Number(rawStepIndex)
    const complete = rawStepIndex !== '' && Number.isInteger(stepIndex) && stepIndex < practiceProgressState.index
    const latestComplete = complete && stepIndex === practiceProgressState.index - 1
    cell.classList.toggle('is-covered', complete)
    cell.classList.toggle('is-latest-covered', latestComplete)
  })
}

function rng(resetFlag=true){
  if (resetFlag) reset()

  else generateAddSubProblem()

function restartPractice() {

function clearBoard() {
  clearPersistedSorobanState()
  reset()
  if (currentPracticeSessionMode() !== 'zen' || practiceMode !== 'addsub') return
  const operand = practiceProblem.operand > 0n ? practiceProblem.operand : randomOperand()
  total.textContent = '0'
  setPracticeProblem('add', 0n, operand, operand)
}

function generateAddSubProblem() {
  const limit = boardMax()
  const base = currentTotal()
  for (let attempt = 0; attempt < 1000; attempt++) {
    const operation = Math.random() < 0.5 ? 'add' : 'subtract'
    const room = operation === 'add' ? limit - base : base
    if (room <= 0n) continue
    const operand = randomOperand(room, lastAddSubOperandText)
    const answer = operation === 'add' ? base + operand : base - operand
    if (operand > 0n && answer >= 0n && answer <= limit && promptIsFresh(operation, base, operand, attempt)) {
      setPracticeProblem(operation, base, operand, answer)
      return
    }
  }
  const addRoom = limit - base
  const subtractRoom = base
  const fallbackOperations = Math.random() < 0.5
    ? [['add', addRoom], ['subtract', subtractRoom]]
    : [['subtract', subtractRoom], ['add', addRoom]]
  for (const [operation, room] of fallbackOperations) {
    if (room <= 0n) continue
    const operand = randomOperand(room, lastAddSubOperandText)
    if (operand <= 0n) continue
    const answer = operation === 'add' ? base + operand : base - operand
    setPracticeProblem(operation, base, operand, answer)
    return
  }
}

function generateMultiplyProblem() {
  const n = digits.value()
  const requiredProductColumns = Math.min(16, n * 2)
  if (colSlider.value() < requiredProductColumns) {
    colSlider.setValue(requiredProductColumns, true)
  }
  const limit = boardMax()
  const multiplicationFactorOptions = { rejectTerminalZero: true }
  for (let attempt = 0; attempt < 1000; attempt++) {
    const base = randomOperandWithDigitCount(n, limit, multiplicationFactorOptions)
    const operandLimit = base > 0n ? limit / base : 0n
    // Keep multiplication practice square for deterministic matrix geometry.
    // Swap back to randomOperandUpToDigitCount(...) here for mixed-length factors.
    const operand = randomOperandWithDigitCount(n, operandLimit, multiplicationFactorOptions)
    const answer = base * operand
    if (base > 0n && operand > 0n && !endsInZero(base) && !endsInZero(operand) && answer <= limit && promptIsFresh('multiply', base, operand, attempt)) {
      setPracticeProblem('multiply', base, operand, answer)
      return
    }
  }
  const base = randomOperandWithDigitCount(n, limit, multiplicationFactorOptions)
  const operandLimit = base > 0n ? limit / base : 1n
  const operand = randomOperandWithDigitCount(n, operandLimit, multiplicationFactorOptions)
  setPracticeProblem('multiply', base, operand, base * operand)
}

function renderPracticeProblem() {
  practiceProblemDisplay.replaceChildren()
  const promptText = practiceProblem.promptText || promptTextFor(practiceProblem.operation, practiceProblem.base, practiceProblem.operand)
  if (!linearStepModeActive()) {
    practiceProblemDisplay.textContent = promptText
    practiceProblemDisplay.classList.remove('is-checkpoint-control')
    practiceProblemDisplay.title = ''
    queuePracticeHudLayout()
    return
  }

  const symbol = document.createElement('span')
  symbol.className = 'practice-problem-symbol'
  symbol.textContent = `${practiceSymbols[practiceProblem.operation]} `
  practiceProblemDisplay.append(symbol)

  const completedDigitIndexes = new Set(
    practiceProgressState.steps
      .slice(0, practiceProgressState.index)
      .map(step => step.digitIndex)
      .filter(index => Number.isInteger(index))
  )
  const latestDigitIndex = practiceProgressState.steps[practiceProgressState.index - 1]?.digitIndex
  Array.from(practiceProblem.operand.toString()).forEach((digit, index) => {
    const span = document.createElement('span')
    const complete = completedDigitIndexes.has(index)
    const latestComplete = complete && index === latestDigitIndex
    span.className = `practice-problem-digit${complete ? ' is-complete' : ''}${latestComplete ? ' is-latest-complete' : ''}`
    span.textContent = digit
    practiceProblemDisplay.append(span)
  })
  practiceProblemDisplay.classList.toggle('is-checkpoint-control', practiceProgressState.steps.length > 0)
  practiceProblemDisplay.title = practiceProgressState.steps.length > 0 ? 'Restore last checkpoint' : ''
  queuePracticeHudLayout()
}

function syncLegacyAnswerButtons() {
  Array.from(btnCont.children).forEach((btn,i)=>{
    const visible = ['add', 'subtract', 'multiply'][i] === practiceProblem.operation
    btn.dataset.label = practiceProblemDisplay.textContent
    btn.dataset.answer = practiceProblem.answer.toString()
    btn.hidden = !visible
    btn.textContent = btn.dataset.label
    btn.style.backgroundColor = '#ddd'

function submitPracticeAnswer() {
  const answer = practiceProblem.answer.toString()
  advancePracticeProgressForBoard()
  if (guidedStepModeActive() && !practiceProgressComplete()) return
  const correct = practiceAnswerMatchesBoard()
  if (correct) {
    total.textContent = answer
    recordPracticeAttempt(true)
    rng(practiceMode === 'multiply')
  } else {
    recordPracticeAttempt(false)
    queuePersistSorobanState()
  }
}

document.onkeydown = (e)=>{

canvas.addEventListener('touchstart', function(e) {
  // Loop through all current touches
  for (const touch of e.changedTouches) {
    const simulatedEvent = new MouseEvent('mousedown', {
      bubbles: true,
      cancelable: true,
      clientX: touch.clientX,
      clientY: touch.clientY,
      screenX: touch.screenX,
      screenY: touch.screenY,
      button: 0 // left button
    });

    touch.target.dispatchEvent(simulatedEvent);
  }

  // Prevent browser gestures like scrolling or zooming
  e.preventDefault();
}, { passive: false });

function cols2String(){
  return columns.map(c=>c.value()).join('')
}

const btn = document.getElementById('stopwatch');

let state = 'idle';   // 'idle' -> 'running' -> 'stopped'
let startTime = 0;    // ms when started
let elapsed = 0;      // whole seconds accumulated
let tick = null;      // interval id

const fmt = (s) => {
  const m = String(Math.floor(s / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  return `${m}:${sec}`;
};

// always compute "live" seconds based on startTime + elapsed
const liveSeconds = () => Math.floor((Date.now() - startTime) / 1000) + elapsed;

const render = () => {
  btn.style.backgroundColor =
    state === 'idle'    ? '#ddd' :     // grey
    state === 'running' ? '#dfd' :     // green
                          '#fcc';      // red
  btn.textContent = state === 'running' ? fmt(liveSeconds())
                                        : fmt(elapsed);
};

const start = () => {
  if (state === 'running') return;
  state = 'running';
  startTime = Date.now();
  clearInterval(tick);
  tick = setInterval(render, 250);  // update a few times/sec; display is floored
  render();
};

const stop = () => {
  if (state !== 'running') return;
  elapsed = liveSeconds();   // <-- capture BEFORE switching state
  state = 'stopped';
  clearInterval(tick);
  tick = null;
  render();
};

const resetClock = () => {
  state = 'idle';
  elapsed = 0;
  clearInterval(tick);
  tick = null;
  render();
};

btn.addEventListener('click', () => {
  if (state === 'idle') start();
  else if (state === 'running') stop();
  else resetClock();
});

render(); // initial paint
