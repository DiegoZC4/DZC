<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERG Key Solver</title><link rel="stylesheet" href="draft.css"><style>
.stage{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:1rem}.keyboard{display:grid;align-content:center;gap:5px;padding:clamp(1rem,4vw,3rem);background:#172b2e;border-radius:18px;box-shadow:var(--shadow);overflow:auto}.key-row{display:flex;gap:5px;transform:translateX(calc(var(--offset)*2.8rem))}.key{width:clamp(42px,7vw,75px);aspect-ratio:1.15;border:1px solid #72817d;border-radius:8px;background:#f4efe3;display:grid;place-items:center;text-align:center;flex:0 0 auto;position:relative}.key strong{font:1rem monospace}.key small{color:var(--muted)}.key.used{background:#d9b05f}.key.hot{box-shadow:inset 0 -8px #d25532}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}.metrics div{padding:.55rem;border-top:3px solid var(--accent)}.metrics strong{display:block;font:1.7rem "Draft Serif",serif}.drop{padding:1rem;border:2px dashed var(--line);border-radius:12px;text-align:center}.drop input{padding:.3rem}.sequence{max-height:90px;overflow:auto;font-family:monospace;word-break:break-word}.tuning{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}@media(max-width:720px){.metrics{grid-template-columns:1fr 1fr}.key-row{transform:translateX(calc(var(--offset)*1.5rem))}}
</style></head><body><main class="app"><header class="topbar"><h1>ERG Key Solver</h1><span class="kicker">MIDI → compact isomorphic keyboard</span></header><div class="workspace"><aside class="sidebar stack"><label class="drop">Load MIDI file<input id="file" type="file" accept=".mid,.midi,audio/midi"></label><label>Or paste notes<textarea id="notes" rows="3" placeholder="60 62 64 67, or C4 D4 E4 G4"></textarea></label><div class="tuning"><label>Rows<input id="rows" type="number" min="1" max="6" value="4"></label><label>Columns<input id="cols" type="number" min="3" max="14" value="10"></label></div><button class="primary" id="solve">Find ergonomic tuning</button><div class="tuning"><label>Start note<input id="start" type="number" min="0" max="127" value="48"></label><label>Step per row<input id="step" type="number" min="1" max="24" value="5"></label></div><div class="eyebrow">Parsed sequence</div><div class="sequence" id="sequence">No notes loaded.</div><p class="muted">The search penalizes uncovered pitches first, then minimizes finger travel through the note sequence. Repeated pitches may use whichever duplicate key is nearest.</p></aside><section class="stage"><div class="keyboard" id="keyboard"></div><div class="metrics panel"><div><span class="eyebrow">Coverage</span><strong id="coverage">—</strong></div><div><span class="eyebrow">Mean move</span><strong id="travel">—</strong></div><div><span class="eyebrow">Start</span><strong id="startMetric">—</strong></div><div><span class="eyebrow">Row step</span><strong id="stepMetric">—</strong></div></div></section></div></main><script>
const $=id=>document.getElementById(id),NAMES=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],KEYS=['1','2','3','4','5','6','7','8','9','0','Q','W','E','R','T','Y','U','I','O','P','A','S','D','F','G','H','J','K','L',';','Z','X','C','V','B','N','M',',','.','/'],OFFSETS=[0,.25,.75,1.25,1.7,2.1];let sequence=[];
function noteName(n){return NAMES[(n%12+12)%12]+(Math.floor(n/12)-1)}function parseText(text){const out=[];for(const token of text.match(/[A-Ga-g](?:#|b|♯|♭)?-?\d+|\d+/g)||[]){if(/^\d+$/.test(token)){const n=+token;if(n<=127)out.push(n);continue}const m=token.match(/^([A-Ga-g])([#b♯♭]?)(-?\d+)$/),base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1].toUpperCase()],acc=m[2]==='#'||m[2]==='♯'?1:m[2]==='b'||m[2]==='♭'?-1:0;out.push((+m[3]+1)*12+base+acc)}return out}
function readVlq(bytes,state){let value=0,b;do{b=bytes[state.p++];value=(value<<7)|(b&127)}while(b&128);return value}function text4(bytes,p){return String.fromCharCode(...bytes.slice(p,p+4))}function u32(bytes,p){return(bytes[p]*0x1000000)+(bytes[p+1]<<16)+(bytes[p+2]<<8)+bytes[p+3]}
function parseMidi(buffer){const b=new Uint8Array(buffer);if(text4(b,0)!=='MThd')throw Error('Not a Standard MIDI File.');const tracks=(b[10]<<8)+b[11],out=[];let p=8+u32(b,4);for(let t=0;t<tracks;t++){if(text4(b,p)!=='MTrk')throw Error('Missing MIDI track header.');const end=p+8+u32(b,p+4);p+=8;let running=0;while(p<end){const state={p};readVlq(b,state);p=state.p;let status=b[p];if(status<128){if(!running)throw Error('Invalid running status.');status=running}else{p++;if(status<0xF0)running=status}if(status===0xFF){p++;state.p=p;const len=readVlq(b,state);p=state.p+len;continue}if(status===0xF0||status===0xF7){state.p=p;const len=readVlq(b,state);p=state.p+len;continue}const kind=status&0xF0,len=(kind===0xC0||kind===0xD0)?1:2,note=b[p],velocity=len===2?b[p+1]:0;if(kind===0x90&&velocity>0)out.push(note);p+=len}p=end}return out}
function positions(start,step,rows,cols){const map=new Map(),cells=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const note=start+r*step+c,pos={r,c,x:c+OFFSETS[r],y:r,note,index:r*cols+c};cells.push(pos);if(!map.has(note))map.set(note,[]);map.get(note).push(pos)}return{map,cells}}
function evaluate(start,step,rows,cols){const layout=positions(start,step,rows,cols),missing=sequence.filter(n=>!layout.map.has(n)).length;let travel=0,count=0,prev=null,chosen=[];for(const note of sequence){const options=layout.map.get(note);if(!options){chosen.push(null);prev=null;continue}let pick=options[0];if(prev)pick=options.reduce((best,p)=>dist(prev,p)<dist(prev,best)?p:best,pick);if(prev){travel+=dist(prev,pick);count++}chosen.push(pick);prev=pick}return{start,step,layout,missing,travel:count?travel/count:0,chosen,score:missing*10000+(count?travel/count:0)}}function dist(a,b){return Math.hypot(a.x-b.x,(a.y-b.y)*1.1)}
function solve(){if(!sequence.length)return alert('Load a MIDI file or paste a note sequence first.');const rows=+$('rows').value,cols=+$('cols').value,min=Math.min(...sequence),max=Math.max(...sequence);let best=null;for(let step=1;step<=24;step++)for(let start=Math.max(0,min-step*(rows-1)-cols+1);start<=Math.min(127,min+12);start++){const e=evaluate(start,step,rows,cols);if(!best||e.score<best.score)best=e}$('start').value=best.start;$('step').value=best.step;render(best)}
function render(result){const rows=+$('rows').value,cols=+$('cols').value,start=+$('start').value,step=+$('step').value,e=result||evaluate(start,step,rows,cols),counts=new Map();sequence.forEach(n=>counts.set(n,(counts.get(n)||0)+1));const root=$('keyboard');root.innerHTML='';for(let r=rows-1;r>=0;r--){const row=document.createElement('div');row.className='key-row';row.style.setProperty('--offset',OFFSETS[r]);for(let c=0;c<cols;c++){const pos=e.layout.cells[r*cols+c],key=document.createElement('div'),uses=counts.get(pos.note)||0;key.className='key'+(uses?' used':'')+(uses>Math.max(2,sequence.length*.08)?' hot':'');key.innerHTML=`<small>${KEYS[r*cols+c]||''}</small><strong>${noteName(pos.note)}</strong>`;key.title=`MIDI ${pos.note} · ${uses} attack${uses===1?'':'s'}`;row.append(key)}root.append(row)}$('coverage').textContent=sequence.length?Math.round((sequence.length-e.missing)/sequence.length*100)+'%':'—';$('travel').textContent=sequence.length?e.travel.toFixed(2):'—';$('startMetric').textContent=noteName(start);$('stepMetric').textContent=`+${step}`}
function setSequence(notes){sequence=notes;$('notes').value=notes.slice(0,300).join(' ');$('sequence').textContent=notes.length?notes.map(noteName).join(' · '):'No notes loaded.';render()}
$('file').onchange=async e=>{try{setSequence(parseMidi(await e.target.files[0].arrayBuffer()))}catch(err){alert(err.message)}};$('notes').oninput=()=>{sequence=parseText($('notes').value);$('sequence').textContent=sequence.length?sequence.map(noteName).join(' · '):'No notes loaded.';render()};$('solve').onclick=solve;['start','step','rows','cols'].forEach(id=>$(id).oninput=()=>render());render();
</script></body></html>
