<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
<title>Chordus — S A / T B</title>
<desc>The four voice tiles, soprano and alto over tenor and bass, with the letters knocked out.</desc>
<style>.s{fill:#ac345e}.a{fill:#855418}.t{fill:#086b7c}.b{fill:#64499b}@media(prefers-color-scheme:dark){:root:not([data-theme]) .s{fill:#f292b2}:root:not([data-theme]) .a{fill:#e9bc79}:root:not([data-theme]) .t{fill:#7ec7d6}:root:not([data-theme]) .b{fill:#b9a4eb}}:root[data-theme="dark"] .s{fill:#f292b2}:root[data-theme="dark"] .a{fill:#e9bc79}:root[data-theme="dark"] .t{fill:#7ec7d6}:root[data-theme="dark"] .b{fill:#b9a4eb}:root[data-theme="light"] .s{fill:#ac345e}:root[data-theme="light"] .a{fill:#855418}:root[data-theme="light"] .t{fill:#086b7c}:root[data-theme="light"] .b{fill:#64499b}</style>
<mask id="letters"><rect width="32" height="32" fill="#fff"/><text x="8" y="12.7" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="12.5" text-anchor="middle" fill="#000">S</text><text x="24" y="12.7" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="12.5" text-anchor="middle" fill="#000">A</text><text x="8" y="28.7" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="12.5" text-anchor="middle" fill="#000">T</text><text x="24" y="28.7" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="12.5" text-anchor="middle" fill="#000">B</text></mask>
<g mask="url(#letters)"><rect class="s" x="0.5" y="0.5" width="15" height="15" rx="3.2"/><rect class="a" x="16.5" y="0.5" width="15" height="15" rx="3.2"/><rect class="t" x="0.5" y="16.5" width="15" height="15" rx="3.2"/><rect class="b" x="16.5" y="16.5" width="15" height="15" rx="3.2"/></g>
</svg>
