<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Apps to Make Browser Tests</title>
  <link rel="stylesheet" href="../draft.css">
  <style>
    body { overflow:auto; }
    .app { min-height:100dvh; height:auto; }
    .topbar { position:sticky; top:0; z-index:2; }
    .topbar .summary { margin-left:auto; font:700 .82rem/1.4 "SFMono-Regular",monospace; }
    .suite { width:min(1100px,100%); margin:auto; padding:clamp(1rem,3vw,2rem); display:grid; gap:.65rem; }
    .controls { display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; }
    .progress { flex:1; min-width:180px; height:10px; overflow:hidden; border-radius:999px; background:var(--paper-deep); }
    .progress i { display:block; width:0; height:100%; background:var(--accent); transition:width 180ms ease; }
    .case { display:grid; grid-template-columns:3rem minmax(0,1fr) auto; gap:.75rem; align-items:start; padding:.8rem 1rem; border:1px solid var(--line); border-radius:13px; background:#fff9; }
    .case strong { font-family:"Draft Serif",serif; font-size:1.1rem; }
    .case .order { color:var(--muted); font:700 .75rem/1.8 monospace; }
    .case .status { border-radius:999px; padding:.25rem .55rem; background:var(--paper-deep); font-size:.72rem; }
    .case.pass .status { background:#d7eadc; color:#285f3e; }
    .case.fail { border-color:#bc563b; background:#fff1e9; }
    .case.fail .status { background:#bc563b; color:white; }
    .details { grid-column:2 / -1; margin:0; color:#8b2f20; white-space:pre-wrap; font:12px/1.45 "SFMono-Regular",monospace; }
    .test-frame { position:fixed; left:-20000px; top:0; width:960px; height:720px; border:0; }
    @media(max-width:600px) { .case { grid-template-columns:2.2rem minmax(0,1fr); } .case .status { grid-column:2; justify-self:start; } .details { grid-column:1 / -1; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Apps to Make Tests</h1>
      <span class="summary" id="summary">Waiting</span>
    </header>
    <section class="suite">
      <div class="controls panel">
        <button class="primary" id="run">Run all browser tests</button>
        <div class="progress" aria-label="Test progress"><i id="progress"></i></div>
        <span class="mono" id="assertions">0 assertions</span>
      </div>
      <div id="results" class="stack"></div>
    </section>
  </main>
  <script src="browser-cases.js"></script>
  <script src="browser-runner.js"></script>
</body>
</html>
