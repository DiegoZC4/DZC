<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Motion Strobe</title><link rel="stylesheet" href="draft.css"><style>
body{background:#111}.app{background:var(--paper)}.stage{position:relative;padding:0;overflow:hidden}.flash{position:absolute;inset:0;background:#f8f4e8;opacity:0;pointer-events:none}.scope{position:absolute;inset:0;width:100%;height:100%}.overlay{position:absolute;left:clamp(1rem,3vw,2rem);right:clamp(1rem,3vw,2rem);bottom:clamp(1rem,3vw,2rem);display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}.meter{padding:.75rem;background:#0e1819d9;color:#fff;border:1px solid #ffffff33;border-radius:12px;backdrop-filter:blur(8px)}.meter strong{display:block;font:1.4rem monospace}.warning{border:2px solid var(--accent-2);padding:.8rem;border-radius:12px;color:#8b2f20;background:#fff6}.stage.running .flash{will-change:opacity}@media(max-width:720px){.workspace{grid-template-rows:auto 65dvh}.overlay{grid-template-columns:1fr 1fr}.meter{padding:.5rem}}
</style></head><body><main class="app"><header class="topbar"><h1>Motion Strobe</h1><span class="kicker">accelerometer / jerk display</span></header><div class="workspace"><aside class="sidebar stack"><div class="warning"><strong>Photosensitivity warning.</strong> This tool deliberately flashes the screen. Do not use it if you or anyone nearby may be sensitive to flashing light.</div><div class="pillset" id="mode"><button class="active" data-mode="fixed">Fixed</button><button data-mode="accel">Accel</button><button data-mode="jerk">Jerk</button></div><label>Base frequency <span class="mono" id="freqLabel">6.0 Hz</span><input id="freq" type="range" min="1" max="20" step=".1" value="6"></label><label>Motion sensitivity<input id="sensitivity" type="range" min="0" max="4" step=".05" value="1"></label><label>Flash strength<input id="strength" type="range" min="0" max="100" value="80"></label><button class="primary" id="start">Enable motion + strobe</button><button id="zero">Zero baseline</button><p class="muted" id="permission">Motion access has not been requested.</p></aside><section class="stage" id="stage"><div class="flash" id="flash"></div><canvas class="scope" id="scope"></canvas><div class="overlay"><div class="meter">X<strong id="x">0.00</strong></div><div class="meter">Y<strong id="y">0.00</strong></div><div class="meter">Z<strong id="z">0.00</strong></div><div class="meter">Jerk<strong id="jerk">0.00</strong></div></div></section></div></main><script>
const $=id=>document.getElementById(id),canvas=$('scope'),ctx=canvas.getContext('2d');let mode='fixed',running=false,lastT=0,phase=0,lastMotionT=0,acc={x:0,y:0,z:0},base={x:0,y:0,z:0},jerk=0,history=[];
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}window.onresize=resize;resize();
function onMotion(e){const a=e.acceleration||e.accelerationIncludingGravity;if(!a)return;const now=performance.now(),dt=Math.max(.001,(now-lastMotionT)/1000),next={x:(a.x||0)-base.x,y:(a.y||0)-base.y,z:(a.z||0)-base.z};jerk=Math.hypot(next.x-acc.x,next.y-acc.y,next.z-acc.z)/dt;acc=next;lastMotionT=now;history.push({t:now,a:Math.hypot(acc.x,acc.y,acc.z),j:jerk});history=history.filter(p=>now-p.t<4000);['x','y','z'].forEach(k=>$(k).textContent=acc[k].toFixed(2));$('jerk').textContent=Math.min(999,jerk).toFixed(1)}
async function requestMotion(){try{if(typeof window.DeviceMotionEvent?.requestPermission==='function'){const result=await window.DeviceMotionEvent.requestPermission();if(result!=='granted')throw Error('Motion permission denied.')}window.addEventListener('devicemotion',onMotion);$('permission').textContent='Motion sensor connected.';return true}catch(err){$('permission').textContent=err.message;return false}}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight,now=performance.now();ctx.clearRect(0,0,w,h);ctx.fillStyle='#172b2e';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#ffffff12';ctx.lineWidth=1;for(let y=0;y<h;y+=h/8){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}if(history.length>1){for(const [key,color,max] of [['a','#6cd1ca',20],['j','#ef9a53',150]]){ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();history.forEach((p,i)=>{const x=w-(now-p.t)/4000*w,y=h*.62-Math.min(p[key],max)/max*h*.45;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}}requestAnimationFrame(draw)}draw();
function frame(t){if(!running)return;const dt=Math.min(.05,(t-lastT)/1000||0),motion=mode==='accel'?Math.hypot(acc.x,acc.y,acc.z):mode==='jerk'?Math.min(jerk/30,10):0,f=Math.max(.5,Math.min(30,+$('freq').value+motion*+$('sensitivity').value));phase=(phase+dt*f)%1;$('flash').style.opacity=phase<.5?(+$('strength').value/100):0;lastT=t;requestAnimationFrame(frame)}
$('mode').onclick=e=>{if(!e.target.dataset.mode)return;mode=e.target.dataset.mode;[...$('mode').children].forEach(b=>b.classList.toggle('active',b===e.target))};$('freq').oninput=()=>$('freqLabel').textContent=(+$('freq').value).toFixed(1)+' Hz';$('zero').onclick=()=>{base={x:acc.x+base.x,y:acc.y+base.y,z:acc.z+base.z}};$('start').onclick=async()=>{if(!running){await requestMotion();running=true;lastT=performance.now();$('stage').classList.add('running');$('start').textContent='Stop strobe';requestAnimationFrame(frame)}else{running=false;$('flash').style.opacity=0;$('stage').classList.remove('running');$('start').textContent='Enable motion + strobe'}};
</script></body></html>
