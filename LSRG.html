  <style>
    :root {
      --bg: #f4efe4;
      --panel: rgba(255, 252, 245, 0.92);
      --card: rgba(255, 255, 255, 0.52);
      --ink: #1f2933;
      --muted: #5f6c7b;
      --line: rgba(31, 41, 51, 0.12);
      --accent: #9f3a20;
      --accent-soft: rgba(159, 58, 32, 0.10);
      --shadow: 0 20px 60px rgba(73, 55, 28, 0.16);
      --tooltip-bg: rgba(31, 41, 51, 0.96);
      --tooltip-ink: #fff9ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(159, 58, 32, 0.16), transparent 34%),
        radial-gradient(circle at top right, rgba(51, 107, 135, 0.16), transparent 28%),
        linear-gradient(180deg, #f8f4eb 0%, var(--bg) 100%);
    }

    main {
      width: min(1680px, calc(100vw - 40px));
      margin: 28px auto 64px;
    }

    header {
      margin-bottom: 12px;
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 2.8vw, 2.6rem);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .calendar-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--ink);
      font: inherit;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .calendar-toggle:hover {
      background: rgba(255, 255, 255, 0.92);
    }

    .calendar-toggle svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    .hidden {
      display: none;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .calendar-shell {
      margin-top: 12px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .calendar-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.85fr);
      gap: 18px;
      align-items: start;
    }

    .calendar-month {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.52);
    }

    .calendar-month-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .calendar-month-header h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .month-nav {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .month-nav button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.74);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 3px;
    }

    .calendar-label {
      font-size: 0.7rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .calendar-spacer,
    .calendar-day {
      min-height: 21px;
    }

    .calendar-day {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .calendar-day.has-event {
      padding: 0;
      border: 0;
      background: none;
    }

    .calendar-day.has-event button {
      width: 100%;
      min-height: 21px;
      border: 1px solid rgba(159, 58, 32, 0.24);
      border-radius: 8px;
      background: rgba(159, 58, 32, 0.1);
      color: var(--accent);
      font: inherit;
      cursor: pointer;
      padding: 2px 0;
    }

    .calendar-day.has-event button:hover {
      background: rgba(159, 58, 32, 0.16);
    }

    .calendar-day.has-event button.selected {
      background: var(--accent);
      color: #fff9ee;
      border-color: var(--accent);
    }

    .calendar-detail {
      min-height: 220px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.6);
    }

    .calendar-detail h2 {
      margin: 0 0 6px;
      font-size: 1.15rem;
    }

    .calendar-detail .detail-date {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .reading-stack {
      display: grid;
      gap: 10px;
    }

    .reading-card {
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
    }

    .reading-card .slot-label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    table {
      width: 100%;
      min-width: 1320px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    col.title-col {
      width: 150px;
    }

    col.reading-col {
      width: calc((100% - 150px) / var(--reading-count, 5));
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 16px 18px;
      text-align: left;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(248, 244, 235, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    tbody td {
      padding: 14px 18px;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
      line-height: 1.45;
      overflow-wrap: break-word;
    }

    tbody tr:nth-child(even) {
      background: rgba(159, 58, 32, 0.028);
    }

    tbody tr:hover {
      background: var(--accent-soft);
    }

    td.reading:empty {
      background: rgba(31, 41, 51, 0.02);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .title-link {
      position: relative;
      display: inline-block;
    }

    .title-link::after {
      content: attr(data-posted-at);
      position: absolute;
      left: 0;
      bottom: calc(100% + 10px);
      padding: 7px 9px;
      border-radius: 10px;
      background: var(--tooltip-bg);
      color: var(--tooltip-ink);
      white-space: nowrap;
      font-size: 0.78rem;
      line-height: 1.2;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
      opacity: 0;
      transform: translateY(4px);
      pointer-events: none;
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .title-link:hover::after,
    .title-link:focus-visible::after {
      opacity: 1;
      transform: translateY(0);
    }

    .title-link:focus-visible {
      outline: 2px solid rgba(159, 58, 32, 0.4);
      outline-offset: 3px;
      border-radius: 4px;
    }

    @media (max-width: 900px) {
      main {
        width: min(calc(100vw - 20px), 1680px);
        margin-top: 18px;
      }

      .table-wrap {
        overflow: visible;
        border-radius: 18px;
        padding: 10px;
      }

      .calendar-shell {
        border-radius: 18px;
        padding: 10px;
      }

      header {
        border-radius: 18px;
      }

      .header-row {
        align-items: flex-start;
      }

      .calendar-toggle {
        flex-shrink: 0;
      }

      .calendar-layout {
        grid-template-columns: 1fr;
      }

      colgroup,
      thead {
        display: none;
      }

      table,
      tbody,
      tr,
      td {
        display: block;
        width: 100%;
      }

      table {
        min-width: 0;
      }

      tbody tr {
        margin: 0 0 12px;
        padding: 14px 14px 10px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
      }

      tbody tr:last-child {
        margin-bottom: 0;
      }

      tbody td {
        padding: 0;
        border: 0;
      }

      tbody td + td {
        margin-top: 10px;
      }

      td.title {
        font-size: 1.02rem;
        font-weight: 700;
      }

      td.reading:empty {
        display: none;
      }

      td.reading::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 3px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .title-link::after {
        left: auto;
        right: 0;
      }
    }
  </style>
</head>

        <aside id="calendar-detail" class="calendar-detail"></aside>
      </div>
    </section>
    <section class="table-wrap">
      <table aria-label="Lighthaven Sequences Reading Group backlog">
        <colgroup id="colgroup"></colgroup>
        <thead>
          <tr id="header-row"></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>

//www.lesswrong.com/posts/ZTRiSNmeGQK8AkdN2/mind-projection-fallacy"},{"slot":"R5","text":"Focus Your Uncertainty","href":"https://www.lesswrong.com/posts/GJ4ZQm7crTzTM6xDW/focus-your-uncertainty"}]},{"title":"Petrov Day Ceremony (TODAY)","titleHref":"https://www.lesswrong.com/events/dmmhqajiCrR3ysgqs/petrov-day-ceremony-today","postedAt":"2024-09-26T01:34","sessionDate":"","readings":[{"slot":"R1","text":"Petrov Day Organizer Guide","href":"http://petrovday.com/downloads/PetrovDay-OrganizerGuide.pdf"}]},{"title":"#4 (10/1/24)","titleHref":"https://www.lesswrong.com/events/xrvhiF4umCHBwWAkP/lighthaven-sequences-reading-group-4-tuesday-10-01","postedAt":"2024-09-24T22:48","sessionDate":"2024-10-01","readings":[{"slot":"R1","text":"Making Beliefs Pay Rent (in Anticipated Experiences)","href":"https://www.lesswrong.com/posts/a7n8GdKiAZRX86T5A/making-beliefs-pay-rent-in-anticipated-experiences"},{"slot":"R2","text":"Belief in Belief","href":"https://www.lesswrong.com/posts/CqyJzDZWvGhhFJ7dY/belief-in-belief"},{"slot":"R3","text":"Professing and Cheering","href":"https://www.lesswrong.com/posts/RmCjazjupRGcHSm5N/professing-and-cheering"},{"slot":"R4","text":"Belief as Attire","href":"https://www.lesswrong.com/posts/nYkMLFpx77Rz3uo9c/belief-as-attire"},{"slot":"R5","text":"Cached Thoughts","href":"https://www.lesswrong.com/posts/2MD3NMLBPCqPfnfre/cached-thoughts"}]},{"title":"#3 (9/24/24)","titleHref":"https://www.lesswrong.com/events/zgZxSFeikkzutET4R/lighthaven-sequences-reading-group-3-tuesday-09-24","postedAt":"2024-09-21T19:24","sessionDate":"2024-09-24","readings":[{"slot":"R1","text":"The Bottom Line","href":"https://www.lesswrong.com/posts/34XxbRFe54FycoCDw/the-bottom-line"},{"slot":"R2","text":"Rationalization","href":"https://www.lesswrong.com/posts/SFZoEBpLo9frSJGkc/rationalization"},{"slot":"R3","text":"You Can Face Reality","href":"https://www.lesswrong.com/posts/HYWhKXRsMAyvRKRYz/you-can-face-reality"},{"slot":"R4","text":"Is That Your True Rejection?","href":"https://www.lesswrong.com/posts/TGux5Fhcd7GmTfNGC/is-that-your-true-rejection"},{"slot":"R5","text":"Avoiding Your Belief's Real Weak Points","href":"https://www.lesswrong.com/posts/dHQkDNMhj692ayx78/avoiding-your-belief-s-real-weak-points"}]},{"title":"#2 (9/17/24)","titleHref":"https://www.lesswrong.com/events/kFnfQwpca9MNHwGp6/lighthaven-sequences-reading-group-2-tuesday-09-17","postedAt":"2024-09-08T14:23","sessionDate":"2024-09-17","readings":[{"slot":"R1","text":"The Meditation on Curiosity","href":"https://www.lesswrong.com/s/NBDFAKt3GbFwnwzQF/p/3nZMgRTfFEfHp34Gb"},{"slot":"R2","text":"The Importance of Saying \"Oops\"","href":"https://www.lesswrong.com/s/NBDFAKt3GbFwnwzQF/p/wCqfCLs8z5Qw4GbKS"},{"slot":"R3","text":"Tsuyoku Naritai","href":"https://www.lesswrong.com/posts/DoLQN5ryZ9XkZjq5h/tsuyoku-naritai-i-want-to-become-stronger"},{"slot":"R4","text":"The Martial Art of Rationality","href":"https://www.lesswrong.com/s/NBDFAKt3GbFwnwzQF/p/teaxCFgtmCQ3E9fy8"},{"slot":"R5","text":"Humans are not automatically strategic","href":"https://www.lesswrong.com/s/NBDFAKt3GbFwnwzQF/p/PBRWb2Em5SNeWYwwB"}]},{"title":"First","titleHref":"https://www.lesswrong.com/events/8rFdeSbRpqWAFnoev/first-lighthaven-sequences-reading-group","postedAt":"2024-08-27T21:56","sessionDate":"","readings":[{"slot":"R1","text":"The Lens That Sees Its Flaws","href":"https://www.lesswrong.com/s/NBDFAKt3GbFwnwzQF/p/46qnWRSR7L2eyNbMA"},{"slot":"R2","text":"Your Strength as a Rationalist","href":"https://www.lesswrong.com/s/NBDFAKt3GbFwnwzQF/p/5JDkW4MYXit2CquLs"},{"slot":"R3","text":"What do we mean by rationality?","href":"https://www.lesswrong.com/s/NBDFAKt3GbFwnwzQF/p/RcZCwxFiZzE6X7nsv"},{"slot":"R4","text":"Twelve Virtues of Rationality","href":"https://www.lesswrong.com/s/NBDFAKt3GbFwnwzQF/p/7ZqGiPHTpiDMwqMN2"},{"slot":"R5","text":"Use the Try Harder, Luke","href":"https://www.lesswrong.com/posts/fhEPnveFhb9tmd7Pe/use-the-try-harder-luke"}]}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("reading-group-data").textContent);
    const table = document.querySelector("table");
    const tableWrap = document.querySelector(".table-wrap");
    const colgroup = document.getElementById("colgroup");
    const headerRow = document.getElementById("header-row");
    const tbody = document.getElementById("rows");
    const calendarToggle = document.getElementById("calendar-toggle");
    const toggleIcon = document.getElementById("toggle-icon");
    const toggleLabel = document.getElementById("toggle-label");
    const calendarShell = document.getElementById("calendar-shell");
    const calendarMonths = document.getElementById("calendar-months");
    const calendarDetail = document.getElementById("calendar-detail");
    const monthTitle = document.getElementById("month-title");
    const monthPrev = document.getElementById("month-prev");
    const monthNext = document.getElementById("month-next");
    const STORAGE_KEYS = {
      view: "lsrg:view",
      month: "lsrg:month",
      date: "lsrg:selected-date",
    };
    const readingSlots = payload.slots;
    const datedRows = payload.rows.filter((row) => row.sessionDate);
    const monthKeys = [...new Set(datedRows.map((row) => row.sessionDate.slice(0, 7)))].sort();
    let selectedSessionDate = datedRows.length ? datedRows[0].sessionDate : "";
    let activeMonthIndex = monthKeys.length ? monthKeys.length - 1 : 0;

    try {
      const savedDate = localStorage.getItem(STORAGE_KEYS.date);
      if (savedDate && datedRows.some((row) => row.sessionDate === savedDate)) {
        selectedSessionDate = savedDate;
      }

      const savedMonth = localStorage.getItem(STORAGE_KEYS.month);
      if (savedMonth) {
        const savedIndex = monthKeys.indexOf(savedMonth);
        if (savedIndex !== -1) {
          activeMonthIndex = savedIndex;
        }
      } else if (selectedSessionDate) {
        const derivedMonth = selectedSessionDate.slice(0, 7);
        const derivedIndex = monthKeys.indexOf(derivedMonth);
        if (derivedIndex !== -1) {
          activeMonthIndex = derivedIndex;
        }
      }
    } catch (error) {
      // Ignore localStorage access errors.
    }

    table.style.setProperty("--reading-count", String(Math.max(readingSlots.length, 1)));

    const titleCol = document.createElement("col");
    titleCol.className = "title-col";
    colgroup.appendChild(titleCol);

    const titleHeader = document.createElement("th");
    titleHeader.textContent = "Title";
    headerRow.appendChild(titleHeader);

    for (const slot of readingSlots) {
      const col = document.createElement("col");
      col.className = "reading-col";
      colgroup.appendChild(col);

      const th = document.createElement("th");
      th.textContent = slot;
      headerRow.appendChild(th);
    }

    function makeLink(text, href, className, postedAt) {
      if (!href) {
        const span = document.createElement("span");
        span.textContent = text;
        if (className) span.className = className;
        return span;
      }
      const link = document.createElement("a");
      link.textContent = text;
      link.href = href;
      if (className) link.className = className;
      if (postedAt) {
        link.dataset.postedAt = "Posted " + postedAt.replace("T", " ");
        link.setAttribute("aria-label", text + ". Posted " + postedAt.replace("T", " "));
      }
      return link;
    }

    function renderReadingStack(container, row) {
      const stack = document.createElement("div");
      stack.className = "reading-stack";
      for (const reading of row.readings) {
        const card = document.createElement("div");
        card.className = "reading-card";
        const label = document.createElement("span");
        label.className = "slot-label";
        label.textContent = reading.slot;
        card.appendChild(label);
        card.appendChild(makeLink(reading.text, reading.href, "", ""));
        stack.appendChild(card);
      }
      container.appendChild(stack);
    }

    function renderCalendarDetail(row) {
      calendarDetail.innerHTML = "";
      if (!row) {
        const empty = document.createElement("p");
        empty.className = "detail-date";
        empty.textContent = "Select a highlighted date to inspect that week's readings.";
        calendarDetail.appendChild(empty);
        return;
      }

      const heading = document.createElement("h2");
      heading.appendChild(makeLink(row.title, row.titleHref, "", row.postedAt));
      calendarDetail.appendChild(heading);

      const meta = document.createElement("p");
      meta.className = "detail-date";
      meta.textContent = row.sessionDate;
      calendarDetail.appendChild(meta);

      renderReadingStack(calendarDetail, row);
    }

    function setToggleMode(showCalendar) {
      toggleLabel.textContent = showCalendar ? "Table" : "Calendar";
      toggleIcon.innerHTML = showCalendar
        ? '<rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18"></path><path d="M9 5v14"></path><path d="M15 5v14"></path>'
        : '<rect x="3" y="4.5" width="18" height="16.5" rx="2"></rect><path d="M8 3v4"></path><path d="M16 3v4"></path><path d="M3 9.5h18"></path>';
      try {
        localStorage.setItem(STORAGE_KEYS.view, showCalendar ? "calendar" : "table");
      } catch (error) {
        // Ignore localStorage access errors.
      }
    }

    function renderCalendar() {
      calendarMonths.innerHTML = "";
      const weekdayLabels = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const monthKey = monthKeys[activeMonthIndex];
      const monthRows = datedRows.filter((row) => row.sessionDate.startsWith(monthKey));
      const [yearText, monthText] = monthKey.split("-");
      const year = Number(yearText);
      const monthIndex = Number(monthText) - 1;
      const firstDay = new Date(year, monthIndex, 1);
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
      const rowByDate = new Map(monthRows.map((row) => [row.sessionDate, row]));
      try {
        localStorage.setItem(STORAGE_KEYS.month, monthKey);
      } catch (error) {
        // Ignore localStorage access errors.
      }
      monthTitle.textContent = firstDay.toLocaleDateString(undefined, { month: "long", year: "numeric" });
      monthPrev.disabled = activeMonthIndex === 0;
      monthNext.disabled = activeMonthIndex === monthKeys.length - 1;

      for (const label of weekdayLabels) {
        const el = document.createElement("div");
        el.className = "calendar-label";
        el.textContent = label;
        calendarMonths.appendChild(el);
      }

      for (let i = 0; i < firstDay.getDay(); i += 1) {
        const spacer = document.createElement("div");
        spacer.className = "calendar-spacer";
        calendarMonths.appendChild(spacer);
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        const iso = `${yearText}-${monthText}-${String(day).padStart(2, "0")}`;
        const row = rowByDate.get(iso);
        const cell = document.createElement("div");
        cell.className = row ? "calendar-day has-event" : "calendar-day";

        if (!row) {
          cell.textContent = String(day);
          calendarMonths.appendChild(cell);
          continue;
        }

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = String(day);
        if (row.sessionDate === selectedSessionDate) {
          button.classList.add("selected");
        }
        button.addEventListener("click", () => {
          selectedSessionDate = row.sessionDate;
          try {
            localStorage.setItem(STORAGE_KEYS.date, selectedSessionDate);
          } catch (error) {
            // Ignore localStorage access errors.
          }
          renderCalendar();
          renderCalendarDetail(row);
        });
        cell.appendChild(button);
        calendarMonths.appendChild(cell);
      }

      renderCalendarDetail(datedRows.find((row) => row.sessionDate === selectedSessionDate));
    }

    for (const row of payload.rows) {
      const tr = document.createElement("tr");

      const titleCell = document.createElement("td");
      titleCell.className = "title";
      titleCell.appendChild(makeLink(row.title, row.titleHref, "title-link", row.postedAt));
      tr.appendChild(titleCell);

      for (const slot of readingSlots) {
        const td = document.createElement("td");
        td.className = "reading";
        td.dataset.label = slot;
        const reading = row.readings.find((entry) => entry.slot === slot);
        if (reading) {
          td.appendChild(makeLink(reading.text, reading.href, "", ""));
        }
        tr.appendChild(td);
      }

      tbody.appendChild(tr);
    }

    renderCalendar();
    let initialCalendarOpen = false;
    try {
      initialCalendarOpen = localStorage.getItem(STORAGE_KEYS.view) === "calendar";
    } catch (error) {
      initialCalendarOpen = false;
    }
    calendarShell.classList.toggle("hidden", !initialCalendarOpen);
    tableWrap.classList.toggle("hidden", initialCalendarOpen);
    calendarToggle.setAttribute("aria-pressed", String(initialCalendarOpen));
    setToggleMode(initialCalendarOpen);

    monthPrev.addEventListener("click", () => {
      if (activeMonthIndex > 0) {
        activeMonthIndex -= 1;
        renderCalendar();
      }
    });

    monthNext.addEventListener("click", () => {
      if (activeMonthIndex < monthKeys.length - 1) {
        activeMonthIndex += 1;
        renderCalendar();
      }
    });

    calendarToggle.addEventListener("click", () => {
      const opening = calendarShell.classList.contains("hidden");
      calendarShell.classList.toggle("hidden", !opening);
      tableWrap.classList.toggle("hidden", opening);
      calendarToggle.setAttribute("aria-pressed", String(opening));
      setToggleMode(opening);
    });
  </script>
</body>
</html>
