<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Procedural Feline Walk</title><link rel="stylesheet" href="draft.css"><style>
.stage{display:grid;place-items:center;background:linear-gradient(#d9e4dc 0 68%,#b9a982 68%);overflow:hidden}.scene{width:min(96%,1100px);height:auto;filter:drop-shadow(0 18px 12px #26373533)}.cat-fill{fill:#202c2b}.cat-mid{fill:#405653}.cat-line{fill:none;stroke:#202c2b;stroke-width:24;stroke-linecap:round;stroke-linejoin:round}.far{stroke:#657775;stroke-width:20}.joint{fill:#d8a85e;stroke:#202c2b;stroke-width:4}.ground{stroke:#53695d;stroke-width:3}.paw{stroke-width:15}.readout{font:700 12px monospace;letter-spacing:.12em}.control{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.5rem}.control output{font-family:monospace}.play{width:100%}
</style></head><body><main class="app"><header class="topbar"><h1>Procedural Feline Walk</h1><span class="kicker">two-bone IK gait study</span></header><div class="workspace"><aside class="sidebar stack"><div class="pillset" id="gait"><button class="active" data-gait="walk">Walk</button><button data-gait="trot">Trot</button><button data-gait="pace">Pace</button></div><label class="control">Speed <output id="speedOut"></output><input id="speed" type="range" min="0" max="2.5" step=".05" value=".8"></label><label class="control">Stride <output id="strideOut"></output><input id="stride" type="range" min="30" max="170" value="105"></label><label class="control">Body height <output id="heightOut"></output><input id="height" type="range" min="175" max="270" value="220"></label><label class="control">Step lift <output id="liftOut"></output><input id="lift" type="range" min="5" max="90" value="48"></label><button class="primary play" id="play">Pause</button><button id="reset">Reset phase</button><p class="muted">Each foot follows a stance-and-swing trajectory. The knee is solved from the hip and paw targets every frame; the gait buttons only change phase relationships.</p></aside><section class="stage"><svg class="scene" viewBox="0 0 900 500" aria-label="Procedurally animated walking cat"><line class="ground" x1="20" y1="405" x2="880" y2="405"/><path id="tail" class="cat-line far"/><g id="farLegs"></g><g id="body"><ellipse class="cat-fill" cx="450" cy="220" rx="168" ry="74"/><path class="cat-fill" d="M590 202 Q650 178 684 208 L692 277 Q650 302 596 270Z"/><circle class="cat-fill" cx="675" cy="195" r="60"/><path class="cat-fill" d="M634 154L642 91 676 147M689 144L733 105 722 171Z"/><path d="M697 204q13 8 25 0" fill="none" stroke="#d8a85e" stroke-width="5" stroke-linecap="round"/><circle cx="659" cy="185" r="6" fill="#d8a85e"/><circle cx="699" cy="185" r="6" fill="#d8a85e"/></g><g id="nearLegs"></g><text class="readout" x="32" y="40" fill="#263735" id="readout"></text></svg></section></div></main><script>
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';let gait='walk',phase=0,last=performance.now(),playing=true;const offsets={walk:[0,.5,.75,.25],trot:[0,.5,.5,0],pace:[0,0,.5,.5]},hips=[{x:345,far:true,front:false},{x:390,far:false,front:false},{x:530,far:true,front:true},{x:575,far:false,front:true}],legs=[];
function svg(name,attrs={}){const e=document.createElementNS(NS,name);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}hips.forEach((hip,i)=>{const group=$(hip.far?'farLegs':'nearLegs'),upper=svg('line',{class:`cat-line${hip.far?' far':''}`}),lower=svg('line',{class:`cat-line${hip.far?' far':''}`}),paw=svg('line',{class:`cat-line paw${hip.far?' far':''}`}),joint=svg('circle',{class:'joint',r:7});group.append(upper,lower,paw,joint);legs.push({upper,lower,paw,joint,...hip,i})});
function ik(hx,hy,fx,fy,front){const l1=94,l2=98,dx=fx-hx,dy=fy-hy,d=Math.max(10,Math.min(l1+l2-1,Math.hypot(dx,dy))),base=Math.atan2(dy,dx),a=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d)))),bend=front?-1:1,angle=base+bend*a;return{x:hx+Math.cos(angle)*l1,y:hy+Math.sin(angle)*l1}}
function setLine(line,x1,y1,x2,y2){line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',x2);line.setAttribute('y2',y2)}
function render(){const speed=+$('speed').value,stride=+$('stride').value,bodyY=+$('height').value,lift=+$('lift').value,bob=Math.sin(phase*Math.PI*4)*Math.min(8,speed*3);$('body').setAttribute('transform',`translate(0 ${bodyY-220+bob})`);const stance=.64;
  legs.forEach(leg=>{const p=(phase+offsets[gait][leg.i])%1,baseX=leg.x+(leg.front?18:-18);let fx,fy;if(p<stance){const q=p/stance;fx=baseX+stride*(.5-q);fy=405}else{const q=(p-stance)/(1-stance);fx=baseX+stride*(-.5+q);fy=405-Math.sin(q*Math.PI)*lift}const hx=leg.x,hy=bodyY+42+bob,k=ik(hx,hy,fx,fy,leg.front);setLine(leg.upper,hx,hy,k.x,k.y);setLine(leg.lower,k.x,k.y,fx,fy-5);setLine(leg.paw,fx-10,fy-3,fx+13,fy-3);leg.joint.setAttribute('cx',k.x);leg.joint.setAttribute('cy',k.y)});
  const tailWave=Math.sin(phase*Math.PI*2)*24;$('tail').setAttribute('d',`M300 ${bodyY-8+bob} C215 ${bodyY-38+tailWave},155 ${bodyY-90-tailWave},94 ${bodyY-45}`);$('readout').textContent=`${gait.toUpperCase()} · ${speed.toFixed(2)} cycles/s`;
}
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(playing)phase=(phase+dt*+$('speed').value)%1;render();requestAnimationFrame(frame)}['speed','stride','height','lift'].forEach(id=>{const update=()=>{$(id+'Out').textContent=$(id).value;render()};$(id).oninput=update;update()});$('gait').onclick=e=>{if(!e.target.dataset.gait)return;gait=e.target.dataset.gait;[...$('gait').children].forEach(b=>b.classList.toggle('active',b===e.target));render()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Resume'};$('reset').onclick=()=>{phase=0;render()};requestAnimationFrame(frame);
</script></body></html>
