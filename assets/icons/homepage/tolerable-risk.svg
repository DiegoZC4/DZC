          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
  <style>
    svg{color:#8bc0ff}
    .mark-bg{fill:rgba(126,184,247,0.08);stroke:rgba(126,184,247,0.18);stroke-width:1.4}
    .mark-bg-square{vector-effect:non-scaling-stroke}
    .mark-art{transform-box:fill-box;transform-origin:center}
    .mark-line{fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
    .mark-fill{fill:currentColor;stroke:none}
    .mark-soft{fill:rgba(139,192,255,0.22);stroke:none}
    .risk-triangle{fill:#f5d64b}
    .risk-stem,.risk-eye-dot{fill:#111}
    .risk-edge-glow{fill:none;stroke:#ff2a1f;stroke-width:5.2;stroke-linejoin:round;opacity:0;filter:url(#risk-red-glow);transform-box:fill-box;transform-origin:center;pointer-events:none}
    svg:hover .risk-edge-glow{animation:risk-warning-glow 1.1s ease-in-out infinite alternate}
    @keyframes risk-warning-glow{
      from{opacity:.14;transform:scale(.99)}
      to{opacity:.88;transform:scale(1.035)}
    }
    @media (prefers-reduced-motion:reduce){
      svg:hover .risk-edge-glow{animation:none;opacity:.42}
    }
  </style>
            <defs>
              <filter id="risk-red-glow" x="-90%" y="-90%" width="280%" height="280%" color-interpolation-filters="sRGB">
                <feGaussianBlur stdDeviation="3.8" result="softGlow"/>
                <feColorMatrix in="softGlow" type="matrix" values="1 0 0 0 0.95  0 1 0 0 0.06  0 0 1 0 0.02  0 0 0 1 0"/>
              </filter>
            </defs>
            <rect class="mark-bg" x="9" y="9" width="54" height="54" rx="10"/>
            <path class="risk-edge-glow" d="M36 17Q37.8 17 38.8 18.8L56 50.2Q57 52 56 53.5Q55 55 53 55H19Q17 55 16 53.5Q15 52 16 50.2L33.2 18.8Q34.2 17 36 17Z"/>
            <path class="risk-triangle" d="M36 17Q37.8 17 38.8 18.8L56 50.2Q57 52 56 53.5Q55 55 53 55H19Q17 55 16 53.5Q15 52 16 50.2L33.2 18.8Q34.2 17 36 17Z" stroke="#111" stroke-width="3.2" stroke-linejoin="round"/>
            <path class="risk-stem" d="M32.85 29.95Q36 28.7 39.15 29.95Q38.85 35.85 37.15 42.05Q36 43.15 34.85 42.05Q33.15 35.85 32.85 29.95Z"/>
            <circle class="risk-eye-dot" cx="36" cy="49" r="2.45"/>
          </svg>
