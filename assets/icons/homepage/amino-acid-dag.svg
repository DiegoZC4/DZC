<svg class="amino-dag-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
  <style>
    .amino-dag-icon{--amino-cycle:9s;color:#171512}
    .amino-box{fill:#fffdf8;stroke:#d7cec0;stroke-width:1.2;vector-effect:non-scaling-stroke}
    .amino-viewport,.amino-sprite{animation-duration:var(--amino-cycle);animation-iteration-count:infinite;animation-direction:alternate;animation-timing-function:linear;animation-fill-mode:both;animation-play-state:paused}
    .amino-viewport{animation-name:amino-zoom;transform-origin:0 0}
    .amino-sprite{opacity:0}
    .sprite-g{animation-name:amino-glycine}
    .sprite-a{animation-name:amino-alanine}
    .sprite-f{animation-name:amino-phenylalanine}
    .sprite-y{animation-name:amino-tyrosine}
    .amino-dag-icon:hover .amino-viewport,
    .amino-dag-icon:hover .amino-sprite,
    .showcase-link:hover .amino-dag-icon .amino-viewport,
    .showcase-link:hover .amino-dag-icon .amino-sprite,
    .showcase-link:focus-visible .amino-dag-icon .amino-viewport,
    .showcase-link:focus-visible .amino-dag-icon .amino-sprite{animation-play-state:running}
    .mol2d .bond{stroke:#171512;stroke-width:2;stroke-linecap:round}
    .mol2d .double{stroke-width:2}
    .mol2d .atom{stroke:none}
    .atom-c{fill:#444}
    .atom-o{fill:#e53935}
    .atom-n{fill:#315cff}
    @keyframes amino-zoom{
      0%,21%{transform:translate(13.7px,15.4px) scale(.58)}
      29%,43%{transform:translate(12.6px,17.5px) scale(.52)}
      51%,67%{transform:translate(10.8px,23.2px) scale(.36)}
      75%,100%{transform:translate(10.4px,25px) scale(.31)}
    }
    @keyframes amino-glycine{
      0%,21%{opacity:1}
      29%,100%{opacity:0}
    }
    @keyframes amino-alanine{
      0%,21%{opacity:0}
      29%,43%{opacity:1}
      51%,100%{opacity:0}
    }
    @keyframes amino-phenylalanine{
      0%,43%{opacity:0}
      51%,67%{opacity:1}
      75%,100%{opacity:0}
    }
    @keyframes amino-tyrosine{
      0%,67%{opacity:0}
      75%,100%{opacity:1}
    }
    @media (prefers-reduced-motion:reduce){
      .amino-viewport,.amino-sprite{animation:none}
      .amino-viewport{transform:translate(10.4px,25px) scale(.31)}
      .sprite-y{opacity:1}
    }
  </style>
  <rect class="amino-box" x="9" y="9" width="54" height="54" rx="10"/>
  <g class="amino-viewport">
    <g class="amino-sprite sprite-g mol2d">
