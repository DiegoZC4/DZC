<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Circle</title><link rel="stylesheet" href="draft.css"><style>
.stage{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:1rem}.map{position:relative;min-height:320px;border-radius:18px;overflow:hidden;background:#dce5d7;box-shadow:var(--shadow)}canvas{width:100%;height:100%;display:block}.map::after{content:"LOCAL-ONLY TRACK";position:absolute;right:12px;top:12px;font:700 10px monospace;letter-spacing:.12em;color:#26433d99}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}.stats div{border-top:3px solid var(--accent);padding:.55rem}.stats strong{display:block;font:1.5rem "Draft Serif",serif}.sessions{display:grid;gap:.4rem;max-height:260px;overflow:auto}.session{display:grid;grid-template-columns:1fr auto;gap:.5rem;padding:.65rem;border:1px solid var(--line);border-radius:10px;background:#fff8}.live{color:var(--accent-2);font-weight:700}.privacy{padding:.75rem;border:1px solid var(--accent);border-radius:12px;background:#e8f2ef}.file-label{border:1px solid var(--ink);border-radius:999px;padding:.58rem .9rem;cursor:pointer;text-align:center}.file-label input{display:none}
</style></head><body><main class="app"><header class="topbar"><h1>Local Circle</h1><span class="kicker">free location history prototype</span></header><div class="workspace"><aside class="sidebar stack"><label>Profile name<input id="name" value="Diego"></label><button class="primary" id="record">Start recording</button><div class="privacy">No server is involved. Tracks stay in IndexedDB until you export or delete them.</div><div class="eyebrow">Saved tracks</div><div class="sessions" id="sessions"></div><div class="row"><button id="export">Export GeoJSON</button><label class="file-label">Import<input id="import" type="file" accept=".json,.geojson,application/geo+json"></label></div><button class="danger" id="delete">Delete selected</button><p class="muted" id="status">Ready. Geolocation requires HTTPS or localhost.</p></aside><section class="stage"><div class="map"><canvas id="map"></canvas></div><div class="stats panel"><div><span class="eyebrow">Duration</span><strong id="duration">0:00</strong></div><div><span class="eyebrow">Distance</span><strong id="distance">0 m</strong></div><div><span class="eyebrow">Points</span><strong id="points">0</strong></div></div></section></div></main><script>
const DB='appsToMake.locationHistory.v1',STORE='tracks',$=id=>document.getElementById(id),canvas=$('map'),ctx=canvas.getContext('2d');let db,watch=null,current=null,tracks=[],selected=null,timer=null;
function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=()=>{db=req.result;resolve()};req.onerror=()=>reject(req.error)})}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}function loadAll(){return new Promise((resolve,reject)=>{const r=tx().getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function put(track){return new Promise((resolve,reject)=>{const r=tx('readwrite').put(track);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}function remove(id){return new Promise((resolve,reject)=>{const r=tx('readwrite').delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function hav(a,b){const R=6371000,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=p2-p1,dl=(b.lon-a.lon)*Math.PI/180,s=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(s))}function metrics(track){let d=0;for(let i=1;i<track.points.length;i++)d+=hav(track.points[i-1],track.points[i]);return{distance:d,duration:Math.max(0,(track.points.at(-1)?.t||track.started)-track.started)}}function fmtDuration(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return`${m}:${String(s%60).padStart(2,'0')}`}function fmtDistance(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(2)+' km'}
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}window.onresize=resize;
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#dce5d7';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#afc3b5';for(let x=0;x<w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}const track=current||(tracks.find(t=>t.id===selected));if(!track?.points.length)return;const xs=track.points.map(p=>p.lon),ys=track.points.map(p=>p.lat),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),pad=36,s=Math.min((w-pad*2)/(maxX-minX||.0001),(h-pad*2)/(maxY-minY||.0001)),xy=p=>[w/2+(p.lon-(minX+maxX)/2)*s,h/2-(p.lat-(minY+maxY)/2)*s];ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#006f78';ctx.lineWidth=5;ctx.beginPath();track.points.forEach((p,i)=>{const [x,y]=xy(p);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();const [x,y]=xy(track.points.at(-1));ctx.fillStyle='#d25532';ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill()}
function render(){const track=current||(tracks.find(t=>t.id===selected)),m=track?metrics(track):{duration:0,distance:0};$('duration').textContent=fmtDuration(m.duration);$('distance').textContent=fmtDistance(m.distance);$('points').textContent=track?.points.length||0;$('sessions').innerHTML=tracks.slice().sort((a,b)=>b.started-a.started).map(t=>{const x=metrics(t);return`<button class="session${t.id===selected?' primary':''}" data-id="${t.id}"><span>${escapeHtml(t.name)} · ${new Date(t.started).toLocaleString()}</span><span>${fmtDistance(x.distance)}</span></button>`}).join('')||'<div class="empty">No saved tracks</div>';draw()}
function escapeHtml(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}
function start(){if(!navigator.geolocation)return $('status').textContent='Geolocation is unavailable.';current={id:crypto.randomUUID(),name:$('name').value.trim()||'Unnamed',started:Date.now(),points:[]};$('record').textContent='Stop + save';$('status').innerHTML='<span class="live">Recording…</span>';watch=navigator.geolocation.watchPosition(pos=>{current.points.push({lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy,altitude:pos.coords.altitude,t:pos.timestamp});render()},err=>$('status').textContent=err.message,{enableHighAccuracy:true,maximumAge:1000,timeout:20000});timer=setInterval(render,1000)}async function stop(){navigator.geolocation.clearWatch(watch);clearInterval(timer);watch=null;if(current.points.length){await put(current);tracks.push(current);selected=current.id}$('status').textContent=current.points.length?'Track saved locally.':'No location points were captured.';current=null;$('record').textContent='Start recording';render()}
$('record').onclick=()=>watch===null?start():stop();$('sessions').onclick=e=>{const id=e.target.closest('[data-id]')?.dataset.id;if(id){selected=id;render()}};$('delete').onclick=async()=>{if(!selected||!confirm('Delete the selected track?'))return;await remove(selected);tracks=tracks.filter(t=>t.id!==selected);selected=tracks[0]?.id||null;render()};$('export').onclick=()=>{const chosen=selected?tracks.filter(t=>t.id===selected):tracks,geo={type:'FeatureCollection',features:chosen.map(t=>({type:'Feature',properties:{id:t.id,name:t.name,started:new Date(t.started).toISOString(),timestamps:t.points.map(p=>new Date(p.t).toISOString()),accuracy:t.points.map(p=>p.accuracy)},geometry:{type:'LineString',coordinates:t.points.map(p=>[p.lon,p.lat,p.altitude].filter(v=>v!=null))}}))},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(geo,null,2)],{type:'application/geo+json'}));a.download='location-history.geojson';a.click();URL.revokeObjectURL(a.href)};
$('import').onchange=async e=>{try{const geo=JSON.parse(await e.target.files[0].text());for(const f of geo.features||[]){if(f.geometry?.type!=='LineString')continue;const timestamps=f.properties?.timestamps||[],track={id:crypto.randomUUID(),name:f.properties?.name||'Imported',started:Date.parse(f.properties?.started)||Date.now(),points:f.geometry.coordinates.map((c,i)=>({lon:c[0],lat:c[1],altitude:c[2]??null,t:Date.parse(timestamps[i])||Date.now()}))};await put(track);tracks.push(track)}render()}catch(err){$('status').textContent='Import failed: '+err.message}};
openDb().then(loadAll).then(found=>{tracks=found;selected=tracks[0]?.id||null;resize();render()}).catch(err=>$('status').textContent='Storage error: '+err.message);
</script></body></html>
