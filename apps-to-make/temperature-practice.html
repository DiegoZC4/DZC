<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temperature Reflex</title><link rel="stylesheet" href="draft.css"><style>
.stage{display:grid;place-items:center}.card{width:min(760px,100%);display:grid;gap:1.2rem;text-align:center}.temperature{font:500 clamp(5rem,18vw,13rem)/.9 "Draft Serif",serif}.answer-row{display:flex;justify-content:center;align-items:center;gap:.7rem}.answer-row input{width:180px;text-align:center;font:2.5rem monospace}.answer-row span{font-size:2.4rem}.feedback{min-height:4rem;font-size:1.2rem}.shortcut{padding:1rem;background:#172b2e;color:#f4efe3;border-radius:14px;font:1.2rem monospace}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}.score strong{display:block;font:2.2rem "Draft Serif",serif}.thermometer{height:220px;width:42px;border:3px solid var(--ink);border-radius:24px;position:relative;margin:auto;background:#fff8}.mercury{position:absolute;left:7px;right:7px;bottom:7px;border-radius:14px;background:linear-gradient(#ef9a53,#d25532);height:50%}
</style></head><body><main class="app"><header class="topbar"><h1>Temperature Reflex</h1><span class="kicker">Celsius ↔ Fahrenheit practice</span></header><div class="workspace"><aside class="sidebar stack"><div class="pillset" id="direction"><button class="active" data-dir="cf">C → F</button><button data-dir="fc">F → C</button></div><div class="split"><label>Minimum<input id="min" type="number" value="-30"></label><label>Maximum<input id="max" type="number" value="45"></label></div><label><span><input id="integers" type="checkbox" style="width:auto" checked> Integer prompts</span></label><div class="thermometer"><i class="mercury" id="mercury"></i></div><div class="score"><div><span class="eyebrow">Right</span><strong id="right">0</strong></div><div><span class="eyebrow">Streak</span><strong id="streak">0</strong></div><div><span class="eyebrow">Mean error</span><strong id="error">—</strong></div></div></aside><section class="stage"><div class="card panel"><div class="temperature" id="prompt"></div><div class="answer-row"><input id="answer" type="number" step=".1" inputmode="decimal"><span id="unit"></span></div><div class="row" style="justify-content:center"><button class="primary" id="check">Check</button><button id="hint">Hint</button><button id="next">Skip</button></div><div class="feedback" id="feedback"></div><div class="shortcut" id="shortcut">F = 2C + 32 − 2C/10</div></div></section></div></main><script>
const $=id=>document.getElementById(id),KEY='appsToMake.temperaturePractice.v1';let dir='cf',value=0,stats={right:0,streak:0,errors:[]};try{stats={...stats,...JSON.parse(localStorage.getItem(KEY))}}catch{}
function convert(x){return dir==='cf'?x*1.8+32:(x-32)/1.8}function fmt(x){return Number.isInteger(x)?String(x):x.toFixed(1)}function newQuestion(){const lo=Math.min(+$('min').value,+$('max').value),hi=Math.max(+$('min').value,+$('max').value),raw=lo+Math.random()*(hi-lo);value=$('integers').checked?Math.round(raw):Math.round(raw*10)/10;$('prompt').textContent=fmt(value)+(dir==='cf'?'°C':'°F');$('unit').textContent=dir==='cf'?'°F':'°C';$('answer').value='';$('feedback').textContent='';$('shortcut').textContent=dir==='cf'?'F = 2C + 32 − 2C/10':'C = (F − 32) ÷ 2 + (F − 32)/18';const pct=(value-lo)/(hi-lo||1);$('mercury').style.height=(8+Math.max(0,Math.min(1,pct))*88)+'%';$('answer').focus()}
function renderStats(){$('right').textContent=stats.right;$('streak').textContent=stats.streak;$('error').textContent=stats.errors.length?(stats.errors.reduce((a,b)=>a+b)/stats.errors.length).toFixed(1)+'°':'—'}function check(){if($('answer').value==='')return;const actual=+$('answer').value,expected=convert(value),error=Math.abs(actual-expected),ok=error<=.55;stats.errors.push(error);stats.errors=stats.errors.slice(-50);if(ok){stats.right++;stats.streak++;$('feedback').textContent=`Correct. ${fmt(value)}${dir==='cf'?'°C':'°F'} = ${fmt(expected)}${dir==='cf'?'°F':'°C'}.`}else{stats.streak=0;$('feedback').textContent=`Off by ${error.toFixed(1)}°. Exact answer: ${fmt(expected)}${dir==='cf'?'°F':'°C'}.`}localStorage.setItem(KEY,JSON.stringify(stats));renderStats()}
$('direction').onclick=e=>{if(!e.target.dataset.dir)return;dir=e.target.dataset.dir;[...$('direction').children].forEach(b=>b.classList.toggle('active',b===e.target));newQuestion()};$('check').onclick=check;$('hint').onclick=()=>{$('feedback').textContent=dir==='cf'?`Double ${fmt(value)}, add 32, then subtract one tenth of the doubled value.`:`Subtract 32, halve that result, then add one ninth of the result.`};$('next').onclick=newQuestion;$('answer').onkeydown=e=>{if(e.key==='Enter')check()};renderStats();newQuestion();
</script></body></html>
