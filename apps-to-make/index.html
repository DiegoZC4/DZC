<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apps to Make Workbench</title><link rel="stylesheet" href="draft.css"><style>
body{background:#172b2e}.app{background:var(--paper)}.workspace{grid-template-columns:minmax(330px,430px) minmax(0,1fr)}.sidebar{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:.8rem}.summary{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.summary div{padding:.6rem;border-top:3px solid var(--accent);background:#fff8}.summary strong{display:block;font:2rem "Draft Serif",serif}.list{min-height:0;overflow:auto;display:grid;gap:.35rem;align-content:start;padding-right:.2rem}.item{display:grid;grid-template-columns:2.3rem 1fr auto;gap:.55rem;align-items:center;text-align:left;border-radius:11px;padding:.55rem;background:#fff5}.item.active{background:var(--ink);color:var(--paper)}.item:hover{transform:none}.number{font:700 .75rem monospace;color:var(--muted)}.item.active .number{color:#fff8}.badge{padding:.18rem .42rem;border-radius:999px;font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;background:#d9e9e4;color:#24564f}.badge.existing{background:#e3ddcf;color:#665e4f}.test-link{text-decoration:none;white-space:nowrap}.stage{padding:0;overflow:hidden;position:relative}.preview{width:100%;height:100%;border:0;background:white}.detail{height:100%;overflow:auto;padding:clamp(1.2rem,4vw,3rem);display:grid;align-content:center}.detail-card{max-width:780px;margin:auto}.detail h2{font:500 clamp(2rem,5vw,4.5rem)/1 "Draft Serif",serif;margin:.4rem 0 1rem}.paths{display:grid;gap:.4rem}.path{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center;padding:.6rem;border:1px solid var(--line);border-radius:9px;background:#fff8;word-break:break-all;font:12px monospace}.path button{padding:.3rem .55rem}.open-new{position:absolute;right:14px;top:14px;z-index:3;background:#172b2e;color:white;border-color:white}.loading{display:grid;place-items:center;height:100%;color:var(--muted)}@media(max-width:850px){body{overflow:auto}.app{height:auto}.workspace{grid-template-columns:1fr;grid-template-rows:minmax(70dvh,auto) 75dvh}.sidebar{min-height:70dvh}.stage{min-height:75dvh}}
</style></head><body><main class="app"><header class="topbar"><h1>Apps to Make Workbench</h1><span class="kicker">audited in Brain Tree order</span><a class="button test-link" href="tests/browser-tests.html">Run tests</a></header><div class="workspace"><aside class="sidebar"><div class="summary"><div><span class="eyebrow">Already started</span><strong id="existingCount">—</strong></div><div><span class="eyebrow">New drafts</span><strong id="draftCount">—</strong></div></div><div class="stack"><input id="query" placeholder="Filter ideas"><div class="pillset" id="filters"><button class="active" data-filter="all">All</button><button data-filter="existing">Existing</button><button data-filter="drafted">Drafted</button></div></div><div class="list" id="list"></div></aside><section class="stage" id="stage"><div class="loading">Loading status ledger…</div></section></div></main><script>
const $=id=>document.getElementById(id);let items=[],selected=null,filter='all';async function load(){const response=await fetch('status.json',{cache:'no-store'});if(!response.ok)throw Error(`status.json: ${response.status}`);items=await response.json();$('existingCount').textContent=items.filter(x=>x.status==='existing').length;$('draftCount').textContent=items.filter(x=>x.status==='drafted').length;selected=items[0];renderList();renderDetail()}
function visible(){const q=$('query').value.toLowerCase();return items.filter(x=>(filter==='all'||x.status===filter)&&(!q||`${x.idea} ${x.reason} ${x.paths.join(' ')}`.toLowerCase().includes(q)))}function renderList(){$('list').replaceChildren(...visible().map(item=>{const b=document.createElement('button');b.className='item'+(selected?.order===item.order?' active':'');b.innerHTML=`<span class="number">${String(item.order).padStart(2,'0')}</span><span>${escapeHtml(item.idea)}</span><span class="badge ${item.status}">${item.status==='drafted'?'new draft':'existing'}</span>`;b.onclick=()=>{selected=item;renderList();renderDetail()};return b}))}
function renderDetail(){if(!selected)return;const stage=$('stage');stage.innerHTML='';if(selected.preview){const frame=document.createElement('iframe');frame.className='preview';frame.src=selected.preview;frame.title=selected.idea;const open=document.createElement('button');open.className='open-new';open.textContent='Open alone ↗';open.onclick=()=>window.open(selected.preview,'apps-to-make-preview');stage.append(frame,open);return}const detail=document.createElement('div');detail.className='detail';detail.innerHTML=`<article class="detail-card stack"><div><span class="badge ${selected.status}">${selected.status==='drafted'?'new draft':'existing locally'}</span><h2>${escapeHtml(selected.idea)}</h2><p>${escapeHtml(selected.reason)}</p></div><div class="paths">${selected.paths.map(p=>`<div class="path"><span>${escapeHtml(absolutePath(p))}</span><button data-copy="${escapeHtml(absolutePath(p))}">Copy</button></div>`).join('')}</div>${instructions(selected)}</article>`;detail.onclick=e=>{const p=e.target.dataset.copy;if(p)navigator.clipboard.writeText(p).then(()=>{e.target.textContent='Copied';setTimeout(()=>e.target.textContent='Copy',900)})};stage.append(detail)}
function instructions(item){if(item.order===2)return'<div class="panel mono">python3 apps-to-make/reading-question-cli/reading_questions.py --count 10</div>';if(item.order===25)return'<div class="panel">Install by copying the plugin folder into <span class="mono">Brain Tree/.obsidian/plugins/spaced-omission/</span>, then enable it in Obsidian community-plugin settings.</div>';return''}function absolutePath(p){return p.startsWith('/')?p:`/Users/diego/Desktop/Ego/public_html/${p}`}function escapeHtml(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}
$('query').oninput=renderList;$('filters').onclick=e=>{if(!e.target.dataset.filter)return;filter=e.target.dataset.filter;[...$('filters').children].forEach(b=>b.classList.toggle('active',b===e.target));renderList();const v=visible();if(v.length&&!v.includes(selected)){selected=v[0];renderList();renderDetail()}};load().catch(err=>$('stage').innerHTML=`<div class="loading">Could not load status ledger: ${escapeHtml(err.message)}. Serve this folder over HTTP rather than opening it as a file.</div>`);
</script></body></html>
