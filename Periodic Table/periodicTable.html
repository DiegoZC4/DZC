<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Periodic Table Etymologies</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚛︎</text></svg>">
  <style>
    :root {
      --bg: #f5f0e7;
      --panel: rgba(255, 251, 245, 0.92);
      --panel-strong: #fffdf8;
      --ink: #191713;
      --muted: #6d655c;
      --line: #d9cbb8;
      --accent: #8b5e34;
      --accent-soft: #efe0ca;
      --shadow: 0 16px 40px rgba(48, 33, 20, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.75), transparent 28%),
        linear-gradient(180deg, #f9f4ec 0%, #efe5d7 100%);
    }

    .shell {
      width: min(1880px, calc(100vw - 24px));
      margin: 18px auto 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.05;
    }

    .title-wrap p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-button {
      border: 1px solid var(--line);
      background: #f8efe3;
      color: var(--ink);
      border-radius: 999px;
      padding: 9px 14px;
      font: inherit;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    }

    .tab-button[aria-selected="true"] {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .view {
      display: none;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .view.active {
      display: block;
    }

    .layout-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 520px;
      min-height: 760px;
    }

    .table-pane {
      padding: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.12));
      overflow: auto;
    }

    .detail-pane {
      border-left: 1px solid var(--line);
      background: rgba(247, 240, 230, 0.9);
      padding: 20px 18px;
    }

    .detail-pane h2 {
      margin: 0 0 10px;
      font-size: 1.15rem;
    }

    .detail-pane p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.45;
    }

    .meta-kicker {
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    #periodicCanvas {
      width: 100%;
      height: auto;
      display: block;
    }

    .cell-button {
      cursor: pointer;
    }

    .cell-button.selected .selection-ring {
      opacity: 1;
    }

    .selection-ring {
      pointer-events: none;
    }

    .cell-button:focus {
      outline: none;
    }

    .list-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.45);
    }

    .search-wrap {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      width: 100%;
    }

    .search-wrap input {
      flex: 1 1 360px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 12px 16px;
      font: inherit;
      background: var(--panel-strong);
      color: var(--ink);
    }

    .summary {
      color: var(--muted);
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(520px, 1fr));
      gap: 16px;
      padding: 18px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel-strong);
      padding: 16px;
    }

    .card h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    .card .sub {
      margin: 6px 0 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .trace-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.58);
    }

    .trace-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .trace-table th,
    .trace-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      width: 20%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .trace-table th {
      background: rgba(239, 224, 202, 0.65);
      font-size: 0.75rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .trace-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .trace-table td.empty-cell {
      color: #9a9085;
    }

    .empty {
      padding: 30px 18px 36px;
      text-align: center;
      color: var(--muted);
    }

    .cost-view {
      padding: 18px;
    }

    .cost-intro {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.45;
    }

    .cost-toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .sort-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .sort-label {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .sort-button {
      border: 1px solid var(--line);
      background: #f8efe3;
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }

    .sort-button[aria-pressed="true"] {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .direction-button {
      min-width: 112px;
    }

    .cost-highlight-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }

    .cost-highlight-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel-strong);
      padding: 16px;
    }

    .cost-highlight-card h3 {
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .rank-list {
      margin: 0;
      padding-left: 20px;
      line-height: 1.5;
    }

    .rank-list a {
      color: inherit;
    }

    .data-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.58);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.94rem;
      line-height: 1.35;
    }

    .data-table th,
    .data-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }

    .data-table th {
      background: rgba(239, 224, 202, 0.65);
      font-size: 0.77rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .data-table td.wrap {
      white-space: normal;
    }

    .data-table tbody tr:last-child td {
      border-bottom: 0;
    }

    @media (max-width: 980px) {
      .layout-grid {
        grid-template-columns: 1fr;
      }

      .detail-pane {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="title-wrap">
        <h1>Periodic Table Etymologies</h1>
        <p>Browse the image-based Mendeleev layout or read the structured etymology lines.</p>
      </div>
      <nav class="tabs" aria-label="Views">
        <button class="tab-button" type="button" data-view="layout" aria-selected="true">Mendeleev Layout</button>
        <button class="tab-button" type="button" data-view="list" aria-selected="false">Etymology List</button>
        <button class="tab-button" type="button" data-view="cost" aria-selected="false">Cost per Gram</button>
      </nav>
    </header>

    <section id="layoutView" class="view active">
      <div class="layout-grid">
        <div class="table-pane">
          <svg id="periodicCanvas" viewBox="0 0 18.3 9.3" fill="none" stroke="black" stroke-width="0.05"></svg>
        </div>
        <aside class="detail-pane">
          <div class="meta-kicker">Selected Entry</div>
          <div id="detailPane"></div>
        </aside>
      </div>
    </section>

    <section id="listView" class="view">
      <div class="list-controls">
        <div class="search-wrap">
          <input id="searchInput" type="search" placeholder="Search by name, symbol, meaning, language, or root">
          <div id="resultSummary" class="summary"></div>
        </div>
      </div>
      <div id="listGrid" class="list-grid"></div>
      <div id="emptyState" class="empty" hidden>No matching etymology entries.</div>
    </section>

    <section id="costView" class="view">
      <div class="cost-view">
        <div class="cost-toolbar">
          <p id="costSummary" class="cost-intro"></p>
          <div class="sort-controls" aria-label="Cost sort controls">
            <span class="sort-label">Sort by</span>
            <button id="sortByGram" class="sort-button" type="button" aria-pressed="true">USD/g</button>
            <button id="sortByVolume" class="sort-button" type="button" aria-pressed="false">USD/cm^3</button>
            <button id="sortDirection" class="sort-button direction-button" type="button" aria-pressed="false">Increasing</button>
          </div>
        </div>
        <div id="costHighlightGrid" class="cost-highlight-grid"></div>
        <div class="data-table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Z</th>
                <th>Symbol</th>
                <th>Element</th>
                <th>USD/g</th>
                <th>Cumsum USD/g</th>
                <th>USD/cm^3</th>
                <th>Cumsum USD/cm^3</th>
                <th>Status</th>
                <th>Reason</th>
                <th>Purity</th>
                <th>Offer</th>
                <th>Density</th>
              </tr>
            </thead>
            <tbody id="costTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

ng": "color", "notes": "Derived <- Ancient Greek khroma"}, {"language": "Unspecified", "word": "The deeper pre-Greek / Indo-European history of khroma is uncertain", "roots": "", "meaning": "", "notes": ""}]}, "25": {"number": 25, "symbol": "Mn", "name": "Manganese", "meaning": "Magnesia", "origin_word": "Μαγνησία ( Magnesia ; Medieval Latin: magnesia )", "origin_language": "Greek via Latin, Italian , and French", "origin_type": "descriptive, toponym", "summary": "From Latin Magnesia , ultimately from Ancient Greek region Magnesia . The word Magnesia evolved into manganese in Italian and into manganèse in French.", "etymology_lines": [{"language": "Greek via Latin, Italian , and French", "word": "Μαγνησία ( Magnesia ; Medieval Latin: magnesia )", "roots": "", "meaning": "Magnesia (regional unit) \", Greece", "notes": "descriptive, toponym"}, {"language": "French", "word": "manganese / New Latin manganese", "roots": "", "meaning": "", "notes": "Derived <- Magnesia, a region in Greece"}, {"language": "Unspecified", "word": "The name first attached to minerals from Magnesia before narrowing to the element", "roots": "", "meaning": "", "notes": ""}]}, "26": {"number": 26, "symbol": "Fe", "name": "Iron", "meaning": "traditional Germanic name", "origin_word": "īsern (earlier: īren/īsen ) /yren/yron", "origin_language": "Old English via Middle English", "origin_type": "descriptive", "summary": "From the Anglo-Saxon īsern which is derived from Proto-Germanic isarnan meaning \"holy metal\" or \"strong metal\". · Symbol Fe is from Latin ferrum , meaning \"iron\".", "etymology_lines": [{"language": "Old English via Middle English", "word": "īsern (earlier: īren/īsen ) /yren/yron", "roots": "", "meaning": "holy metal or strong metal", "notes": "descriptive"}, {"language": "English", "word": "iron", "roots": "", "meaning": "iron", "notes": "Derived <- Proto-Germanic *isarna / *isarnan"}, {"language": "Unspecified", "word": "The deeper origin is uncertain, though often treated as an early borrowing into Germanic", "roots": "", "meaning": "", "notes": ""}, {"language": "Unspecified", "word": "Chemical symbol Fe reflects Latin ferrum", "roots": "", "meaning": "iron", "notes": ""}]}, "27": {"number": 27, "symbol": "Co", "name": "Cobalt", "meaning": "kobold", "origin_word": "Kobold", "origin_language": "German", "origin_type": "", "summary": "From German Kobold , which means \"goblin\". The metal was named by miners, because it was poisonous and troublesome ( polluted and degraded by other mined elements, such as nickel). Other sources cite the origin in the silver miners' belief that cobalt had been placed by \" Kobolds \", who had stolen the silver. Some suggest that the name may have been derived from Greek κόβαλος ( kobalos ), which means \"mine\" and which may have common roots with kobold, goblin, and cobalt.", "etymology_lines": [{"language": "German", "word": "Kobold", "roots": "", "meaning": "goblin", "notes": ""}, {"language": "German", "word": "Kobalt / cobalt", "roots": "", "meaning": "goblin, mine spirit", "notes": "Derived <- German kobold"}, {"language": "Unspecified", "word": "Miners used the word for deceptive ores that looked useful but were troublesome", "roots": "", "meaning": "", "notes": ""}]}, "28": {"number": 28, "symbol": "Ni", "name": "Nickel", "meaning": "Old Nick", "origin_word": "Kopparnickel / Kupfernickel", "origin_language": "Swedish via German", "origin_type": "descriptive", "summary": "From Swedish kopparnickel , meaning \"copper-coloured ore\". This referred to the ore niccolite from which it was obtained.", "etymology_lines": [{"language": "Swedish via German", "word": "Kopparnickel / Kupfernickel", "roots": "", "meaning": "copper-coloured ore", "notes": "descriptive"}, {"language": "German", "word": "Nickel (in Kupfernickel)", "roots": "", "meaning": "Old Nick / devil", "notes": "Derived <- a pet form of Nikolaus"}, {"language": "Unspecified", "word": "Kupfernickel literally meant \"copper-devil\" or \"false n Zinke"}, {"language": "Unspecified", "word": "The name probably referred to pointed crystal forms or tooth-like projections", "roots": "", "meaning": "", "notes": ""}]}, "31": {"number": 31, "symbol": "Ga", "name": "Gallium", "meaning": "Gaul", "origin_word": "Gallia", "origin_language": "Latin", "origin_type": "toponym", "summary": "From Latin Gallia , which means \" Gaul \" (Ancient France), and also gallus , which means \"rooster\". The element was obtained as free metal by Lecoq de Boisbaudran , who named it after his native land France. Allegations were later made that he had also named it after himself, as gallus is Latin for le coq (\" rooster \"), but he denied that this had been his intention. · Former name eka-aluminium by Mendeleev, who had predicted its existence.", "etymology_lines": [{"language": "Latin", "word": "Gallia", "roots": "", "meaning": "Gaul\" (Ancient France)", "notes": "toponym"}, {"language": "New Latin", "word": "gallium", "roots": "", "meaning": "Gaul, France", "notes": "Derived <- Latin Gallia"}]}, "32": {"number": 32, "symbol": "Ge", "name": "Germanium", "meaning": "Germany", "origin_word": "Germania", "origin_language": "Latin", "origin_type": "toponym", "summary": "From Latin Germania , which means \"Germany\". · Former name eka-silicon by Mendeleev.", "etymology_lines": [{"language": "Latin", "word": "Germania", "roots": "", "meaning": "Germany", "notes": "toponym"}, {"language": "New Latin", "word": "germanium", "roots": "", "meaning": "Germany", "notes": "Derived <- Latin Germania"}]}, "33": {"number": 33, "symbol": "As", "name": "Arsenic", "meaning": "orpiment", "origin_word": "ἀρσενικόν ( arsenikon )", "origin_language": "Syriac / Persian via Greek, Latin, Old French , and Middle English", "origin_type": "descriptive (colour)", "summary": "From Greek ἀρσενικόν ( arsenikon ), which is adapted from Syriac ܠܫܢܐܠܐ ܙܐܦܢܝܐ ‎ ( (al) zarniqa ) and Persian زرنيخ ( zarnik ), \"yellow orpiment \". The Greek arsenikon is paretymologicall me": "Yttrium", "meaning": "Ytterby", "origin_word": "Ytterby", "origin_language": "Swedish", "origin_type": "toponym", "summary": "Named after the mineral yttria (yttrium oxide), where it was originally extracted from. Yttria itself was named after Ytterby , Sweden.", "etymology_lines": [{"language": "Swedish", "word": "Ytterby", "roots": "", "meaning": "proper name", "notes": "toponym"}, {"language": "New Latin", "word": "yttrium", "roots": "", "meaning": "", "notes": "Derived <- Ytterby, the Swedish village associated with the mineral source"}]}, "40": {"number": 40, "symbol": "Zr", "name": "Zirconium", "meaning": "zircon", "origin_word": "ܙܐܪܓܥܢܥ ( zargono ), زرگون ( zargûn )", "origin_language": "Syriac / Persian via Arabic and German", "origin_type": "", "summary": "From Arabic زركون ( zarkûn ). Derived from Persian زرگون ( zargûn ), which means \"gold-like\". Zirkon is the German variant of these and is the origin of the English zircon .", "etymology_lines": [{"language": "Syriac / Persian via Arabic and German", "word": "ܙܐܪܓܥܢܥ ( zargono ), زرگون ( zargûn )", "roots": "", "meaning": "gold-like", "notes": ""}, {"language": "New Latin", "word": "zirconium", "roots": "", "meaning": "", "notes": "Derived <- zircon"}, {"language": "English", "word": "zircon", "roots": "", "meaning": "", "notes": "Derived <- French zircon / German Zirkon"}, {"language": "Unspecified", "word": "Ultimately from Persian zargun", "roots": "", "meaning": "gold-colored", "notes": ""}]}, "41": {"number": 41, "symbol": "Nb", "name": "Niobium", "meaning": "snowy", "origin_word": "Νιόβη ( Niobe )", "origin_language": "Greek", "origin_type": "mythological", "summary": "Named after Niobe , daughter of Tantalus in classical mythology. · Former name columbium from Columbia , personification of the United States.", "etymology_lines": [{"language": "Greek", "word": "Νιόβη ( Niobe )", "roots": "", "meaning": "snowy", "notes": "mythological"}]}, "42": {"number": 42, "symbol": "Mo", "name": "Molybdenum", "meaning": "lead", "origin_word": "μόλυβδος ( molybdos )", "origin_language": "Greek", "origin_type": "descriptive", "summary": "From Greek μόλυβδος ( molybdos ), \"lead\", due to confusion with lead ore galena .", "etymology_lines": [{"language": "Greek", "word": "μόλυβδος ( molybdos )", "roots": "", "meaning": "lead-like", "notes": "descriptive"}, {"language": "New Latin", "word": "molybdenum", "roots": "", "meaning": "lead", "notes": "Derived <- Ancient Greek molybdos / molybdaina"}, {"language": "Unspecified", "word": "The word was first applied to lead-like minerals before being fixed to the element", "roots": "", "meaning": "", "notes": ""}]}, "43": {"number": 43, "symbol": "Tc", "name": "Technetium", "meaning": "artificial", "origin_word": "τεχνητός ( technetos )", "origin_language": "Greek", "origin_type": "descriptive", "summary": "From Greek τεχνητός ( technetos ), which means \"artificial\", because it was the first artificially produced element. · Former name eka-manganese", "etymology_lines": [{"language": "Greek", "word": "τεχνητός ( technetos )", "roots": "", "meaning": "artificial", "notes": "descriptive"}, {"language": "New Latin", "word": "technetium", "roots": "", "meaning": "artificial", "notes": "Derived <- Ancient Greek tekhnetos"}, {"language": "Ancient Greek", "word": "tekhnetos", "roots": "", "meaning": "art, craft, skill", "notes": "Derived <- tekhne"}, {"language": "Proto-Indo-European", "word": "*teks-", "roots": "", "meaning": "to weave, fabricate, make", "notes": ""}]}, "44": {"number": 44, "symbol": "Ru", "name": "Ruthenium", "meaning": "Ruthenia\", Kievan Rus'", "origin_word": "Ruthenia", "origin_language": "Latin", "origin_type": "toponym (exonym)", "summary": "From Latin Ruthenia , geographical exonym for Kievan Rus' .", "etymology_lines": [{"language": "Latin", "word": "Ruthenia", "roots": "", "meaning": "Ruthenia\", Kievan Rus'", "notes": "toponym (exonym)"}]}, "45": {"number": 45, "symbol": "Rh", "name": "Rhodium", "meaning": "rose", "origin_word": "ῥόδον ( rhodon )", "origin_language": "Greek", "origin_type": "descriptive (colour)", "summary": "From Greek ῥόδον ( rhodon ), which means \"rose\". From its rose-red compounds .", "etymology_lines": [{"language": "Greek", "word": "ῥόδον ( rhodon )", "roots": "", "meaning": "rose", "notes": "descriptive (colour)"}]}, "46": {"number": 46, "symbol": "Pd", "name": "Palladium", "meaning": "Pallas", "origin_word": "Παλλάς (genitive: Παλλάδος ) ( Pallas )", "origin_language": "Greek via Latin", "origin_type": "astrological; mythological", "summary": "Named after Pallas , the asteroid discovered two years earlier. The asteroid itself was named after Pallas Athena , goddess of wisdom and victory. The word Palladium is derived from Greek Παλλάδιον and is the neuter version of Παλλάδιος , meaning \"of Pallas\".", "etymology_lines": [{"language": "Greek via Latin", "word": "Παλλάς (genitive: Παλλάδος ) ( Pallas )", "roots": "", "meaning": "little maiden", "notes": "astrological; mythological"}, {"language": "New Latin", "word": "palladium", "roots": "", "meaning": "", "notes": "Derived <- Pallas, the asteroid Pallas"}, {"language": "Unspecified", "word": "The asteroid name goes back to Pallas Athena in Greek mythology", "roots": "", "meaning": "", "notes": ""}]}, "47": {"number": 47, "symbol": "Ag", "name": "Silver", "meaning": "traditional Germanic name", "origin_word": "𒊭𒁺𒁍/𒊭𒅈𒇥 ( siolfor / seolfor )", "origin_language": "Akkadian via Old English and Middle English", "origin_type": "", "summary": "Possibly borrowed from Akkadian 𒊭𒅈𒇥 ( sarpu ) \"refined silver\" and related to 𒊭𒁺𒁍 ( sarapu ) \"to refine\", \"smelt\". From Old English , seolfor which was derived from Proto-Germanic * silubra- ; compare Old High German silabar ; and has cognates in Balto-Slavic languages : sĭrebro , sidabras , Old Prussian sirablan . Alternatively, possibly from one of the Pre-Indo-European languages , compare zilar . · Symbol Ag is from the Latin name argentum (\"silver\"), which is derived from Proto-Indo-European * arg-ent- .", "etymology_lines": [{"language": "Akkadian via Old English and Middle English", "word": "𒊭𒁺𒁍/𒊭𒅈𒇥 ( siolfor / seolfor )", "roots": "", "meaning": "to refine\", \"smelt", "notes": ""}, {"language": "English", "word": "silver", "roots": "", "meaning": "silver", "notes": "Derived <- Proto-Germanic *silubra / *silubr-"}, {"language": "Unspecified", "word": "The deeper origin is uncertain", "roots": "", "meaning": "", "notes": ""}, {"language": "Unspecified", "word": "Chemical symbol Ag reflects Latin argentum", "roots": "", "meaning": "silver", "notes": ""}]}, "48": {"number": 48, "symbol": "Cd", "name": "Cadmium", "meaning": "calamine / cadmia", "origin_word": "καδμεία ( kadmeia )", "origin_language": "Greek/Latin", "origin_type": "", "summary": "From Latin cadmia , which is derived from Greek καδμεία ( kadmeia ) and means \" calamine \", a cadmium-bearing mixture of minerals. Cadmium is named after Cadmus (in Greek: Κάδμος : Kadmos ), a character in Greek mythology and calamine is derived from Le Calamine , the French name of the Belgian town of Kelmis .", "etymology_lines": [{"language": "Greek/Latin", "word": "καδμεία ( kadmeia )", "roots": "", "meaning": "Earth \" (as classical element), \" calamine \" or Cadmean earth [?]", "notes": ""}, {"language": "New Latin", "word": "cadmium", "roots": "", "meaning": "calamine", "notes": "Derived <- Latin cadmia"}, {"language": "Latin", "word": "cadmia", "roots": "", "meaning": "Cadmean earth / calamine", "notes": "Derived <- Ancient Greek kadmeia"}, {"language": "Unspecified", "word": "The Greek word refers to Kadmeia / Thebes, associated with Cadmus", "roots": "", "meaning": "", "notes": ""}]}, "49": {"number": 49, "symbol": "In", "name": "Indium", "meaning": "indigo", "origin_word": "indigo", "origin_language": "Greek via Latin and English", "origin_type": "descriptive (colour)", "summary": "Named after indigo , because of an indigo-coloured spectrum line. The English word indigo is from Spanish indico and Dutch indigo (from Portuguese endego ), from Latin indigo , from Greek ἰνδικόν ( indikon ): \"blue dye from India\".", "etymology_lines": [{"language": "Greek via Latin and English", "word": "indigo", "roots": "", "meaning": "", "notes": "descriptive (colour)"}, {"language": "New Latin", "word": "indium", "roots": "", "meaning": "", "notes": "Derived <- indigo, for the indigo-blue spectral line"}, {"language": "English", "word": "indigo", "roots": "", "meaning": "Indian dye", "notes": "Derived <- Latin indicum"}, {"language": "Latin", "word": "indicum", "roots": "", "meaning": "Indian (substance)", "notes": "Derived <- Greek indikon"}]}, "50": {"number": 50, "symbol": "Sn", "name": "Tin", "meaning": "traditional Germanic name", "origin_word": "tin", "origin_language": "Anglo-Saxon via Middle English", "origin_type": "", "summary": "The word tin is borrowed from a Proto-Indo-European language , and has cognates in several Germanic and Celtic languages . · Symbol Sn is from its Latin name stannum .", "etymology_lines": [{"language": "Anglo-Saxon via Middle English", "word": "tin", "roots": "", "meaning": "", "notes": ""}, {"language": "English", "word": "tin", "roots": "", "meaning": "tin", "notes": "Derived <- Proto-Germanic *tinom"}, {"language": "Unspecified", "word": "The deeper origin is uncertain", "roots": "", "meaning": "", "notes": ""}, {"language": "Unspecified", "word": "Chemical symbol Sn reflects Latin stannum", "roots": "", "meaning": "tin", "notes": ""}]}, "51": {"number": 51, "symbol": "Sb", "name": "Antimony", "meaning": "stibium / stibnite", "origin_word": "", "origin_language": "Greek? via Medieval Latin and Middle English", "origin_type": "", "summary": "Possibly from Greek ἀντί + μόνος ( anti + monos ), approximately meaning \"opposed to solitude\", as believed never to exist in pure form, or ἀντί + μοναχός ( anti + monachos ) for \"monk-killer\" (in French folk etymology, anti-moine \"monk's bane\"), because many early alchemists were monks, and antimony is poisonous. This may also be derived from the Pharaonic ( Ancient Egyptian ), Antos Ammon (expression), which could be translated as \"bloom of the god Ammo\".", "etymology_lines": [{"language": "Greek? via Medieval Latin and Middle English", "word": "", "roots": "", "meaning": "various", "notes": ""}, {"language": "English", "word": "antimony", "roots": "", "meaning": "", "notes": "Derived <- Medieval Latin antimonium (ultimate origin uncertain)"}, {"language": "Unspecified", "word": "An older classical name is Latin stibium", "roots": "", "meaning": "antimony, stibnite", "notes": "Derived <- Ancient Greek stibi"}, {"language": "Unspecified", "word": "Chemical symbol Sb comes from stibium rather than antimony", "roots": "", "meaning": "", "notes": ""}]}, "52": {"number": 52, "symbol": "Te", "name": "Tellurium", "meaning": "earth / Tellus", "origin_word": "Tellus", "origin_language": "Latin", "origin_type": "", "summary": "From Latin tellus , \" Earth \".", "etymology_lines": [{"language": "Latin", "word": "Tellus", "roots": "", "meaning": "Earth", "notes": ""}, {"language": "New Latin", "word": "tellurium", "roots": "", "meaning": "earth", "notes": "Derived <- Latin tellus / telluris"}]}, "53": {"number": 53, "symbol": "I", "name": "Iodine", "meaning": "violet", "origin_word": "ἰώδης ( iodes )", "origin_language": "Greek via French", "origin_type": "descriptive (colour)", "summary": "Named after the Greek ἰώδης ( iodes ), which means \"violet\", because of the colour of the gaseous phase. This word was adapted as the French iode , which is the source of the English \"iodine\".", "etymology_lines": [{"language": "Greek via French", "word": "ἰώδης ( iodes )", "roots": "", "meaning": "violet", "notes": "descriptive (colour)"}, {"language": "French", "word": "iode / New Latin iodine", "roots": "", "meaning": "violet-like", "notes": "Derived <- Ancient Greek ioeides"}, {"language": "Ancient Greek", "word": "ion", "roots": "", "meaning": "violet\" + -eides = \"having the form/color of", "notes": ""}]}, "54": {"number": 54, "symbol": "Xe", "name": "Xenon", "meaning": "foreign, strange", "origin_word": "ξένος ( xenos )", "origin_language": "Greek", "origin_type": "", "summary": "From the Greek adjective ξένος ( xenos ): \"foreign\", \"a stranger\".", "etymology_lines": [{"language": "Greek", "word": "ξένος ( xenos )", "roots": "", "meaning": "foreign", "notes": ""}, {"language": "New Latin", "word": "xenon", "roots": "", "meaning": "stranger, foreigner, guest", "notes": "Derived <- Ancient Greek xenos"}]}, "55": {"number": 55, "symbol": "Cs", "name": "Caesium", "meaning": "sky-blue", "origin_word": "caesius", "origin_language": "Latin", "origin_type": "descriptive (colour)", "summary": "From Latin caesius , which means \"sky blue\". Its identification was based upon the bright blue lines in its spectrum, and it was the first element discovered by spectrum analysis.", "etymology_lines": [{"language": "Latin", "word": "caesius", "roots": "", "meaning": "blue-grey\" or \"sky blue", "notes": "descriptive (colour)"}, {"language": "New Latin", "word": "caesium / cesium", "roots": "", "meaning": "sky-blue, blue-gray", "notes": "Derived <- Latin caesius"}]}, "56": {"number": 56, "symbol": "Ba", "name": "Barium", "meaning": "heavy", "origin_word": "βαρύς ( barys )", "origin_language": "Greek via Neo-Latin", "origin_type": "", "summary": "βαρύς ( barys ) means \"heavy\". The oxide was initially called \"barote\", then \"baryta\", which was modified to \"barium\" to describe the metal. Humphry Davy gave the element this name because it was originally found in baryte , which shares the same source.", "etymology_lines": [{"language": "Greek via Neo-Latin", "word": "βαρύς ( barys )", "roots": "", "meaning": "heavy", "notes": ""}, {"language": "New Latin", "word": "barium", "roots": "", "meaning": "heavy", "notes": "Derived <- Ancient Greek barys"}]}, "57": {"number": 57, "symbol": "La", "name": "Lanthanum", "meaning": "hidden", "origin_word": "λανθάνειν ( lanthanein )", "origin_language": "Greek", "origin_type": "", "summary": "From Greek λανθάνω ( lanthánō ), \"I escape notice\".", "etymology_lines": [{"language": "Greek", "word": "λανθάνειν ( lanthanein )", "roots": "", "meaning": "to escape notice", "notes": ""}, {"language": "New Latin", "word": "lanthanum", "roots": "", "meaning": "to lie hidden, escape notice", "notes": "Derived <- Ancient Greek lanthanein"}]}, "58": {"number": 58, "symbol": "Ce", "name": "Cerium", "meaning": "grain\", \"bread", "origin_word": "ceres", "origin_language": "Latin", "origin_type": "astrological; mythological", "summary": "Named after the asteroid Ceres , discovered two years earlier. The asteroid itself, now classified as a dwarf planet, was named after Ceres , the goddess of fertility in Roman mythology. Ceres is derived from Proto-Indo-European * ker-es- from base * ker- meaning \"to grow\".", "etymology_lines": [{"language": "Latin", "word": "ceres", "roots": "", "meaning": "grain\", \"bread", "notes": "astrological; mythological"}]}, "59": {"number": 59, "symbol": "Pr", "name": "Praseodymium", "meaning": "green twin", "origin_word": "πράσιος δίδυμος ( prasios didymos )", "origin_language": "Greek", "origin_type": "descriptive", "summary": "From Greek πράσιος δίδυμος ( prasios didymos ), meaning \"green twin\", because didymium separates into praseodymium and neodymium .", "etymology_lines": [{"language": "Greek", "word": "πράσιος δίδυμος ( prasios didymos )", "roots": "", "meaning": "green twin", "notes": "descriptive"}, {"language": "New Latin", "word": "praseodymium", "roots": "", "meaning": "green twin", "notes": "Derived <- Ancient Greek prasios + didymos"}, {"language": "Ancient Greek", "word": "prasios", "roots": "", "meaning": "leek-green", "notes": ""}, {"language": "Ancient Greek", "word": "didymos", "roots": "", "meaning": "twin", "notes": ""}]}, "60": {"number": 60, "symbol": "Nd", "name": "Neodymium", "meaning": "new twin", "origin_word": "νέος δίδυμος ( neos didymos )", "origin_language": "Greek", "origin_type": "descriptive", "summary": "From Greek νέος διδύμος ( neos didymos ), which means \"new twin\", because didymium separates into praseodymium and neodymium.", "etymology_lines": [{"language": "Greek", "word": "νέος δίδυμος ( neos didymos )", "roots": "", "meaning": "new twin", "notes": "descriptive"}, {"language": "New Latin", "word": "neodymium", "roots": "", "meaning": "new twin", "notes": "Derived <- Ancient Greek neos + didymos"}, {"language": "Ancient Greek", "word": "neos", "roots": "", "meaning": "new", "notes": ""}, {"language": "Ancient Greek", "word": "didymos", "roots": "", "meaning": "twin", "notes": ""}]}, "61": {"number": 61, "symbol": "Pm", "name": "Promethium", "meaning": "forethought", "origin_word": "Προμηθεύς ( Prometheus )", "origin_language": "Greek", "origin_type": "mythological", "summary": "Named after Prometheus (a god in classical mythology), who stole the fire of heaven and gave it to mankind.", "etymology_lines": [{"language": "Greek", "word": "Προμηθεύς ( Prometheus )", "roots": "", "meaning": "forethought", "notes": "mythological"}]}, "62": {"number": 62, "symbol": "Sm", "name": "Samarium", "meaning": "", "origin_word": "Samarsky-Bykhovets, Vassili", "origin_language": "", "origin_type": "eponym", "summary": "Named after the mineral samarskite , itself named after Colonel Vassili Samarsky-Bykhovets , a Russian mine official.", "etymology_lines": [{"language": "Unspecified", "word": "Samarsky-Bykhovets, Vassili", "roots": "", "meaning": "", "notes": "eponym"}]}, "63": {"number": 63, "symbol": "Eu", "name": "Europium", "meaning": "broad-faced\" or \"well-watered", "origin_word": "Εὐρώπη ( Europe )", "origin_language": "Ancient Greek", "origin_type": "toponym; mythological", "summary": "Named after Europe, where it was discovered. Europe itself was named after Europa (consort of Zeus) .", "etymology_lines": [{"language": "Ancient Greek", "word": "Εὐρώπη ( Europe )", "roots": "", "meaning": "broad-faced\" or \"well-watered", "notes": "toponym; mythological"}]}, "64": {"number": 64, "symbol": "Gd", "name": "Gadolinium", "meaning": "named after Johan Gadolin", "origin_word": "Gadolin, Johan", "origin_language": "Finnish", "origin_type": "eponym", "summary": "Named in honour of Johan Gadolin , who was one of the founders of Nordic chemistry research, and who discovered § yttrium . The mineral gadolinite is also named after him.", "etymology_lines": [{"language": "Finnish", "word": "Gadolin, Johan", "roots": "", "meaning": "", "notes": "eponym"}, {"language": "New Latin", "word": "gadolinium", "roots": "", "meaning": "", "notes": "Derived <- Gadolin, the surname of Johan Gadolin"}, {"language": "Unspecified", "word": "This is an honorific name rather than a transparent lexical compound", "roots": "", "meaning": "", "notes": ""}]}, "65": {"number": 65, "symbol": "Tb", "name": "Terbium", "meaning": "Ytterby", "origin_word": "Ytterby", "origin_language": "Swedish", "origin_type": "toponym", "summary": "Named after Ytterby , the village in Sweden where the element was first discovered.", "etymology_lines": [{"language": "Swedish", "word": "Ytterby", "roots": "", "meaning": "proper name", "notes": "toponym"}, {"language": "New Latin", "word": "terbium", "roots": "", "meaning": "", "notes": "Derived <- terbia, the old chemical name formed from Ytterby"}, {"language": "Unspecified", "word": "Like yttrium, erbium, and ytterbium, the chain ultimately points back to Ytterby in Sweden", "roots": "", "meaning": "", "notes": ""}]}, "66": {"number": 66, "symbol": "Dy", "name": "Dysprosium", "meaning": "hard to get", "origin_word": "δυσπρόσιτος ( dysprositos )", "origin_language": "Greek", "origin_type": "descriptive", "summary": "From Greek δυσπρόσιτος ( dysprositos ), which means \"hard to get at\".", "etymology_lines": [{"language": "Greek", "word": "δυσπρόσιτος ( dysprositos )", "roots": "", "meaning": "hard to get at", "notes": "descriptive"}, {"language": "New Latin", "word": "dysprosium", "roots": "", "meaning": "hard to get at, hard to obtain", "notes": "Derived <- Ancient Greek dysprositos"}, {"language": "Ancient Greek", "word": "dys-", "roots": "", "meaning": "badly, hard\" + prositos = \"approachable / accessible", "notes": ""}]}, "67": {"number": 67, "symbol": "Ho", "name": "Holmium", "meaning": "Stockholm", "origin_word": "Holmia", "origin_language": "Latin", "origin_type": "toponym", "summary": "From Latin Holmia , \" Stockholm \".", "etymology_lines": [{"language": "Latin", "word": "Holmia", "roots": "", "meaning": "Stockholm", "notes": "toponym"}, {"language": "New Latin", "word": "holmium", "roots": "", "meaning": "Stockholm", "notes": "Derived <- Latin Holmia"}]}, "68": {"number": 68, "symbol": "Er", "name": "Erbium", "meaning": "Ytterby", "origin_word": "Ytterby", "origin_language": "Swedish", "origin_type": "toponym", "summary": "Named after Ytterby , Sweden , where large concentrations of minerals yttria and erbia are located. Erbia and terbia were confused at this time. After 1860, what had been known as terbia was renamed erbia, and after 1877, what had been known as erbia was renamed terbia.", "etymology_lines": [{"language": "Swedish", "word": "Ytterby", "roots": "", "meaning": "proper name", "notes": "toponym"}, {"language": "New Latin", "word": "erbium", "roots": "", "meaning": "", "notes": "Derived <- erbia, the old chemical name formed from Ytterby"}, {"language": "Unspecified", "word": "The chain ultimately points back to Ytterby in Sweden", "roots": "", "meaning": "", "notes": ""}]}, "69": {"number": 69, "symbol": "Tm", "name": "Thulium", "meaning": "Thule", "origin_word": "Θούλη ( Thoúlē )", "origin_language": "Greek", "origin_type": "mythological", "summary": "Named after Thule , an ancient Roman and Greek name ( Θούλη ) for a mythical country in the far north, perhaps Scandinavia .", "etymology_lines": [{"language": "Greek", "word": ", "origin_word": "Τάνταλος ( Tantalus )", "origin_language": "Greek", "origin_type": "mythological", "summary": "Named after Greek Τάνταλος ( Tantalus ), who was punished after death by being condemned to stand knee-deep in water. If he bent to drink the water, it drained below the level he could reach (in Greek mythology ). This was considered similar to tantalum's general non-reactivity (that is, \"unreachability\") because of its inertness (it sits among reagents and is unaffected by them).", "etymology_lines": [{"language": "Greek", "word": "Τάνταλος ( Tantalus )", "roots": "", "meaning": "possibly \"the bearer\" or \"the sufferer", "notes": "mythological"}, {"language": "New Latin", "word": "tantalum", "roots": "", "meaning": "", "notes": "Derived <- Tantalos (Tantalus) of Greek mythology"}]}, "74": {"number": 74, "symbol": "W", "name": "Tungsten", "meaning": "heavy stone", "origin_word": "tung sten", "origin_language": "Swedish and Danish", "origin_type": "descriptive", "summary": "From the Swedish and Danish \"tung sten\", which means \"heavy stone\". · Symbol W is from the German name Wolfram . · Former name Wolfrahm (German, literally \"wolf cream\") was the historical name. The names wolfram or volfram are still used in Swedish and several other languages.", "etymology_lines": [{"language": "Swedish and Danish", "word": "tung sten", "roots": "", "meaning": "heavy stone", "notes": "descriptive"}, {"language": "English", "word": "tungsten", "roots": "", "meaning": "heavy stone", "notes": "Derived <- Swedish tung sten"}, {"language": "Unspecified", "word": "The chemical symbol W preserves German Wolfram, the older alternative name", "roots": "", "meaning": "", "notes": ""}]}, "75": {"number": 75, "symbol": "Re", "name": "Rhenium", "meaning": "Rhine", "origin_word": "Rhenus", "origin_language": "Latin", "origin_type": "toponym", "summary": "From Latin Rhenus , the river Rhine .", "etymology_lines": [{"language": "Latin", "word": "Rhenus", "roots": "", "meaning": "Rhine", "notes": "toponym"}]}, "76": {"number": 76, "symbol": "Os", "name": "Osmium", "meaning": "smell", "origin_word": "ὀσμή ( osme )", "origin_language": "Greek via Neo-Latin", "origin_type": "descriptive", "summary": "From Greek ὀσμή ( osme ), meaning \"a smell\", as osmium tetroxide is foul-smelling.", "etymology_lines": [{"language": "Greek via Neo-Latin", "word": "ὀσμή ( osme )", "roots": "", "meaning": "a smell", "notes": "descriptive"}, {"language": "New Latin", "word": "osmium", "roots": "", "meaning": "smell, odor", "notes": "Derived <- Ancient Greek osme"}]}, "77": {"number": 77, "symbol": "Ir", "name": "Iridium", "meaning": "Iris / rainbow", "origin_word": "ἴρις (genitive: ἴριδος ) ( iris )", "origin_language": "Greek via Latin", "origin_type": "descriptive (colour)", "summary": "Named after the Latin noun iris , which means \" rainbow , iris plant, iris of the eye\", because many of its salts are strongly coloured; Iris was originally the name of the goddess of rainbows and a messenger in Greek mythology.", "etymology_lines": [{"language": "Greek via Latin", "word": "ἴρις (genitive: ἴριδος ) ( iris )", "roots": "", "meaning": "of rainbows", "notes": "descriptive (colour)"}, {"language": "New Latin", "word": "iridium", "roots": "", "meaning": "rainbow", "notes": "Derived <- Latin iris"}, {"language": "Latin", "word": "iris", "roots": "", "meaning": "", "notes": "Derived <- Ancient Greek Iris, the rainbow and the goddess Iris"}]}, "78": {"number": 78, "symbol": "Pt", "name": "Platinum", "meaning": "little silver", "origin_word": "platina ( del Pinto )", "origin_language": "Spanish via Neo-Latin", "origin_type": "descriptive", "summary": "From the Spanish, platina , which means \"little silver\", because it was first encountered in a silver mine. The modern Spanish is platino . Platina is a diminutive of plata (silver); it is a loan word from French plate or Provençal plata (sheet of metal) and is the origin of the English \"plate\".", "etymology_lin : "English", "word": "mercury", "roots": "", "meaning": "", "notes": "Derived <- Latin Mercurius, the Roman god Mercury"}, {"language": "Unspecified", "word": "The chemical symbol Hg reflects Neo-Latin hydrargyrum", "roots": "", "meaning": "water-silver", "notes": "Derived <- Ancient Greek hydrargyros"}]}, "81": {"number": 81, "symbol": "Tl", "name": "Thallium", "meaning": "green shoot", "origin_word": "θαλλός ( thallos )", "origin_language": "Greek", "origin_type": "descriptive", "summary": "From Greek θαλλός ( thallos ), which means \"a green shoot (twig)\", because of its bright-green spectral emission lines .", "etymology_lines": [{"language": "Greek", "word": "θαλλός ( thallos )", "roots": "", "meaning": "green twig", "notes": "descriptive"}, {"language": "New Latin", "word": "thallium", "roots": "", "meaning": "green shoot, young branch", "notes": "Derived <- Ancient Greek thallos"}]}, "82": {"number": 82, "symbol": "Pb", "name": "Lead", "meaning": "traditional Germanic name", "origin_word": "lead", "origin_language": "Anglo-Saxon", "origin_type": "", "summary": "· Symbol Pb is from the Latin name plumbum , still visible in the English plumbing .", "etymology_lines": [{"language": "Anglo-Saxon", "word": "lead", "roots": "", "meaning": "", "notes": ""}, {"language": "English", "word": "lead", "roots": "", "meaning": "lead", "notes": "Derived <- Proto-Germanic *lauda-"}, {"language": "Unspecified", "word": "The deeper origin is uncertain", "roots": "", "meaning": "", "notes": ""}, {"language": "Unspecified", "word": "Chemical symbol Pb reflects Latin plumbum", "roots": "", "meaning": "lead", "notes": ""}]}, "83": {"number": 83, "symbol": "Bi", "name": "Bismuth", "meaning": "white mass", "origin_word": "bisemutum", "origin_language": "Neo-Latin from German", "origin_type": "descriptive (colour)", "summary": "bisemutum is derived from German Wismuth , perhaps from weiße Masse , and means \"white mass\", due to its appearance.", "etymology_lines": [{"language": "Neo-Latin from German", "word": "bisemutum", "roots": "", "meaning": "white mass", "notes": "descriptive (colour)"}, {"language": "German", "word": "Wismut / Weismut", "roots": "", "meaning": "", "notes": "Derived -> New Latin bismuth"}, {"language": "Unspecified", "word": "The traditional explanation is German weisse Masse", "roots": "", "meaning": "white mass", "notes": ""}, {"language": "Unspecified", "word": "The exact early history is debated, but \"white mass\" is the standard account", "roots": "", "meaning": "", "notes": ""}]}, "84": {"number": 84, "symbol": "Po", "name": "Polonium", "meaning": "Poland", "origin_word": "Polonia", "origin_language": "Latin", "origin_type": "toponym", "summary": "Named after Poland , homeland of discoverer Marie Curie . · Former name radium F", "etymology_lines": [{"language": "Latin", "word": "Polonia", "roots": "", "meaning": "Poland", "notes": "toponym"}, {"language": "New Latin", "word": "polonium", "roots": "", "meaning": "Poland", "notes": "Derived <- Latin Polonia"}]}, "85": {"number": 85, "symbol": "At", "name": "Astatine", "meaning": "unstable", "origin_word": "ἄστατος ( astatos )", "origin_language": "Greek", "origin_type": "", "summary": "From Greek ἄστατος ( astatos ), meaning \"unstable\". · Former name alabamine (Ab) was an earlier proposed name for astatine", "etymology_lines": [{"language": "Greek", "word": "ἄστατος ( astatos )", "roots": "", "meaning": "unstable", "notes": ""}, {"language": "New Latin", "word": "astatine", "roots": "", "meaning": "unstable, unsettled", "notes": "Derived <- Ancient Greek astatos"}, {"language": "Ancient Greek", "word": "a-", "roots": "", "meaning": "not\" + statos = \"standing, stable", "notes": ""}]}, "86": {"number": 86, "symbol": "Rn", "name": "Radon", "meaning": "named from radium", "origin_word": "radium", "origin_language": "Latin via German and English", "origin_type": "", "summary": "Contraction of radium emanation , since the element appears in the radioactive decay of radium. · Former name niton (Nt), from Latin nitens \"shining\", because of the radioluminescence of radon.", "etymology_lines": [{"language": "Latin via German and English", "word": "radium", "roots": "", "meaning": "", "notes": ""}, {"language": "New Latin", "word": "radon", "roots": "", "meaning": "", "notes": "Derived <- radium + the noble-gas suffix -on"}, {"language": "Unspecified", "word": "Radium", "roots": "", "meaning": "ray, spoke, beam", "notes": "Derived <- Latin radius"}]}, "87": {"number": 87, "symbol": "Fr", "name": "Francium", "meaning": "France", "origin_word": "France", "origin_language": "French", "origin_type": "toponym", "summary": "Named after France (literally: \"Land of the Franks\"), where it was discovered, at the Curie Institute, Paris .", "etymology_lines": [{"language": "French", "word": "France", "roots": "", "meaning": "", "notes": "toponym"}, {"language": "New Latin", "word": "francium", "roots": "", "meaning": "France", "notes": "Derived <- France / Latin Francia"}]}, "88": {"number": 88, "symbol": "Ra", "name": "Radium", "meaning": "ray", "origin_word": "radius", "origin_language": "Latin via French", "origin_type": "descriptive", "summary": "From Latin radius meaning \"ray\", because of its radioactivity .", "etymology_lines": [{"language": "Latin via French", "word": "radius", "roots": "", "meaning": "ray", "notes": "descriptive"}, {"language": "New Latin", "word": "radium", "roots": "", "meaning": "ray, spoke, beam", "notes": "Derived <- Latin radius"}]}, "89": {"number": 89, "symbol": "Ac", "name": "Actinium", "meaning": "beam", "origin_word": "ἀκτίς ( aktis )", "origin_language": "Greek", "origin_type": "", "summary": "From Greek ἀκτίς / ἀκτῖνος ( aktis / aktinos ), which means \"beam ( ray )\".", "etymology_lines": [{"language": "Greek", "word": "ἀκτίς ( aktis )", "roots": "", "meaning": "beam", "notes": ""}]}, "90": {"number": 90, "symbol": "Th", "name": "Thorium", "meaning": "thunder", "origin_word": "Þōrr ( Thor )", "origin_language": "Old Norse", "origin_type": "mythological", "summary": "From Old Norse Þōrr ( Thor ), a god associated with thunder in Norse mythology . · Former name ionium (Io) was given early in the study of radioactive elements to the Thorium-230 isotope .", "etymology_lines": [{"language": "Old Norse", "word": "Þōrr ( Thor )", "roots": "", "meaning": "thunder", "notes": "mythological"}]}, "91": {"number": 91, "symbol": "Pa", "name": "Protactinium", "meaning": "first beam element", "origin_word": "πρῶτος + ἀκτίς", "origin_language": "Greek", "origin_type": "descriptive?", "summary": "From Greek proto- \"first\" + Neo-Latin actinium (itself from Greek ἀκτίς , gen. [?] : ἀκτῖνος ) \"ray\": proto(-)actinium , later shortened to protactinium .", "etymology_lines": [{"language": "Greek", "word": "πρῶτος + ἀκτίς", "roots": "", "meaning": "first beam element", "notes": "descriptive?"}]}, "92": {"number": 92, "symbol": "U", "name": "Uranium", "meaning": "sky", "origin_word": "Οὐρανός ( Ouranos ); \"Uranus\"", "origin_language": "Greek via Latin", "origin_type": "astrological; mythological", "summary": "Named after the planet Uranus , which had been discovered eight years earlier in 1781. The planet was named after the god Uranus , the god of sky and heaven in Greek mythology .", "etymology_lines": [{"language": "Greek via Latin", "word": "Οὐρανός ( Ouranos ); \"Uranus\"", "roots": "", "meaning": "sky", "notes": "astrological; mythological"}]}, "93": {"number": 93, "symbol": "Np", "name": "Neptunium", "meaning": "Neptune", "origin_word": "Neptunus", "origin_language": "Latin", "origin_type": "astrological; mythological", "summary": "Named after Neptune , the planet. The planet itself was named after Neptune , the god of oceans in Roman mythology.", "etymology_lines": [{"language": "Latin", "word": "Neptunus", "roots": "", "meaning": "Neptune", "notes": "astrological; mythological"}]}, "94": {"number": 94, "symbol": "Pu", "name": "Plutonium", "meaning": "god of wealth", "origin_word": "Πλούτων ( Ploutōn ) via \"Pluto\"", "origin_language": "Greek via Latin", "origin_type": "astrological; mythological", "summary": "Named after the dwarf planet Pluto (then considered to be the ninth planet), because it was discovered directly after element neptunium ( § Np ) and is higher than element uranium ( § U ) in the periodic table . Thus, plutonium was named by analogy with the ordering of the planets, ending with Pluto. Pluto itself was named after Pluto , a Greek god of the dead. Greek Πλούτων ( Ploutōn ) is related to the word πλοῦτος ( ploutos ) meaning \"wealth\".", "etymology_lines": [{"language": "Greek via Latin", "word": "Πλούτων ( Ploutōn ) via \"Pluto\"", "roots": "", "meaning": "god of wealth", "notes": "astrological; mythological"}]}, "95": {"number": 95, "symbol": "Am", "name": "Americium", "meaning": "", "origin_word": "America", "origin_language": "", "origin_type": "toponym", "summary": "Named after the Americas, because it was discovered in the United States; by analogy with europium ( § Eu ). The name of the continent America itself is derived from the name of the Italian navigator Amerigo Vespucci .", "etymology_lines": [{"language": "Unspecified", "word": "America", "roots": "", "meaning": "", "notes": "toponym"}]}, "96": {"number": 96, "symbol": "Cm", "name": "Curium", "meaning": "", "origin_word": "Curie, Marie and Pierre", "origin_language": "", "origin_type": "eponym", "summary": "Named in honour of Marie and Pierre Curie , who discovered radium and researched radioactivity .", "etymology_lines": [{"language": "Unspecified", "word": "Curie, Marie and Pierre", "roots": "", "meaning": "", "notes": "eponym"}]}, "97": {"number": 97, "symbol": "Bk", "name": "Berkelium", "meaning": "", "origin_word": "University of California, Berkeley", "origin_language": "Anglo-Saxon via English", "origin_type": "toponym", "summary": "Named after the University of California, Berkeley , where it was discovered. The city of Berkeley itself was     const gap = 0.3;

    const listGrid = document.getElementById('listGrid');

    const costTableBody = document.getElementById('costTableBody');

    const sortDirectionButton = document.getElementById('sortDirection');
    const ACTIVE_TAB_KEY = 'periodicTable.activeTab';
    const COST_SORT_MODE_KEY = 'periodicTable.costSortMode';
    const COST_SORT_DIRECTION_KEY = 'periodicTable.costSortDirection';
    let etymologyData = {};
    let selectedAtomicNumber = 1;
    let costSortMode = localStorage.getItem(COST_SORT_MODE_KEY) || 'gram';
    let costSortDirection = localStorage.getItem(COST_SORT_DIRECTION_KEY) || 'asc';

    function svg(tagName, attrs, textContent) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tagName);
      for (const key in attrs) el.setAttribute(key, attrs[key]);
      if (textContent != null) el.textContent = textContent;
      return el;
    }

    function tableCoords(i) {
      const rightAlign = [[2,1],[10,6],[18,6],[36,16],[54,16],[86,16],[118,16],[70,14],[102,14]];
      for (const [idx, [right, range]] of rightAlign.entries()) {
        if (i <= right && i > right - range) {
          const isLanthanide = right === 70 || right === 102;
          return [
            w - 1 - right + i + (isLanthanide ? -2 : 0),
            isLanthanide ? h - 2 + Math.floor(i / 89) : idx
          ];
        }
      }

      const leftAlign = [1,3,11,19,37,55,87];
      for (const [idx, left] of leftAlign.entries()) {
        if (i >= left && i < left + 2) return [i - left, idx];
      }
      return [-1, -1];
    }

    function pickImage(base) {
      return Promise.resolve(`${base}.png`);
    }

    function setSelectedCell() {
      canvas.querySelectorAll('.cell-button').forEach((node) => {
        node.classList.toggle('selected', Number(node.dataset.atomicNumber) === selectedAtomicNumber);
      });
    }

    function renderDetail() {
      const entry = etymologyData[String(selectedAtomicNumber)];
      if (!entry) {
        detailPane.innerHTML = '<h2>No etymology entry</h2><p>This element currently has no structured trace in the local JSON.</p>';
        return;
      }

      detailPane.innerHTML = `
        <div class="meta-kicker">${entry.symbol} · ${entry.number}</div>
        <h2>${escapeHtml(entry.name)}</h2>
        <p><strong>Gloss:</strong> ${escapeHtml(entry.meaning || '—')}</p>
        ${entry.summary ? `<p>${escapeHtml(entry.summary)}</p>` : ''}
        ${renderTraceTable(entry.etymology_lines || [])}
      `;
      setSelectedCell();
    }

    async function buildTable() {
      canvas.innerHTML = '';
      for (let i = 1; i < 119; i++) {
        const [x, y] = tableCoords(i);
        if (x < 0 || y < 0) continue;

        const g = svg('g', {
          transform: `translate(${x},${y})`,
          class: 'cell-button',
          tabindex: '0',
          role: 'button',
          'data-atomic-number': i,
          'aria-label': `${symbols[i]} ${i}`
        });
        g.addEventListener('click', () => {
          selectedAtomicNumber = i;
          renderDetail();
        });
        g.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            selectedAtomicNumber = i;
            renderDetail();
          }
        });
        canvas.append(g);

        g.append(svg('rect', { x: 0, y: 0, width: 1, height: 1, fill: 'none' }));
        const img = svg('image', { width: 1, height: 1, preserveAspectRatio: 'xMidYMin slice' });
        g.append(img);
        pickImage(i).then((url) => {
          if (url) img.setAttribute('href', url);
        });
        g.append(svg('text', {
          x: 0.2, y: 0.25, 'font-size': 0.25, stroke: 'none', fill: 'black',
          'text-anchor': 'middle', 'dominant-baseline': 'middle',
          style: `text-shadow:${textShadow}`
        }, i));
        g.append(svg('text', {
          x: 0.5, y: 0.68, 'font-size': 0.5, stroke: 'none', fill: 'black',
          'text-anchor': 'middle', 'dominant-baseline': 'middle',
          style: `text-shadow:${textShadow}`
        }, symbols[i]));
        g.append(svg('rect', {
          x: 0.02, y: 0.02, width: 0.96, height: 0.96,
          fill: 'none', stroke: '#000000', 'stroke-width': 0.04,
          opacity: 0, class: 'selection-ring'
        }));
      }

      canvas.append(svg('path', {
        d: `M${2},${7} v-2 l${gap},${gap + 2} v2 z`,
        fill: 'black'
      }));
      renderDetail();
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    function renderCell(value) {
      const text = String(value || '').trim();
      if (!text) return '<td class="empty-cell">—</td>';
      return `<td>${escapeHtml(text)}</td>`;
    }

    function renderTraceTable(lines) {
      if (!lines.length) return '<p>No structured etymology lines.</p>';
      const rows = lines.map((line) => `
        <tr>
          ${renderCell(line.language)}
          ${renderCell(line.word)}
          ${renderCell(line.roots)}
          ${renderCell(line.meaning)}
          ${renderCell(line.notes)}
        </tr>
      `).join('');
      return `
        <div class="trace-table-wrap">
          <table class="trace-table">
            <thead>
              <tr>
                <th>Language</th>
                <th>Word</th>
                <th>Roots</th>
                <th>Meaning</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function formatUsd(value, digits = 2) {
      if (value == null || Number.isNaN(Number(value))) return '—';
      return `$${Number(value).toLocaleString(undefined, {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      })}`;
    }

    function priceDigits(value) {
      if (value == null || Number.isNaN(Number(value))) return 2;
      const num = Number(value);
      if (num < 0.1) return 4;
      if (num < 1) return 3;
      return 2;
    }

    function renderRankList(rows) {
      return `
        <ol class="rank-list">
          ${rows.map((row) => `
            <li>
              <strong>${escapeHtml(row.element_name)}</strong> (${escapeHtml(row.symbol)}) ·
              ${costSortMode === 'gram'
                ? `${formatUsd(row.price_per_g_usd, priceDigits(row.price_per_g_usd))}/g`
                : `${formatUsd(row.price_per_cm3_usd, priceDigits(row.price_per_cm3_usd))}/cm^3`}
            </li>
          `).join('')}
        </ol>
      `;
    }

    function renderCostView() {
      const payload = window.LUCITERIA_CHEAPEST_PER_GRAM;
      if (!payload || !payload.rows || !payload.rows.length) {
        costSummary.textContent = 'No price-per-gram data loaded.';
        costHighlightGrid.innerHTML = '';
        costTableBody.innerHTML = '';
        return;
      }

      const pricedRows = payload.rows.filter((row) => row.price_per_g_usd != null);
      const unpricedRows = payload.rows.filter((row) => row.price_per_g_usd == null);
      const rows = [...pricedRows]
        .map((row) => ({
          ...row,
          price_per_cm3_usd:
            row.price_per_g_usd != null && row.density_g_per_cm3 != null
              ? Number(row.price_per_g_usd) * Number(row.density_g_per_cm3)
              : null
        }))
        .sort((a, b) => {
          const aValue = costSortMode === 'gram' ? a.price_per_g_usd : a.price_per_cm3_usd;
          const bValue = costSortMode === 'gram' ? b.price_per_g_usd : b.price_per_cm3_usd;
          if (aValue == null && bValue == null) return (a.atomic_number ?? 999) - (b.atomic_number ?? 999);
          if (aValue == null) return 1;
          if (bValue == null) return -1;
          return costSortDirection === 'asc' ? aValue - bValue : bValue - aValue;
        });
      const unavailableRows = [...unpricedRows].sort((a, b) => (a.atomic_number ?? 999) - (b.atomic_number ?? 999));
      const cheapest = [...rows].sort((a, b) => (a.price_per_g_usd ?? Infinity) - (b.price_per_g_usd ?? Infinity)).slice(0, 10);
      const mostExpensive = [...rows].sort((a, b) => (b.price_per_g_usd ?? -Infinity) - (a.price_per_g_usd ?? -Infinity)).slice(0, 10);
      const cheapestByVolume = [...rows].sort((a, b) => (a.price_per_cm3_usd ?? Infinity) - (b.price_per_cm3_usd ?? Infinity)).slice(0, 10);
      const mostExpensiveByVolume = [...rows].sort((a, b) => (b.price_per_cm3_usd ?? -Infinity) - (a.price_per_cm3_usd ?? -Infinity)).slice(0, 10);

      sortByVolumeButton.setAttribute('aria-pressed', String(costSortMode === 'volume'));
      sortDirectionButton.textContent = costSortDirection === 'asc' ? 'Increasing' : 'Decreasing';
      sortDirectionButton.setAttribute('aria-pressed', String(costSortDirection === 'desc'));
      costSummary.textContent =
        costSortMode === 'gram'
          ? `${rows.length} elements have a usable cheapest-offer USD/g from Luciteria and ${unavailableRows.length} do not appear in the current market dataset. Table is sorted ${costSortDirection === 'asc' ? 'from cheapest to most expensive' : 'from most expensive to cheapest'} by mass, then lists unavailable elements.`
          : `${rows.length} elements have a usable cheapest-offer USD/g from Luciteria and ${unavailableRows.length} do not appear in the current market dataset. USD/cm^3 is derived from density; table is sorted ${costSortDirection === 'asc' ? 'from cheapest to most expensive' : 'from most expensive to cheapest'} by volume, then lists unavailable elements.`;
      costHighlightGrid.innerHTML = `
        <article class="cost-highlight-card">
          <h3>${costSortMode === 'gram' ? 'Cheapest per gram' : 'Cheapest per cubic centimeter'}</h3>
          ${renderRankList(costSortMode === 'gram' ? cheapest : cheapestByVolume)}
        </article>
        <article class="cost-highlight-card">
          <h3>${costSortMode === 'gram' ? 'Most expensive per gram' : 'Most expensive per cubic centimeter'}</h3>
          ${renderRankList(costSortMode === 'gram' ? mostExpensive : mostExpensiveByVolume)}
        </article>
      `;
      let cumulativeGram = 0;
      let cumulativeVolume = 0;
      const pricedTableRows = rows.map((row, index) => {
        cumulativeGram += Number(row.price_per_g_usd ?? 0);
        cumulativeVolume += Number(row.price_per_cm3_usd ?? 0);
        return `
          <tr>
            <td>${index + 1}</td>
            <td>${row.atomic_number ?? '—'}</td>
            <td><strong>${escapeHtml(row.symbol)}</strong></td>
            <td>${escapeHtml(row.element_name)}</td>
            <td>${formatUsd(row.price_per_g_usd, priceDigits(row.price_per_g_usd))}</td>
            <td>${formatUsd(cumulativeGram, priceDigits(cumulativeGram))}</td>
            <td>${formatUsd(row.price_per_cm3_usd, priceDigits(row.price_per_cm3_usd))}</td>
            <td>${formatUsd(cumulativeVolume, priceDigits(cumulativeVolume))}</td>
            <td>For sale</td>
            <td>available</td>
            <td>${escapeHtml(row.purity_label || '—')}</td>
            <td class="wrap">${row.url ? `<a href="${escapeHtml(row.url)}">${escapeHtml(row.variant_label || 'link')}</a>` : escapeHtml(row.variant_label || '—')}</td>
            <td>${row.density_g_per_cm3 != null ? Number(row.density_g_per_cm3).toFixed(2) : '—'}</td>
          </tr>
        `;
      }).join('');
      const unavailableTableRows = unavailableRows.map((row) => `
        <tr>
          <td>—</td>
          <td>${row.atomic_number ?? '—'}</td>
          <td><strong>${escapeHtml(row.symbol)}</strong></td>
          <td>${escapeHtml(row.element_name)}</td>
          <td>—</td>
          <td>${formatUsd(cumulativeGram, priceDigits(cumulativeGram))}</td>
          <td>—</td>
          <td>${formatUsd(cumulativeVolume, priceDigits(cumulativeVolume))}</td>
          <td>Not for sale</td>
          <td class="wrap">${escapeHtml(row.availability_reason || 'not_listed')}<br>${escapeHtml(row.availability_note || '')}</td>
          <td>—</td>
          <td class="wrap">—</td>
          <td>—</td>
        </tr>
      `).join('');
      costTableBody.innerHTML = pricedTableRows + unavailableTableRows;
    }

    function setupCostControls() {
      sortByGramButton.addEventListener('click', () => {
        costSortMode = 'gram';
        localStorage.setItem(COST_SORT_MODE_KEY, costSortMode);
        renderCostView();
      });
      sortByVolumeButton.addEventListener('click', () => {
        costSortMode = 'volume';
        localStorage.setItem(COST_SORT_MODE_KEY, costSortMode);
        renderCostView();
      });
      sortDirectionButton.addEventListener('click', () => {
        costSortDirection = costSortDirection === 'asc' ? 'desc' : 'asc';
        localStorage.setItem(COST_SORT_DIRECTION_KEY, costSortDirection);
        renderCostView();
      });
    }

    function listEntries() {
      const query = searchInput.value.trim().toLowerCase();
      const rows = Object.values(etymologyData)
        .sort((a, b) => a.number - b.number)
        .filter((entry) => {
          if (!query) return true;
          const haystack = [
            entry.name,
            entry.symbol,
            entry.meaning,
            entry.origin_word,
            entry.origin_language,
            entry.summary,
            ...(entry.etymology_lines || []).flatMap((line) => [
              line.language,
              line.word,
              line.roots,
              line.meaning,
              line.notes
            ])
          ].join(' ').toLowerCase();
          return haystack.includes(query);
        });

      resultSummary.textContent = `${rows.length} entries`;
      emptyState.hidden = rows.length !== 0;
      listGrid.innerHTML = rows.map((entry) => `
        <article class="card">
          <div class="meta-kicker">${entry.symbol} · ${entry.number}</div>
          <h3>${escapeHtml(entry.name)}</h3>
          <div class="sub">${escapeHtml(entry.meaning || '—')}</div>
          ${renderTraceTable(entry.etymology_lines || [])}
        </article>
      `).join('');
    }

    function setupTabs() {
      document.querySelectorAll('.tab-button').forEach((button) => {
        button.addEventListener('click', () => {
          const view = button.dataset.view;
          localStorage.setItem(ACTIVE_TAB_KEY, view);
          document.querySelectorAll('.tab-button').forEach((node) => {
            node.setAttribute('aria-selected', String(node === button));
          });
          document.querySelectorAll('.view').forEach((node) => {
            node.classList.toggle('active', node.id === `${view}View`);
          });
        });
      });
    }

    function restoreActiveTab() {
      const activeView = localStorage.getItem(ACTIVE_TAB_KEY) || 'layout';
      const activeButton = document.querySelector(`.tab-button[data-view="${activeView}"]`);
      if (activeButton) activeButton.click();
    }

    async function init() {
      setupTabs();
      setupCostControls();
      searchInput.addEventListener('input', listEntries);
      etymologyData = window.ETYMOLOGY_TRACES || {};
      await buildTable();
      listEntries();
      renderCostView();
      restoreActiveTab();
    }

    init();
  </script>
</body>
</html>
