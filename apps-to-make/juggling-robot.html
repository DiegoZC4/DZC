<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juggling Robot Bench</title><link rel="stylesheet" href="draft.css"><style>
.stage{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:1rem}.sim{min-height:340px;border-radius:18px;background:linear-gradient(#dbe7e2,#b8cec4);box-shadow:var(--shadow);overflow:hidden}canvas{width:100%;height:100%;display:block}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.metrics div{border-top:3px solid var(--accent);padding:.55rem}.metrics strong{display:block;font:1.7rem "Draft Serif",serif}.feasible{padding:.75rem;border-left:4px solid var(--good);background:#fff8}.feasible.warn{border-color:var(--accent-2)}@media(max-width:720px){.metrics{grid-template-columns:1fr 1fr}.sim{min-height:55dvh}}
</style></head><body><main class="app"><header class="topbar"><h1>Juggling Robot Bench</h1><span class="kicker">ballistic timing before hardware</span></header><div class="workspace"><aside class="sidebar stack"><label>Balls <span class="mono" id="ballsOut"></span><input id="balls" type="range" min="2" max="9" value="3"></label><label>Throw height <span class="mono" id="heightOut"></span><input id="height" type="range" min=".15" max="2.5" step=".01" value=".75"></label><label>Hand separation <span class="mono" id="separationOut"></span><input id="separation" type="range" min=".1" max="1.2" step=".01" value=".45"></label><label>Gravity <span class="mono" id="gravityOut"></span><input id="gravity" type="range" min="1" max="15" step=".01" value="9.81"></label><label>Playback speed<input id="speed" type="range" min=".1" max="2" step=".05" value="1"></label><button class="primary" id="pause">Pause</button><div class="feasible" id="feasible"></div><p class="muted">The first draft treats catches and releases as instantaneous and solves a symmetric cascade. Dwell time, gripper travel, collision margins, and motor torque remain to be modeled.</p></aside><section class="stage"><div class="sim"><canvas id="canvas"></canvas></div><div class="metrics panel"><div><span class="eyebrow">Flight time</span><strong id="flight"></strong></div><div><span class="eyebrow">Throw rate</span><strong id="rate"></strong></div><div><span class="eyebrow">Vertical speed</span><strong id="vy"></strong></div><div><span class="eyebrow">Lateral speed</span><strong id="vx"></strong></div></div></section></div></main><script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),colors=['#d25532','#006f78','#e0a43b','#795a9c','#5c8a52','#c06e99','#4b6c9c','#8c6a42','#5e7771'];let playing=true,clock=0,last=performance.now();
function params(){const n=+$('balls').value,h=+$('height').value,g=+$('gravity').value,s=+$('separation').value,T=Math.sqrt(8*h/g);return{n,h,g,s,T,rate:n/T,vy:Math.sqrt(2*g*h),vx:s/T}}
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}window.onresize=resize;resize();
function update(){const p=params();$('ballsOut').textContent=p.n;$('heightOut').textContent=p.h.toFixed(2)+' m';$('separationOut').textContent=p.s.toFixed(2)+' m';$('gravityOut').textContent=p.g.toFixed(2)+' m/s²';$('flight').textContent=p.T.toFixed(2)+' s';$('rate').textContent=p.rate.toFixed(2)+' /s';$('vy').textContent=p.vy.toFixed(2)+' m/s';$('vx').textContent=p.vx.toFixed(2)+' m/s';const demanding=p.rate>6||p.vy>6;$('feasible').className='feasible'+(demanding?' warn':'');$('feasible').textContent=demanding?'Demanding timing: expect high actuator speed or missed catches.':'Timing is within a plausible benchtop range; torque still needs checking.'}
function drawRobot(w,h,left,right,baseY){ctx.strokeStyle='#263735';ctx.lineWidth=18;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(w/2,baseY+90);ctx.lineTo(w/2,baseY+10);ctx.stroke();ctx.fillStyle='#263735';ctx.beginPath();ctx.arc(w/2,baseY-20,34,0,Math.PI*2);ctx.fill();for(const hand of [left,right]){ctx.strokeStyle='#4d6d68';ctx.lineWidth=16;ctx.beginPath();ctx.moveTo(w/2,baseY+20);ctx.lineTo((w/2+hand)/2,baseY+65);ctx.lineTo(hand,baseY);ctx.stroke();ctx.fillStyle='#d6a65b';ctx.beginPath();ctx.arc(hand,baseY,13,0,Math.PI*2);ctx.fill()}}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight,p=params(),baseY=h*.72,scale=Math.min(h*.48/(p.h+0.2),w*.35/(p.s||.1)),left=w/2-p.s*scale/2,right=w/2+p.s*scale/2;ctx.clearRect(0,0,w,h);ctx.fillStyle='#dbe7e2';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#78988a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,baseY+105);ctx.lineTo(w,baseY+105);ctx.stroke();drawRobot(w,h,left,right,baseY);for(let i=0;i<p.n;i++){const q=(clock+i*p.T/p.n)%(2*p.T),leg=Math.floor(q/p.T),u=(q%p.T)/p.T,from=(i+leg)%2?right:left,to=(i+leg)%2?left:right,x=from+(to-from)*u,y=baseY-4*p.h*scale*u*(1-u);ctx.fillStyle=colors[i%colors.length];ctx.beginPath();ctx.arc(x,y,Math.max(8,Math.min(15,scale*.04)),0,Math.PI*2);ctx.fill();ctx.strokeStyle='#263735';ctx.lineWidth=2;ctx.stroke()}requestAnimationFrame(frame)}
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(playing)clock+=dt*+$('speed').value;draw()}['balls','height','separation','gravity'].forEach(id=>$(id).oninput=update);$('pause').onclick=()=>{playing=!playing;$('pause').textContent=playing?'Pause':'Resume'};update();requestAnimationFrame(frame);
</script></body></html>
