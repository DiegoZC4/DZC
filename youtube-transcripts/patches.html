<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Transcript Uncensored Candidates</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff0000'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='28' font-weight='900' fill='white'%3ECC%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f7f7f4;
  --ink: #181818;
  --muted: #6f706c;
  --line: #d9d8d0;
  --panel: #ffffff;
  --accent: #cc241d;
  --accent-soft: #fff0ef;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { padding: 14px clamp(10px, 1.6vw, 28px) 42px; width: 100%; }
.topbar { align-items: center; display: flex; gap: 12px; justify-content: space-between; margin-bottom: 12px; }
.meta { color: var(--muted); font-size: 14px; min-height: 22px; }
.page-nav { align-items: center; display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; }
.page-nav a { color: var(--accent); font-size: 14px; font-weight: 850; text-decoration: none; }
.toolbar { align-items: center; display: flex; justify-content: flex-end; margin-bottom: 10px; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; color: var(--ink); cursor: pointer; font: inherit; font-size: 13px; font-weight: 850; min-height: 36px; padding: 0 11px; }
.player-panel { background: #111; border: 1px solid rgba(0, 0, 0, 0.35); border-radius: 7px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22); display: none; left: 10px; padding: 3px; position: fixed; top: 10px; width: min(220px, calc(100vw - 20px)); z-index: 20; }
.player-panel[data-open="true"] { display: block; }
.player-top { height: 0; position: relative; }
.player-title { height: 1px; left: -9999px; overflow: hidden; position: absolute; top: auto; width: 1px; }
.player-top button { align-items: center; background: rgba(24, 24, 24, 0.78); border: 1px solid rgba(255, 255, 255, 0.32); border-radius: 999px; color: #fff; display: inline-flex; font-size: 15px; height: 22px; justify-content: center; line-height: 1; min-height: 0; padding: 0; position: absolute; right: -7px; top: -7px; width: 22px; z-index: 2; }
.player-frame { aspect-ratio: 16 / 9; background: #111; border: 0; border-radius: 5px; display: block; width: 100%; }
.patch-results { display: grid; gap: 9px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
.patch-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: grid; gap: 8px; padding: 9px 10px; }
.patch-card-top { align-items: center; display: grid; gap: 8px; grid-template-columns: 24px minmax(0, 1fr) auto; }
.channel-avatar { background: var(--category-soft, #e2e8f0); border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 50%; color: var(--category-ink, var(--muted)); display: inline-grid; font-size: 10px; font-weight: 950; height: 24px; line-height: 1; object-fit: cover; overflow: hidden; place-items: center; text-transform: uppercase; width: 24px; }
.patch-title { font-size: 14px; font-weight: 850; line-height: 1.22; overflow-wrap: anywhere; }
.patch-meta { color: var(--muted); font-size: 12px; font-weight: 750; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.patch-status { background: var(--accent-soft); border: 1px solid #ffd2cf; border-radius: 999px; color: var(--accent); font-size: 12px; font-weight: 900; padding: 3px 8px; white-space: nowrap; }
.patch-body { border-top: 1px solid var(--line); display: grid; gap: 4px; padding-top: 7px; }
.patch-window { color: #30302e; font-size: 13.5px; line-height: 1.34; overflow-wrap: anywhere; }
.patch-time { color: var(--muted); display: inline-block; font-size: 12px; font-weight: 900; margin-right: 5px; text-decoration: none; white-space: nowrap; }
.patch-word { background: var(--accent-soft); border-radius: 4px; color: var(--accent); cursor: pointer; font-weight: 950; padding: 0 2px; text-decoration: none; }
.patch-word:hover { text-decoration: underline; }
.patch-missing { background: #f3f4f0; border-radius: 4px; color: #777a70; cursor: pointer; font-weight: 900; padding: 0 2px; text-decoration: none; }
.patch-missing:hover { text-decoration: underline; }
.empty { color: var(--muted); padding: 18px 0; }
@media (max-width: 680px) {
  .topbar { align-items: flex-start; flex-direction: column; }
  .page-nav { justify-content: flex-start; }
  .patch-results { grid-template-columns: 1fr; }
  .patch-card-top { grid-template-columns: 24px minmax(0, 1fr); }
  .patch-status { justify-self: start; grid-column: 2; }
}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="meta" id="patchMeta">Loading decensor candidates...</div>
    <div class="page-nav">
      <a href="index.html">Search</a>
      <a href="stats.html">Stats</a>
    </div>
  </div>
  <div class="toolbar">
    <button id="refreshPatches" type="button">Refresh</button>
  </div>
  <section class="player-panel" id="patchPlayerPanel" data-open="false">
    <div class="player-top">
      <div class="player-title" id="patchPlayerTitle"></div>
      <button id="closePatchPlayer" type="button" aria-label="Close player">&times;</button>
    </div>
    <iframe class="player-frame" id="patchPlayer" title="YouTube preview" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
  </section>
  <section class="patch-results" id="patchResults"></section>
</main>
<script>
const patchMeta = document.getElementById('patchMeta');
const patchResults = document.getElementById('patchResults');
const refreshPatches = document.getElementById('refreshPatches');
const patchPlayerPanel = document.getElementById('patchPlayerPanel');
const patchPlayer = document.getElementById('patchPlayer');
const patchPlayerTitle = document.getElementById('patchPlayerTitle');
const closePatchPlayer = document.getElementById('closePatchPlayer');
const CANDIDATE_START = '\uE000';
const CANDIDATE_END = '\uE001';
let channelByName = new Map();

const CATEGORY_STYLES = {
  AI: { accent: '#2563eb', bg: '#f4f8ff', soft: '#dbeafe', chip: '#eff6ff', ink: '#1d4ed8', line: '#bfdbfe' },
  Comedy: { accent: '#db2777', bg: '#fff5fa', soft: '#fce7f3', chip: '#fdf2f8', ink: '#be185d', line: '#fbcfe8' },
  Engineering: { accent: '#0891b2', bg: '#f0fbff', soft: '#cffafe', chip: '#ecfeff', ink: '#0e7490', line: '#a5f3fc' },
  Fitness: { accent: '#16a34a', bg: '#f3fbf5', soft: '#dcfce7', chip: '#f0fdf4', ink: '#15803d', line: '#bbf7d0' },
  Food: { accent: '#c2410c', bg: '#fff7ed', soft: '#fed7aa', chip: '#ffedd5', ink: '#9a3412', line: '#fdba74' },
  Health: { accent: '#059669', bg: '#f0fdf8', soft: '#d1fae5', chip: '#ecfdf5', ink: '#047857', line: '#a7f3d0' },
  Math: { accent: '#7c3aed', bg: '#f8f5ff', soft: '#ede9fe', chip: '#f5f3ff', ink: '#6d28d9', line: '#ddd6fe' },
  Music: { accent: '#d97706', bg: '#fff9ed', soft: '#fef3c7', chip: '#fffbeb', ink: '#b45309', line: '#fde68a' },
  Philosophy: { accent: '#4f46e5', bg: '#f5f6ff', soft: '#e0e7ff', chip: '#eef2ff', ink: '#4338ca', line: '#c7d2fe' },
  Science: { accent: '#0d9488', bg: '#f0fdfa', soft: '#ccfbf1', chip: '#f0fdfa', ink: '#0f766e', line: '#99f6e4' },
  Other: { accent: '#64748b', bg: '#f8fafc', soft: '#e2e8f0', chip: '#f1f5f9', ink: '#475569', line: '#cbd5e1' }
};

init();

async function init() {
  refreshPatches.addEventListener('click', () => loadPatches());
  closePatchPlayer.addEventListener('click', () => {
    patchPlayerPanel.dataset.open = 'false';
    patchPlayer.src = 'about:blank';
  });
  await loadChannels();
  await loadPatches();
}

async function loadChannels() {
  try {
    const payload = await getJson('api.php?action=channels');
    channelByName = new Map((payload.channels || []).map(row => [row.channel, row]));
  } catch {
    channelByName = new Map();
  }
}

async function loadPatches() {
  patchMeta.textContent = 'Loading decensor candidates...';
  patchResults.innerHTML = '';
  const loadStarted = performance.now();
  try {
    const payload = await getJson('api.php?action=patches&limit=200');
    const fetchedAt = performance.now();
    const summaryText = renderPatches(payload.patches || {});
    const renderedAt = performance.now();
    patchMeta.textContent = `${summaryText} · ${formatPatchTiming(payload.timing || {}, {
      total_ms: renderedAt - loadStarted,
      fetch_parse_ms: fetchedAt - loadStarted,
      render_ms: renderedAt - fetchedAt
    })}`;
  } catch (error) {
    const failedAt = performance.now();
    patchMeta.textContent = error.message;
    if (Number.isFinite(failedAt - loadStarted)) {
      patchMeta.textContent += ` · browser ${formatMs(failedAt - loadStarted)}`;
    }
    patchResults.innerHTML = '';
  }
}

function renderPatches(payload) {
  const markers = payload.markers || [];
  const groups = groupPatchMarkers(markers);
  const videoCount = new Set(markers.map(item => item.video_id)).size;
  if (markers.length) {
    const suggested = markers.filter(markerHasProposal).length;
    const missing = markers.length - suggested;
    patchMeta.textContent = `${groups.length} card${groups.length === 1 ? '' : 's'} · ${suggested} suggested · ${missing} unpatched from ${videoCount} video${videoCount === 1 ? '' : 's'}`;
  } else {
    patchMeta.textContent = 'No decensor candidates yet.';
  }

  if (!markers.length) {
    patchResults.innerHTML = '<div class="empty">No decensor candidates recorded yet.</div>';
    return patchMeta.textContent;
  }

  const fragment = document.createDocumentFragment();
  for (const group of groups) {
    const first = group.markers[0];
    const article = document.createElement('article');
    article.className = 'patch-card';
    article.innerHTML = `
      <div class="patch-card-top">
        <span class="avatar-slot"></span>
        <div>
          <div class="patch-title"></div>
          <div class="patch-meta"></div>
        </div>
        <div class="patch-status"></div>
      </div>
      <div class="patch-body"></div>
    `;
    article.querySelector('.avatar-slot').replaceWith(channelAvatarElement(first.channel || ''));
    article.querySelector('.patch-title').textContent = first.title || first.video_id || '';
    article.querySelector('.patch-meta').textContent = `${first.channel || ''} · ${patchFractionText(group)} suggested`;
    article.querySelector('.patch-status').textContent = `${group.suggestedCount}/${group.totalCensorCount || group.markers.length} censors`;

    const body = article.querySelector('.patch-body');
    for (const windowGroup of group.windows) {
      const windowElement = document.createElement('section');
      windowElement.className = 'patch-window';
      renderPatchWindow(windowElement, windowGroup);
      body.appendChild(windowElement);
    }
    fragment.appendChild(article);
  }
  patchResults.replaceChildren(fragment);
  return patchMeta.textContent;
}

function formatPatchTiming(serverTiming, browserTiming) {
  const parts = [
    `browser ${formatMs(browserTiming.total_ms)}`,
    `fetch ${formatMs(browserTiming.fetch_parse_ms)}`,
    `render ${formatMs(browserTiming.render_ms)}`
  ];
  if (Number.isFinite(Number(serverTiming.total_ms))) {
    parts.push(`server ${formatMs(serverTiming.total_ms)}`);
  }
  const detailParts = [
    ['db videos', serverTiming.video_query_ms],
    ['db proposals', serverTiming.proposal_query_ms],
    ['marker scan', serverTiming.marker_offset_ms],
    ['payload', serverTiming.payload_ms]
  ]
    .filter(([, value]) => Number.isFinite(Number(value)))
    .map(([label, value]) => `${label} ${formatMs(value)}`);
  if (detailParts.length) parts.push(detailParts.join(', '));
  return parts.join(' · ');
}

function formatMs(ms) {
  const value = Number(ms);
  if (!Number.isFinite(value)) return 'n/a';
  return value >= 1000 ? `${(value / 1000).toFixed(2)}s` : `${value.toFixed(0)}ms`;
}

function patchFractionText(group) {
  const first = group.markers[0] || {};
  const suggested = Number(first.video_suggested_count || group.suggestedCount || 0);
  const total = Number(first.video_censor_count || group.totalCensorCount || 0);
  if (Number.isFinite(suggested) && Number.isFinite(total) && total > 0) {
    return `${suggested}/${total}`;
  }
  return String(suggested || group.markers.length);
}

function groupPatchMarkers(markers) {
  const groupsByKey = new Map();
  for (const marker of markers) {
    const key = `${marker.run_id}:${marker.video_id}`;
    if (!groupsByKey.has(key)) {
      groupsByKey.set(key, { key, markers: [], windowsByKey: new Map(), suggestedStarts: new Set(), totalCensorCount: 0 });
    }
    const group = groupsByKey.get(key);
    group.markers.push(marker);
    if (markerHasProposal(marker)) group.suggestedStarts.add(Number(marker.marker_char_start));
    group.totalCensorCount = Math.max(group.totalCensorCount, Number(marker.video_censor_count || 0));
    const windowKey = String(marker.window_index);
    if (!group.windowsByKey.has(windowKey)) {
      group.windowsByKey.set(windowKey, {
        index: marker.window_index,
        start: marker.window_start_timestamp,
        end: marker.window_end_timestamp,
        cueStartChar: Number(marker.cue_start_char ?? marker.window_index ?? marker.marker_char_start ?? 0),
        cueText: marker.cue_text || marker.youtube_excerpt || '',
        text: stripPatchMarkers(marker.stt_text || marker.stt_excerpt || ''),
        markers: []
      });
    }
    const windowGroup = group.windowsByKey.get(windowKey);
    if (!windowGroup.cueText && (marker.cue_text || marker.youtube_excerpt)) {
      windowGroup.cueText = marker.cue_text || marker.youtube_excerpt || '';
    }
    if (!windowGroup.text && (marker.stt_text || marker.stt_excerpt)) {
      windowGroup.text = stripPatchMarkers(marker.stt_text || marker.stt_excerpt || '');
    }
    windowGroup.markers.push(marker);
  }
  return [...groupsByKey.values()]
    .map(group => ({
      ...group,
      suggestedCount: Number(group.markers[0]?.video_suggested_count || group.suggestedStarts.size),
      markers: group.markers.sort((a, b) => Number(a.marker_start_seconds) - Number(b.marker_start_seconds)),
      windows: [...group.windowsByKey.values()]
        .map(windowGroup => ({
          ...windowGroup,
          markers: windowGroup.markers.sort((a, b) => Number(a.marker_start_seconds) - Number(b.marker_start_seconds))
        }))
        .sort((a, b) => Number(a.index) - Number(b.index))
    }))
    .sort((a, b) => {
      const totalCount = patchDenominator(a) - patchDenominator(b);
      if (totalCount) return totalCount;
      const patchCount = a.suggestedCount - b.suggestedCount;
      if (patchCount) return patchCount;
      const firstA = a.markers[0] || {};
      const firstB = b.markers[0] || {};
      return String(firstA.channel || '').localeCompare(String(firstB.channel || ''), undefined, { sensitivity: 'base' })
        || String(firstA.title || '').localeCompare(String(firstB.title || ''), undefined, { sensitivity: 'base' })
        || String(firstA.video_id || '').localeCompare(String(firstB.video_id || ''));
    });
}

function patchDenominator(group) {
  return Number(group.totalCensorCount || group.markers[0]?.video_censor_count || group.markers.length || 0);
}

function renderPatchWindow(container, windowGroup) {
  const line = document.createElement('div');
  line.className = 'patch-cue-line';
  const primaryMarker = windowGroup.markers[0] || {};
  const time = document.createElement('a');
  time.className = 'patch-time';
  time.href = markerUrl(primaryMarker);
  time.textContent = windowGroup.start || primaryMarker.marker_timestamp || '0:00';
  time.title = 'Preview this cue';
  time.addEventListener('click', event => {
    if (isNativeLinkClick(event)) return;
    event.preventDefault();
    openPatchPlayer(primaryMarker);
  });
  line.appendChild(time);
  const cueText = document.createElement('span');
  cueText.className = 'patch-window-text';
  line.appendChild(cueText);
  renderCueText(cueText, windowGroup);
  container.replaceChildren(line);
}

function renderCueText(container, windowGroup) {
  const rawCueText = String(windowGroup.cueText || '');
  if (rawCueText && Number.isFinite(windowGroup.cueStartChar)) {
    const rendered = renderCueTextFromOffsets(container, rawCueText, windowGroup.cueStartChar, windowGroup.markers);
    if (rendered) return;
  }

  const text = windowGroup.text || fallbackPatchText(windowGroup.markers);
  if (text.includes(CANDIDATE_START) && text.includes(CANDIDATE_END)) {
    renderMarkedCandidateText(container, text, windowGroup.markers);
    return;
  }
  const highlights = windowGroup.markers
    .map(marker => ({ marker, text: stripPatchMarkers(marker.replacement_text || marker.candidate_text || '') }))
    .filter(item => item.text);

  if (!text || !highlights.length) {
    container.textContent = text || 'No local STT text for this window.';
    return;
  }

  const fragment = document.createDocumentFragment();
  const lowerText = text.toLowerCase();
  let cursor = 0;
  let matched = 0;
  for (const item of highlights) {
    const needle = item.text.toLowerCase();
    const index = lowerText.indexOf(needle, cursor);
    if (index < 0) continue;
    if (index > cursor) fragment.appendChild(document.createTextNode(text.slice(cursor, index)));
    fragment.appendChild(patchWordElement(text.slice(index, index + item.text.length), item.marker));
    cursor = index + item.text.length;
    matched++;
  }
  if (cursor < text.length) fragment.appendChild(document.createTextNode(text.slice(cursor)));
  container.replaceChildren(matched ? fragment : document.createTextNode(text));
}

function renderCueTextFromOffsets(container, cueText, cueStartChar, markers) {
  const ordered = [...markers].sort((a, b) => Number(a.marker_char_start) - Number(b.marker_char_start));
  const fragment = document.createDocumentFragment();
  let cursor = 0;
  let rendered = 0;
  for (const marker of ordered) {
    const start = Number(marker.marker_char_start) - cueStartChar;
    const end = Number(marker.marker_char_end) - cueStartChar;
    const replacement = stripPatchMarkers(marker.replacement_text || marker.candidate_text || '');
    if (!Number.isFinite(start) || !Number.isFinite(end) || start < cursor || end <= start || end > cueText.length) {
      continue;
    }
    if (start > cursor) fragment.appendChild(document.createTextNode(cueText.slice(cursor, start)));
    fragment.appendChild(replacement ? patchWordElement(replacement, marker) : missingPatchElement(marker));
    cursor = end;
    rendered++;
  }
  if (!rendered) return false;
  if (cursor < cueText.length) fragment.appendChild(document.createTextNode(cueText.slice(cursor)));
  container.appendChild(fragment);
  return true;
}

function renderMarkedCandidateText(container, text, markers = []) {
  const fragment = document.createDocumentFragment();
  let cursor = 0;
  let matched = 0;
  while (cursor < text.length) {
    const start = text.indexOf(CANDIDATE_START, cursor);
    if (start < 0) {
      fragment.appendChild(document.createTextNode(text.slice(cursor)));
      break;
    }
    if (start > cursor) {
      fragment.appendChild(document.createTextNode(text.slice(cursor, start)));
    }
    const end = text.indexOf(CANDIDATE_END, start + CANDIDATE_START.length);
    if (end < 0) {
      fragment.appendChild(document.createTextNode(text.slice(start).replaceAll(CANDIDATE_START, '').replaceAll(CANDIDATE_END, '')));
      break;
    }
    fragment.appendChild(patchWordElement(text.slice(start + CANDIDATE_START.length, end), markers[matched] || markers[0] || {}));
    matched++;
    cursor = end + CANDIDATE_END.length;
  }
  container.replaceChildren(matched ? fragment : document.createTextNode(text.replaceAll(CANDIDATE_START, '').replaceAll(CANDIDATE_END, '')));
}

function patchWordElement(text, marker) {
  const mark = document.createElement('a');
  mark.className = 'patch-word';
  mark.href = markerUrl(marker);
  mark.rel = 'noreferrer';
  mark.title = `${marker.marker_timestamp || '0:00'} · preview`;
  mark.textContent = text;
  mark.addEventListener('click', event => {
    if (isNativeLinkClick(event)) return;
    event.preventDefault();
    openPatchPlayer(marker);
  });
  return mark;
}

function missingPatchElement(marker) {
  const mark = document.createElement('a');
  mark.className = 'patch-missing';
  mark.href = markerUrl(marker);
  mark.rel = 'noreferrer';
  mark.title = `${marker.marker_timestamp || '0:00'} · no proposed patch`;
  mark.textContent = '[ __ ]';
  mark.addEventListener('click', event => {
    if (isNativeLinkClick(event)) return;
    event.preventDefault();
    openPatchPlayer(marker);
  });
  return mark;
}

function markerHasProposal(marker) {
  return Boolean(stripPatchMarkers(marker.replacement_text || marker.candidate_text || ''));
}

function isNativeLinkClick(event) {
  return event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0;
}

function markerUrl(marker) {
  const videoId = marker.youtube_id || marker.video_id || '';
  const seconds = Math.max(0, Math.floor(Number(marker.marker_start_seconds || marker.window_start_seconds || 0)));
  return marker.url || `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}&t=${seconds}s`;
}

function openPatchPlayer(marker) {
  const videoId = marker.youtube_id || marker.video_id || '';
  if (!videoId) return;
  const seconds = Math.max(0, Math.floor(Number(marker.marker_start_seconds || marker.window_start_seconds || 0)));
  patchPlayer.src = `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?start=${seconds}&autoplay=1&rel=0`;
  patchPlayerTitle.textContent = `${marker.title || videoId} · ${marker.marker_timestamp || formatTimestamp(seconds)}`;
  patchPlayerPanel.dataset.open = 'true';
}

function formatTimestamp(totalSeconds) {
  const seconds = Math.max(0, Math.floor(Number(totalSeconds) || 0));
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}

function fallbackPatchText(markers) {
  return markers.map(marker => {
    const before = compactPatchContext(marker.youtube_before || '', 90, true);
    const after = compactPatchContext(marker.youtube_after || '', 110, false);
    const replacement = marker.replacement_text || marker.candidate_text || '';
    return `${before} ${replacement} ${after}`.trim();
  }).join(' ');
}

function compactPatchContext(text, length, fromEnd) {
  const clean = stripPatchMarkers(text).replace(/\s+/g, ' ').trim();
  if (clean.length <= length) return clean;
  return fromEnd ? clean.slice(clean.length - length) : clean.slice(0, length);
}

function stripPatchMarkers(text) {
  return String(text || '')
    .replace(/\[\s*__\s*\]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function channelAvatarElement(channelName) {
  const row = channelByName.get(channelName) || {};
  const category = row.category || inferChannelCategory(channelName);
  const url = row.avatar_url || '';
  const label = `${channelName || 'Channel'} avatar`;
  const element = url ? document.createElement('img') : document.createElement('span');
  element.className = 'channel-avatar';
  element.title = channelName || '';
  element.setAttribute('aria-label', label);
  applyCategoryStyle(element, category);
  if (url) {
    element.src = url;
    element.alt = label;
    element.loading = 'lazy';
    element.decoding = 'async';
    element.referrerPolicy = 'no-referrer';
  } else {
    element.textContent = initialsFor(channelName);
  }
  return element;
}

function applyCategoryStyle(element, category) {
  const style = CATEGORY_STYLES[category] || CATEGORY_STYLES.Other;
  element.style.setProperty('--category-soft', style.soft);
  element.style.setProperty('--category-ink', style.ink);
}

function initialsFor(value) {
  const words = String(value || '?').replace(/&/g, ' ').match(/[A-Za-z0-9]+/g) || ['?'];
  return words.slice(0, 2).map(word => word[0]).join('');
}

async function getJson(url) {
  const response = await fetch(url, { cache: 'no-store' });
  const text = await response.text();
  if (!text.trim()) throw new Error(`Empty API response (${response.status})`);
  let payload;
  try {
    payload = JSON.parse(text);
  } catch {
    const snippet = text.trim().replace(/\s+/g, ' ').slice(0, 140);
    throw new Error(`Invalid API response (${response.status})${snippet ? `: ${snippet}` : ''}`);
  }
  if (!response.ok || !payload.ok) throw new Error(payload.error || `Request failed (${response.status})`);
  return payload;
}
