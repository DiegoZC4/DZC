<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Favicon Preview</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f4f1;
      --panel: #ffffff;
      --text: #161616;
      --muted: #666;
      --border: #d8d8d2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15161a;
        --panel: #202229;
        --text: #f0f0eb;
        --muted: #aaa;
        --border: #363943;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
    }
    main {
      width: min(720px, calc(100vw - 32px));
      padding: 28px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 22px 70px rgba(0, 0, 0, .18);
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.6rem, 5vw, 3rem);
      line-height: 1;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
    }
    .preview {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 28px;
      align-items: center;
    }
    .large {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1;
      image-rendering: auto;
    }
    .sizes {
      display: grid;
      gap: 16px;
      justify-items: center;
    }
    .sample {
      display: grid;
      gap: 6px;
      justify-items: center;
      color: var(--muted);
      font-size: .82rem;
    }
    .sample img {
      display: block;
    }
    @media (max-width: 640px) {
      .preview {
        grid-template-columns: 1fr;
      }
      .sizes {
        grid-template-columns: repeat(3, auto);
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Favicon Preview</h1>
    <p>This page uses <code>favicon.svg</code> as its browser-tab icon and renders the same file below at common favicon sizes.</p>
    <section class="preview" aria-label="Favicon previews">
      <img class="large" src="favicon.svg" alt="Large Penrose triangle favicon preview">
      <div class="sizes">
        <span class="sample"><img src="favicon.svg" width="16" height="16" alt="">16px</span>
        <span class="sample"><img src="favicon.svg" width="32" height="32" alt="">32px</span>
        <span class="sample"><img src="favicon.svg" width="64" height="64" alt="">64px</span>
      </div>
    </section>
  </main>
</body>
</html>
