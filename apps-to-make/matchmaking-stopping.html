<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matchmaking Stop Rule</title><link rel="stylesheet" href="draft.css"><style>
.stage{display:grid;grid-template-rows:minmax(0,1fr) minmax(150px,34%);gap:1rem}.run{display:flex;align-items:end;gap:3px;padding:1rem;background:#172b2e;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.candidate{flex:1;min-width:2px;background:#6d9d96;border-radius:3px 3px 0 0;position:relative}.candidate.observe{background:#687170}.candidate.chosen{background:#ef9a53;box-shadow:0 0 0 3px #fff}.candidate.best::after{content:"★";position:absolute;top:-22px;left:50%;transform:translateX(-50%);color:#f6d365}.chart{background:#fff9;border-radius:16px;border:1px solid var(--line);overflow:hidden}canvas{width:100%;height:100%;display:block}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.metric-grid strong{display:block;font:2.3rem "Draft Serif",serif}.insight{padding:.8rem;border-left:4px solid var(--accent);background:#fff8}
</style></head><body><main class="app"><header class="topbar"><h1>Matchmaking Stop Rule</h1><span class="kicker">the 1/e strategy under different distributions</span></header><div class="workspace"><aside class="sidebar stack"><label>Candidates <span class="mono" id="nOut"></span><input id="n" type="range" min="5" max="100" value="30"></label><label>Observe fraction <span class="mono" id="fractionOut"></span><input id="fraction" type="range" min="0" max=".9" step=".01" value=".37"></label><label>Quality distribution<select id="distribution"><option value="uniform">Uniform</option><option value="normal">Normal</option><option value="exponential">Exponential</option><option value="bimodal">Bimodal</option></select></label><label>Monte Carlo trials<input id="trials" type="number" min="100" max="50000" step="100" value="5000"></label><button class="primary" id="simulate">Simulate strategy</button><button id="newRun">Show one sequence</button><div class="metric-grid"><div><span class="eyebrow">Choose best</span><strong id="success">—</strong></div><div><span class="eyebrow">Mean percentile</span><strong id="percentile">—</strong></div></div><div class="insight" id="insight">For independent continuous draws, the probability of choosing the single best candidate depends on rank order, not the shape of the quality distribution.</div></aside><section class="stage"><div class="run" id="run"></div><div class="chart"><canvas id="chart"></canvas></div></section></div></main><script>
const $=id=>document.getElementById(id),canvas=$('chart'),ctx=canvas.getContext('2d');let curve=[];function normal(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}function drawValue(kind){if(kind==='normal')return normal();if(kind==='exponential')return-Math.log(1-Math.random());if(kind==='bimodal')return normal()*.35+(Math.random()<.5?-1:1);return Math.random()}
function choose(values,k){const benchmark=Math.max(...values.slice(0,k));let selected=values.findIndex((v,i)=>i>=k&&v>benchmark);if(selected<0)selected=values.length-1;return selected}
function trial(n,k,kind){const values=Array.from({length:n},()=>drawValue(kind)),selected=choose(values,k),sorted=[...values].sort((a,b)=>a-b),rank=sorted.indexOf(values[selected]);return{best:rank===n-1,percentile:rank/(n-1||1),values,selected,bestIndex:values.indexOf(Math.max(...values))}}
function runSimulation(){const n=+$('n').value,k=Math.min(n-1,Math.floor(n*+$('fraction').value)),kind=$('distribution').value,trials=+$('trials').value;let wins=0,p=0;for(let i=0;i<trials;i++){const r=trial(n,k,kind);wins+=r.best;p+=r.percentile}$('success').textContent=(wins/trials*100).toFixed(1)+'%';$('percentile').textContent=(p/trials*100).toFixed(1)+'%';curve=[];const samples=Math.max(300,Math.floor(trials/8));for(let kk=0;kk<n;kk++){let w=0;for(let i=0;i<samples;i++)w+=trial(n,kk,kind).best;curve.push(w/samples)}drawChart();showRun()}
function showRun(){const n=+$('n').value,k=Math.min(n-1,Math.floor(n*+$('fraction').value)),r=trial(n,k,$('distribution').value),min=Math.min(...r.values),max=Math.max(...r.values);$('run').replaceChildren(...r.values.map((v,i)=>{const bar=document.createElement('div');bar.className='candidate'+(i<k?' observe':'')+(i===r.selected?' chosen':'')+(i===r.bestIndex?' best':'');bar.style.height=(8+(v-min)/(max-min||1)*82)+'%';bar.title=`#${i+1}: ${v.toFixed(3)}${i===r.selected?' · selected':''}`;return bar}))}
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);drawChart()}function drawChart(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#fffdf7';ctx.fillRect(0,0,w,h);if(!curve.length)return;ctx.strokeStyle='#bcb39f';ctx.beginPath();ctx.moveTo(32,h-28);ctx.lineTo(w-15,h-28);ctx.moveTo(32,12);ctx.lineTo(32,h-28);ctx.stroke();ctx.strokeStyle='#006f78';ctx.lineWidth=3;ctx.beginPath();curve.forEach((v,i)=>{const x=32+i/(curve.length-1)*(w-50),y=h-28-v*(h-48);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();const optimum=curve.indexOf(Math.max(...curve)),x=32+optimum/(curve.length-1)*(w-50),y=h-28-curve[optimum]*(h-48);ctx.fillStyle='#d25532';ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#687170';ctx.font='11px monospace';ctx.fillText(`best simulated skip: ${(optimum/curve.length*100).toFixed(0)}%`,Math.min(w-180,x+10),Math.max(18,y-8));ctx.fillText('skip fraction →',w-105,h-8)}
function labels(){$('nOut').textContent=$('n').value;$('fractionOut').textContent=Math.round(+$('fraction').value*100)+'%'}['n','fraction'].forEach(id=>$(id).oninput=()=>{labels();showRun()});$('simulate').onclick=runSimulation;$('newRun').onclick=showRun;window.onresize=resize;labels();resize();runSimulation();
</script></body></html>
