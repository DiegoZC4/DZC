<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Opening Recall</title>
  <link rel="stylesheet" href="draft.css">
  <style>
    .board-wrap { display:grid; place-items:center; min-height:100%; }
    .board { width:min(70dvh, 72vw, 720px); aspect-ratio:1; display:grid; grid-template-columns:repeat(8,1fr); border:8px solid #263735; box-shadow:0 24px 55px #26373533; }
    .sq { display:grid; place-items:center; position:relative; font-family:"Apple Symbols","Arial Unicode MS",serif; font-size:clamp(1.5rem, 5.8vmin, 4.5rem); line-height:1; text-shadow:0 1px 0 #fff8; }
    .sq.light { background:#d9cfb8; }
    .sq.dark { background:#4c7773; }
    .sq::after { position:absolute; right:4px; bottom:2px; font:600 10px/1 "Avenir Next Condensed",sans-serif; color:#1e2a2a88; }
    .card-title { font-family:"Draft Serif",serif; font-size:1.35rem; margin:0; }
    .answer { min-height:3.2rem; padding:.75rem; border-left:4px solid var(--accent); background:#fff9; }
    .grades { display:grid; grid-template-columns:repeat(4,1fr); gap:.35rem; }
    .grades button { padding:.5rem .2rem; font-size:.78rem; }
    .due-list { max-height:180px; overflow:auto; display:grid; gap:.35rem; }
    .due-row { display:flex; justify-content:space-between; gap:.5rem; padding:.45rem .2rem; border-bottom:1px solid #bcb39f66; }
    dialog { width:min(560px,calc(100vw - 2rem)); border:1px solid var(--line); border-radius:18px; background:var(--paper); color:var(--ink); box-shadow:var(--shadow); }
    dialog::backdrop { background:#18252299; backdrop-filter:blur(3px); }
    @media(max-width:720px){ .board{width:min(92vw,58dvh)} .board-wrap{min-height:60dvh} }
  </style>
</head>
<body>
<main class="app">
  <header class="topbar"><h1>Opening Recall</h1><span class="kicker">spaced repertoire practice</span></header>
  <div class="workspace">
    <aside class="sidebar stack">
      <div><div class="eyebrow">Current card</div><h2 class="card-title" id="cardName"></h2><p class="muted" id="prompt"></p></div>
      <label>Your move<input id="moveInput" autocomplete="off" spellcheck="false" placeholder="e.g. Bc4"></label>
      <div class="row"><button class="primary" id="checkBtn">Check</button><button id="revealBtn">Reveal</button></div>
      <div class="answer hidden" id="answerBox"></div>
      <div class="grades hidden" id="grades">
        <button data-grade="again">Again</button><button data-grade="hard">Hard</button><button data-grade="good">Good</button><button data-grade="easy">Easy</button>
      </div>
      <div class="split"><div><div class="eyebrow">Due</div><div class="metric" id="dueCount">0</div></div><div><div class="eyebrow">Deck</div><div class="metric" id="deckCount">0</div></div></div>
      <button id="addBtn">Add position</button>
      <div class="due-list" id="dueList"></div>
    </aside>
    <section class="stage board-wrap"><div class="board" id="board" aria-label="Chess position"></div></section>
  </div>
</main>

<dialog id="addDialog">
  <form method="dialog" class="stack" id="addForm">
    <div><div class="eyebrow">New repertoire card</div><h2>Add a position</h2></div>
    <label>Name<input id="newName" required placeholder="Italian Game: develop the bishop"></label>
    <label>FEN<input id="newFen" class="mono" required></label>
    <label>Expected move<input id="newMove" required placeholder="Bc4"></label>
    <label>Why this move?<textarea id="newNote" rows="3"></textarea></label>
    <div class="row"><button value="cancel">Cancel</button><button class="primary" value="default" id="saveCard">Save card</button></div>
  </form>
</dialog>

<script>
const KEY='appsToMake.chessOpeningSrs.v1';
const PIECES={p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',P:'♙',R:'♖',N:'♘',B:'♗',Q:'♕',K:'♔'};
const seeds=[
 {id:'italian-bc4',name:'Italian Game',fen:'r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3',move:'Bc4',note:'Develop toward f7 and prepare to castle.'},
 {id:'sicilian-open',name:'Open Sicilian',fen:'rnbqkbnr/pp2pppp/3p4/2p5/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 0 3',move:'d4',note:'Open the center before Black completes development.'},
 {id:'qgd-c4',name:"Queen's Gambit",fen:'rnbqkbnr/ppp1pppp/8/3p4/3P4/8/PPP1PPPP/RNBQKBNR w KQkq - 0 2',move:'c4',note:'Challenge Black’s d5 pawn immediately.'}
];
let deck=loadDeck(),current=null,checked=false;
const $=id=>document.getElementById(id);

function loadDeck(){
  try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved)&&saved.length)return saved}catch{}
  return seeds.map(card=>({...card,due:0,interval:0,ease:2.5,reviews:0}));
}
function save(){localStorage.setItem(KEY,JSON.stringify(deck));}
function dueCards(){return deck.filter(c=>(c.due||0)<=Date.now()).sort((a,b)=>(a.due||0)-(b.due||0));}
function pick(){current=dueCards()[0]||[...deck].sort((a,b)=>(a.due||0)-(b.due||0))[0];checked=false;render();}
function parseFen(fen){
  const rows=fen.trim().split(/\s+/)[0].split('/');
  return rows.flatMap(row=>{const cells=[];for(const ch of row){if(/\d/.test(ch))cells.push(...Array(Number(ch)).fill(''));else cells.push(ch)}return cells});
}
function renderBoard(){
  const cells=parseFen(current.fen);$('board').replaceChildren(...cells.map((piece,i)=>{
    const square=document.createElement('div');square.className=`sq ${((i>>3)+(i&7))%2?'dark':'light'}`;square.textContent=PIECES[piece]||'';return square;
  }));
}
function fmtDue(card){const ms=(card.due||0)-Date.now();if(ms<=0)return'due';const min=Math.ceil(ms/60000);if(min<60)return`${min}m`;const hr=Math.ceil(min/60);if(hr<48)return`${hr}h`;return`${Math.ceil(hr/24)}d`;}
function render(){
  if(!current)return;
  $('cardName').textContent=current.name;$('prompt').textContent='Find the repertoire move from this position.';
  $('moveInput').value='';$('moveInput').disabled=false;$('answerBox').classList.add('hidden');$('grades').classList.add('hidden');
  $('dueCount').textContent=dueCards().length;$('deckCount').textContent=deck.length;renderBoard();
  $('dueList').replaceChildren(...deck.slice().sort((a,b)=>(a.due||0)-(b.due||0)).map(card=>{
    const row=document.createElement('div');row.className='due-row';row.innerHTML=`<span>${escapeHtml(card.name)}</span><span class="mono">${fmtDue(card)}</span>`;return row;
  }));
  setTimeout(()=>$('moveInput').focus(),0);
}
function normalize(move){return move.trim().replace(/[+#?!]/g,'').replace(/0-0/g,'O-O').toLowerCase();}
function showAnswer(){
  if(checked)return;checked=true;const correct=normalize($('moveInput').value)===normalize(current.move);
  $('answerBox').innerHTML=`<strong>${correct?'Correct':'Answer: '+escapeHtml(current.move)}</strong><br>${escapeHtml(current.note||'')}`;
  $('answerBox').classList.remove('hidden');$('grades').classList.remove('hidden');$('moveInput').disabled=true;
}
function grade(kind){
  const now=Date.now(),day=86400000;current.reviews=(current.reviews||0)+1;current.ease=current.ease||2.5;
  if(kind==='again'){current.interval=0;current.due=now+10*60000;current.ease=Math.max(1.3,current.ease-.2)}
  if(kind==='hard'){current.interval=Math.max(1,Math.round((current.interval||1)*1.2));current.due=now+current.interval*day;current.ease=Math.max(1.3,current.ease-.15)}
  if(kind==='good'){current.interval=current.interval?Math.max(1,Math.round(current.interval*current.ease)):1;current.due=now+current.interval*day}
  if(kind==='easy'){current.interval=current.interval?Math.max(4,Math.round(current.interval*current.ease*1.3)):4;current.due=now+current.interval*day;current.ease+=.15}
  save();pick();
}
function escapeHtml(value){const div=document.createElement('div');div.textContent=value;return div.innerHTML;}
$('checkBtn').addEventListener('click',showAnswer);$('revealBtn').addEventListener('click',showAnswer);
$('moveInput').addEventListener('keydown',event=>{if(event.key==='Enter')showAnswer()});
$('grades').addEventListener('click',event=>{const grade=event.target.dataset.grade;if(grade)grade && window.requestAnimationFrame(()=>gradeCard(grade))});
function gradeCard(value){grade(value)}
$('addBtn').addEventListener('click',()=>{$('newFen').value=current?.fen||seeds[0].fen;$('addDialog').showModal()});
$('saveCard').addEventListener('click',event=>{
  event.preventDefault();if(!$('addForm').reportValidity())return;
  try{if(parseFen($('newFen').value).length!==64)throw Error();}catch{return alert('That FEN does not describe an 8 x 8 board.')}
  deck.push({id:crypto.randomUUID(),name:$('newName').value.trim(),fen:$('newFen').value.trim(),move:$('newMove').value.trim(),note:$('newNote').value.trim(),due:0,interval:0,ease:2.5,reviews:0});
  save();$('addDialog').close();pick();
});
pick();
</script>
</body>
</html>
