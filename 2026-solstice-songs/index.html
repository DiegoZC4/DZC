<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>2026 Solstice Songs</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8E%A4%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=c36d67d4adf8">
  <link rel="stylesheet" href="vendor/settings-help.css?v=3e0107c0135b">
  <script defer src="vendor/lucide.min.js?v=ab85225ecc1d"></script>
  
  
  
  <script defer src="shared/loop_recorder.js?v=33bd6fc8544c"></script>
  
  
  
  <script defer src="shared/microphone_check.js?v=9c0d190a5608"></script>
  <script defer src="shared/vocal_pitch.js?v=f3674f59cb33"></script>
  <script defer src="shared/take_pitch.js?v=12a39ea5792d"></script>
  <script defer src="shared/live_pitch.js?v=22db73490ab4"></script>
  <script defer src="full_practice_input.js?v=a8ef0ccd95b1"></script>
  <script defer src="full_practice_loop.js?v=36b76114a6f8"></script>
  <script defer src="full_practice_pitch.js?v=546875b08614"></script>
  
  
  
  
  
  <!-- local-only:start --><!-- local-only:end -->
  <script defer src="vendor/infinite-pager.js?v=ee2e75cea029"></script>
  <script defer src="vendor/settings-help.js?v=535304bbce6f"></script>
  
  
<link rel="stylesheet" href="full-practice.css?v=e39ceef313a0"><script defer src="full_practice_audio.js?v=3726f2981b94"></script><script defer src="full_practice_recording.js?v=8f3e409d61fa"></script><script defer src="full_practice_tracks.js?v=89e1f57a7f25"></script><script defer src="full_practice_loader.js?v=50946c891635"></script><script defer src="full_practice_click.js?v=7482c33e97e5"></script><script defer src="full_practice_chart.js?v=9293f780b6d8"></script><script defer src="full_practice_lyric_follow.js?v=9039bcb5852c"></script><script defer src="full-practice.js?v=9964bf8b495c"></script></head>
<body>
  <div class="workspace" id="practiceView">
    <aside aria-label="Program songs"><h1 class="sidebar-title">2026 Solstice Songs</h1><div id="songList"></div></aside>
    <main>
      <p id="cutLabel" class="cut-label" hidden></p>
      <div id="pending" hidden></div>
      <audio id="backingAudio" preload="metadata" hidden></audio>
      <div id="player">
        <p id="auditionGuidance" class="sr-only">Record the selected input to a local track. Use headphones to keep the backing out of the recording.</p>
        <div class="toolbar" aria-label="Playback settings">
          <div class="transport-row" role="group" aria-label="Transport">
          <div class="transport-controls">
          <div class="transport"><button id="play" title="Play / pause (Space)" aria-label="Play"><i data-lucide="play"></i></button><button id="rewind" title="Return to beginning" aria-label="Return to beginning"><i data-lucide="skip-back"></i></button><button id="record" class="record" aria-describedby="auditionGuidance"><i data-lucide="circle"></i><span>Record</span></button><span class="transport-readout"><output id="time">0:00</output><output id="count" aria-live="off"></output></span></div>
          <div class="transpose-control"><span id="speedLabel">Speed</span><button id="speed" type="button" class="scale-number" role="spinbutton" data-value="1" aria-labelledby="speedLabel"></button></div>
          <div id="loopControls" class="measure-loop" role="group" aria-label="Practice loop"><button id="loopStart" class="loop-point" type="button">Start</button><button id="loop" class="icon" type="button" aria-label="Enable loop" aria-pressed="false" title="Loop selected measures"><i data-lucide="repeat"></i></button><button id="loopEnd" class="loop-point" type="button">End</button></div>
          <div class="transpose-control"><span id="transposeLabel">Transpose</span><div id="transpose" class="transpose-pager" role="spinbutton" tabindex="0" aria-labelledby="transposeLabel"></div></div>
          <div class="reference-tools">
          <label id="referenceChoice" for="referenceRecording" hidden>Recording <select id="referenceRecording" data-help="Switch performances, including stems, click and lyric cues. Your recorded tracks stay on this device."></select></label>
          <!-- YouTube: unchanged Simple Icons path, CC0; Google LLC trademark. -->
          <a id="source" class="icon source-link" target="_blank" rel="noopener noreferrer" hidden><svg class="youtube-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="8" y="7" width="9" height="10" fill="white"></rect><path fill="#ff0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"></path></svg><i data-lucide="external-link"></i></a>
          </div>
          <output id="backingStatus" role="status"></output><span id="backingNote"></span>
          <button id="fullscreen" class="icon" title="Full screen (F)" aria-label="Enter full screen"><i data-lucide="maximize"></i></button>
          <button id="settingsHelp" type="button" class="icon" aria-pressed="false" aria-label="Show setting help"><i data-lucide="info"></i></button>
          </div>
          <nav id="songParts" aria-label="Instrument parts" hidden></nav>
          <button id="jumpLyrics" type="button" aria-controls="lyricSheet" title="Jump to lyrics"><i data-lucide="text"></i>Lyrics</button>
          <a id="excerpts" href="/2026-solstice-auditions/">Audition excerpts</a>
          </div>
          <div class="settings-groups">
            <fieldset id="micSettings" class="settings-group"><legend>Recording input</legend>
              <div class="mic-controls">
                <label class="mic-input"><span class="sr-only">Microphone or audio interface input</span><select id="micDevice"><option value="">System default</option></select></label>
                <div id="microphoneCheck" class="mic-check-inline" data-state="idle">
                  <div class="mic-check-meter" role="meter" aria-label="Microphone input level" aria-valuemin="-60" aria-valuemax="0" aria-valuenow="-60"><div class="mic-check-fill"></div></div>
                  <button id="checkMicrophone" type="button" title="Test microphone input" aria-label="Test microphone input" aria-pressed="false"><i data-lucide="mic"></i><span role="status" aria-live="polite">Test input</span><output></output></button>
                </div>
              </div>
            </fieldset>
            <fieldset id="displaySettings" class="settings-group"><legend>Display</legend>
              <div class="display-controls">
                <label for="scale">Vertical Scale</label><button id="scale" type="button" class="scale-number" data-value="100" title="Vertical scale; drag or click to increase by 10%"></button>
                <label for="stretch">Horizontal Stretch</label><button id="stretch" type="button" class="scale-number" data-value="100" title="Horizontal stretch; drag or click to increase by 10%"></button>
              </div>
            </fieldset>
          </div>
        </div>
        <div class="full-presets backing-controls"><button id="all">All stems</button><button id="reharm">Vocals + drums</button><button id="noVocals">Band only</button>
          <div class="pulse-controls" role="group" aria-label="Metronome and count-in"><button id="metronome" disabled aria-pressed="false" title="Continue the click during playback and recording">Click</button><button id="clickLevel" class="scale-number" aria-label="Click volume"></button>
            <label for="countInBeats">Count-in</label><select id="countInBeats" title="Preparatory beats before recording"><option value="0">Off</option><option value="2">2 beats</option><option value="3">3 beats</option><option value="4" selected>4 beats</option><option value="8">8 beats</option></select>
          </div><span id="clickQuality" class="full-note"></span><button id="melody" disabled title="Full-song melody has not been transcribed">MIDI</button></div>
        <div class="rehearsal-layout"><div class="rehearsal-mix">
        <section id="harmonyPractice" class="harmony-practice" aria-labelledby="harmonyHeading" hidden>
          <div class="harmony-heading"><h2 id="harmonyHeading">Your part</h2>
            <label class="sing-choice"><input id="harmonySing" type="checkbox">Sing</label>
            <button id="clearHarmony" class="icon" type="button" aria-label="Clear pitch contour" data-help="Erase this pass's pitch contour and statistics; recorded tracks stay untouched."><i data-lucide="eraser"></i></button>
            <select id="harmonyPhrase" aria-label="Jump to harmony phrase"></select>
            <button id="followHarmony" class="icon" type="button" aria-label="Follow harmony playhead" data-help="Return to the current playback position."><i data-lucide="locate-fixed"></i></button>
          </div>
          <div id="harmonyStats" class="harmony-stats" aria-label="Current pass intonation">
            <span>Tracked <output data-stat="tracked">&#8212;</output></span>
            <span>Mean <output data-stat="mean">&#8212;</output> &#162;</span>
            <span>Median <output data-stat="median">&#8212;</output> &#162;</span>
            <span>Within 50&#162; <output data-stat="within">&#8212;</output></span>
          </div>
          <div id="harmonyViewport" class="harmony-viewport" tabindex="0" role="region" aria-label="Harmony pitchbar; numbered recording measures">
            <div id="harmonyStage" class="harmony-stage"><svg id="harmonyScore" aria-label="User-supplied harmony notes"></svg><canvas id="harmonyTrace" aria-label="Live microphone pitch contour"></canvas><div id="harmonyCursor" class="harmony-cursor"></div></div>
          </div>
        </section>
        <div id="mixer" class="full-mixer">
          <div id="measureRulerRow" class="measure-ruler-row" hidden><span>Measures</span><svg id="measureRuler" role="img" aria-label="Recording measure map"></svg></div>
          <div id="stems" aria-label="Reference stems"></div>
          <div id="trackTools" class="track-tools">
            <label for="trackKind">My tracks</label>
            <select id="trackKind" aria-label="New track instrument"><option value="voice">Voice</option><option value="piano">Piano</option><option value="guitar">Guitar</option><option value="other">Other</option></select>
            <button id="addTrack" type="button" disabled><i data-lucide="plus"></i>Add track</button>
            <button id="undoDelete" type="button" hidden><i data-lucide="undo-2"></i>Undo delete</button>
          </div>
          <div id="layers" aria-label="My recorded tracks"></div>
        </div>
        <p id="note" class="full-note"></p>
        <div id="recovery" hidden><span>Unsaved recording</span><button id="downloadRecovery"><i data-lucide="download"></i>Download recovery</button><button id="retryRecovery"><i data-lucide="refresh-cw"></i>Retry save</button></div>
        </div>
        <section id="lyricSheet" class="lyric-sheet" aria-labelledby="lyricHeading">
          <div class="lyric-heading"><h2 id="lyricHeading">Lyrics</h2>
            <div id="lyricDisplay" class="lyric-display" role="group" aria-label="Lyric display" hidden>
              <label title="Color harmony, unison and soloist-only lyrics"><input id="lyricHarmony" type="checkbox" checked aria-controls="lyricBody lyricLegend">Harmony</label>
              <label title="Show chord symbols and instrumental bars"><input id="lyricChords" type="checkbox" checked aria-controls="lyricBody lyricLegend">Chords</label>
            </div>
            <span id="lyricSource"></span>
          </div>
          <div id="lyricLegend" class="lyric-legend" aria-label="Backing vocal cues and chord key" hidden></div>
          <div id="lyricBody" tabindex="0" role="region" aria-label="Song lyrics"></div>
          <button id="lyricReturn" class="lyric-return" type="button" hidden tabindex="-1" aria-hidden="true" aria-label="Return to recording lyrics"><i data-lucide="arrow-up"></i></button>
        </section>
        </div>
      </div>
    </main>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <dialog id="clipDownload" aria-labelledby="clipDialogLabel"><form method="dialog">
    <label id="clipDialogLabel" for="clipFile">Original recording</label><select id="clipFile"></select>
    <label id="clipGainField" hidden>Clip gain (dB) <input id="clipGain" type="number" min="-30" max="30" step="0.1" required></label>
    <div class="clip-dialog-actions"><button value="cancel" formnovalidate>Cancel</button><button id="applyClipGain" value="apply" hidden>Apply</button><button id="rawClipWav" value="download" formnovalidate><i data-lucide="download"></i>WAV</button></div>
  </form></dialog>
  <div id="settingsTooltip" class="settings-tooltip" role="tooltip" aria-hidden="true" hidden></div>
</body>
</html>
