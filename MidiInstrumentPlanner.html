<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>MIDI Instrument Bank</title>
    <style>
:root {
  color: #e8edef;
  background: #0c1012;
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  --accent: #45d7c6;
  --accent-ink: #062a26;
  --amber: #e1b55a;
  --chrome: #151a1d;
  --chrome-raised: #1d2428;
  --divider: #30383c;
  --muted: #9ca8ad;
}

* {
  box-sizing: border-box;
}

html {
  background: #0c1012;
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  background: #0c1012;
}

button,
input {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid #8af1e5;
  outline-offset: 2px;
}

button {
  border: 0;
  color: inherit;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid var(--divider);
  background: rgba(21, 26, 29, 0.97);
  backdrop-filter: blur(12px);
}

.title-row {
  display: flex;
  min-height: 52px;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  max-width: 1180px;
  margin: 0 auto;
  padding: 8px 18px;
}

h1 {
  margin: 0;
  font-size: 1rem;
  font-weight: 760;
  letter-spacing: 0;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.engine-size {
  color: var(--muted);
  font-size: 0.75rem;
  white-space: nowrap;
}

.copy-button,
.clear-button {
  min-height: 34px;
  padding: 0 12px;
  border: 1px solid #3a454a;
  border-radius: 5px;
  background: var(--chrome-raised);
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
}

.copy-button:hover,
.clear-button:hover {
  border-color: #5a696f;
  background: #252e32;
}

.size-strip {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  max-width: 1180px;
  margin: 0 auto;
  border-top: 1px solid #242b2f;
}

.metric {
  display: flex;
  min-width: 0;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 18px;
  border-right: 1px solid #242b2f;
}

.metric:last-child {
  border-right: 0;
}

.metric span {
  overflow: hidden;
  color: var(--muted);
  font-size: 0.68rem;
  font-weight: 650;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.metric strong {
  color: #f2f5f6;
  font-size: 0.84rem;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.metric-primary strong {
  color: var(--accent);
}

main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 14px 18px 32px;
}

.controls {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) auto auto auto;
  align-items: center;
  gap: 10px;
}

.search-control input {
  width: 100%;
  height: 38px;
  padding: 0 12px;
  border: 1px solid #384247;
  border-radius: 5px;
  color: #eef2f3;
  background: #111619;
}

.search-control input::placeholder {
  color: #7f8b90;
}

.pill-toggle {
  min-width: 0;
}

.pill-toggle-group {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, auto);
  gap: 2px;
  padding: 3px;
  border: 1px solid #384247;
  border-radius: 6px;
  background: #111619;
}

.pill-thumb {
  position: absolute;
  top: 3px;
  left: 3px;
  z-index: 0;
  height: 30px;
  border-radius: 4px;
  background: #dce6e4;
  opacity: 0;
  transition:
    transform 120ms ease,
    width 120ms ease,
    opacity 90ms ease;
}

.pill-option {
  position: relative;
  z-index: 1;
  height: 30px;
  padding: 0 10px;
  border-radius: 4px;
  color: #aeb8bc;
  background: transparent;
  font-size: 0.75rem;
  font-weight: 720;
  cursor: pointer;
}

.pill-option.is-active {
  color: #14201f;
}

.selected-filter {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #b5bec2;
  font-size: 0.75rem;
  font-weight: 700;
  white-space: nowrap;
}

.selected-filter input[role="switch"] {
  position: relative;
  width: 36px;
  height: 20px;
  margin: 0;
  border: 1px solid #455158;
  border-radius: 10px;
  appearance: none;
  background: #252d31;
  cursor: pointer;
}

.selected-filter input[role="switch"]::after {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #aab4b8;
  content: "";
  transition: transform 100ms ease;
}

.selected-filter input[role="switch"]:checked {
  border-color: var(--accent);
  background: #123b37;
}

.selected-filter input[role="switch"]:checked::after {
  background: var(--accent);
  transform: translateX(16px);
}

.audition-panel {
  overflow: hidden;
  margin-top: 14px;
  border: 1px solid var(--divider);
  border-radius: 6px;
  background: #111619;
}

.audition-toolbar {
  display: flex;
  min-height: 44px;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 6px 10px 6px 12px;
  border-bottom: 1px solid var(--divider);
  background: #1a2023;
}

.audition-title {
  display: flex;
  min-width: 0;
  align-items: baseline;
  gap: 9px;
}

.audition-title span {
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 760;
  text-transform: uppercase;
}

.audition-title strong {
  overflow: hidden;
  color: #f1f4f5;
  font-size: 0.86rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sustain-button {
  min-height: 30px;
  padding: 0 10px;
  border: 1px solid #455158;
  border-radius: 5px;
  color: #b8c1c5;
  background: #252d31;
  font-size: 0.72rem;
  font-weight: 720;
  cursor: pointer;
}

.sustain-button[aria-pressed="true"] {
  border-color: var(--accent);
  color: #dffbf7;
  background: #123b37;
}

.piano-scroll {
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-x: contain;
  scrollbar-color: #465258 #111619;
  scrollbar-width: thin;
}

.piano {
  position: relative;
  width: 100%;
  min-width: 920px;
  height: 154px;
  background: #080b0c;
  isolation: isolate;
}

.white-keys {
  display: grid;
  grid-template-columns: repeat(var(--white-count), minmax(0, 1fr));
  height: 100%;
}

.black-keys {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.piano-key {
  min-width: 0;
  touch-action: none;
  user-select: none;
  cursor: pointer;
}

.white-key {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0 2px 10px;
  border-right: 1px solid #7b8588;
  color: #273034;
  background: #e7eaeb;
  box-shadow: inset 0 -4px 0 #c9ced0;
}

.white-key:first-child {
  border-left: 0;
}

.white-key:hover {
  background: #f4f6f6;
}

.white-key.is-active {
  color: #092b27;
  background: #8ee9de;
  box-shadow: inset 0 -3px 0 #42cabb;
}

.black-key {
  position: absolute;
  top: 0;
  left: var(--black-left);
  z-index: 2;
  display: flex;
  width: var(--black-width);
  height: 62%;
  align-items: flex-end;
  justify-content: center;
  padding: 0 1px 8px;
  border: 1px solid #030404;
  border-radius: 0 0 3px 3px;
  color: #dce2e4;
  background: #171c1f;
  box-shadow:
    inset 0 -5px 0 #090c0d,
    0 2px 3px rgba(0, 0, 0, 0.42);
  pointer-events: auto;
}

.black-key:hover {
  background: #252d31;
}

.black-key.is-active {
  color: #062a26;
  background: #45d7c6;
  box-shadow:
    inset 0 -4px 0 #209c90,
    0 2px 3px rgba(0, 0, 0, 0.3);
}

.computer-key-label {
  overflow: hidden;
  max-width: 100%;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.59rem;
  font-weight: 760;
  line-height: 1;
  text-overflow: clip;
  white-space: nowrap;
  pointer-events: none;
}

.black-key .computer-key-label {
  font-size: 0.52rem;
}

.result-line {
  display: flex;
  min-height: 34px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: 0.72rem;
  font-variant-numeric: tabular-nums;
}

.table-wrap {
  overflow: hidden;
  border: 1px solid var(--divider);
  border-radius: 6px;
  background: #111619;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

thead {
  background: #1a2023;
}

th,
td {
  height: 43px;
  padding: 0 12px;
  border-bottom: 1px solid #293136;
  text-align: left;
}

th {
  color: #8f9ba0;
  font-size: 0.67rem;
  font-weight: 760;
  text-transform: uppercase;
}

tbody tr:last-child td {
  border-bottom: 0;
}

tbody tr:hover {
  background: #171d20;
}

tbody tr.is-selected {
  background: #12211f;
}

tbody tr.is-auditioned td:first-child {
  box-shadow: inset 3px 0 var(--amber);
}

tbody tr.is-auditioned .instrument-name {
  color: #f0cb7a;
}

.check-cell {
  width: 46px;
  padding-right: 4px;
  text-align: center;
}

input[type="checkbox"]:not([role="switch"]) {
  width: 17px;
  height: 17px;
  margin: 0;
  accent-color: var(--accent);
  cursor: pointer;
}

.instrument-name {
  display: block;
  overflow: hidden;
  color: #edf1f2;
  font-size: 0.82rem;
  font-weight: 710;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.name-cell {
  padding: 0;
}

.instrument-audition {
  display: block;
  width: 100%;
  min-height: 42px;
  padding: 6px 12px;
  text-align: left;
  background: transparent;
  cursor: pointer;
}

.instrument-audition:hover .instrument-name {
  color: #ffffff;
}

.instrument-id {
  display: block;
  overflow: hidden;
  margin-top: 2px;
  color: #77848a;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.63rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.family-cell {
  color: #b0b9bd;
  font-size: 0.75rem;
}

.number-cell {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

td.number-cell {
  color: #c5cdd0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.72rem;
}

.gm-cell {
  color: var(--amber);
}

.mobile-meta {
  display: none;
}

.empty-row td {
  height: 120px;
  color: var(--muted);
  text-align: center;
}

@media (max-width: 760px) {
  .title-row {
    padding-right: 12px;
    padding-left: 12px;
  }

  .size-strip {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .metric {
    padding: 8px 12px;
  }

  .metric:nth-child(3) {
    border-right: 0;
  }

  .metric:nth-child(n + 4) {
    border-top: 1px solid #242b2f;
  }

  main {
    padding: 12px;
  }

  .controls {
    grid-template-columns: 1fr auto auto;
  }

  .search-control {
    grid-column: 1 / -1;
  }

  .pill-toggle {
    min-width: 0;
  }

  .pill-option {
    padding: 0 7px;
  }

  .engine-size {
    display: none;
  }

  th:nth-child(3),
  td:nth-child(3),
  th:nth-child(4),
  td:nth-child(4) {
    display: none;
  }

  th:nth-child(2) {
    width: auto;
  }

  th:nth-child(5),
  td:nth-child(5),
  th:nth-child(6),
  td:nth-child(6) {
    width: 88px;
  }

  .mobile-meta {
    display: block;
    margin-top: 2px;
    color: #849096;
    font-size: 0.64rem;
  }
}

@media (max-width: 470px) {
  h1 {
    font-size: 0.88rem;
  }

  .copy-button {
    min-height: 32px;
    padding: 0 9px;
  }

  .controls {
    grid-template-columns: 1fr auto;
  }

  .pill-toggle {
    grid-column: 1 / -1;
  }

  .pill-toggle-group {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .clear-button {
    justify-self: end;
  }

  th,
  td {
    padding-right: 8px;
    padding-left: 8px;
  }

  .check-cell {
    width: 38px;
  }

  th:nth-child(5),
  td:nth-child(5),
  th:nth-child(6),
  td:nth-child(6) {
    width: 72px;
  }

  .instrument-id {
    max-width: 120px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
  }
}
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="title-row">
        <h1>MIDI Instrument Bank</h1>
        <div class="header-actions">
          <span class="engine-size" id="engine-size"></span>
          <button class="copy-button" id="copy-include" type="button">Copy include</button>
        </div>
      </div>
      <div class="size-strip" aria-label="Selected bank footprint" aria-live="polite">
        <div class="metric">
          <span>Selected</span>
          <strong id="selected-count">0</strong>
        </div>
        <div class="metric">
          <span>Recipes</span>
          <strong id="recipe-size">0 B</strong>
        </div>
        <div class="metric">
          <span>Raw module</span>
          <strong id="module-size">0 B</strong>
        </div>
        <div class="metric metric-primary">
          <span>Gzip</span>
          <strong id="gzip-size">0 B</strong>
        </div>
        <div class="metric">
          <span>Over engine</span>
          <strong id="added-size">0 B</strong>
        </div>
      </div>
    </header>

    <main>
      <section class="controls" aria-label="Instrument filters">
        <label class="search-control">
          <span class="visually-hidden">Search instruments</span>
          <input id="search" type="search" placeholder="Search instruments" autocomplete="off" />
        </label>

        <div class="pill-toggle">
          <div class="pill-toggle-group" id="profile-group" role="tablist" aria-label="Bank profile">
            <span class="pill-thumb" aria-hidden="true"></span>
            <button class="pill-option" data-profile="current" role="tab" type="button">Current</button>
            <button class="pill-option" data-profile="tiny" role="tab" type="button">Tiny</button>
            <button class="pill-option" data-profile="orchestra" role="tab" type="button">Orchestra</button>
            <button class="pill-option" data-profile="all" role="tab" type="button">All</button>
          </div>
        </div>

        <label class="selected-filter">
          <input id="selected-only" type="checkbox" role="switch" />
          <span>Selected</span>
        </label>
        <button class="clear-button" id="clear-selection" type="button">Clear</button>
      </section>

      <section class="audition-panel" aria-labelledby="audition-name">
        <div class="audition-toolbar">
          <div class="audition-title">
            <span>Audition</span>
            <strong id="audition-name" aria-live="polite"></strong>
          </div>
          <button
            class="sustain-button"
            id="sustain"
            type="button"
            aria-pressed="false"
          >Sustain</button>
        </div>
        <div class="piano-scroll" id="piano-scroll">
          <div class="piano" id="piano" role="group" aria-label="Piano keyboard"></div>
        </div>
      </section>

      <div class="result-line">
        <span id="result-count"></span>
        <span id="profile-name"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="check-cell">
                <input id="select-visible" type="checkbox" aria-label="Select visible instruments" />
              </th>
              <th>Instrument</th>
              <th>Family</th>
              <th class="number-cell">GM</th>
              <th class="number-cell">Recipe</th>
              <th class="number-cell" title="Compressed alone; selected totals account for shared data">Gzip alone</th>
            </tr>
          </thead>
          <tbody id="instrument-rows"></tbody>
        </table>
      </div>

  if (auditionInputs.has(inputId)) return;

  const voiceId = auditionEngine.noteOn(

  if (!activeInput) return;

  auditionInputs.delete(inputId);
  auditionEngine.noteOff(activeInput.voiceId);
  const remaining = Math.max(
    0,
    (activeSemitoneCounts.get(activeInput.semitone) ?? 1) - 1,
  );
  if (remaining === 0) {
    activeSemitoneCounts.delete(activeInput.semitone);
  } else {
    activeSemitoneCounts.set(activeInput.semitone, remaining);
  }
  updatePianoKeyState(activeInput.semitone);
}

function setSustain(enabled) {
  auditionEngine.setSustain(enabled);
  sustainButton.setAttribute("aria-pressed", String(enabled));
}

function stopAllAuditionNotes({ resetSustain = false } = {}) {
  [...auditionInputs.keys()].forEach(stopAuditionInput);
  auditionEngine.stopAll();
  activeSemitoneCounts.clear();
  pianoElement
    .querySelectorAll(".piano-key.is-active")
    .forEach((key) => key.classList.remove("is-active"));
  if (resetSustain) setSustain(false);
}

function createPianoKey(key) {
  const midi = computerPiano.baseMidi + key.semitone;
  const button = document.createElement("button");
  button.type = "button";
  button.tabIndex = -1;
  button.className = `piano-key ${key.black ? "black-key" : "white-key"}`;
  button.dataset.code = key.code;
  button.dataset.semitone = String(key.semitone);
  button.title = `${pianoNoteName(midi)} - ${key.label}`;
  button.setAttribute(
    "aria-label",
    `${pianoNoteName(midi)}, computer key ${key.label}`,
  );

  const label = document.createElement("span");
  label.className = "computer-key-label";
  label.textContent = displayComputerKey(key.label);
  button.append(label);

  button.addEventListener("pointerdown", (event) => {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    event.preventDefault();
    button.setPointerCapture?.(event.pointerId);
    startAuditionInput(`pointer:${event.pointerId}`, key);
  });

  const releasePointer = (event) => {
    stopAuditionInput(`pointer:${event.pointerId}`);
  };
  button.addEventListener("pointerup", releasePointer);
  button.addEventListener("pointercancel", releasePointer);
  button.addEventListener("lostpointercapture", releasePointer);

  return button;
}

function renderPianoKeyboard() {
  const whiteKeys = computerPiano.keys.filter((key) => !key.black);
  const blackKeys = computerPiano.keys.filter((key) => key.black);
  const whiteIndexBySemitone = new Map();
  const whiteRail = document.createElement("div");
  const blackRail = document.createElement("div");
  const whiteWidth = 100 / whiteKeys.length;

  whiteRail.className = "white-keys";
  whiteRail.style.setProperty("--white-count", whiteKeys.length);
  blackRail.className = "black-keys";

  whiteKeys.forEach((key, index) => {
    whiteIndexBySemitone.set(key.semitone, index);
    whiteRail.append(createPianoKey(key));
  });

  blackKeys.forEach((key) => {
    const previousWhite = [...whiteKeys]
      .filter(({ semitone }) => semitone < key.semitone)
      .at(-1);
    const previousIndex = whiteIndexBySemitone.get(previousWhite.semitone);
    const button = createPianoKey(key);
    button.style.setProperty("--black-width", `${whiteWidth * 0.62}%`);
    button.style.setProperty(
      "--black-left",
      `${(previousIndex + 1) * whiteWidth - whiteWidth * 0.31}%`,
    );
    blackRail.append(button);
  });

  pianoElement.replaceChildren(whiteRail, blackRail);
}

function syncAuditionSelection() {
  auditionName.textContent = catalog[auditionId].label;
  rowsElement.querySelectorAll("[data-audition-id]").forEach((button) => {
    const active = button.dataset.auditionId === auditionId;
    button.setAttribute("aria-pressed", String(active));
    button.closest("tr")?.classList.toggle("is-auditioned", active);
  });
}

function selectAuditionInstrument(id) {
  if (!catalog[id] || id === auditionId) return;
  stopAllAuditionNotes();
  auditionEngine.setInstrument(id);
  auditionId = id;
  syncAuditionSelection();
}

function isTextEntry(target) {
  return (
    target instanceof Element &&
    (target.matches("input, textarea, select") || target.isContentEditable)
  );
}

function buildBank(ids) {
  return Object.fromEntries(ids.map((id) => [id, catalog[id]]));
}

function buildModuleSource(ids) {
  const bank = buildBank(ids);
  const report = {
    bytes: byteLength(JSON.stringify(bank)),
    errors: [],
    instrumentCount: ids.length,
    valid: ids.length > 0,
  };
  const defaultInstrument = ids.includes(plannerData.defaultInstrument)
    ? plannerData.defaultInstrument
    : (ids[0] ?? "");

  return plannerData.moduleTemplate
    .replace("/*__INSTRUMENT_PROFILE__*/", JSON.stringify(plannerData.profile))
    .replace("/*__INSTRUMENT_BANK__*/", JSON.stringify(bank))
    .replace("/*__INSTRUMENT_REPORT__*/", JSON.stringify(report))
    .replace("/*__DEFAULT_INSTRUMENT__*/", JSON.stringify(defaultInstrument));
}

async function gzipByteLength(value) {
  if (!globalThis.CompressionStream) return null;

  const compressed = new Blob([value])
    .stream()
    .pipeThrough(new CompressionStream("gzip"));
  return (await new Response(compressed).arrayBuffer()).byteLength;
}

function selectedInDisplayOrder() {
  const activeProfile = matchingProfile();
  if (activeProfile) return [...profiles[activeProfile]];
  return entries.map(([id]) => id).filter((id) => selectedIds.has(id));
}

function matchingProfile() {
  return Object.entries(profiles).find(([, ids]) => {
    if (ids.length !== selectedIds.size) return false;
    return ids.every((id) => selectedIds.has(id));
  })?.[0];
}

function syncPillThumb() {
  const activeProfile = matchingProfile();
  const activeButton = profileButtons.find(
    (button) => button.dataset.profile === activeProfile,
  );

  profileButtons.forEach((button) => {
    const active = button === activeButton;
    button.classList.toggle("is-active", active);
    button.setAttribute("aria-selected", String(active));
  });

  if (!activeButton) {
    pillThumb.style.opacity = "0";
    profileName.textContent = "Custom";
    return;
  }

  pillThumb.style.width = `${activeButton.offsetWidth}px`;
  pillThumb.style.transform = `translateX(${activeButton.offsetLeft - 3}px)`;
  pillThumb.style.opacity = "1";
  profileName.textContent =
    activeButton.textContent === "Current"
      ? plannerData.profileLabel
      : activeButton.textContent;
}

function rowSearchText(id, preset) {
  return [
    id,
    preset.label,
    preset.family,
    familyLabels[preset.family],
    preset.gm === undefined ? "" : `gm ${preset.gm + 1} ${preset.gm}`,
    orchestraIds.has(id) ? "orchestra orchestral" : "",
  ]
    .join(" ")
    .toLowerCase();
}

function currentVisibleEntries() {
  const query = searchInput.value.trim().toLowerCase();
  return entries.filter(([id, preset]) => {
    if (selectedOnlyInput.checked && !selectedIds.has(id)) return false;
    return !query || rowSearchText(id, preset).includes(query);
  });
}

function createRow(id, preset) {
  const row = document.createElement("tr");
  const selected = selectedIds.has(id);
  row.dataset.instrumentId = id;
  row.classList.toggle("is-selected", selected);
  row.classList.toggle("is-auditioned", id === auditionId);

  const checkCell = document.createElement("td");
  checkCell.className = "check-cell";
  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.checked = selected;
  checkbox.setAttribute("aria-label", `Include ${preset.label}`);
  checkbox.addEventListener("change", () => {
    if (checkbox.checked) {
      selectedIds.add(id);
    } else {
      selectedIds.delete(id);
    }
    render();
  });
  checkCell.append(checkbox);

  const nameCell = document.createElement("td");
  nameCell.className = "name-cell";
  const auditionButton = document.createElement("button");
  auditionButton.type = "button";
  auditionButton.className = "instrument-audition";
  auditionButton.dataset.auditionId = id;
  auditionButton.setAttribute("aria-pressed", String(id === auditionId));
  auditionButton.setAttribute("aria-label", `Audition ${preset.label}`);
  auditionButton.addEventListener("click", () => {
    selectAuditionInstrument(id);
  });
  const name = document.createElement("span");
  name.className = "instrument-name";
  name.textContent = preset.label;
  const instrumentId = document.createElement("span");
  instrumentId.className = "instrument-id";
  instrumentId.textContent = id;
  const mobileMeta = document.createElement("span");
  mobileMeta.className = "mobile-meta";
  mobileMeta.textContent = `${familyLabels[preset.family] ?? preset.family} / GM ${
    preset.gm === undefined ? "-" : preset.gm + 1
  }`;
  auditionButton.append(name, instrumentId, mobileMeta);
  nameCell.append(auditionButton);

  const familyCell = document.createElement("td");
  familyCell.className = "family-cell";
  familyCell.textContent = familyLabels[preset.family] ?? preset.family;

  const gmCell = document.createElement("td");
  gmCell.className = "number-cell gm-cell";
  gmCell.textContent = preset.gm === undefined ? "-" : String(preset.gm + 1);

  const rawCell = document.createElement("td");
  rawCell.className = "number-cell";
  rawCell.textContent = formatBytes(costs[id].raw);

  const gzipCell = document.createElement("td");
  gzipCell.className = "number-cell";
  gzipCell.textContent = formatBytes(costs[id].gzip);

  row.append(checkCell, nameCell, familyCell, gmCell, rawCell, gzipCell);
  return row;
}

async function updateFootprint() {
  const version = ++calculationVersion;
  const ids = selectedInDisplayOrder();
  const bank = buildBank(ids);
  const source = buildModuleSource(ids);

  selectedCount.textContent = String(ids.length);
  recipeSize.textContent = formatBytes(byteLength(JSON.stringify(bank)));
  moduleSize.textContent = formatBytes(byteLength(source));
  gzipSize.textContent = "...";
  addedSize.textContent = "...";

  const activeProfile = matchingProfile();
  const gzip = activeProfile
    ? plannerData.profileFootprints[activeProfile].gzip
    : await gzipByteLength(source);
  if (version !== calculationVersion) return;
  gzipSize.textContent = formatBytes(gzip);
  addedSize.textContent =
    gzip === null
      ? "N/A"
      : formatBytes(Math.max(0, gzip - plannerData.engineShell.gzip));
}

function render() {
  visibleEntries = currentVisibleEntries();
  rowsElement.replaceChildren(
    ...visibleEntries.map(([id, preset]) => createRow(id, preset)),
  );

  if (visibleEntries.length === 0) {
    const row = document.createElement("tr");
    row.className = "empty-row";
    const cell = document.createElement("td");
    cell.colSpan = 6;
    cell.textContent = "No instruments";
    row.append(cell);
    rowsElement.append(row);
  }

  const selectedVisible = visibleEntries.filter(([id]) => selectedIds.has(id));
  selectVisibleInput.checked =
    visibleEntries.length > 0 && selectedVisible.length === visibleEntries.length;
  selectVisibleInput.indeterminate =
    selectedVisible.length > 0 && selectedVisible.length < visibleEntries.length;
  resultCount.textContent = `${visibleEntries.length} instruments`;
  engineSize.textContent = `Engine ${formatBytes(plannerData.engineShell.gzip)} gzip`;
  syncPillThumb();
  void updateFootprint();
}

searchInput.addEventListener("input", render);
selectedOnlyInput.addEventListener("change", render);
window.addEventListener("resize", syncPillThumb);

selectVisibleInput.addEventListener("change", () => {
  visibleEntries.forEach(([id]) => {
    if (selectVisibleInput.checked) {
      selectedIds.add(id);
    } else {
      selectedIds.delete(id);
    }
  });
  render();
});

profileButtons.forEach((button) => {
  button.addEventListener("click", () => {
    selectedIds.clear();
    profiles[button.dataset.profile].forEach((id) => selectedIds.add(id));
    selectedOnlyInput.checked = false;
    render();
  });
});

clearButton.addEventListener("click", () => {
  selectedIds.clear();
  render();
});

sustainButton.addEventListener("click", () => {
  setSustain(sustainButton.getAttribute("aria-pressed") !== "true");
});

document.addEventListener("keydown", (event) => {
  if (
    event.repeat ||
    event.metaKey ||
    event.ctrlKey ||
    event.altKey ||
    isTextEntry(event.target)
  ) {
    return;
  }

  if (event.code === "Space") {
    event.preventDefault();
    setSustain(sustainButton.getAttribute("aria-pressed") !== "true");
    return;
  }

  const key = pianoKeyByCode.get(event.code);
  if (!key) return;
  event.preventDefault();
  startAuditionInput(`keyboard:${event.code}`, key);
});

document.addEventListener("keyup", (event) => {
  const inputId = `keyboard:${event.code}`;
  if (!auditionInputs.has(inputId)) return;
  event.preventDefault();
  stopAuditionInput(inputId);
});

window.addEventListener("blur", () => {
  stopAllAuditionNotes({ resetSustain: true });
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopAllAuditionNotes({ resetSustain: true });
});

copyButton.addEventListener("click", async () => {
  const ids = selectedInDisplayOrder();
  const include = `include: Object.freeze([\n${ids
    .map((id) => `  ${JSON.stringify(id)},`)
    .join("\n")}\n]),`;
  await navigator.clipboard.writeText(include);
  copyButton.textContent = "Copied";
  globalThis.setTimeout(() => {
    copyButton.textContent = "Copy include";
  }, 900);
});

renderPianoKeyboard();
syncAuditionSelection();
render();
    </script>
  </body>
</html>
