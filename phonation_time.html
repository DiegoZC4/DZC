<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cross-Linguistic Phonation Time</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;
     padding:16px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
h1{font-size:26px;font-weight:600;margin-bottom:8px;color:#f0f6fc;flex-shrink:0}
/* ── two-column layout ── */
#main-cols{display:flex;gap:22px;align-items:stretch;flex:1;min-height:0}
#left-col{flex:2;min-width:0;min-height:0;display:flex;flex-direction:column}
#right-col{flex:1;min-width:0;min-height:0;overflow-y:auto}
/* ── mode toggle ── */
#mode-row{display:flex;margin-bottom:10px;flex-shrink:0}
.mode-btn{font-size:17px;padding:5px 18px;background:#161b22;border:1px solid #30363d;color:#7d8590;cursor:pointer;transition:background .12s,color .12s}
#btn-phonation{border-radius:5px 0 0 5px}
#btn-total{border-radius:0 5px 5px 0;border-left:none}
.mode-btn.active{background:#21262d;color:#e6edf3}
.mode-btn:hover:not(.active){color:#c9d1d9;background:#1c2128}
/* ── chart ── */
#chart{display:block;flex:1;min-height:0;width:100%}
/* ── legend ── */
.leg-wrap{display:flex;flex-direction:column;gap:8px;margin-top:10px;flex-shrink:0}
.leg-group{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:9px 14px}
.leg-header{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.leg-title{font-size:17px;font-weight:600;color:#7d8590;text-transform:uppercase;letter-spacing:.05em}
.leg-title.incomplete{color:#d29922}
.grp-btn{font-size:15px;color:#7d8590;cursor:pointer;padding:3px 10px;border-radius:3px;background:#0d1117;border:1px solid #21262d;white-space:nowrap}
.grp-btn:hover{color:#e6edf3;border-color:#444c56}
.leg-chips{display:flex;flex-wrap:wrap;gap:5px}
.lc{display:flex;align-items:center;gap:6px;font-size:17px;cursor:pointer;padding:4px 10px;border-radius:4px;background:#0d1117;border:1px solid transparent;user-select:none;transition:border-color .15s}
.lc:hover{border-color:#30363d}.lc.on{border-color:currentColor}
.sw{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.split-badge{font-size:14px;color:#d29922;margin-left:2px}
/* ── stats panel ── */
.sp-box{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:14px 16px}
.sp-title{font-size:18px;font-weight:600;color:#f0f6fc;margin-bottom:3px}
.sp-sub{font-size:15px;color:#7d8590;margin-bottom:12px}
.sp-global{font-size:17px;color:#7d8590;line-height:1.85;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #21262d}
.sp-global b{color:#e6edf3}
#sp-table{width:100%;border-collapse:collapse;font-size:16px}
#sp-table th{padding:3px 6px;color:#7d8590;font-weight:500;border-bottom:1px solid #21262d;white-space:nowrap}
#sp-table th:first-child{text-align:left}
#sp-table th:not(:first-child){text-align:right}
#sp-table td{padding:4px 6px;border-bottom:1px solid #0d1117}
#sp-table td:first-child{text-align:left}
#sp-table td:not(:first-child){text-align:right;color:#c9d1d9}
#sp-table tr:hover td{background:#1c2128}
.z-fast{color:#3fb950;font-weight:600}
.z-slow{color:#f97316;font-weight:600}
.z-mid{color:#7d8590}
/* ── tooltip ── */
#tip{position:fixed;display:none;background:#1c2128;border:1px solid #30363d;border-radius:5px;padding:8px 12px;font-size:17px;color:#e6edf3;pointer-events:none;z-index:9999;line-height:1.7}
.tip-grid{display:grid;grid-template-columns:3em 1fr;gap:1px 10px;font-size:15px;font-family:monospace;margin-top:6px}
.tip-grid .tk{color:#7d8590}
.tip-total{margin-top:6px;padding-top:6px;border-top:1px solid #30363d;font-size:16px}
svg text{user-select:none}
@media(max-width:1000px){
  body{overflow-y:auto;height:auto}
  #main-cols{flex-direction:column}
  #right-col{order:-1;overflow-y:visible}
  #left-col{min-height:60vh}
}
</style>
</head>

</div>

const DEFAULT_HIDDEN=new Set(["DEU", "ENG", "ITA", "TUR"]);
const LS_KEY='phonation_vis_v1';

const SPK_BY_ID=Object.fromEntries(RAW.map(s=>[s.id,s]));

// ── Mode ──────────────────────────────────────────────────────────────────────
let usePhonation=true;
function val(x){return usePhonation?x.p:x.d;}

// ── Y-axis pan / zoom ─────────────────────────────────────────────────────────
const Y_MIN_BOUND=0, Y_MAX_BOUND=500;
let yView=null;           // {min,max} | null = auto-fit to visible data
let currentYMIN=0, currentYMAX=360;  // last rendered range; seeds yView on first scroll

// ── Visibility ────────────────────────────────────────────────────────────────
function loadVis(){
  try{const s=localStorage.getItem(LS_KEY);if(s)return new Set(JSON.parse(s));}catch(e){}
  return new Set(Object.keys(LANG_FULL).filter(l=>!DEFAULT_HIDDEN.has(l)));
}
function saveVis(){localStorage.setItem(LS_KEY,JSON.stringify([...vis]));}
const vis=loadVis();

// ── Colors ────────────────────────────────────────────────────────────────────
const COLORS=(()=>{
  const c={},PHI=0.618033988749895;let h=0.08;
  for(const l of Object.keys(LANG_FULL)){c[l]=`hsl(${Math.round(h*360)},78%,62%)`;h=(h+PHI)%1;}
  return c;
})();

// ── Data helpers ──────────────────────────────────────────────────────────────
function spkTotal(texts){return texts.reduce((s,x)=>s+val(x),0);}
function byLang(){
  const m={};for(const l of Object.keys(LANG_FULL))m[l]=[];
  for(const s of RAW)if(m[s.lang])m[s.lang].push({v:spkTotal(s.texts),id:s.id});
  for(const l of Object.keys(LANG_FULL))m[l].sort((a,b)=>a.v-b.v);
  return m;
}
function sts(arr){
  const n=arr.length;if(n<2)return{mean:arr[0]||0,std:0};
  const mean=arr.reduce((a,b)=>a+b,0)/n;
  return{mean,std:Math.sqrt(arr.reduce((s,x)=>s+(x-mean)**2,0)/(n-1))};
}

// ── Stats ─────────────────────────────────────────────────────────────────────
let langStats={};
let completeSpeakerVals=[];

function computeStats(){
  const data=byLang();
  langStats={};completeSpeakerVals=[];
  for(const lang of Object.keys(LANG_FULL)){
    const spks=data[lang];if(!spks.length)continue;
    langStats[lang]=sts(spks.map(s=>s.v));
    if(!INCOMPLETE.has(lang))completeSpeakerVals.push(...spks.map(s=>s.v));
  }
}

function renderStats(){
  const modeLbl=usePhonation?'pauses ≥ 150 ms removed':'unfiltered recording time';
  document.getElementById('sp-sub').textContent=`Complete languages · ${modeLbl}`;

  const rows=COMPLETE_LANGS.filter(l=>langStats[l]).map(l=>({lang:l,...langStats[l]}));
  const n=rows.length;if(!n)return;
  const N=completeSpeakerVals.length;
  const gMean=completeSpeakerVals.reduce((a,b)=>a+b,0)/N;
  const gSd=Math.sqrt(completeSpeakerVals.reduce((s,x)=>s+(x-gMean)**2,0)/(N-1));
  const spkPerLang=Math.round(N/n);

  document.getElementById('sp-global').innerHTML=
    `Grand mean: <b>${gMean.toFixed(1)} s</b><br>`+
    `SD (all speakers): <b>${gSd.toFixed(1)} s</b><br>`+
    `${n} languages, ${spkPerLang} speakers/language, 15 phrases/speaker`;

  rows.forEach(r=>{r.z=(r.mean-gMean)/gSd;});
  rows.sort((a,b)=>a.mean-b.mean);
  const tbody=document.getElementById('sp-body');
  tbody.innerHTML='';
  for(const r of rows){
    const zCls=r.z<-0.5?'z-fast':r.z>0.5?'z-slow':'z-mid';
    const zStr=(r.z>=0?'+':'')+r.z.toFixed(2);
    const tr=document.createElement('tr');
    tr.innerHTML=
      `<td><span style="color:${COLORS[r.lang]};font-weight:600">${r.lang}</span>`+
        `<span style="color:#7d8590;margin-left:5px">${LANG_FULL[r.lang]}</span></td>`+
      `<td>${r.mean.toFixed(1)}</td><td>${r.std.toFixed(1)}</td>`+
      `<td class="${zCls}">${zStr}</td>`;
    tbody.appendChild(tr);
  }
}

// ── Tooltip ───────────────────────────────────────────────────────────────────
const tipEl=document.getElementById('tip');
function showTip(html,e){
  tipEl.innerHTML=html;tipEl.style.left='-9999px';tipEl.style.top='-9999px';
  tipEl.style.display='block';moveTip(e);
}
function hideTip(){tipEl.style.display='none';}
function moveTip(e){
  const tw=tipEl.offsetWidth,th=tipEl.offsetHeight;
  let x=e.clientX+16,y=e.clientY-10;
  if(x+tw>window.innerWidth-8)x=e.clientX-tw-16;
  if(y+th>window.innerHeight-8)y=e.clientY-th-10;
  if(y<4)y=4;
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';
}
function langTipHtml(lang){
  const s=langStats[lang];if(!s)return '';
  const lbl=usePhonation?'Phonation':'Duration';
  return `<b style="color:${COLORS[lang]}">${LANG_FULL[lang]}</b><br>`+
         `${lbl} mean: <b>${s.mean.toFixed(1)} s</b>&ensp;σ: <b>${s.std.toFixed(1)} s</b>`;
}
function spkTipHtml(spkId){
  const spk=SPK_BY_ID[spkId];if(!spk)return '';
  const col=COLORS[spk.lang];
  const sorted=[...spk.texts].sort((a,b)=>{
    if(a.t[0]!==b.t[0])return a.t<b.t?-1:1;
    return parseInt(a.t.slice(1))-parseInt(b.t.slice(1));
  });
  const rows=sorted.map(x=>`<span class="tk">${x.t}</span><span>${val(x).toFixed(1)} s</span>`).join('');
  const total=sorted.reduce((s,x)=>s+val(x),0);
  return `<b style="color:${col};font-family:monospace">${spkId}</b>`+
         `<div class="tip-grid">${rows}</div>`+
         `<div class="tip-total">Total: <b>${total.toFixed(1)} s</b></div>`;
}

// ── SVG constants ─────────────────────────────────────────────────────────────
const W=1060,H=560,MT=32,MR=100,MB=50,ML=62;
const PW=W-ML-MR,PH=H-MT-MB;
const BX=ML+PW+22,TW=16;
const xp=r=>ML+(r/9)*PW;
function el(tag,a,t){
  const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(const[k,v]of Object.entries(a||{}))e.setAttribute(k,v);
  if(t!=null)e.textContent=t;return e;
}

// ── Render chart ──────────────────────────────────────────────────────────────
function render(){
  const svg=document.getElementById('chart');
  svg.innerHTML='';
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('width','100%');
  svg.setAttribute('height','100%');
  const data=byLang();

  let rawMinV=Infinity,rawMaxV=-Infinity;
  for(const lang of Object.keys(LANG_FULL)){
    if(!vis.has(lang))continue;
    for(const s of data[lang]){
      if(s.v<rawMinV)rawMinV=s.v;
      if(s.v>rawMaxV)rawMaxV=s.v;
    }
  }
  if(!isFinite(rawMaxV)){rawMinV=0;rawMaxV=360;}
  let YMIN,YMAX;
  if(yView){
    YMIN=Math.max(yView.min,Y_MIN_BOUND);
    YMAX=Math.min(yView.max,Y_MAX_BOUND);
  }else{
    const range=rawMaxV-rawMinV;
    const pad=Math.max(range*0.08,10);
    YMIN=Math.max(Y_MIN_BOUND,Math.floor((rawMinV-pad)/10)*10);
    YMAX=Math.min(Y_MAX_BOUND,Math.ceil((rawMaxV+pad)/10)*10);
  }
  currentYMIN=YMIN;currentYMAX=YMAX;
  const step=(YMAX-YMIN)>390?60:30;
  const yp=v=>MT+PH-((v-YMIN)/(YMAX-YMIN))*PH;

  svg.appendChild(el('rect',{width:W,height:H,fill:'#0d1117'}));

  const gridStart=Math.floor(YMIN/step)*step;
  for(let y=gridStart;y<=YMAX;y+=step){
    const yv=yp(y);
    if(yv<MT-1||yv>MT+PH+1)continue;
    svg.appendChild(el('line',{x1:ML,y1:yv,x2:ML+PW,y2:yv,stroke:'#161b22','stroke-width':1}));
    svg.appendChild(el('text',{x:ML-7,y:yv+4,'text-anchor':'end',fill:'#7d8590','font-size':15},Math.round(y)));
  }
  for(let r=0;r<10;r++){
    const xv=xp(r);
    svg.appendChild(el('line',{x1:xv,y1:MT,x2:xv,y2:MT+PH,stroke:'#161b22','stroke-width':1}));
    svg.appendChild(el('text',{x:xv,y:MT+PH+18,'text-anchor':'middle',fill:'#7d8590','font-size':15},r+1));
  }
  svg.appendChild(el('line',{x1:ML,y1:MT,x2:ML,y2:MT+PH,stroke:'#30363d','stroke-width':1}));
  svg.appendChild(el('line',{x1:ML,y1:MT+PH,x2:ML+PW,y2:MT+PH,stroke:'#30363d','stroke-width':1}));
  const yLbl=usePhonation?'Phonation time across recorded texts (s)':'Total recording time across texts (s)';
  svg.appendChild(el('text',{transform:'rotate(-90)',x:-(MT+PH/2),y:16,'text-anchor':'middle',fill:'#7d8590','font-size':17},yLbl));
  svg.appendChild(el('text',{x:ML+PW/2,y:H-10,'text-anchor':'middle',fill:'#7d8590','font-size':17},'Speaker rank (fastest → slowest)'));

  // Data points + speaker hover
  for(const lang of Object.keys(LANG_FULL)){
    if(!vis.has(lang))continue;
    const spks=data[lang];if(!spks.length)continue;
    const col=COLORS[lang],dash=INCOMPLETE.has(lang)?'4,3':'none';
    svg.appendChild(el('polyline',{
      points:spks.map((s,i)=>`${xp(i)},${yp(s.v)}`).join(' '),
      fill:'none',stroke:col,'stroke-width':1.5,'stroke-dasharray':dash,opacity:0.65}));
    for(let i=0;i<spks.length;i++){
      const cx=xp(i),cy=yp(spks[i].v),spkId=spks[i].id;
      const circ=INCOMPLETE.has(lang)
        ?el('circle',{cx,cy,r:5.5,fill:'none',stroke:col,'stroke-width':1.8,opacity:0.85,cursor:'pointer'})
        :el('circle',{cx,cy,r:5.5,fill:col,stroke:'#0d1117','stroke-width':1.5,cursor:'pointer'});
      circ.addEventListener('mouseenter',e=>{showTip(spkTipHtml(spkId),e);});
      circ.addEventListener('mousemove',moveTip);
      circ.addEventListener('mouseleave',hideTip);
      svg.appendChild(circ);
    }
  }

  // E-brackets
  svg.appendChild(el('line',{x1:BX-8,y1:MT,x2:BX-8,y2:MT+PH,stroke:'#21262d','stroke-width':1}));
  svg.appendChild(el('text',{x:BX+TW/2,y:MT-12,'text-anchor':'middle',fill:'#7d8590','font-size':14},'mean±σ'));
  const brackets=[];
  for(const lang of Object.keys(LANG_FULL)){
    if(!vis.has(lang))continue;
    const spks=data[lang];if(spks.length<2)continue;
    const{mean,std}=sts(spks.map(s=>s.v));
    brackets.push({lang,col:COLORS[lang],ymean:yp(mean),ytop:yp(mean+std),ybot:yp(mean-std)});
  }
  const lbls=brackets.map(b=>({lang:b.lang,y:b.ymean})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<lbls.length;i++)if(lbls[i].y-lbls[i-1].y<13)lbls[i].y=lbls[i-1].y+13;
  for(let i=lbls.length-2;i>=0;i--)if(lbls[i+1].y-lbls[i].y<13)lbls[i].y=lbls[i+1].y-13;
  const ny={};for(const p of lbls)ny[p.lang]=p.y;
  for(const b of brackets){
    const{lang,col,ymean,ytop,ybot}=b,sx=BX+TW/2;
    svg.appendChild(el('line',{x1:sx,y1:ytop,x2:sx,y2:ybot,stroke:col,'stroke-width':1.5,opacity:0.75,'stroke-dasharray':INCOMPLETE.has(lang)?'3,2':'none'}));
    for(const[yv,w]of[[ytop,TW],[ymean,TW*1.5],[ybot,TW]])
      svg.appendChild(el('line',{x1:BX,y1:yv,x2:BX+w,y2:yv,stroke:col,'stroke-width':w===TW?1.5:2,opacity:0.85}));
    const lx=BX+TW*1.5+4,ly=ny[lang];
    const hr=el('rect',{x:lx-2,y:ly-9,width:40,height:16,fill:'transparent',cursor:'default'});
    hr.addEventListener('mouseenter',e=>{const h=langTipHtml(lang);if(h)showTip(h,e);});
    hr.addEventListener('mousemove',moveTip);
    hr.addEventListener('mouseleave',hideTip);
    svg.appendChild(hr);
    svg.appendChild(el('text',{x:lx,y:ly+4,fill:col,'font-size':14,'font-family':'monospace','font-weight':'600','pointer-events':'none'},lang));
  }
}

// ── Full refresh ──────────────────────────────────────────────────────────────
function fullRefresh(){yView=null;computeStats();renderStats();render();}

// ── Scroll pan / zoom ─────────────────────────────────────────────────────────
function initWheel(){
  const chartEl=document.getElementById('chart');
  chartEl.addEventListener('wheel',e=>{
    e.preventDefault();
    if(!yView)yView={min:currentYMIN,max:currentYMAX};
    const range=yView.max-yView.min;
    if(e.shiftKey){
      const center=(yView.min+yView.max)/2;
      const factor=e.deltaY>0?1.12:1/1.12;
      const newHalf=Math.max(15,range/2*factor);
      yView={min:center-newHalf,max:center+newHalf};
    }else{
      const delta=(e.deltaY/300)*range;
      yView={min:yView.min-delta,max:yView.max-delta};
    }
    // Clamp to bounds
    const r=yView.max-yView.min;
    if(yView.min<Y_MIN_BOUND){yView={min:Y_MIN_BOUND,max:Y_MIN_BOUND+r};}
    if(yView.max>Y_MAX_BOUND){yView={min:Y_MAX_BOUND-r,max:Y_MAX_BOUND};}
    render();
  },{passive:false});
  chartEl.addEventListener('dblclick',()=>{yView=null;render();});
}

// ── Mode toggle ───────────────────────────────────────────────────────────────
document.getElementById('btn-phonation').addEventListener('click',()=>{
  if(usePhonation)return;usePhonation=true;
  document.getElementById('btn-phonation').classList.add('active');
  document.getElementById('btn-total').classList.remove('active');
  fullRefresh();
});
document.getElementById('btn-total').addEventListener('click',()=>{
  if(!usePhonation)return;usePhonation=false;
  document.getElementById('btn-total').classList.add('active');
  document.getElementById('btn-phonation').classList.remove('active');
  fullRefresh();
});

// ── Group toggle ──────────────────────────────────────────────────────────────
function grpLabel(group){return group.every(l=>!vis.has(l))?'show all':'hide all';}
function refreshGrpBtns(){
  document.getElementById('btn-complete').textContent=grpLabel(COMPLETE_LANGS);
  document.getElementById('btn-incomplete').textContent=grpLabel(INCOMPLETE_LANGS);
}
function toggleGroup(group){
  if(group.every(l=>!vis.has(l)))group.forEach(l=>vis.add(l));
  else group.forEach(l=>vis.delete(l));
  saveVis();refreshGrpBtns();
  document.querySelectorAll('.lc').forEach(d=>d.classList.toggle('on',vis.has(d.dataset.lang)));
  yView=null;render();
}

// ── Legend ────────────────────────────────────────────────────────────────────
function buildLegend(){
  function makeChip(lang,container){
    const d=document.createElement('div');
    d.className='lc'+(vis.has(lang)?' on':'');
    d.style.color=COLORS[lang];d.dataset.lang=lang;
    const sw=document.createElement('span');sw.className='sw';sw.style.background=COLORS[lang];
    const lb=document.createElement('span');lb.textContent=`${lang} · ${LANG_FULL[lang]}`;
    d.append(sw,lb);
    if(INCOMPLETE.has(lang)){const b=document.createElement('span');b.className='split-badge';b.textContent='split';d.append(b);}
    d.addEventListener('click',()=>{
      vis.has(lang)?vis.delete(lang):vis.add(lang);
      d.classList.toggle('on',vis.has(lang));
      saveVis();refreshGrpBtns();yView=null;render();
    });
    d.addEventListener('mouseenter',e=>{const h=langTipHtml(lang);if(h)showTip(h,e);});
    d.addEventListener('mousemove',moveTip);
    d.addEventListener('mouseleave',hideTip);
    container.appendChild(d);
  }
  const cc=document.getElementById('chips-complete');
  const ci=document.getElementById('chips-incomplete');
  COMPLETE_LANGS.forEach(l=>makeChip(l,cc));
  INCOMPLETE_LANGS.forEach(l=>makeChip(l,ci));
  document.getElementById('btn-complete').addEventListener('click',()=>toggleGroup(COMPLETE_LANGS));
  document.getElementById('btn-incomplete').addEventListener('click',()=>toggleGroup(INCOMPLETE_LANGS));
  refreshGrpBtns();
}

buildLegend();
fullRefresh();
initWheel();
</script>
</body>
</html>
