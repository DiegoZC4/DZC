<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Transcript Search</title>
<style>
:root {
  --bg: #f7f7f4;
  --ink: #181818;
  --muted: #6f706c;
  --line: #d9d8d0;
  --panel: #ffffff;
  --accent: #cc241d;
  --accent-soft: #fff0ef;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { display: flex; justify-content: center; }
main { width: min(980px, 100%); padding: 22px 16px 44px; }
h1 { margin: 0 0 14px; font-size: clamp(28px, 5vw, 52px); line-height: 1; letter-spacing: 0; }
.searchbar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(170px, 240px) 82px; gap: 8px; align-items: stretch; position: sticky; top: 0; z-index: 2; padding: 10px 0 14px; background: var(--bg); }
input, select, button { min-height: 46px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
input, select { padding: 0 12px; border-radius: 7px; }
button { border-radius: 7px; cursor: pointer; font-weight: 800; }
button.primary { border-color: var(--accent); background: var(--accent); color: white; }
.meta { min-height: 24px; color: var(--muted); font-size: 14px; margin: 2px 0 14px; }
.results { display: grid; gap: 9px; }
.result { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.result-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 7px; }
.title { font-weight: 800; line-height: 1.25; }
.channel { color: var(--muted); font-size: 13px; margin-top: 2px; }
.time { flex: 0 0 auto; color: var(--accent); background: var(--accent-soft); border: 1px solid #ffd2cf; border-radius: 999px; padding: 4px 9px; font-weight: 800; text-decoration: none; }
.snippet { color: #30302e; line-height: 1.45; }
.empty { padding: 18px 0; color: var(--muted); }
@media (max-width: 680px) {
  .searchbar { grid-template-columns: 1fr 82px; }
  select { grid-column: 1 / -1; order: 3; }
  .result-top { align-items: flex-start; }
}
</style>
</head>
<body>
<main>
  <h1>Transcript Search</h1>
  <form class="searchbar" id="searchForm">
    <input id="queryInput" name="q" autocomplete="off" placeholder="Search across transcripts">
    <select id="channelSelect" name="channel">
      <option value="">All channels</option>
    </select>
    <button class="primary" type="submit">Search</button>
  </form>
  <div class="meta" id="meta"></div>
  <section class="results" id="results"></section>
</main>
<script>
const form = document.getElementById('searchForm');
const queryInput = document.getElementById('queryInput');
const channelSelect = document.getElementById('channelSelect');
const meta = document.getElementById('meta');
const results = document.getElementById('results');

init();

async function init() {
  await loadChannels();
  form.addEventListener('submit', event => {
    event.preventDefault();
    search();
  });
}

async function loadChannels() {
  try {
    const payload = await getJson('api.php?action=channels');
    channelSelect.replaceChildren(new Option('All channels', ''));
    for (const row of payload.channels || []) {
      channelSelect.appendChild(new Option(`${row.channel} (${row.video_count})`, row.channel));
    }
    const stats = payload.stats || {};
    meta.textContent = `${stats.videos || 0} videos, ${stats.channels || 0} channels indexed`;
  } catch (error) {
    meta.textContent = error.message;
  }
}

async function search() {
  const query = queryInput.value.trim();
  if (!query) {
    results.innerHTML = '<div class="empty">Type a search phrase.</div>';
    return;
  }
  meta.textContent = 'Searching...';
  results.innerHTML = '';
  try {
    const params = new URLSearchParams({
      action: 'search',
      q: query,
      channel: channelSelect.value,
      limit: '60'
    });
    const payload = await getJson(`api.php?${params}`);
    renderResults(payload.results || [], query);
  } catch (error) {
    meta.textContent = error.message;
  }
}

function renderResults(items, query) {
  meta.textContent = `${items.length} result${items.length === 1 ? '' : 's'} for "${query}"`;
  if (!items.length) {
    results.innerHTML = '<div class="empty">No matches.</div>';
    return;
  }
  const fragment = document.createDocumentFragment();
  for (const item of items) {
    const article = document.createElement('article');
    article.className = 'result';
    article.innerHTML = `
      <div class="result-top">
        <div>
          <div class="title"></div>
          <div class="channel"></div>
        </div>
        <a class="time" target="_blank" rel="noreferrer"></a>
      </div>
      <div class="snippet"></div>
    `;
    article.querySelector('.title').textContent = item.title || item.youtube_id;
    article.querySelector('.channel').textContent = item.channel || '';
    const time = article.querySelector('.time');
    time.href = item.url;
    time.textContent = item.timestamp || '0:00';
    article.querySelector('.snippet').textContent = item.snippet || '';
    fragment.appendChild(article);
  }
  results.replaceChildren(fragment);
}

async function getJson(url) {
  const response = await fetch(url, { cache: 'no-store' });
  const payload = await response.json();
  if (!response.ok || !payload.ok) throw new Error(payload.error || `Request failed (${response.status})`);
  return payload;
}
</script>
</body>
</html>
