<style>
:root{--paper:#fbfaf7;--ink:#1b1a17;--muted:#7a756c}
@media(prefers-color-scheme:dark){:root{--paper:#141a23;--ink:#e8eef7;--muted:#8d8896}}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;gap:20px;padding:24px;
  background:var(--paper);color:var(--ink);font:16px/1.4 system-ui;text-align:center}
/* The code never follows the theme. A QR is specified as dark modules on a light
   ground; inverting it is something modern cameras forgive and older scanners do
   not, so it keeps its own white card in either theme. The 4-module quiet zone
   is the spec's, for the same reason. */
.card{background:#fff;padding:14px;border-radius:12px;line-height:0;
  box-shadow:0 1px 3px rgb(0 0 0/.25)}
.code{display:block;width:min(74vw,70vh,420px);height:auto;color:#000}
a{color:inherit;font:600 1.0625rem system-ui;text-decoration:none;
  border-bottom:2px solid var(--muted);padding-bottom:2px}
</style>
