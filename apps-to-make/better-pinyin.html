<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Better Pinyin</title><link rel="stylesheet" href="draft.css"><style>
.stage{display:grid;grid-template-rows:auto minmax(0,1fr);gap:1rem}.composer{padding:clamp(1rem,4vw,2.5rem)}.output{font-family:"Kaiti SC","STKaiti","Songti SC",serif;font-size:clamp(2.2rem,8vw,6rem);min-height:1.2em;word-break:break-word}.contours{display:flex;gap:.45rem;align-items:end;min-height:80px;overflow:auto}.contour{min-width:65px;text-align:center}.contour svg{width:62px;height:42px;display:block}.contour path{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}.quiz{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.hanzi{display:grid;place-items:center;font-family:"Kaiti SC","STKaiti",serif;font-size:clamp(4rem,11vw,9rem);background:#172b2e;color:#f4efe3;border-radius:18px}.practice{display:grid;align-content:center;gap:1rem}.feedback{min-height:3rem;padding:.7rem;border-left:4px solid var(--line)}.feedback.good{border-color:var(--good)}.feedback.bad{border-color:var(--accent-2)}@media(max-width:720px){.quiz{grid-template-columns:1fr}.hanzi{min-height:180px}}
</style></head><body><main class="app"><header class="topbar"><h1>Better Pinyin</h1><span class="kicker">numbered tones in, readable tones out</span></header><div class="workspace"><aside class="sidebar stack"><div class="eyebrow">Tone placement rules</div><p><strong>a</strong> and <strong>e</strong> take priority; <strong>ou</strong> marks the o; otherwise mark the final vowel.</p><p class="muted">Type <span class="mono">v</span> or <span class="mono">u:</span> for ü. Tone 5 is neutral. Apostrophes and punctuation are preserved.</p><button id="copy">Copy converted text</button><div class="split"><div><div class="eyebrow">Correct</div><div class="metric" id="correct">0</div></div><div><div class="eyebrow">Streak</div><div class="metric" id="streak">0</div></div></div></aside><section class="stage"><div class="composer panel stack"><label>Numbered pinyin<input id="input" class="mono" value="ni3 hao3, wo3 bu4 zhi1 dao4."></label><div class="output" id="output"></div><div class="contours" id="contours"></div></div><div class="quiz"><div class="hanzi" id="hanzi"></div><div class="practice panel"><div class="eyebrow">Write the pronunciation</div><div id="meaning" class="muted"></div><input id="answer" class="mono" autocomplete="off" placeholder="numbered pinyin"><div class="row"><button class="primary" id="check">Check</button><button id="reveal">Reveal</button><button id="next">Next</button></div><div class="feedback" id="feedback"></div></div></div></section></div></main><script>
const MARKS={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ',A:'ĀÁǍÀ',E:'ĒÉĚÈ',I:'ĪÍǏÌ',O:'ŌÓǑÒ',U:'ŪÚǓÙ','Ü':'ǕǗǙǛ'},cards=[['你好','hello','ni3 hao3'],['谢谢','thank you','xie4 xie5'],['北京','Beijing','bei3 jing1'],['我不知道','I do not know','wo3 bu4 zhi1 dao4'],['学习','to study','xue2 xi2'],['女儿','daughter','nv3 er2'],['朋友','friend','peng2 you5'],['再见','goodbye','zai4 jian4'],['多少钱','how much','duo1 shao3 qian2'],['星期六','Saturday','xing1 qi1 liu4']],$=id=>document.getElementById(id),KEY='appsToMake.betterPinyin.v1';let index=0,stats={correct:0,streak:0};try{stats={...stats,...JSON.parse(localStorage.getItem(KEY))}}catch{}
function markSyllable(raw){const m=raw.match(/^([A-Za-züÜvV:]+)([1-5])$/);if(!m)return raw;let s=m[1].replace(/u:|v/gi,x=>x[0]===x[0].toUpperCase()?'Ü':'ü'),tone=+m[2];if(tone===5)return s;const low=s.toLowerCase();let at=low.indexOf('a');if(at<0)at=low.indexOf('e');if(at<0&&low.includes('ou'))at=low.indexOf('o');if(at<0){for(let i=low.length-1;i>=0;i--)if('aeiouü'.includes(low[i])){at=i;break}}if(at<0)return s;const ch=s[at],marked=MARKS[ch]?.[tone-1]||ch;return s.slice(0,at)+marked+s.slice(at+1)}
function convert(text){return text.replace(/[A-Za-züÜvV:]+[1-5]/g,markSyllable)}function toneTokens(text){return[...text.matchAll(/([A-Za-züÜvV:]+)([1-5])/g)].map(m=>({syllable:markSyllable(m[0]),tone:+m[2]}))}const paths={1:'M7 10 L55 10',2:'M7 34 L55 8',3:'M7 14 Q31 45 55 12',4:'M7 8 L55 34',5:'M8 22 L54 22'};
function updateComposer(){const text=$('input').value;$('output').textContent=convert(text);$('contours').innerHTML=toneTokens(text).map(t=>`<div class="contour"><svg viewBox="0 0 62 42"><path d="${paths[t.tone]}"></path></svg><span>${t.syllable}</span></div>`).join('')}
function normalized(s){return convert(s.trim().toLowerCase().replace(/\s+/g,' '))}function renderCard(){const c=cards[index];$('hanzi').textContent=c[0];$('meaning').textContent=c[1];$('answer').value='';$('feedback').className='feedback';$('feedback').textContent='';$('answer').focus();$('correct').textContent=stats.correct;$('streak').textContent=stats.streak}function check(reveal=false){const c=cards[index],expected=normalized(c[2]),actual=normalized($('answer').value),ok=!reveal&&actual===expected;if(ok){stats.correct++;stats.streak++;$('feedback').className='feedback good';$('feedback').textContent=`Correct: ${expected}`}else{if(!reveal)stats.streak=0;$('feedback').className='feedback bad';$('feedback').textContent=`${expected} · numbered: ${c[2]}`}localStorage.setItem(KEY,JSON.stringify(stats));$('correct').textContent=stats.correct;$('streak').textContent=stats.streak}
$('input').oninput=updateComposer;$('copy').onclick=()=>navigator.clipboard.writeText($('output').textContent);$('check').onclick=()=>check(false);$('reveal').onclick=()=>check(true);$('next').onclick=()=>{index=(index+1)%cards.length;renderCard()};$('answer').onkeydown=e=>{if(e.key==='Enter')check(false)};updateComposer();renderCard();
</script></body></html>
