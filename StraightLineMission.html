<body>
  <div id="map" style="height: 50vh"></div>
  <p>Land/Water Ratio along pseudo-Great-Circle defined by (x,-30) and (y,30)</p>
  <p>Click and drag on image below to change x and y.</p>
  <img id="LatLat" src="circumnav30LongLand.png">

  <p> RMSE = sqrt( sum(e^2 for e in Errors) / Errors.length) </p>

<style>
  /* Each section takes 50% of screen height */
  #map, #LatLat, #scoring {
    height: 40vh; /* 50% of viewport height */

<script>
const pointSpacing = 5 // km

function updateGreatCircle(){
  const [A, B] = [Amarker, Bmarker].map(x=>{
    const LL = x.getLatLng()
    x.setTooltipContent(`${LL.lat}, ${LL.lng}`);
    return LL
  })

  const [Apoint, Bpoint] = [A, B].map(x=>turf.point([x.lng,x.lat]))
  const mid = turf.midpoint(Apoint, Bpoint).geometry.coordinates
  const antiMid = turf.point([(mid[0]+360)%360-180, -mid[1]])
  const greatCirclePoints = []
  ;[[antiMid, Apoint], [Apoint,Bpoint], [Bpoint, antiMid]].forEach(([x,y])=>{
    const points = turf.greatCircle(x,y,
    {npoints:Math.round(turf.distance(x,y)/pointSpacing)}).geometry.coordinates
    greatCirclePoints.push(...(Array.isArray(points[0][0]) ? points.flat(): points))
  })
  greatCirclePoints.sort((a,b)=>a[0]-b[0])
  greatCircle.setLatLngs(greatCirclePoints.map(c=>L.latLng(c.reverse())))
}

const map = L.map('map').setView([0,0], 2);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
L.control.scale().addTo(map);
const [Amarker, Bmarker] = [
  [-8.15625  , -30],
  [-30.8984375, 30]
].map((coords)=>{
  const marker = L.marker(coords,{draggable:true}).addTo(map)
  marker.on('drag',updateGreatCircle)
  marker.bindTooltip("Loading...", { permanent: true, direction: "center"})
  return marker
})
const greatCircle = L.polyline([[]]).addTo(map);
updateGreatCircle()

const img = document.getElementById('LatLat')
img.addEventListener('mousedown',startDrag)

function startDrag(event) {
  event.preventDefault();
  setMarkers(event)

  function onMouseMove(e) {
    setMarkers(e)
  }

  function onMouseUp() {
    img.removeEventListener('mousemove', onMouseMove);
    img.removeEventListener('mouseup', onMouseUp);
  }

  img.addEventListener('mousemove', onMouseMove);
  img.addEventListener('mouseup', onMouseUp);
}

function setMarkers(e){
  const rect = img.getBoundingClientRect();
  let x = -50+Math.round((e.clientX - rect.left)/img.width*201)/2;
  let y = 50-Math.round((e.clientY - rect.top)/img.height*201)/2;
  Amarker.setLatLng(L.latLng([x,-30]))
  Bmarker.setLatLng(L.latLng([y,30]))
  updateGreatCircle()
}

function svg(tagName, attrs, textContent) {
  var el = document.createElementNS('http://www.w3.org/2000/svg', tagName);
  for (var key in attrs) el.setAttribute(key, attrs[key]);
  if (textContent) el.textContent = textContent;
  return el;
}
