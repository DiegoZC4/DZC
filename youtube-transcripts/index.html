<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Transcript Search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff0000'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='28' font-weight='900' fill='white'%3ECC%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f7f7f4;
  --ink: #181818;
  --muted: #6f706c;
  --line: #d9d8d0;
  --panel: #ffffff;
  --accent: #cc241d;
  --accent-soft: #fff0ef;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { width: 100%; }
main { width: 100%; padding: 10px clamp(10px, 1.6vw, 28px) 44px; }
.searchbar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.85fr) minmax(0, 1.15fr) 82px; gap: 8px; align-items: stretch; position: sticky; top: 0; z-index: 2; padding: 10px 0 8px; background: var(--bg); }
.searchbar > * { min-width: 0; }
input, button { min-height: 46px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
input { padding: 0 12px; border-radius: 7px; }
button { border-radius: 7px; cursor: pointer; font-weight: 800; }
button.primary { border-color: var(--accent); background: var(--accent); color: white; }
.channel-summary { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.subnav { align-items: center; display: flex; gap: 12px; justify-content: space-between; }
.subnav a { color: var(--accent); font-size: 13px; font-weight: 850; text-decoration: none; }
.view-tabs { align-items: center; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.view-tab { background: transparent; border-color: var(--line); color: var(--muted); font-size: 13px; min-height: 32px; padding: 0 10px; }
.view-tab[data-active="true"] { background: var(--ink); border-color: var(--ink); color: white; }
.channel-picker { min-width: 0; position: relative; }
.channel-tokenbox { align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; cursor: text; display: flex; flex-wrap: wrap; gap: 6px; min-height: 46px; min-width: 0; padding: 6px; }
.channel-tokenbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(204, 36, 29, 0.12); }
.filter-chip { align-items: center; background: var(--category-chip-bg, var(--accent-soft)); border: 1px solid var(--category-line, #ffd2cf); border-radius: 999px; color: var(--category-ink, var(--accent)); display: inline-flex; font-size: 13px; font-weight: 850; gap: 6px; max-width: 100%; min-height: 30px; padding: 0 8px 0 10px; }
.filter-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filter-chip button { align-items: center; background: transparent; border: 0; border-radius: 999px; color: currentColor; display: inline-flex; font-size: 16px; font-weight: 950; justify-content: center; line-height: 1; min-height: 22px; min-width: 22px; padding: 0; }
.filter-chip[data-type="category"] { background: var(--category-accent, var(--accent)); border-color: var(--category-accent, var(--accent)); color: white; }
.channel-filter-input { border: 0; flex: 1 1 220px; min-height: 32px; min-width: 0; outline: 0; padding: 0 4px; }
.channel-tokenbox:has(.filter-chip) .channel-filter-input { flex-basis: 0; min-width: 0; padding: 0; width: 0; }
.channel-options { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12); display: none; left: 0; margin-top: 6px; max-height: calc(100dvh - 74px); overflow: auto; position: absolute; right: 0; z-index: 5; }
.channel-picker[data-open="true"] .channel-options { display: block; }
.channel-option { align-items: center; background: transparent; border: 0; border-radius: 0; display: grid; gap: 2px; justify-items: start; min-height: 48px; padding: 8px 10px; text-align: left; width: 100%; }
.channel-option:hover, .channel-option[data-active="true"] { background: var(--category-chip-bg, var(--accent-soft)); color: var(--category-ink, var(--accent)); }
.channel-option strong { font-size: 14px; line-height: 1.2; }
.channel-option span { color: var(--muted); font-size: 12px; font-weight: 700; }
.channel-option-empty { color: var(--muted); padding: 12px; }
.meta { min-height: 24px; color: var(--muted); font-size: 14px; margin: 2px 0 14px; }
.results { display: grid; gap: 9px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); }
.result { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
.result-top { align-items: center; display: grid; gap: 8px; grid-template-columns: 24px minmax(0, 1fr) auto; margin-bottom: 7px; }
.result-heading { min-width: 0; }
.channel-avatar { background: var(--category-soft, #e2e8f0); border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 50%; color: var(--category-ink, var(--muted)); display: inline-grid; flex: 0 0 24px; font-size: 10px; font-weight: 950; height: 24px; line-height: 1; object-fit: cover; overflow: hidden; place-items: center; text-transform: uppercase; width: 24px; }
.title { font-size: 14px; font-weight: 800; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.channel { color: var(--muted); font-size: 12px; font-weight: 700; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.video-count { color: var(--muted); flex: 0 0 auto; font-size: 13px; font-weight: 800; }
.hits { display: grid; gap: 6px; }
.hit { border-top: 1px solid var(--line); display: grid; gap: 6px; grid-template-columns: auto minmax(0, 1fr); padding-top: 7px; }
.time { align-self: start; color: var(--accent); background: var(--accent-soft); border: 1px solid #ffd2cf; border-radius: 999px; font-size: 13px; font-weight: 800; padding: 3px 8px; text-decoration: none; }
.snippet { color: #30302e; font-size: 13.5px; line-height: 1.36; }
.snippet strong { background: var(--accent-soft); border-radius: 4px; color: var(--accent); font-weight: 950; padding: 0 2px; }
.match-count { color: var(--muted); font-size: 12px; font-weight: 700; margin-left: 6px; }
.video-result { align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: inherit; display: grid; gap: 7px; grid-template-columns: 24px minmax(96px, 0.36fr) minmax(0, 1fr); padding: 7px 10px; text-decoration: none; }
.video-result:hover { border-color: #c9c8bf; background: #fbfbf8; }
.video-result-channel { color: var(--muted); font-size: 12px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.video-result-title { font-size: 14px; font-weight: 750; line-height: 1.24; overflow-wrap: anywhere; }
.patch-panel { display: grid; gap: 10px; }
.patch-toolbar { align-items: center; color: var(--muted); display: flex; font-size: 13px; gap: 10px; justify-content: space-between; }
.patch-toolbar button { font-size: 13px; min-height: 34px; padding: 0 11px; }
.patch-results { display: grid; gap: 9px; }
.patch-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: grid; gap: 8px; padding: 9px 10px; }
.patch-card-top { align-items: center; display: grid; gap: 8px; grid-template-columns: 24px minmax(0, 1fr) auto; }
.patch-title { font-size: 14px; font-weight: 850; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.patch-meta { color: var(--muted); font-size: 12px; font-weight: 750; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.patch-status { background: var(--accent-soft); border: 1px solid #ffd2cf; border-radius: 999px; color: var(--accent); font-size: 12px; font-weight: 900; padding: 3px 8px; white-space: nowrap; }
.patch-body { display: grid; gap: 8px; }
.patch-window { border-top: 1px solid var(--line); display: grid; gap: 6px; padding-top: 8px; }
.patch-window-head { color: var(--muted); font-size: 12px; font-weight: 850; }
.patch-window-text { color: #30302e; font-size: 13.5px; line-height: 1.36; }
.patch-word { background: var(--accent-soft); border-radius: 4px; color: var(--accent); font-weight: 950; padding: 0 2px; }
.patch-word[data-applied="false"] { background: transparent; box-shadow: inset 0 -2px 0 var(--accent-soft); }
.patch-links { align-items: center; display: flex; flex-wrap: wrap; gap: 6px; }
.patch-chip { background: var(--accent-soft); border: 1px solid #ffd2cf; border-radius: 999px; color: var(--accent); font-size: 12px; font-weight: 900; padding: 3px 8px; text-decoration: none; }
.patch-chip[data-applied="false"] { background: #fff; color: var(--muted); }
.empty { padding: 18px 0; color: var(--muted); }
@media (max-width: 680px) {
  .searchbar { grid-template-columns: 1fr; }
  .subnav { align-items: flex-start; flex-direction: column; }
  .view-tabs { justify-content: flex-start; }
  .results { grid-template-columns: 1fr; }
  .channel-filter-input { flex-basis: 140px; }
  .video-result { grid-template-columns: 24px minmax(0, 1fr); }
  .video-result-channel, .video-result-title { white-space: normal; }
  .video-result-title { grid-column: 2; }
}
</style>
</head>
<body>
<main>
  <form class="searchbar" id="searchForm">
    <div class="channel-picker" id="channelPicker">
      <div class="channel-tokenbox" id="channelTokenbox">
        <input class="channel-filter-input" id="channelFilterInput" autocomplete="off" placeholder="Channels">
      </div>
      <div class="channel-options" id="channelOptions"></div>
    </div>
    <input id="titleInput" name="title_filter" autocomplete="off" placeholder="Video title">
    <input id="queryInput" name="q" autocomplete="off" placeholder="Transcript substring">
    <button class="primary" type="submit">Search</button>
  </form>
  <div class="subnav">
    <div class="channel-summary" id="channelSummary">Loading channels...</div>
    <div class="view-tabs">
      <button class="view-tab" id="searchTab" type="button" data-active="true">Search</button>
      <button class="view-tab" id="patchesTab" type="button">STT Patches</button>
      <a href="stats.html">Stats</a>
    </div>
  </div>
  <div class="meta" id="meta"></div>
  <section class="results" id="results"></section>
  <section class="patch-panel" id="patchPanel" hidden>
    <div class="patch-toolbar">
      <div id="patchMeta">Loading patch audit...</div>
      <button id="refreshPatches" type="button">Refresh</button>
    </div>
    <section class="patch-results" id="patchResults"></section>
  </section>
</main>
<script>
const form = document.getElementById('searchForm');
const searchTab = document.getElementById('searchTab');
const patchesTab = document.getElementById('patchesTab');
const titleInput = document.getElementById('titleInput');
const queryInput = document.getElementById('queryInput');
const channelPicker = document.getElementById('channelPicker');
const channelTokenbox = document.getElementById('channelTokenbox');
const channelFilterInput = document.getElementById('channelFilterInput');
const channelOptions = document.getElementById('channelOptions');
const channelSummary = document.getElementById('channelSummary');
const meta = document.getElementById('meta');
const results = document.getElementById('results');
const patchPanel = document.getElementById('patchPanel');
const patchMeta = document.getElementById('patchMeta');
const patchResults = document.getElementById('patchResults');
const refreshPatches = document.getElementById('refreshPatches');
let channelRows = [];
let channelByName = new Map();
let selectedFilters = [];
let activeOptionIndex = -1;
let patchesLoaded = false;
const CATEGORY_STYLES = {
  AI: { accent: '#2563eb', bg: '#f4f8ff', soft: '#dbeafe', chip: '#eff6ff', ink: '#1d4ed8', line: '#bfdbfe' },
  Comedy: { accent: '#db2777', bg: '#fff5fa', soft: '#fce7f3', chip: '#fdf2f8', ink: '#be185d', line: '#fbcfe8' },
  Engineering: { accent: '#0891b2', bg: '#f0fbff', soft: '#cffafe', chip: '#ecfeff', ink: '#0e7490', line: '#a5f3fc' },
  Fitness: { accent: '#16a34a', bg: '#f3fbf5', soft: '#dcfce7', chip: '#f0fdf4', ink: '#15803d', line: '#bbf7d0' },
  Food: { accent: '#c2410c', bg: '#fff7ed', soft: '#fed7aa', chip: '#ffedd5', ink: '#9a3412', line: '#fdba74' },
  Health: { accent: '#059669', bg: '#f0fdf8', soft: '#d1fae5', chip: '#ecfdf5', ink: '#047857', line: '#a7f3d0' },
  Math: { accent: '#7c3aed', bg: '#f8f5ff', soft: '#ede9fe', chip: '#f5f3ff', ink: '#6d28d9', line: '#ddd6fe' },
  Music: { accent: '#d97706', bg: '#fff9ed', soft: '#fef3c7', chip: '#fffbeb', ink: '#b45309', line: '#fde68a' },
  Philosophy: { accent: '#4f46e5', bg: '#f5f6ff', soft: '#e0e7ff', chip: '#eef2ff', ink: '#4338ca', line: '#c7d2fe' },
  Science: { accent: '#0d9488', bg: '#f0fdfa', soft: '#ccfbf1', chip: '#f0fdfa', ink: '#0f766e', line: '#99f6e4' },
  Other: { accent: '#64748b', bg: '#f8fafc', soft: '#e2e8f0', chip: '#f1f5f9', ink: '#475569', line: '#cbd5e1' }
};

init();

async function init() {
  await loadChannels();
  form.addEventListener('submit', event => {
    event.preventDefault();
    search();
  });
  searchTab.addEventListener('click', () => setView('search'));
  patchesTab.addEventListener('click', () => setView('patches'));
  refreshPatches.addEventListener('click', () => loadPatches(true));
  channelTokenbox.addEventListener('click', () => channelFilterInput.focus());
  channelFilterInput.addEventListener('input', renderChannelOptions);
  channelFilterInput.addEventListener('focus', openChannelOptions);
  channelFilterInput.addEventListener('keydown', handleChannelInputKeydown);
  channelOptions.addEventListener('pointerdown', event => {
    event.preventDefault();
    const button = event.target.closest('.channel-option');
    if (button) addFilter(button.dataset.type, button.dataset.value);
  });
  document.addEventListener('mousedown', event => {
    if (!channelPicker.contains(event.target)) closeChannelOptions();
  });
}

async function loadChannels() {
  try {
    const payload = await getJson('api.php?action=channels');
    channelRows = (payload.channels || []).map(row => ({
      ...row,
      category: row.category || inferChannelCategory(row.channel)
    }));
    channelByName = new Map(channelRows.map(row => [row.channel, row]));
    renderSelectedFilters();
    renderChannelOptions();
    const stats = payload.stats || {};
    meta.textContent = `${stats.videos || 0} videos, ${stats.channels || 0} channels indexed`;
  } catch (error) {
    channelSummary.textContent = 'Could not load channels';
    channelOptions.innerHTML = '<div class="channel-option-empty">Could not load the static channel list.</div>';
    meta.textContent = error.message;
  }
}

function groupChannelsByCategory(rows) {
  const groups = new Map();
  const sortedRows = [...rows].sort((a, b) => {
    const categoryCompare = (a.category || 'Other').localeCompare(b.category || 'Other');
    return categoryCompare || a.channel.localeCompare(b.channel);
  });
  for (const row of sortedRows) {
    const category = row.category || 'Other';
    if (!groups.has(category)) groups.set(category, []);
    groups.get(category).push(row);
  }
  return groups;
}

function applyCategoryStyle(element, category) {
  const style = CATEGORY_STYLES[category] || CATEGORY_STYLES.Other;
  element.style.setProperty('--category-accent', style.accent);
  element.style.setProperty('--category-bg', style.bg);
  element.style.setProperty('--category-soft', style.soft);
  element.style.setProperty('--category-chip-bg', style.chip);
  element.style.setProperty('--category-ink', style.ink);
  element.style.setProperty('--category-line', style.line);
}

function channelAvatarElement(channelName) {
  const row = channelByName.get(channelName) || {};
  const category = row.category || inferChannelCategory(channelName);
  const url = row.avatar_url || '';
  const label = `${channelName || 'Channel'} avatar`;
  const element = url ? document.createElement('img') : document.createElement('span');
  element.className = 'channel-avatar';
  element.title = channelName || '';
  element.setAttribute('aria-label', label);
  applyCategoryStyle(element, category);
  if (url) {
    element.src = url;
    element.alt = label;
    element.loading = 'lazy';
    element.decoding = 'async';
    element.referrerPolicy = 'no-referrer';
  } else {
    element.textContent = initialsFor(channelName);
  }
  return element;
}

function initialsFor(value) {
  const words = String(value || '?').replace(/&/g, ' ').match(/[A-Za-z0-9]+/g) || ['?'];
  return words.slice(0, 2).map(word => word[0]).join('');
}

function selectedChannels() {
  if (!selectedFilters.length) return [];
  const selected = new Set();
  for (const filter of selectedFilters) {
    if (filter.type === 'channel') {
      selected.add(filter.value);
    } else if (filter.type === 'category') {
      for (const row of channelRows) {
        if ((row.category || 'Other') === filter.value) selected.add(row.channel);
      }
    }
  }
  return [...selected];
}

function updateChannelSummary() {
  const total = channelRows.length;
  const selected = selectedChannels().length;
  channelSummary.textContent = selectedFilters.length
    ? `${selected} of ${total} channels selected`
    : `All ${total} channels selected`;
}

function renderSelectedFilters() {
  for (const chip of [...channelTokenbox.querySelectorAll('.filter-chip')]) {
    chip.remove();
  }
  for (const filter of selectedFilters) {
    const chip = document.createElement('span');
    chip.className = 'filter-chip';
    chip.dataset.type = filter.type;
    applyCategoryStyle(chip, filter.category || filter.value);
    chip.innerHTML = '<span></span><button type="button" aria-label="Remove filter">&times;</button>';
    chip.querySelector('span').textContent = filter.label;
    chip.querySelector('button').addEventListener('click', () => removeFilter(filter.type, filter.value));
    channelTokenbox.insertBefore(chip, channelFilterInput);
  }
  channelFilterInput.placeholder = selectedFilters.length ? '' : 'Channels';
  updateChannelSummary();
}

function renderChannelOptions() {
  const options = availableFilterOptions(channelFilterInput.value);
  activeOptionIndex = options.length ? 0 : -1;
  channelOptions.replaceChildren();
  if (!options.length) {
    const empty = document.createElement('div');
    empty.className = 'channel-option-empty';
    empty.textContent = 'No matching channels or categories';
    channelOptions.appendChild(empty);
    return;
  }
  const fragment = document.createDocumentFragment();
  options.forEach((option, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'channel-option';
    button.dataset.type = option.type;
    button.dataset.value = option.value;
    button.dataset.active = index === activeOptionIndex ? 'true' : 'false';
    applyCategoryStyle(button, option.category || option.value);
    button.innerHTML = '<strong></strong><span></span>';
    button.querySelector('strong').textContent = option.label;
    button.querySelector('span').textContent = option.detail;
    fragment.appendChild(button);
  });
  channelOptions.appendChild(fragment);
}

function availableFilterOptions(searchText) {
  const query = normalize(searchText);
  const selectedKeys = new Set(selectedFilters.map(filter => filterKey(filter.type, filter.value)));
  return allFilterOptions()
    .filter(option => !selectedKeys.has(filterKey(option.type, option.value)))
    .filter(option => !query || normalize(option.label).includes(query) || normalize(option.detail).includes(query))
    .sort(compareFilterOptions);
}

function allFilterOptions() {
  const categories = [...groupChannelsByCategory(channelRows)].map(([category, rows]) => ({
    type: 'category',
    value: category,
    label: category,
    category,
    detail: `${rows.length} channel${rows.length === 1 ? '' : 's'}`
  }));
  const channels = channelRows.map(row => ({
    type: 'channel',
    value: row.channel,
    label: row.channel,
    category: row.category || 'Other',
    detail: `${row.category || 'Other'} · ${row.video_count} video${row.video_count === 1 ? '' : 's'}`
  }));
  return [...categories, ...channels];
}

function compareFilterOptions(a, b) {
  const typeCompare = a.type === b.type ? 0 : a.type === 'category' ? -1 : 1;
  return typeCompare || a.label.localeCompare(b.label);
}

function addFilter(type, value) {
  const key = filterKey(type, value);
  if (selectedFilters.some(filter => filterKey(filter.type, filter.value) === key)) return;
  const option = allFilterOptions().find(item => filterKey(item.type, item.value) === key);
  if (!option) return;
  selectedFilters.push(option);
  channelFilterInput.value = '';
  renderSelectedFilters();
  renderChannelOptions();
  openChannelOptions();
  channelFilterInput.focus();
}

function removeFilter(type, value) {
  selectedFilters = selectedFilters.filter(filter => filterKey(filter.type, filter.value) !== filterKey(type, value));
  renderSelectedFilters();
  renderChannelOptions();
  channelFilterInput.focus();
}

function handleChannelInputKeydown(event) {
  const options = [...channelOptions.querySelectorAll('.channel-option')];
  if (event.key === 'Backspace' && channelFilterInput.value === '' && selectedFilters.length) {
    selectedFilters.pop();
    renderSelectedFilters();
    renderChannelOptions();
    return;
  }
  if (!options.length) return;
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault();
    activeOptionIndex = event.key === 'ArrowDown'
      ? (activeOptionIndex + 1) % options.length
      : (activeOptionIndex - 1 + options.length) % options.length;
    updateActiveOption(options);
  } else if (event.key === 'Enter' && channelPicker.dataset.open === 'true') {
    event.preventDefault();
    const active = options[Math.max(0, activeOptionIndex)];
    if (active) addFilter(active.dataset.type, active.dataset.value);
  } else if (event.key === 'Escape') {
    closeChannelOptions();
  }
}

function updateActiveOption(options) {
  options.forEach((option, index) => {
    option.dataset.active = index === activeOptionIndex ? 'true' : 'false';
  });
  options[activeOptionIndex]?.scrollIntoView({ block: 'nearest' });
}

function openChannelOptions() {
  channelPicker.dataset.open = 'true';
  renderChannelOptions();
}

function closeChannelOptions() {
  channelPicker.dataset.open = 'false';
}

function filterKey(type, value) {
  return `${type}:${value}`;
}

function normalize(value) {
  return String(value).trim().toLowerCase();
}

function inferChannelCategory(channel) {
  const categories = {
    '80,000 Hours': 'AI',
    '3Blue1Brown': 'Math',
    '12tone': 'Music',
    'Adam Neely': 'Music',
    'Adam Ragusea': 'Food',
    'BarryHarrisVideos': 'Music',
    'Binging with Babish': 'Food',
    'Bill Burr': 'Comedy',
    'Bret Weinstein': 'Philosophy',
    'BroScienceLife': 'Comedy',
    'Cape Falcon Kayak': 'Engineering',
    'Destiny': 'Philosophy',
    'Dwarkesh Patel': 'AI',
    'Ear Biscuits': 'Comedy',
    'Eric Weinstein': 'Philosophy',
    'Henry Segerman': 'Math',
    'Robert Sapolsky': 'Science',
    'Jacob Collier': 'Music',
    'Jake and Amir': 'Comedy',
    'JennaMarbles': 'Comedy',
    'Jordan B Peterson': 'Philosophy',
    'Jonathan Pageau': 'Philosophy',
    'June Lee': 'Music',
    'Key & Peele': 'Comedy',
    'Lex Fridman': 'AI',
    'Mathologer': 'Math',
    'Numberphile': 'Math',

function setView(view) {
  const showingPatches = view === 'patches';
  form.hidden = showingPatches;
  meta.hidden = showingPatches;
  results.hidden = showingPatches;
  channelSummary.hidden = showingPatches;
  patchPanel.hidden = !showingPatches;
  searchTab.dataset.active = showingPatches ? 'false' : 'true';
  patchesTab.dataset.active = showingPatches ? 'true' : 'false';
  if (showingPatches) loadPatches();
}

async function loadPatches(force = false) {
  if (patchesLoaded && !force) return;
  patchesLoaded = true;
  patchMeta.textContent = 'Loading patch audit...';
  patchResults.innerHTML = '';
  try {
    const payload = await getJson('api.php?action=patches&limit=200');
    renderPatches(payload.patches || {});
  } catch (error) {
    patchMeta.textContent = error.message;
    patchResults.innerHTML = '';
  }
}

function renderPatches(payload) {
  const markers = payload.markers || [];
  const runs = payload.runs || [];
  const latestRun = runs[0] || null;
  const appliedCount = markers.filter(item => item.applied).length;
  const groups = groupPatchMarkers(markers);
  const videoCount = new Set(markers.map(item => item.video_id)).size;
  if (markers.length) {
    patchMeta.textContent = `${groups.length} patch card${groups.length === 1 ? '' : 's'} · ${markers.length} marker${markers.length === 1 ? '' : 's'} from ${videoCount} video${videoCount === 1 ? '' : 's'} · ${appliedCount} applied`;
  } else if (latestRun) {
    const error = latestRun.error ? ` · ${latestRun.error}` : '';
    patchMeta.textContent = `Latest run #${latestRun.id}: ${latestRun.status}${error}`;
  } else {
    patchMeta.textContent = 'No STT patch runs yet.';
  }

  if (!markers.length) {
    patchResults.innerHTML = '<div class="empty">No patch markers recorded yet.</div>';
    return;
  }

  const fragment = document.createDocumentFragment();
  for (const group of groups) {
    const first = group.markers[0];
    const article = document.createElement('article');
    article.className = 'patch-card';
    article.innerHTML = `
      <div class="patch-card-top">
        <span class="avatar-slot"></span>
        <div>
          <div class="patch-title"></div>
          <div class="patch-meta"></div>
        </div>
        <div class="patch-status"></div>
      </div>
      <div class="patch-body"></div>
    `;
    article.querySelector('.avatar-slot').replaceWith(channelAvatarElement(first.channel || ''));
    article.querySelector('.patch-title').textContent = first.title || first.video_id || '';
    article.querySelector('.patch-meta').textContent = `${first.channel || ''} · run #${first.run_id} · ${group.windows.length} audio window${group.windows.length === 1 ? '' : 's'}`;
    const status = article.querySelector('.patch-status');
    status.textContent = `${group.applied} / ${group.markers.length} applied`;

    const body = article.querySelector('.patch-body');
    for (const windowGroup of group.windows) {
      const windowElement = document.createElement('section');
      windowElement.className = 'patch-window';
      windowElement.innerHTML = `
        <div class="patch-window-head"></div>
        <div class="patch-window-text"></div>
        <div class="patch-links"></div>
      `;
      windowElement.querySelector('.patch-window-head').textContent = `Window ${windowGroup.start || '0:00'}-${windowGroup.end || '0:00'} · ${windowGroup.markers.length} marker${windowGroup.markers.length === 1 ? '' : 's'}`;
      renderPatchWindowText(windowElement.querySelector('.patch-window-text'), windowGroup);
      renderPatchLinks(windowElement.querySelector('.patch-links'), windowGroup.markers);
      body.appendChild(windowElement);
    }
    fragment.appendChild(article);
  }
  patchResults.replaceChildren(fragment);
}

function groupPatchMarkers(markers) {
  const groupsByKey = new Map();
  for (const marker of markers) {
    const key = `${marker.run_id}:${marker.video_id}`;
    if (!groupsByKey.has(key)) {
      groupsByKey.set(key, {
        key,
        markers: [],
        applied: 0,
        windowsByKey: new Map()
      });
    }
    const group = groupsByKey.get(key);
    group.markers.push(marker);
    if (marker.applied) group.applied++;
    const windowKey = String(marker.window_index);
    if (!group.windowsByKey.has(windowKey)) {
      group.windowsByKey.set(windowKey, {
        index: marker.window_index,
        start: marker.window_start_timestamp,
        end: marker.window_end_timestamp,
        text: stripPatchMarkers(marker.stt_text || marker.stt_excerpt || ''),
        markers: []
      });
    }
    const windowGroup = group.windowsByKey.get(windowKey);
    if (!windowGroup.text && (marker.stt_text || marker.stt_excerpt)) {
      windowGroup.text = stripPatchMarkers(marker.stt_text || marker.stt_excerpt || '');
    }
    windowGroup.markers.push(marker);
  }
  return [...groupsByKey.values()].map(group => ({
    ...group,
    markers: group.markers.sort((a, b) => Number(a.marker_start_seconds) - Number(b.marker_start_seconds)),
    windows: [...group.windowsByKey.values()]
      .map(windowGroup => ({
        ...windowGroup,
        markers: windowGroup.markers.sort((a, b) => Number(a.marker_start_seconds) - Number(b.marker_start_seconds))
      }))
      .sort((a, b) => Number(a.index) - Number(b.index))
  }));
}

function renderPatchWindowText(container, windowGroup) {
  const text = stripPatchMarkers(windowGroup.text || fallbackPatchText(windowGroup.markers));
  const highlights = windowGroup.markers
    .filter(marker => marker.applied)
    .map(marker => ({
      marker,
      text: stripPatchMarkers(marker.replacement_text || marker.candidate_text || '')
    }))
    .filter(item => item.text);

  if (!text || !highlights.length) {
    container.textContent = text || 'No local STT text for this window.';
    return;
  }

  const fragment = document.createDocumentFragment();
  const lowerText = text.toLowerCase();
  let cursor = 0;
  let matched = 0;
  for (const item of highlights) {
    const needle = item.text.toLowerCase();
    const index = lowerText.indexOf(needle, cursor);
    if (index < 0) continue;
    if (index > cursor) fragment.appendChild(document.createTextNode(text.slice(cursor, index)));
    const mark = document.createElement('span');
    mark.className = 'patch-word';
    mark.dataset.applied = item.marker.applied ? 'true' : 'false';
    mark.title = `${item.marker.marker_timestamp || '0:00'} · ${item.marker.status || 'review'} · confidence ${formatConfidence(item.marker.confidence)}`;
    mark.textContent = text.slice(index, index + item.text.length);
    fragment.appendChild(mark);
    cursor = index + item.text.length;
    matched++;
  }
  if (cursor < text.length) fragment.appendChild(document.createTextNode(text.slice(cursor)));
  container.replaceChildren(matched ? fragment : document.createTextNode(text));
}

function renderPatchLinks(container, markers) {
  const fragment = document.createDocumentFragment();
  for (const marker of markers) {
    const link = document.createElement('a');
    link.className = 'patch-chip';
    link.dataset.applied = marker.applied ? 'true' : 'false';
    link.href = marker.url || `https://www.youtube.com/watch?v=${encodeURIComponent(marker.video_id || '')}`;
    link.target = '_blank';
    link.rel = 'noreferrer';
    const word = stripPatchMarkers(marker.replacement_text || marker.candidate_text || marker.status || '');
    link.textContent = `${marker.marker_timestamp || '0:00'}${word ? ` ${word}` : ''}`;
    link.title = `${marker.status || 'review'} · confidence ${formatConfidence(marker.confidence)}${marker.reason ? ` · ${marker.reason}` : ''}`;
    fragment.appendChild(link);
  }
  container.replaceChildren(fragment);
}

function fallbackPatchText(markers) {
  return markers.map(marker => {
    const before = compactPatchContext(marker.youtube_before || '', 90, true);
    const after = compactPatchContext(marker.youtube_after || '', 110, false);
    const replacement = marker.replacement_text || marker.candidate_text || '';
    return `${before} ${replacement} ${after}`.trim();
  }).join(' ');
}

function compactPatchContext(text, length, fromEnd) {
  const clean = stripPatchMarkers(text).replace(/\s+/g, ' ').trim();
  if (clean.length <= length) return clean;
  return fromEnd ? clean.slice(clean.length - length) : clean.slice(0, length);
}

function stripPatchMarkers(text) {
  return String(text || '')
    .replace(/\[\s*__\s*\]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function formatConfidence(value) {
  const number = Number(value);
  return Number.isFinite(number) ? number.toFixed(2) : '0.00';
}

async function search() {
  const titleFilter = titleInput.value.trim();
  const query = queryInput.value.trim();
  if (!titleFilter && !query) {
    results.innerHTML = '<div class="empty">Type a video title or transcript substring.</div>';
    return;
  }
  const channels = selectedChannels();
  meta.textContent = 'Searching...';
  results.innerHTML = '';
  try {
    const params = new URLSearchParams({
      action: 'search',
      limit: '60'
    });
    if (query) params.set('q', query);
    if (titleFilter) params.set('title_filter', titleFilter);
    if (selectedFilters.length) {
      for (const channel of channels) {
        params.append('channels[]', channel);
      }
    }
    const payload = await getJson(`api.php?${params}`);
    renderResults(payload.results || [], query, titleFilter, payload.timing || null);
  } catch (error) {
    meta.textContent = error.message;
  }
}

function renderResults(items, query, titleFilter = '', timing = null) {
  const groups = groupResultsByVideo(items);
  const videoCount = groups.length;
  const titleOnly = titleFilter && !query;
  const titleScope = titleFilter ? ` in titles matching "${titleFilter}"` : '';
  const timingText = timing && Number.isFinite(Number(timing.total_ms)) ? ` · ${formatMs(timing.total_ms)}` : '';
  meta.textContent = titleOnly
    ? `${videoCount} video title${videoCount === 1 ? '' : 's'} matching "${titleFilter}"${timingText}`
    : `${items.length} result${items.length === 1 ? '' : 's'} in ${videoCount} video${videoCount === 1 ? '' : 's'}${titleScope} for "${query}"${timingText}`;
  if (!items.length) {
    results.innerHTML = '<div class="empty">No matches.</div>';
    return;
  }
  const fragment = document.createDocumentFragment();
  if (titleOnly) {
    for (const item of items) {
      const link = document.createElement('a');
      link.className = 'video-result';
      link.href = item.url || `https://www.youtube.com/watch?v=${encodeURIComponent(item.youtube_id || '')}`;
      link.target = '_blank';
      link.rel = 'noreferrer';
      link.innerHTML = `
        <span class="avatar-slot"></span>
        <div class="video-result-channel"></div>
        <div class="video-result-title"></div>
      `;
      link.querySelector('.avatar-slot').replaceWith(channelAvatarElement(item.channel || ''));
      link.querySelector('.video-result-channel').textContent = item.channel || '';
      link.querySelector('.video-result-title').textContent = item.title || item.youtube_id || '';
      fragment.appendChild(link);
    }
    results.replaceChildren(fragment);
    return;
  }
  for (const group of groups) {
    const article = document.createElement('article');
    article.className = 'result';
    article.innerHTML = `
      <div class="result-top">
        <span class="avatar-slot"></span>
        <div class="result-heading">
          <div class="title"></div>
          <div class="channel"></div>
        </div>
        <div class="video-count"></div>
      </div>
      <div class="hits"></div>
    `;
    const first = group.items[0];
    article.querySelector('.avatar-slot').replaceWith(channelAvatarElement(first.channel || ''));
    article.querySelector('.title').textContent = first.title || first.youtube_id;
    const channel = article.querySelector('.channel');
    channel.textContent = first.channel || '';
    article.querySelector('.video-count').textContent = `${group.items.length} hit${group.items.length === 1 ? '' : 's'}`;
    const hits = article.querySelector('.hits');
    for (const item of group.items) {
      const hit = document.createElement('div');
      hit.className = 'hit';
      hit.innerHTML = `
        <a class="time" target="_blank" rel="noreferrer"></a>
        <div>
          <div class="snippet"></div>
        </div>
      `;
      const time = hit.querySelector('.time');
      time.href = item.url;
      time.textContent = item.timestamp || '0:00';
      const snippet = hit.querySelector('.snippet');
      renderSnippet(snippet, item);
      if (item.match_count > 1) {
        const count = document.createElement('span');
        count.className = 'match-count';
        count.textContent = `${item.match_count} nearby matches`;
        snippet.appendChild(count);
      }
      hits.appendChild(hit);
    }
    fragment.appendChild(article);
  }
  results.replaceChildren(fragment);
}

function formatMs(ms) {
  const value = Number(ms);
  return value >= 1000 ? `${(value / 1000).toFixed(2)}s` : `${value.toFixed(0)}ms`;
}

function groupResultsByVideo(items) {
  const groups = [];
  const byVideo = new Map();
  for (const item of items) {
    const key = item.youtube_id || `${item.channel}:${item.title}`;
    let group = byVideo.get(key);
    if (!group) {
      group = { key, items: [] };
      byVideo.set(key, group);
      groups.push(group);
    }
    group.items.push(item);
  }
  return groups;
}

function renderSnippet(container, item) {
  const parts = Array.isArray(item.snippet_parts) ? item.snippet_parts : [];
  if (!parts.length) {
    container.textContent = item.snippet || '';
    return;
  }
  const fragment = document.createDocumentFragment();
  for (const part of parts) {
    if (part.match) {
      const strong = document.createElement('strong');
      strong.textContent = part.text || '';
      fragment.appendChild(strong);
    } else {
      fragment.appendChild(document.createTextNode(part.text || ''));
    }
  }
  container.replaceChildren(fragment);
}

async function getJson(url) {
  const response = await fetch(url, { cache: 'no-store' });
  const text = await response.text();
  if (!text.trim()) {
    throw new Error(`Empty API response (${response.status})`);
  }
  let payload;
  try {
    payload = JSON.parse(text);
  } catch (error) {
    throw new Error(`Invalid API response (${response.status})`);
  }
  if (!response.ok || !payload.ok) throw new Error(payload.error || `Request failed (${response.status})`);
  return payload;
}
