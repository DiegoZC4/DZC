<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hebrew Consonant Trainer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✡️</text></svg>">
<style>
@font-face {
  font-family: "Noto Sans Hebrew Local";
  src: url("./fonts/NotoSansHebrew-Variable.ttf") format("truetype");
  font-display: swap;
}
@font-face {
  font-family: "Noto Serif Hebrew Local";
  src: url("./fonts/NotoSerifHebrew-Variable.ttf") format("truetype");
  font-display: swap;
}
@font-face {
  font-family: "SBL BibLit Local";
  src: url("./fonts/SBL_BibLit.ttf") format("truetype");
  font-display: swap;
}
:root {
  color-scheme: dark;
  --bg: #04070c;
  --panel: #0e1625;
  --panel-2: #132036;
  --line: #2b3d60;
  --text: #eef5ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  display: grid;
  grid-template-rows: 1fr auto;
  background: radial-gradient(circle at 20% 10%, #12213b 0%, var(--bg) 55%);
  color: var(--text);
  font-family: "Avenir Next", "Segoe UI", sans-serif;
  padding: 0.75rem;
  gap: 0.75rem;
}
section {
  width: 100%;
  display: grid;
  place-items: stretch;
  background: linear-gradient(160deg, var(--panel), var(--panel-2));
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 0.8rem;
}
.glyph-row {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.6rem;
}
.glyph-pane {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(8, 18, 35, 0.65);
  display: grid;
  place-items: center;
  padding: 0.35rem;
  max-height: 150px;
  min-height: 150px;
  container-type: size;
}
.glyph {
  text-align: center;
  font-size: 80cqh;
  margin: 0;
  line-height: 1;
  letter-spacing: 0.04em;
  user-select: none;
}
#glyphModern { font-family: "Noto Sans Hebrew Local", "Noto Sans Hebrew", sans-serif; }
#glyphBiblical { font-family: "SBL BibLit Local", "Noto Serif Hebrew Local", "Noto Serif Hebrew", serif; }
#glyphCompromise { font-family: "Noto Serif Hebrew Local", "Noto Serif Hebrew", serif; }
@media (max-width: 450px) {
  .glyph-row { grid-template-columns: 1fr; }
}
#legend {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(var(--legend-cols, 6), minmax(0, 1fr));
  gap: 0.4rem;
}
.map {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(8, 18, 35, 0.85);
  padding: 0.35rem 0.25rem;
  line-height: 1;
  aspect-ratio: 1 / 1;
  container-type: size;
  transition: background-color 120ms linear;
}
.map-he {
  font-size: 60cqi;
  font-family: "Noto Serif Hebrew Local", "Noto Serif Hebrew", serif;
}
.map-lat {
  color: #9ab2d4;
  opacity: 0.75;
  font-size: 20cqi;
  margin-top: 5px;
}
</style>
</head>
<body>
  <section>
    <div class="glyph-row">
      <div class="glyph-pane"><div class="glyph" id="glyphModern">?</div></div>
      <div class="glyph-pane"><div class="glyph" id="glyphBiblical">?</div></div>
      <div class="glyph-pane"><div class="glyph" id="glyphCompromise">?</div></div>
    </div>
  </section>
  <div id="legend"></div>

<script>
const CONSONANTS = [
  { char: "א", sound: " " },
  { char: "בּ", sound: "b" },
  { char: "ב", sound: "v" },
  { char: "גּ", sound: "g" },
  { char: "ג", sound: "g" },
  { char: "דּ", sound: "dh" },
  { char: "ד", sound: "d" },
  { char: "ה", sound: "h" },
  { char: "ו", sound: "v" },
  { char: "ז", sound: "z" },
  { char: "ח", sound: "kh" },
  { char: "ט", sound: "t" },
  { char: "י", sound: "y" },
  { char: "כּ", sound: "k" },
  { char: "כ", sound: "kh" },
  { char: "ךּ", sound: "k" },
  { char: "ך", sound: "kh" },
  { char: "ל", sound: "l" },
  { char: "מ", sound: "m" },
  { char: "ם", sound: "m" },
  { char: "נ", sound: "n" },
  { char: "ן", sound: "n" },
  { char: "ס", sound: "s" },
  { char: "ע", sound: " " },
  { char: "פּ", sound: "p" },
  { char: "פ", sound: "f" },
  { char: "ףּ", sound: "p" },
  { char: "ף", sound: "f" },
  { char: "צ", sound: "ts" },
  { char: "ץ", sound: "ts" },
  { char: "ק", sound: "k" },
  { char: "ר", sound: "r" },
  { char: "שׁ", sound: "sh" },
  { char: "שׂ", sound: "s" },
  { char: "תּ", sound: "t" },
  { char: "ת", sound: "th" }
];

const glyphModern = document.getElementById("glyphModern");
const glyphBiblical = document.getElementById("glyphBiblical");
const glyphCompromise = document.getElementById("glyphCompromise");
const legend = document.getElementById("legend");
const STATS_STORAGE_KEY = "hebrewTrainerStats";
let current = null;
let prevChar = "";
let buffer = "";
let typedForCurrent = "";
const LEGEND_MIN_SIDE = 100;
const LEGEND_FACTORS = [1, 2, 3, 4, 6, 9, 12, 18, 36];
const legendEls = new Map();
const stats = loadStats();

function normalize(s) {
  return (s || "").toLowerCase().replace(/[^a-z]/g, "");
}

function parsePair(value) {
  const parts = String(value || "0/0").split("/");
  const correct = Number(parts[0]) || 0;
  const total = Number(parts[1]) || 0;
  return { correct, total };
}

function formatPair(correct, total) {
  return `${correct}/${total}`;
}

function loadStats() {
  const out = {};
  let raw = null;
  try {
    raw = JSON.parse(localStorage.getItem(STATS_STORAGE_KEY) || "{}");
  } catch {
    raw = {};
  }
  for (const c of CONSONANTS) {
    const pair = parsePair(raw[c.char]);
    out[c.char] = formatPair(pair.correct, pair.total);
  }
  return out;
}

function saveStats() {
  localStorage.setItem(STATS_STORAGE_KEY, JSON.stringify(stats));
}

function getStat(char) {
  return parsePair(stats[char]);
}

function setStat(char, correct, total) {
  stats[char] = formatPair(correct, total);
}

function pickWeightedGlyph() {
  const maxTotal = Math.max(...CONSONANTS.map((c) => getStat(c.char).total), 0);
  const weighted = [];
  let totalWeight = 0;

  for (const c of CONSONANTS) {
    if (CONSONANTS.length > 1 && c.char === prevChar) continue;
    const s = getStat(c.char);
    const acc = s.total > 0 ? s.correct / s.total : 0;
    const lowAccBias = 1 - acc;
    const lowSampleBias = (maxTotal - s.total) / (maxTotal + 1 || 1);
    const weight = 1 + lowAccBias * 2 + lowSampleBias * 0.5;
    totalWeight += weight;
    weighted.push({ c, weight });
  }

  let r = Math.random() * totalWeight;
  for (const item of weighted) {
    r -= item.weight;
    if (r <= 0) return item.c;
  }
  return weighted[weighted.length - 1].c;
}

function nextGlyph() {
  const pick = pickWeightedGlyph();
  current = pick;
  prevChar = pick.char;
  glyphModern.textContent = current.char;
  glyphBiblical.textContent = current.char;
  glyphCompromise.textContent = current.char;
  buffer = "";
  typedForCurrent = "";

  const s = getStat(current.char);
  setStat(current.char, s.correct, s.total + 1);
  saveStats();
  updateLegendItem(current.char);
}

function registerResult(isCorrect) {
  if (!current) return;
  const s = getStat(current.char);
  const correct = isCorrect ? s.correct + 1 : s.correct;
  setStat(current.char, correct, s.total);
  saveStats();
  updateLegendItem(current.char);
}

function renderLegend() {
  legend.innerHTML = "";
  legendEls.clear();
  for (const c of CONSONANTS) {
    const tile = document.createElement("div");
    tile.className = "map";
    const he = document.createElement("span");
    he.className = "map-he";
    he.textContent = c.char;
    const lat = document.createElement("span");
    lat.className = "map-lat";
    tile.appendChild(he);
    tile.appendChild(lat);
    legend.appendChild(tile);
    legendEls.set(c.char, { tile, lat, sound: c.sound });
    updateLegendItem(c.char);
  }
}

function updateLegendItem(char) {
  const entry = legendEls.get(char);
  if (!entry) return;
  const s = getStat(char);
  const ratio = s.total > 0 ? s.correct / s.total : 0;
  const sampleFactor = Math.min(s.total / 100, 1);
  const hue = Math.round(120 * ratio);
  const lightness = Math.round(sampleFactor * 100);
  entry.tile.style.backgroundColor = `hsl(${hue} 80% ${lightness}%)`;
  entry.lat.textContent = `${entry.sound} (${s.correct}/${s.total})`;
}

function updateLegendShape() {
  const width = legend.clientWidth;
  let cols = LEGEND_FACTORS[0];
  for (const factor of LEGEND_FACTORS) {
    if (factor * LEGEND_MIN_SIDE <= width) {
      cols = factor;
    }
  }
  legend.style.setProperty("--legend-cols", String(cols));
}

window.addEventListener("keydown", (e) => {
  if (!current) return;

  if (current.sound === " " && e.key === " ") {
    registerResult(true);
    buffer = "";
    nextGlyph();
    return;
  }

  if (e.key === "Escape") {
    buffer = "";
    return;
  }

  if (e.key === "Backspace") {
    buffer = buffer.slice(0, -1);
    return;
  }

  if (e.key.length !== 1) return;

  const typed = normalize(e.key);
  buffer += typed;
  typedForCurrent += typed;
  if (buffer.length > 40) {
    buffer = buffer.slice(-40);
  }
  if (typedForCurrent.length > 40) {
    typedForCurrent = typedForCurrent.slice(-40);
  }

  const target = normalize(current.sound);
  if (target && buffer.includes(target)) {
    registerResult(typedForCurrent === target);
    buffer = "";
    nextGlyph();
  }
});

renderLegend();
updateLegendShape();
window.addEventListener("resize", updateLegendShape);
nextGlyph();
</script>
</body>
</html>
