<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Demo</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/homepage/cursor-demo-favicon.svg">
  <style>
    :root {
      --paper: #f7f3ea;
      --ink: #1d1d1f;
      --line: rgba(0, 0, 0, 0.14);
      --tile: rgba(255, 255, 255, 0.78);
      --tile-hover: #fff;
      --accent: #006c67;
      --accent-soft: #dcefeb;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.48), rgba(255, 255, 255, 0)),
        var(--paper);
      color: var(--ink);
      font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(568px, calc(100vw - 16px));
      margin: 0 auto;
      padding: 20px 0 32px;
    }

    .cursor-board {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      justify-content: center;
      gap: clamp(4px, 1.5vw, 8px);
    }

    .cursor-cell {
      aspect-ratio: 1;
      min-width: 0;
      border-radius: 8px;
    }

    .cursor-cell.is-empty {
      border: 1px dashed transparent;
      background: transparent;
    }

    .cursor-cell.is-empty:hover,
    .cursor-cell.is-empty.is-drop-target {
      border-color: rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.16);
    }

    .cursor-cell.is-drop-target {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .tile {
      display: grid;
      grid-template-rows: minmax(0, 42%) minmax(0, 1fr);
      justify-items: center;
      align-items: center;
      align-content: center;
      gap: clamp(2px, 1vw, 6px);
      width: 100%;
      height: 100%;
      min-width: 0;
      padding: clamp(3px, 1.1vw, 7px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--tile);
      text-align: center;
      user-select: none;
      touch-action: none;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease, opacity 120ms ease;
    }

    .tile:hover {
      background: var(--tile-hover);
      border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
      transform: translateY(-1px);
    }

    .tile.is-dragging {
      opacity: .42;
      transform: scale(.97);
    }

    .preview {
      display: grid;
      place-items: center;
      width: clamp(20px, 7vw, 38px);
      height: clamp(20px, 7vw, 38px);
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--ink);
      overflow: hidden;
    }

    .preview img,
    .preview svg {
      width: clamp(15px, 5.5vw, 30px);
      height: clamp(15px, 5.5vw, 30px);
      display: block;
      overflow: visible;
      object-fit: contain;
    }

    .name {
      display: block;
      color: var(--accent);
      font: 700 11px/1.08 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
      letter-spacing: 0;
    }

    @media (max-width: 420px) {
      main {
        width: calc(100vw - 12px);
        padding-top: 10px;
      }

      .tile {
        grid-template-rows: 1fr;
        gap: 0;
        padding: 3px;
      }

      .preview {
        width: 68%;
      }

      .name {
        display: none;
      }
    }
  </style>
</head>

    const DEFAULT_LAYOUT = [
          "default",
          "text",
          "crosshair",
          "help",
          "wait",
          "pointer",
          "move",
          "vertical-text",
          "grab",
          "grabbing",
          "copy",
          "alias",

          null,
          "none",
          "nwse-resize",

          "nesw-resize",

          "col-resize",
          "nw-resize",

    const STORAGE_KEY = 'cursor-demo-layout:v1';
    const COLUMNS = 6;
    const ROWS = 9;
    const CELL_COUNT = COLUMNS * ROWS;
    const cursorNames = Object.keys(cursorMeta);
    const cursorSet = new Set(cursorNames);
    const icon = (kind) => macCursorArt[kind] || '';
    const board = document.querySelector('[data-cursor-board]');

    let layout = loadLayout();
    let dragSourceIndex = null;
    let pointerDrag = null;

    function loadLayout() {
      try {
        const saved = JSON.parse(window.localStorage.getItem(STORAGE_KEY));
        const slots = Array.isArray(saved?.slots) ? saved.slots : saved;
        return normalizeLayout(slots);
      } catch {
        return [...DEFAULT_LAYOUT];
      }
    }

    function normalizeLayout(slots) {
      if (!Array.isArray(slots)) return [...DEFAULT_LAYOUT];

      const used = new Set();
      const normalized = slots.slice(0, CELL_COUNT).map((cursor) => {
        if (!cursorSet.has(cursor) || used.has(cursor)) return null;
        used.add(cursor);
        return cursor;
      });

      while (normalized.length < CELL_COUNT) normalized.push(null);

      const missing = cursorNames.filter((cursor) => !used.has(cursor));
      for (const cursor of missing) {
        const openIndex = normalized.indexOf(null);
        if (openIndex === -1) normalized.push(cursor);
        else normalized[openIndex] = cursor;
      }

      return normalized.slice(0, CELL_COUNT);
    }

    function saveLayout() {
      const payload = JSON.stringify({
        version: 1,
        columns: COLUMNS,
        rows: ROWS,
        slots: layout
      });
      window.localStorage.setItem(STORAGE_KEY, payload);
      board.dataset.layoutValue = payload;
    }

    function buildTile(cursor) {
      const meta = cursorMeta[cursor];
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.cursor = cursor;
      tile.dataset.values = (meta.values || [cursor]).join(' ');
      tile.draggable = true;
      tile.style.cursor = cursor;
      tile.title = `CSS cursor: ${(meta.values || [cursor]).join(', ')}`;

      const preview = document.createElement('span');
      preview.className = 'preview';
      preview.innerHTML = icon(artForCursor[cursor]);

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = meta.label;

      tile.append(preview, name);
      tile.addEventListener('dragstart', handleDragStart);
      tile.addEventListener('dragend', clearDragState);
      tile.addEventListener('pointerdown', handlePointerDown);
      return tile;
    }

    function buildCell(cursor, index) {
      const cell = document.createElement('div');
      cell.className = cursor ? 'cursor-cell' : 'cursor-cell is-empty';
      cell.dataset.slot = index;
      cell.addEventListener('dragover', handleDragOver);
      cell.addEventListener('dragleave', handleDragLeave);
      cell.addEventListener('drop', handleDrop);
      if (cursor) cell.append(buildTile(cursor));
      return cell;
    }

    function renderBoard() {
      board.replaceChildren(...layout.map(buildCell));
      board.dataset.layoutValue = JSON.stringify({
        version: 1,
        columns: COLUMNS,
        rows: ROWS,
        slots: layout
      });
    }

    function handleDragStart(event) {
      const tile = event.currentTarget;
      dragSourceIndex = Number(tile.closest('.cursor-cell').dataset.slot);
      tile.classList.add('is-dragging');
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', tile.dataset.cursor);
    }

    function handleDragOver(event) {
      event.preventDefault();
      event.currentTarget.classList.add('is-drop-target');
      event.dataTransfer.dropEffect = 'move';
    }

    function handleDragLeave(event) {
      event.currentTarget.classList.remove('is-drop-target');
    }

    function handleDrop(event) {
      event.preventDefault();
      const targetIndex = Number(event.currentTarget.dataset.slot);
      if (Number.isInteger(dragSourceIndex) && dragSourceIndex !== targetIndex) {
        [layout[dragSourceIndex], layout[targetIndex]] = [layout[targetIndex], layout[dragSourceIndex]];
        saveLayout();
        renderBoard();
      }
      clearDragState();
    }

    function handlePointerDown(event) {
      if (event.button !== 0) return;
      const tile = event.currentTarget;
      pointerDrag = {
        sourceIndex: Number(tile.closest('.cursor-cell').dataset.slot),
        startX: event.clientX,
        startY: event.clientY,
        pointerId: event.pointerId,
        tile,
        active: false
      };
      tile.setPointerCapture?.(event.pointerId);
      window.addEventListener('pointermove', handlePointerMove);
      window.addEventListener('pointerup', handlePointerUp, { once: true });
    }

    function handlePointerMove(event) {
      if (!pointerDrag) return;
      const distance = Math.hypot(event.clientX - pointerDrag.startX, event.clientY - pointerDrag.startY);
      if (distance < 5 && !pointerDrag.active) return;

      pointerDrag.active = true;
      pointerDrag.tile.classList.add('is-dragging');
      document.querySelectorAll('.is-drop-target').forEach((el) => el.classList.remove('is-drop-target'));

      const targetCell = document.elementFromPoint(event.clientX, event.clientY)?.closest('.cursor-cell');
      if (targetCell) targetCell.classList.add('is-drop-target');
      event.preventDefault();
    }

    function handlePointerUp(event) {
      window.removeEventListener('pointermove', handlePointerMove);
      if (pointerDrag?.active) {
        const targetCell = document.elementFromPoint(event.clientX, event.clientY)?.closest('.cursor-cell');
        const targetIndex = targetCell ? Number(targetCell.dataset.slot) : pointerDrag.sourceIndex;
        if (Number.isInteger(targetIndex) && targetIndex !== pointerDrag.sourceIndex) {
          [layout[pointerDrag.sourceIndex], layout[targetIndex]] = [layout[targetIndex], layout[pointerDrag.sourceIndex]];
          saveLayout();
          renderBoard();
        }
      }
      pointerDrag = null;
      clearDragState();
    }

    function clearDragState() {
      dragSourceIndex = null;
      document.querySelectorAll('.is-dragging, .is-drop-target').forEach((el) => {
        el.classList.remove('is-dragging', 'is-drop-target');
      });
    }

    window.cursorDemoLayout = {
      storageKey: STORAGE_KEY,
      getSlots: () => [...layout],
      getSaved: () => JSON.parse(window.localStorage.getItem(STORAGE_KEY) || 'null'),
      reset: () => {
        layout = [...DEFAULT_LAYOUT];
        window.localStorage.removeItem(STORAGE_KEY);
        renderBoard();
      }
    };

    document.addEventListener('cursor-demo-reset-layout', () => {
      layout = [...DEFAULT_LAYOUT];
      window.localStorage.removeItem(STORAGE_KEY);
      renderBoard();
    });

    renderBoard();
  </script>
