<!DOCTYPE html> <html lang="en"> 
  <head><meta charset="UTF-8"> 
    <title>DnD Map Tool</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/dnd-map-tool.svg">
  </head>
<body>
  <svg id="svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <image id="map" x="0" y="0" style="z-index:0;">
  </svg>

  <div id="ui" class="tool-panel">
    <header class="panel-header">
      <span class="eyebrow">Encounter Canvas</span>
      <h1>D&amp;D Map Tool</h1>
    </header>

    <label class="file-control" for="load">
      <span>Load Map</span>
      <input type="file" id="load" accept="image/*">
    </label>

    <section class="control-card" aria-label="Token sizes">
      <div class="section-title">Token Size</div>
      <div id="inputs" class="size-controls"></div>
    </section>

    <section class="control-card palette-card" aria-label="Palette">
      <div class="palette-head">
        <span class="section-title">Palette</span>
        <div class="palette-actions">
          <button type="button" onclick="addEnemy()" aria-label="Add enemy color">+</button>
          <button type="button" onclick="removeEnemy()" aria-label="Remove selected enemy color">-</button>
        </div>
      </div>
      <label class="shape-control" for="shape">
        <span>Stamp shape</span>
        <select id="shape">
          <option selected>circle</option>
          <option>rect</option>
        </select>
      </label>
      <ol id="enemies" class="palette-list" start="0">
        <li class="palette-item eraser-item" data-enemy="eraser">
          <span class="swatch eraser-swatch">x</span>
          <span>Eraser</span>
        </li>
      </ol>
    </section>
  </div>

#ui button,
#ui input,
#ui select,

<script>
function svg(tagName, attrs, textContent) {
  var el = document.createElementNS('http://www.w3.org/2000/svg', tagName);
  for (var key in attrs) el.setAttribute(key, attrs[key]);
  if (textContent) el.textContent = textContent;
  return el;
}

class NumSlider {
  constructor(min, max, start, units, step=1, sliderLength=200, numberWidth=50) {
    this.min = min
    this.max = max
    this.step = step
    this.currentValue = start

    let slider = document.createElement('input')
    slider.type = 'range'
    slider.min = min
    slider.max = max
    slider.step = step
    slider.value = start
    this.slider = slider

    let valueButton = document.createElement('button')
    valueButton.type = 'button'
    valueButton.className = 'num-value'
    valueButton.setAttribute('aria-label', `${units}. Drag vertically or scroll to change.`)
    valueButton.setAttribute('role', 'spinbutton')
    this.num = valueButton

    let title = document.createElement('span')
    title.className = 'num-slider-title'
    title.textContent = units

    let row = document.createElement('div')
    row.className = 'num-slider-row'
    row.append(title)
    row.append(valueButton)

    let label = document.createElement('label')
    label.className = 'num-slider'
    label.append(row)
    label.append(this.slider)
    this.label = label

    this.slider.addEventListener('input', () => this.setValue(this.slider.value))
    this.attachValueDrag()
    this.setValue(start, false)
    document.getElementById('inputs').append(this.label)
  }
  clamp(value) {
    const raw = Math.min(Math.max(Number(value) || this.min, this.min), this.max)
    const snapped = Math.round((raw - this.min) / this.step) * this.step + this.min
    return Math.min(Math.max(snapped, this.min), this.max)
  }
  setValue(value, emit = true) {
    const next = this.clamp(value)
    this.currentValue = next
    this.slider.value = next
    this.num.textContent = String(next)
    this.num.setAttribute('aria-valuemin', this.min)
    this.num.setAttribute('aria-valuemax', this.max)
    this.num.setAttribute('aria-valuenow', next)
    if (emit) this.label.dispatchEvent(new Event('input'))
  }
  attachValueDrag() {
    let drag = null
    this.num.addEventListener('pointerdown', event => {
      if (event.button !== 0) return
      event.preventDefault()
      drag = { pointerId: event.pointerId, startY: event.clientY, startValue: this.value() }
      this.num.classList.add('is-dragging')
      this.num.setPointerCapture(event.pointerId)
    })
    this.num.addEventListener('pointermove', event => {
      if (!drag || event.pointerId !== drag.pointerId) return
      event.preventDefault()
      this.setValue(drag.startValue + (drag.startY - event.clientY) * 0.75)
    })
    const finishDrag = event => {
      if (!drag || event.pointerId !== drag.pointerId) return
      if (this.num.hasPointerCapture?.(event.pointerId)) this.num.releasePointerCapture(event.pointerId)
      this.num.classList.remove('is-dragging')
      drag = null
    }
    this.num.addEventListener('pointerup', finishDrag)
    this.num.addEventListener('pointercancel', finishDrag)
    this.num.addEventListener('wheel', event => {
      event.preventDefault()
      this.setValue(this.value() + (event.deltaY > 0 ? -this.step : this.step))
    }, { passive: false })
  }
  value() {return this.currentValue}
  on(event, func) {
    this.label.addEventListener(event,func)
  }
}

const svgCont = document.getElementById('svg')

const load = document.getElementById('load');
const map = document.getElementById('map');
const shape = document.getElementById('shape')
const DEFAULT_MAP_SOURCE = 'church.webp'
const DEFAULT_GRID_SIZE = 32
const DEFAULT_PLAYER_PLACEMENTS = [
  [414, 212, -1],
  [264, 286, 1],
  [496, 330, -1],
  [410, 410, 1]
]

// Function to load and display the selected image
load.addEventListener('change', (event) => {
  const file = event.target.files[0];
  if (file && file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = (e) => loadMap(e.target.result);
    reader.readAsDataURL(file);
  } else {
    alert('Please select a valid image file.');
  }
});

function loadMap(m){
  map.setAttribute('href',m);
  const img = new Image();
  img.onload = () => {
    const imageWidth = img.width;
    const imageHeight = img.height;
    map.setAttribute('width', imageWidth);
    map.setAttribute('height', imageHeight);
    setInitialViewBox(imageWidth, imageHeight);
    if (m === DEFAULT_MAP_SOURCE) stageDefaultMapScene();
  };
  img.src = m;
}

let mousePos = []
svgCont.addEventListener('mousemove', (event) => {
  mousePos = svgCoords(event)
});

let drawingRegion = false
document.onkeypress = function (e) {
  e = e || window.event;
  const key = e.key
  const pen = getColor()
  switch (key){
    case 'e':
      selectEnemy(0)
      break
    case 'c':
      shape.value = 'circle'
      break
    case 'r':
      shape.value = 'rect'
      break
    case 'a': break
    default:
      selectEnemy(parseInt(key))
  }
  
  if (key!='a' || pen.length<=1) return
  if (drawingRegion){
    svgCont.removeEventListener('mousemove',drawingRegion)
    drawingRegion = false
    return
  }

  // if () return
  const [x0, y0] = mousePos
  const region = svg(shape.value, {
    cx:x0,
    cy:y0,
    r:0,
    x: x0,
    y: y0,
    width: 0,
    height: 0,
    fill:pen,
    'fill-opacity':0.3
  })
  svgCont.insertBefore(region,map.nextSibling)

  region.addEventListener('mousedown',(click)=>{
    click.stopPropagation()
    const color = getColor()
    if (color=='e') return svgCont.removeChild(click.target)
    if (!color) startDrag(click)
  })
  drawingRegion = (e)=>{
  e.stopPropagation()
  const [x,y] = svgCoords(e)
  region.setAttribute('r',Math.sqrt((x-x0)**2+(y-y0)**2))
  region.setAttribute('width',Math.abs(x-x0))
  region.setAttribute('height',Math.abs(y-y0))
  }
  svgCont.addEventListener('mousemove',drawingRegion)
};

const playerSize = new NumSlider(1,200,DEFAULT_GRID_SIZE,'Player Size')
const enemySize = new NumSlider(1,200,DEFAULT_GRID_SIZE,'Enemy Size')

el = t=>document.createElement(t)

const enemies = document.getElementById('enemies')
enemies.querySelector('.eraser-item').addEventListener('mousedown', () => selectEnemy(0))
const palette = [300,0,30,60,120,180,240]
function addEnemy(){
  const colorPicker = el('input')
  colorPicker.type = 'color'
  colorPicker.className = 'swatch'
  colorPicker.value = hslToHex(palette[enemies.children.length%palette.length],100,50)
  const listItem = el('li')
  listItem.className = 'palette-item'
  listItem.addEventListener('mousedown',e=>{
    selectEnemy([...enemies.children].indexOf(listItem))
  })
  const label = el('span')
  label.textContent = `Enemy ${enemies.children.length}`
  listItem.append(colorPicker)
  listItem.append(label)
  enemies.append(listItem)
  selectEnemy(enemies.children.length-1)
}
// source: https://stackoverflow.com/questions/36721830/convert-hsl-to-rgb-and-hex
function hslToHex(h, s, l) {
  l /= 100;
  const a = s * Math.min(l, 1 - l) / 100;
  const f = n => {
    const k = (n + h / 30) % 12;
    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    return Math.round(255 * color).toString(16).padStart(2, '0');   // convert to Hex and prefix "0" if needed
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}
addEnemy()
selectEnemy(0)

function selectEnemy(i){
  const enemyList = [...enemies.children]
  enemyList.forEach(e=>e.classList.remove('is-selected'))
  if (isNaN(i) || i>=enemyList.length) return
  enemyList[i].classList.add('is-selected')
}

function removeEnemy(){
  const enemyList = [...enemies.children]
  if (enemyList.length <= 1) return
  let selected = enemyList.length-1
  enemies.removeChild(enemyList.reduce((acc, c, i)=>{
    if (i && c.classList.contains('is-selected')){
      selected = i
      return c
    }
    return acc
  }, enemyList[selected]))
  selectEnemy(Math.min(selected, enemies.children.length-1))
}

function getColor(){
  const enemyList = [...enemies.children]
  let color = ''
  enemyList.forEach((e,i)=>{
    if (e.classList.contains('is-selected')) color = i ? e.children[0].value: 'e'
  })
  return color
}

function svgViewport() {
  const rect = svgCont.getBoundingClientRect();
  return {
    left: rect.left,
    top: rect.top,
    width: rect.width || window.innerWidth,
    height: rect.height || window.innerHeight
  };
}

function viewportAspect() {
  const viewport = svgViewport();
  return viewport.width / viewport.height;
}

function setInitialViewBox(imageWidth, imageHeight) {
  const screenAspect = viewportAspect();
  const imageAspect = imageWidth / imageHeight;
  let width = imageWidth;
  let height = imageHeight;
  let x = 0;
  let y = 0;

  // Cover the full browser viewport without distorting the map.
  if (imageAspect > screenAspect) {
    width = imageHeight * screenAspect;
    x = (imageWidth - width) / 2;
  } else {
    height = imageWidth / screenAspect;
    y = (imageHeight - height) / 2;
  }
  updateViewBox([x, y, width, height]);
}

function matchViewBoxToViewport() {
  if (!viewBox.length) return;
  const screenAspect = viewportAspect();
  const [x, y, width, height] = viewBox;
  const centerX = x + width / 2;
  const centerY = y + height / 2;
  let nextWidth = width;
  let nextHeight = height;
  if (width / height > screenAspect) {
    nextHeight = width / screenAspect;
  } else {
    nextWidth = height * screenAspect;
  }
  updateViewBox([
    centerX - nextWidth / 2,
    centerY - nextHeight / 2,
    nextWidth,
    nextHeight
  ]);
}

const svgCoords = e => {
  const viewport = svgViewport();
  return [
    viewBox[0] + ((e.clientX - viewport.left) / viewport.width) * viewBox[2],
    viewBox[1] + ((e.clientY - viewport.top) / viewport.height) * viewBox[3]
  ];
}

svgCont.addEventListener('mousedown', e=>{
  if (!viewBox.length) return
  const pen = getColor()
  if (pen.length>1) {
    const [x0, y0] = svgCoords(e) 
    const size = enemySize.value()
    const r = size/2
    const region = svg(shape.value, {
      cx:x0,
      cy:y0,
      r:r,
      x: x0-r,
      y: y0-r,
      width: size,
      height: size,
      fill:pen
    })
    svgCont.insertBefore(region, players[0])
    region.addEventListener('mousedown',(click)=>{
      click.stopPropagation()
      const color = getColor()
      if (color=='e') return svgCont.removeChild(click.target)
      if (!color) startDrag(click)
    })
  } else {
    const [startX,startY] = [e.clientX, e.clientY]
    const [l, t] = [viewBox[0], viewBox[1]]
    function onMouseMove(e) {
      const viewport = svgViewport();
      const deltaX = (e.clientX - startX) * (viewBox[2] / viewport.width);
      const deltaY = (e.clientY - startY) * (viewBox[3] / viewport.height);
      updateViewBox([l-deltaX, t-deltaY, viewBox[2], viewBox[3]])
    }

    function onMouseUp() {
      svgCont.removeEventListener('mousemove', onMouseMove);
      svgCont.removeEventListener('mouseup', onMouseUp);
    }

    svgCont.addEventListener('mousemove', onMouseMove);
    svgCont.addEventListener('mouseup', onMouseUp);
  }
})

let selectedGroup = []
function startDrag(event, player=false) {
  if (!viewBox.length) return
  event.preventDefault();
  const point = player || event.target;
  if (!event.shiftKey) selectedGroup = []
  const [x0,y0] = svgCoords(event)
  if (event.shiftKey && !selectedGroup.map(a=>a[0]).includes(point)) selectedGroup.push([point,x0,y0])

  function onMouseMove(e) {
    const [x,y] = svgCoords(e)
    if (e.shiftKey){
      selectedGroup.forEach(([icon,sx,sy], i)=>{
        setPosition(icon, x-x0+sx, y-y0+sy)
      })
      return
    }
    setPosition(point, x,y)
  }

  function onMouseUp() {
    svgCont.removeEventListener('mousemove', onMouseMove);
    svgCont.removeEventListener('mouseup', onMouseUp);
    // point.setAttribute('stroke','black')
    selectedGroup.forEach(arr=>{
      const [x,y] = getPosition(arr[0])
      arr[1] = x
      arr[2] = y
    })
  }

  svgCont.addEventListener('mousemove', onMouseMove);
  svgCont.addEventListener('mouseup', onMouseUp);
}

function setPosition(icon, x, y){
  switch (icon.nodeName){
    case 'g':
      movePlayer(x,y,icon)
      break;
    case 'circle':
      icon.setAttribute('cx', x)
      icon.setAttribute('cy', y)
      break;
    case 'rect':
      icon.setAttribute('x', x-Number(icon.getAttribute('width'))/2);
      icon.setAttribute('y', y-Number(icon.getAttribute('height'))/2);
      break;
  }
}

function getPosition(icon, x, y){
  switch (icon.nodeName){
    case 'g':
      return getPlayerPos(icon)
    case 'circle':
      return ['cx','cy'].map(a=>Number(icon.getAttribute(a)))
    case 'rect':
      return [Number(icon.getAttribute('x'))+Number(icon.getAttribute('width')/2),
      Number(icon.getAttribute('y'))+Number(icon.getAttribute('height')/2)];
  }
}

const zoomFactor = 1.1
let viewBox = []
svgCont.addEventListener('wheel',e=>{
  if (!viewBox.length) return
  e.preventDefault();

  // Calculate zoom direction
  const zoomIn = e.deltaY < 0;
  const viewport = svgViewport();
  const mouseX = (e.clientX - viewport.left) / viewport.width;
  const mouseY = (e.clientY - viewport.top) / viewport.height;

  // Adjust the viewBox width and height for zoom
  const zoomAmount = zoomIn ? 1 / zoomFactor : zoomFactor;
  const newWidth = viewBox[2] * zoomAmount;
  const newHeight = viewBox[3] * zoomAmount;

  // Calculate new viewBox X and Y to zoom towards mouse position
  viewBox[0] += (mouseX * viewBox[2]) * (1 - zoomAmount);
  viewBox[1] += (mouseY * viewBox[3]) * (1 - zoomAmount);
  viewBox[2] = newWidth;
  viewBox[3] = newHeight;

  updateViewBox(viewBox);
}, { passive: false })

updateViewBox = (xywh)=>{
  viewBox = xywh
  svgCont.setAttribute('viewBox', xywh.join(' '))
}

window.addEventListener('resize', matchViewBoxToViewport)

function movePlayer(x,y,player){
  let facing = 1
  if (player.getAttribute('transform')){
    const [prevX, prevY] = getPlayerPos(player)
    const prevSign = Math.sign(player.transform.baseVal[1].matrix.a)
    const newSign = Math.sign(Math.round(prevX-x))
    facing = newSign || prevSign || 1
  }
  setPlayerTransform(player, x, y, playerSize.value(), facing)
}

function setPlayerTransform(player, x, y, scale = playerSize.value(), facing = 1){
  player.setAttribute('transform',`translate(${x},${y})
  scale(${scale * (facing || 1)},${Math.abs(scale)})`)
}

function getPlayerFacing(player) {
  if (!player.getAttribute('transform')) return 1
  return Math.sign(player.transform.baseVal[1].matrix.a) || 1
}

function getPlayerPos(p){
  const translate = p.transform.baseVal[0].matrix
  return [translate.e, translate.f]
}

const toothContour = [
  ['A', outerR, base], 
  ['L', innerR, base+slope/2], 
  ['L', innerR, base+slope/2+tooth],
  ['L', outerR, base+slope/2+tooth+slope/2]
]
const toothTop = false
const startTheta = -Math.PI/2 - (toothTop ? (slope+tooth)/2 + base: base/2)
function polar(r, theta){
  return `${r*Math.cos(theta)},${r*Math.sin(theta)}`
}

gabriel.append(svg('path',{d:`
  M0,-0.5
  A0.5,0.5 0,0,0 0,0.5
  A0.5,0.5 0,0,0 0,-0.5
  M${polar(outerR,startTheta)}
  ${Array.from({length:teeth}).map((_,i)=>
    toothContour.map(([seg, r, theta])=>{
      const arc = `${r},${r} 0,0,1`
      return `${seg}${seg=='A'?arc:''} ${polar(r,theta+toothArc*i+startTheta)}`
    }).join(' ')
  ).join(' ')}
  z
  `}))

function archimedes(center, startRadius, spacePerLoop, startTheta, endTheta, thetaStep) {
  function lineIntersection (m1, b1, m2, b2) {
      if (m1 === m2) {
          throw new Error("parallel slopes");
      }
      const x = (b2 - b1) / (m1 - m2);
      return {x: x, y: m1 * x + b1};
  }
  
  function pStr (point) {
    return `${point.x},${point.y} `;
  }

  // Rename spiral parameters for the formula r = a + bθ
    const a = startRadius;  // start distance from center
    const b = spacePerLoop / Math.PI / 2; // space between each loop

    // convert angles to radians
    let oldTheta = newTheta = startTheta * Math.PI / 180;
    endTheta = endTheta * Math.PI / 180;
    thetaStep = thetaStep * Math.PI / 180;

    // radii
    let oldR,
        newR = a + b * newTheta;

    // start and end points
    const oldPoint = {x: 0, y: 0};
    const newPoint = {
        x: center.x + newR * Math.cos(newTheta), 
        y: center.y + newR * Math.sin(newTheta)
    };

    // slopes of tangents
    let oldslope,
        newSlope = (b * Math.sin(oldTheta) + (a + b * newTheta) * Math.cos(oldTheta)) /
                   (b * Math.cos(oldTheta) - (a + b * newTheta) * Math.sin(oldTheta));

    let path = "M " + pStr(newPoint);
    
    while (oldTheta < endTheta - thetaStep) {
        oldTheta = newTheta;
        newTheta += thetaStep;

        oldR = newR;
        newR = a + b * newTheta;

        oldPoint.x = newPoint.x;
        oldPoint.y = newPoint.y;
        newPoint.x = center.x + newR * Math.cos(newTheta);
        newPoint.y = center.y + newR * Math.sin(newTheta);

        // Slope calculation with the formula:
        // (b * sinΘ + (a + bΘ) * cosΘ) / (b * cosΘ - (a + bΘ) * sinΘ)
        const aPlusBTheta = a + b * newTheta;

        oldSlope = newSlope;
        newSlope = (b * Math.sin(newTheta) + aPlusBTheta * Math.cos(newTheta)) /
                   (b * Math.cos(newTheta) - aPlusBTheta * Math.sin(newTheta));

        const oldIntercept = -(oldSlope * oldR * Math.cos(oldTheta) - oldR * Math.sin(oldTheta));
        const newIntercept = -(newSlope * newR* Math.cos(newTheta) - newR * Math.sin(newTheta));

        const controlPoint = lineIntersection(oldSlope, oldIntercept, newSlope, newIntercept);

        // Offset the control point by the center offset.
        controlPoint.x += center.x;
        controlPoint.y += center.y;

        path += "Q " + pStr(controlPoint) + pStr(newPoint);
    }
    
    return path;
}
