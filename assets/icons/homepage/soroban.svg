<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" aria-hidden="true">
  <defs>
    <linearGradient id="soroban-wood" x1="13" y1="10" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1c176"/>
      <stop offset=".24" stop-color="#a96a2f"/>
      <stop offset=".52" stop-color="#d4934d"/>
      <stop offset=".78" stop-color="#7b431f"/>
      <stop offset="1" stop-color="#e2ad65"/>
    </linearGradient>
    <linearGradient id="soroban-crossbar" x1="15" y1="28.2" x2="57" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b3518"/>
      <stop offset=".18" stop-color="#d79a55"/>
      <stop offset=".52" stop-color="#9a5a28"/>
      <stop offset=".82" stop-color="#efbf78"/>
      <stop offset="1" stop-color="#6f3818"/>
    </linearGradient>
    <radialGradient id="soroban-bead-gloss" cx=".3" cy=".2" r=".82">
      <stop offset="0" stop-color="#f1fbff"/>
      <stop offset=".16" stop-color="#6f8794"/>
      <stop offset=".46" stop-color="#24384a"/>
      <stop offset=".78" stop-color="#0d1824"/>
      <stop offset="1" stop-color="#05080d"/>
    </radialGradient>
    <linearGradient id="soroban-bead-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8aa4b3"/>
      <stop offset=".48" stop-color="#172534"/>
      <stop offset="1" stop-color="#030509"/>
    </linearGradient>
  </defs>
  <style>
    svg{--soroban-step-pause:.58s;--soroban-step-slide:.32s;--soroban-slide-samples:6;--soroban-cycle-duration:7.2s}
    .back{fill:#dde8ef}
    .frame{fill:url(#soroban-wood)}
    .well{fill:#c9d8e1}
    .bar{fill:url(#soroban-crossbar)}
    .rod{fill:none;stroke:#8f5a2c;stroke-width:1.35;stroke-linecap:round;opacity:.74}
    .bead{fill:url(#soroban-bead-gloss);stroke:url(#soroban-bead-edge);stroke-width:1.1;transform-box:fill-box;transform-origin:center}
    .soroban-animate{animation-name:var(--soroban-keyframes);animation-duration:var(--soroban-cycle-duration);animation-timing-function:linear;animation-iteration-count:infinite;animation-play-state:paused}
    svg:hover .soroban-animate,
    .showcase-link:hover .soroban-animate,
    .showcase-link:focus-visible .soroban-animate{animation-play-state:running}
    .soroban-hundreds-earth-1{--soroban-keyframes:soroban-hundreds-earth-1;--soroban-values:0,-2.9,-2.9,-2.9,-2.9,-2.9,0,0,0}
    .soroban-hundreds-earth-2{--soroban-keyframes:soroban-hundreds-earth-2;--soroban-values:0,-2.9,-2.9,-2.9,-2.9,0,0,0,0}
    .soroban-hundreds-earth-3{--soroban-keyframes:soroban-hundreds-earth-3;--soroban-values:0,-2.9,-2.9,0,0,0,0,0,0}
    .soroban-hundreds-earth-4{--soroban-keyframes:soroban-hundreds-earth-4;--soroban-values:0,-2.9,0,0,0,0,0,0,0}
    .soroban-tens-heaven{--soroban-keyframes:soroban-tens-heaven;--soroban-values:0,0,5,5,0,0,5,0,0}
    .soroban-tens-earth-1{--soroban-keyframes:soroban-tens-earth-1;--soroban-values:0,-2.9,0,-2.9,-2.9,-2.9,-2.9,0,0}
    .soroban-tens-earth-2{--soroban-keyframes:soroban-tens-earth-2;--soroban-values:0,-2.9,0,-2.9,0,-2.9,-2.9,0,0}
    .soroban-tens-earth-3{--soroban-keyframes:soroban-tens-earth-3;--soroban-values:0,0,0,-2.9,0,-2.9,0,0,0}
    .soroban-tens-earth-4{--soroban-keyframes:soroban-tens-earth-4;--soroban-values:0,0,0,0,0,-2.9,0,0,0}
    .soroban-ones-heaven{--soroban-keyframes:soroban-ones-heaven;--soroban-values:0,0,0,0,0,0,5,5,0}
    .soroban-ones-earth-1{--soroban-keyframes:soroban-ones-earth-1;--soroban-values:0,0,-2.9,-2.9,-2.9,-2.9,0,-2.9,0}
    .soroban-ones-earth-2{--soroban-keyframes:soroban-ones-earth-2;--soroban-values:0,0,0,-2.9,-2.9,-2.9,0,0,0}
    .soroban-ones-earth-3{--soroban-keyframes:soroban-ones-earth-3;--soroban-values:0,0,0,0,-2.9,-2.9,0,0,0}
    .soroban-ones-earth-4{--soroban-keyframes:soroban-ones-earth-4;--soroban-values:0,0,0,0,0,-2.9,0,0,0}
    @media (prefers-reduced-motion:reduce){.soroban-animate{animation:none}}
  </style>
  <rect class="back" x="9" y="9" width="54" height="54" rx="10"/>
  <rect class="frame" x="13" y="13" width="46" height="46" rx="5"/>
  <rect class="well" x="15.6" y="15.6" width="40.8" height="40.8" rx="3.2"/>
  <rect class="bar" x="15" y="28.6" width="42" height="2.8" rx="1.4"/>
  <g class="rod">
    <line x1="21" y1="16.8" x2="21" y2="55.2"/>
    <line x1="31" y1="16.8" x2="31" y2="55.2"/>
    <line x1="41" y1="16.8" x2="41" y2="55.2"/>
    <line x1="51" y1="16.8" x2="51" y2="55.2"/>
  </g>
  <g>
    <ellipse class="bead" cx="21" cy="20.1" rx="3.55" ry="2.45"/>
    <ellipse class="bead" cx="31" cy="20.1" rx="3.55" ry="2.45"/>
    <ellipse class="bead soroban-animate soroban-tens-heaven" cx="41" cy="20.1" rx="3.55" ry="2.45"/>
    <ellipse class="bead soroban-animate soroban-ones-heaven" cx="51" cy="20.1" rx="3.55" ry="2.45"/>

    <ellipse class="bead" cx="21" cy="38.3" rx="3.55" ry="2.45"/>
    <ellipse class="bead" cx="21" cy="43.2" rx="3.55" ry="2.45"/>
    <ellipse class="bead" cx="21" cy="48.1" rx="3.55" ry="2.45"/>
    <ellipse class="bead" cx="21" cy="53" rx="3.55" ry="2.45"/>

    <ellipse class="bead soroban-animate soroban-hundreds-earth-1" cx="31" cy="38.3" rx="3.55" ry="2.45"/>
    <ellipse class="bead soroban-animate soroban-hundreds-earth-2" cx="31" cy="43.2" rx="3.55" ry="2.45"/>
    <ellipse class="bead soroban-animate soroban-hundreds-earth-3" cx="31" cy="48.1" rx="3.55" ry="2.45"/>
    <ellipse class="bead soroban-animate soroban-hundreds-earth-4" cx="31" cy="53" rx="3.55" ry="2.45"/>

    <ellipse class="bead soroban-animate soroban-tens-earth-1" cx="41" cy="38.3" rx="3.55" ry="2.45"/>
    <ellipse class="bead soroban-animate soroban-tens-earth-2" cx="41" cy="43.2" rx="3.55" ry="2.45"/>
    <ellipse class="bead soroban-animate soroban-tens-earth-3" cx="41" cy="48.1" rx="3.55" ry="2.45"/>
    <ellipse class="bead soroban-animate soroban-tens-earth-4" cx="41" cy="53" rx="3.55" ry="2.45"/>

    <ellipse class="bead soroban-animate soroban-ones-earth-1" cx="51" cy="38.3" rx="3.55" ry="2.45"/>
    <ellipse class="bead soroban-animate soroban-ones-earth-2" cx="51" cy="43.2" rx="3.55" ry="2.45"/>
    <ellipse class="bead soroban-animate soroban-ones-earth-3" cx="51" cy="48.1" rx="3.55" ry="2.45"/>
    <ellipse class="bead soroban-animate soroban-ones-earth-4" cx="51" cy="53" rx="3.55" ry="2.45"/>
  </g>
</svg>
