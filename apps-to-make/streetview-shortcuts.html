<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shortcut Bubbles</title><link rel="stylesheet" href="draft.css"><style>
.stage{display:grid;place-items:center}.bubble{width:min(66dvh,82vw,700px);aspect-ratio:1;border-radius:50%;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 45%,#d8d2bb 0 8%,#8fb4bd 9% 51%,#617b65 52% 70%,#263735 71%);box-shadow:inset 0 0 80px #0008,0 25px 70px #26373555}.bubble::before{content:"";position:absolute;inset:11%;border:2px dashed #fff7;border-radius:50%}.bubble-content{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:white;padding:20%;text-shadow:0 2px 8px #000}.bubble-content strong{font:500 clamp(2rem,6vw,4.5rem) "Draft Serif",serif}.answer{min-height:5rem;padding:.8rem;background:#fff8;border-left:4px solid var(--accent)}.deck{max-height:180px;overflow:auto;display:grid;gap:.35rem}.deck button{border-radius:9px;text-align:left}.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem}.grades button{padding:.45rem .1rem}dialog{width:min(600px,calc(100vw - 1rem));border:0;border-radius:18px;background:var(--paper);box-shadow:var(--shadow)}dialog::backdrop{background:#172b2ecc}
</style></head><body><main class="app"><header class="topbar"><h1>Shortcut Bubbles</h1><span class="kicker">street-view spaced repetition</span></header><div class="workspace"><aside class="sidebar stack"><button class="primary" id="openPano">Open Street View</button><label>Your route<textarea id="route" rows="3" placeholder="Name the turns or streets"></textarea></label><div class="row"><button id="reveal">Reveal</button><button id="add">Add card</button></div><div class="answer hidden" id="answer"></div><div class="grades hidden" id="grades"><button data-g="again">Again</button><button data-g="hard">Hard</button><button data-g="good">Good</button><button data-g="easy">Easy</button></div><div class="split"><div><div class="eyebrow">Due</div><div class="metric" id="due">0</div></div><div><div class="eyebrow">Deck</div><div class="metric" id="count">0</div></div></div><div class="deck" id="deck"></div><p class="muted">The panorama opens through Google Maps’ public Street View action URL, so this draft needs no API key. Scheduling and routes stay local.</p></aside><section class="stage"><div class="bubble"><div class="bubble-content"><div><div class="eyebrow" id="place">No cards yet</div><strong id="destination">Add a shortcut</strong><p id="origin"></p></div></div></div></section></div></main><dialog id="dialog"><form class="stack" id="form"><h2>Add shortcut card</h2><div class="split"><label>Origin<input id="newOrigin" required placeholder="North Berkeley BART"></label><label>Destination<input id="newDestination" required placeholder="Lake Merritt"></label></div><label>Where should the panorama begin?<input id="newPlace" placeholder="Ashby at Telegraph"></label><div class="split"><label>Latitude<input id="lat" type="number" step="any" required></label><label>Longitude<input id="lon" type="number" step="any" required></label></div><div class="split"><label>Heading °<input id="heading" type="number" value="0"></label><label>Pitch °<input id="pitch" type="number" value="0"></label></div><label>Preferred shortcut / answer<textarea id="newRoute" rows="3" required></textarea></label><div class="row"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog><script>
const KEY='appsToMake.streetShortcuts.v1',$=id=>document.getElementById(id),day=86400000;let deck=[],current=null;try{deck=JSON.parse(localStorage.getItem(KEY))||[]}catch{}function save(){localStorage.setItem(KEY,JSON.stringify(deck))}function due(){return deck.filter(c=>(c.due||0)<=Date.now())}function pick(card){current=card||due()[0]||deck.slice().sort((a,b)=>(a.due||0)-(b.due||0))[0]||null;render()}
function render(){const c=current;$('place').textContent=c?.place||'No cards yet';$('destination').textContent=c?c.destination:'Add a shortcut';$('origin').textContent=c?`from ${c.origin}`:'Build a Berkeley / Oakland route deck.';$('route').value='';$('answer').classList.add('hidden');$('grades').classList.add('hidden');$('due').textContent=due().length;$('count').textContent=deck.length;$('openPano').disabled=!c;$('deck').innerHTML=deck.map(c=>`<button data-id="${c.id}">${escapeHtml(c.origin)} → ${escapeHtml(c.destination)}</button>`).join('')||'<div class="empty">No shortcut cards</div>'}
function escapeHtml(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}$('openPano').onclick=()=>{if(!current)return;const url=new URL('https://www.google.com/maps/@');url.searchParams.set('api','1');url.searchParams.set('map_action','pano');url.searchParams.set('viewpoint',`${current.lat},${current.lon}`);url.searchParams.set('heading',current.heading||0);url.searchParams.set('pitch',current.pitch||0);url.searchParams.set('fov','80');window.open(url,'streetview-shortcut')};$('reveal').onclick=()=>{if(!current)return;$('answer').innerHTML=`<strong>${escapeHtml(current.route)}</strong>${$('route').value.trim()?`<br><span class="muted">You wrote: ${escapeHtml($('route').value)}</span>`:''}`;$('answer').classList.remove('hidden');$('grades').classList.remove('hidden')};
function grade(g){const c=current,now=Date.now();c.ease=c.ease||2.5;c.interval=c.interval||0;if(g==='again'){c.interval=0;c.due=now+10*60000;c.ease=Math.max(1.3,c.ease-.2)}if(g==='hard'){c.interval=Math.max(1,Math.round((c.interval||1)*1.2));c.due=now+c.interval*day}if(g==='good'){c.interval=c.interval?Math.round(c.interval*c.ease):1;c.due=now+c.interval*day}if(g==='easy'){c.interval=c.interval?Math.round(c.interval*c.ease*1.3):4;c.due=now+c.interval*day;c.ease+=.15}save();pick()}$('grades').onclick=e=>e.target.dataset.g&&grade(e.target.dataset.g);$('deck').onclick=e=>{const id=e.target.closest('[data-id]')?.dataset.id;if(id)pick(deck.find(c=>c.id===id))};$('add').onclick=()=>$('dialog').showModal();$('cancel').onclick=()=>$('dialog').close();$('form').onsubmit=e=>{e.preventDefault();deck.push({id:crypto.randomUUID(),origin:$('newOrigin').value.trim(),destination:$('newDestination').value.trim(),place:$('newPlace').value.trim(),lat:+$('lat').value,lon:+$('lon').value,heading:+$('heading').value,pitch:+$('pitch').value,route:$('newRoute').value.trim(),due:0,interval:0,ease:2.5});save();$('dialog').close();$('form').reset();pick(deck.at(-1))};pick();
</script></body></html>
