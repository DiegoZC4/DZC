<body>
<p>Hover a key to see which ion's ionization energy is closest to that pitch (using E=hf and transposed down 50 octaves)</p>
  <div id="sliders"></div>
  <div id="keyboard"></div>
<script>

const sliderLength = '200px'
const numberWidth  = '50px'

class LabelledSlider {
  constructor(min, max, start, units, step=1, parent='sliders') {
    this.min = min
    this.max = max

    let slider = document.createElement('input')
    slider.type = 'range'
    slider.min = min
    slider.max = max
    slider.step = step
    slider.value = start
    slider.style.width = sliderLength
    this.slider = slider
    this.slider.addEventListener('input', () => this.num.value = this.slider.value)
    
    let num = document.createElement('input')
    num.type = 'number'
    num.value = start
    num.min = min
    num.max = max
    num.step = step
    num.style.textAlign = 'right'
    num.style.width = numberWidth
    this.num = num
    this.num.addEventListener('input', () => {
      let value = Math.min(Math.max(Number(this.num.value) || min, min), max)
      this.num.value = value
      this.slider.value = value
    })

    let label = document.createElement('label')
    label.appendChild(this.slider)
    label.appendChild(this.num)
    label.appendChild(document.createTextNode(' ' + units))
    label.append(document.createElement('br'))
    this.label = label
    document.getElementById(parent).append(this.label)
  }
  value() {return Number(this.slider.value)}
  on(event, func) {this.slider.addEventListener(event,func)}
}

const sliders = document.getElementById('sliders')
const octave  = new LabelledSlider(  0, 20,  7, 'octave')
const halfsteps=new LabelledSlider(  0, 11,  0, 'halfsteps')
const tuning  = new LabelledSlider(-20, 20,  5, 'notes between rows')
const volume  = new LabelledSlider(  0,100, 15, 'volume')
const decay   = new LabelledSlider(  0, 10,  1, 'decay (seconds)', step=0.1);

const wave = document.createElement('select');
["sine", "square", "sawtooth", "triangle"].forEach(w=>{
  let option = document.createElement("option")
  option.value = w
  option.innerHTML = w
  wave.appendChild(option)
})
wave.value = 'triangle'
let label = document.createElement('label')
label.innerHTML = 'Waveform '
label.appendChild(wave)
sliders.appendChild(label)
sliders.appendChild(document.createElement('p'))

const audioContext = new (window.AudioContext || window.webkitAudioContext)()
const masterGain = audioContext.createGain()
masterGain.gain.value = volume.value()/100
masterGain.connect(audioContext.destination)
volume.on('input', () => {
  const now = audioContext.currentTime
  masterGain.gain.cancelScheduledValues(now)
  masterGain.gain.setValueAtTime(masterGain.gain.value, now);
  masterGain.gain.value = volume.value()/100
})

class Key{
  constructor(key, freq, hue, sym){
    this.key = key
    this.freq = freq
    
    let b = document.createElement('button')
    b.style.width = buttonSize
    b.style.height = buttonSize
    b.textContent = key
    this.button = b
    this.hue = hue
    this.setColor()
    b.addEventListener('mousedown',(e)=>{
      e.preventDefault()
      this.press()
    })
    b.addEventListener('mouseup',(e)=>{
      e.preventDefault()
      this.release()
    })
    
    let osc = audioContext.createOscillator()
    osc.type = wave.value
    osc.start()
    this.osc = osc
    let vol = audioContext.createGain();
    vol.gain.value = 0
    osc.connect(vol)
    vol.connect(masterGain)
    this.vol = vol
    this.sym = sym
    this.setFrequency(freq)
  }
  html(){return this.button}
  setFrequency(freq){
    this.osc.frequency.value = freq
    this.button.title = `${Math.round(freq)}Hz ${freq2Pitch(freq)} ${this.sym}`
  }
  setWaveform(wave){this.osc.type = wave}
  setHue(hue){
    this.hue=hue
    this.setColor()
  }
  setColor(down=false){
    this.button.style.background = 
    `hsl(${this.hue},
    ${down?downSaturation:upSaturation},
    ${down? downLightness: upLightness})`
  }
  press(){
    this.setColor(true)
    this.setGain(1)
  }
  release(){
    this.setColor(false)
    this.setGain(0,pedal?decay.value():0.01)
  }
  setGain(g,ramp=0.01){
    const now = audioContext.currentTime
    this.vol.gain.cancelScheduledValues(now)
    this.vol.gain.setValueAtTime(this.vol.gain.value, now);
    this.vol.gain.linearRampToValueAtTime(g, now+ramp)
  }
}

const buttonSize = '50px'
const upSaturation = '50%'
const downSaturation = '100%'
const upLightness = '50%'
const downLightness = '75%'
const pitches = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B']
const C0 = 2**(4.06056056); // Frequency of C0
function freq2Pitch(freq) {
  let halfsteps = Math.log2(freq/C0) * 12;
  let noteIndex = Math.round(halfsteps) % 12;
  if (noteIndex < 0) noteIndex += 12; // Handle negative modulus for frequencies below C0
  let octave = Math.floor((Math.round(halfsteps)) / 12);
  let cents = Math.round((halfsteps - Math.round(halfsteps)) * 100);
  return `${pitches[noteIndex]}${octave}${(cents < 0 ? "" : "+") + cents}`;
}

const keyboardDiv = document.getElementById('keyboard')
const keyboardChars = [
"zxcvbnm,./",
"asdfghjkl;",
"qwertyuiop",
"1234567890"]
const coords2Note = (i,j) => tuning.value()*j+i + halfsteps.value() + 12*octave.value()
const coords2Freq = (i,j) => Object.values(sym2Freq)[coords2Note(i,j)]
const coords2Sym = (i,j) => Object.keys(sym2Freq)[coords2Note(i,j)]
const coords2Hue = (i,j) => coords2Note(i,j)%12 / 12 * 360

const char2Keys = {}
const keys = keyboardChars.map((row,j)=>[...row].map((key,i)=>{
  let k = new Key(key, 10, coords2Hue(i,j), coords2Sym(i,j))
  k.setFrequency(coords2Freq(i,j),)
  char2Keys[key] = k
  return k
}))

keys.toReversed().forEach(row=>{
  row.forEach(b=>keyboardDiv.appendChild(b.html()))
  keyboardDiv.appendChild(document.createElement('br'))
})

function updateKeys(i,j){
  keys.forEach((row,j)=>row.forEach((k,i)=>{
    k.setHue(coords2Hue(i,j))
    k.setFrequency(coords2Freq(i,j))
    k.setWaveform(wave.value)
  }))
}

octave.on('input',updateKeys)
halfsteps.on('input',updateKeys)
tuning.on('input',updateKeys)
wave.addEventListener('input',updateKeys)

let pedal = false

document.onkeydown = function (e) {
  e = e || window.event
  let key = e.key
  if (key == ' ') pedal = !pedal
  if (key in char2Keys) char2Keys[e.key].press()
}
document.onkeyup = function (e) {
  e = e || window.event
  let key = e.key
  if (key in char2Keys) char2Keys[e.key].release()
}

function resumeAudioContext() {
  if (audioContext.state === 'suspended') {
    audioContext.resume().then(() => {
      console.log('AudioContext resumed');
    }).catch((error) => {
      console.error('Failed to resume the AudioContext:', error);
    });
  }
}

document.addEventListener('click', resumeAudioContext);
document.addEventListener('keydown', resumeAudioContext);
