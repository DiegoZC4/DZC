<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Transcript Search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff0000'/%3E%3Cpath d='M26 20v24l21-12z' fill='white'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f7f7f4;
  --ink: #181818;
  --muted: #6f706c;
  --line: #d9d8d0;
  --panel: #ffffff;
  --accent: #cc241d;
  --accent-soft: #fff0ef;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { display: flex; justify-content: center; }
main { width: min(980px, 100%); padding: 22px 16px 44px; }
h1 { margin: 0 0 14px; font-size: clamp(28px, 5vw, 52px); line-height: 1; letter-spacing: 0; }
.searchbar { display: grid; grid-template-columns: minmax(0, 1fr) 82px; gap: 8px; align-items: stretch; position: sticky; top: 0; z-index: 2; padding: 10px 0 14px; background: var(--bg); }
input, button { min-height: 46px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
input { padding: 0 12px; border-radius: 7px; }
button { border-radius: 7px; cursor: pointer; font-weight: 800; }
button.primary { border-color: var(--accent); background: var(--accent); color: white; }
.channels { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: grid; gap: 8px; margin-bottom: 12px; padding: 10px; }
.channel-tools { align-items: center; display: flex; gap: 10px; justify-content: space-between; }
.channel-tools button { min-height: 34px; padding: 0 12px; }
.channel-summary { color: var(--muted); font-size: 13px; }
.channel-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.channel-choice { align-items: center; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; display: inline-flex; font-size: 13px; font-weight: 750; gap: 6px; padding: 7px 10px; }
.channel-choice input { accent-color: var(--accent); min-height: 0; }
.channel-choice:has(input:checked) { background: var(--accent-soft); border-color: #ffd2cf; color: var(--accent); }
.meta { min-height: 24px; color: var(--muted); font-size: 14px; margin: 2px 0 14px; }
.results { display: grid; gap: 9px; }
.result { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.result-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
.title { font-weight: 800; line-height: 1.25; }
.channel { color: var(--muted); font-size: 13px; margin-top: 2px; }
.video-count { color: var(--muted); flex: 0 0 auto; font-size: 13px; font-weight: 800; }
.hits { display: grid; gap: 8px; }
.hit { border-top: 1px solid var(--line); display: grid; gap: 6px; grid-template-columns: auto minmax(0, 1fr); padding-top: 9px; }
.time { align-self: start; color: var(--accent); background: var(--accent-soft); border: 1px solid #ffd2cf; border-radius: 999px; padding: 4px 9px; font-weight: 800; text-decoration: none; }
.snippet { color: #30302e; line-height: 1.45; }
.snippet strong { background: var(--accent-soft); border-radius: 4px; color: var(--accent); font-weight: 950; padding: 0 2px; }
.match-count { color: var(--muted); font-size: 12px; font-weight: 700; margin-left: 6px; }
.empty { padding: 18px 0; color: var(--muted); }
@media (max-width: 680px) {
  .result-top { align-items: flex-start; }
  .channel-tools { align-items: flex-start; flex-direction: column; }
}
</style>
</head>
<body>
<main>
  <h1>Transcript Search</h1>
  <form class="searchbar" id="searchForm">
    <input id="queryInput" name="q" autocomplete="off" placeholder="Search across transcripts">
    <button class="primary" type="submit">Search</button>
  </form>
  <section class="channels" aria-label="Channels">
    <div class="channel-tools">
      <button type="button" id="allChannelsButton">All</button>
      <div class="channel-summary" id="channelSummary">Loading channels...</div>
    </div>
    <div class="channel-grid" id="channelGrid"></div>
  </section>
  <div class="meta" id="meta"></div>
  <section class="results" id="results"></section>
</main>
<script>
const form = document.getElementById('searchForm');
const queryInput = document.getElementById('queryInput');
const allChannelsButton = document.getElementById('allChannelsButton');
const channelGrid = document.getElementById('channelGrid');
const channelSummary = document.getElementById('channelSummary');
const meta = document.getElementById('meta');
const results = document.getElementById('results');
let channelRows = [];

init();

async function init() {
  await loadChannels();
  form.addEventListener('submit', event => {
    event.preventDefault();
    search();
  });
  allChannelsButton.addEventListener('click', toggleAllChannels);
  channelGrid.addEventListener('change', updateChannelSummary);
}

async function loadChannels() {
  try {
    const payload = await getJson('api.php?action=channels');
    channelRows = payload.channels || [];
    renderChannelChoices(channelRows);
    const stats = payload.stats || {};
    meta.textContent = `${stats.videos || 0} videos, ${stats.channels || 0} channels indexed`;
  } catch (error) {
    meta.textContent = error.message;
  }
}

function renderChannelChoices(rows) {
  const fragment = document.createDocumentFragment();
  for (const row of rows) {
    const label = document.createElement('label');
    label.className = 'channel-choice';
    label.innerHTML = `
      <input type="checkbox" name="channels" checked>
      <span></span>
    `;
    label.querySelector('input').value = row.channel;
    label.querySelector('span').textContent = `${row.channel} (${row.video_count})`;
    fragment.appendChild(label);
  }
  channelGrid.replaceChildren(fragment);
  updateChannelSummary();
}

function selectedChannels() {
  return [...channelGrid.querySelectorAll('input[name="channels"]:checked')].map(input => input.value);
}

function updateChannelSummary() {
  const selected = selectedChannels().length;
  const total = channelRows.length;
  channelSummary.textContent = `${selected} of ${total} channels selected`;
}

function toggleAllChannels() {
  const inputs = [...channelGrid.querySelectorAll('input[name="channels"]')];
  const shouldSelect = selectedChannels().length !== inputs.length;
  for (const input of inputs) {
    input.checked = shouldSelect;
  }
  updateChannelSummary();
}

async function search() {
  const query = queryInput.value.trim();
  if (!query) {
    results.innerHTML = '<div class="empty">Type a search phrase.</div>';
    return;
  }
  const channels = selectedChannels();
  if (!channels.length) {
    meta.textContent = 'Select at least one channel.';
    results.innerHTML = '';
    return;
  }
  meta.textContent = 'Searching...';
  results.innerHTML = '';
  try {
    const params = new URLSearchParams({
      action: 'search',
      q: query,
      limit: '60'
    });
    for (const channel of channels) {
      params.append('channels[]', channel);
    }
    const payload = await getJson(`api.php?${params}`);
    renderResults(payload.results || [], query);
  } catch (error) {
    meta.textContent = error.message;
  }
}

function renderResults(items, query) {
  const groups = groupResultsByVideo(items);
  const videoCount = groups.length;
  meta.textContent = `${items.length} result${items.length === 1 ? '' : 's'} in ${videoCount} video${videoCount === 1 ? '' : 's'} for "${query}"`;
  if (!items.length) {
    results.innerHTML = '<div class="empty">No matches.</div>';
    return;
  }
  const fragment = document.createDocumentFragment();
  for (const group of groups) {
    const article = document.createElement('article');
    article.className = 'result';
    article.innerHTML = `
      <div class="result-top">
        <div>
          <div class="title"></div>
          <div class="channel"></div>
        </div>
        <div class="video-count"></div>
      </div>
      <div class="hits"></div>
    `;
    const first = group.items[0];
    article.querySelector('.title').textContent = first.title || first.youtube_id;
    const channel = article.querySelector('.channel');
    channel.textContent = first.channel || '';
    article.querySelector('.video-count').textContent = `${group.items.length} hit${group.items.length === 1 ? '' : 's'}`;
    const hits = article.querySelector('.hits');
    for (const item of group.items) {
      const hit = document.createElement('div');
      hit.className = 'hit';
      hit.innerHTML = `
        <a class="time" target="_blank" rel="noreferrer"></a>
        <div>
          <div class="snippet"></div>
        </div>
      `;
      const time = hit.querySelector('.time');
      time.href = item.url;
      time.textContent = item.timestamp || '0:00';
      const snippet = hit.querySelector('.snippet');
      renderSnippet(snippet, item);
      if (item.match_count > 1) {
        const count = document.createElement('span');
        count.className = 'match-count';
        count.textContent = `${item.match_count} nearby matches`;
        snippet.appendChild(count);
      }
      hits.appendChild(hit);
    }
    fragment.appendChild(article);
  }
  results.replaceChildren(fragment);
}

function groupResultsByVideo(items) {
  const groups = [];
  const byVideo = new Map();
  for (const item of items) {
    const key = item.youtube_id || `${item.channel}:${item.title}`;
    let group = byVideo.get(key);
    if (!group) {
      group = { key, items: [] };
      byVideo.set(key, group);
      groups.push(group);
    }
    group.items.push(item);
  }
  return groups;
}

function renderSnippet(container, item) {
  const parts = Array.isArray(item.snippet_parts) ? item.snippet_parts : [];
  if (!parts.length) {
    container.textContent = item.snippet || '';
    return;
  }
  const fragment = document.createDocumentFragment();
  for (const part of parts) {
    if (part.match) {
      const strong = document.createElement('strong');
      strong.textContent = part.text || '';
      fragment.appendChild(strong);
    } else {
      fragment.appendChild(document.createTextNode(part.text || ''));
    }
  }
  container.replaceChildren(fragment);
}

async function getJson(url) {
  const response = await fetch(url, { cache: 'no-store' });
  const text = await response.text();
  if (!text.trim()) {
    throw new Error(`Empty API response (${response.status})`);
  }
  let payload;
  try {
    payload = JSON.parse(text);
  } catch (error) {
    throw new Error(`Invalid API response (${response.status})`);
  }
  if (!response.ok || !payload.ok) throw new Error(payload.error || `Request failed (${response.status})`);
  return payload;
}
</script>
</body>
</html>
