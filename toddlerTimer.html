    :root {
      --paper: #fffdf7;
      --ink: #202124;
      --muted: #666a73;
      --line: #d8d2c3;
      --sun: #f7c948;
      --mint: #54c6a5;
      --sky: #4d96ff;
      --berry: #ef5d7a;
      --grape: #8f6adf;
      --number-hue: 29;
      --number-color: oklch(42% 0.2 var(--number-hue));
      --number-fill: oklch(76% 0.18 var(--number-hue));
      --shadow: 0 16px 48px rgba(35, 31, 21, 0.12);
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next Rounded", "Nunito", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(247, 201, 72, 0.28), transparent 28rem),
        radial-gradient(circle at bottom right, rgba(77, 150, 255, 0.18), transparent 24rem),
        var(--paper);
    }

    button,
    input {
      font: inherit;
    }

    .app-shell {
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 14px;
      position: fixed;
      top: 0;
      right: 0;
      z-index: 5;
    }

    .decrement-button {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 5;
      font-size: 34px;
      font-weight: 1000;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .decrement-button .minus-glyph {
      display: block;
      line-height: 0.78;
      transform: translateY(-0.06em);
    }

    body:not(.counting) .decrement-button {
      display: none;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .icon-button {
      width: 46px;
      height: 46px;
      border: 2px solid var(--line);
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      display: inline-grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(35, 31, 21, 0.08);
      transition: transform 0.16s ease, border-color 0.16s ease;
    }

    .icon-button:hover {
      transform: translateY(-1px);
      border-color: var(--sky);
    }

    .icon-button svg {
      width: 36px;
      height: 36px;
    }

    .main {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: clamp(72px, 8vw, 90px) clamp(18px, 4vw, 40px) clamp(18px, 4vw, 40px);
    }

    body.counting .main {
      width: 100%;
      padding: 0;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
      align-items: start;
    }

    .panel {
      border: 2px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: var(--shadow);
      padding: clamp(18px, 3vw, 26px);
    }

    .panel + .panel {
      margin-top: 18px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .panel-title h2 {
      font-size: clamp(1.25rem, 2vw, 1.7rem);
    }

    .field-stack {
      display: grid;
      gap: 16px;
    }

    label,
    .value-control {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-weight: 750;
      font-size: 0.92rem;
    }

    .value-dial {
      min-height: 84px;
      display: grid;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: clamp(1.7rem, 5vw, 2.7rem);
      font-weight: 1000;
      line-height: 1;
      text-align: center;
      cursor: ns-resize;
      touch-action: none;
      user-select: none;
    }

    .value-dial.dragging {
      border-color: var(--sky);
      box-shadow: inset 0 0 0 4px rgba(77, 150, 255, 0.14);
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 6px;
      border-radius: 8px;
      border: 2px solid var(--line);
      background: #fff;
    }

    .segmented button,
    .primary-action,
    .secondary-action {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 950;
    }

    .segmented button {
      min-height: 48px;
      background: transparent;
      color: var(--muted);
    }

    .segmented button.active {
      background: var(--sky);
      color: #fff;
    }

    .primary-action {
      min-height: 58px;
      background: var(--mint);
      color: #062a21;
      font-size: 1.2rem;
      box-shadow: 0 12px 22px rgba(84, 198, 165, 0.28);
    }

    .secondary-action {
      min-height: 48px;
      background: #fff;
      border: 2px solid var(--line);
      color: var(--ink);
    }

    .representation-pager {
      height: 88px;
      overflow: hidden;
      position: relative;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .representation-pager.dragging {
      cursor: grabbing;
    }

    .pager-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      place-items: center;
      padding: 18px 24px;
      text-align: center;
      background: #fff;
      color: var(--ink);
      font-size: clamp(1.4rem, 3vw, 2.1rem);
      font-weight: 900;
      line-height: 1.1;
      will-change: transform;
    }

    .number-screen {
      min-height: 100vh;
      display: grid;
    }

    .count-pad {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      appearance: none;
      border: 0;
      border-radius: 0;
      min-height: 100vh;
      width: 100%;
      background: #fff;
      cursor: pointer;
      display: grid;
      grid-template-rows: 1fr;
      overflow: hidden;
      color: #1f1720;
      padding: clamp(18px, 4vw, 34px);
      touch-action: none;
      user-select: none;
    }

    .count-pad:focus,
    .count-pad:focus-visible {
      outline: none;
    }

    .count-pad:active {
      transform: scale(0.993);
    }

    .count-display {
      display: grid;
      place-items: center;
      min-height: 0;
    }

    .round-number-button {
      --button-size: min(74vmin, 620px);
      width: var(--button-size);
      height: var(--button-size);
      aspect-ratio: 1;
      border-radius: 50%;
      border: clamp(8px, 1.6vmin, 14px) solid #202124;
      background:
        radial-gradient(circle at 36% 28%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0) 34%),
        var(--number-fill);
      box-shadow: 0 20px 46px rgba(35, 31, 21, 0.18), inset 0 -16px 0 rgba(32, 33, 36, 0.08);
      color: var(--number-color);
      display: grid;
      place-items: center;
      padding: clamp(24px, 6vmin, 54px);
      overflow: hidden;
      container-type: inline-size;
    }

    .count-pad:active .round-number-button {
      transform: scale(0.985);
      box-shadow: 0 12px 28px rgba(35, 31, 21, 0.14), inset 0 -8px 0 rgba(32, 33, 36, 0.1);
    }

    .duration-display {
      display: grid;
      place-items: center;
      width: min(84vmin, 680px);
      aspect-ratio: 1;
      position: relative;
      color: var(--number-color);
    }

    .duration-progress {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;

      fill: none;
      stroke-width: 14;

    .duration-progress-track {
      stroke: #eee8dc;
    }

      stroke: var(--number-color);
      stroke-linecap: round;
      stroke-dasharray: 100 100;
      stroke-dashoffset: 100;
      transition: stroke-dashoffset 140ms linear, stroke 180ms linear;
    }

      width: min(62vmin, 500px);
      display: grid;
      place-items: center;
      position: relative;
      z-index: 1;
      container-type: inline-size;
    }

    .big-text {
      font-family: "ToddlerLatinGreek", ui-rounded, "SF Pro Rounded", "Avenir Next Rounded", system-ui, sans-serif;

      line-height: 0.9;
      text-align: center;
      letter-spacing: 0;
      word-break: break-word;
      color: var(--number-color);
    }

    .single-line-text {
      display: block;
      max-width: 100%;
      font-size: min(clamp(5rem, 24vw, 18rem), calc(86cqi / var(--characters)));
      white-space: nowrap;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .script-stack {
      display: grid;
      place-items: center;
      gap: clamp(0.35rem, 2.6cqi, 1.25rem);
      max-width: 100%;
      color: var(--number-color);
    }

    .script-stack .single-line-text {
      font-size: min(clamp(4.5rem, 22vw, 17rem), calc(78cqi / var(--characters)));
      line-height: 1.08;
    }

    .script-name {
      max-width: 100%;
      font-family: "ToddlerLatinGreek", ui-rounded, "SF Pro Rounded", "Avenir Next Rounded", system-ui, sans-serif;
      font-size: min(clamp(1.15rem, 4.8vw, 2.4rem), calc(86cqi / var(--name-characters)));
      font-weight: 900;
      line-height: 1.2;
      margin-top: clamp(0.2rem, 1.5cqi, 0.75rem);
      letter-spacing: 0;
      text-align: center;
      color: currentColor;
      white-space: nowrap;
    }

    .script-marker {
      display: grid;
      place-items: center;
      color: currentColor;
      line-height: 0;
    }

    .script-marker svg {
      width: min(24cqi, 5.8rem);
      height: auto;
      display: block;
      overflow: visible;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;

      font-family: "ToddlerHebrew", "Arial Hebrew", system-ui, sans-serif;
      direction: rtl;
    }

    .chinese-text {

      justify-content: center;

      height: 100%;

      place-items: center;

      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

      display: none;
    }

      height: 14px;
      background: rgba(255, 255, 255, 0.48);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
      grid-column: 1 / -1;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #fff;
      transition: width 0.16s linear;
    }

      margin-top: 16px;
    }

      display: block;
    }

      display: grid;

      margin-top: 12px;
    }

    }

    function saveState() {
      const state = {
        mode: app.mode,
        maxNumber: app.maxNumber,
        totalDuration: app.totalDuration,
        current: app.current,
        previewNumber: app.previewNumber,
        representation: app.representation,
        blockDurations: app.blockDurations,
        view: app.view
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {
        // Storage can be unavailable in some locked-down browser contexts.
      }
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (!saved || typeof saved !== "object") return;
        if (saved.mode === "integer" || saved.mode === "duration") app.mode = saved.mode;
        if (Number.isFinite(saved.maxNumber)) app.maxNumber = clamp(Math.round(saved.maxNumber), 0, 200);
        if (Number.isFinite(saved.totalDuration)) app.totalDuration = clamp(Math.round(saved.totalDuration), minimumDurationForMax(), 300);
        if (Number.isFinite(saved.current)) app.current = clamp(Math.round(saved.current), 0, app.maxNumber);
        if (Number.isFinite(saved.previewNumber)) app.previewNumber = clamp(Math.round(saved.previewNumber), 0, 200);
        if (representations.some(rep => rep.id === saved.representation)) app.representation = saved.representation;
        if (Array.isArray(saved.blockDurations)) {
          app.blockDurations = saved.blockDurations
            .map(value => Math.max(1, Math.round(Number(value))))
            .filter(Number.isFinite);
        }
        if (saved.view === "settings" || saved.view === "display") app.view = saved.view;
      } catch {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function blocksForMax(max) {
      return Math.max(1, Math.ceil((max + 1) / 10));
    }

    function numbersInBlock(index) {
      const start = index * 10;
      const end = Math.min(start + 9, app.maxNumber);
      return Math.max(0, end - start + 1);
    }

    function minimumDurationForMax(max = app.maxNumber) {
      return blocksForMax(max);
    }

    function distributeDuration(total) {
      const blocks = blocksForMax(app.maxNumber);
      const minTotal = minimumDurationForMax();
      const duration = clamp(Math.round(total), minTotal, 300);
      const totalNumbers = app.maxNumber + 1;
      const raw = Array.from({ length: blocks }, (_, index) => duration * numbersInBlock(index) / totalNumbers);
      const base = raw.map(value => Math.max(1, Math.floor(value)));
      let remaining = duration - base.reduce((sum, value) => sum + value, 0);
      raw
        .map((value, index) => ({ index, fraction: value - Math.floor(value) }))
        .sort((a, b) => b.fraction - a.fraction)
        .forEach(item => {
          if (remaining <= 0) return;
          base[item.index] += 1;
          remaining -= 1;
        });
      return base;
    }

    function normalizeDurations() {
      const blocks = blocksForMax(app.maxNumber);
      app.totalDuration = clamp(Math.round(app.totalDuration), minimumDurationForMax(), 300);
      if (app.blockDurations.length !== blocks || totalAllocated() !== app.totalDuration) {
        app.blockDurations = distributeDuration(app.totalDuration);
        return;
      }
      app.blockDurations = app.blockDurations.map(value => Math.max(1, Math.round(value)));
    }

    function totalAllocated() {
      return app.blockDurations.reduce((sum, value) => sum + value, 0);
    }

    function numberToChinese(number) {
      if (number <= 10) return chineseNumerals[number];
      if (number < 20) return "十" + (number % 10 ? chineseDigits[number % 10] : "");
      if (number < 100) {
        const tens = Math.floor(number / 10);
        const ones = number % 10;
        return chineseDigits[tens] + "十" + (ones ? chineseDigits[ones] : "");
      }
      const hundreds = Math.floor(number / 100);
      const rest = number % 100;
      return chineseDigits[hundreds] + "百" + (rest ? (rest < 10 ? "零" : "") + numberToChinese(rest) : "");
    }

    function alphabeticLabel(number, alphabet) {
      let value = Math.max(0, Math.floor(number));
      let label = "";
      do {
        label = alphabet[value % alphabet.length] + label;
        value = Math.floor(value / alphabet.length) - 1;
      } while (value >= 0);
      return label;
    }

    function alphabeticIndexes(number, alphabet) {
      let value = Math.max(0, Math.floor(number));
      const indexes = [];
      do {
        indexes.unshift(value % alphabet.length);
        value = Math.floor(value / alphabet.length) - 1;
      } while (value >= 0);
      return indexes;
    }

    function alphabeticName(number, rep) {
      return alphabeticIndexes(number, alphabets[rep])
        .map(index => alphabetNames[rep][index])
        .join(" ");
    }

    function singleLineText(text, className = "") {
      return `<span class="big-text single-line-text ${className}" style="--characters:${text.length}">${escapeHtml(text)}</span>`;
    }

    function markedText(text, className, marker, name = "") {
      const nameLabel = name
        ? `<span class="script-name" style="--name-characters:${name.length}">${escapeHtml(name)}</span>`
        : "";
      return `<span class="script-stack">${marker}${singleLineText(text, className)}${nameLabel}</span>`;
    }

    function tallySvg(number) {
      if (number <= 0) {
        return `<span class="big-text">0</span>`;
      }
      const marks = [];
      const localTop = 14;
      const localBottom = 100;
      const stickGap = 18;
      const groupGap = 36;
      const strokeWidth = 7;
      const pad = strokeWidth;
      const originX = stickGap + pad;
      const groups = Math.ceil(number / 5);
      const groupWidth = stickGap * 3 + groupGap;
      const groupsPerColumnBand = 10;
      const groupsPerRowInBand = 2;
      const bandGap = 46;
      const bands = Math.ceil(groups / groupsPerColumnBand);
      const rows = Math.min(5, Math.ceil(groups / groupsPerRowInBand));
      const rowHeight = 126;
      let minX = Infinity;
      let maxX = -Infinity;
      let minY = Infinity;
      let maxY = -Infinity;
      for (let i = 0; i < number; i += 1) {
        const group = Math.floor(i / 5);
        const inGroup = i % 5;
        const band = Math.floor(group / groupsPerColumnBand);
        const groupInBand = group % groupsPerColumnBand;
        const row = Math.floor(groupInBand / groupsPerRowInBand);
        const col = groupInBand % groupsPerRowInBand;
        const bandWidth = groupsPerRowInBand * groupWidth - groupGap;
        const firstX = originX + band * (bandWidth + bandGap) + col * groupWidth;
        const top = row * rowHeight + localTop;
        const bottom = row * rowHeight + localBottom;
        const x = firstX + inGroup * stickGap;
        if (inGroup === 4) {
          const x1 = firstX - stickGap;
          const x2 = firstX + stickGap * 4;
          minX = Math.min(minX, x1, x2);
          maxX = Math.max(maxX, x1, x2);
          minY = Math.min(minY, top, bottom);
          maxY = Math.max(maxY, top, bottom);
          marks.push(`<line x1="${x1}" y1="${bottom}" x2="${x2}" y2="${top}" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round"/>`);
        } else {
          minX = Math.min(minX, x);
          maxX = Math.max(maxX, x);
          minY = Math.min(minY, top, bottom);
          maxY = Math.max(maxY, top, bottom);
          marks.push(`<line x1="${x}" y1="${top}" x2="${x}" y2="${bottom}" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round"/>`);
        }
      }
      const viewX = minX - pad;
      const viewY = minY - pad;
      const width = maxX - minX + pad * 2;
      const height = maxY - minY + pad * 2;
      return `<span class="big-art tally-art"><svg viewBox="${viewX} ${viewY} ${width} ${height}" aria-hidden="true">${marks.join("")}</svg></span>`;
    }

    function handSvg(number) {
      const count = number <= 0 ? 0 : number % 10 === 0 ? 10 : number % 10;
      const left = count > 5 ? count - 5 : 0;
      const right = Math.min(5, count);
      const baseline = 162;
      const sourceBaseline = 153.45;
      const handPath = (index, anchorX, mirror = false) => {
        const sourceAnchor = fingerAnchors[index];
        const transform = mirror
          ? `translate(${anchorX} ${baseline}) scale(-1 1) translate(${-sourceAnchor} ${-sourceBaseline})`
          : `translate(${anchorX - sourceAnchor} ${baseline - sourceBaseline})`;
        return `<path d="${fingerPaths[index]}" transform="${transform}" fill="var(--number-fill)" stroke="#202124" stroke-width="3" stroke-linejoin="round"/>`;
      };
      const leftHand = count > 5 ? handPath(left, 80) : "";
      const rightAnchor = count > 5 ? 180 : 130;
      return `<span class="big-art"><svg viewBox="0 0 260 170" aria-hidden="true">
        ${leftHand}
        ${handPath(right, rightAnchor, true)}
      </svg></span>`;
    }

    function sorobanColumnCount() {
      return Math.max(1, Math.ceil(Math.log10(Math.max(2, app.maxNumber + 1))));
    }

    function sorobanBead(cx, cy, active) {
      return `<ellipse cx="${cx}" cy="${cy}" rx="27" ry="14" fill="${active ? "var(--number-color)" : "#eadfcf"}" stroke="#202124" stroke-width="3"/>`;
    }

    function sorobanSvg(number) {
      const columns = sorobanColumnCount();
      const value = String(number).padStart(columns, "0").slice(-columns);
      const rods = value.split("").map(Number);
      const beadRx = 27;
      const rodGap = beadRx * 2;
      const sideMargin = beadRx;
      const frameMargin = beadRx / 2;
      const frameX = -frameMargin;
      const frameStroke = 5;
      const width = sideMargin * 2 + Math.max(0, rods.length - 1) * rodGap;
      const frameWidth = width + frameMargin * 2;
      const viewPad = frameStroke / 2;
      const beadStep = 28;
      const beadRy = 14;
      const frameTop = 12;
      const heavenRestY = frameTop + beadRy;
      const heavenActiveY = heavenRestY + beadStep;
      const barY = heavenActiveY + beadRy;
      const earthActiveStartY = barY + beadRy;
      const earthRestStartY = earthActiveStartY + beadStep;
      const frameBottom = frameTop + beadStep * 7;
      const pieces = rods.map((digit, index) => {
        const x = sideMargin + index * rodGap;
        const heavenActive = digit >= 5;
        const earth = digit % 5;
        const earthBeads = Array.from({ length: 4 }, (_, beadIndex) => {
          const active = beadIndex < earth;
          const cy = active
            ? earthActiveStartY + beadIndex * beadStep
            : earthRestStartY + beadIndex * beadStep;
          return sorobanBead(x, cy, active);
        }).join("");
        return `<g>
          <line x1="${x}" y1="${frameTop}" x2="${x}" y2="${frameBottom}" stroke="#202124" stroke-width="4" stroke-linecap="round"/>
          ${sorobanBead(x, heavenActive ? heavenActiveY : heavenRestY, heavenActive)}
          ${earthBeads}
        </g>`;
      }).join("");
      return `<span class="big-art"><svg viewBox="${frameX - viewPad} 0 ${frameWidth + viewPad * 2} ${frameBottom + frameTop}" aria-hidden="true">
        <rect x="${frameX}" y="${frameTop}" width="${frameWidth}" height="${frameBottom - frameTop}" rx="14" fill="#fff8ea" stroke="#202124" stroke-width="${frameStroke}"/>
        <line x1="${frameX}" y1="${barY}" x2="${frameX + frameWidth}" y2="${barY}" stroke="#202124" stroke-width="7" stroke-linecap="round"/>
        ${pieces}
      </svg></span>`;
    }

    function binaryCells(number) {
      const bitCount = Math.max(1, Math.ceil(Math.log2(app.maxNumber + 1)));
      const bits = number.toString(2).padStart(bitCount, "0").slice(-bitCount);
      const cells = [...bits].map(bit => `<span class="binary-cell${bit === "1" ? " on" : ""}"></span>`).join("");
      return `<span class="binary-cells" aria-label="${bits} in binary">${cells}</span>`;
    }

    function renderRepresentation(number, rep = app.representation) {
      if (rep === "arabic") return `<span class="big-text latin-text">${number}</span>`;
      if (rep === "chinese") {
        return singleLineText(numberToChinese(number), "chinese-text");
      }
      if (alphabets[rep]) {
        const text = alphabeticLabel(number, alphabets[rep]);
        const className = rep === "hebrew" ? "hebrew-text" : rep === "arabicAlphabet" ? "arabic-text" : rep.startsWith("cyrillic") ? "cyrillic-text" : rep.startsWith("greek") ? "greek-text" : "latin-text";
        if (rep === "hebrew") return markedText(text, className, menorahMarker(), alphabeticName(number, rep));
        if (rep.startsWith("greek")) return markedText(text, className, parthenonMarker(), alphabeticName(number, rep));
        if (rep === "arabicAlphabet" || rep.startsWith("cyrillic")) return markedText(text, className, "", alphabeticName(number, rep));
        return singleLineText(text, className);
      }
      if (rep === "binary") return binaryCells(number);
      if (rep === "fingers") return handSvg(number);
      if (rep === "tally") return tallySvg(number);
      return sorobanSvg(number);
    }

    function renderPager() {
      pager.innerHTML = "";
      app.pagerLayers = Array.from({ length: 3 }, () => {
        const layer = document.createElement("div");
        layer.className = "pager-layer";
        pager.appendChild(layer);
        return layer;
      });
      layoutPager(currentRepresentationIndex(), 0);
    }

    function wrapIndex(index) {
      const length = representations.length;
      return ((index % length) + length) % length;
    }

    function currentRepresentationIndex() {
      return Math.max(0, representations.findIndex(rep => rep.id === app.representation));
    }

    function layoutPager(index, dy = 0) {
      if (!app.pagerLayers.length) return;
      const h = pager.clientHeight || 88;
      const center = wrapIndex(index);
      const indices = [wrapIndex(center - 1), center, wrapIndex(center + 1)];
      app.pagerLayers.forEach((layer, layerIndex) => {
        const rep = representations[indices[layerIndex]];
        layer.textContent = rep.name;
        layer.dataset.rep = rep.id;
      });
      app.pagerLayers[0].style.transform = `translate3d(0,${dy - h}px,0)`;
      app.pagerLayers[1].style.transform = `translate3d(0,${dy}px,0)`;
      app.pagerLayers[2].style.transform = `translate3d(0,${dy + h}px,0)`;
    }

    function setPagerTransition(value) {
      app.pagerLayers.forEach(layer => {
        layer.style.transition = value;
      });
    }

    function commitRepresentationIndex(index) {
      const rep = representations[wrapIndex(index)];
      app.representation = rep.id;
      setPagerTransition("none");
      layoutPager(wrapIndex(index), 0);
      renderRepresentationPreview();
      saveState();
    }

    function animatePagerTo(startIndex, targetDy, commitIndex) {
      if (app.pagerSnapTimer) clearTimeout(app.pagerSnapTimer);
      setPagerTransition("transform 100ms ease-out");
      layoutPager(startIndex, targetDy);
      app.pagerSnapTimer = window.setTimeout(() => {
        app.pagerSnapTimer = null;
        commitRepresentationIndex(commitIndex);
      }, 100);
    }

    function setMode(mode) {
      app.mode = mode;
      document.querySelectorAll(".segmented button").forEach(button => {
        button.classList.toggle("active", button.dataset.mode === mode);
      });
      document.querySelector("#durationField").style.display = mode === "duration" ? "grid" : "none";
      document.querySelector("#sliderWrap").classList.toggle("active", mode === "duration");
      renderSlider();
      saveState();
    }

    function polarToCartesian(cx, cy, radius, angle) {
      const radians = (angle - 90) * Math.PI / 180;
      return {
        x: cx + radius * Math.cos(radians),
        y: cy + radius * Math.sin(radians)
      };
    }

    function arcPath(cx, cy, radius, startAngle, endAngle) {
      if (endAngle - startAngle >= 359.99) {
        const start = polarToCartesian(cx, cy, radius, 0);
        const mid = polarToCartesian(cx, cy, radius, 180);
        return `M ${start.x} ${start.y} A ${radius} ${radius} 0 1 1 ${mid.x} ${mid.y} A ${radius} ${radius} 0 1 1 ${start.x} ${start.y}`;
      }
      const start = polarToCartesian(cx, cy, radius, startAngle);
      const end = polarToCartesian(cx, cy, radius, endAngle);
      const largeArc = endAngle - startAngle > 180 ? 1 : 0;
      return `M ${start.x} ${start.y} A ${radius} ${radius} 0 ${largeArc} 1 ${end.x} ${end.y}`;
    }

    function cumulativeDurations() {
      let sum = 0;
      return app.blockDurations.map(seconds => {
        sum += seconds;
        return sum;
      });
    }

    function renderSlider() {
      normalizeDurations();
      const blocks = blocksForMax(app.maxNumber);
      const cx = 260;
      const cy = 260;
      const radius = 166;
      const total = app.totalDuration;
      let startAngle = 0;
      const segments = app.blockDurations.map((seconds, index) => {
        const endAngle = startAngle + (seconds / total) * 360;
        const path = `<path class="segment" d="${arcPath(cx, cy, radius, startAngle, endAngle)}" stroke="${colors[index % colors.length]}" opacity="0.9"/>`;
        startAngle = endAngle;
        return path;
      }).join("");
      const boundaries = cumulativeDurations();
      const handles = boundaries.slice(0, -1).map((seconds, index) => {
        const angle = (seconds / total) * 360;
        const point = polarToCartesian(cx, cy, radius, angle);
        const boundaryNumber = (index + 1) * 10;
        return `<g class="handle" data-index="${index}">
          <circle cx="${point.x}" cy="${point.y}" r="22" fill="#fff" stroke="${colors[index % colors.length]}" stroke-width="7"/>
          <text x="${point.x}" y="${point.y + 5}" text-anchor="middle">${boundaryNumber}</text>
        </g>`;
      }).join("");
      slider.innerHTML = `
        <circle class="rail" cx="${cx}" cy="${cy}" r="${radius}"/>
        ${segments}
        ${handles}
        <text class="center-label" x="${cx}" y="${cy - 6}" text-anchor="middle">${total}s</text>
        <text class="center-sub" x="${cx}" y="${cy + 24}" text-anchor="middle">fixed total</text>
      `;
      renderAllocationList();
    }

    function updateValueDisplays() {
      const maxDial = document.querySelector("#maxNumberInput");
      const durationDial = document.querySelector("#totalDurationInput");
      const previewDial = document.querySelector("#previewNumberInput");
      const minDuration = minimumDurationForMax();
      durationDial.dataset.min = minDuration;
      durationDial.setAttribute("aria-valuemin", minDuration);
      maxDial.textContent = app.maxNumber;
      durationDial.textContent = `${app.totalDuration}s`;
      previewDial.textContent = app.previewNumber;
      maxDial.setAttribute("aria-valuenow", app.maxNumber);
      durationDial.setAttribute("aria-valuenow", app.totalDuration);
      previewDial.setAttribute("aria-valuenow", app.previewNumber);
    }

    function dialMeta(dial) {
      return {
        min: Number(dial.dataset.min),
        max: Number(dial.dataset.max),
        step: Number(dial.dataset.step),
        key: dial.dataset.key
      };
    }

    function setDialValue(dial, value) {
      const { min, max, step, key } = dialMeta(dial);
      const next = clamp(Math.round(value / step) * step, min, max);
      if (key === "maxNumber") app.maxNumber = next;
      if (key === "totalDuration") app.totalDuration = next;
      if (key === "previewNumber") app.previewNumber = next;
      applyDialChange(key);
    }

    function applyDialChange(key) {
      app.maxNumber = clamp(app.maxNumber, 0, 200);
      app.totalDuration = clamp(Math.round(app.totalDuration), minimumDurationForMax(), 300);
      app.current = clamp(app.current, 0, app.maxNumber);
      app.previewNumber = clamp(app.previewNumber, 0, 200);
      if (key === "maxNumber" || key === "totalDuration") {
        app.blockDurations = distributeDuration(app.totalDuration);
      }
      updateValueDisplays();
      renderSlider();
      renderCount();
      renderRepresentationPreview();
      saveState();
    }

    function renderAllocationList() {
      const list = document.querySelector("#allocationList");
      const blocks = blocksForMax(app.maxNumber);
      const maxDuration = Math.max(...app.blockDurations, 10);
      list.innerHTML = Array.from({ length: blocks }, (_, index) => {
        const start = index * 10;
        const end = Math.min(start + 9, app.maxNumber);
        const seconds = app.blockDurations[index];
        return `<div class="allocation-row">
          <span>${start}-${end}</span>
          <span class="mini-bar"><span style="width:${(seconds / maxDuration) * 100}%"></span></span>
          <span>${seconds}s</span>
        </div>`;
      }).join("");
      updateValueDisplays();
      saveState();
    }

    function handleSliderPoint(event) {
      if (app.draggingHandle === null) return;
      const box = slider.getBoundingClientRect();
      const x = ((event.clientX - box.left) / box.width) * 520;
      const y = ((event.clientY - box.top) / box.height) * 520;
      const angle = (Math.atan2(y - 260, x - 260) * 180 / Math.PI + 450) % 360;
      const desiredBoundary = Math.round((angle / 360) * app.totalDuration);
      const boundaries = cumulativeDurations();
      const index = app.draggingHandle;
      const lower = index === 0 ? 1 : boundaries[index - 1] + 1;
      const upper = index + 1 >= app.blockDurations.length - 1
        ? app.totalDuration - 1
        : boundaries[index + 1] - 1;
      const boundary = clamp(desiredBoundary, lower, upper);
      const previousBoundary = index === 0 ? 0 : boundaries[index - 1];
      const nextBoundary = index + 1 >= app.blockDurations.length - 1
        ? app.totalDuration
        : boundaries[index + 1];
      app.blockDurations[index] = boundary - previousBoundary;
      app.blockDurations[index + 1] = nextBoundary - boundary;
      renderSlider();
      saveState();
    }

    function saveInputs() {
      app.maxNumber = clamp(app.maxNumber, 0, 200);
      app.totalDuration = clamp(Math.round(app.totalDuration), minimumDurationForMax(), 300);
      updateValueDisplays();
      renderSlider();
      app.current = clamp(app.current, 0, app.maxNumber);
      app.previewNumber = clamp(app.previewNumber, 0, 200);
      renderRepresentationPreview();
      saveState();
    }

    function blockDurationForNumber(number) {
      const block = clamp(Math.floor(number / 10), 0, app.blockDurations.length - 1);
      const start = block * 10;
      const end = Math.min(start + 9, app.maxNumber);
      const numbersInBlock = Math.max(1, end - start + 1);
      return app.blockDurations[block] / numbersInBlock;
    }

    function numberHue(number, rep = app.representation) {
      if (alphabets[rep]) {
        const position = ((number % alphabets[rep].length) + alphabets[rep].length) % alphabets[rep].length;
        return 29 + (position % 10) * 36;
      }
      const digit = ((number % 10) + 10) % 10;
      return 29 + digit * 36;
    }

    function applyNumberColor(number) {
      const hue = numberHue(number);
      countButton.style.setProperty("--number-hue", hue);
      countButton.style.setProperty("--number-color", `oklch(42% 0.2 ${hue})`);
      countButton.style.setProperty("--number-fill", `oklch(76% 0.18 ${hue})`);
    }

    function applyPreviewColor(number) {
      const hue = numberHue(number);
      representationPreview.style.setProperty("--number-hue", hue);
      representationPreview.style.setProperty("--number-color", `oklch(42% 0.2 ${hue})`);
      representationPreview.style.setProperty("--number-fill", `oklch(76% 0.18 ${hue})`);
    }

    function renderRepresentationPreview() {
      if (!representationPreview) return;
      applyPreviewColor(app.previewNumber);
      representationPreview.innerHTML = renderRepresentation(app.previewNumber);
    }

    function updateDurationProgress(progress) {
      const fill = document.querySelector("#durationProgressFill");
      if (!fill) return;
      const percent = clamp(progress, 0, 1) * 100;
      fill.style.strokeDashoffset = String(100 - percent);
    }

    function renderCount() {
      const content = renderRepresentation(app.current);
      applyNumberColor(app.current);
      countDisplay.innerHTML = app.mode === "integer"
        ? `<span class="round-number-button">${content}</span>`
        : `<span class="duration-display">
            <svg class="duration-progress" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="duration-progress-track" cx="60" cy="60" r="52" pathLength="100"></circle>
              <circle class="duration-progress-fill" id="durationProgressFill" cx="60" cy="60" r="52" pathLength="100"></circle>
            </svg>
            <span class="duration-content">${content}</span>
          </span>`;
      document.querySelector("#promptText").textContent = app.mode === "duration" ? "Watch and say it" : "Say it, then press";
      document.querySelector("#progressFill").style.width = `${clamp(app.current / Math.max(1, app.maxNumber), 0, 1) * 100}%`;
      if (app.mode === "duration") updateDurationProgress(0);
      saveState();
    }

    function advanceCount() {
      if (app.current >= app.maxNumber) {
        stopTimer();
        document.querySelector("#promptText").textContent = "All done";
        document.querySelector("#timerText").textContent = "";
        document.querySelector("#progressFill").style.width = "100%";
        return;
      }
      app.current += 1;
      renderCount();
    }

    function backtrackCount() {
      if (app.current <= 0) return;
      app.current -= 1;
      renderCount();
    }

    function pointerDistance(points) {
      const [first, second] = points;
      return Math.hypot(first.x - second.x, first.y - second.y);
    }

    function resetCountGesture() {
      app.activeCountPointers.clear();
      app.pinchStartDistance = null;
      app.pinchBacktracked = false;
    }

    function stopTimer() {
      if (app.timerId) window.clearInterval(app.timerId);
      app.timerId = null;
    }

    function startDurationTimer() {
      stopTimer();
      app.startTime = performance.now();
      app.currentStartedAt = app.startTime;
      app.nextAt = app.startTime + blockDurationForNumber(app.current) * 1000;
      updateDurationProgress(0);
      app.timerId = window.setInterval(() => {
        const now = performance.now();
        const remaining = Math.max(0, (app.nextAt - now) / 1000);
        const numeralDuration = blockDurationForNumber(app.current);
        const elapsedForNumeral = Math.max(0, (now - app.currentStartedAt) / 1000);
        updateDurationProgress(elapsedForNumeral / Math.max(0.001, numeralDuration));
        document.querySelector("#timerText").textContent = `${Math.ceil(remaining)}s`;
        if (now >= app.nextAt) {
          if (app.current >= app.maxNumber) {
            updateDurationProgress(1);
            advanceCount();
            return;
          }
          advanceCount();
          app.currentStartedAt = now;
          updateDurationProgress(0);
          app.nextAt = now + blockDurationForNumber(app.current) * 1000;
        }
      }, 120);
    }

    function startCounting() {
      saveInputs();
      app.current = 0;
      showCount();
    }

    function showCount() {
      saveInputs();
      app.current = clamp(app.current, 0, app.maxNumber);
      settingsView.classList.remove("active");
      countView.classList.add("active");
      document.body.classList.add("counting");
      app.view = "display";
      renderCount();
      if (app.mode === "duration") startDurationTimer();
      else stopTimer();
    }

    function showSettings() {
      stopTimer();
      countView.classList.remove("active");
      settingsView.classList.add("active");
      document.body.classList.remove("counting");
      app.view = "settings";
      saveState();
      requestAnimationFrame(() => {
        layoutPager(currentRepresentationIndex(), 0);
      });
    }

    function nudgeDisplayedCount(delta) {
      if (!countView.classList.contains("active")) return;
      if (app.mode === "duration") stopTimer();
      app.current = clamp(app.current + delta, 0, app.maxNumber);
      renderCount();
    }

    document.addEventListener("keydown", event => {
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      const key = event.key.toLowerCase();
      if (key === "t") {
        event.preventDefault();
        if (settingsView.classList.contains("active")) showCount();
        else showSettings();
        return;
      }
      if (!countView.classList.contains("active")) return;
      if (["arrowup", "arrowright", "w", "d"].includes(key)) {
        event.preventDefault();
        nudgeDisplayedCount(1);
      }
      if (["arrowdown", "arrowleft", "a", "s"].includes(key)) {
        event.preventDefault();
        nudgeDisplayedCount(-1);
      }
    });

    document.querySelector("#settingsButton").addEventListener("click", () => {
      if (settingsView.classList.contains("active")) showCount();
      else showSettings();
    });

    document.querySelector("#decrementButton").addEventListener("click", event => {
      event.stopPropagation();
      nudgeDisplayedCount(-1);
    });

    document.querySelector("#startButton").addEventListener("click", startCounting);

    countButton.addEventListener("click", event => {
      if (app.suppressNextCountClick) {
        event.preventDefault();
        app.suppressNextCountClick = false;
        return;
      }
      if (app.mode === "integer") advanceCount();
    });

    countButton.addEventListener("pointerdown", event => {
      if (app.mode !== "integer") return;
      app.activeCountPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      countButton.setPointerCapture(event.pointerId);
      if (app.activeCountPointers.size === 2) {
        app.pinchStartDistance = pointerDistance([...app.activeCountPointers.values()]);
        app.pinchBacktracked = false;
      }
    });

    countButton.addEventListener("pointermove", event => {
      if (app.mode !== "integer" || !app.activeCountPointers.has(event.pointerId)) return;
      app.activeCountPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (app.activeCountPointers.size !== 2 || app.pinchStartDistance === null || app.pinchBacktracked) return;
      const distance = pointerDistance([...app.activeCountPointers.values()]);
      if (app.pinchStartDistance - distance >= 44) {
        backtrackCount();
        app.pinchBacktracked = true;
        app.suppressNextCountClick = true;
      }
    });

    countButton.addEventListener("pointerup", event => {
      app.activeCountPointers.delete(event.pointerId);
      if (app.activeCountPointers.size < 2) {
        app.pinchStartDistance = null;
        app.pinchBacktracked = false;
      }
    });

    countButton.addEventListener("pointercancel", resetCountGesture);

    document.querySelectorAll(".segmented button").forEach(button => {
      button.addEventListener("click", () => setMode(button.dataset.mode));
    });

    document.querySelectorAll(".value-dial").forEach(dial => {
      dial.addEventListener("pointerdown", event => {
        const { key, step } = dialMeta(dial);
        app.valueDialDrag = {
          pointerId: event.pointerId,
          startY: event.clientY,
          startValue: key === "maxNumber" ? app.maxNumber : key === "totalDuration" ? app.totalDuration : app.previewNumber,
          step
        };
        dial.classList.add("dragging");
        dial.setPointerCapture(event.pointerId);
      });

      dial.addEventListener("pointermove", event => {
        if (!app.valueDialDrag || app.valueDialDrag.pointerId !== event.pointerId) return;
        const deltaSteps = Math.round((app.valueDialDrag.startY - event.clientY) / 8);
        setDialValue(dial, app.valueDialDrag.startValue + deltaSteps * app.valueDialDrag.step);
      });

      dial.addEventListener("pointerup", event => {
        if (!app.valueDialDrag || app.valueDialDrag.pointerId !== event.pointerId) return;
        app.valueDialDrag = null;
        dial.classList.remove("dragging");
      });

      dial.addEventListener("pointercancel", () => {
        app.valueDialDrag = null;
        dial.classList.remove("dragging");
      });

      dial.addEventListener("keydown", event => {
        const { step, key } = dialMeta(dial);
        const currentValue = key === "maxNumber" ? app.maxNumber : key === "totalDuration" ? app.totalDuration : app.previewNumber;
        if (event.key === "ArrowDown") {
          event.preventDefault();
          setDialValue(dial, currentValue - step);
        }
        if (event.key === "ArrowUp") {
          event.preventDefault();
          setDialValue(dial, currentValue + step);
        }
      });
    });

    slider.addEventListener("pointerdown", event => {
      const handle = event.target.closest(".handle");
      if (!handle) return;
      app.draggingHandle = Number(handle.dataset.index);
      slider.setPointerCapture(event.pointerId);
      handleSliderPoint(event);
    });

    slider.addEventListener("pointermove", handleSliderPoint);
    slider.addEventListener("pointerup", () => {
      app.draggingHandle = null;
    });

    slider.addEventListener("pointercancel", () => {
      app.draggingHandle = null;
    });

    pager.addEventListener("pointerdown", event => {
      if (app.pagerSnapTimer) clearTimeout(app.pagerSnapTimer);
      setPagerTransition("none");
      app.pagerDrag = {
        pointerId: event.pointerId,
        startY: event.clientY,
        dragIndex: currentRepresentationIndex(),
        moved: false
      };
      pager.classList.add("dragging");
      pager.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    pager.addEventListener("pointermove", event => {
      if (!app.pagerDrag || app.pagerDrag.pointerId !== event.pointerId) return;
      const h = pager.clientHeight || 88;
      let dy = event.clientY - app.pagerDrag.startY;
      if (Math.abs(dy) > 3) app.pagerDrag.moved = true;
      while (dy <= -h) {
        app.pagerDrag.dragIndex = wrapIndex(app.pagerDrag.dragIndex + 1);
        app.pagerDrag.startY -= h;
        dy += h;
      }
      while (dy >= h) {
        app.pagerDrag.dragIndex = wrapIndex(app.pagerDrag.dragIndex - 1);
        app.pagerDrag.startY += h;
        dy -= h;
      }
      layoutPager(app.pagerDrag.dragIndex, Math.abs(dy) >= 8 ? dy : 0);
      event.preventDefault();
    });

    pager.addEventListener("pointerup", event => {
      if (!app.pagerDrag || app.pagerDrag.pointerId !== event.pointerId) return;
      const h = pager.clientHeight || 88;
      const dy = event.clientY - app.pagerDrag.startY;
      const threshold = h * 0.25;
      let commitIndex = app.pagerDrag.dragIndex;
      let targetDy = 0;
      if (Math.abs(dy) > threshold) {
        if (dy < 0) {
          commitIndex = wrapIndex(app.pagerDrag.dragIndex + 1);
          targetDy = -h;
        } else {
          commitIndex = wrapIndex(app.pagerDrag.dragIndex - 1);
          targetDy = h;
        }
      } else if (!app.pagerDrag.moved) {
        commitIndex = wrapIndex(app.pagerDrag.dragIndex + 1);
        targetDy = -h;
      }
      const dragIndex = app.pagerDrag.dragIndex;
      app.pagerDrag = null;
      pager.classList.remove("dragging");
      if (pager.hasPointerCapture && pager.hasPointerCapture(event.pointerId)) {
        pager.releasePointerCapture(event.pointerId);
      }
      animatePagerTo(dragIndex, targetDy, commitIndex);
      event.preventDefault();
    });

    pager.addEventListener("pointercancel", event => {
      const dragIndex = app.pagerDrag?.dragIndex ?? currentRepresentationIndex();
      app.pagerDrag = null;
      pager.classList.remove("dragging");
      if (event && pager.hasPointerCapture && pager.hasPointerCapture(event.pointerId)) {
        pager.releasePointerCapture(event.pointerId);
      }
      animatePagerTo(dragIndex, 0, dragIndex);
    });

    pager.addEventListener("lostpointercapture", () => {
      if (!app.pagerDrag) return;
      const dragIndex = app.pagerDrag.dragIndex;
      app.pagerDrag = null;
      pager.classList.remove("dragging");
      animatePagerTo(dragIndex, 0, dragIndex);
    });

    pager.addEventListener("wheel", event => {
      event.preventDefault();
      if (app.pagerSnapTimer) clearTimeout(app.pagerSnapTimer);
      const index = currentRepresentationIndex();
      const nextIndex = wrapIndex(index + (event.deltaY > 0 ? 1 : -1));
      animatePagerTo(index, event.deltaY > 0 ? -(pager.clientHeight || 88) : (pager.clientHeight || 88), nextIndex);
    }, { passive: false });

    pager.addEventListener("click", event => {
      if (app.pagerDrag?.moved) {
        event.preventDefault();
        return;
      }
    });

    loadState();
    renderPager();
    setMode(app.mode);
    updateValueDisplays();
    renderRepresentationPreview();
    renderCount();
    if (app.view === "settings") showSettings();
    else showCount();
  </script>
</body>
</html>
