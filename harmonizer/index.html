<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151613">
  <title>Harmonizer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #151613;
      --stage: #12130f;
      --panel: #20221d;
      --bar: #191b17;
      --ink: #f2f0e8;
      --muted: #a8a59a;
      --line: rgba(242, 240, 232, 0.14);
      --cyan: #22d3c5;
      --green: #77d36a;
      --gold: #d8a84e;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(540px, 1fr) 286px;
    }
    .stage {
      min-width: 0;
      display: grid;
      grid-template-rows: 54px minmax(0, 1fr) 40px 92px;
      border-right: 1px solid var(--line);
    }
    .topbar, .statusbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    .statusbar {
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    h1 { margin: 0 4px 0 0; font-size: 18px; font-weight: 700; }
    .chip {
      min-width: 78px;
      max-width: 160px;
      overflow: hidden;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-overflow: ellipsis;
    }
    .chip.good { color: var(--cyan); }
    .command {
      min-height: 32px;
      padding: 5px 10px;
      border: 1px solid var(--cyan);
      border-radius: 6px;
      background: transparent;
      color: var(--cyan);
    }
    .topbar .command { margin-left: auto; }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: var(--stage);
      touch-action: none;
    }
    canvas.panning { cursor: ns-resize; }
    .view-controls { margin-left: auto; display: flex; gap: 7px; }
    .scrub-field {
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #151613;
    }
    .scrub-number {
      width: 64px;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      cursor: ew-resize;
      user-select: none;
    }
    .scrub-number:focus { color: var(--cyan); cursor: text; user-select: text; }
    .keyboard {
      position: relative;
      display: flex;
      height: 92px;
      overflow: hidden;
      background: #0d0e0c;
      border-top: 1px solid var(--line);
      padding: 0 10px 8px;
      touch-action: none;
    }
    .piano-key {
      position: relative;
      min-width: 0;
      padding: 0;
      border-radius: 0 0 4px 4px;
    }
    .piano-key.white {
      flex: 1 1 0;
      height: 82px;
      border: 1px solid #272923;
      background: #d8d4c8;
      z-index: 1;
    }
    .piano-key.black {
      width: 3.7%;
      height: 52px;
      margin: 0 -1.85%;
      border: 1px solid #090a08;
      background: #31332d;
      z-index: 2;
    }
    .piano-key.active { background: var(--green); }
    aside {
      min-width: 0;
      display: grid;
      grid-template-rows: 54px repeat(6, auto) minmax(0, 1fr);
      background: var(--panel);
    }
    .side-title {
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }
    .control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 54px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
    }
    .control.stacked { grid-template-columns: 1fr; }
    .control label { color: var(--muted); font-size: 13px; }
    .control .scrub-number {
      width: 76px;
      min-height: 28px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #151613;
    }
    select {
      width: 100%;
      min-width: 0;
      height: 32px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #151613;
      color: var(--ink);
      font-size: 13px;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .value { color: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; }
    .levels { display: grid; gap: 5px; }
    .level-row {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) 34px;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .level-track { height: 5px; overflow: hidden; border-radius: 3px; background: rgba(242,240,232,0.1); }
    .level-fill { width: 0; height: 100%; background: var(--cyan); }
    #output-level-fill { background: var(--green); }
    .toggle { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .toggle input { width: 17px; height: 17px; accent-color: var(--cyan); }
    .meter {
      align-self: end;
      padding: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-line;
      font-variant-numeric: tabular-nums;
    }
    .start-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: rgba(13, 14, 12, 0.92);
    }
    .start-overlay[hidden] { display: none; }
    .start-panel {
      width: min(420px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      text-align: center;
    }
    .start-panel h2 { margin: 0 0 8px; font-size: 22px; }
    .start-panel p { margin: 0 0 22px; color: var(--gold); font-size: 14px; }
    .start-panel .command { width: 100%; min-height: 42px; }
    @media (max-width: 860px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100%; grid-template-columns: 1fr; grid-template-rows: 620px auto; }
      .stage { border-right: 0; }
      aside { grid-template-rows: 48px repeat(6, auto) 120px; }
    }
    @media (max-width: 560px) {
      .app { grid-template-rows: 560px auto; }
      .stage { grid-template-rows: 54px minmax(0, 1fr) 40px 78px; }
      .topbar { gap: 6px; padding: 0 8px; }
      h1 { font-size: 16px; }
      #midi-chip { display: none; }
      .chip { min-width: 62px; max-width: 102px; padding: 5px 6px; }
      .statusbar { padding: 0 8px; gap: 6px; }
      .keyboard { height: 78px; padding-inline: 4px; }
      .piano-key.white { height: 70px; }
      .piano-key.black { height: 44px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="stage">
      <header class="topbar">
        <h1>Harmonizer</h1>
        <div id="pitch-chip" class="chip">pitch --</div>
        <div id="midi-chip" class="chip">notes 0</div>
        <div id="engine-chip" class="chip">stopped</div>
        <button id="start-button" class="command" type="button">Start audio</button>
        <button id="stop-button" class="command" type="button" hidden>Stop</button>
      </header>
      <canvas id="roll" aria-label="Live vocal and MIDI pitch roll"></canvas>
      <footer class="statusbar">
        <span id="rms-text">rms 0.0000</span>
        <span id="stable-text">unvoiced</span>
        <div class="view-controls">
          <input id="time-span" class="scrub-number scrub-field" type="text" inputmode="decimal" role="spinbutton" aria-label="Seconds across screen" title="Drag to change time span">
          <input id="pitch-span" class="scrub-number scrub-field" type="text" inputmode="decimal" role="spinbutton" aria-label="Semitones across screen" title="Drag to change pitch span">
        </div>
      </footer>
      <div id="keyboard" class="keyboard" aria-label="On-screen MIDI keyboard"></div>
    </section>
    <aside>
      <div class="side-title">Controls</div>
      <section class="control stacked">
        <div class="row"><label for="input-device">Input</label><span id="input-status" class="value">permission needed</span></div>
        <select id="input-device" aria-label="Microphone input"></select>
        <div class="levels" aria-label="Audio levels">
          <div class="level-row"><span>in</span><div class="level-track"><div id="input-level-fill" class="level-fill"></div></div><span id="input-level-text">-inf</span></div>
          <div class="level-row"><span>out</span><div class="level-track"><div id="output-level-fill" class="level-fill"></div></div><span id="output-level-text">-inf</span></div>
        </div>
        <button id="test-tone-button" class="command" type="button">Test output</button>
      </section>
      <section class="control"><label for="blend">Blend</label><input id="blend" class="scrub-number" type="text" inputmode="decimal" role="spinbutton"></section>
      <section class="control"><label for="gain">Monitor gain</label><input id="gain" class="scrub-number" type="text" inputmode="decimal" role="spinbutton"></section>
      <section class="control"><label for="gate">Gate</label><input id="gate" class="scrub-number" type="text" inputmode="decimal" role="spinbutton"></section>
      <section class="control"><label for="stability">Stability</label><input id="stability" class="scrub-number" type="text" inputmode="decimal" role="spinbutton"></section>
      <section class="control stacked">
        <label class="toggle"><input id="formants" type="checkbox" checked>Preserve formants</label>
        <div class="row"><span class="toggle">MIDI</span><span id="midi-status" class="value">pending</span></div>
      </section>
      <div id="meter" class="meter">engine stopped</div>
    </aside>
  </main>
  <div id="start-overlay" class="start-overlay">
    <div class="start-panel">
      <h2>Harmonizer</h2>
      <p>Use headphones to prevent microphone feedback.</p>
      <button id="start-overlay-button" class="command" type="button">Start audio</button>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
