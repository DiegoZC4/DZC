        wheelSvg.appendChild(overlayGroup);

        return { bounds, scoreBox };
      }

      function drawTetradGrids(NS, cx, cy) {
        {
          const cellSize = 72;
          const labelFontSize = Math.round(cellSize * 0.22);
          const slices = [
            { first: 1, xValues: [2, 3, 4, 5, 6], yValues: [3, 4, 5, 6, 7, 8] },
            { first: 2, xValues: [3, 4, 5, 6], yValues: [4, 5, 6, 7, 8] },
            { first: 3, xValues: [4, 5, 6], yValues: [5, 6, 7, 8, 9] },
          ];
          const rootStyles = window.getComputedStyle(document.documentElement);
          const appPad = parseFloat(rootStyles.getPropertyValue("--app-pad")) || 0;
          const closedSettingsHeight = parseFloat(rootStyles.getPropertyValue("--mobile-settings-closed-height")) || 0;
          const svgRect = wheelSvg.getBoundingClientRect();
          const availableWidth = Math.max(
            isMobileLayout() ? window.innerWidth - appPad * 2 : svgRect.width || 0,
            1
          );
          const availableHeight = Math.max(
            isMobileLayout() ? window.innerHeight - closedSettingsHeight - appPad * 3 : svgRect.height || 0,
            1
          );
          const verticalUnit = Math.min(availableWidth / 5, availableHeight / 16);
          const horizontalUnit = Math.min(availableWidth / 12, availableHeight / 6);
          const horizontalLayout = horizontalUnit > verticalUnit;
          const verticalSliceColumns = 5;
          const horizontalSliceRows = 6;
          const bounds = horizontalLayout
            ? { minX: cx - (12 * cellSize) / 2, maxX: cx + (12 * cellSize) / 2, minY: cy - (6 * cellSize) / 2, maxY: cy + (6 * cellSize) / 2 }
            : { minX: cx - (5 * cellSize) / 2, maxX: cx + (5 * cellSize) / 2, minY: cy - (16 * cellSize) / 2, maxY: cy + (16 * cellSize) / 2 };

          const cells = [];
          let currentTop = bounds.minY;
          let currentLeft = bounds.minX;
          let scoreBox = null;

          for (let sliceIndex = 0; sliceIndex < slices.length; sliceIndex += 1) {
            const slice = slices[sliceIndex];
            const scaffoldColumns = horizontalLayout ? slice.xValues.length : verticalSliceColumns;
            const scaffoldRows = horizontalLayout ? horizontalSliceRows : slice.yValues.length;
            const left = currentLeft;
            const top = currentTop;
            const contentTop = horizontalLayout ? currentTop + (horizontalSliceRows - slice.yValues.length) * cellSize : currentTop;
            drawGridScaffold(NS, left, top, scaffoldColumns, scaffoldRows, cellSize, `tetrad-grid-clip-${slice.first}`);

            if (sliceIndex === 0) {
              scoreBox = {
                x: left + scaffoldColumns * cellSize - cellSize * 2,
                y: contentTop,
                width: cellSize * 2,
                height: cellSize * 2,
              };
            }

            for (let row = 0; row < slice.yValues.length; row += 1) {
              for (let column = 0; column < slice.xValues.length; column += 1) {
                const xValue = slice.xValues[column];
                const yValue = slice.yValues[row];
                const canonicalKey = `${slice.first},${xValue},${yValue}`;
                const tetradIndex = TETRADS.indexOf(canonicalKey);
                if (tetradIndex === -1) continue;
                cells.push({
                  left: left + column * cellSize,
                  top: contentTop + row * cellSize,
                  index: tetradIndex,
                  label: canonicalKey,
                  subtitle: TETRAD_NAMES[canonicalKey] || "",
                  hue: (tetradIndex * 360) / TETRADS.length,
                  active: state.activeTetrads[tetradIndex],
                });
              }
            }

            if (horizontalLayout) currentLeft += slice.xValues.length * cellSize;
            else currentTop += slice.yValues.length * cellSize;
          }

          drawGridCells(NS, cells, cellSize, labelFontSize);

          if (scoreBox && showsScoreButton()) {
            const scoreCircle = document.createElementNS(NS, "circle");
            scoreCircle.setAttribute("cx", String(scoreBox.x + scoreBox.width / 2));
            scoreCircle.setAttribute("cy", String(scoreBox.y + scoreBox.height / 2));
            scoreCircle.setAttribute("r", String(Math.min(scoreBox.width, scoreBox.height) / 2));
            scoreCircle.setAttribute("fill", "rgba(8, 14, 22, 0.95)");
            scoreCircle.setAttribute("stroke", "rgba(255,255,255,0.24)");
            scoreCircle.setAttribute("stroke-width", "2");
            scoreCircle.dataset.centerControl = "true";
            wheelSvg.appendChild(scoreCircle);
          }

          return { bounds, scoreBox };
        }

        const cellSize = 72;
        const labelFontSize = Math.round(cellSize * 0.22);
        const overlayGroup = document.createElementNS(NS, "g");
        const overlayEntries = [];
        const slices = [
          { first: 1, xValues: [2, 3, 4, 5, 6], yValues: [3, 4, 5, 6, 7, 8] },
          { first: 2, xValues: [3, 4, 5, 6], yValues: [4, 5, 6, 7, 8] },
          { first: 3, xValues: [4, 5, 6], yValues: [5, 6, 7, 8, 9] },
        ];
        const rootStyles = window.getComputedStyle(document.documentElement);
        const appPad = parseFloat(rootStyles.getPropertyValue("--app-pad")) || 0;
        const closedSettingsHeight = parseFloat(rootStyles.getPropertyValue("--mobile-settings-closed-height")) || 0;
        const svgRect = wheelSvg.getBoundingClientRect();
        const availableWidth = Math.max(
          isMobileLayout() ? window.innerWidth - appPad * 2 : svgRect.width || 0,
          1
        );
        const availableHeight = Math.max(
          isMobileLayout() ? window.innerHeight - closedSettingsHeight - appPad * 3 : svgRect.height || 0,
          1
        );
        const verticalUnit = Math.min(availableWidth / 5, availableHeight / 16);
        const horizontalUnit = Math.min(availableWidth / 12, availableHeight / 6);
        const horizontalLayout = horizontalUnit > verticalUnit;
        const verticalSliceColumns = 5;
        const horizontalSliceRows = 6;

        let bounds;
        if (horizontalLayout) {
          bounds = {
            minX: cx - (12 * cellSize) / 2,
            maxX: cx + (12 * cellSize) / 2,
            minY: cy - (6 * cellSize) / 2,
            maxY: cy + (6 * cellSize) / 2,
          };
        } else {
          bounds = {
            minX: cx - (5 * cellSize) / 2,
            maxX: cx + (5 * cellSize) / 2,
            minY: cy - (16 * cellSize) / 2,
            maxY: cy + (16 * cellSize) / 2,
          };
        }

        let currentTop = bounds.minY;
        let currentLeft = bounds.minX;
        let scoreBox = null;

        slices.forEach((slice, sliceIndex) => {
          const gridWidth = slice.xValues.length * cellSize;
          const gridHeight = slice.yValues.length * cellSize;
          const scaffoldWidth = horizontalLayout ? gridWidth : verticalSliceColumns * cellSize;
          const scaffoldHeight = horizontalLayout ? horizontalSliceRows * cellSize : gridHeight;
          const left = currentLeft;
          const top = horizontalLayout ? currentTop + (horizontalSliceRows - slice.yValues.length) * cellSize : currentTop;

          if (sliceIndex === 0) {
            scoreBox = {
              x: left + scaffoldWidth - cellSize * 2,
              y: top,
              width: cellSize * 2,
              height: cellSize * 2,
            };
          }

          const clipId = `tetrad-grid-clip-${slice.first}-${Math.random().toString(36).slice(2, 10)}`;
          const defs = document.createElementNS(NS, "defs");
          const clipPath = document.createElementNS(NS, "clipPath");
          clipPath.setAttribute("id", clipId);
          const clipRect = document.createElementNS(NS, "rect");
          clipRect.setAttribute("x", String(left));
          clipRect.setAttribute("y", String(horizontalLayout ? currentTop : top));
          clipRect.setAttribute("width", String(scaffoldWidth));
          clipRect.setAttribute("height", String(scaffoldHeight));
          clipPath.appendChild(clipRect);
          defs.appendChild(clipPath);
          wheelSvg.appendChild(defs);

          const gridLinesGroup = document.createElementNS(NS, "g");
          gridLinesGroup.setAttribute("clip-path", `url(#${clipId})`);
          wheelSvg.appendChild(gridLinesGroup);

          for (let column = 0; column <= (horizontalLayout ? slice.xValues.length : verticalSliceColumns); column += 1) {
            const line = document.createElementNS(NS, "line");
            const x = left + column * cellSize;
            line.setAttribute("x1", String(x));
            line.setAttribute("y1", String(horizontalLayout ? currentTop : top));
            line.setAttribute("x2", String(x));
            line.setAttribute("y2", String((horizontalLayout ? currentTop : top) + scaffoldHeight));
            line.setAttribute("stroke", "rgba(255,255,255,0.10)");
            line.setAttribute("stroke-width", "1");
            gridLinesGroup.appendChild(line);
          }

          for (let row = 0; row <= (horizontalLayout ? horizontalSliceRows : slice.yValues.length); row += 1) {
            const line = document.createElementNS(NS, "line");
            const rowTop = horizontalLayout ? currentTop : top;
            const y = rowTop + row * cellSize;
            line.setAttribute("x1", String(left));
            line.setAttribute("y1", String(y));
            line.setAttribute("x2", String(left + scaffoldWidth));
            line.setAttribute("y2", String(y));
            line.setAttribute("stroke", "rgba(255,255,255,0.10)");
            line.setAttribute("stroke-width", "1");
            gridLinesGroup.appendChild(line);
          }

          const border = document.createElementNS(NS, "rect");
          border.setAttribute("x", String(left));
          border.setAttribute("y", String(horizontalLayout ? currentTop : top));
          border.setAttribute("width", String(scaffoldWidth));
          border.setAttribute("height", String(scaffoldHeight));
          border.setAttribute("fill", "none");
          border.setAttribute("stroke", "rgba(255,255,255,0.16)");
          border.setAttribute("stroke-width", "1.25");
          wheelSvg.appendChild(border);

          for (let row = 0; row < slice.yValues.length; row += 1) {
            for (let column = 0; column < slice.xValues.length; column += 1) {
              const xValue = slice.xValues[column];
              const yValue = slice.yValues[row];
              const canonicalKey = `${slice.first},${xValue},${yValue}`;
              if (!TETRADS.includes(canonicalKey)) continue;
              const tetradIndex = TETRADS.indexOf(canonicalKey);
              const active = state.activeTetrads[tetradIndex];
              const cellLeft = left + column * cellSize;
              const cellTop = top + row * cellSize;
              const hovered = state.hoveredPc === tetradIndex && state.hoveredZone === "pitch";
              let stroke = "rgba(255,255,255,0.30)";
              let strokeWidth = "1.5";
              let highlightKind = "neutral";
              if (state.perfectPitch.awaitingAdvance && state.targetPc === tetradIndex) {
                stroke = "#d4af37";
                strokeWidth = "5";
                highlightKind = "awaiting";
              } else if (state.perfectPitch.feedbackPc === tetradIndex) {
                stroke = state.perfectPitch.feedbackKind === "correct" ? "#40d97b" : "#ff5d73";
                strokeWidth = "5";
                highlightKind = state.perfectPitch.feedbackKind === "correct" ? "correct" : "wrong";
              } else if (state.revealed && state.targetPc === tetradIndex) {
                stroke = "#ffffff";
                strokeWidth = "5";
                highlightKind = "revealed";
              }

              const rect = document.createElementNS(NS, "rect");
              rect.setAttribute("x", String(cellLeft));
              rect.setAttribute("y", String(cellTop));
              rect.setAttribute("width", String(cellSize));
              rect.setAttribute("height", String(cellSize));
              const tetradHue = (tetradIndex * 360) / TETRADS.length;
              rect.setAttribute(
                "fill",
                active ? colorAtHue(
                  tetradHue,
                  hovered ? PITCH_HOVER_LIGHTNESS : PITCH_MUTED_LIGHTNESS,
                  hovered ? PITCH_HOVER_CHROMA : PITCH_MUTED_CHROMA
                ) : "rgba(95,105,120,0.28)"
              );
              rect.dataset.pc = String(tetradIndex);
              rect.dataset.zone = "pitch";
              wheelSvg.appendChild(rect);

              const overlay = document.createElementNS(NS, "rect");
              overlay.setAttribute("x", String(cellLeft));
              overlay.setAttribute("y", String(cellTop));
              overlay.setAttribute("width", String(cellSize));
              overlay.setAttribute("height", String(cellSize));
              overlay.setAttribute("fill", "none");
              overlay.setAttribute("stroke", stroke);
              overlay.setAttribute("stroke-width", strokeWidth);
              overlay.dataset.pc = String(tetradIndex);
              overlay.dataset.zone = "pitch";
              overlayEntries.push({ priority: highlightPriority(highlightKind), overlay });

              const label = document.createElementNS(NS, "text");
              label.setAttribute("x", String(cellLeft + cellSize / 2));
              label.setAttribute("y", String(cellTop + cellSize / 2 + 1));
              label.setAttribute("text-anchor", "middle");
              label.setAttribute("dominant-baseline", "middle");
              label.setAttribute("fill", "#ffffff");
              label.setAttribute("font-size", String(labelFontSize));
              label.setAttribute("font-weight", "700");
              label.setAttribute("font-family", "Avenir Next, Trebuchet MS, sans-serif");
              label.setAttribute("pointer-events", "none");
              label.textContent = `${slice.first},${xValue},${yValue}`;
              wheelSvg.appendChild(label);
            }
          }

          if (horizontalLayout) currentLeft += gridWidth;
          else currentTop += gridHeight;
        });

        if (scoreBox && showsScoreButton()) {
          const scoreCircle = document.createElementNS(NS, "circle");
          scoreCircle.setAttribute("cx", String(scoreBox.x + scoreBox.width / 2));
          scoreCircle.setAttribute("cy", String(scoreBox.y + scoreBox.height / 2));
          scoreCircle.setAttribute("r", String(Math.min(scoreBox.width, scoreBox.height) / 2));
          scoreCircle.setAttribute("fill", "rgba(8, 14, 22, 0.95)");
          scoreCircle.setAttribute("stroke", "rgba(255,255,255,0.24)");
          scoreCircle.setAttribute("stroke-width", "2");
          scoreCircle.dataset.centerControl = "true";
          wheelSvg.appendChild(scoreCircle);
        }

        overlayEntries.sort((a, b) => a.priority - b.priority).forEach(({ overlay }) => overlayGroup.appendChild(overlay));
        wheelSvg.appendChild(overlayGroup);
        return { bounds, scoreBox };
      }

      function drawWheel() {
        const NS = "http://www.w3.org/2000/svg";
        const cx = 310;
        const cy = 310;
        const pitchOuter = 250;
        const pitchInner = 112;
        wheelSvg.innerHTML = "";
        const monophonicOuterRadius = pitchOuter + 2;
        wheelSvg.setAttribute(
          "viewBox",
          `${cx - monophonicOuterRadius} ${cy - monophonicOuterRadius} ${monophonicOuterRadius * 2} ${monophonicOuterRadius * 2}`
        );

        if (state.chordSize === 2) {
          drawBiphonicSpiral(NS, cx, cy);
          const unitRadius = 62;
          if (showsScoreButton()) drawScoreBadge(NS, cx, cy, unitRadius);
          const segmentCount = maxDisplayedInterval();
          const symmetricRadius = unitRadius * (2 + segmentCount / 12);
          wheelSvg.setAttribute(
            "viewBox",
            `${cx - symmetricRadius} ${cy - symmetricRadius} ${symmetricRadius * 2} ${symmetricRadius * 2}`
          );

          updateScoreLabel();
          return;
        }

        if (state.chordSize === 3) {
          const { bounds, scoreBox } = drawTriphonicGrid(NS, cx, cy);
          wheelSvg.setAttribute(
            "viewBox",
            `${bounds.minX} ${bounds.minY} ${bounds.maxX - bounds.minX} ${bounds.maxY - bounds.minY}`
          );
          if (showsScoreButton()) drawScoreBadge(NS, scoreBox.x + scoreBox.width / 2, scoreBox.y + scoreBox.height / 2, Math.min(scoreBox.width, scoreBox.height) / 2);

          updateScoreLabel();
          return;
        }

        if (state.chordSize === 4) {
          const { bounds, scoreBox } = drawTetradGrids(NS, cx, cy);
          wheelSvg.setAttribute(
            "viewBox",
            `${bounds.minX} ${bounds.minY} ${bounds.maxX - bounds.minX} ${bounds.maxY - bounds.minY}`
          );
          if (scoreBox && showsScoreButton()) {
            drawScoreBadge(NS, scoreBox.x + scoreBox.width / 2, scoreBox.y + scoreBox.height / 2, Math.min(scoreBox.width, scoreBox.height) / 2);
          }

          updateScoreLabel();
          return;
        }

        const bg = document.createElementNS(NS, "circle");
        const pitchOverlayGroup = document.createElementNS(NS, "g");
        const overlayEntries = [];
        bg.setAttribute("cx", String(cx));
        bg.setAttribute("cy", String(cy));
        bg.setAttribute("r", String(pitchOuter + 2));
        bg.setAttribute("fill", "#0f1b2a");
        bg.setAttribute("stroke", "#2d3f59");
        bg.setAttribute("stroke-width", "1");
        wheelSvg.appendChild(bg);

        for (let i = 0; i < 12; i += 1) {
          const start = -Math.PI / 2 + (i * Math.PI * 2) / 12;
          const end = -Math.PI / 2 + ((i + 1) * Math.PI * 2) / 12;
          const pitch = state.pitchClasses[i];
          const mutedColor = colorAtHue((i * 360) / EDO, PITCH_MUTED_LIGHTNESS, PITCH_MUTED_CHROMA);
          const hoverColor = colorAtHue((i * 360) / EDO, PITCH_HOVER_LIGHTNESS, PITCH_HOVER_CHROMA);
          const pitchHovered = state.hoveredPc === i && state.hoveredZone === "pitch";
          let stroke = "rgba(255,255,255,0.30)";
          let strokeWidth = "1.5";
          let highlightKind = "neutral";
          if (state.perfectPitch.awaitingAdvance && state.targetPc === i) {
            stroke = "#d4af37";
            strokeWidth = "5";
            highlightKind = "awaiting";
          } else if (state.perfectPitch.feedbackPc === i) {
            stroke = state.perfectPitch.feedbackKind === "correct" ? "#40d97b" : "#ff5d73";
            strokeWidth = "5";
            highlightKind = state.perfectPitch.feedbackKind === "correct" ? "correct" : "wrong";
          } else if (state.revealed && state.targetPc === i) {
            stroke = "#ffffff";
            strokeWidth = "5";
            highlightKind = "revealed";
          }

          const pitchPath = document.createElementNS(NS, "path");
          pitchPath.setAttribute("d", sectorPath(cx, cy, pitchInner, pitchOuter, start, end));
          pitchPath.setAttribute("fill", pitch.active ? (pitchHovered ? hoverColor : mutedColor) : "rgba(95,105,120,0.28)");
          pitchPath.dataset.pc = String(i);
          pitchPath.dataset.zone = "pitch";
          wheelSvg.appendChild(pitchPath);

          const pitchOverlay = document.createElementNS(NS, "path");
          pitchOverlay.setAttribute("d", sectorPath(cx, cy, pitchInner, pitchOuter, start, end));
          pitchOverlay.setAttribute("fill", "none");
          pitchOverlay.setAttribute("stroke", stroke);
          pitchOverlay.setAttribute("stroke-width", strokeWidth);
          pitchOverlay.dataset.pc = String(i);
          pitchOverlay.dataset.zone = "pitch";
          overlayEntries.push({ priority: highlightPriority(highlightKind), overlay: pitchOverlay });

          const angle = (start + end) / 2;
          const theta = end - start;
          const centroidRadius = annularSectorCentroidRadius(pitchInner, pitchOuter, theta);
          const tx = cx + Math.cos(angle) * centroidRadius;
          const ty = cy + Math.sin(angle) * centroidRadius;
          const labelFontSize = 23;
          const showShortcuts = state.showKeyboardShortcuts && !isMobileLayout();
          const groupCenterY = ty;
          const shortcutFontSize = Math.max(9, labelFontSize * 0.7);
          const keycapPadding = labelFontSize * 0.1;
          const keycapHeight = shortcutFontSize + keycapPadding * 2;
          const gap = labelFontSize * 0.3;
          const stackedHalfHeight = (labelFontSize + gap + keycapHeight) / 2;
          const labelCenterY = showShortcuts ? groupCenterY - (stackedHalfHeight - labelFontSize / 2) : groupCenterY;
          const keycapCenterY = showShortcuts ? groupCenterY + (stackedHalfHeight - keycapHeight / 2) : groupCenterY;
          const keycapLabel = PC_SHORTCUTS[i];

          const nameText = document.createElementNS(NS, "text");
          nameText.setAttribute("x", String(tx));
          nameText.setAttribute("y", String(labelCenterY));
          nameText.setAttribute("text-anchor", "middle");
          nameText.setAttribute("dominant-baseline", "middle");
          nameText.setAttribute("fill", "#ffffff");
          nameText.setAttribute("font-size", String(labelFontSize));
          nameText.setAttribute("font-weight", "700");
          nameText.setAttribute("font-family", "Avenir Next, Trebuchet MS, sans-serif");
          nameText.setAttribute("pointer-events", "none");
          nameText.textContent = pitch.name;
          wheelSvg.appendChild(nameText);
          if (showShortcuts) {
            drawSvgKeycap(NS, tx, keycapCenterY, keycapLabel, { labelFontSize });
          }

        }

        if (showsScoreButton()) {
          const centerCircle = document.createElementNS(NS, "circle");
          centerCircle.setAttribute("cx", String(cx));
          centerCircle.setAttribute("cy", String(cy));
          centerCircle.setAttribute("r", String(pitchInner - 2));
          centerCircle.setAttribute("fill", "rgba(8, 14, 22, 0.95)");
          centerCircle.setAttribute("stroke", "rgba(255,255,255,0.24)");
          centerCircle.setAttribute("stroke-width", "2");
          centerCircle.dataset.centerControl = "true";
          wheelSvg.appendChild(centerCircle);
        }
        overlayEntries.sort((a, b) => a.priority - b.priority).forEach(({ overlay }) => pitchOverlayGroup.appendChild(overlay));
        wheelSvg.appendChild(pitchOverlayGroup);
        if (showsScoreButton()) drawScoreBadge(NS, cx, cy, pitchInner - 2);

        updateScoreLabel();
      }

      function wheelPointToPc(event) {
        const target = event.target.closest("[data-pc]");
        if (!target) return null;
        return { pc: Number(target.dataset.pc), zone: target.dataset.zone };
      }

      function togglePitchClassActive(pc) {
        const pitch = state.pitchClasses[pc];
        pitch.active = !pitch.active;
        if (!activePitchClasses().length) pitch.active = true;
        resetRecentScore();
        startNewRound();
        saveSettings();
      }

      function toggleIntervalActive(interval) {
        state.activeIntervals[interval] = !state.activeIntervals[interval];
        if (!state.activeIntervals.slice(1).some(Boolean)) state.activeIntervals[interval] = true;
        resetRecentScore();
        startNewRound();
        saveSettings();
      }

      function toggleTriadActive(index) {
        state.activeTriads[index] = !state.activeTriads[index];
        if (!state.activeTriads.some(Boolean)) state.activeTriads[index] = true;
        resetRecentScore();
        startNewRound();
        saveSettings();
      }

      function toggleTetradActive(index) {
        state.activeTetrads[index] = !state.activeTetrads[index];
        if (!state.activeTetrads.some(Boolean)) state.activeTetrads[index] = true;
        resetRecentScore();
        startNewRound();
        saveSettings();
      }

      function toggleSelection(pc) {
        if (state.chordSize === 2) {
          toggleIntervalActive(pc);
          return;
        }
        if (state.chordSize === 3) {
          toggleTriadActive(pc);
          return;
        }
        if (state.chordSize === 4) {
          toggleTetradActive(pc);
          return;
        }
        togglePitchClassActive(pc);
      }

      function chooseRandomInterval() {
        const options = activeIntervalsInRange();
        if (!options.length) return null;
        return options[Math.floor(Math.random() * options.length)];
      }

      function chooseDyadForInterval(interval) {
        const roots = [];
        for (let midi = state.rangeStartMidi; midi + interval <= state.rangeEndMidi; midi += 1) roots.push(midi);
        if (!roots.length) return null;
        const root = roots[Math.floor(Math.random() * roots.length)];
        return [root, root + interval];
      }

      function parseTriadKey(triadKey) {
        const [middle, top] = triadKey.split(",").map(Number);
        return [0, middle, top];
      }

      function parseTetradKey(tetradKey) {
        const [second, third, fourth] = tetradKey.split(",").map(Number);
        return [0, second, third, fourth];
      }

      function chooseRandomTriad() {
        const options = [];
        for (let index = 0; index < TRIADS.length; index += 1) {
          if (!state.activeTriads[index]) continue;
          const triad = parseTriadKey(TRIADS[index]);
          const topInterval = triad[2];
          const maxRoot = state.rangeEndMidi - topInterval;
          if (maxRoot < state.rangeStartMidi) continue;
          options.push({ index, triad });
        }
        if (!options.length) return null;
        return options[Math.floor(Math.random() * options.length)];
      }

      function chooseVoicingForTriad(triad) {
        const topInterval = triad[2];
        const roots = [];
        for (let root = state.rangeStartMidi; root + topInterval <= state.rangeEndMidi; root += 1) roots.push(root);
        if (!roots.length) return null;
        const root = roots[Math.floor(Math.random() * roots.length)];
        const baseVoicing = triad.map((interval) => root + interval);
        if (state.triadVoicingMode === "root") return baseVoicing;
        return baseVoicing
          .map((midi) => (midi + 12 <= state.rangeEndMidi && Math.random() < 0.5 ? midi + 12 : midi))
          .sort((a, b) => a - b);
      }

      function chooseRandomTetrad() {
        const options = [];
        for (let index = 0; index < TETRADS.length; index += 1) {
          if (!state.activeTetrads[index]) continue;
          const tetrad = parseTetradKey(TETRADS[index]);
          const topInterval = tetrad[3];
          const maxRoot = state.rangeEndMidi - topInterval;
          if (maxRoot < state.rangeStartMidi) continue;
          options.push({ index, tetrad });
        }
        if (!options.length) return null;
        return options[Math.floor(Math.random() * options.length)];
      }

      function chooseVoicingForTetrad(tetrad) {
        const topInterval = tetrad[3];
        const roots = [];
        for (let root = state.rangeStartMidi; root + topInterval <= state.rangeEndMidi; root += 1) roots.push(root);
        if (!roots.length) return null;
        const root = roots[Math.floor(Math.random() * roots.length)];
        const baseVoicing = tetrad.map((interval) => root + interval);
        if (state.triadVoicingMode === "root") return baseVoicing;
        return baseVoicing
          .map((midi) => (midi + 12 <= state.rangeEndMidi && Math.random() < 0.5 ? midi + 12 : midi))
          .sort((a, b) => a - b);
      }

      function rangeMidpoint() {
        return (state.rangeStartMidi + state.rangeEndMidi) / 2;
      }

      function chooseCenteredMidiForPc(pc) {
        const candidates = [];
        for (let midi = state.rangeStartMidi; midi <= state.rangeEndMidi; midi += 1) {
          if (midi % 12 === pc) candidates.push(midi);
        }
        if (!candidates.length) return null;
        const midpoint = rangeMidpoint();
        return candidates.reduce((best, midi) => {
          if (best == null) return midi;
          return Math.abs(midi - midpoint) < Math.abs(best - midpoint) ? midi : best;
        }, null);
      }

      function chooseCenteredVoicing(intervals, allowInversions = false) {
        const minInterval = Math.min(...intervals);
        const maxInterval = Math.max(...intervals);
        const midpoint = rangeMidpoint();
        const roots = [];
        for (let root = state.rangeStartMidi - minInterval; root + maxInterval <= state.rangeEndMidi; root += 1) roots.push(root);
        if (!roots.length) return null;
        let bestVoicing = null;
        let bestDistance = Infinity;
        let bestSpan = Infinity;
        for (const root of roots) {
          const baseVoicing = intervals.map((interval) => root + interval);
          const masks = allowInversions ? Array.from({ length: 1 << baseVoicing.length }, (_, index) => index) : [0];
          for (const mask of masks) {
            const voicing = baseVoicing.map((midi, index) => {
              if (allowInversions && (mask & (1 << index)) && midi + 12 <= state.rangeEndMidi) return midi + 12;
              return midi;
            }).sort((a, b) => a - b);
            if (voicing[0] < state.rangeStartMidi || voicing[voicing.length - 1] > state.rangeEndMidi) continue;
            const center = (voicing[0] + voicing[voicing.length - 1]) / 2;
            const distance = Math.abs(center - midpoint);
            const span = voicing[voicing.length - 1] - voicing[0];
            if (distance < bestDistance || (distance === bestDistance && span < bestSpan)) {
              bestVoicing = voicing;
              bestDistance = distance;
              bestSpan = span;
            }
          }
        }
        return bestVoicing;
      }

      function chooseRandomPlacedVoicing(intervals) {
        const minInterval = Math.min(...intervals);
        const maxInterval = Math.max(...intervals);
        const roots = [];
        for (let root = state.rangeStartMidi - minInterval; root + maxInterval <= state.rangeEndMidi; root += 1) {
          roots.push(root);
        }
        if (!roots.length) return null;
        const root = roots[Math.floor(Math.random() * roots.length)];
        return intervals.map((interval) => root + interval).sort((a, b) => a - b);
      }

      function chooseDemoChordVoicing(intervals, allowInversions = false) {
        if (!allowInversions) return chooseCenteredVoicing(intervals, false);
        const rangeSpan = state.rangeEndMidi - state.rangeStartMidi;
        const liftedIntervals = intervals.map((interval) => (
          interval + 12 <= rangeSpan && Math.random() < 0.5 ? interval + 12 : interval
        )).sort((a, b) => a - b);
        return chooseRandomPlacedVoicing(liftedIntervals);
      }

      function stopDemoPlayback() {
        if (state.demoPlaybackTimer !== null) {
          window.clearTimeout(state.demoPlaybackTimer);
          state.demoPlaybackTimer = null;
        }
        audioEngine.stopPrompt();
      }

      function demoSelectionNotes(selection) {
        if (selection == null) return null;
        if (state.chordSize === 1) {
          const midi = chooseCenteredMidiForPc(selection);
          return midi;
        }
        if (state.chordSize === 2) {
          return chooseCenteredVoicing([0, selection], false);
        }
        if (state.chordSize === 3) {
          const triad = parseTriadKey(TRIADS[selection]);
          return chooseDemoChordVoicing(triad, state.triadVoicingMode === "inversions");
        }
        if (state.chordSize === 4) {
          const tetrad = parseTetradKey(TETRADS[selection]);
          return chooseDemoChordVoicing(tetrad, state.triadVoicingMode === "inversions");
        }
        return null;
      }

      async function startDemoHoldSelection(selection, triggerType, triggerCode = null) {
        const notes = demoSelectionNotes(selection);
        if (notes == null) return;
        stopDemoPlayback();
        stopHoldCurrentNote();
        state.demoHoldTriggerType = triggerType;
        state.demoHoldTriggerCode = triggerCode;
        await audioEngine.startPrompt(notes, getPromptGain());
      }

      function stopDemoHold(triggerType = null, triggerCode = null) {
        if (state.demoHoldTriggerType === null) return;
        if (triggerType !== null && state.demoHoldTriggerType !== triggerType) return;
        if (triggerCode !== null && state.demoHoldTriggerCode !== triggerCode) return;
        state.demoHoldTriggerType = null;
        state.demoHoldTriggerCode = null;
        stopDemoPlayback();
      }

      function startNewRound() {
        stopDemoPlayback();
        state.demoHoldTriggerType = null;
        state.demoHoldTriggerCode = null;
        stopHoldCurrentNote();
        if (isDemoMode()) {
          state.targetPc = null;
          state.targetMidi = null;
          state.targetInterval = null;
          state.targetMidis = null;
          state.revealed = false;
          state.perfectPitch.feedbackPc = null;
          state.perfectPitch.feedbackKind = null;
          state.perfectPitch.awaitingAdvance = false;
          state.perfectPitch.awaitingRelease = false;
          state.perfectPitch.releaseTriggerType = null;
          state.perfectPitch.releaseTriggerCode = null;
          drawWheel();
          saveSettings();
          return;
        }
        if (state.chordSize === 2) {
          const interval = chooseRandomInterval();
          if (interval === null) return;
          const midis = chooseDyadForInterval(interval);
          if (!midis) return;
          state.targetPc = null;
          state.targetMidi = null;
          state.targetInterval = interval;
          state.targetMidis = midis;
          state.revealed = false;
          state.perfectPitch.feedbackPc = null;
          state.perfectPitch.feedbackKind = null;
          state.perfectPitch.awaitingAdvance = false;
          state.perfectPitch.awaitingRelease = false;
          state.perfectPitch.releaseTriggerType = null;
          state.perfectPitch.releaseTriggerCode = null;
          if (isContinuousMode() && !state.suppressPromptPlayback) startHoldCurrentNote().catch(() => {});
          drawWheel();
          saveSettings();
          return;
        }
        if (state.chordSize === 3) {
          const triadChoice = chooseRandomTriad();
          if (!triadChoice) return;
          const midis = chooseVoicingForTriad(triadChoice.triad);
          if (!midis) return;
          state.targetPc = triadChoice.index;
          state.targetMidi = null;
          state.targetInterval = null;
          state.targetMidis = midis;
          state.revealed = false;
          state.perfectPitch.feedbackPc = null;
          state.perfectPitch.feedbackKind = null;
          state.perfectPitch.awaitingAdvance = false;
          state.perfectPitch.awaitingRelease = false;
          state.perfectPitch.releaseTriggerType = null;
          state.perfectPitch.releaseTriggerCode = null;
          if (isContinuousMode() && !state.suppressPromptPlayback) startHoldCurrentNote().catch(() => {});
          drawWheel();
          saveSettings();
          return;
        }
        if (state.chordSize === 4) {
          const tetradChoice = chooseRandomTetrad();
          if (!tetradChoice) return;
          const midis = chooseVoicingForTetrad(tetradChoice.tetrad);
          if (!midis) return;
          state.targetPc = tetradChoice.index;
          state.targetMidi = null;
          state.targetInterval = null;
          state.targetMidis = midis;
          state.revealed = false;
          state.perfectPitch.feedbackPc = null;
          state.perfectPitch.feedbackKind = null;
          state.perfectPitch.awaitingAdvance = false;
          state.perfectPitch.awaitingRelease = false;
          state.perfectPitch.releaseTriggerType = null;
          state.perfectPitch.releaseTriggerCode = null;
          if (isContinuousMode() && !state.suppressPromptPlayback) startHoldCurrentNote().catch(() => {});
          drawWheel();
          saveSettings();
          return;
        }
        const active = activePitchClasses().filter((pitch) => pcsAvailableInRange().has(pitch.pc));
        if (!active.length) return;
        const chosenPc = active[Math.floor(Math.random() * active.length)].pc;
        const midi = chooseMidiForPc(chosenPc);
        if (midi === null) return;
        state.targetPc = chosenPc;
        state.targetMidi = midi;
        state.revealed = false;
        state.perfectPitch.feedbackPc = null;
        state.perfectPitch.feedbackKind = null;
        state.perfectPitch.awaitingAdvance = false;
        state.perfectPitch.awaitingRelease = false;
        state.perfectPitch.releaseTriggerType = null;
        state.perfectPitch.releaseTriggerCode = null;
        if (isContinuousMode() && !state.suppressPromptPlayback) startHoldCurrentNote().catch(() => {});
        drawWheel();
        saveSettings();
      }

      function beginAdvanceOnRelease(triggerType, triggerCode) {
        state.perfectPitch.awaitingRelease = true;
        state.perfectPitch.releaseTriggerType = triggerType;
        state.perfectPitch.releaseTriggerCode = triggerCode;
      }

      function maybeAdvanceOnRelease(triggerType, triggerCode) {
        if (!state.perfectPitch.awaitingRelease) return;
        if (state.perfectPitch.releaseTriggerType !== triggerType) return;
        if (state.perfectPitch.releaseTriggerCode !== triggerCode) return;
        startNewRound();
      }

      function resetRecentScore() {
        state.recentScore = [0, 0];
      }

      function updateDailyScore(correct) {
        const key = scoreKeyFor(yyMmDd(), state.chordSize);
        const entry = state.perfectPitch.scoreByDateAndChordSize[key] || [0, 0, state.chordSize];
        entry[1] += 1;
        if (correct) entry[0] += 1;
        entry[2] = state.chordSize;
        state.perfectPitch.scoreByDateAndChordSize[key] = entry;
        state.recentScore[1] += 1;
        if (correct) state.recentScore[0] += 1;
        saveDailyLog();
        saveSettings();
      }

      function handleGuess(pc, triggerType, triggerCode) {
        if (isDemoMode()) {
          startDemoHoldSelection(pc, triggerType, triggerType === "key" ? triggerCode : null).catch(() => {});
          return;
        }
        if (state.chordSize === 2) {
          if (state.targetInterval === null || state.perfectPitch.awaitingRelease) return;
          if (state.perfectPitch.awaitingAdvance) {
            if (pc === state.targetInterval) {
              state.perfectPitch.feedbackPc = pc;
              state.perfectPitch.feedbackKind = "correct";
              beginAdvanceOnRelease(triggerType, triggerCode);
              drawWheel();
            } else {
              state.perfectPitch.feedbackPc = pc;
              state.perfectPitch.feedbackKind = "wrong";
              drawWheel();
            }
            return;
          }
          if (pc === state.targetInterval) {
            updateDailyScore(true);
            state.perfectPitch.feedbackPc = pc;
            state.perfectPitch.feedbackKind = "correct";
            beginAdvanceOnRelease(triggerType, triggerCode);
            drawWheel();
            saveSettings();
            return;
          }
          state.perfectPitch.feedbackPc = pc;
          state.perfectPitch.feedbackKind = "wrong";
          updateDailyScore(false);
          state.revealed = true;
          state.perfectPitch.awaitingAdvance = true;
          drawWheel();
          saveSettings();
          return;
        }
        if (state.chordSize === 3) {
          if (state.targetPc === null || state.perfectPitch.awaitingRelease) return;
          if (state.perfectPitch.awaitingAdvance) {
            if (pc === state.targetPc) {
              state.perfectPitch.feedbackPc = pc;
              state.perfectPitch.feedbackKind = "correct";
              beginAdvanceOnRelease(triggerType, triggerCode);
              drawWheel();
            } else {
              state.perfectPitch.feedbackPc = pc;
              state.perfectPitch.feedbackKind = "wrong";
              drawWheel();
            }
            return;
          }
          if (pc === state.targetPc) {
            updateDailyScore(true);
            state.perfectPitch.feedbackPc = pc;
            state.perfectPitch.feedbackKind = "correct";
            beginAdvanceOnRelease(triggerType, triggerCode);
            drawWheel();
            saveSettings();
            return;
          }
          state.perfectPitch.feedbackPc = pc;
          state.perfectPitch.feedbackKind = "wrong";
          updateDailyScore(false);
          state.revealed = true;
          state.perfectPitch.awaitingAdvance = true;
          drawWheel();
          saveSettings();
          return;
        }
        if (state.chordSize === 4) {
          if (state.targetPc === null || state.perfectPitch.awaitingRelease) return;
          if (state.perfectPitch.awaitingAdvance) {
            if (pc === state.targetPc) {
              state.perfectPitch.feedbackPc = pc;
              state.perfectPitch.feedbackKind = "correct";
              beginAdvanceOnRelease(triggerType, triggerCode);
              drawWheel();
            } else {
              state.perfectPitch.feedbackPc = pc;
              state.perfectPitch.feedbackKind = "wrong";
              drawWheel();
            }
            return;
          }
          if (pc === state.targetPc) {
            updateDailyScore(true);
            state.perfectPitch.feedbackPc = pc;
            state.perfectPitch.feedbackKind = "correct";
            beginAdvanceOnRelease(triggerType, triggerCode);
            drawWheel();
            saveSettings();
            return;
          }
          state.perfectPitch.feedbackPc = pc;
          state.perfectPitch.feedbackKind = "wrong";
          updateDailyScore(false);
          state.revealed = true;
          state.perfectPitch.awaitingAdvance = true;
          drawWheel();
          saveSettings();
          return;
        }
        if (state.targetPc === null || !state.pitchClasses[pc].active || state.perfectPitch.awaitingRelease) return;
        if (state.perfectPitch.awaitingAdvance) {
          if (pc === state.targetPc) {
            state.perfectPitch.feedbackPc = pc;
            state.perfectPitch.feedbackKind = "correct";
            beginAdvanceOnRelease(triggerType, triggerCode);
            drawWheel();
          } else {
            state.perfectPitch.feedbackPc = pc;
            state.perfectPitch.feedbackKind = "wrong";
            drawWheel();
          }
          return;
        }
        if (pc === state.targetPc) {
          updateDailyScore(true);
          state.perfectPitch.feedbackPc = pc;
          state.perfectPitch.feedbackKind = "correct";
          beginAdvanceOnRelease(triggerType, triggerCode);
          drawWheel();
          saveSettings();
          return;
        }
        state.perfectPitch.feedbackPc = pc;
        state.perfectPitch.feedbackKind = "wrong";
        updateDailyScore(false);
        state.revealed = true;
        state.perfectPitch.awaitingAdvance = true;
        drawWheel();
        saveSettings();
      }

      async function startHoldCurrentNote() {
        if (isDemoMode()) return;
        if (state.chordSize === 2 || state.chordSize === 3 || state.chordSize === 4) {
          if (!state.targetMidis) return;
          state.holdActive = true;
          await audioEngine.startPrompt(state.targetMidis, getPromptGain());
          return;
        }
        if (state.targetMidi === null) return;
        state.holdActive = true;
        await audioEngine.startPrompt(state.targetMidi, getPromptGain());
      }

      function stopHoldCurrentNote() {
        state.holdActive = false;
        audioEngine.stopPrompt();
      }

      async function startRangeHoldNote(midi) {
        state.rangeHoldMidi = midi;
        await audioEngine.startRangePrompt(midi, getPromptGain());
      }

      function stopRangeHoldNote() {
        audioEngine.stopRangePrompt();
        state.rangeHoldHandle = null;
        state.rangeHoldMidi = null;
        state.suppressPromptPlayback = false;
        if (state.rangeHoldWasHolding && isContinuousMode()) startHoldCurrentNote().catch(() => {});
        state.rangeHoldWasHolding = false;
      }

      function syncContinuousPlaybackAfterGesture(skipStart = false) {
        if (!audioEngine.unlocked || skipStart || !isContinuousMode() || state.holdActive || state.suppressPromptPlayback) return;
        if ((state.chordSize === 2 || state.chordSize === 3 || state.chordSize === 4) && !state.targetMidis) return;
        if (state.chordSize !== 2 && state.chordSize !== 3 && state.chordSize !== 4 && state.targetMidi === null) return;
        startHoldCurrentNote().catch(() => {});
      }

      function primeAudioOnGesture(skipContinuousStart = false) {
        audioEngine.ensureContext().then(() => syncContinuousPlaybackAfterGesture(skipContinuousStart)).catch(() => {});
      }

      function releaseCenterControl(pointerId = null) {
        if (state.centerControlPointerId === null) return;
        if (pointerId !== null && state.centerControlPointerId !== pointerId) return;
        const heldPointerId = state.centerControlPointerId;
        state.centerControlPointerId = null;
        if (heldPointerId !== null && wheelSvg.hasPointerCapture?.(heldPointerId)) {
          wheelSvg.releasePointerCapture(heldPointerId);
        }
        if (isContinuousMode()) startHoldCurrentNote().catch(() => {});
        else if (state.playMode === "press") stopHoldCurrentNote();
      }

      function setPlayMode(nextValue) {
        if (!["press", "continuous", "demo", "toggle"].includes(nextValue)) return;
        state.playMode = nextValue;
        state.demoHoldTriggerType = null;
        state.demoHoldTriggerCode = null;
        stopDemoPlayback();
        stopHoldCurrentNote();
        if (isContinuousMode()) startHoldCurrentNote().catch(() => {});
        syncControls();
        drawWheel();
        if (!isDemoMode() && state.targetPc === null && state.targetMidi === null && state.targetInterval === null && state.targetMidis === null) {
          startNewRound();
          return;
        }
        if (isDemoMode()) startNewRound();
        saveSettings();
      }

      function setScoreMode(nextValue) {
        if (!["recent", "today", "all"].includes(nextValue)) return;
        state.scoreMode = nextValue;
        syncControls();
        drawWheel();
        saveSettings();
      }

      function setChordSize(nextValue) {
        if (![1, 2, 3, 4].includes(nextValue)) return;
        stopHoldCurrentNote();
        state.chordSize = nextValue;
        resetRecentScore();
        state.targetPc = null;
        state.targetMidi = null;
        state.targetInterval = null;
        state.targetMidis = null;
        syncControls();
        startNewRound();
        saveSettings();
      }

      function setTriadVoicingMode(nextValue) {
        if (!["root", "inversions"].includes(nextValue)) return;
        state.triadVoicingMode = nextValue;
        syncControls();
        if (state.chordSize === 3 || state.chordSize === 4) startNewRound();
        saveSettings();
      }

      function downloadDailyCsv() {
        const csv = scoreByDateToCsv(state.perfectPitch.scoreByDateAndChordSize);
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `ear-training-logs-${yyMmDd()}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      }

      if (gainBox) {
        gainBox.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          state.gainDrag = {
            pointerId: event.pointerId,
            startY: event.clientY,
            startGain: state.baseGain,
          };
          gainBox.setPointerCapture(event.pointerId);
        });
        gainBox.addEventListener("pointermove", (event) => {
          if (!state.gainDrag || event.pointerId !== state.gainDrag.pointerId) return;
          event.preventDefault();
          const deltaY = state.gainDrag.startY - event.clientY;
          const gainSpan = 0.68;
          const nextGain = state.gainDrag.startGain + (deltaY / 240) * gainSpan;
          setBaseGain(nextGain);
        });
        const finishGainDrag = (event) => {
          if (!state.gainDrag || event.pointerId !== state.gainDrag.pointerId) return;
          if (gainBox.hasPointerCapture && gainBox.hasPointerCapture(event.pointerId)) {
            gainBox.releasePointerCapture(event.pointerId);
          }
          state.gainDrag = null;
        };
        gainBox.addEventListener("pointerup", finishGainDrag);
        gainBox.addEventListener("pointercancel", finishGainDrag);
        gainBox.addEventListener("wheel", (event) => {
          event.preventDefault();
          const step = event.deltaY > 0 ? -0.01 : 0.01;
          setBaseGain(state.baseGain + step);
        }, { passive: false });
      }

      if (maxIntervalBox) {
        maxIntervalBox.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          state.maxIntervalWasHolding = state.holdActive;
          state.suppressPromptPlayback = true;
          stopHoldCurrentNote();
          state.maxIntervalDrag = {
            pointerId: event.pointerId,
            startY: event.clientY,
            startValue: state.maxInterval,
          };
          maxIntervalBox.setPointerCapture(event.pointerId);
        });
        maxIntervalBox.addEventListener("pointermove", (event) => {
          if (!state.maxIntervalDrag || event.pointerId !== state.maxIntervalDrag.pointerId) return;
          event.preventDefault();
          const deltaY = state.maxIntervalDrag.startY - event.clientY;
          const nextValue = state.maxIntervalDrag.startValue + deltaY / 12;
          setMaxInterval(nextValue);
        });
        const finishMaxIntervalDrag = (event) => {
          if (!state.maxIntervalDrag || event.pointerId !== state.maxIntervalDrag.pointerId) return;
          if (maxIntervalBox.hasPointerCapture && maxIntervalBox.hasPointerCapture(event.pointerId)) {
            maxIntervalBox.releasePointerCapture(event.pointerId);
          }
          state.maxIntervalDrag = null;
          state.suppressPromptPlayback = false;
          if (state.maxIntervalWasHolding && isContinuousMode()) {
            startHoldCurrentNote().catch(() => {});
          }
          state.maxIntervalWasHolding = false;
        };
        maxIntervalBox.addEventListener("pointerup", finishMaxIntervalDrag);
        maxIntervalBox.addEventListener("pointercancel", finishMaxIntervalDrag);
        maxIntervalBox.addEventListener("wheel", (event) => {
          event.preventDefault();
          const step = event.deltaY > 0 ? -1 : 1;
          setMaxInterval(state.maxInterval + step);
        }, { passive: false });
      }

      playModePressBtn.parentElement.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        animatePillGroup(playModePressBtn.parentElement, () => {
          setPlayMode(
            button === playModeContinuousBtn ? "continuous"
              : button === playModeDemoBtn ? "demo"
                : button === playModeToggleBtn ? "toggle"
                : "press"
          );
        });
      });

      scoreModeTodayBtn.parentElement.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        animatePillGroup(scoreModeTodayBtn.parentElement, () => {
          setScoreMode(
            button === scoreModeRecentBtn ? "recent"
              : button === scoreModeAllBtn ? "all"
                : "today"
          );
        });
      });

      chordSizeGroup.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        const nextValue = Number(button.textContent);
        if (!Number.isFinite(nextValue)) return;
        animatePillGroup(chordSizeGroup, () => {
          setChordSize(nextValue);

      keyboardShortcutGroup?.addEventListener("click", (event) => {
        if (!event.target.closest("button, .pill-thumb, .pill-toggle-group")) return;
        animatePillGroup(keyboardShortcutGroup, () => {
          state.showKeyboardShortcuts = !state.showKeyboardShortcuts;
          saveSettings();
          syncControls();
          drawWheel();
        });

      chordNamesGroup?.addEventListener("click", (event) => {
        if (!event.target.closest("button, .pill-thumb, .pill-toggle-group")) return;
        animatePillGroup(chordNamesGroup, () => {
          state.showChordNames = !state.showChordNames;
          saveSettings();
          syncControls();
          drawWheel();
        });
      });
      triadVoicingGroup?.addEventListener("click", (event) => {
        if (!event.target.closest("button, .pill-thumb, .pill-toggle-group")) return;
        animatePillGroup(triadVoicingGroup, () => {
          setTriadVoicingMode(state.triadVoicingMode === "root" ? "inversions" : "root");
        });
      });

      if (rangeStartWheel) {
        attachDesktopWheelDrag(rangeStartWheel, "start");
        rangeStartWheel.addEventListener("scroll", () => {
          updateWheelSelectionClass(rangeStartWheel, selectedWheelMidi(rangeStartWheel));
          if (rangeStartWheel.parentElement?.classList.contains("is-dragging")) return;
          scheduleRangeWheelSnap("start");
        });
        rangeStartWheel.addEventListener("pointerup", () => scheduleRangeWheelSnap("start"));
        rangeStartWheel.addEventListener("touchend", () => scheduleRangeWheelSnap("start"), { passive: true });
        rangeStartWheel.addEventListener("click", (event) => {
          const item = event.target.closest(".range-wheel-item");
          if (!item) return;
          const midi = Number(item.dataset.midi);
          setRangeStart(midi);
          audioEngine.playForDuration(midi, getPromptGain(), 500).catch(() => {});
          syncRangeWheel(rangeStartWheel, state.rangeStartMidi, false);
        });
      }
      if (rangeEndWheel) {
        attachDesktopWheelDrag(rangeEndWheel, "end");
        rangeEndWheel.addEventListener("scroll", () => {
          updateWheelSelectionClass(rangeEndWheel, selectedWheelMidi(rangeEndWheel));
          if (rangeEndWheel.parentElement?.classList.contains("is-dragging")) return;
          scheduleRangeWheelSnap("end");
        });
        rangeEndWheel.addEventListener("pointerup", () => scheduleRangeWheelSnap("end"));
        rangeEndWheel.addEventListener("touchend", () => scheduleRangeWheelSnap("end"), { passive: true });
        rangeEndWheel.addEventListener("click", (event) => {
          const item = event.target.closest(".range-wheel-item");
          if (!item) return;
          const midi = Number(item.dataset.midi);
          setRangeEnd(midi);
          audioEngine.playForDuration(midi, getPromptGain(), 500).catch(() => {});
          syncRangeWheel(rangeEndWheel, state.rangeEndMidi, false);
        });
      }
      downloadCsvBtn.addEventListener("click", downloadDailyCsv);
      settingsPanel.addEventListener("toggle", () => {
        syncMobileSettingsHeight();
        drawWheel();
      });

      wheelSvg.addEventListener("mousemove", (event) => {
        const hit = wheelPointToPc(event);
        const hoveredPc = hit ? hit.pc : null;
        const hoveredZone = hit ? hit.zone : null;
        if (hoveredPc !== state.hoveredPc || hoveredZone !== state.hoveredZone) {
          state.hoveredPc = hoveredPc;
          state.hoveredZone = hoveredZone;
          drawWheel();
        }
      });

      wheelSvg.addEventListener("mouseleave", () => {
        state.hoveredPc = null;
        state.hoveredZone = null;
        drawWheel();
      });

      wheelSvg.addEventListener("pointerdown", (event) => {
        const centerControl = event.target.closest("[data-center-control]");
        if (centerControl) {
          event.preventDefault();
          event.stopPropagation();
          if (isDemoMode() || isToggleMode()) return;
          state.centerControlPointerId = event.pointerId;
          wheelSvg.setPointerCapture?.(event.pointerId);
          primeAudioOnGesture(true);
          if (isContinuousMode()) stopHoldCurrentNote();
          else startHoldCurrentNote().catch(() => {});
          return;
        }
        const hit = wheelPointToPc(event);
        if (!hit || hit.zone !== "pitch") return;
        event.preventDefault();
        if (isToggleMode()) {
          toggleSelection(hit.pc);
          return;
        }
        handleGuess(hit.pc, "pointer", String(hit.pc));
      });

      wheelSvg.addEventListener("pointerup", (event) => {
        if (state.centerControlPointerId === event.pointerId) {
          event.preventDefault();
          event.stopPropagation();
          releaseCenterControl(event.pointerId);
        }
      });

      wheelSvg.addEventListener("pointercancel", (event) => {
        releaseCenterControl(event.pointerId);
      });

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space") event.preventDefault();
        if (event.repeat || event.metaKey || event.ctrlKey || event.altKey) return;
        primeAudioOnGesture(event.code === "Space");
        if (event.code === "Space") {
          if (isDemoMode()) return;
          if (isContinuousMode()) stopHoldCurrentNote();
          else startHoldCurrentNote().catch(() => {});
          return;
        }
        if (event.code === "KeyS") {
          event.preventDefault();
          settingsPanel.open = !settingsPanel.open;
          return;
        }
        if (state.chordSize === 2) {
          const interval = KEY_TO_INTERVAL[event.code];
          if (interval === undefined) return;
          event.preventDefault();
          if (isToggleMode()) {
            toggleSelection(interval);
            return;
          }
          handleGuess(interval, "key", event.code);
          return;
        }
        const pc = KEY_TO_PC[event.code];
        if (pc === undefined) return;
        event.preventDefault();
        if (isToggleMode()) {
          toggleSelection(pc);
          return;
        }
        handleGuess(pc, "key", event.code);
      });

      window.addEventListener("pointerdown", () => {
        primeAudioOnGesture();
      });

      window.addEventListener("pointerup", () => {
        stopDemoHold("pointer");
        releaseCenterControl();
        maybeAdvanceOnRelease("pointer", String(state.chordSize === 2 ? state.targetInterval : state.targetPc));
      });

      window.addEventListener("mouseup", stopRangeHoldNote);

      window.addEventListener("keyup", (event) => {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        if (event.code === "Space") {
          event.preventDefault();
          if (isDemoMode()) return;
          if (isContinuousMode()) startHoldCurrentNote().catch(() => {});
          else stopHoldCurrentNote();
          return;
        }
        stopDemoHold("key", event.code);
        maybeAdvanceOnRelease("key", event.code);
      });

      window.addEventListener("blur", () => {
        stopDemoHold();
        stopDemoPlayback();
        stopHoldCurrentNote();
        stopRangeHoldNote();
      });
      let lastMobileLayout = isMobileLayout();
      window.addEventListener("resize", () => {
        const mobileLayout = isMobileLayout();
        if (mobileLayout !== lastMobileLayout) {
          clearRangeWheelSnapTimers();
          if (mobileLayout) {
            rangeText.textContent = `${midiToName(state.rangeStartMidi)}-${midiToName(state.rangeEndMidi)}`;
            syncRangeWheel(rangeStartWheel, state.rangeStartMidi, true);
            syncRangeWheel(rangeEndWheel, state.rangeEndMidi, true);
          } else {
            updateRangeText();
          }
          lastMobileLayout = mobileLayout;
        }
        syncMobileSettingsHeight();
        buildPianoSvg();
        drawWheel();
        window.requestAnimationFrame(syncControls);
      });

      loadSettings();
      enforceMinimumRangeSpan("start");
      state.perfectPitch.scoreByDateAndChordSize = loadDailyLog();
      setupWaveformPager();
      setupPillResizeObservers();
      syncControls();
      syncMobileSettingsHeight();
      buildPianoSvg();
      buildRangeWheels();
      drawWheel();
      startNewRound();
      if (isContinuousMode()) startHoldCurrentNote().catch(() => {});
    </script>
  </body>
</html>
