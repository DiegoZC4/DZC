<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cube Group from Scratch</title><link rel="stylesheet" href="draft.css"><style>
.stage{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:1rem}.cube{min-height:320px;background:#172b2e;border-radius:18px;box-shadow:var(--shadow)}svg{width:100%;height:100%;display:block}.edge{stroke:#d5cdb9;stroke-width:4;opacity:.45}.corner{transition:transform .22s}.corner circle{fill:#f4efe3;stroke:#263735;stroke-width:4}.corner text{font:700 14px monospace;text-anchor:middle;dominant-baseline:middle;fill:#263735}.cycle{font:clamp(1rem,2.5vw,1.6rem) monospace;word-break:break-word}.moves{display:grid;grid-template-columns:repeat(6,1fr);gap:.3rem}.moves button{border-radius:9px;padding:.5rem}.commutator{display:grid;grid-template-columns:1fr auto 1fr;gap:.4rem;align-items:end}.metrics{display:grid;grid-template-columns:1fr auto;gap:.7rem;align-items:center}.order{font:3rem "Draft Serif",serif}.sequence-log{max-height:120px;overflow:auto;font-family:monospace;color:var(--muted)}
</style></head><body><main class="app"><header class="topbar"><h1>Cube Group from Scratch</h1><span class="kicker">corner permutations before stickers</span></header><div class="workspace"><aside class="sidebar stack"><div class="eyebrow">Face generators</div><div class="moves" id="moves"></div><label>Sequence<input id="sequence" class="mono" placeholder="R U R' U'"></label><div class="row"><button class="primary" id="apply">Apply</button><button id="inverse">Apply inverse</button><button id="reset">Identity</button></div><div class="eyebrow">Commutator [A, B]</div><div class="commutator"><label>A<input id="a" class="mono" value="R"></label><button id="commute">Run</button><label>B<input id="b" class="mono" value="U"></label></div><div class="metrics"><div><div class="eyebrow">Element order</div><div class="order" id="order">1</div></div><div><div class="eyebrow">Parity</div><strong id="parity">even</strong></div></div><p class="muted">This first layer models permutation of the eight corner cubies. Edge pieces and corner orientation are the next algebraic layer.</p></aside><section class="stage"><div class="cube"><svg viewBox="0 0 760 560" id="svg" aria-label="Cube corner permutation"><g id="edges"></g><g id="corners"></g></svg></div><div class="panel stack"><div class="eyebrow">Cycle notation</div><div class="cycle" id="cycles">()</div><div class="sequence-log" id="log"></div></div></section></div></main><script>
const names=['URF','UFL','ULB','UBR','DFR','DLF','DBL','DRB'],coords=[[540,105],[285,105],[175,205],[430,205],[540,350],[285,350],[175,450],[430,450]],cycles={U:[0,3,2,1],R:[0,4,7,3],F:[0,1,5,4],D:[4,5,6,7],L:[1,2,6,5],B:[2,3,7,6]},lines=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]],NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);let state=[0,1,2,3,4,5,6,7],history=[];
function el(n,a={}){const e=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}lines.forEach(([a,b])=>$('edges').append(el('line',{class:'edge',x1:coords[a][0],y1:coords[a][1],x2:coords[b][0],y2:coords[b][1]})));const nodes=names.map((name,i)=>{const g=el('g',{class:'corner'}),c=el('circle',{r:28}),t=el('text');t.textContent=name;g.append(c,t);$('corners').append(g);return g});
function rotate(arr,positions,turns=1){turns=((turns%positions.length)+positions.length)%positions.length;for(let k=0;k<turns;k++){const last=arr[positions.at(-1)];for(let i=positions.length-1;i>0;i--)arr[positions[i]]=arr[positions[i-1]];arr[positions[0]]=last}}
function parse(text){const tokens=text.trim().match(/[URFDLB](?:2|'|’)?/gi)||[];if(tokens.join(' ').replaceAll('’',"'").toUpperCase()!==text.trim().replace(/\s+/g,' ').replaceAll('’',"'").toUpperCase()&&text.trim())throw Error('Use face moves such as R, U2, or F\'.');return tokens.map(t=>t.replace('’',"'").toUpperCase())}
function applyTokens(tokens,record=true){for(const token of tokens){const face=token[0],turns=token.endsWith('2')?2:token.endsWith("'")?3:1;rotate(state,cycles[face],turns)}if(record&&tokens.length)history.push(tokens.join(' '));render()}
function inverseTokens(tokens){return [...tokens].reverse().map(t=>t.endsWith('2')?t:t.endsWith("'")?t[0]:t+"'")}
function permutation(){const p=[];state.forEach((piece,pos)=>p[piece]=pos);return p}function gcd(a,b){while(b)[a,b]=[b,a%b];return a}function lcm(a,b){return a/gcd(a,b)*b}
function cycleInfo(){const p=permutation(),seen=new Set(),groups=[];let order=1,transpositions=0;for(let i=0;i<p.length;i++){if(seen.has(i)||p[i]===i)continue;const group=[];let x=i;while(!seen.has(x)){seen.add(x);group.push(x);x=p[x]}groups.push(group);order=lcm(order,group.length);transpositions+=group.length-1}return{groups,order,parity:transpositions%2?'odd':'even'}}
function render(){state.forEach((piece,pos)=>{nodes[piece].setAttribute('transform',`translate(${coords[pos][0]} ${coords[pos][1]})`)});const info=cycleInfo();$('cycles').textContent=info.groups.length?info.groups.map(g=>'('+g.map(i=>names[i]).join(' ')+')').join(' '):'()';$('order').textContent=info.order;$('parity').textContent=info.parity;$('log').textContent=history.slice(-8).map((x,i)=>`${history.length-Math.min(8,history.length)+i+1}. ${x}`).join('\n')||'No generators applied.'}
for(const face of Object.keys(cycles)){const b=document.createElement('button');b.textContent=face;b.onclick=()=>applyTokens([face]);const p=document.createElement('button');p.textContent=face+"'";p.onclick=()=>applyTokens([face+"'"]);$('moves').append(b,p)}
$('apply').onclick=()=>{try{applyTokens(parse($('sequence').value))}catch(e){alert(e.message)}};$('inverse').onclick=()=>{try{applyTokens(inverseTokens(parse($('sequence').value)))}catch(e){alert(e.message)}};$('reset').onclick=()=>{state=[0,1,2,3,4,5,6,7];history=[];render()};$('commute').onclick=()=>{try{const a=parse($('a').value),b=parse($('b').value);applyTokens([...a,...b,...inverseTokens(a),...inverseTokens(b)])}catch(e){alert(e.message)}};render();
</script></body></html>
