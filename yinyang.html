<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yin Yang</title>
</head>
<body>

    <!-- Container for the SVG -->
    <div id="svg-container"></div>
    
        <!-- Button to download the SVG -->
    <button onclick="downloadSVG()">Download SVG</button>

    <!-- Inline JavaScript -->
    <script>
        // This function creates an SVG element with specified attributes
        // This function creates an SVG element with specified attributes
        function createSVGElement(tagName, attrs, textContent) {
            var defaults = {
                fill: "none",
                stroke: "black",
                "stroke-width": "1"
            };
            
            // Merge defaults with attrs, allowing attrs to override defaults
            var combinedAttrs = Object.assign({}, defaults, attrs);
            
            var el = document.createElementNS('http://www.w3.org/2000/svg', tagName);
            for (var key in combinedAttrs) {
                el.setAttribute(key, combinedAttrs[key]);
            }
            // If textContent is provided, set it
            if (textContent !== undefined) {
                el.textContent = textContent;
            }
            return el;
        }

        deg2Rad = (deg) => deg * Math.PI/180
        rad2Deg = (rad) => rad * 180/Math.PI
        
        function circlePoint(cx,cy,r,deg){
            return [cx+r*Math.cos(deg2Rad(deg)), cy+r*Math.sin(deg2Rad(deg))]
        }
        
        // start_deg < end_deg
        function arc(cx,cy,r,start_deg,end_deg,clockwise=true){
            let [sx,sy] = circlePoint(cx,cy,r,start_deg)
            let [ex,ey] = circlePoint(cx,cy,r,end_deg)
            return ["M", sx,sy, // Move to start point
            "A", r, r, 0, end_deg - start_deg >= 180 ? 1: 0, clockwise ? 1 : 0, ex,ey // Draw the arc
            ].join(" ")
        }
        //3mm acrylic
        let size = 100
        middle = arc(size/2,size*3/4,size/4,90,270)+arc(size/2,size*1/4,size/4,90,270,false);

        // This function initializes the SVG with mm units and adds it to the page
        function initSVG() {
            var svg = createSVGElement('svg', {
                width: `${size}mm`, // Set width in mm
                height: `${size}mm`, // Set height in mm
                viewBox: `-2 -2 ${size+4} ${size+4}` // viewbox coordinates (unitless)
            });

            svg.appendChild(createSVGElement('path',{d:arc(size/2,size/2,size/2,-90,90,false)+middle, fill:'white'}))
            svg.appendChild(createSVGElement('path',{d:arc(size/2,size/2,size/2,-90,90)+middle, fill:'black'}))
            svg.appendChild(createSVGElement('circle',{cx:size/2, cy:size*1/4, r:size/16, fill:'blue'}))
            svg.appendChild(createSVGElement('circle',{cx:size/2, cy:size*3/4, r:size/16, fill:'red'}))

            document.getElementById('svg-container').appendChild(svg);
        }

        // Call the function to initialize and draw the SVG
        initSVG();

        // This function triggers the download of the SVG
        function downloadSVG() {
            var svgEl = document.querySelector('svg');
            var serializer = new XMLSerializer();
            var source = serializer.serializeToString(svgEl);

            // Add namespaces
            if(!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)){
                source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }
            if(!source.match(/^<svg[^>]+"http\:\/\/www\.w3\.org\/1999\/xlink"/)){
                source = source.replace(/^<svg/, '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
            }

            // Add XML declaration
            source = '<?xml version="1.0" standalone="no"?>\r\n' + source;

            // Convert SVG source to URI data scheme
            var url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);

            // Create a download link and trigger the download
            var downloadLink = document.createElement("a");
            downloadLink.href = url;
            downloadLink.download = "amok_foot.svg";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
